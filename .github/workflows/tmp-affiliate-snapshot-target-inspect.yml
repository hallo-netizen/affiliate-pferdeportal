name: TEMP Affiliate Snapshot Target Inspect

on:
  push:
    branches: [affiliate-release-current]
    paths:
      - '.github/workflows/tmp-affiliate-snapshot-target-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Readonly live Schabracken delivery state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
import hashlib, html, json, re, time, urllib.request
base='https://pferde-atelier.de/ausruestung/ausruestung-sattel/schabracken/'
modes=[
 ('normal',base,{}),
 ('repeat',base,{}),
 ('cachebuster',base+'?ppar_probe_20261005=1',{}),
 ('nocache',base+'?ppar_probe_20261005=2',{'Cache-Control':'no-cache','Pragma':'no-cache'}),
]
for name,url,headers in modes:
    req=urllib.request.Request(url,headers={'User-Agent':'PferdeAtelier-Readonly-Probe/1.0',**headers})
    with urllib.request.urlopen(req,timeout=30) as r:
        raw=r.read().decode('utf-8','replace')
        hs=dict(r.headers.items())
        print('===== MODE',name,'STATUS',r.status,'BYTES',len(raw),'SHA',hashlib.sha256(raw.encode()).hexdigest(),'=====')
        for k,v in hs.items():
            if k.lower() in {'date','age','cache-control','x-cache','x-litespeed-cache','x-litespeed-tag','server','vary','cf-cache-status','etag','last-modified'}:
                print('HEADER',k,':',v)
        versions=sorted(set(re.findall(r'affiliate-portal-router/[^"\' >]+[?&]ver=([0-9.]+)',raw,re.I)))
        print('PLUGIN_ASSET_VERSIONS',versions)
        body=re.search(r'<body[^>]+class=["\']([^"\']+)["\']',raw,re.I)
        print('BODY_CLASS',body.group(1) if body else '')
        pats=[
          r'<a[^>]+class=["\'][^"\']*ppar-overview-wide-banner-link[^"\']*["\'][^>]*>.*?</a>',
          r'<a[^>]+class=["\'][^"\']*ppar-category-large-banner-link[^"\']*["\'][^>]*>.*?</a>',
        ]
        hits=[]
        for p in pats: hits.extend(re.findall(p,raw,re.I|re.S))
        print('BANNER_HIT_COUNT',len(hits))
        for i,h in enumerate(hits,1):
            h=re.sub(r'\s+',' ',html.unescape(h))
            href=re.search(r'href=["\']([^"\']+)',h,re.I)
            src=re.search(r'<img[^>]+src=["\']([^"\']+)',h,re.I)
            alt=re.search(r'<img[^>]+alt=["\']([^"\']*)',h,re.I)
            print('BANNER',i,'HREF',href.group(1) if href else '','SRC',src.group(1) if src else '','ALT',alt.group(1) if alt else '')
            print('BANNER_HTML',h[:5000])
        for marker in ['SanoVet','sanovet','Gesunde Pferde','Schabracken Designer','ppar-overview-wide-banner-link','product_after_category_tiles']:
            print('MARKER',marker,raw.lower().find(marker.lower()))
    time.sleep(1)

api='https://pferde-atelier.de/wp-json/wp/v2/pages?slug=schabracken&_fields=id,parent,slug,link,status,title'
with urllib.request.urlopen(api,timeout=30) as r:
    rows=json.load(r)
print('REST_SCHABRACKEN',json.dumps(rows,ensure_ascii=False))
if rows:
    parent=int(rows[0].get('parent') or 0); depth=0
    while parent and depth<10:
        with urllib.request.urlopen(f'https://pferde-atelier.de/wp-json/wp/v2/pages/{parent}?_fields=id,parent,slug,link,status,title',timeout=30) as r:
            p=json.load(r)
        print('REST_PARENT',json.dumps(p,ensure_ascii=False))
        parent=int(p.get('parent') or 0); depth+=1
PY

      - name: OP_CATEGORY_READBACK_20261010 readonly
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import re,urllib.request,json,html
          base='https://pferde-atelier.de'
          pages=[
            '/wissen/wissen-versicherungen-und-recht/pferde-op-versicherung/',
            '/wissen/wissen-versicherungen-und-recht/pferdekrankenversicherung/',
            '/stall/stall-reithalle/',
          ]
          for p in pages:
            for mode,extra in [('normal',{}),('fresh',{'Cache-Control':'no-cache','Pragma':'no-cache'})]:
              try:
                req=urllib.request.Request(base+p+(('?opreadback=20261010' if mode=='fresh' else '')),headers={'User-Agent':'PferdeAtelier-OP-Readonly/1.0',**extra})
                with urllib.request.urlopen(req,timeout=20) as resp:
                  raw=resp.read().decode('utf-8','replace')
                  print('PAGE',p,mode,'HTTP',resp.status,'LEN',len(raw))
                  print('CACHE', {k:v for k,v in resp.headers.items() if k.lower() in ('x-litespeed-cache','cf-cache-status','age','cache-control','server')})
                  for needle in ('noch keine Beitragsarten','Tarife & Kosten','Leistungen & Bedingungen Pferde-OP','Pferdekrankenversicherung vergleichen','Reithallenbau','pftk-v1.50.'):
                    print('MARKER',needle,needle.lower() in raw.lower())
                  for prefix in ('pftk','affiliate-portal-template-kit'):
                    print('ASSETS',prefix,re.findall(r'[^"< ]*'+re.escape(prefix)+r'[^"< ]*[?&]ver=[0-9.]+',raw)[:5])
                  print('OP_CATEGORY_URLS', re.findall(r'href=["\x27]([^"\x27]*pferde-op-versicherung-(?:tarife|leistungen|op-arten|beratung|faq)[^"\x27]*)',raw)[:15])
              except Exception as ex:
                print('PAGE_ERROR',p,mode,type(ex).__name__,str(ex)[:240])
          for slug in ['pferde-op-versicherung','pferdekrankenversicherung','wissen-versicherungen-und-recht']:
            u=base+'/wp-json/wp/v2/pages?slug='+slug+'&_fields=id,parent,slug,link,status,title'
            try:
              with urllib.request.urlopen(u,timeout=18) as resp:
                print('REST_PAGE',slug,resp.status,resp.read(4096).decode('utf-8','replace'))
            except Exception as ex: print('REST_PAGE_ERROR',slug,type(ex).__name__,str(ex)[:240])
          for slug in ['pferde-op-versicherung-faq','pferde-op-versicherung-leistungen','pferdekrankenversicherung-faq']:
            u=base+'/wp-json/wp/v2/categories?slug='+slug+'&_fields=id,parent,slug,name'
            try:
              with urllib.request.urlopen(u,timeout=18) as resp:
                print('REST_TERM',slug,resp.status,resp.read(4096).decode('utf-8','replace'))
            except Exception as ex: print('REST_TERM_ERROR',slug,type(ex).__name__,str(ex)[:240])
          PY

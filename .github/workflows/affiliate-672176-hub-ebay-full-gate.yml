          );
          foreach($cases as $label=>$row){
              $got=$detect->invoke(null,$row[0],$row[1]);
              if (!is_array($got) || ($got['kind']??'')!==$row[2]) { $fail($label.' provider detection'); }
          }
          $amb=$detect->invoke(null,'mixed.txt',"https://www.awin1.com/x\nhttps://t.adcell.com/x\n");
          if (!is_wp_error($amb) || $amb->get_error_code()!=='universal_import_ambiguous') { $fail('ambiguous provider must fail closed'); }
          $unknown=$detect->invoke(null,'unknown.txt',"nichts eindeutig erkennbar\n");
          if (!is_wp_error($unknown) || $unknown->get_error_code()!=='universal_import_unknown') { $fail('unknown provider must fail closed'); }
          $pass('multi-provider detection positive and ambiguous/unknown negative');

          echo "MANUAL_SINGLE_UPLOAD_WORDPRESS_MARIADB_PASS\n";

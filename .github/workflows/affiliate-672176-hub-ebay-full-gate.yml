name: Affiliate Router 6.72.176 Hub Mount and eBay Payload Full Gate
# Exact AF-077 gate on released 6.72.175 baseline; no functional/performance rollback allowed.
# Retry after README newline-only correction.

on:
  push:
    branches: [affiliate-release-current]
    paths:
      - '.github/workflows/affiliate-672176-hub-ebay-full-gate.yml'
      - 'control/release-governance/CURRENT_RELEASE.json'
      - 'AFFILIATE_HOBBYRAUM/test_otto_automation.php'
      - 'AFFILIATE_HOBBYRAUM/test_adcell_awin_otto_unchanged.php'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  combined-contract:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Prepare exact 6.72.176 source binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.')
          container=root/'release/affiliate-zentrale/current'
          plugin=container/'affiliate-portal-router'
          manifest=root/'release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt'
          files=sorted(p for p in plugin.rglob('*') if p.is_file())
          rows=[hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.relative_to(container).as_posix() for p in files]
          if len(rows)!=27: raise SystemExit(f'FAIL source file count {len(rows)} != 27')
          manifest.write_text('\n'.join(rows)+'\n',encoding='utf-8')
          manifest_sha=hashlib.sha256(manifest.read_bytes()).hexdigest()

          p=root/'control/release-governance/CURRENT_RELEASE.json'
          current=json.loads(p.read_text(encoding='utf-8'))
          cand=current['active_candidate']
          cand.update({
              'version':'6.72.176',
              'status':'SOURCE_BOUND_HUB_EBAY_FULL_GATE_RUNNING',
              'release_allowed':False,
              'current_source_manifest_sha256':manifest_sha,
              'source_file_count':27,
              'candidate_reference_artifact_sha256':None,
              'final_artifact_ref':None,
              'final_artifact_sha256':None,
              'handoff_artifact_filename':None,
              'handoff_artifact_bytes':None,
          })
          current['source_authority']['manifest_sha256']=manifest_sha
          for gate in current.get('required_release_gates',{}).values():
              gate['status']='OPEN'
              gate['evidence_ref']=None
              gate['evidence_sha256']=None
              gate['source_manifest_sha256']=manifest_sha
          state=current['execution_state']
          state['state']='SOURCE_BOUND_HUB_EBAY_FULL_GATE_RUNNING'
          state['authorized_next_action']='RUN_BOUND_RELEASE_GATES'
          state['bound_user_scope_action']='Fix real hub1/hub2 hub_after_cards mount and remove later-discarded eBay BUSINESS product-card descriptions from HTML only. Preserve all source data, PRIVATE detail content, non-eBay behavior, 6.72.175 target/slot logic and all earlier performance/function hardlocks.'
          state['completion_condition']='ALL_REQUIRED_GATES_PASS_ON_6_72_176_SOURCE_MANIFEST'
          state['after_completion_action']='BUILD_ONE_6_72_176_INSTALLER_THEN_REAL_WORDPRESS_READBACK'
          state['no_optional_detours']=True
          lock=current.setdefault('user_scope_lock',{})
          lock['current_focus']='HUB_WIDE_MOUNT_EBAY_CARD_PAYLOAD_6_72_176'
          lock['hub_wide_mount_ebay_card_payload']={
              'version':'6.72.176',
              'status':'SOURCE_BOUND_FULL_GATE_RUNNING',
              'baseline':'6.72.175_RELEASED',
              'scope':'HUB_WIDE_SERVER_MOUNT_PLUS_EBAY_BUSINESS_CARD_DESCRIPTION_HTML_ONLY',
              'targeted_simulation_run':'36997037385',
              'performance_hardlock':'NO_ROLLBACK_6_72_170_171_172_173_174_175_NO_FUNCTION_LOSS',
              'next':'RUN_BOUND_RELEASE_GATES'
          }
          current['generation']=max(173,int(current.get('generation',0))+1)
          p.write_text(json.dumps(current,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PREPARED_MANIFEST_SHA256 '+manifest_sha)
          PY
          python3 control/release-governance/release_guard.py governance-check
          python3 control/release-governance/release_guard.py source-check
          grep -F "Version: 6.72.176" release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php
          grep -F "const VERSION = '6.72.176';" release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt control/release-governance/CURRENT_RELEASE.json
          git diff --cached --check
          git commit -m "affiliate: bind 6.72.176 hub/eBay candidate [skip ci]"
          git push origin HEAD:affiliate-release-current

      - name: Bind targeted hub/eBay positive-negative simulation
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 61aa9b2104bf1db75f8fb6aeca982c26cea0e2ce HEAD -- release/affiliate-zentrale/current/affiliate-portal-router
          echo "PASS plugin source unchanged since targeted WordPress/MariaDB simulation run 36997037385"

      - name: Governance and exact 6.72.176 source binding
        shell: bash
        run: |
          set -euo pipefail
          python3 control/release-governance/release_guard.py governance-check
          python3 control/release-governance/release_guard.py source-check
          python3 control/release-governance/release_guard.py start --branch affiliate-release-current
          grep -F "Version: 6.72.176" release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php
          grep -F "const VERSION = '6.72.176';" release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php
          test "$(grep -cve '^[[:space:]]*$' release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt)" = "27"
          sha256sum release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt

      - name: Exact delta versus released 6.72.175
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=32d61bce11161b339a360c4dec92be712f733424
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,hashlib
          BASE='32d61bce11161b339a360c4dec92be712f733424'
          root=Path('release/affiliate-zentrale/current/affiliate-portal-router')
          current={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          prefix='release/affiliate-zentrale/current/affiliate-portal-router/'
          out=subprocess.check_output(['git','ls-tree','-r','--name-only',BASE,prefix.rstrip('/')],text=True).splitlines()
          base={}
          for full in out:
              rel=full[len(prefix):]
              base[rel]=hashlib.sha256(subprocess.check_output(['git','show',f'{BASE}:{full}'])).hexdigest()
          changed=sorted(k for k in set(base)|set(current) if base.get(k)!=current.get(k))
          expected=sorted(['pferdeportal-affiliate-router.php','readme.txt'])
          print('CHANGED',changed)
          if changed!=expected: raise SystemExit(f'FAIL unexpected 6.72.176 delta: {changed}')
          print('PASS exact 6.72.175 -> 6.72.176 bounded hub-mount/eBay-card delta')
          PY

      - name: PHP syntax all current plugin files
        shell: bash
        run: |
          set -euo pipefail
          find release/affiliate-zentrale/current/affiliate-portal-router -type f -name '*.php' -print0 | xargs -0 -n1 php -l | tee /tmp/php-lint.log
          test "$(grep -c '^No syntax errors detected' /tmp/php-lint.log)" = "21"
          echo "PASS php lint 21/21"

      - name: Preserve released performance and functionality hardlocks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,re
          BASE='32d61bce11161b339a360c4dec92be712f733424'
          root=Path('release/affiliate-zentrale/current/affiliate-portal-router')
          def show(rel):
              return subprocess.check_output(['git','show',f'{BASE}:release/affiliate-zentrale/current/affiliate-portal-router/{rel}'],text=True)
          def body(src,name):
              m=re.search(r'function\s+'+re.escape(name)+r'\s*\(',src)
              if not m: raise SystemExit('FAIL missing function '+name)
              start=m.start(); i=src.find('{',start); depth=0; state='code'; esc=False
              while i<len(src):
                  ch=src[i]; n=src[i+1] if i+1<len(src) else ''
                  if state=='sq':
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch=="'": state='code'
                  elif state=='dq':
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch=='"': state='code'
                  elif state=='line':
                      if ch=='\n': state='code'
                  elif state=='block':
                      if ch=='*' and n=='/': state='code'; i+=1
                  else:
                      if ch=="'": state='sq'
                      elif ch=='"': state='dq'
                      elif ch=='/' and n=='/': state='line'; i+=1
                      elif ch=='#': state='line'
                      elif ch=='/' and n=='*': state='block'; i+=1
                      elif ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0: return src[start:i+1]
                  i+=1
              raise SystemExit('FAIL unclosed '+name)

          main=(root/'pferdeportal-affiliate-router.php').read_text()
          base_main=show('pferdeportal-affiliate-router.php')
          cur_mount=body(main,'auto_inject_template_affiliate_slots')
          base_mount=body(base_main,'auto_inject_template_affiliate_slots')
          cur_render=body(main,'render_banner')
          base_render=body(base_main,'render_banner')
          stripped=main.replace(cur_mount,'',1).replace(cur_render,'',1).replace('6.72.176','6.72.175')
          base_stripped=base_main.replace(base_mount,'',1).replace(base_render,'',1)
          if stripped!=base_stripped:
              raise SystemExit('FAIL main router changed outside version + mount/render functions')

          for token in [
              'design_auto_layout_protected_with_hub_wide_slot',
              'data-ppar-slot="hub_after_cards"',
              "preg_match('/^(?:category|hub)_product_[123]$/'",
              "$network === 'ebay'",
              "$description = '';",
          ]:
              if token not in main: raise SystemExit('FAIL missing 6.72.176 rootfix token '+token)

          readme=(root/'readme.txt').read_text()
          first,rest=readme.split('\n',1)
          if not first.startswith('V6.72.176 HUB-WIDE-MOUNT + EBAY-CARD-PAYLOAD-ROOTFIX:') or rest!=show('readme.txt'):
              raise SystemExit('FAIL readme changed beyond 6.72.176 release line')

          allowed={'pferdeportal-affiliate-router.php','readme.txt'}
          for p in root.rglob('*'):
              if not p.is_file(): continue
              rel=p.relative_to(root).as_posix()
              if rel in allowed: continue
              base=subprocess.check_output(['git','show',f'{BASE}:release/affiliate-zentrale/current/affiliate-portal-router/{rel}'])
              if p.read_bytes()!=base: raise SystemExit('FAIL protected file changed '+rel)

          protected=[
              ('pferdeportal-affiliate-router.php','category_product_shared_rank_base_request_cache'),
              ('pferdeportal-affiliate-router.php','select_category_product_campaign_fast_v672171'),
              ('includes/trait-ppar-automation-suite.php','automation_exact_target_rank_request_cache'),
              ('includes/trait-ppar-ebay.php','ebay_product_cohort_request_cache'),
              ('includes/trait-ppar-ebay.php','ebay_business_campaign_source_allowed_request_cache'),
              ('includes/trait-ppar-idealo.php','multiprovider_exact_gtin_pool_request_cache'),
          ]
          for rel,token in protected:
              if token not in (root/rel).read_text(): raise SystemExit('FAIL protected performance token missing '+token)
          if 'source_payload LIKE' in (root/'includes/trait-ppar-ebay.php').read_text():
              raise SystemExit('FAIL unindexed eBay payload scan returned')
          print('PASS all non-rootfix plugin files byte-identical to released 6.72.175')
          print('PASS main delta isolated to hub mount + render_banner + version')
          print('PASS all 6.72.170-6.72.175 performance/function hardlocks preserved')
          PY

      - name: Existing provider and banner regressions
        shell: bash
        run: |
          set -euo pipefail
          bash AFFILIATE_HOBBYRAUM/run_otto_checks.sh
          php AFFILIATE_HOBBYRAUM/test_adcell_awin_otto_unchanged.php
          php AFFILIATE_HOBBYRAUM/test_banner_distribution_behavior.php

      - name: Install exact WordPress 7.1.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-site
          mkdir -p /tmp/wp-site
          /tmp/wp core download --path=/tmp/wp-site --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title='Affiliate 6.72.170 Full Gate' --admin_user=admin --admin_password='ci-password-123!' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp-site/wp-content/mu-plugins
          cat >/tmp/wp-site/wp-content/mu-plugins/ppar-hivepress-fixture.php <<'PHP'
          <?php
          add_action('init', static function(){
              if (!post_type_exists('hp_listing')) {
                  register_post_type('hp_listing', array('public'=>true,'label'=>'Listings'));
              }
              if (!taxonomy_exists('hp_listing_category')) {
                  register_taxonomy('hp_listing_category', array('hp_listing'), array('public'=>true,'hierarchical'=>true,'label'=>'Listing categories'));
              }
          }, 1);
          PHP

      - name: AF-077 real WordPress positive-negative gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-site
          /tmp/wp eval 'if (!class_exists("Pferdeportal_Affiliate_Router") || Pferdeportal_Affiliate_Router::VERSION !== "6.72.176") { exit(2); } echo "AF077_PLUGIN_ACTIVE_PASS\n";' --path=/tmp/wp-site
          cat >/tmp/af077-common.php <<'PHP'
          <?php
          function af077_router_portal(){
              $o=Pferdeportal_Affiliate_Router::instance();
              $portals=$o->output_portal_registry();
              foreach((array)$portals as $p){if(is_array($p)&&($p['adapter']??'')==='wordpress_local'&&!empty($p['enabled']))return [$o,$p];}
              throw new RuntimeException('local portal missing');
          }
          function af077_row($title,$salt){
              return [
                  'identity_hash'=>hash('sha256',$salt),
                  'provider'=>'manual','partner_external_id'=>'af077-test',
                  'source_status'=>'active','availability_state'=>'active',
                  'tracking_url'=>'https://example.test/click/'.$salt,
                  'image_url'=>'https://example.test/banner-'.$salt.'.jpg',
                  'width'=>1200,'height'=>150,
                  'payload'=>wp_json_encode(['_dimension_state'=>'verified']),
                  'title'=>$title,'description'=>'','tags'=>'',
                  'destination_url'=>'https://partner.example/'.sanitize_title($title),
              ];
          }
          function af077_classify($o,$row,$portal){
              $m=new ReflectionMethod($o,'output_classify_for_portal');$m->setAccessible(true);
              return $m->invoke($o,$row,$portal,'portal_banner');
          }
          PHP

          cat >/tmp/af077-seed.php <<'PHP'
          <?php
          $existing=get_page_by_path('schabracken',OBJECT,'page');
          if($existing){wp_delete_post($existing->ID,true);}
          $term=get_term_by('slug','schabracken','category');
          if($term){wp_delete_term($term->term_id,'category');}
          $id=wp_insert_post(['post_type'=>'page','post_status'=>'publish','post_title'=>'Schabracken','post_name'=>'schabracken']);
          if(!$id||is_wp_error($id))throw new RuntimeException('schabracken page failed');
          update_option('ppar_af077_page',$id,false);
          echo "AF077_SEED_PASS\n";
          PHP
          /tmp/wp eval-file /tmp/af077-seed.php --path=/tmp/wp-site

          cat >/tmp/af077-positive.php <<'PHP'
          <?php require '/tmp/af077-common.php';
          [$o,$portal]=af077_router_portal();
          $res=af077_classify($o,af077_row('Schabrackendesigner','positive'),$portal);
          $id=absint(get_option('ppar_af077_page'));
          if(!is_array($res)||($res['status']??'')!=='ready'||absint($res['target']['id']??0)!==$id){
              throw new RuntimeException('positive failed '.wp_json_encode($res));
          }
          echo "AF077_SCHABRACKENDESIGNER_READY_PASS\n";
          PHP
          /tmp/wp eval-file /tmp/af077-positive.php --path=/tmp/wp-site | tee /tmp/af077-positive.txt
          grep -F 'AF077_SCHABRACKENDESIGNER_READY_PASS' /tmp/af077-positive.txt

          cat >/tmp/af077-negative.php <<'PHP'
          <?php require '/tmp/af077-common.php';
          [$o,$portal]=af077_router_portal();
          $res=af077_classify($o,af077_row('Hund Schabrackendesigner','negative'),$portal);
          if(!is_array($res)||($res['status']??'')!=='blocked'||($res['source']??'')!=='creative_negative'){
              throw new RuntimeException('negative signal weakened '.wp_json_encode($res));
          }
          echo "AF077_NEGATIVE_SIGNAL_BLOCK_PASS\n";
          PHP
          /tmp/wp eval-file /tmp/af077-negative.php --path=/tmp/wp-site | tee /tmp/af077-negative.txt
          grep -F 'AF077_NEGATIVE_SIGNAL_BLOCK_PASS' /tmp/af077-negative.txt

          cat >/tmp/af077-ambiguity.php <<'PHP'
          <?php require '/tmp/af077-common.php';
          if(!get_term_by('slug','schabracken','category')){
              $t=wp_insert_term('Schabracken','category',['slug'=>'schabracken']);
              if(is_wp_error($t))throw new RuntimeException($t->get_error_message());
          }
          [$o,$portal]=af077_router_portal();
          $res=af077_classify($o,af077_row('Schabrackendesigner','ambiguous'),$portal);
          if(!is_array($res)||($res['status']??'')==='ready'){
              throw new RuntimeException('ambiguity fail-open '.wp_json_encode($res));
          }
          echo "AF077_AMBIGUITY_FAIL_CLOSED_PASS\n";
          PHP
          /tmp/wp eval-file /tmp/af077-ambiguity.php --path=/tmp/wp-site | tee /tmp/af077-ambiguity.txt
          grep -F 'AF077_AMBIGUITY_FAIL_CLOSED_PASS' /tmp/af077-ambiguity.txt

          cat >/tmp/af077-veto.php <<'PHP'
          <?php require '/tmp/af077-common.php';
          $t=get_term_by('slug','schabracken','category'); if($t)wp_delete_term($t->term_id,'category');
          [$o,$portal]=af077_router_portal();
          $id=absint(get_option('ppar_af077_page')); $key='page:'.$id;
          $m=new ReflectionMethod($o,'control_set_decision');$m->setAccessible(true);
          $saved=$m->invoke($o,(string)$portal['key'],'target',$key,'veto','AF077 test veto',[],'af077_test');
          if(is_wp_error($saved))throw new RuntimeException($saved->get_error_message());
          $res=af077_classify($o,af077_row('Schabrackendesigner','veto'),$portal);
          if(!is_array($res)||($res['status']??'')==='ready'){
              throw new RuntimeException('target veto bypassed '.wp_json_encode($res));
          }
          echo "AF077_TARGET_VETO_PASS\n";
          PHP
          /tmp/wp eval-file /tmp/af077-veto.php --path=/tmp/wp-site | tee /tmp/af077-veto.txt
          grep -F 'AF077_TARGET_VETO_PASS' /tmp/af077-veto.txt
          echo "AF077_WORDPRESS_MARIADB_POSITIVE_NEGATIVE_PASS"

      - name: Build query-regression fixture
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/query-fixture.php <<'PHP'
          <?php
          if (!class_exists('Pferdeportal_Affiliate_Router')) { fwrite(STDERR,"FAIL plugin class missing\n"); exit(2); }
          if (!post_type_exists('hp_listing')) { register_post_type('hp_listing', array('public'=>true)); }
          if (!taxonomy_exists('hp_listing_category')) { register_taxonomy('hp_listing_category',array('hp_listing'),array('public'=>true,'hierarchical'=>true)); }
          $ensure_term = static function($name,$slug,$parent=0){
              $existing=get_term_by('slug',$slug,'hp_listing_category');
              if (is_object($existing)) return (int)$existing->term_id;
              $r=wp_insert_term($name,'hp_listing_category',array('slug'=>$slug,'parent'=>$parent));
              if (is_wp_error($r)) { fwrite(STDERR,"FAIL term ".$slug.": ".$r->get_error_message()."\n"); exit(2); }
              return (int)$r['term_id'];
          };
          $private=$ensure_term('Private Anzeigen','private-anzeigen');
          $child=$ensure_term('Private Kind','private-kind',$private);
          $other=$ensure_term('Andere Kategorie','andere-kategorie');

          $o=Pferdeportal_Affiliate_Router::instance();
          $snap=static function($q){
              return array(
                  'post_type'=>$q->get('post_type'),
                  'taxonomy'=>$q->get('taxonomy'),
                  'term'=>$q->get('term'),
                  'term_id'=>$q->get('term_id'),
                  'hp_listing_category'=>$q->get('hp_listing_category'),
                  'tax_query'=>$q->get('tax_query'),
                  'meta_query'=>$q->get('meta_query'),
                  'posts_per_page'=>$q->get('posts_per_page'),
                  'posts_per_archive_page'=>$q->get('posts_per_archive_page'),
                  'private_limit'=>$q->get('_ppar_ebay_private_public_limit'),
                  'ceiling'=>$q->get('_ppar_ebay_visibility_ceiling'),
                  'paged'=>$q->get('paged'),
                  'no_found_rows'=>$q->get('no_found_rows'),
              );
          };
          $make=static function($vars){
              $q=new WP_Query();
              foreach($vars as $k=>$v){ $q->set($k,$v); }
              return $q;
          };
          $run=static function($vars) use($make,$o,$snap){
              $q=$make($vars);
              $o->ebay_expand_private_parent_listing_query($q);
              $o->ebay_enforce_private_visibility_ceiling($q);
              return $snap($q);
          };
          $cases=array(
              'ordinary_page'=>$run(array('post_type'=>'page')),
              'ordinary_post'=>$run(array('post_type'=>'post')),
              'unrelated_taxonomy'=>$run(array('taxonomy'=>'category','term'=>'news')),
              'listing_general'=>$run(array('post_type'=>'hp_listing')),
              'private_parent'=>$run(array('post_type'=>'hp_listing','hp_listing_category'=>'private-anzeigen')),
              'private_child'=>$run(array('post_type'=>'hp_listing','hp_listing_category'=>'private-kind')),
              'other_listing_category'=>$run(array('post_type'=>'hp_listing','hp_listing_category'=>'andere-kategorie')),
              'listing_single'=>$run(array('post_type'=>'hp_listing','p'=>123)),

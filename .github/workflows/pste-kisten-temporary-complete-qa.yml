name: PSTE temporary complete parkhouse QA
on:
  push:
    branches: [fix/pste-kisten-einmalige-pruefung-20261107]
permissions:
  contents: read
jobs:
  parkhaus-source-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test one existing MINI export with ALL read-only parkhouse sources
        run: |
          set -euo pipefail
          D=protocol/PROJECT_MEMORY/PROJEKTE/PFERDE_ATELIER/PLUGINS/QA_ONLY
          python3 "$D/apply_existing_mini_kisten_import.py" /tmp/pste-qa
          php -l /tmp/pste-qa/class-pste-mini-workflow.php
          php "$D/test_existing_mini_import.php" /tmp/pste-qa/class-pste-mini-workflow.php
          php "$D/test_existing_pserc_plan.php" /tmp/pste-qa/class-pste-mini-workflow.php
          php "$D/test_complete_parkhaus.php" /tmp/pste-qa/class-pste-mini-workflow.php
          php "$D/test_pste_kisten_transfer_v1.php"
          unzip -q /tmp/pste-qa/PSTE-KISTEN-GESAMT-QA-NICHT-INSTALLIEREN.zip -d /tmp/pste-full
          find "/tmp/pste-full/Portal SEO Topic Engine" -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/lints.txt
          echo "PHP_TOTAL=$(wc -l </tmp/lints.txt)"
          echo "NO_INSTALLATION"

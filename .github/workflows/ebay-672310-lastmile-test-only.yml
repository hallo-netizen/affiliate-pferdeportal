name: eBay 6.72.310 last-mile test-only QA
on:
  push:
    branches: [affiliate-release-current]
    paths:
      - 'release/affiliate-zentrale/evidence/EBAY_672308_TO_672310_GESAMTURSACHENPATCH_NUR_TEST.patch'
      - '.github/workflows/ebay-672310-lastmile-test-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-public-source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replay only the new final-public-source hunk onto the available older reference trait
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil,re
          raw=Path('release/affiliate-zentrale/evidence/EBAY_672308_TO_672310_GESAMTURSACHENPATCH_NUR_TEST.patch').read_text()
          path='affiliate-portal-router/includes/trait-ppar-ebay-run.php'
          chunk=raw.split('diff --git a/'+path+' b/'+path,1)[1].split('\ndiff --git ',1)[0]
          hunks=re.split(r'(?=^@@ )',chunk,flags=re.M)
          good=[x for x in hunks if x.startswith('@@ ') and 'private function ebay_run_public_source_refresh_tick' in x]
          completed=[x for x in hunks if x.startswith('@@ ') and 'private function ebay_run_complete' in x]
          repair=[x for x in hunks if x.startswith('@@ ') and "array('source_stale','source_hash_mismatch')" in x]
          assert len(good)==1 and len(completed)==1 and len(repair)==1, 'Final refresh, source-hash repair and warning completion must be tested together'
          hunk=good[0]
          assert 'private function ebay_run_tick_public_verify' in hunk
          assert 'if(!$this->ebay_run_public_source_refresh_tick($run,$settings))' in hunk
          assert "MINUTE_IN_SECONDS" in hunk and "ebay_refresh_process_row" in hunk
          assert "$remotes>=2" in hunk and "$checked<100" in hunk
          checks=0
          for line in hunk.splitlines()[1:]:
              if line.startswith('-') and not line.startswith('---'): raise AssertionError('Existing public core removed')
              checks+=1
          root=Path('/tmp/ebay310_qa')
          src=Path('release/affiliate-zentrale/current')/path
          dst=root/path
          dst.parent.mkdir(parents=True,exist_ok=True)
          shutil.copy(src,dst)
          (root/'lastmile.patch').write_text('diff --git a/'+path+' b/'+path+'\n--- a/'+path+'\n+++ b/'+path+'\n'+completed[0]+repair[0]+hunk)
          print('PASS: ONE EXISTING PUBLIC GATE, NO SECOND WORKER, NO POLICY BYPASS, PHYSICAL PATCH CHECK')
          PY
          cd /tmp/ebay310_qa
          git apply --check lastmile.patch
          git apply lastmile.patch
          php -l affiliate-portal-router/includes/trait-ppar-ebay-run.php
      - name: Actual BUSINESS frontend output gate (freshness, checkpoint, policy, no new DB calls)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,shutil
          patch=Path('release/affiliate-zentrale/evidence/EBAY_672308_TO_672310_GESAMTURSACHENPATCH_NUR_TEST.patch').read_text()
          target='affiliate-portal-router/includes/trait-ppar-ebay.php'
          section=patch.split('diff --git a/'+target+' b/'+target,1)[1].split('\ndiff --git ',1)[0]
          hunks=re.split(r'(?=^@@ )',section,flags=re.M)
          selected=[h for h in hunks if h.startswith('@@ ') and ('route_state,fresh_until,item_end_at' in h or "absint($row['fresh_until'] ?? 0) <= time()" in h)]
          assert len(selected)==3, 'Three source-to-card freshness edits required'
          root=Path('/tmp/ebay310_frontend')
          dst=root/target
          dst.parent.mkdir(parents=True,exist_ok=True)
          shutil.copy(Path('release/affiliate-zentrale/current')/target,dst)
          (root/'freshness.patch').write_text('diff --git a/'+target+' b/'+target+'\n--- a/'+target+'\n+++ b/'+target+'\n'+''.join(selected))
          shutil.copy('release/affiliate-zentrale/evidence/ebay_672310_frontend_delivery_test.php',root/'test.php')
          PY
          cd /tmp/ebay310_frontend
          git apply --check freshness.patch
          git apply freshness.patch
          php -l affiliate-portal-router/includes/trait-ppar-ebay.php
          php -l test.php
          php test.php | tee test.log
          test "$(grep -c '^PASS ' test.log)" = 12
          grep -F 'EBAY_FRONTEND_SOURCE_CONTRACT 12/12 PASS' test.log

      - name: Exercise the actual parsed PHP last-mile code against mocked WordPress source rows
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ebay310_qa/test.php <<'PHP'
          <?php
          error_reporting(E_ALL);
          define('ABSPATH','/'); define('MINUTE_IN_SECONDS',60); define('ARRAY_A','ARRAY_A');
          $METAS=array();
          function absint($x){return abs((int)$x);}
          function sanitize_text_field($x){return trim((string)$x);}
          function sanitize_key($x){return strtolower(preg_replace('/[^a-z0-9_-]/','',strtolower((string)$x)));}
          function wp_json_encode($x){return json_encode($x);}
          function get_post_meta($id,$key,$single=true){global $METAS;return $METAS[$id][$key]??'';}
          function is_wp_error($x){return $x instanceof WP_Error;}
          class WP_Error{private $c;function __construct($c){$this->c=$c;}function get_error_code(){return $this->c;}}
          class MockDB{
              public $last_error='';public $items=array();
              function prepare($s,$v){return str_replace('%s',"'".addslashes((string)$v)."'",$s);}
              function get_row($s,$mode){foreach($this->items as $r){
                  if(strpos($s,"seller_account_type='BUSINESS'")!==false
                      &&strpos($s,"creative_identity_hash='".($r['creative_identity_hash']??'')."'")!==false
                      &&($r['seller_account_type']??'')==='BUSINESS')return $r;
                  if(strpos($s,"seller_account_type='INDIVIDUAL'")!==false
                      &&strpos($s,"item_id='".($r['item_id']??'')."'")!==false
                      &&($r['seller_account_type']??'')==='INDIVIDUAL')return $r;
              }return null;}
          }
          require 'affiliate-portal-router/includes/trait-ppar-ebay-run.php';
          class TestRun{
              use PPAR_Ebay_Run_Trait;
              public $run=array();public $remote=0;public $fail_code='';public $provider_error=false;public $last_good_safe=false;public $private_repairs=0;public $checkpoint_writes=0;public $private_gate_result=array('status'=>'pass','public'=>1,'invalid'=>array());
              private function ebay_run_load(){return $this->run;}
              private function ebay_run_save($v){$this->run=$v;return $v;}
              private function ebay_run_fail($c,$m,$d=array()){$this->fail_code=$c;return false;}
              private function ebay_access_token($s){return 'TEST_TOKEN';}
              private function ebay_items_table(){return 'test_items';}
              private function ebay_public_checkpoint_load(){return $this->last_good_safe?array('checkpoint_id'=>'last-good'):array();}
              private function ebay_public_checkpoint_is_safe($c){return !empty($c['checkpoint_id']);}
              private function ebay_refresh_process_row(&$job,$row,$s,$token){
                  global $wpdb;
                  $this->remote++;
                  if($this->provider_error){
                      $job['summary']['errors'][]=array('code'=>'ebay_refresh_transport');
                      $job['summary']['transient_errors']++;
                      return;
                  }
                  $wpdb->items[$row['id']]['fresh_until']=time()+6*3600;
                  $job['summary']['updated']++;
              }
              private function ebay_selection_request($reason,$owner,$force,$scope){$this->private_repairs++;return array('status'=>'running','owner'=>'test-owner');}
              private function ebay_run_public_business_coverage($ids=null){return array('required'=>1,'covered'=>1,'missing'=>array(),'counts'=>array('sattel'=>1),'invalid'=>array());}
              private function ebay_run_verify_private_public($s,$ids=null){return $this->private_gate_result;}
              private function ebay_run_commit_public_checkpoint($r,$b,$p){$this->checkpoint_writes++;return array('checkpoint_id'=>'new');}
              public function public_verify($settings){return $this->ebay_run_tick_public_verify($this->run,$settings);}
              public function can_repair($invalid){return $this->ebay_run_private_public_freshness_only_failure(array('error_code'=>'private_public_gate_failed','invalid'=>$invalid));}
              public function repair($invalid){return $this->ebay_run_reopen_private_after_public_freshness_churn($this->run,array('error_code'=>'private_public_gate_failed','invalid'=>$invalid),'public_lastmile_hash_churn');}
              public function check($settings){return $this->ebay_run_public_source_refresh_tick($this->run,$settings);}
          }
          function ok($assert,$label){if(!$assert){fwrite(STDERR,"FAIL ".$label."\n");exit(1);}echo "PASS ".$label."\n";}
          function seed($bfresh,$pfresh){
              global $wpdb,$METAS;
              $wpdb=new MockDB();
              $METAS=array(101=>array('_ppar_creative_identity_hash'=>str_repeat('a',64)),
                  202=>array('_ppar_ebay_item_id'=>'ebay-private-one'));
              $wpdb->items[1]=array('id'=>1,'item_id'=>'ebay-business-one','creative_identity_hash'=>str_repeat('a',64),
                  'seller_account_type'=>'BUSINESS','source_state'=>'available','policy_state'=>'allowed',
                  'status'=>'active','fresh_until'=>$bfresh);
              $wpdb->items[2]=array('id'=>2,'item_id'=>'ebay-private-one','creative_identity_hash'=>str_repeat('b',64),
                  'seller_account_type'=>'INDIVIDUAL','source_state'=>'available','policy_state'=>'allowed',
                  'status'=>'active','fresh_until'=>$pfresh);
              $r=new TestRun();
              $r->run=array('progress_seq'=>0,'checkpoint_candidate'=>array('business_campaign_ids'=>array(101),
                    'private_listing_ids'=>array(202)));
              return $r;
          }
          $both=array('business_enabled'=>1,'private_enabled'=>1);
          $r=seed(time()+100,time()+20000);
          ok($r->check($both)===true,'stale BUSINESS refreshed within same public phase');
          ok($r->remote===1,'fresh PRIVATE not refetched');
          ok($r->run['public_source_refresh']['complete']===1,'preflight persisted and complete');
          ok($r->run['progress_seq']===1,'one durable canonical worker progress step');
          ok($r->check($both)===true&&$r->remote===1,'same verified preflight not duplicated');
          $r=seed(time()+20000,time()+100);
          ok($r->check($both)===true&&$r->remote===1,'stale PRIVATE refreshed, BUSINESS left fresh');
          $r=seed(time()+20000,time()+20000);
          ok($r->check($both)===true&&$r->remote===0,'already fresh candidates require zero API calls');
          $r=seed(time()+100,time()+100);$r->provider_error=true;
          ok($r->check($both)===false&&$r->fail_code==='','transient getItem does not fail entire run');
          ok(($r->run['public_source_refresh']['retry_attempts']??0)===1,'first retry saved on original candidate');
          ok($r->check($both)===false&&($r->run['public_source_refresh']['retry_attempts']??0)===2,
             'second retry resumes same durable cursor');
          ok($r->check($both)===false&&$r->fail_code==='public_source_refresh_provider_failed',
             'without last-good checkpoint exhausted getItem fails closed');
          $r=seed(time()+100,time()+100);$r->provider_error=true;$r->last_good_safe=true;
          ok($r->check($both)===false&&$r->check($both)===false&&$r->check($both)===false,
             'transient getItem retry exhausted with last-good does not approve new checkpoint');
          ok(($r->run['status']??'')==='completed'&&($r->run['completed_with_skips']??0)===1,
             'last-good deferral ends canonical run with explicit incomplete warning');
          ok(($r->run['checkpoint_deferred']??0)===1&&$r->fail_code==='',
             'last-good remains effective instead of terminal whole-run failure');
          ok(($r->run['completion_warning']??'')==='public_source_refresh_unverified',
             'warning reason recorded and cannot become green success');
          $r=seed(time()+100,time()+100);
          ok($r->check(array('business_enabled'=>1,'private_enabled'=>0))===true&&$r->remote===1,
             'disabled PRIVATE route performs no refresh');
          $r=seed(time()+100,time()+100);
          ok($r->check(array('business_enabled'=>0,'private_enabled'=>1))===true&&$r->remote===1,
             'disabled BUSINESS route performs no refresh');
          $r=seed(time()+100,time()+20000);
          $r->run['public_source_refresh']=array('fingerprint'=>hash('sha256',json_encode(array(array(101),array(202)))),
             'cursor'=>2,'complete'=>1,'completed_at'=>time()-30*60);
          ok($r->check($both)===true&&$r->remote===1,'expired final preflight reopens before publish');
          $r=seed(time()+100,time()+20000);global $wpdb;unset($wpdb->items[1]);
          ok($r->check($both)===false&&$r->fail_code==='public_source_refresh_source_unavailable',
              'missing saved source cannot become a green public result');
          $r=seed(time()+100,time()+100);
          global $wpdb,$METAS;
          for($i=102;$i<=105;$i++){
              $hash=str_repeat(dechex($i-100),64);
              $METAS[$i]=array('_ppar_creative_identity_hash'=>$hash);
              $wpdb->items[$i]=array('id'=>$i,'item_id'=>'ebay-business-'.$i,
                  'creative_identity_hash'=>$hash,'seller_account_type'=>'BUSINESS',
                  'source_state'=>'available','policy_state'=>'allowed',
                  'status'=>'active','fresh_until'=>time()+100);
          }
          $r->run['checkpoint_candidate']['business_campaign_ids']=array(101,102,103,104,105);
          ok($r->check($both)===false&&$r->remote===2,'six stale candidates do not overload first worker tick');
          ok($r->run['public_source_refresh']['cursor']===2,'bounded first-tick cursor durable');
          ok($r->check($both)===false&&$r->remote===4,'second worker tick continues without restart');
          ok($r->check($both)===true&&$r->remote===6,'third tick completes six same-run refreshes');
          $r=seed(time()+20000,time()+20000);
          ok($r->can_repair(array(202=>'source_hash_mismatch'))===true,
             'PRIVATE getItem source-hash change is eligible for existing repair');
          ok($r->can_repair(array(202=>'source_stale',203=>'source_hash_mismatch'))===true,
             'mixed stale and hash-changed PRIVATE listings use same bounded repair');
          ok($r->can_repair(array(202=>'manual_block'))===false,
             'hard policy/manual blocks must never enter freshness repair');
          $r->run['schema']='1.0';$r->run['status']='running';$r->run['phase']='public_verify';
          $r->run['run_uuid']='test-same-run';$r->run['config_snapshot']=array('seller_routes'=>array('private'=>true,'business'=>true));
          $r->run['checkpoint_candidate']['business_campaign_ids']=array(101);
          ok($r->repair(array(202=>'source_hash_mismatch'))===true,
             'actual canonical repair reopens existing PRIVATE selector');
          ok($r->private_repairs===1&&$r->run['phase']==='selection_prepare',
             'PRIVATE repair remains in same run and uses existing selection phase');
          ok(($r->run['checkpoint_candidate']['business_campaign_ids']??array())===array(101),
             'PRIVATE repair cannot erase business public candidates');
          $r->run['status']='running';$r->run['phase']='public_verify';
          ok($r->repair(array(202=>'source_hash_mismatch'))===true&&$r->private_repairs===2,
             'second source-hash repair allowed but bounded');
          $r->run['status']='running';$r->run['phase']='public_verify';
          ok($r->repair(array(202=>'source_hash_mismatch'))===false&&$r->private_repairs===2,
             'third source-hash retry denied fail-closed');
          $r=seed(time()+20000,time()+20000);
          $r->run['schema']='1.0';$r->run['status']='running';$r->run['phase']='public_verify';
          $r->run['run_uuid']='integration-same-run';$r->run['config_snapshot']=array('seller_routes'=>array('private'=>true,'business'=>true));
          $r->private_gate_result=array('status'=>'failed','error_code'=>'private_public_gate_failed',
             'invalid'=>array(202=>'source_hash_mismatch'),'public'=>1);
          $r->public_verify($both);
          ok($r->run['phase']==='selection_prepare'&&$r->private_repairs===1,
             'actual PUBLIC VERIFY resumes PRIVATE selection after getItem hash churn');
          ok($r->checkpoint_writes===0,'no new checkpoint committed before hash repair');
          ok($r->run['checkpoint_candidate']['business_campaign_ids']===array(101),
             'public verify hash repair retains selected BUSINESS candidates');
          $r=seed(time()+20000,time()+20000);
          $r->run['schema']='1.0';$r->run['status']='running';$r->run['phase']='public_verify';
          $r->run['run_uuid']='integration-veto';$r->run['config_snapshot']=array('seller_routes'=>array('private'=>true,'business'=>true));
          $r->private_gate_result=array('status'=>'failed','error_code'=>'private_public_gate_failed',
             'invalid'=>array(202=>'manual_block'),'public'=>1);
          $r->public_verify($both);
          ok($r->fail_code==='private_public_gate_failed'&&$r->private_repairs===0&&$r->checkpoint_writes===0,
             'actual PUBLIC VERIFY rejects hard private veto without revalidation bypass');
          echo "EBAY_LASTMILE_ISOLATED_GATE 35/35 PASS; FULL ORIGINAL+WP+EBAY E2E NOT CLAIMED\n";
          PHP
          cd /tmp/ebay310_qa
          php -l test.php
          php test.php | tee /tmp/ebay-672310-lastmile.log
          test "$(grep -c '^PASS ' /tmp/ebay-672310-lastmile.log)" = 35
          grep -F 'EBAY_LASTMILE_ISOLATED_GATE 35/35 PASS' /tmp/ebay-672310-lastmile.log

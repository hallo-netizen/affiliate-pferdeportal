name: Category Integration Template Source Readonly

on:
  push:
    branches:
      - category-integration-template-source-readonly-20260923

permissions:
  contents: read

jobs:
  fetch-current-template-asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact installed public asset path read-only
        shell: bash
        run: |
          set -u
          mkdir -p out
          URL='https://pferde-atelier.de/wp-content/plugins/affiliate-portal-template-kit/assets/breadcrumb-portal-map-v150310.json'
          printf '%s\n' "$URL" > out/url.txt
          STATUS="$(curl -A 'Mozilla/5.0' -L --silent --show-error --connect-timeout 15 --max-time 45 -D out/headers.txt -o out/breadcrumb-portal-map-v150310.json -w '%{http_code}' "$URL" || true)"
          printf '%s\n' "$STATUS" > out/http_status.txt
          echo "HTTP_STATUS=$STATUS"
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          status=Path('out/http_status.txt').read_text().strip()
          p=Path('out/breadcrumb-portal-map-v150310.json')
          if status != '200' or not p.is_file():
              result={'status':'HTTP_BLOCKED','http_status':status}
          else:
              raw=p.read_bytes()
              result={'status':'FETCHED','sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
              try:
                  obj=json.loads(raw.decode('utf-8'))
                  cats=obj.get('categories')
                  result.update({
                      'json_valid':True,
                      'contract':obj.get('contract'),
                      'source':obj.get('source'),
                      'source_sha256':obj.get('source_sha256'),
                      'category_count':obj.get('category_count'),
                      'categories_actual_count':len(cats) if isinstance(cats,(list,dict)) else None,
                      'top_keys':list(obj.keys()) if isinstance(obj,dict) else None,
                  })
              except Exception as exc:
                  result.update({'json_valid':False,'parse_error':str(exc)})
          Path('out/summary.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,sort_keys=True))
          PY

      - name: Inspect exact 25 category derivations read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          map_path=Path('out/breadcrumb-portal-map-v150310.json')
          tsv_path=Path('CATEGORY_INTEGRATION_HOBBYRAUM/PFERDEPORTAL_KATEGORIEN/KATEGORIEN.tsv')
          portal_path=Path('release/affiliate-zentrale/current/affiliate-portal-router/assets/portal-structure-v279.json')
          m=json.loads(map_path.read_text(encoding='utf-8'))
          portal=json.loads(portal_path.read_text(encoding='utf-8'))

          families={
              'pferdesaettel':['faq','beratung','vergleich','pflege','kosten'],
              'trensen':['faq','beratung','vergleich','pflege','kosten'],
              'offenstallbau':['faq','beratung','vergleich','installation','kosten'],
              'paddockbau':['faq','beratung','vergleich','installation','kosten'],
              'reitplatzbau':['faq','beratung','vergleich','installation','kosten'],
          }
          targets=[f'{fam}-{typ}' for fam,types in families.items() for typ in types]
          rows=[]
          for i,line in enumerate(tsv_path.read_text(encoding='utf-8').splitlines()):
              if i==0 or not line.strip(): continue
              cols=line.split('\t')
              row={'term_id':int(cols[0]),'slug':cols[1],'name':cols[2],'parent_slug':cols[3] if len(cols)>3 else ''}
              if row['slug'] in targets: rows.append(row)
          rows.sort(key=lambda x:x['term_id'])

          def collect(obj, wanted):
              out=[]
              def walk(x,path='$'):
                  if isinstance(x,dict):
                      vals={k:str(v) for k,v in x.items() if isinstance(v,(str,int,float,bool))}
                      if any(v in wanted for v in vals.values()):
                          out.append({'path':path,'value':x})
                      for k,v in x.items(): walk(v,f'{path}.{k}')
                  elif isinstance(x,list):
                      for i,v in enumerate(x): walk(v,f'{path}[{i}]')
              walk(obj)
              return out

          page_slugs={
              'ausruestung','ausruestung-sattel','pferdesaettel',
              'ausruestung-trensen-und-gebisse','trensen',
              'stall','stall-offenstall','offenstallbau',
              'weide','weide-paddock','paddockbau','weide-reitplatz','reitplatzbau'
          }
          structure_target_matches=collect(portal,set(targets))
          structure_page_matches=collect(portal,page_slugs)

          cats=m.get('categories') if isinstance(m,dict) else {}
          missing=[s for s in targets if s not in cats]
          present=[s for s in targets if s in cats]

          # Compact useful samples: existing mappings whose final page is one of the relevant parent hubs.
          samples={}
          if isinstance(cats,dict):
              parent_hubs={'ausruestung-sattel','ausruestung-trensen-und-gebisse','stall-offenstall','weide-paddock','weide-reitplatz'}
              for slug,val in cats.items():
                  if not isinstance(val,dict): continue
                  pages=val.get('pages')
                  if not isinstance(pages,list) or not pages: continue
                  final=pages[-1].get('slug') if isinstance(pages[-1],dict) else None
                  if final in parent_hubs:
                      samples.setdefault(final,[])
                      if len(samples[final])<3: samples[final].append({'category_slug':slug,'mapping':val})

          report={
              'tsv_target_count':len(rows),
              'tsv_rows':rows,
              'live_map_contract':m.get('contract'),
              'live_map_source_sha256':m.get('source_sha256'),
              'live_map_category_count':m.get('category_count'),
              'live_map_actual_count':len(cats) if isinstance(cats,dict) else None,
              'target_present_count':len(present),
              'target_missing_count':len(missing),
              'target_present':present,
              'target_missing':missing,
              'portal_top_keys':list(portal.keys()) if isinstance(portal,dict) else None,
              'structure_target_matches':structure_target_matches,
              'structure_page_matches':structure_page_matches,
              'existing_parent_hub_samples':samples,
          }
          Path('out/derivation-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('TSV_TARGETS',len(rows))
          print('LIVE_MAP_ACTUAL',report['live_map_actual_count'])
          print('TARGET_PRESENT',len(present))
          print('TARGET_MISSING',len(missing))
          print('STRUCTURE_TARGET_MATCHES',len(structure_target_matches))
          print('STRUCTURE_PAGE_MATCHES',len(structure_page_matches))
          PY

      - name: Inspect public WordPress REST routes read-only
        shell: bash
        run: |
          set -euo pipefail
          URL='https://pferde-atelier.de/wp-json/'
          STATUS="$(curl -A 'Mozilla/5.0' -L --silent --show-error --connect-timeout 15 --max-time 45 -o out/wp-json-index.json -w '%{http_code}' "$URL" || true)"
          printf '%s\n' "$STATUS" > out/wp-json-status.txt
          echo "WP_JSON_HTTP_STATUS=$STATUS"
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          status=Path('out/wp-json-status.txt').read_text().strip()
          report={'http_status':status,'matching_routes':[],'namespaces':[]}
          if status=='200':
              obj=json.loads(Path('out/wp-json-index.json').read_text(encoding='utf-8-sig'))
              report['namespaces']=obj.get('namespaces',[])
              routes=obj.get('routes',{})
              rx=re.compile(r'(evidence|export|server|template|pftk|plugin|ppa|category)',re.I)
              for route,meta in routes.items():
                  if rx.search(route) or rx.search(json.dumps(meta,ensure_ascii=False)):
                      report['matching_routes'].append({'route':route,'meta':meta})
          Path('out/wp-json-route-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('MATCHING_ROUTES',len(report['matching_routes']))
          for row in report['matching_routes']:
              print(row['route'])
          PY

      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-kit-150559-breadcrumb-readonly-evidence
          path: out/
          if-no-files-found: error

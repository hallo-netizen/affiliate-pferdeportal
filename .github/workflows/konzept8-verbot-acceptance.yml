name: Konzept 8 Verbot Acceptance

on:
  push:
    branches:
      - 'konzept8-verbot/working-copy-20260928'
    paths:
      - 'concept_agent/konzept8_verbot/**'
      - '.github/workflows/konzept8-verbot-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact K8 commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove K8 is isolated from baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin konzept8-verbot/baseline-20260928
          changed="$(git diff --name-only origin/konzept8-verbot/baseline-20260928...HEAD)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -vE '^(concept_agent/konzept8_verbot/|\.github/workflows/konzept8-verbot-acceptance\.yml$)' || true)"
          if [ -n "$bad" ]; then
            echo "K8_BASELINE_DRIFT_OUTSIDE_ISOLATED_OFFICE"
            printf '%s\n' "$bad"
            exit 2
          fi
          test ! -e concept_agent/github_director.py
          echo K8_ISOLATION_PASS

      - name: Compile K8 gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile             concept_agent/konzept8_verbot/k8_command_gate.py             concept_agent/konzept8_verbot/k8_entry.py             concept_agent/konzept8_verbot/k8_start_bridge.py

      - name: Run K8 positive negative matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v concept_agent.konzept8_verbot.test_k8_command_gate

      - name: Real current-16 start wrong abort resume continue test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/k8-real-start
          mkdir -p /tmp/k8-real-start

          python3 concept_agent/konzept8_verbot/k8_start_bridge.py start             concept_agent/current/PSERC_METADATA_SNAPSHOT.json             concept_agent/current/CONCEPT_AGENT_RESEARCH_BOUND.json             /tmp/k8-real-start > /tmp/k8-start-1.json

          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/k8-start-1.json'))
          assert x['status']=='K8_VERBOT_START_READY'
          assert x['resumed_existing_checkpoint'] is False
          assert x['allowed_action']['action']=='WRITE_DRAFT'
          assert x['allowed_action']['item_index']==0
          assert x['required_command']['command']==x['allowed_action']
          assert x['publish_allowed'] is False
          json.dump(x['required_command'],open('/tmp/k8-correct.json','w'))
          wrong=json.loads(json.dumps(x['required_command']))
          wrong['command']={'action':'RUN_PSERC','item_count':16}
          json.dump(wrong,open('/tmp/k8-wrong.json','w'))
          PY

          sha256sum /tmp/k8-real-start/K8_PROGRESS.json > /tmp/k8-before.sha

          set +e
          python3 concept_agent/konzept8_verbot/k8_start_bridge.py start             concept_agent/current/PSERC_METADATA_SNAPSHOT.json             concept_agent/current/CONCEPT_AGENT_RESEARCH_BOUND.json             /tmp/k8-real-start /tmp/k8-wrong.json > /tmp/k8-wrong-result.json
          wrong_rc=$?
          set -e
          test "$wrong_rc" -eq 3
          sha256sum /tmp/k8-real-start/K8_PROGRESS.json > /tmp/k8-after-wrong.sha
          diff -u /tmp/k8-before.sha /tmp/k8-after-wrong.sha

          python3 - <<'PY'
          import json
          start=json.load(open('/tmp/k8-start-1.json'))
          wrong=json.load(open('/tmp/k8-wrong-result.json'))
          assert wrong['status']=='K8_VERBOT_BLOCKED_KEEP_SAME_CHECKPOINT'
          assert wrong['checkpoint_sha256']==start['checkpoint_sha256']
          assert wrong['allowed_action']==start['allowed_action']
          assert wrong['state_changed'] is False
          assert wrong['continuation_required'] is True
          assert wrong['execution'] is None
          PY

          # Simulated interruption: fresh process, same durable state directory.
          python3 concept_agent/konzept8_verbot/k8_start_bridge.py start             concept_agent/current/PSERC_METADATA_SNAPSHOT.json             concept_agent/current/CONCEPT_AGENT_RESEARCH_BOUND.json             /tmp/k8-real-start > /tmp/k8-restart.json

          sha256sum /tmp/k8-real-start/K8_PROGRESS.json > /tmp/k8-after-restart.sha
          diff -u /tmp/k8-before.sha /tmp/k8-after-restart.sha

          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/k8-start-1.json'))
          b=json.load(open('/tmp/k8-restart.json'))
          assert b['resumed_existing_checkpoint'] is True
          assert b['checkpoint_sha256']==a['checkpoint_sha256']
          assert b['allowed_action']==a['allowed_action']
          assert b['required_command']==a['required_command']
          json.dump(b['required_command'],open('/tmp/k8-restart-correct.json','w'))
          PY

          python3 concept_agent/konzept8_verbot/k8_start_bridge.py start             concept_agent/current/PSERC_METADATA_SNAPSHOT.json             concept_agent/current/CONCEPT_AGENT_RESEARCH_BOUND.json             /tmp/k8-real-start /tmp/k8-restart-correct.json > /tmp/k8-continue.json

          sha256sum /tmp/k8-real-start/K8_PROGRESS.json > /tmp/k8-after-continue.sha
          diff -u /tmp/k8-before.sha /tmp/k8-after-continue.sha

          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/k8-start-1.json'))
          c=json.load(open('/tmp/k8-continue.json'))
          assert c['status']=='K8_VERBOT_EXECUTE_EXACT_CURRENT_ACTION'
          assert c['checkpoint_sha256']==a['checkpoint_sha256']
          assert c['allowed_action']==a['allowed_action']
          assert c['execution']['allowed_action']==a['allowed_action']
          assert c['execution']['continuation_required'] is True
          assert c['publish_allowed'] is False
          print('K8_REAL_CURRENT16_START_WRONG_ABORT_RESUME_CONTINUE_PASS')
          PY

      - name: Re-run unchanged K7 optimization suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v concept_agent.konzept7.test_k7_optimizations

      - name: Prove unchanged production-guard parity with K8 baseline
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 -m unittest -v concept_agent/tests/test_current_production_guards.py > /tmp/k8-working-guards.log 2>&1
          working_rc=$?
          set -e
          cp /tmp/k8-working-guards.log /tmp/k8-working-guards.saved
          git checkout origin/konzept8-verbot/baseline-20260928 -- .
          set +e
          python3 -m unittest -v concept_agent/tests/test_current_production_guards.py > /tmp/k8-baseline-guards.log 2>&1
          baseline_rc=$?
          set -e
          if [ "$working_rc" -ne "$baseline_rc" ]; then
            echo K8_PRODUCTION_GUARD_PARITY_CHANGED
            cat /tmp/k8-working-guards.saved
            cat /tmp/k8-baseline-guards.log
            exit 2
          fi
          working_fail="$(grep -E '^(FAILED|OK)' /tmp/k8-working-guards.saved | tail -1 || true)"
          baseline_fail="$(grep -E '^(FAILED|OK)' /tmp/k8-baseline-guards.log | tail -1 || true)"
          if [ "$working_fail" != "$baseline_fail" ]; then
            echo K8_PRODUCTION_GUARD_RESULT_DRIFT
            printf 'working=%s\nbaseline=%s\n' "$working_fail" "$baseline_fail"
            exit 2
          fi
          if ! grep -q 'test_resume_requires_exact_universal_reentry_decision.*FAIL' /tmp/k8-working-guards.saved; then
            echo K8_UNEXPECTED_GUARD_FAILURE_SET
            cat /tmp/k8-working-guards.saved
            exit 2
          fi
          if ! grep -q 'test_resume_requires_exact_universal_reentry_decision.*FAIL' /tmp/k8-baseline-guards.log; then
            echo K8_BASELINE_GUARD_FAILURE_SET_CHANGED
            cat /tmp/k8-baseline-guards.log
            exit 2
          fi
          echo K8_EXISTING_GUARD_PARITY_PASS

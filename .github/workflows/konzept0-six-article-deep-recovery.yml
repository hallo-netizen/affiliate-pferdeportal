name: Konzept 0 Six Article Deep Recovery

on:
  push:
    branches:
      - isolated-system0-legacy-text-20260828
    paths:
      - 'isolated_system0/KONZEPT_0/SIX_ARTICLE_DEEP_TRIGGER.txt'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan all refs and historical archives for six Aug-28 article outputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --tags --prune || true
          ROOT="isolated_system0/KONZEPT_0"
          OUT="$ROOT/SIX_ARTICLE_DEEP_RECOVERY_REPORT.txt"
          DST="$ROOT/runtime/recovered_six_articles"
          rm -rf "$DST"; mkdir -p "$DST"
          : > "$OUT"

          cat >/tmp/k0_needles.txt <<'EOF'
Schritt für Schritt Pferdebürsten reinigen
Schritt für Schritt Pferdebürsten waschen
So findest du die geeigneten Rampenmatten für Pferdeanhänger
So findest du ideale Heuraufen für Pferde
So wählst du geeignete Ekzemerdecken für Pferde
Wissenswertes über Weidetore für Pferde
17123
17124
17125
17126
17127
17128
EOF

          echo "=== DIRECT TEXT/JSON/XML/HTML BLOBS ===" >> "$OUT"
          git rev-list --objects --all \
            | grep -Ei '\.(txt|md|json|jsonl|xml|html|htm|php)$' \
            | awk '!seen[$1]++' > /tmp/k0objs.txt || true
          direct=0
          while read -r oid path; do
            [ -n "$oid" ] || continue
            size="$(git cat-file -s "$oid" 2>/dev/null || echo 0)"
            [ "$size" -le 8000000 ] || continue
            tmp="$(mktemp)"
            git cat-file blob "$oid" >"$tmp" 2>/dev/null || { rm -f "$tmp"; continue; }
            hits=0
            while IFS= read -r needle; do
              if grep -aFq "$needle" "$tmp"; then
                echo "DIRECT_MATCH OID=$oid PATH_HINT=$path NEEDLE=$needle SIZE=$size" >> "$OUT"
                hits=$((hits+1))
              fi
            done </tmp/k0_needles.txt
            if [ "$hits" -gt 0 ]; then
              cp "$tmp" "$DST/direct_${oid}_$(basename "$path")"
              direct=$((direct+1))
            fi
            rm -f "$tmp"
          done </tmp/k0objs.txt
          echo "DIRECT_FILES=$direct" >> "$OUT"

          echo "=== HISTORICAL ZIP MEMBERS ===" >> "$OUT"
          git rev-list --objects --all | grep -Ei '\.zip$' | awk '!seen[$1]++' > /tmp/k0zips.txt || true
          archive=0
          while read -r oid path; do
            [ -n "$oid" ] || continue
            z="$(mktemp --suffix=.zip)"
            git cat-file blob "$oid" > "$z" 2>/dev/null || { rm -f "$z"; continue; }
            unzip -t "$z" >/dev/null 2>&1 || { rm -f "$z"; continue; }
            mapfile -t members < <(unzip -Z1 "$z" | grep -Ei '\.(txt|md|json|jsonl|xml|html|htm|php)$' || true)
            for member in "${members[@]}"; do
              mtmp="$(mktemp)"
              unzip -p "$z" "$member" >"$mtmp" 2>/dev/null || { rm -f "$mtmp"; continue; }
              hits=0
              while IFS= read -r needle; do
                if grep -aFq "$needle" "$mtmp"; then
                  echo "ZIP_MATCH OID=$oid PATH_HINT=$path MEMBER=$member NEEDLE=$needle" >> "$OUT"
                  hits=$((hits+1))
                fi
              done </tmp/k0_needles.txt
              if [ "$hits" -gt 0 ]; then
                safe="$(echo "$member" | tr '/ :' '___')"
                cp "$mtmp" "$DST/archive_${oid}_${safe}"
                archive=$((archive+1))
              fi
              rm -f "$mtmp"
            done
            rm -f "$z"
          done </tmp/k0zips.txt
          echo "ARCHIVE_FILES=$archive" >> "$OUT"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('isolated_system0/KONZEPT_0')
          dst=root/'runtime/recovered_six_articles'
          files=sorted(p for p in dst.iterdir() if p.is_file())
          titles=[
            'Schritt für Schritt Pferdebürsten reinigen',
            'Schritt für Schritt Pferdebürsten waschen',
            'So findest du die geeigneten Rampenmatten für Pferdeanhänger',
            'So findest du ideale Heuraufen für Pferde',
            'So wählst du geeignete Ekzemerdecken für Pferde',
            'Wissenswertes über Weidetore für Pferde',
          ]
          candidate=[]
          for p in files:
              txt=p.read_text(encoding='utf-8',errors='replace')
              found=[t for t in titles if t in txt]
              candidate.append({
                  'file':p.name,
                  'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                  'size':p.stat().st_size,
                  'titles_found':found,
                  'looks_like_article_body': any(tag in txt.lower() for tag in ['<article','<h2','body_html','content_html','canonical_article'])
              })
          out={
              'contract':'KONZEPT0_SIX_ARTICLE_DEEP_RECOVERY_V1',
              'status':'PASS',
              'candidate_file_count':len(candidate),
              'candidates':candidate,
              'concept_1_2_3_4_4a_runtime_contact':False,
              'codex_started':False,
              'publish_performed':False
          }
          (root/'SIX_ARTICLE_DEEP_RECOVERY_EVIDENCE.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit recovery evidence safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "konzept0-six-article-recovery"
          git config user.email "actions@users.noreply.github.com"
          git add isolated_system0/KONZEPT_0/SIX_ARTICLE_DEEP_RECOVERY_REPORT.txt \
                  isolated_system0/KONZEPT_0/SIX_ARTICLE_DEEP_RECOVERY_EVIDENCE.json \
                  isolated_system0/KONZEPT_0/runtime/recovered_six_articles
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Konzept 0: deep recover Aug-28 six article outputs"
          git pull --rebase origin isolated-system0-legacy-text-20260828
          git push origin HEAD:isolated-system0-legacy-text-20260828

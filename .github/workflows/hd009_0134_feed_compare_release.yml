name: HD009 0.1.34 release after read-only safety QA
on:
  push:
    branches: [hobbyroom/hd009-dual-feed-safe-compare-20261113]
    paths: [.github/workflows/hd009_0134_feed_compare_release.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build full candidate from SHA-locked original 0.1.33
        run: python3 scripts/hd009_0134_safe_feed_preview_build.py /tmp/HOBBY_DEPOT_HD009_0.1.34_FEEDVERGLEICH.zip
      - name: Test all 24 PHP files and prove importer and public provider gates unchanged
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,re
          a=Path('protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE/CURRENT.zip')
          b=Path('/tmp/HOBBY_DEPOT_HD009_0.1.34_FEEDVERGLEICH.zip')
          with zipfile.ZipFile(a) as x,zipfile.ZipFile(b) as y:
            assert x.testzip() is None and y.testzip() is None
            assert x.namelist()==y.namelist() and len(x.namelist())==41
            n='affiliate-portal-router/includes/trait-ppar-idealo.php'
            main='affiliate-portal-router/hobby-depot-affiliate-router.php'
            diff=[z for z in x.namelist() if x.read(z)!=y.read(z)]
            assert set(diff)=={main,n},diff
            before=x.read(n).decode();after=y.read(n).decode()
            pat=re.compile(r'^    (?:private|public|protected) function [a-zA-Z_]+\(',re.M)
            def fragment(s,name):
              p=s.index(name);end=pat.search(s,p+len(name))
              return s[p:end.start()] if end else s[p:]
            preserve=[
              'private function idealo_import_feed_file(',
              'private function idealo_materialize_campaigns(',
              'private function idealo_match_feed_row_to_concept(',
              'private function idealo_match_index(',
              'private function idealo_find_feed_metadata(',
              'private function hd_idealo_feed_download_url(',
              'private function idealo_download_feed_to_temp(',
              'private function idealo_refresh_remote_feed(',
              'private function idealo_campaigns_should_be_active(',
              'public function idealo_campaign_publicly_allowed(',
              'public function idealo_provider_access_save(',
              'public function idealo_provider_access_test(',
              'private function idealo_queue_manual_refresh(',
            ]
            for name in preserve:
              assert fragment(before,name)==fragment(after,name),'Original method changed: '+name
            block=after[after.index('    private function hd_idealo_preview_save'):after.index('    public function idealo_render_sync_card(')]
            for bad in ('network_sync_upsert_products(', 'save_campaign_record(', 'idealo_materialize_campaigns(', 'wp_insert_post(', 'update_post_meta(', 'self::OPTION_NETWORK_IDEALO,'):
              assert bad not in block,'Preview write detected: '+bad
            for mandatory in (
                "current_user_can('manage_options')",
                "check_admin_referer('ppar_hd009_preview_standard'",
                "hash_equals($hash,hash('sha256',$token))",
                "idealo_find_feed_metadata($other)",
                "$other['feed_id']='2901'",
                "$other['feed_url']=''",
                "$other['feed_etag']=''",
                "$other['feed_last_modified']=''",
                "idealo_download_feed_to_temp($other)",
                "idealo_match_feed_row_to_concept($row)",
                "SELECT DISTINCT category",
                "get_transient(self::IDEALO_REFRESH_LOCK)"
            ):
              assert mandatory in block,'Missing safety: '+mandatory
            for z in y.namelist():
              if z.endswith('.php'):
                p=Path('/tmp/hd009_php')/z;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(y.read(z))
            print('41_ZIP_CRC_PASS, 13_ORIGINAL_METHODS_UNCHANGED, 12_SAFETY_GUARDS_PASS')
            print('DIFF_ONLY',diff)
          PY
          find /tmp/hd009_php -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          echo ALL_PLUGIN_PHP_LINT_PASS
      - name: Run real original matcher and gzip synthetic feed runtime tests
        run: |
          python3 scripts/hd009_0134_safe_feed_preview_runtime_qa.py /tmp/HOBBY_DEPOT_HD009_0.1.34_FEEDVERGLEICH.zip /tmp/hd009_0134_qa.php
          php -l /tmp/hd009_0134_qa.php
          php /tmp/hd009_0134_qa.php
      - name: Archive as candidate, keep CURRENT byte-identical
        run: |
          python3 scripts/hd009_0134_archive_candidate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/AFFILIATE/HD009_FEEDVERGLEICH_2747_2901_0.1.34_20261113.md
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE/CANDIDATES/
          git commit -m "HD009 0.1.34 source-verified non-mutating comparison candidate; 0.1.33 retained"
          git fetch origin hobbyroom/hd009-dual-feed-safe-compare-20261113
          git rebase origin/hobbyroom/hd009-dual-feed-safe-compare-20261113
          git push origin HEAD:refs/heads/hobbyroom/hd009-dual-feed-safe-compare-20261113
      - name: Publish exact tested installable ZIP as candidate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=hobby-hd009-0.1.34-safe-feedcompare-20261113
          ZIP=/tmp/HOBBY_DEPOT_HD009_0.1.34_FEEDVERGLEICH.zip
          printf 'HD009 0.1.34: 2747 and 2901 comparison without switching feeds or editing existing products. Same original matcher. 41 ZIP CRC, all 24 PHP lint, 25 actual PHP regression tests pass. Live 2901 data has not been compared yet.\nInstall into Hobby Depot then go to Affiliate-Zentrale > Anbieter & APIs > idealo > Provider-Fachseite and click Standardfeed 2901 gefahrlos vergleichen. CURRENT 0.1.33 is retained as safe source.\n' >/tmp/hd009_notes.txt
          gh release create "$TAG" "$ZIP#HOBBY_DEPOT_HD009_0.1.34_FEEDVERGLEICH.zip" --repo "$GITHUB_REPOSITORY" --target hobbyroom/hd009-dual-feed-safe-compare-20261113 --title "HD009 0.1.34 – sicherer idealo-Feedvergleich (Kandidat)" --notes-file /tmp/hd009_notes.txt
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,name,tagName,url

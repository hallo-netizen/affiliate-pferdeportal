name: TEMP PR223 exact final hardlocks
on:
  push:
    branches:
      - hobbyroom/107007-simple-entry-aggregate-checker-v2
permissions:
  contents: write
jobs:
  exact-hardlocks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 7626f441e62402856afdf38fda0a7b9ac49d67d0
      HEAD_SHA: dd569c572a72e19999630a88595c945771966331
      HEAD_REF: hobbyroom/107007-simple-entry-aggregate-checker-v2
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: dd569c572a72e19999630a88595c945771966331
          fetch-depth: 0
          persist-credentials: true
      - name: Immutable path guard and Paul scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee /tmp/changed.txt
          python3 - <<'PY'
          import os,pathlib,re
          changed=pathlib.Path('/tmp/changed.txt').read_text().splitlines(); ref=os.environ['HEAD_REF']
          immutable=re.compile(r'^(\.github/workflows/|AGENTS\.md$|control/cloud-entry-gate/|control/deterministic-entrance-gate/|control/production-continuity/|control/paul-scope-gate/|control/startmaster0107/ENDSTEMPEL_)')
          def decision(r,paths):
              if r.startswith('paul/') and any(p.startswith('protocol/PROJECT_MEMORY/') for p in paths): return 'PAUL_PROJECT_MEMORY_WRITE_BLOCKED'
              if any(immutable.search(p) for p in paths): return 'IMMUTABLE_SECURITY_PATH_CHANGE_BLOCKED'
              return 'PASS'
          assert decision('paul/test',['protocol/PROJECT_MEMORY/START_HERE.md'])=='PAUL_PROJECT_MEMORY_WRITE_BLOCKED'
          assert decision('paul/test',['src/example.py'])=='PASS'
          assert decision('feature/test',['protocol/PROJECT_MEMORY/START_HERE.md'])=='PASS'
          assert decision('feature/test',['.github/workflows/x.yml'])=='IMMUTABLE_SECURITY_PATH_CHANGE_BLOCKED'
          print('PATH_GUARD_SELFTEST_PASS')
          result=decision(ref,changed)
          if result!='PASS': raise SystemExit(result)
          print('PATH_GUARD_PASS')
          if any(p.startswith('protocol/PROJECT_MEMORY/') for p in changed): raise SystemExit('UNEXPECTED_PROJECT_MEMORY_CHANGE')
          print('PROJECT_MEMORY_PROTOCOLCHECK_NOT_APPLICABLE')
          PY
          python3 control/paul-scope-gate/paul_scope_gate.py verify-pr "$HEAD_REF" "$HEAD_SHA" "$BASE_SHA"
      - name: Monotonic prebound transition
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/base-tree /tmp/candidate-tree
          mkdir -p /tmp/base-tree /tmp/candidate-tree
          git archive "$BASE_SHA" | tar -x -C /tmp/base-tree
          git archive "$HEAD_SHA" | tar -x -C /tmp/candidate-tree
          python3 - <<'PY'
          import json,hashlib,pathlib,re
          B=pathlib.Path('/tmp/base-tree'); H=pathlib.Path('/tmp/candidate-tree')
          def load(p): return json.loads(p.read_text(encoding='utf-8'))
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def refs(root):
              ptr=load(root/'control/CURRENT_STARTMASTER.json'); r=load(root/ptr['root_ref']); s=load(root/ptr['state_ref']); g=s['execution_gate']; b=load(root/g['bundle_ref']); return ptr,r,s,g,b
          bp,br,bs,bg,bb=refs(B); hp,hr,hs,hg,hb=refs(H)
          def smnum(v):
              m=re.fullmatch(r'STARTMASTER(\d+)',str(v))
              if not m: raise SystemExit('STARTMASTER_ID_INVALID')
              return int(m.group(1))
          if smnum(hp['startmaster'])<smnum(bp['startmaster']): raise SystemExit('STARTMASTER_ROLLBACK_BLOCKED')
          if int(hg['sequence'])<int(bg['sequence']): raise SystemExit('SEQUENCE_ROLLBACK_BLOCKED')
          changed=(hp['startmaster']!=bp['startmaster'] or hs['next_allowed_step']!=bs['next_allowed_step'] or int(hg['sequence'])!=int(bg['sequence']))
          if changed:
              nb=bb.get('next_binding')
              if not isinstance(nb,dict): raise SystemExit('UNPREBOUND_TRANSITION_BLOCKED')
              checks=[(hp['startmaster']==nb.get('startmaster',bp['startmaster']),'NEXT_STARTMASTER_MISMATCH'),(hs['next_allowed_step']==nb.get('step_id'),'NEXT_STEP_MISMATCH'),(int(hg['sequence'])==int(nb.get('sequence',-1)),'NEXT_SEQUENCE_MISMATCH'),(hg['bundle_ref']==nb.get('bundle_ref'),'NEXT_BUNDLE_REF_MISMATCH')]
              for ok,msg in checks:
                  if not ok: raise SystemExit(msg)
              p=H/hg['bundle_ref']
              if not p.is_file() or sha(p)!=nb.get('bundle_sha256'): raise SystemExit('NEXT_BUNDLE_HASH_MISMATCH')
          print('MONOTONIC_PREBOUND_TRANSITION_PASS')
          PY
      - name: Trusted entrance continuity and deterministic gate tests
        shell: bash
        run: |
          set -euo pipefail
          python3 control/deterministic-entrance-gate/repo_ci_test.py
          python3 control/cloud-entry-gate/cloud_repo_ci_test.py
          python3 control/production-continuity/test_production_continuity_guard.py
          ! grep -E 'api\.openai\.com|OPENAI_API_KEY|requests\.post|httpx\.post|urllib\.request' control/cloud-entry-gate/cloud_entry.py control/deterministic-entrance-gate/door.py control/production-continuity/production_continuity_guard.py
          ! grep -E -i 'pste|pserc|ppm|languagetool|wordpress|beratung|pflege|cannibal|title_rule|keyword_rule|design_rule' control/cloud-entry-gate/cloud_entry.py control/production-continuity/production_continuity_guard.py
          echo EXACT_HARDLOCKS_PASS
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          git rm -f .github/workflows/pr223-exact-final-hardlocks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary PR223 hardlock workflow"
          git push origin HEAD:"$HEAD_REF"

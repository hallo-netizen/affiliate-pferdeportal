name: TEMP Affiliate Live51 Leaf Candidate 6.72.185

on:
  push:
    branches: [affiliate-release-current]
    paths:
      - 'AFFILIATE_HOBBYRAUM/test_banner_destination_leaf_disambiguation_v672185.php'
      - '.github/workflows/tmp-affiliate-live51-leaf-candidate.yml'

permissions:
  contents: read

jobs:
  red-green-candidate:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Verify immutable production artifact and performance hotpaths
        shell: bash
        run: |
          set -euo pipefail
          ZIP=release/affiliate-zentrale/artifacts/final/AFFILIATE_ZENTRALE_6.72.185.zip
          ACTUAL=$(sha256sum "$ZIP" | awk '{print $1}')
          test "$ACTUAL" = '13fff3d67507d152e5368da9d7fc99028f8d26ad6d19338bb0cad1f44463fa28'
          rm -rf /tmp/prod185 /tmp/candidate185
          mkdir -p /tmp/prod185 /tmp/candidate185
          unzip -q "$ZIP" -d /tmp/prod185
          cp -a /tmp/prod185/affiliate-portal-router /tmp/candidate185/affiliate-portal-router
          git fetch --no-tags origin a381aff4eb3f41754186f4bad86ce1a7e0823a29
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          cur=Path('/tmp/prod185/affiliate-portal-router/pferdeportal-affiliate-router.php').read_text()
          old=subprocess.check_output(['git','show','a381aff4eb3f41754186f4bad86ce1a7e0823a29:release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php'],text=True)
          def body(src,name):
              marker='function '+name+'('
              start=src.find(marker)
              if start<0: raise SystemExit('FAIL missing '+name)
              brace=src.find('{',start); depth=0; state='code'; i=brace
              while i<len(src):
                  c=src[i]; n=src[i+1] if i+1<len(src) else ''
                  if state=='sq':
                      if c=='\\': i+=1
                      elif c=="'": state='code'
                  elif state=='dq':
                      if c=='\\': i+=1
                      elif c=='"': state='code'
                  elif state=='line':
                      if c=='\n': state='code'
                  elif state=='block':
                      if c=='*' and n=='/': state='code'; i+=1
                  else:
                      if c=="'": state='sq'
                      elif c=='"': state='dq'
                      elif c=='/' and n=='/': state='line'; i+=1
                      elif c=='#': state='line'
                      elif c=='/' and n=='*': state='block'; i+=1
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0:return src[start:i+1]
                  i+=1
              raise SystemExit('FAIL unclosed '+name)
          protected=[
            'ranked_campaigns_request_cache_allowed','ranked_campaign_sanitize_key_request_cached',
            'ranked_campaign_sanitize_text_request_cached','ranked_campaigns_request_cache_key',
            'select_category_product_campaign_fast_v672171','ranked_campaign_candidate_pool',
            'category_product_provider_mix_v672133','render_banner',
            'banner_distribution_reorder_candidates','banner_distribution_stable_index',
            'category_product_shared_rank_base'
          ]
          for name in protected:
              if body(cur,name)!=body(old,name): raise SystemExit('FAIL protected performance function changed '+name)
          print('PASS production performance KISS hardlock')
          PY

      - name: Build test-only generic leaf candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/candidate185/affiliate-portal-router/includes/trait-ppar-output-objects.php')
          s=p.read_text()
          old="""        $dest_tokens=$this->output_tokens($semantic);
        $ranked=array();"""
          new="""        $dest_tokens=$this->output_tokens($semantic);
        // TEST-ONLY candidate: an exact final URL path leaf is stronger than a
        // token that appears only in a containing path segment. Generic; no
        // provider, partner, category or portal-specific vocabulary.
        $destination_path=(string)wp_parse_url((string)($row['destination_url']??''),PHP_URL_PATH);
        $destination_leaf=rawurldecode((string)basename(rtrim($destination_path,'/')));
        $destination_leaf=preg_replace('/\\.[A-Za-z0-9]{1,8}$/','',$destination_leaf);
        $destination_leaf_norm=$this->output_text(str_replace(array('-','_'),' ',$destination_leaf));
        $ranked=array();"""
          if old not in s: raise SystemExit('FAIL candidate insert anchor missing')
          s=s.replace(old,new,1)
          old2="""            $exact=$slug_tokens && !array_diff($slug_tokens,array_keys($matched));
            $score=$exact ? 1000 + min(90,absint($target['depth']??0)*10) : count($matched)*140;"""
          new2="""            $exact=$slug_tokens && !array_diff($slug_tokens,array_keys($matched));
            $final_leaf_exact=$exact && $destination_leaf_norm!=='' && (
                $destination_leaf_norm===$slug_norm || $destination_leaf_norm===$leaf_norm
            );
            $score=$exact ? 1000 + min(90,absint($target['depth']??0)*10) + ($final_leaf_exact?200:0) : count($matched)*140;"""
          if old2 not in s: raise SystemExit('FAIL candidate score anchor missing')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          print('PASS test-only generic leaf candidate built')
          PY
          php -l /tmp/candidate185/affiliate-portal-router/includes/trait-ppar-output-objects.php

      - name: Install WordPress for candidate proof
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-leaf
          mkdir -p /tmp/wp-leaf
          /tmp/wp core download --path=/tmp/wp-leaf --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-leaf --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-leaf --url=http://127.0.0.1:8080 --title='Affiliate Leaf Candidate' --admin_user=admin --admin_password='ci-password-123!' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp-leaf/wp-content/mu-plugins
          cat >/tmp/wp-leaf/wp-content/mu-plugins/pferde-real-hierarchy-contract.php <<'PHP'
          <?php
          if (!class_exists('Pferde_Template_Kit')) {
              class Pferde_Template_Kit {
                  public static function affiliate_contract_version(){ return '1.0'; }
                  public static function design_profile(){ return 'pferde_atelier'; }
                  public static function design_profile_contract_version(){ return '1.0'; }
                  public static function affiliate_page_type($page_id){
                      $p=get_post((int)$page_id);
                      if(!$p) return '';
                      $parent=(int)$p->post_parent;
                      if($parent<=0) return 'hub1';
                      $pp=get_post($parent);
                      if($pp && (int)$pp->post_parent===0) return 'hub2';
                      return 'category';
                  }
              }
          }
          PHP
          cp -a /tmp/candidate185/affiliate-portal-router /tmp/wp-leaf/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-leaf

      - name: Create exact real hierarchy and run current real-data replay on candidate
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp eval-file "$GITHUB_WORKSPACE/AFFILIATE_HOBBYRAUM/test_banner_live51_replay_v672185.php" --path=/tmp/wp-leaf | tee /tmp/candidate-replay.log
          grep -F 'PASS raw_destination_derives_real_reithelme_page_186' /tmp/candidate-replay.log
          grep -F 'PASS frontend_zero_http_calls' /tmp/candidate-replay.log
          grep -F 'REAL51_REPLAY_GATE_COMPLETE' /tmp/candidate-replay.log
          grep '^CRITICAL_REITHELME ' /tmp/candidate-replay.log
          grep '^CRITICAL_SCHABRACKEN ' /tmp/candidate-replay.log
          grep '^REPLAY_SUMMARY ' /tmp/candidate-replay.log

      - name: Prove generic positive and true-ambiguity negative
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp eval-file "$GITHUB_WORKSPACE/AFFILIATE_HOBBYRAUM/test_banner_destination_leaf_disambiguation_v672185.php" --path=/tmp/wp-leaf | tee /tmp/leaf-contract.log
          grep -F 'PASS_REAL_LEAF_DISAMBIGUATION' /tmp/leaf-contract.log
          grep -F 'PASS_TRUE_AMBIGUITY_REMAINS_BLOCKED' /tmp/leaf-contract.log

      - name: Prove production source and artifact untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- release/affiliate-zentrale/current/affiliate-portal-router release/affiliate-zentrale/artifacts/final/AFFILIATE_ZENTRALE_6.72.185.zip
          ACTUAL=$(sha256sum release/affiliate-zentrale/artifacts/final/AFFILIATE_ZENTRALE_6.72.185.zip | awk '{print $1}')
          test "$ACTUAL" = '13fff3d67507d152e5368da9d7fc99028f8d26ad6d19338bb0cad1f44463fa28'
          echo "PASS production source/artifact untouched"

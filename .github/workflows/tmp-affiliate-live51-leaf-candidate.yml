name: TEMP Affiliate Live51 Leaf Candidate 6.72.185

on:
  push:
    branches:
      - affiliate-release-current
    paths:
      - 'AFFILIATE_HOBBYRAUM/test_banner_destination_leaf_disambiguation_v672185.php'
      - 'AFFILIATE_HOBBYRAUM/build_test_only_leaf_candidate_v672185.py'
      - 'AFFILIATE_HOBBYRAUM/pferde_real_hierarchy_contract_v672185.php'
      - '.github/workflows/tmp-affiliate-live51-leaf-candidate.yml'

permissions:
  contents: read

jobs:
  leaf-candidate:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Build candidate from exact tested ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=release/affiliate-zentrale/artifacts/final/AFFILIATE_ZENTRALE_6.72.185.zip
          ACTUAL=$(sha256sum "$ZIP" | awk '{print $1}')
          test "$ACTUAL" = '13fff3d67507d152e5368da9d7fc99028f8d26ad6d19338bb0cad1f44463fa28'
          rm -rf /tmp/leaf185
          mkdir -p /tmp/leaf185
          unzip -q "$ZIP" -d /tmp/leaf185
          python3 AFFILIATE_HOBBYRAUM/build_test_only_leaf_candidate_v672185.py /tmp/leaf185/affiliate-portal-router
          php -l /tmp/leaf185/affiliate-portal-router/includes/trait-ppar-output-objects.php
          echo "PASS candidate built from exact production ZIP"

      - name: Install fresh WordPress replay
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-leaf51
          mkdir -p /tmp/wp-leaf51
          /tmp/wp core download --path=/tmp/wp-leaf51 --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-leaf51 --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-leaf51 --url=http://127.0.0.1:8081 --title='Affiliate Leaf Candidate Replay' --admin_user=admin --admin_password='ci-password-123!' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp-leaf51/wp-content/mu-plugins
          cp AFFILIATE_HOBBYRAUM/pferde_real_hierarchy_contract_v672185.php /tmp/wp-leaf51/wp-content/mu-plugins/
          cp -a /tmp/leaf185/affiliate-portal-router /tmp/wp-leaf51/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-leaf51
          /tmp/wp eval 'if(Pferdeportal_Affiliate_Router::VERSION!=="6.72.185"){exit(2);} echo "PASS candidate base version 6.72.185\n";' --path=/tmp/wp-leaf51

      - name: Run same real Live51 fixture on candidate
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp eval-file "$GITHUB_WORKSPACE/AFFILIATE_HOBBYRAUM/test_banner_live51_replay_v672185.php" --path=/tmp/wp-leaf51 | tee /tmp/candidate-live51.log
          grep -F 'PASS raw_destination_derives_real_reithelme_page_186' /tmp/candidate-live51.log
          grep -F 'PASS frontend_zero_http_calls' /tmp/candidate-live51.log
          grep -F 'REAL51_REPLAY_GATE_COMPLETE' /tmp/candidate-live51.log
          grep '^CRITICAL_REITHELME ' /tmp/candidate-live51.log
          grep '^CRITICAL_SCHABRACKEN ' /tmp/candidate-live51.log
          grep '^REPLAY_SUMMARY ' /tmp/candidate-live51.log

      - name: Run generic positive and negative contract
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp eval-file "$GITHUB_WORKSPACE/AFFILIATE_HOBBYRAUM/test_banner_destination_leaf_disambiguation_v672185.php" --path=/tmp/wp-leaf51 | tee /tmp/leaf-contract.log
          grep -F 'PASS_REAL_LEAF_DISAMBIGUATION' /tmp/leaf-contract.log
          grep -F 'PASS_TRUE_AMBIGUITY_REMAINS_BLOCKED' /tmp/leaf-contract.log

      - name: Prove production source untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- release/affiliate-zentrale/current/affiliate-portal-router
          ACTUAL=$(sha256sum release/affiliate-zentrale/artifacts/final/AFFILIATE_ZENTRALE_6.72.185.zip | awk '{print $1}')
          test "$ACTUAL" = '13fff3d67507d152e5368da9d7fc99028f8d26ad6d19338bb0cad1f44463fa28'
          echo "PASS production source and ZIP untouched"

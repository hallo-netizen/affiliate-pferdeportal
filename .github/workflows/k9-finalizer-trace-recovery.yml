name: K9 one-time finalizer trace recovery
on:
  push:
    branches: [konzept9/greenfield-20260929]
    paths: ['runtime/FINALIZER_REPAIR_REQUEST.json']
permissions:
  contents: write
concurrency:
  group: k9-production-state
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Prepare LT 6.8
        run: |
          set -euo pipefail
          mkdir -p /tmp/k9-lt68
          curl --fail --location --retry 3 https://github.com/jxmorris12/language_tool_python/releases/download/LanguageTool-6.8/LanguageTool-6.8.zip -o /tmp/k9-lt68/LanguageTool-6.8.zip
          echo '6a7f6b67b779ae9505f7579f0c41453ea8d1bd72ae750bdc2c55ba974281467d  /tmp/k9-lt68/LanguageTool-6.8.zip' | sha256sum -c -
          unzip -q /tmp/k9-lt68/LanguageTool-6.8.zip -d /tmp/k9-lt68
          echo '2122882e800d312a0543d895c56c0a84a9bb131c9b9846efd8fc033129353ae8  /tmp/k9-lt68/LanguageTool-6.8/languagetool-commandline.jar' | sha256sum -c -
      - name: Build corrected artifact and exact check job
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy,hashlib,json,pathlib,re
          root=pathlib.Path('.')
          req=json.load(open('runtime/FINALIZER_REPAIR_REQUEST.json'))
          assert req['contract']=='K9_FINALIZER_TRACE_REPAIR_REQUEST_V1' and req['status']=='AUTHORIZED'
          assert req['publish_allowed'] is False
          ledger=json.load(open('state/ledger.json'))
          item=next(x for x in ledger['items'] if x['item_id']==req['item_id'])
          research_pkg=json.load(open(item['products']['research']['path']))
          write_pkg=json.load(open(item['products']['write']['path']))
          research_row=next(x for x in research_pkg['results'] if x['item_id']==item['item_id'])
          write_row=next(x for x in write_pkg['results'] if x['item_id']==item['item_id'])
          article=copy.deepcopy(write_row['article_product'])
          html=article['content_html']
          pat=re.compile(r'<span\b[^>]*class=["\'][^"\']*\bppm-source-trace\b[^"\']*["\'][^>]*data-fact-id=["\']'+re.escape(req['fact_id'])+r'["\'][^>]*></span>',re.I)
          hits=list(pat.finditer(html))
          assert len(hits)==2, ('TRACE_COUNT',len(hits))
          assert hits[0].group(0)==hits[1].group(0)
          new_html=html[:hits[1].start()]+html[hits[1].end():]
          strip=lambda s: re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',s)).strip()
          assert strip(html)==strip(new_html)
          new_sha=hashlib.sha256(new_html.encode()).hexdigest()
          article['content_html']=new_html
          article['content_sha256']=new_sha
          article.pop('lt68_preflight_result',None)
          canonical=article['ppm_item']['canonical_article']
          canonical['body_html']=new_html
          canonical['body_html_sha256']=new_sha
          core=dict(article); core.pop('product_sha256',None)
          stable=lambda o: hashlib.sha256(json.dumps(o,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          article['product_sha256']=stable(core)
          repair_job='K9-REPAIR-FINALIZER-TRACE-'+stable({'item':item['item_id'],'sha':new_sha})[:16]
          repair_pkg={'contract':'K9_SUBMISSION_V1','job_id':repair_job,'station':'repair','results':[{'item_id':item['item_id'],'article_product':article}]}
          pathlib.Path('warehouse/repair').mkdir(parents=True,exist_ok=True)
          repair_path=pathlib.Path('warehouse/repair')/(repair_job+'.json')
          repair_path.write_text(json.dumps(repair_pkg,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          check_job='K9-CHECK-FINALIZER-TRACE-'+stable({'repair':stable(repair_pkg)})[:16]
          job={'contract':'K9_JOB_V1','status':'OPEN','station':'check','job_id':check_job,'job_sha256':'ONE_TIME_RECOVERY',
               'item_count':1,'item_ids':[item['item_id']],
               'items':[{'item_id':item['item_id'],'title':item['title'],'metadata':item['metadata'],'revision':item.get('revision',0)+1,
                         'input_products':{'research':research_row,'article':{'article_product':article}}}]}
          pathlib.Path('/tmp/k9-check-job.json').write_text(json.dumps(job,ensure_ascii=False))
          pathlib.Path('/tmp/recovery-context.json').write_text(json.dumps({'repair_job':repair_job,'repair_path':str(repair_path),'repair_sha':stable(repair_pkg),'check_job':check_job,'new_sha':new_sha,'old_sha':hashlib.sha256(html.encode()).hexdigest()},ensure_ascii=False))
          print('K9_RECOVERY_ARTIFACT_READY',new_sha)
          PY
      - name: Run exact LT PPM writing and trace CHECK
        run: |
          set -euo pipefail
          python3 quality/k9_check.py /tmp/k9-check-job.json /tmp/k9-lt68/LanguageTool-6.8/languagetool-commandline.jar quality/PORTAL_PRODUCTION_MACHINE_V6.7.9.zip --output /tmp/k9-check-submission.json
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/k9-check-submission.json')); r=s['results'][0]
          assert r['lt68_result']['status']=='PASS'
          assert r['ppm679_result']['status']=='PASS'
          assert r['writing_rules_result']['status']=='PASS'
          assert not [x for x in r['writing_rules_result'].get('findings',[]) if x.get('code')=='K9_RULE_SOURCE_TRACE_COUNT_INVALID']
          print('K9_RECOVERY_CHECK_PASS')
          PY
      - name: Persist recovered article and re-arm finalizer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          stable=lambda o: hashlib.sha256(json.dumps(o,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          req=json.load(open('runtime/FINALIZER_REPAIR_REQUEST.json'))
          ctx=json.load(open('/tmp/recovery-context.json'))
          check=json.load(open('/tmp/k9-check-submission.json'))
          ledger=json.load(open('state/ledger.json'))
          item=next(x for x in ledger['items'] if x['item_id']==req['item_id'])
          check_path=f"warehouse/check/{ctx['check_job']}.json"
          pathlib.Path(check_path).write_text(json.dumps(check,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          item.setdefault('products',{})['repair']={'job_id':ctx['repair_job'],'path':ctx['repair_path'],'sha256':ctx['repair_sha']}
          item['products']['check']={'job_id':ctx['check_job'],'path':check_path,'sha256':stable(check)}
          item['revision']=int(item.get('revision') or 0)+1
          item['stages']['repair']='DONE'; item['stages']['check']='DONE'
          ledger['generation']=int(ledger.get('generation') or 0)+1
          pathlib.Path('state/ledger.json').write_text(json.dumps(ledger,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          def count(stage,value): return sum(1 for x in ledger['items'] if x['stages'][stage]==value)
          status={'active_job':None,'contract':'K9_STATUS_V1','fully_done':count('check','DONE'),'ledger_generation':ledger['generation'],
                  'orchestration_mode':'AUTO_CHAIN','ready_for_check':count('check','PENDING'),'ready_for_write':0,
                  'remaining':len(ledger['items'])-count('check','DONE'),'repair_required':count('repair','PENDING'),'research_open':0,
                  'stations':{s:{k:count(s,k) for k in sorted(set([x['stages'][s] for x in ledger['items']])|{'PENDING','DONE'})} for s in ('check','repair','research','write')},
                  'total':len(ledger['items'])}
          assert status['fully_done']==status['total'] and status['remaining']==0 and status['repair_required']==0
          pathlib.Path('state/STATUS.json').write_text(json.dumps(status,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          result={'contract':'K9_FINALIZER_TRACE_RECOVERY_RESULT_V1','status':'PASS','item_id':req['item_id'],'fact_id':req['fact_id'],
                  'old_content_sha256':ctx['old_sha'],'new_content_sha256':ctx['new_sha'],'visible_text_changed':False,
                  'lt68_status':'PASS','ppm679_status':'PASS','writing_rules_status':'PASS','publish_allowed':False}
          pathlib.Path('runtime/K9_FINALIZER_RECOVERY_RESULT.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          current={'contract':'K9_CURRENT_STATE_V3','role':'SOLE_CURRENT_AUTHORITY','concept':'K9','branch':'konzept9/greenfield-20260929',
                   'status':'FINALIZE_PENDING','operational_mode':'SYSTEM_ROUTING_ONLY','active_job':None,'first_open_blocker':None,
                   'next_action':'RUN_FINALIZER','allowed_action':'SYSTEM_ROUTING_ONLY','route_lock':'SYSTEM_ROUTING_ONLY',
                   'supervisor_actions_allowed':False,'code_change_allowed':False,'repair_authorized':False,'all_other_actions':'DENY',
                   'chat_may_route':False,'publish_allowed':False}
          pathlib.Path('CURRENT_STATE.json').write_text(json.dumps(current,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          pathlib.Path('runtime/FINALIZE_REQUIRED').touch()
          pathlib.Path('runtime/FINALIZE_TRIGGER').write_text('recovered-finalizer-trace:'+ctx['new_sha']+'\n')
          pathlib.Path('runtime/FINALIZER_REPAIR_REQUEST.json').unlink()
          PY
          git config user.name 'k9-recovery-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A warehouse/repair warehouse/check state runtime CURRENT_STATE.json
          git commit -m 'K9: recover finalizer trace through exact quality gates'
          git push

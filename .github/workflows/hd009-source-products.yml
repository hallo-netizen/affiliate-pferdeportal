name: HD009 source catalog and automated suitability audit
on:
  push:
    branches: [hobbyroom/hd009-amazon-dfs-products-audit-20261108]
    paths: [.github/workflows/hd009-source-products.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Hobby catalog returns and Hab dataforseo security/control
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re
          base=Path('protocol/PROJECT_MEMORY/PROJEKTE')
          with ZipFile(base/'HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE/CURRENT.zip') as z:
            s=z.read('affiliate-portal-router/includes/class-hdar-hobby-depot-source.php').decode()
            print('HOBBY_SOURCE_CATALOG_LAST')
            print(s[-10500:])
            s=z.read('affiliate-portal-router/hobby-depot-affiliate-router.php').decode()
            for word in ['HDAR_Amazon_Start::render_slot','HDAR_Amazon_Start::launch_active','hdar_amazon_approved_v1','ppar_amazon_search_v1']:
              positions=[m.start() for m in re.finditer(re.escape(word),s)]
              print('SOURCE_CALL',word,'count',len(positions))
              for pos in positions[:7]: print('SOURCE_CALL_CONTEXT',word,re.sub(r'\s+',' ',s[max(0,pos-650):pos+1200])[:1850])
          with ZipFile(base/'EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip') as z:
            s=z.read('affiliate-portal-router/includes/trait-ppar-hb-amazon.php').decode()
            methods=[(m.group(1),m.start()) for m in re.finditer(r'(?:private|public|protected)\s+function\s+([a-zA-Z0-9_]+)\(',s)]
            for n in ['hb_amazon_settings','hb_amazon_dfs_ready','hb_amazon_run_now','hb_amazon_ensure_cron','hb_amazon_exact_match_asin','hb_amazon_dfs_candidate','hb_amazon_category_candidate','hb_amazon_dfs_tick','hb_amazon_dfs_do_tick','hb_amazon_category_results']:
              starts=[x for x in methods if x[0]==n]
              if not starts:continue
              name,start=starts[0]
              nexts=[p for _,p in methods if p>start]
              end=min(nexts) if nexts else len(s)
              print('HAB_METHOD',n,re.sub(r'\s+',' ',s[start:end])[:6200])
          PY

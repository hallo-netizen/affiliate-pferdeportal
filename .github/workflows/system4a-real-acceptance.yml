name: System 4A Real LT68 PPM679 Acceptance

on:
  push:
    branches:
      - 'hobbyroom/system4a-startgate-test-20260914'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Exact head
        run: git rev-parse HEAD
      - name: Download hash-bound LanguageTool 6.8
        run: |
          set -euo pipefail
          mkdir -p /tmp/system4-lt68
          curl --fail --location --retry 3 \
            https://github.com/jxmorris12/language_tool_python/releases/download/LanguageTool-6.8/LanguageTool-6.8.zip \
            -o /tmp/system4-lt68/LanguageTool-6.8.zip
          echo '6a7f6b67b779ae9505f7579f0c41453ea8d1bd72ae750bdc2c55ba974281467d  /tmp/system4-lt68/LanguageTool-6.8.zip' | sha256sum -c -
          unzip -q /tmp/system4-lt68/LanguageTool-6.8.zip -d /tmp/system4-lt68
          test -f /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar
          echo '2122882e800d312a0543d895c56c0a84a9bb131c9b9846efd8fc033129353ae8  /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar' | sha256sum -c -
      - name: Run Point0 Supervisor Worker real regression acceptance
        env:
          PYTHONPATH: isolated_system4
          SYSTEM4_LANGUAGETOOL_JAR: /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar
          SYSTEM4_ACCEPTANCE_OUTPUT_DIR: /tmp/system4-acceptance-output
        run: python3 isolated_system4/real_known_regression_acceptance_v3.py
      - name: Run real parent title owner restart acceptance
        env:
          PYTHONPATH: isolated_system4
          SYSTEM4_LANGUAGETOOL_JAR: /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar
          SYSTEM4_ACCEPTANCE_OUTPUT_DIR: /tmp/system4-acceptance-output
        run: python3 isolated_system4/real_parent_title_repair_acceptance_v1.py
      - name: Run real source acquisition owner restart acceptance
        env:
          PYTHONPATH: isolated_system4
          SYSTEM4_LANGUAGETOOL_JAR: /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar
          SYSTEM4_ACCEPTANCE_OUTPUT_DIR: /tmp/system4-acceptance-output
        run: python3 isolated_system4/real_source_acquisition_owner_acceptance_v1.py
      - name: Run real research owner same-stage acceptance
        env:
          PYTHONPATH: isolated_system4
          SYSTEM4_LANGUAGETOOL_JAR: /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar
          SYSTEM4_ACCEPTANCE_OUTPUT_DIR: /tmp/system4-acceptance-output
        run: python3 isolated_system4/real_research_owner_acceptance_v1.py
      - name: Run real facts owner same-stage acceptance
        env:
          PYTHONPATH: isolated_system4
          SYSTEM4_LANGUAGETOOL_JAR: /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar
          SYSTEM4_ACCEPTANCE_OUTPUT_DIR: /tmp/system4-acceptance-output
        run: python3 isolated_system4/real_facts_owner_acceptance_v1.py
      - name: Run real context owner same-stage acceptance
        env:
          PYTHONPATH: isolated_system4
          SYSTEM4_LANGUAGETOOL_JAR: /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar
          SYSTEM4_ACCEPTANCE_OUTPUT_DIR: /tmp/system4-acceptance-output
        run: python3 isolated_system4/real_context_owner_acceptance_v1.py
      - name: Verify exact real proofs and final files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/system4-acceptance-output')
          r=json.loads((root/'SYSTEM4_REAL_KNOWN_REGRESSION_ACCEPTANCE_V3.json').read_text())
          assert r['status']=='PASS' and r['repair_owner']=='DRAFT_WORKER'
          assert r['ppm_error']=='BLOCKED_KNOWN_REGRESSION_PATTERN'
          assert r['inline_byte_equal'] is True and r['publish_allowed'] is False
          assert (root/'SYSTEM4_PPM_KNOWN_REGRESSION_REPAIRED_WORDPRESS.json').is_file()

          tr=json.loads((root/'SYSTEM4_REAL_PARENT_TITLE_REPAIR_ACCEPTANCE_V1.json').read_text())
          assert tr['status']=='PASS' and tr['repair_owner']=='PARENT_TITLE_MACHINE'
          assert tr['return_route']=='PARENT_LAUNCH' and tr['old_point0_immutable'] is True
          assert tr['old_point0_sha256'] != tr['new_point0_sha256']
          assert tr['inline_byte_equal'] is True and tr['publish_allowed'] is False
          assert (root/'SYSTEM4_PARENT_TITLE_REPAIRED_WORDPRESS.json').is_file()

          sr=json.loads((root/'SYSTEM4_REAL_SOURCE_ACQUISITION_OWNER_ACCEPTANCE_V1.json').read_text())
          assert sr['status']=='PASS' and sr['initial_error']=='SOURCE_HTTP_FAIL:0:0:403'
          assert sr['repair_owner']=='SOURCE_ACQUISITION_MACHINE' and sr['return_route']=='SOURCE_ACQUISITION_STAGE'
          assert sr['point0_absent_after_failure'] is True
          assert sr['point0_created_only_after_successful_reacquisition'] is True
          assert sr['source_transport']=='REAL_LOCAL_HTTP_403_THEN_200'
          assert sr['inline_byte_equal'] is True and sr['publish_allowed'] is False
          assert (root/'SYSTEM4_SOURCE_ACQUISITION_REPAIRED_WORDPRESS.json').is_file()

          rr=json.loads((root/'SYSTEM4_REAL_RESEARCH_OWNER_ACCEPTANCE_V1.json').read_text())
          assert rr['status']=='PASS' and rr['initial_error']=='RESEARCH_SOURCE_HASH_MISMATCH:0'
          assert rr['repair_owner']=='RESEARCH_WORKER' and rr['return_route']=='RESEARCH_STAGE'
          assert rr['state_frozen_on_return'] is True and rr['valid_but_unbound_research_policy']=='HARD_BLOCK_BY_SUPERVISOR'
          assert rr['inline_byte_equal'] is True and rr['publish_allowed'] is False
          assert (root/'SYSTEM4_RESEARCH_OWNER_REPAIRED_WORDPRESS.json').is_file()

          qr=json.loads((root/'SYSTEM4_REAL_FACTS_OWNER_ACCEPTANCE_V1.json').read_text())
          assert qr['status']=='PASS' and qr['initial_error']=='FACT_EVIDENCE_NOT_IN_SOURCE:0'
          assert qr['repair_owner']=='FACTS_WORKER' and qr['return_route']=='FACTS_STAGE'
          assert qr['state_frozen_on_return'] is True and qr['inline_byte_equal'] is True
          assert qr['publish_allowed'] is False
          assert (root/'SYSTEM4_FACTS_OWNER_REPAIRED_WORDPRESS.json').is_file()

          cr=json.loads((root/'SYSTEM4_REAL_CONTEXT_OWNER_ACCEPTANCE_V1.json').read_text())
          assert cr['status']=='PASS' and cr['initial_error']=='FACT_PACK_CLAIMS_TOO_LOW'
          assert cr['repair_owner']=='CONTEXT_WORKER' and cr['return_route']=='CONTEXT_STAGE'
          assert cr['state_frozen_on_return'] is True and cr['inline_byte_equal'] is True
          assert cr['publish_allowed'] is False
          assert (root/'SYSTEM4_CONTEXT_OWNER_REPAIRED_WORDPRESS.json').is_file()
          print('SYSTEM4_REAL_SOURCE_DRAFT_TITLE_RESEARCH_FACTS_CONTEXT_OWNER_TO_FILE_PASS')
          PY
      - name: Upload acceptance proof
        uses: actions/upload-artifact@v4
        with:
          name: system4a-real-acceptance-${{ github.sha }}
          path: /tmp/system4-acceptance-output/
          if-no-files-found: error
          retention-days: 1

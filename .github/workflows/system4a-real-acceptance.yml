name: System 4A Real LT68 PPM679 Acceptance

on:
  push:
    branches:
      - 'hobbyroom/system4a-startgate-test-20260914'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Exact head
        run: git rev-parse HEAD
      - name: Download hash-bound LanguageTool 6.8
        run: |
          set -euo pipefail
          mkdir -p /tmp/system4-lt68
          curl --fail --location --retry 3 \
            https://github.com/jxmorris12/language_tool_python/releases/download/LanguageTool-6.8/LanguageTool-6.8.zip \
            -o /tmp/system4-lt68/LanguageTool-6.8.zip
          echo '6a7f6b67b779ae9505f7579f0c41453ea8d1bd72ae750bdc2c55ba974281467d  /tmp/system4-lt68/LanguageTool-6.8.zip' | sha256sum -c -
          unzip -q /tmp/system4-lt68/LanguageTool-6.8.zip -d /tmp/system4-lt68
          test -f /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar
          echo '2122882e800d312a0543d895c56c0a84a9bb131c9b9846efd8fc033129353ae8  /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar' | sha256sum -c -
      - name: Prepare fresh off-domain article canary
        env:
          PYTHONPATH: isolated_system4
        run: python3 isolated_system4/fresh_article_canary_v1.py prepare /tmp/system4-fresh-canary
      - name: Machine-load and seal neutral canary sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/system4-fresh-canary/sources
          curl --fail --location --retry 3 'https://www.umweltbundesamt.de/themen/gesundheit/umwelteinfluesse-auf-den-menschen/innenraumluft' -o /tmp/system4-fresh-canary/sources/uba-innenraumluft.html
          curl --fail --location --retry 3 'https://www.umweltbundesamt.de/themen/gesundheit/umwelteinfluesse-auf-den-menschen/innenraumluft/infektioese-aerosole-in-innenraeumen' -o /tmp/system4-fresh-canary/sources/uba-luftfeuchte.html
          curl --fail --location --retry 3 'https://www.umweltbundesamt.de/umwelttipps-fuer-den-alltag/richtiges-heizen-schuetzt-das-klima-den-geldbeutel' -o /tmp/system4-fresh-canary/sources/uba-heizen-lueften.html
          python3 - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path('/tmp/system4-fresh-canary')
          rows=[]
          urls={
            'uba-innenraumluft.html':'https://www.umweltbundesamt.de/themen/gesundheit/umwelteinfluesse-auf-den-menschen/innenraumluft',
            'uba-luftfeuchte.html':'https://www.umweltbundesamt.de/themen/gesundheit/umwelteinfluesse-auf-den-menschen/innenraumluft/infektioese-aerosole-in-innenraeumen',
            'uba-heizen-lueften.html':'https://www.umweltbundesamt.de/umwelttipps-fuer-den-alltag/richtiges-heizen-schuetzt-das-klima-den-geldbeutel',
          }
          for i,(name,url) in enumerate(urls.items(),1):
            raw=(root/'sources'/name).read_bytes()
            rows.append({'source_id':f'canary-source-{i}','file':'sources/'+name,'source_url':url,'sha256':hashlib.sha256(raw).hexdigest(),'byte_length':len(raw)})
          out={'contract':'SYSTEM4_CANARY_MACHINE_SOURCE_MANIFEST_V1','retrieved_at':datetime.now(timezone.utc).isoformat(),'sources':rows,'network_access_for_worker_required':False}
          (root/'source_manifest.json').write_text(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          PY
      - name: Require Codex API secret for live worker canary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo 'SYSTEM4_FRESH_ARTICLE_CANARY_BLOCKED:OPENAI_API_KEY_SECRET_MISSING'
            exit 4
          fi
      - name: Run isolated Codex live worker for fresh off-domain article
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          working-directory: /tmp/system4-fresh-canary
          effort: high
          prompt: |
            You are the live writing worker for a fail-closed acceptance canary.
            Work ONLY inside /tmp/system4-fresh-canary. Do not read the repository, do not reuse any prewritten article, and do not use web search.
            Read challenge.json, source_manifest.json, and only the machine-loaded files under sources/.

            The exact article topic is in challenge.json. It is intentionally unrelated to horses.
            Produce FOUR new files in this workspace and nothing else:

            1) research.json
               contract = SYSTEM4_RESEARCH_EVIDENCE_V1
               sources = a list based only on source_manifest.json and the captured source files. Each row needs source_id, source_title, source_url, retrieved_at, evidence, and snapshot_sha256 where snapshot_sha256 is SHA256 of the UTF-8 evidence string.

            2) facts.json
               contract = SYSTEM4_FACTS_EVIDENCE_V1
               claims = at least 4 factual claims. Each claim needs fact_id, source_id, statement, evidence_text, and evidence_text_sha256. Every evidence_text must come from research.json and its hash must match.

            3) article.html
               Write a genuinely NEW German FAQ article answering exactly: "Warum beschlägt ein Badezimmerspiegel nach dem Duschen?"
               Use the supplied evidence only. Explain the physical mechanism clearly and accurately. Include useful practical context about warm humid air, colder surfaces, saturation/condensation and ventilation. Aim for 900-1200 German words so this is a real writing sample, not a stub. Use clean semantic HTML with an article root, paragraphs, several H2 sections and one useful table. Do not include external links. Do not mention horses, horse trailers, towing, loading horses or any horse-domain subject. Do not copy any article body from elsewhere.

            4) worker_provenance.json
               contract = SYSTEM4_FRESH_WORKER_PROVENANCE_V1
               challenge_nonce = exact nonce from challenge.json
               generated_after_start_gate = true
               prewritten_fixture_used = false
               generation_mode = LIVE_WORKER_GENERATION
               article_sha256 = SHA256 of article.html after decoding UTF-8 and applying Python .strip(), then re-encoding UTF-8.

            Before finishing, independently reopen all four files and verify JSON syntax, hashes, the exact topic, and that article.html contains neither "Pferd" nor "Pferdeanhänger".
            Do not modify challenge.json or source_manifest.json.
      - name: Require genuinely new live-worker article before any acceptance PASS
        env:
          PYTHONPATH: isolated_system4
        run: python3 isolated_system4/fresh_article_canary_v1.py verify /tmp/system4-fresh-canary
      - name: Run Point0 Supervisor Worker real regression acceptance
        env:
          PYTHONPATH: isolated_system4
          SYSTEM4_LANGUAGETOOL_JAR: /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar
          SYSTEM4_ACCEPTANCE_OUTPUT_DIR: /tmp/system4-acceptance-output
        run: python3 isolated_system4/real_known_regression_acceptance_v3.py
      - name: Run real parent title owner restart acceptance
        env:
          PYTHONPATH: isolated_system4
          SYSTEM4_LANGUAGETOOL_JAR: /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar
          SYSTEM4_ACCEPTANCE_OUTPUT_DIR: /tmp/system4-acceptance-output
        run: python3 isolated_system4/real_parent_title_repair_acceptance_v1.py
      - name: Run real portal link owner boundary acceptance
        env:
          PYTHONPATH: isolated_system4
          SYSTEM4_LANGUAGETOOL_JAR: /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar
          SYSTEM4_ACCEPTANCE_OUTPUT_DIR: /tmp/system4-acceptance-output
        run: python3 isolated_system4/real_portal_link_owner_acceptance_v1.py
      - name: Run real source acquisition owner restart acceptance
        env:
          PYTHONPATH: isolated_system4
          SYSTEM4_LANGUAGETOOL_JAR: /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar
          SYSTEM4_ACCEPTANCE_OUTPUT_DIR: /tmp/system4-acceptance-output
        run: python3 isolated_system4/real_source_acquisition_owner_acceptance_v1.py
      - name: Run real research owner same-stage acceptance
        env:
          PYTHONPATH: isolated_system4
          SYSTEM4_LANGUAGETOOL_JAR: /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar
          SYSTEM4_ACCEPTANCE_OUTPUT_DIR: /tmp/system4-acceptance-output
        run: python3 isolated_system4/real_research_owner_acceptance_v1.py
      - name: Run real facts owner same-stage acceptance
        env:
          PYTHONPATH: isolated_system4
          SYSTEM4_LANGUAGETOOL_JAR: /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar
          SYSTEM4_ACCEPTANCE_OUTPUT_DIR: /tmp/system4-acceptance-output
        run: python3 isolated_system4/real_facts_owner_acceptance_v1.py
      - name: Run real context owner same-stage acceptance
        env:
          PYTHONPATH: isolated_system4
          SYSTEM4_LANGUAGETOOL_JAR: /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar
          SYSTEM4_ACCEPTANCE_OUTPUT_DIR: /tmp/system4-acceptance-output
        run: python3 isolated_system4/real_context_owner_acceptance_v1.py
      - name: Verify real proofs and create chat delivery candidate
        env:
          PYTHONPATH: isolated_system4
        run: |
          python3 - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          import handoff_transport

          root=Path('/tmp/system4-acceptance-output')
          proofs=[
            'SYSTEM4_REAL_KNOWN_REGRESSION_ACCEPTANCE_V3.json',
            'SYSTEM4_REAL_PARENT_TITLE_REPAIR_ACCEPTANCE_V1.json',
            'SYSTEM4_REAL_PORTAL_LINK_OWNER_ACCEPTANCE_V1.json',
            'SYSTEM4_REAL_SOURCE_ACQUISITION_OWNER_ACCEPTANCE_V1.json',
            'SYSTEM4_REAL_RESEARCH_OWNER_ACCEPTANCE_V1.json',
            'SYSTEM4_REAL_FACTS_OWNER_ACCEPTANCE_V1.json',
            'SYSTEM4_REAL_CONTEXT_OWNER_ACCEPTANCE_V1.json',
          ]
          for name in proofs:
            obj=json.loads((root/name).read_text())
            assert obj['status']=='PASS', name
            assert obj['publish_allowed'] is False, name
            assert obj['inline_byte_equal'] is True, name

          src=root/'SYSTEM4_PORTAL_LINK_REALIZATION_REPAIRED_WORDPRESS.json'
          payload, raw=handoff_transport.read_validate_handoff(src)
          wr=payload['wordpress_review']
          assert wr['file_format']=='JSON'
          assert wr['mime_type']=='application/json'
          assert wr['intended_next_step']=='WORDPRESS_DIRECT_IMPORT'
          assert wr['plugin_name']=='Portal SEO Editorial Plan Compiler'
          assert wr['plugin_version_verified_against']==handoff_transport.DIRECT_IMPORT_PLUGIN_VERSION
          assert wr['ppm_version_verified_against']=='6.7.9'
          assert wr['direct_wordpress_upload_ready'] is True
          assert wr['direct_upload_block_reason'] is None
          assert wr['required_downstream_components']==[]
          assert payload['publish_allowed'] is False
          assert len(payload['articles'])>=1

          candidate=root/handoff_transport.HANDOFF_FILENAME
          shutil.copyfile(src,candidate)
          assert candidate.read_bytes()==raw
          digest=hashlib.sha256(raw).hexdigest()
          manifest={
            'contract':'SYSTEM4_CHAT_DELIVERY_CANDIDATE_V1',
            'status':'REMOTE_PASS_PENDING_CHAT_DELIVERY',
            'filename':candidate.name,
            'mime_type':'application/json',
            'sha256':digest,
            'byte_length':len(raw),
            'handoff_contract':payload['contract'],
            'article_count':len(payload['articles']),
            'wordpress_plugin':wr['plugin_name'],
            'wordpress_plugin_version':wr['plugin_version_verified_against'],
            'ppm_version':wr['ppm_version_verified_against'],
            'intended_next_step':wr['intended_next_step'],
            'direct_wordpress_upload_ready':True,
            'publish_allowed':False,
            'chat_delivery_required_for_final_pass':True,
          }
          (root/'SYSTEM4_CHAT_DELIVERY_CANDIDATE_V1.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print(json.dumps(manifest,ensure_ascii=False,sort_keys=True))
          PY
      - name: Upload acceptance proof and chat delivery candidate
        uses: actions/upload-artifact@v4
        with:
          name: system4a-real-acceptance-${{ github.sha }}
          path: /tmp/system4-acceptance-output/
          if-no-files-found: error
          retention-days: 1

name: System4A temp state hash
on:
  push:
    branches:
      - 'hobbyroom/system4a-single-production-street-20260917'
permissions:
  contents: write
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize state and refresh root binding
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          state=Path('control/startmaster0107/CURRENT_STATE.json')
          root=Path('control/startmaster0107/PFERDE_ATELIER_START_HERE.json')
          value=json.loads(state.read_text(encoding='utf-8'))
          state.write_text(json.dumps(value,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          digest=hashlib.sha256(state.read_bytes()).hexdigest()
          r=json.loads(root.read_text(encoding='utf-8'))
          r['current_state_sha256']=digest
          root.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('CURRENT_STATE_SHA256='+digest)
          PY
          sha256sum control/startmaster0107/CURRENT_STATE.json
          sha256sum control/startmaster0107/STEP_107007_RUN_NEW_ARTICLE_BATCH_NO_STOP.json
          sha256sum control/startmaster0107/system4_107007_entry.py
          if git diff --quiet -- control/startmaster0107/CURRENT_STATE.json control/startmaster0107/PFERDE_ATELIER_START_HERE.json; then
            echo 'NO_NORMALIZATION_CHANGE'
            exit 0
          fi
          git config user.name 'hallo-netizen'
          git config user.email 'hallo@oliver-beil.de'
          git add control/startmaster0107/CURRENT_STATE.json control/startmaster0107/PFERDE_ATELIER_START_HERE.json
          git commit -m 'system4: normalize 107007 state hash binding'
          git push origin HEAD:hobbyroom/system4a-single-production-street-20260917

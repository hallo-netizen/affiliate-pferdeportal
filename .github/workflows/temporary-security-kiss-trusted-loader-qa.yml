name: TEMP security central checker one-time real-base regression
on:
  push:
    branches: [security/kiss-single-central-hardlock-20261108]
permissions: {contents: read}
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the ACTUAL old PR base without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/pste-mini-workflow-kiss-20261107
          fetch-depth: 1
          persist-credentials: false
      - name: Prove old base lacks gate, protected main supplies genuine code, run original selftests
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse HEAD)"
          if git cat-file -e "${BASE_SHA}:control/paul-scope-gate/paul_scope_gate.py" 2>/dev/null; then
            echo "BASE_ALREADY_HAS_GATE_UNEXPECTED_FOR_THIS_REPRO";exit 1
          fi
          echo "PASS old PR base really lacks security checker"
          git fetch --no-tags --depth=1 origin refs/heads/main
          TRUSTED_MAIN="$(git rev-parse FETCH_HEAD)"
          TRUSTED_PATH="control/paul-scope-gate/paul_scope_gate.py"
          git cat-file -e "${TRUSTED_MAIN}:${TRUSTED_PATH}"
          git show "${TRUSTED_MAIN}:${TRUSTED_PATH}" > /tmp/pferde-atelier-trusted-paul-gate.py
          test "$(git hash-object /tmp/pferde-atelier-trusted-paul-gate.py)" = "$(git rev-parse "${TRUSTED_MAIN}:${TRUSTED_PATH}")"
          test -s /tmp/pferde-atelier-trusted-paul-gate.py
          echo "PASS protected main supplies genuine central checker with exact git blob"
          PYTHONDONTWRITEBYTECODE=1 python3 /tmp/pferde-atelier-trusted-paul-gate.py selftest
          echo "PASS original authoritative PAUL gate selftests"
          git fetch --no-tags --depth=1 origin refs/heads/fix/pste-kisten-einmalige-pruefung-20261107
          HEAD_SHA="$(git rev-parse FETCH_HEAD)"
          set +e
          PYTHONDONTWRITEBYTECODE=1 python3 /tmp/pferde-atelier-trusted-paul-gate.py verify-pr \
            fix/pste-kisten-einmalige-pruefung-20261107 "$HEAD_SHA" "$BASE_SHA" > /tmp/real-pr-gate.txt 2>&1
          CODE=$?
          set -e
          cat /tmp/real-pr-gate.txt
          if grep -Eq "(can't open file|No such file or directory:.*paul_scope_gate\.py)" /tmp/real-pr-gate.txt; then
            echo "FAIL old error still occurs";exit 1
          fi
          echo "REAL_PR_682_NEW_CENTRAL_CHECKER_EXIT=$CODE"
          echo "PASS original source absence no longer blocks running real central gate"

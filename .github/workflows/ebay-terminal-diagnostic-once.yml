name: eBay terminal diagnostic once
on:
  push:
    paths:
      - '.github/workflows/ebay-terminal-diagnostic-once.yml'

permissions:
  contents: read

jobs:
  read-terminal-state:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read failed external_tick_v2 response
        shell: bash
        run: |
          set -euo pipefail
          URL='https://pferde-atelier.de/wp-json/affiliate-zentrale/v1/ebay/tick?diagnostic_once=${{ github.run_id }}-${{ github.run_attempt }}'
          code=$(curl --silent --show-error --output body.json --write-out '%{http_code}' --request POST --max-time 45 --header 'Cache-Control: no-store' "$URL")
          echo "http=$code"
          cat body.json
          echo
          test "$code" = '200'
          python3 - <<'PY'
          import json
          d=json.load(open('body.json'))
          assert d.get('contract')=='external_tick_v2'
          assert d.get('status')=='failed'
          print('status=',d.get('status'),'run_uuid=',d.get('run_uuid'),'error_code=',d.get('error_code'),'phase=',d.get('phase'),'reason=',d.get('reason'))
          PY

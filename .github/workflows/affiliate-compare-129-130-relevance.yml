name: Affiliate compare 129 130 relevance only

on:
  push:
    branches: [affiliate-e2e-repro-20260920]
    paths:
      - '.github/workflows/affiliate-compare-129-130-relevance.yml'
      - 'e2e/compare_129_130_relevance.php'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install WP and exact 130
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          rm -rf /tmp/wp /tmp/p && mkdir /tmp/wp /tmp/p
          unzip -q e2e/fixtures/AFFILIATE_ZENTRALE_V6.72.130_EXACT.zip -d /tmp/p
          wp core download --version=7.1 --path=/tmp/wp
          wp config create --path=/tmp/wp --dbname=wordpress --dbuser=wp --dbpass=wp --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path=/tmp/wp --url=https://pferde-atelier.de --title=C --admin_user=admin --admin_password=e2etest --admin_email=e2e@example.test
          cp -a /tmp/p/affiliate-portal-router /tmp/wp/wp-content/plugins/
          wp plugin activate affiliate-portal-router --path=/tmp/wp
      - name: Seed historical inventory
        env:
          AFF_E2E_FIXTURE: ${{ github.workspace }}/e2e/fixtures/real-wxr-product-campaigns-20260915.json.gz
        run: |
          set -euo pipefail
          wp eval-file "$GITHUB_WORKSPACE/e2e/seed_real_state_inner.php" --path=/tmp/wp >/tmp/seed.log
          grep -Fx 'SEEDED_CAMPAIGNS=2012' /tmp/seed.log
      - name: Compare exact filters
        run: |
          set -euo pipefail
          wp eval-file "$GITHUB_WORKSPACE/e2e/compare_129_130_relevance.php" --path=/tmp/wp | tee /tmp/compare.log
          grep -Fx 'BEST_SPEC=520' /tmp/compare.log

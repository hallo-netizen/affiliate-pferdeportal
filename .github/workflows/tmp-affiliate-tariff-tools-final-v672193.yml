name: TEMP Affiliate Tariff Tools Final ZIP 6.72.193

on:
  push:
    branches: [affiliate-release-current]
    paths:
      - '.github/workflows/tmp-affiliate-tariff-tools-final-v672193.yml'
      - 'AFFILIATE_HOBBYRAUM/test_tariff_tools_kiss_v672193.php'
      - 'AFFILIATE_HOBBYRAUM/test_tarifcheck_html_verify_before_assign_v672192.php'
      - 'release/affiliate-zentrale/current/affiliate-portal-router/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-zip-wordpress-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Reprove isolated 6.72.192 runtime preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          base='aa3bdbbae8520d6f5e9bd517be0d9325169177f8'
          root='release/affiliate-zentrale/current/affiliate-portal-router'
          changed=subprocess.check_output(['git','diff','--name-only',base+'...HEAD','--',root],text=True).splitlines()
          expected=[root+'/includes/trait-ppar-tariff-tools.php',root+'/pferdeportal-affiliate-router.php',root+'/readme.txt']
          assert sorted(changed)==sorted(expected), changed
          p=root+'/pferdeportal-affiliate-router.php'
          old=subprocess.check_output(['git','show',base+':'+p],text=True)
          cur=Path(p).read_text().replace('Version: 6.72.193','Version: 6.72.192').replace("const VERSION = '6.72.193';","const VERSION = '6.72.192';")
          for line in [
              "require_once __DIR__ . '/includes/trait-ppar-tariff-tools.php';\n",
              "    use PPAR_Tariff_Tools_Trait;\n",
              "        $this->tariff_tools_register_hooks();\n",
              "        add_shortcode('affiliate_rechner', array($this, 'shortcode_tariff_tool'));\n",
              "        add_submenu_page('affiliate-portal-zentrale','Tarifrechner','Tarifrechner','manage_options','affiliate-portal-tariff-tools',array($this,'render_tariff_tools_page'));\n",
          ]:
              assert line in cur, line
              cur=cur.replace(line,'',1)
          assert cur==old
          print('PASS 6.72.192 runtime source preserved outside tariff-tool wiring')
          PY

      - name: Build exact manifest and ZIP
        shell: bash
        run: |
          set -euo pipefail
          ROOT=release/affiliate-zentrale/current/affiliate-portal-router
          grep -F "Version: 6.72.193" "$ROOT/pferdeportal-affiliate-router.php"
          grep -F "const VERSION = '6.72.193';" "$ROOT/pferdeportal-affiliate-router.php"
          (cd release/affiliate-zentrale/current && find affiliate-portal-router -type f -print0 | sort -z | xargs -0 sha256sum) > release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt
          test "$(grep -cve '^[[:space:]]*$' release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt)" = "28"
          rm -f /tmp/AFFILIATE_ZENTRALE_6.72.193.zip
          (cd release/affiliate-zentrale/current && zip -qr /tmp/AFFILIATE_ZENTRALE_6.72.193.zip affiliate-portal-router)
          echo "ZIP_SHA256=$(sha256sum /tmp/AFFILIATE_ZENTRALE_6.72.193.zip | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "ZIP_BYTES=$(stat -c%s /tmp/AFFILIATE_ZENTRALE_6.72.193.zip)" >> "$GITHUB_ENV"
          echo "MANIFEST_SHA256=$(sha256sum release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Fresh unpack byte identity and lint
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final193
          mkdir -p /tmp/final193
          unzip -q /tmp/AFFILIATE_ZENTRALE_6.72.193.zip -d /tmp/final193
          ROOT=/tmp/final193/affiliate-portal-router
          test "$(find "$ROOT" -type f | wc -l)" = "28"
          test "$(find "$ROOT" -type f -name '*.php' | wc -l)" = "22"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('/tmp/final193')
          expected={}
          for line in Path('release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt').read_text().splitlines():
              if not line.strip(): continue
              h,rel=line.split('  ',1); expected[rel]=h
          files={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert set(files)==set(expected), (set(expected)-set(files),set(files)-set(expected))
          bad=[p for p,h in files.items() if expected[p]!=h]
          assert not bad,bad
          print('PASS final ZIP 28/28 byte identity')
          PY
          find "$ROOT" -type f -name '*.php' -print0 | xargs -0 -n1 php -l | tee /tmp/final193-lint.log
          test "$(grep -c '^No syntax errors detected' /tmp/final193-lint.log)" = "22"
          echo "PASS final ZIP PHP lint 22/22"

      - name: Install exact ZIP into fresh WordPress
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-site
          mkdir -p /tmp/wp-site
          /tmp/wp core download --path=/tmp/wp-site --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title='Affiliate Final 6.72.193' --admin_user=admin --admin_password='ci-password-123!' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp-site/wp-content/mu-plugins
          cat >/tmp/wp-site/wp-content/mu-plugins/pferde-e2e-design-contract.php <<'PHP'
          <?php
          if (!class_exists('Pferde_Template_Kit')) {
              class Pferde_Template_Kit {
                  public static function affiliate_contract_version(){ return '1.0'; }
                  public static function design_profile(){ return 'pferde_atelier'; }
                  public static function design_profile_contract_version(){ return '1.0'; }
                  public static function affiliate_page_type($page_id){ return get_post_field('post_parent',$page_id) ? 'category' : 'hub1'; }
              }
          }
          add_action('init', static function(){
              if (!post_type_exists('uge_term')) register_post_type('uge_term',array('public'=>true,'supports'=>array('title','editor')));
              if (!taxonomy_exists('uge_group')) register_taxonomy('uge_group',array('uge_term'),array('public'=>true,'hierarchical'=>true));
              if (!post_type_exists('pa_breed')) register_post_type('pa_breed',array('public'=>true,'supports'=>array('title','editor')));
              if (!taxonomy_exists('pa_breed_group')) register_taxonomy('pa_breed_group',array('pa_breed'),array('public'=>true,'hierarchical'=>true));
              if (!post_type_exists('hp_listing')) register_post_type('hp_listing',array('public'=>true,'supports'=>array('title','editor')));
              if (!taxonomy_exists('hp_listing_category')) register_taxonomy('hp_listing_category',array('hp_listing'),array('public'=>true,'hierarchical'=>true));
          },1);
          PHP
          /tmp/wp plugin install /tmp/AFFILIATE_ZENTRALE_6.72.193.zip --activate --path=/tmp/wp-site
          /tmp/wp eval 'if(Pferdeportal_Affiliate_Router::VERSION!=="6.72.193"){exit(2);} echo "PASS exact ZIP 6.72.193 active\n";' --path=/tmp/wp-site

      - name: Exact ZIP tariff-tool KISS proof
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp eval-file "$GITHUB_WORKSPACE/AFFILIATE_HOBBYRAUM/test_tariff_tools_kiss_v672193.php" --path=/tmp/wp-site | tee /tmp/final193-tools.log
          grep -F 'PASS ordinary_content_zero_tariff_option_reads reads=0' /tmp/final193-tools.log
          grep -F 'PASS multiple_placeholders_one_option_load reads=1' /tmp/final193-tools.log
          grep -F 'PASS central_code_update_immediate' /tmp/final193-tools.log
          grep -F 'PASS placeholder_stable_after_rename' /tmp/final193-tools.log
          grep -F 'PASS inactive_tool_renders_empty' /tmp/final193-tools.log
          grep -F 'PASS single_option_not_autoloaded' /tmp/final193-tools.log
          grep -F 'TARIFF_TOOLS_KISS_672193_COMPLETE' /tmp/final193-tools.log

      - name: Exact ZIP previous banner contract regression
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp eval-file "$GITHUB_WORKSPACE/AFFILIATE_HOBBYRAUM/test_tarifcheck_html_verify_before_assign_v672192.php" --path=/tmp/wp-site | tee /tmp/final193-banner.log
          grep -F 'PASS no_target_before_technical_verification_credit-ok' /tmp/final193-banner.log
          grep -F 'PASS credit_targets_after_verification_66 count=66' /tmp/final193-banner.log
          grep -F 'PASS insurance_targets_after_verification_14 count=14' /tmp/final193-banner.log
          grep -F 'PASS broken_image_never_gets_target' /tmp/final193-banner.log
          grep -F 'TARIFCHECK_HTML_VERIFY_BEFORE_ASSIGN_672192_COMPLETE' /tmp/final193-banner.log
          echo "PASS previous 6.72.192 banner contract preserved"

      - name: Publish exact tested installer
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/AFFILIATE_ZENTRALE_6.72.193.zip release/affiliate-zentrale/artifacts/final/AFFILIATE_ZENTRALE_6.72.193.zip
          git config user.name "hallo-netizen"
          git config user.email "hallo@oliver-beil.de"
          git add release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt release/affiliate-zentrale/artifacts/final/AFFILIATE_ZENTRALE_6.72.193.zip
          git commit -m "affiliate: publish tested 6.72.193 tariff-tool installer"
          git push origin HEAD:affiliate-release-current
          echo "PASS FINAL_ZIP sha256=$ZIP_SHA256 bytes=$ZIP_BYTES manifest_sha256=$MANIFEST_SHA256"

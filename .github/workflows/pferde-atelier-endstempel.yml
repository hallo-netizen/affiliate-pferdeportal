name: Pferde Atelier Endstempel

on:
  workflow_dispatch:
    inputs:
      source_manifest_ref:
        description: Exact control/startmaster0107/recovery_sources/<batch>/MANIFEST.json path
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'control/startmaster0107/recovery_sources/**/MANIFEST.json'

permissions:
  contents: read

concurrency:
  group: pferde-atelier-endstempel-${{ github.sha }}
  cancel-in-progress: false

jobs:
  endstempel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      final_filename: ${{ steps.stamp.outputs.final_filename }}
      final_sha256: ${{ steps.stamp.outputs.final_sha256 }}
      batch_sha256: ${{ steps.stamp.outputs.batch_sha256 }}
      article_count: ${{ steps.stamp.outputs.article_count }}
    steps:
      - name: Checkout exact GitHub commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve exactly one durable source manifest
        id: source
        shell: bash
        env:
          INPUT_SOURCE: ${{ inputs.source_manifest_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ref="$INPUT_SOURCE"
          else
            mapfile -t refs < <(git diff-tree -m --no-commit-id --name-only -r "$GITHUB_SHA" | sort -u | grep -E '^control/startmaster0107/recovery_sources/[0-9a-f]{64}/MANIFEST\.json$' || true)
            [ "${#refs[@]}" -eq 1 ] || { echo "EXACTLY_ONE_SOURCE_REQUIRED:${#refs[@]}"; exit 2; }
            ref="${refs[0]}"
          fi
          [[ "$ref" =~ ^control/startmaster0107/recovery_sources/[0-9a-f]{64}/MANIFEST\.json$ ]] || { echo 'SOURCE_REF_INVALID'; exit 2; }
          test -f "$ref" || { echo 'SOURCE_MANIFEST_MISSING'; exit 2; }
          echo "source_ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Build and sign final JSON entirely inside GitHub
        id: stamp
        shell: bash
        env:
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
          ENDSTEMPEL_PRIVATE_KEY: ${{ secrets.ENDSTEMPEL_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${ENDSTEMPEL_PRIVATE_KEY:-}" || { echo 'ENDSTEMPEL_SECRET_MISSING'; exit 2; }
          umask 077
          trap 'rm -f /tmp/pferde_github_signer.py /tmp/github-final-result.json' EXIT
          cat > /tmp/pferde_github_signer.py <<'PY'
          #!/usr/bin/env python3
          import base64,hashlib,json,os,re,sys
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          CONTRACT='PFERDE_ATELIER_GITHUB_FINAL_SIGN_REQUEST_V1'
          raw=os.environ.get('ENDSTEMPEL_PRIVATE_KEY','').encode()
          if not raw: raise SystemExit('ENDSTEMPEL_SECRET_MISSING')
          try:
              key=serialization.load_ssh_private_key(raw,password=None) if b'OPENSSH PRIVATE KEY' in raw else serialization.load_pem_private_key(raw,password=None)
          except Exception: raise SystemExit('ENDSTEMPEL_PRIVATE_KEY_INVALID')
          if not isinstance(key,Ed25519PrivateKey): raise SystemExit('ENDSTEMPEL_PRIVATE_KEY_NOT_ED25519')
          pub=key.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          pub_b64=base64.b64encode(pub).decode('ascii'); pub_sha=hashlib.sha256(pub).hexdigest()
          ident={'signing_key_id':'github-secret-ed25519-'+pub_sha[:16],'signing_public_key_sha256':pub_sha,'public_key_b64':pub_b64}
          if len(sys.argv)==2 and sys.argv[1]=='--identity': print(json.dumps(ident,separators=(',',':'))); raise SystemExit(0)
          try: req=json.loads(sys.stdin.read())
          except Exception: raise SystemExit('SIGN_REQUEST_INVALID')
          required={'contract','manifest_sha256','batch_sha256','source_manifest_sha256','article_count','algorithm'}
          if not isinstance(req,dict) or set(req)!=required or req.get('contract')!=CONTRACT or req.get('algorithm')!='ED25519': raise SystemExit('SIGN_REQUEST_FIELDS_INVALID')
          for field in ('manifest_sha256','batch_sha256','source_manifest_sha256'):
              if not re.fullmatch(r'[0-9a-f]{64}',str(req.get(field) or '')): raise SystemExit('SIGN_REQUEST_HASH_INVALID')
          if req.get('article_count')!=7: raise SystemExit('SIGN_REQUEST_COUNT_INVALID')
          out=dict(ident); out['signature_b64']=base64.b64encode(key.sign(req['manifest_sha256'].encode('ascii'))).decode('ascii')
          print(json.dumps(out,separators=(',',':')))
          PY
          chmod 700 /tmp/pferde_github_signer.py
          identity="$(/tmp/pferde_github_signer.py --identity)"
          export ENDSTEMPEL_HSM_CMD=/tmp/pferde_github_signer.py
          export ENDSTEMPEL_TRUSTED_KEY_ID="$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["signing_key_id"])' "$identity")"
          export ENDSTEMPEL_TRUSTED_PUBLIC_KEY_SHA256="$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["signing_public_key_sha256"])' "$identity")"
          export ENDSTEMPEL_TRUSTED_PUBLIC_KEY_B64="$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["public_key_b64"])' "$identity")"
          python3 control/startmaster0107/GITHUB_FINAL_RELEASE.py finalize "$SOURCE_REF" | tee /tmp/github-final-result.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib,json,pathlib
          x=json.load(open('/tmp/github-final-result.json',encoding='utf-8'))
          if x.get('ok') is not True or x.get('status')!='GITHUB_FINAL_RELEASE_PASS' or x.get('publish_allowed') is not False or x.get('content_mutation_performed') is not False: raise SystemExit('GITHUB_FINAL_NOT_PASS')
          p=pathlib.Path(x['final_ref'])
          if not p.is_file(): raise SystemExit('FINAL_FILE_MISSING')
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          if h!=x.get('final_sha256'): raise SystemExit('FINAL_FILE_HASH_MISMATCH')
          print('final_ref='+x['final_ref']); print('final_filename='+p.name); print('final_sha256='+h); print('batch_sha256='+x['batch_sha256']); print('article_count='+str(x['article_count']))
          PY
          echo "key_id=$ENDSTEMPEL_TRUSTED_KEY_ID" >> "$GITHUB_OUTPUT"
          echo "public_sha256=$ENDSTEMPEL_TRUSTED_PUBLIC_KEY_SHA256" >> "$GITHUB_OUTPUT"
          echo "public_b64=$ENDSTEMPEL_TRUSTED_PUBLIC_KEY_B64" >> "$GITHUB_OUTPUT"

      - name: Independently verify the one final JSON before transport
        shell: bash
        env:
          FINAL_REF: ${{ steps.stamp.outputs.final_ref }}
          KEY_ID: ${{ steps.stamp.outputs.key_id }}
          PUBLIC_SHA: ${{ steps.stamp.outputs.public_sha256 }}
          PUBLIC_B64: ${{ steps.stamp.outputs.public_b64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,re
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          def canon(o): return json.dumps(o,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          def h(o): return hashlib.sha256(canon(o)).hexdigest()
          p=os.environ['FINAL_REF']; x=json.load(open(p,encoding='utf-8'))
          if x.get('contract')!='PSERC_APPROVED_PRODUCTION_PACKAGE_V1' or x.get('endstamp_contract')!='PFERDE_ATELIER_ENDSTEMPEL_RELEASE_V1' or x.get('status')!='ENDSTEMPEL_PASS': raise SystemExit('FINAL_CONTRACT_INVALID')
          if x.get('publish_allowed') is not False or x.get('content_mutation_performed') is not False: raise SystemExit('FINAL_FLAGS_INVALID')
          payload=dict(x); ph=payload.pop('package_payload_sha256',None)
          if ph!=h(payload): raise SystemExit('FINAL_PAYLOAD_HASH_INVALID')
          m=x.get('article_manifest') or {}
          if m.get('article_count')!=7 or len(m.get('articles') or [])!=7: raise SystemExit('FINAL_ARTICLE_COUNT_INVALID')
          mh=h(m)
          if mh!=x.get('article_manifest_sha256'): raise SystemExit('FINAL_MANIFEST_HASH_INVALID')
          seen=set()
          for row in m['articles']:
              name=row.get('name',''); slot=row.get('plan_slot',''); content=row.get('content_utf8')
              if not re.fullmatch(r'ARTICLE_[0-9a-f]{64}\.md',name) or name!='ARTICLE_'+slot+'.md' or name in seen or not isinstance(content,str): raise SystemExit('FINAL_ARTICLE_ID_INVALID')
              raw=content.encode('utf-8')
              if len(raw)!=row.get('byte_length') or hashlib.sha256(raw).hexdigest()!=row.get('sha256'): raise SystemExit('FINAL_ARTICLE_BYTES_INVALID')
              seen.add(name)
          pub=base64.b64decode(os.environ['PUBLIC_B64'],validate=True)
          if hashlib.sha256(pub).hexdigest()!=os.environ['PUBLIC_SHA'] or x.get('signing_public_key_sha256')!=os.environ['PUBLIC_SHA'] or x.get('signing_key_id')!=os.environ['KEY_ID'] or x.get('public_key_b64')!=os.environ['PUBLIC_B64']: raise SystemExit('FINAL_SIGNER_IDENTITY_INVALID')
          sig=base64.b64decode(x['signature_b64'],validate=True); Ed25519PublicKey.from_public_bytes(pub).verify(sig,mh.encode('ascii'))
          print('GITHUB_FINAL_INDEPENDENT_VERIFY_PASS')
          PY

      - name: Transfer signed JSON to isolated release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: endstempel-${{ steps.stamp.outputs.batch_sha256 }}
          path: ${{ steps.stamp.outputs.final_ref }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-release:
    needs: endstempel
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Receive final JSON without private key
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: endstempel-${{ needs.endstempel.outputs.batch_sha256 }}
          path: endstempel-package

      - name: Verify transported JSON hash
        shell: bash
        env:
          FINAL_FILENAME: ${{ needs.endstempel.outputs.final_filename }}
          FINAL_SHA256: ${{ needs.endstempel.outputs.final_sha256 }}
        run: |
          set -euo pipefail
          p="endstempel-package/$FINAL_FILENAME"
          test -f "$p" || { echo 'TRANSPORT_FILE_MISSING'; exit 2; }
          actual="$(sha256sum "$p" | awk '{print $1}')"
          [ "$actual" = "$FINAL_SHA256" ] || { echo 'TRANSPORT_HASH_MISMATCH'; exit 2; }
          echo 'GITHUB_FINAL_TRANSPORT_PASS'

      - name: Publish exactly one durable JSON release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH_SHA256: ${{ needs.endstempel.outputs.batch_sha256 }}
          FINAL_FILENAME: ${{ needs.endstempel.outputs.final_filename }}
          FINAL_SHA256: ${{ needs.endstempel.outputs.final_sha256 }}
        run: |
          set -euo pipefail
          tag="endstempel-$BATCH_SHA256"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'ENDSTEMPEL_RELEASE_REPLAY_BLOCKED'; exit 2; fi
          p="endstempel-package/$FINAL_FILENAME"
          gh release create "$tag" "$p#$FINAL_FILENAME" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Pferde Atelier Endstempel $BATCH_SHA256" --notes "GitHub-owned final release. SHA-256: $FINAL_SHA256. publish_allowed=false."
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets
          echo 'GITHUB_FINAL_DURABLE_RELEASE_PASS'

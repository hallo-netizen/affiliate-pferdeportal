name: HAB RC14 original latest Hobby images and Hab design mapping
on:
  push:
    branches:
      - hab-004-rc14-banner-worlds-20261108
permissions:
  contents: read
jobs:
  originals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify original HD009 0.1.25 and extract Hab Design image-map, selected world images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p originals/hd originals/hab-design
          cp protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE/CURRENT.zip originals/hd/HD009_CURRENT_0.1.25.zip
          python3 - <<'PY'
          import zipfile,hashlib,os,json
          hd='originals/hd/HD009_CURRENT_0.1.25.zip'
          raw=open(hd,'rb').read()
          assert hashlib.sha256(raw).hexdigest()=='c82b75f9f485eec43f6b8626ff4a6748f3610c0093e61616d4bdd8d4d62204d0'
          orig='protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-001-DESIGN/CURRENT.zip'
          with zipfile.ZipFile(orig) as z:
              for item in z.namelist():
                  if item.endswith('.json') and any(t in item for t in ('area-image-mapping','area-photo-identities')):
                      dest='originals/hab-design/'+item.split('/')[-1]
                      open(dest,'wb').write(z.read(item))
                  if item.endswith('.webp') and any(t in item for t in ('start-world','world-','topic-62-wassermelder','new-boiler','start-')):
                      dest='originals/hab-design/'+item.split('/')[-1]
                      if not os.path.exists(dest):open(dest,'wb').write(z.read(item))
          with zipfile.ZipFile(orig) as z:
              photos=[x for x in z.namelist() if x.endswith('.webp') and '/assets/' in x]
              txt='\\n'.join(f'{x.split("/")[-1]} | {z.getinfo(x).file_size}' for x in photos)
              open('originals/hab-design/ALL-PHOTO-FILENAMES.txt','w').write(txt)
          print('Hab photos',len(os.listdir('originals/hab-design')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HAB-RC14-approved-original-reference
          path: originals
          if-no-files-found: error
          retention-days: 2

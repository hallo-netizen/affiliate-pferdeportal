name: V6.45 post-release counterproof

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v645-postrelease-counterproof.yml'
      - '.github/scripts/postrelease-counterproof-v645.sh'
      - '.github/overlays/v645/soft_failure_recovery.php'

permissions:
  contents: read
  actions: read

jobs:
  counterproof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: v645counter
          MARIADB_USER: wp
          MARIADB_PASSWORD: wppass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uwp -pwppass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Set up PHP 8.4 with mysqli and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          tools: wp-cli
          coverage: none

      - name: Download exact successful final release artifact
        uses: actions/download-artifact@v4
        with:
          name: V645_FINAL_VERIFIED_RELEASE
          path: V645_FINAL_ARTIFACT
          repository: hallo-netizen/affiliate-pferdeportal
          run-id: 32396508371
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute full post-release counterproof against exact final installer
        shell: bash
        run: |
          chmod +x .github/scripts/postrelease-counterproof-v645.sh
          .github/scripts/postrelease-counterproof-v645.sh

      - name: Upload counterproof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V645_POSTRELEASE_COUNTERPROOF_EVIDENCE
          path: V645_COUNTERPROOF_EVIDENCE/
          if-no-files-found: error
          retention-days: 7

name: System 4A Real 102 Repair Matrix

on:
  push:
    branches:
      - 'hobbyroom/system4a-real-102-repair-matrix-clean-20260917'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-102-repair-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Exact head
        run: git rev-parse HEAD
      - name: Inspect exact parent and portal PPM diagnostics
        run: |
          set -euo pipefail
          rm -rf /tmp/ppm679
          mkdir -p /tmp/ppm679
          unzip -q control/startmaster0107/runtime_packages/PORTAL_PRODUCTION_MACHINE_V6.7.9_SIGNED_ARTICLE_TYPE_EXTENSION_ROOTFIX_FINAL.zip -d /tmp/ppm679
          ROOT=/tmp/ppm679/portal-production-machine
          for code in \
            BLOCKED_CONTENT_FAQ_TITLE_QUESTION_MARK \
            BLOCKED_CONTENT_TITLE_COLON \
            BLOCKED_CONTENT_TARGET_KEYWORD_TITLE \
            BLOCKED_WAVE2_WORDPRESS_CATEGORY \
            BLOCKED_WAVE2_RUNTIME_LINK_ROLE \
            BLOCKED_WAVE2_INTERNAL_LINK_ROLE_MISSING \
            BLOCKED_WAVE2_BOUND_LINK_MISSING \
            BLOCKED_CONTENT_UNBOUND_INTERNAL_LINK \
            BLOCKED_CONTENT_BOUND_LINK_MISSING; do
            echo "===== $code ====="
            grep -RFn -B18 -A28 "$code" "$ROOT/includes" || true
          done
      - name: Run exact PPM targeted negatives
        working-directory: isolated_system4
        run: python3 -m unittest -v test_textmachine_ppm_negative_gaps.py
      - name: Run exact guard targeted negatives
        working-directory: isolated_system4
        run: python3 -m unittest -v test_textmachine_negative_gap_guards.py

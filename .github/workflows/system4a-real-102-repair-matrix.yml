name: System 4A Real 102 Repair Matrix

on:
  push:
    branches:
      - 'hobbyroom/system4a-real-102-repair-matrix-clean-20260917'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-102-repair-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SYSTEM4_FRESH_RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-real-102
      SYSTEM4_REAL_102_PROOF: /tmp/SYSTEM4_REAL_102_REPAIR_MATRIX_V1.json
    steps:
      - uses: actions/checkout@v4
      - name: Exact head
        run: git rev-parse HEAD
      - name: Forbid mocks in real 102 harness
        run: |
          set -euo pipefail
          for f in isolated_system4/real_102_repair_matrix_v1.py isolated_system4/real_102_repair_matrix_runner_v4.py; do
            if grep -nE 'unittest\.mock|mock\.patch|from unittest import mock' "$f"; then exit 2; fi
          done
          echo 'REAL_102_NO_MOCK_PASS'
      - name: Inspect exact historical content rule conditions
        run: |
          set -euo pipefail
          rm -rf /tmp/ppm-authority && mkdir -p /tmp/ppm-authority
          unzip -q control/startmaster0107/runtime_packages/PORTAL_PRODUCTION_MACHINE_V6.7.9_SIGNED_ARTICLE_TYPE_EXTENSION_ROOTFIX_FINAL.zip -d /tmp/ppm-authority
          ROOT=/tmp/ppm-authority/portal-production-machine
          for code in \
            BLOCKED_CONTENT_BOUND_LINK_MISSING \
            BLOCKED_CONTENT_DUMMY_SOURCE_HASH \
            BLOCKED_CONTENT_FAQ_TITLE_QUESTION_MARK \
            BLOCKED_CONTENT_FORBIDDEN_MACHINE_STATUS_WORD \
            BLOCKED_CONTENT_FORBIDDEN_TABLE_PRESENT \
            BLOCKED_CONTENT_PLACEHOLDER_SOURCE_TITLE \
            BLOCKED_CONTENT_REQUIRED_BLOCK_EMPTY \
            BLOCKED_CONTENT_REQUIRED_BLOCK_MISSING \
            BLOCKED_CONTENT_REQUIRED_SECTION_MISSING \
            BLOCKED_CONTENT_REQUIRED_TABLE_MISSING \
            BLOCKED_CONTENT_SECTION_DUPLICATE \
            BLOCKED_CONTENT_SECTION_ORDER \
            BLOCKED_CONTENT_SOURCE_LABEL_OPTION_MISMATCH \
            BLOCKED_CONTENT_SOURCE_TRACE_COUNT \
            BLOCKED_CONTENT_SOURCE_TRACE_FIELDS \
            BLOCKED_CONTENT_TABLE_COUNT \
            BLOCKED_CONTENT_TABLE_STRUCTURE \
            BLOCKED_CONTENT_TARGET_KEYWORD_TITLE \
            BLOCKED_CONTENT_TITLE_COLON \
            BLOCKED_CONTENT_TRACE_FACT_BINDING \
            BLOCKED_CONTENT_UNBOUND_INTERNAL_LINK \
            BLOCKED_CONTENT_VISIBLE_LINK_COUNT; do
              echo "=== $code ==="
              grep -RFn -B8 -A10 "$code" "$ROOT/includes" || true
          done
      - name: Download hash-bound LanguageTool 6.8
        run: |
          set -euo pipefail
          mkdir -p /tmp/system4-lt68
          curl --fail --location --retry 3 https://github.com/jxmorris12/language_tool_python/releases/download/LanguageTool-6.8/LanguageTool-6.8.zip -o /tmp/system4-lt68/LanguageTool-6.8.zip
          echo '6a7f6b67b779ae9505f7579f0c41453ea8d1bd72ae750bdc2c55ba974281467d  /tmp/system4-lt68/LanguageTool-6.8.zip' | sha256sum -c -
          unzip -q /tmp/system4-lt68/LanguageTool-6.8.zip -d /tmp/system4-lt68
          echo '2122882e800d312a0543d895c56c0a84a9bb131c9b9846efd8fc033129353ae8  /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar' | sha256sum -c -
      - name: Execute real 102 of 102 repair roundtrip matrix
        env:
          PYTHONPATH: isolated_system4
          SYSTEM4_LANGUAGETOOL_JAR: /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar
        run: |
          set -euo pipefail
          python3 isolated_system4/real_102_repair_matrix_runner_v4.py | tee /tmp/system4-real-102.log
          grep -Fx 'TEXTMASCHINE_REAL_REPAIR_FULL_PASS:102/102' /tmp/system4-real-102.log
          test -s /tmp/SYSTEM4_REAL_102_REPAIR_MATRIX_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/SYSTEM4_REAL_102_REPAIR_MATRIX_V1.json',encoding='utf-8'))
          assert d['status']=='PASS' and d['count']==102 and d['real_fullcheck_count']==102
          assert d['owner_counts']=={'DRAFT_WORKER':96,'PARENT_TITLE_MACHINE':3,'PORTAL_LINK_MACHINE':2,'PARENT_CATEGORY_MACHINE':1}
          assert all(r['fullcheck']=='PASS' and r['lt']=='PASS' and r['ppm']=='PASS' for r in d['rows'])
          assert d['publish_allowed'] is False
          print('REAL_102_PROOF_FILE_PASS')
          PY
      - name: Run hard-block and W4 routing regression
        working-directory: isolated_system4
        run: |
          set -euo pipefail
          python3 -m unittest -v test_textmachine_hardblock_matrix.py
          python3 - <<'PY'
          import production_checks
          for code in ('BLOCKED_QF03_RENDERED_H1_COUNT','BLOCKED_QF03_RENDERED_DUPLICATE_HEADINGS','BLOCKED_QF03_RENDERED_ADJACENT_HEADINGS'):
              assert production_checks._ppm_repair_owner({'error_code':code,'field_path':'content.heading'}) == 'DRAFT_WORKER', code
          assert production_checks._ppm_repair_owner({'error_code':'W4_R8_0790_LOCAL_EXECUTED_TEST_EVIDENCE_MISSING','field_path':''}) == 'HARD_BLOCK'
          print('REAL_102_W4_ROUTING_REGRESSION_PASS')
          PY
      - name: Upload real 102 proof
        uses: actions/upload-artifact@v4
        with:
          name: system4a-real-102-repair-${{ github.sha }}
          path: |
            /tmp/SYSTEM4_REAL_102_REPAIR_MATRIX_V1.json
            /tmp/system4-real-102.log
          if-no-files-found: error
          retention-days: 3

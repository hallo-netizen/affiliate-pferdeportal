name: System 4A Real 102 Repair Matrix

on:
  push:
    branches:
      - 'hobbyroom/system4a-real-102-repair-matrix-clean-20260917'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-102-repair-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Exact head
        run: git rev-parse HEAD
      - name: Inspect scoped PPM registry mapping
        run: |
          set -euo pipefail
          rm -rf /tmp/ppm679
          mkdir -p /tmp/ppm679
          unzip -q control/startmaster0107/runtime_packages/PORTAL_PRODUCTION_MACHINE_V6.7.9_SIGNED_ARTICLE_TYPE_EXTENSION_ROOTFIX_FINAL.zip -d /tmp/ppm679
          ROOT=/tmp/ppm679/portal-production-machine
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          root=Path('/tmp/ppm679/portal-production-machine')
          p=root/'contracts/hard-rule-registry-v1.json'
          d=json.loads(p.read_text())
          print('TOP', type(d).__name__, list(d)[:20] if isinstance(d,dict) else len(d))
          rows=d.get('rules') if isinstance(d,dict) else d
          if not isinstance(rows,list):
              for k,v in d.items():
                  if isinstance(v,list) and v and isinstance(v[0],dict):
                      print('LIST_CANDIDATE',k,len(v)); rows=v; break
          print('ROW_COUNT',len(rows)); print('FIRST',json.dumps(rows[0],ensure_ascii=False,sort_keys=True))
          keys=Counter()
          for r in rows: keys.update(r.keys())
          print('KEYS', sorted(keys))
          for key in ['source','source_file','file','path','implementation','validator','source_ref']:
              vals=Counter(str(r.get(key) or '') for r in rows)
              hits={k:v for k,v in vals.items() if any(n in k for n in ['content-validator','content-structure-language-gate','known-error-gate','rendered-dom'])}
              if hits: print('SOURCEKEY',key,hits)
          PY
      - name: Run exact PPM coverage authority
        run: php /tmp/ppm679/portal-production-machine/tests/test-mainblock1-hard-rule-coverage.php
      - name: Run current exact negative-gap PPM proof
        working-directory: isolated_system4
        run: python3 -m unittest -v test_textmachine_ppm_negative_gaps.py
      - name: Run current guard negative proof
        working-directory: isolated_system4
        run: python3 -m unittest -v test_textmachine_negative_gap_guards.py

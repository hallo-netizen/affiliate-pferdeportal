name: System 4A Real 102 Repair Matrix

on:
  push:
    branches:
      - 'hobbyroom/system4a-real-102-repair-matrix-clean-20260917'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-102-repair-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Exact head
        run: git rev-parse HEAD
      - name: Inspect exact PPM 6.7.9 negative test authorities
        run: |
          set -euo pipefail
          rm -rf /tmp/ppm679
          mkdir -p /tmp/ppm679
          unzip -q control/startmaster0107/runtime_packages/PORTAL_PRODUCTION_MACHINE_V6.7.9_SIGNED_ARTICLE_TYPE_EXTENSION_ROOTFIX_FINAL.zip -d /tmp/ppm679
          echo '=== TEST FILES ==='
          find /tmp/ppm679 -type f \( -name '*.php' -o -name '*.json' -o -name '*.html' \) | sort | grep '/test\|/tests' || true
          echo '=== ERROR REFERENCES IN TESTS ==='
          grep -RhoE 'BLOCKED_[A-Z0-9_]+' /tmp/ppm679 --include='*.php' --include='*.json' | sort | uniq -c || true
          echo '=== CODE IDS IN TESTS ==='
          grep -RhoE 'CODE::[A-Za-z0-9_-]+' /tmp/ppm679 --include='*.php' --include='*.json' | sort -u || true
      - name: Run current exact negative-gap PPM proof
        working-directory: isolated_system4
        run: python3 -m unittest -v test_textmachine_ppm_negative_gaps.py
      - name: Run current guard negative proof
        working-directory: isolated_system4
        run: python3 -m unittest -v test_textmachine_negative_gap_guards.py

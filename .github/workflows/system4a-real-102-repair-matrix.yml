name: System 4A Real 102 Repair Matrix

on:
  push:
    branches:
      - 'hobbyroom/system4a-real-102-repair-matrix-clean-20260917'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-102-repair-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Exact head
        run: git rev-parse HEAD
      - name: Inspect scoped PPM mutation authorities
        run: |
          set -euo pipefail
          rm -rf /tmp/ppm679
          mkdir -p /tmp/ppm679
          unzip -q control/startmaster0107/runtime_packages/PORTAL_PRODUCTION_MACHINE_V6.7.9_SIGNED_ARTICLE_TYPE_EXTENSION_ROOTFIX_FINAL.zip -d /tmp/ppm679
          ROOT=/tmp/ppm679/portal-production-machine
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/ppm679/portal-production-machine')
          rows=json.loads((root/'contracts/hard-rule-registry-v1.json').read_text())['rules']
          base=[r for r in rows if r.get('source_path') in {'includes/content-validator.php','includes/content-structure-language-gate.php','includes/known-error-gate.php'}]
          wave4={'W4::R8-0786':'BLOCKED_QF03_RENDERED_H1_COUNT','W4::R8-0787':'BLOCKED_QF03_RENDERED_DUPLICATE_HEADINGS','W4::R8-0788':'BLOCKED_QF03_RENDERED_ADJACENT_HEADINGS','W4::R8-0790':'BLOCKED_QF03_RENDERED_EVIDENCE_CLASS'}
          rendered=[r for r in rows if r.get('error_code') in set(wave4.values())]
          scoped=base+rendered
          print('SCOPE_COUNTS',len(base),len(rendered),len(scoped))
          hard={
          'BLOCKED_WAVE2_CONTRACT_MISSING','BLOCKED_WAVE2_QUALITY_BINDING_MISSING','BLOCKED_WAVE2_QUALITY_BINDING_HASH','BLOCKED_WAVE2_INTERNAL_MARKER_MISSING','BLOCKED_WAVE2_LINK_REGISTRY_HASH','BLOCKED_MAINBLOCK1_LANGUAGE_DELTA_EVIDENCE','BLOCKED_WAVE2_LANGUAGE_EVIDENCE','BLOCKED_VALIDATION_CONTRACT_VERSION_MISSING','BLOCKED_SECTION_REQUIREMENTS_HASH_MISMATCH','BLOCKED_VALIDATION_CONTRACT_VERSION_UNKNOWN','BLOCKED_CONTENT_TYPE_DEFINITION_MISSING','BLOCKED_CONTENT_HASH_MISMATCH','BLOCKED_KNOWN_ERROR_CONTRACT_MISSING','W4_R8_0790_LOCAL_EXECUTED_TEST_EVIDENCE_MISSING'}
          repair=[r for r in scoped if r.get('error_code') not in hard]
          # duplicate UNKNOWN is two rule IDs and counts twice; W4 local executed evidence is a requirement-ID hard rule, not the rendered evidence-class content rule.
          print('REPAIR_PRELIM',len(repair))
          from collections import Counter
          print('NEGATIVE_TESTS',json.dumps(Counter(r.get('negative_test') for r in repair),sort_keys=True))
          print('POSITIVE_TESTS',json.dumps(Counter(r.get('positive_test') for r in repair),sort_keys=True))
          print('MUTATION_FILES')
          for p in sorted(root.rglob('*')):
              if p.is_file() and ('mutat' in p.name.lower() or 'repair' in p.name.lower()):
                  print(p.relative_to(root))
          PY
      - name: Run exact PPM coverage authority
        run: php /tmp/ppm679/portal-production-machine/tests/test-mainblock1-hard-rule-coverage.php
      - name: Run current exact negative-gap PPM proof
        working-directory: isolated_system4
        run: python3 -m unittest -v test_textmachine_ppm_negative_gaps.py
      - name: Run current guard negative proof
        working-directory: isolated_system4
        run: python3 -m unittest -v test_textmachine_negative_gap_guards.py

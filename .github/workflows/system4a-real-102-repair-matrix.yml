name: System 4A Real 102 Repair Matrix

on:
  push:
    branches:
      - 'hobbyroom/system4a-real-102-repair-matrix-clean-20260917'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-102-repair-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Exact head
        run: git rev-parse HEAD
      - name: Inspect scoped PPM registry mapping
        run: |
          set -euo pipefail
          rm -rf /tmp/ppm679
          mkdir -p /tmp/ppm679
          unzip -q control/startmaster0107/runtime_packages/PORTAL_PRODUCTION_MACHINE_V6.7.9_SIGNED_ARTICLE_TYPE_EXTENSION_ROOTFIX_FINAL.zip -d /tmp/ppm679
          ROOT=/tmp/ppm679/portal-production-machine
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          root=Path('/tmp/ppm679/portal-production-machine')
          rows=json.loads((root/'contracts/hard-rule-registry-v1.json').read_text())['rules']
          needles=['content-validator','content-structure-language-gate','known-error-gate','rendered-dom']
          for key in ['source_path','source_reference','validation_layer','validator_or_reviewer']:
              vals=Counter(str(r.get(key) or '') for r in rows)
              hits={k:v for k,v in vals.items() if any(n in k for n in needles)}
              print('SOURCEKEY',key,json.dumps(hits,ensure_ascii=False,sort_keys=True))
          scoped=[r for r in rows if any(n in (str(r.get('source_path') or '')+' '+str(r.get('source_reference') or '')) for n in needles)]
          print('SCOPED_COUNT',len(scoped))
          for r in scoped:
              print('SCOPED',json.dumps({k:r.get(k) for k in ['rule_id','error_code','source_path','source_reference','positive_test','negative_test','validation_layer','validator_or_reviewer']},ensure_ascii=False,sort_keys=True))
          PY
      - name: Run exact PPM coverage authority
        run: php /tmp/ppm679/portal-production-machine/tests/test-mainblock1-hard-rule-coverage.php
      - name: Run current exact negative-gap PPM proof
        working-directory: isolated_system4
        run: python3 -m unittest -v test_textmachine_ppm_negative_gaps.py
      - name: Run current guard negative proof
        working-directory: isolated_system4
        run: python3 -m unittest -v test_textmachine_negative_gap_guards.py

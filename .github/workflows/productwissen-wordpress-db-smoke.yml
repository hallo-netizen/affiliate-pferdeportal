name: Product Knowledge WordPress DB Smoke

on:
  push:
    branches:
      - hobbyroom/productwissen-v1-prototype
    paths:
      - 'universal-product-knowledge/**'
      - 'universal-product-comparison/**'
      - '.github/workflows/productwissen-wordpress-db-smoke.yml'
  pull_request:
    branches:
      - hobbyroom/project-memory-campus-v1-20260905
    paths:
      - 'universal-product-knowledge/**'
      - 'universal-product-comparison/**'
      - '.github/workflows/productwissen-wordpress-db-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wordpress-db-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        run: |
          php -l universal-product-knowledge/universal-product-knowledge.php
          php -l universal-product-knowledge/src/class-upk-repository.php
          php -l universal-product-knowledge/tests/wp-db-smoke.php
          php -l universal-product-comparison/universal-product-comparison.php
          php -l universal-product-comparison/src/class-upc-repository.php
          php -l universal-product-comparison/src/class-upc-rulebook.php
          php -l universal-product-comparison/src/class-upc-writer.php
          php -l universal-product-comparison/src/class-upc-validator.php
          php -l universal-product-comparison/src/class-upc-production.php
          php -l universal-product-comparison/src/class-upc-project-config.php
          php -l universal-product-comparison/src/class-upc-wordpress-draft.php
          php -l universal-product-comparison/src/class-upc-affiliate-bridge.php
          php -l universal-product-comparison/src/class-upc-archive.php
          php -l universal-product-comparison/tests/affiliate-exact-bridge-contract.php
          php -l universal-product-comparison/tests/wp-db-smoke.php
          php -l universal-product-comparison/tests/wp-real-dossier-smoke.php
          php -l universal-product-comparison/tests/wp-archive-smoke.php
          php -r '$d=json_decode(file_get_contents("universal-product-comparison/tests/fixtures/pv-reg-001.json"),true); if(!is_array($d)){exit(1);} echo "FIXTURE_JSON_PASS\\n";'

      - name: Zero-freedom static guard
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_FILES="universal-product-comparison/src/class-upc-rulebook.php universal-product-comparison/src/class-upc-writer.php universal-product-comparison/src/class-upc-validator.php universal-product-comparison/src/class-upc-production.php universal-product-comparison/src/class-upc-project-config.php universal-product-comparison/src/class-upc-wordpress-draft.php"
          ! grep -E -i 'openai|anthropic|gemini|llm|wp_remote_|curl_|fsockopen|stream_socket_client' $RUNTIME_FILES
          ! grep -E -i 'random|rand\(|mt_rand|microtime|uniqid|current_time|date\(' $RUNTIME_FILES
          ! grep -E 'call_user_func|is_callable|eval\(|exec\(|shell_exec|system\(' $RUNTIME_FILES
          ! grep -E 'function upc_writer\(' universal-product-comparison/universal-product-comparison.php
          echo UPC_ZERO_FREEDOM_STATIC_GUARD_PASS

      - name: Affiliate bridge read-only guard
        shell: bash
        run: |
          set -euo pipefail
          php universal-product-comparison/tests/affiliate-exact-bridge-contract.php
          ! grep -E 'global[[:space:]]+\$wpdb|upk_products|upk_variants|upk_identifiers|wp_insert_post|wp_update_post|update_post_meta|delete_post_meta' universal-product-comparison/src/class-upc-affiliate-bridge.php
          echo UPC_AFFILIATE_BRIDGE_READ_ONLY_GUARD_PASS

      - name: Archive read-only and SEO-URL guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'wp_insert_post|wp_update_post|update_post_meta|delete_post_meta|wp_delete_post|global[[:space:]]+\$wpdb' universal-product-comparison/src/class-upc-archive.php
          ! grep -E 'URLSearchParams|pushState|replaceState|location\.search|history\.' universal-product-comparison/assets/archive.js
          grep -F 'data-upc-filter="product_group"' universal-product-comparison/src/class-upc-archive.php
          grep -F 'data-upc-filter="product_comparison"' universal-product-comparison/src/class-upc-archive.php
          echo UPC_ARCHIVE_READ_ONLY_NO_INDEXABLE_FILTER_URL_GUARD_PASS

      - name: Assert draft materializer cannot publish
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E "post_status['\"]?[[:space:]]*=>[[:space:]]*['\"](publish|future|private|pending)" universal-product-comparison/src/class-upc-wordpress-draft.php
          grep -F "'post_status'   => 'draft'" universal-product-comparison/src/class-upc-wordpress-draft.php
          grep -F "'_upc_publish_allowed'           => '0'" universal-product-comparison/src/class-upc-wordpress-draft.php
          echo UPC_WORDPRESS_DRAFT_NO_PUBLISH_GUARD_PASS

      - name: Install WP-CLI
        run: |
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          wp --info

      - name: Install WordPress
        run: |
          mkdir -p /tmp/upk-wp
          wp core download --path=/tmp/upk-wp --quiet
          wp config create --path=/tmp/upk-wp --dbname=wp_test --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check --quiet
          wp core install --path=/tmp/upk-wp --url=http://example.test --title='UPK Test' --admin_user=admin --admin_password='test-password' --admin_email=admin@example.test --skip-email --quiet

      - name: Build clean installable plugin ZIPs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/upc-plugin-build
          mkdir -p /tmp/upc-plugin-build/universal-product-knowledge
          mkdir -p /tmp/upc-plugin-build/universal-product-comparison

          cp universal-product-knowledge/universal-product-knowledge.php /tmp/upc-plugin-build/universal-product-knowledge/
          cp -a universal-product-knowledge/src /tmp/upc-plugin-build/universal-product-knowledge/

          cp universal-product-comparison/universal-product-comparison.php /tmp/upc-plugin-build/universal-product-comparison/
          cp -a universal-product-comparison/src /tmp/upc-plugin-build/universal-product-comparison/
          cp -a universal-product-comparison/assets /tmp/upc-plugin-build/universal-product-comparison/
          cp -a universal-product-comparison/config /tmp/upc-plugin-build/universal-product-comparison/

          (
            cd /tmp/upc-plugin-build
            zip -qr /tmp/universal-product-knowledge.zip universal-product-knowledge
            zip -qr /tmp/universal-product-comparison.zip universal-product-comparison
          )

          test "$(unzip -Z1 /tmp/universal-product-knowledge.zip | head -n1)" = "universal-product-knowledge/"
          test "$(unzip -Z1 /tmp/universal-product-comparison.zip | head -n1)" = "universal-product-comparison/"
          ! unzip -Z1 /tmp/universal-product-knowledge.zip | grep -E '/tests/|protocol/|\.git'
          ! unzip -Z1 /tmp/universal-product-comparison.zip | grep -E '/tests/|protocol/|\.git|ZERO_FREEDOM'
          unzip -Z1 /tmp/universal-product-knowledge.zip | grep -F 'universal-product-knowledge/universal-product-knowledge.php'
          unzip -Z1 /tmp/universal-product-comparison.zip | grep -F 'universal-product-comparison/universal-product-comparison.php'
          echo UPC_INSTALLABLE_ZIP_STRUCTURE_PASS

      - name: Install ZIPs and activate in dependency order
        run: |
          wp plugin install /tmp/universal-product-knowledge.zip --activate --path=/tmp/upk-wp
          wp plugin install /tmp/universal-product-comparison.zip --activate --path=/tmp/upk-wp
          wp plugin is-active universal-product-knowledge --path=/tmp/upk-wp
          wp plugin is-active universal-product-comparison --path=/tmp/upk-wp
          echo UPC_REAL_ZIP_INSTALL_ACTIVATION_PASS

      - name: Attach test fixtures after clean ZIP install
        run: |
          cp -a universal-product-knowledge/tests /tmp/upk-wp/wp-content/plugins/universal-product-knowledge/tests
          cp -a universal-product-comparison/tests /tmp/upk-wp/wp-content/plugins/universal-product-comparison/tests

      - name: Real WordPress + MySQL readback
        run: |
          wp eval-file /tmp/upk-wp/wp-content/plugins/universal-product-knowledge/tests/wp-db-smoke.php --path=/tmp/upk-wp
          wp eval-file /tmp/upk-wp/wp-content/plugins/universal-product-comparison/tests/wp-db-smoke.php --path=/tmp/upk-wp
          wp eval-file /tmp/upk-wp/wp-content/plugins/universal-product-comparison/tests/wp-real-dossier-smoke.php --path=/tmp/upk-wp
          wp eval-file /tmp/upk-wp/wp-content/plugins/universal-product-comparison/tests/wp-archive-smoke.php --path=/tmp/upk-wp

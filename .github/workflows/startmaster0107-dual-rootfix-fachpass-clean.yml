name: TEMP STARTMASTER0107 Dual Rootfix Fachpass Clean

on:
  push:
    branches:
      - startmaster0107-dual-rootfix-fachpass-clean-20260902

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct permanent repair script only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('control/startmaster0107/STARTMASTER0107_DUAL_ROOTFIX_REPAIR.py')
          s = p.read_text(encoding='utf-8')

          old = "b=binding_descriptor(repo);root=str(a['allowed_output_root']);pref=root+'FACHWORKFLOW_PASS.json'"
          new = "b=binding_descriptor(repo);root=str(a['allowed_output_root']);pref=root+'FACHWORKFLOW_PASS_'+str(it['plan_slot'])+'.json'"
          if s.count(old) != 1:
              raise SystemExit('FACH_PASS_TARGET_NOT_EXACTLY_ONCE')
          s = s.replace(old, new, 1)

          old2 = "def repl(text:str,old:str,new:str,label:str)->str:\n    n=text.count(old)\n    if n==0 and new in text:return text\n    if n!=1:raise Blocked(label+':MATCHES='+str(n))"
          new2 = "def repl(text:str,old:str,new:str,label:str)->str:\n    n=text.count(old)\n    if label=='ENTRY_FINALIZER' and 'pserc_finalization = finalizer.finalize_after_107008' in text:return text\n    if label=='PREPARED_107007_PERSIST' and 'dual.persist_prepared_binding(REPO, binding)' in text:return text\n    if label=='PREPARED_107008_CLEAR' and 'finalizer.clear_prepared_binding(REPO, binding[\"batch_sha256\"])' in text:return text\n    if n==0 and new in text:return text\n    if n!=1:raise Blocked(label+':MATCHES='+str(n))"
          if s.count(old2) != 1:
              raise SystemExit('IDEMPOTENCY_TARGET_NOT_EXACTLY_ONCE')
          s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Execute permanent repair and full tests
        run: python3 control/startmaster0107/STARTMASTER0107_DUAL_ROOTFIX_REPAIR.py apply-and-test

      - name: Repeat permanent repair and full tests
        run: python3 control/startmaster0107/STARTMASTER0107_DUAL_ROOTFIX_REPAIR.py apply-and-test

      - name: Assert no duplicate prepared persistence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('control/output-quarantine/runtime_entry_gate.py').read_text(encoding='utf-8')
          marker='dual.persist_prepared_binding(REPO, binding)'
          if s.count(marker) != 1:
              raise SystemExit(f'PREPARED_PERSIST_COUNT={s.count(marker)}')
          PY

      - name: Remove transient files
        run: |
          find control -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f .github/workflows/startmaster0107-dual-rootfix-fachpass-clean.yml

      - name: Commit persistent fix only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'STARTMASTER0107: make Fachworkflow proof staging collision-safe'
          git push origin HEAD:startmaster0107-dual-rootfix-fachpass-clean-20260902 --force

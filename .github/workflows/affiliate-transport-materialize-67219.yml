name: Affiliate 6.72.19 one-shot materialize

on:
  push:
    branches: [affiliate-release-current]
    paths:
      - '.github/workflows/affiliate-transport-materialize-67219.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: affiliate-release-current
          fetch-depth: 0
      - name: Verify transport and atomically bind 6.72.19
        shell: bash
        run: |
          set -euo pipefail
          ZIP='release/affiliate-zentrale/evidence/transport-adcell-67219/ADCELL_6.72.19_GITHUB_TRANSPORT.zip'
          ROOT='release/affiliate-zentrale/current/affiliate-portal-router'
          EXPECT_ZIP='65ee733359c6d46143f4cbf87799f1c568002586b38e253bc4ae0c5a2ca6387a'
          EXPECT_MANIFEST='694af9869c7aa2b01a51f164173b1c51d9be7c24912c2e129420c3d111346a4b'
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = "$EXPECT_ZIP"
          rm -rf /tmp/adcell67219
          mkdir -p /tmp/adcell67219
          unzip -q "$ZIP" -d /tmp/adcell67219
          SRC='/tmp/adcell67219/ADCELL_6.72.19_GITHUB_TRANSPORT'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil, json
          src=Path('/tmp/adcell67219/ADCELL_6.72.19_GITHUB_TRANSPORT')
          root=Path('release/affiliate-zentrale/current/affiliate-portal-router')
          expected={
          'trait-ppar-automation-suite.php':('includes/trait-ppar-automation-suite.php','c976abdda10b602d2c5afe188297a5e9b111068cab090004cf081fa549d5aa09'),
          'trait-ppar-digistore24.php':('includes/trait-ppar-digistore24.php','f8dc26c280281cd67bef3041264a60a48a2ebfb3155e79c45f9c6155ad0528c8'),
          'pferdeportal-affiliate-router.php':('pferdeportal-affiliate-router.php','0bc44a54a72c60bc1252ba9f705fe3bb6a0705e58dfaaf88eb4815d2ba6a2615'),
          'trait-ppar-ebay.php':('includes/trait-ppar-ebay.php','230d998204aa29aa8f46582b16fee045ddfa644571abd49c998df9f200972996'),
          'class-ppar-admin-kiss.php':('includes/class-ppar-admin-kiss.php','9ff10f49093a7cd7764fe27a20931f984ebc992c30471fdda9353d40d14d1c9a'),
          'trait-ppar-output-objects.php':('includes/trait-ppar-output-objects.php','4dd1facdb59391f73ab797199e135899c705b6a1b9c3faef035274f108cd9d9c'),
          'trait-ppar-control-contract.php':('includes/trait-ppar-control-contract.php','bea3a79270638d5b3b13fced13d7ef222d5a5bc5fa9b16db51aa83097895ca69'),
          'readme.txt':('readme.txt','080b88aeeae3aa67c6689ae8b21535d7a2a47f75bb2f4021bcff8b32d7385f66'),
          'trait-ppar-provider-registry.php':('includes/trait-ppar-provider-registry.php','00cb273992a9288978bb06274e131a857c394944e8ee1c0f249846d118cbe9a6'),
          }
          actual={p.name for p in src.iterdir() if p.is_file()}
          if actual != set(expected): raise SystemExit(f'transport file set mismatch: {sorted(actual)}')
          for name,(rel,sha) in expected.items():
              p=src/name
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              if got != sha: raise SystemExit(f'hash mismatch {name}: {got}')
              shutil.copy2(p,root/rel)
          files=sorted(p for p in root.rglob('*') if p.is_file())
          if len(files)!=26: raise SystemExit(f'source count {len(files)} != 26')
          lines=[]
          for p in files:
              rel=p.relative_to(root).as_posix()
              lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  affiliate-portal-router/{rel}")
          manifest='\n'.join(lines)+'\n'
          Path('release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt').write_text(manifest,encoding='utf-8')
          msha=hashlib.sha256(manifest.encode()).hexdigest()
          if msha!='694af9869c7aa2b01a51f164173b1c51d9be7c24912c2e129420c3d111346a4b': raise SystemExit(f'manifest mismatch {msha}')
          gp=Path('control/release-governance/CURRENT_RELEASE.json')
          g=json.loads(gp.read_text())
          if g['generation'] != 53: raise SystemExit('unexpected governance generation')
          if g['source_authority']['manifest_sha256'] != '74a5d0d5e48028a9ddd82bcf7a32628dbeb42d0963c9ae431bfe8dee3e2c00e5': raise SystemExit('unexpected source manifest binding')
          if g['active_candidate']['version'] != '6.72.8': raise SystemExit('unexpected active candidate')
          g['generation']=54
          g['source_authority']['manifest_sha256']=msha
          g['active_candidate']['version']='6.72.19'
          g['active_candidate']['current_source_manifest_sha256']=msha
          g['user_scope_lock']['adcell_work_status']='ACTIVE_CANONICAL_67219_MERGE_BOUND_GATES_PENDING_LIVE_BLOCKED'
          ex=g['execution_state']
          ex['bound_user_scope_action']='ADCELL_CURRENT; DIGISTORE24_DEFERRED; OTTO_PAUSED; AUTH_PROVEN; PLUGINBUERO_67217_PLUS_ADCELL_MERGED_67219_BOUND; COMMITTED_GATES_PENDING; LIVE_E2E_BLOCKED'
          ex['sequence']=8
          ex['next_state_binding']['sequence']=9
          a=ex.get('adcell_api_v2_automation',{})
          a['status']='CANONICAL_67219_MERGE_BOUND_GATES_PENDING_LIVE_BLOCKED'
          a['version_67219_manifest_sha256']=msha
          a['version_67219_status']='CANONICAL_BOUND_GATES_PENDING'
          a['plugin_acceptance']='FORBIDDEN_UNTIL_67219_COMMITTED_GATES_FRESH_UNPACK_IDENTITY_PASS'
          a.pop('version_6729_local_manifest_sha256',None)
          a.pop('version_6729_status',None)
          ex['adcell_api_v2_automation']=a
          h=ex.get('hobbyroom_current',{})
          h['status']='ACTIVE'
          h['task_id']='adcell-67219-merged-canonical-gates-20260912'
          h['next_action']='Run the bound committed gates on canonical 6.72.19; then Fresh-Unpack/source identity. Live PASS remains blocked until real ADCELL API + WordPress/MariaDB E2E.'
          h['return_path']='Canonical 6.72.19 only; no provider side work. Live PASS only after real ADCELL API + WordPress/MariaDB E2E.'
          ex['hobbyroom_current']=h
          oc=g.get('objective_control',{})
          oc['current_milestone']='ADCELL_API_V2_67219_MERGED_CANONICAL_GATES_AND_LIVE_E2E'
          oc['new_version_policy']='CURRENT_BOUND_PLUGINBUERO_67217_PLUS_ADCELL_67219_ONLY'
          g['objective_control']=oc
          gp.write_text(json.dumps(g,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          test "$(grep -m1 '^ \* Version:' "$ROOT/pferdeportal-affiliate-router.php" | awk '{print $3}')" = '6.72.19'
          grep -q "const VERSION = '6.72.19'" "$ROOT/pferdeportal-affiliate-router.php"
          grep -q '^Stable tag: 6.72.19$' "$ROOT/readme.txt"
          test "$(find "$ROOT" -name '*.php' -type f | wc -l)" -eq 21
          while IFS= read -r f; do php -l "$f" >/dev/null; done < <(find "$ROOT" -name '*.php' -type f | sort)
          rm '.github/workflows/affiliate-transport-materialize-67219.yml'
          git add "$ROOT" 'release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt' 'control/release-governance/CURRENT_RELEASE.json' '.github/workflows/affiliate-transport-materialize-67219.yml'
          python3 - <<'PY'
          import subprocess
          got=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          exp={
          '.github/workflows/affiliate-transport-materialize-67219.yml',
          'control/release-governance/CURRENT_RELEASE.json',
          'release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt',
          'release/affiliate-zentrale/current/affiliate-portal-router/includes/class-ppar-admin-kiss.php',
          'release/affiliate-zentrale/current/affiliate-portal-router/includes/trait-ppar-automation-suite.php',
          'release/affiliate-zentrale/current/affiliate-portal-router/includes/trait-ppar-control-contract.php',
          'release/affiliate-zentrale/current/affiliate-portal-router/includes/trait-ppar-digistore24.php',
          'release/affiliate-zentrale/current/affiliate-portal-router/includes/trait-ppar-ebay.php',
          'release/affiliate-zentrale/current/affiliate-portal-router/includes/trait-ppar-output-objects.php',
          'release/affiliate-zentrale/current/affiliate-portal-router/includes/trait-ppar-provider-registry.php',
          'release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php',
          'release/affiliate-zentrale/current/affiliate-portal-router/readme.txt',
          }
          if got != exp: raise SystemExit(f'staged path mismatch\nGOT={sorted(got)}\nEXP={sorted(exp)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Affiliate ADCELL: atomically bind merged 6.72.19 candidate [skip ci]'
          git push origin HEAD:affiliate-release-current

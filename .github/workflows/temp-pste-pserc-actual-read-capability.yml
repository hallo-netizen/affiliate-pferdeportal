name: TEMP exact original PSTE to PSERC READ contract compatibility
on:
  push:
    branches: [fix/pste-kisten-einmalige-pruefung-20261107]
permissions: {contents: read}
jobs:
  actual-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call genuine PSTE read provider in unmodified original PHP, compare exact PSERC 0.28.54 contract
        shell: bash
        run: |
          set -euo pipefail
          Z=protocol/PROJECT_MEMORY/PROJEKTE/PFERDE_ATELIER/PLUGINS/INSTALLATIONS_PAKETE/PSTE-0.57.144.22-NUR-TEST.zip
          unzip -q "$Z" -d /tmp/original-pste
          I="/tmp/original-pste/Portal SEO Topic Engine/includes"
          cat > /tmp/actual-capability.php <<'PHP'
          <?php
          declare(strict_types=1);
          define('ABSPATH','/qa/');
          $root='/tmp/original-pste/Portal SEO Topic Engine/includes/';
          foreach(['editorializer','editorial-quality-gate','intent-profile','article-ownership-gate','compiler-read-capability'] as $name){
              $p=$root.'class-pste-'.$name.'.php';
              if(!is_file($p))throw new RuntimeException('MISSING ORIGINAL PHP '.$p);
              require_once $p;
          }
          $cap=PSTE_Compiler_Read_Capability::describe();
          $expected=[
              'contract'=>'PSTE_COMPILER_READ_CAPABILITY_V1',
              'capability_version'=>'1.7.0',
              'topic_metadata_schema'=>'PSTE_COMPILER_TOPIC_METADATA_V5_OPTIONAL_OWNER_GATE',
              'editorial_quality_contract'=>'PSTE_EDITORIAL_QUALITY_GATE_V4_HARD_TITLE_SURFACE_INTENT_SAFE',
              'intent_profile_contract'=>'PSTE_INTENT_PROFILE_V2_SEO_FIRST_EVIDENCE_BOUND_MULTI_BRANCH',
              'target_keyword_contract'=>'PSTE_TARGET_KEYWORD_V1_INTENT_BOUND_PPM_TITLE_COMPATIBLE',
              'engine_schema'=>'12',
              'handoff_fields'=>['title','target_keyword','category','article_type','plan_slot'],
              'optional_pre_handoff_ownership_fields'=>['owner_concept_id','semantic_intent_key'],
              'ownership_gate_contract'=>'PSTE_ARTICLE_OWNERSHIP_GATE_V1',
              'ownership_gate_required_when_upstream_candidate_is_promoted'=>true,
              'question_form_has_ownership_authority'=>false,
              'intent_first'=>true,
              'intent_metadata_internal_only'=>true,
              'content_or_design_payload_allowed'=>false,
              'write_capability_exposed'=>false,
          ];
          foreach($expected as $field=>$want){
              if(!array_key_exists($field,$cap)||$cap[$field]!==$want)
                  throw new RuntimeException('REAL_PSTE_PSERC_INCOMPATIBLE_'.$field.' = '.json_encode($cap[$field]??null));
          }
          if(!preg_match('/^[a-f0-9]{64}$/',(string)($cap['capability_sha256']??'')))
              throw new RuntimeException('REAL_PSTE_CAPABILITY_HASH_MISSING');
          echo "PASS original PSTE v22 read capability matches ALL 16 exact PSERC 0.28.54 requirements\n";
          echo "ACTUAL_CAPABILITY_JSON ".json_encode($cap,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE)."\n";
          PHP
          php /tmp/actual-capability.php

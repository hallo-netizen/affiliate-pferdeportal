name: Router Residue 6.72.151 Hardtest
on:
  push:
    branches: [design-performance-standalone-hardtest-20260922]
    paths:
      - 'AFFILIATE_HOBBYRAUM/router-residue-672151/**'
      - '.github/workflows/router-residue-672151-hardtest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-wordpress:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - name: Install WordPress
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          mkdir -p /tmp/wp-site
          /tmp/wp core download --path=/tmp/wp-site --version=7.1.1 --force
          /tmp/wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title='151 gate' --admin_user=admin --admin_password='fixture-12345' --admin_email=ci@example.test --skip-email
          /tmp/wp taxonomy create hp_listing_category 'Listing Categories' --object_type=post --path=/tmp/wp-site || true
          mkdir -p /tmp/wp-site/wp-content/plugins/ppar151-gate
          cp AFFILIATE_HOBBYRAUM/router-residue-672151/gate.php /tmp/wp-site/wp-content/plugins/ppar151-gate/
          php -l /tmp/wp-site/wp-content/plugins/ppar151-gate/gate.php
          /tmp/wp plugin activate ppar151-gate --path=/tmp/wp-site
      - name: Run public and admin gates
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8080 -t /tmp/wp-site >/tmp/server.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break || sleep 1; done
          curl -fsS 'http://127.0.0.1:8080/?ppar151=1' >/tmp/public.json
          curl -fsS 'http://127.0.0.1:8080/wp-admin/admin-post.php?action=ppar151_admin' >/tmp/admin.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/public.json')); a=json.load(open('/tmp/admin.json'))
          print('PUBLIC',p)
          print('ADMIN',a)
          assert p['old_hash']==p['new_hash'], p
          assert p['sanitize_new'] < p['sanitize_old']/5, p
          assert p['mutation_before']=='ebay' and p['mutation_after']=='awin', p
          assert a['sanitize'] > 500, a
          assert a['registry_filter_hits'] >= 100, a
          assert a['term_filter_hits'] >= 100, a
          print('PASS 6.72.151 residue batch: semantic hash identical, frontend normalization memo works, mutation key is fresh, admin remains uncached')
          PY

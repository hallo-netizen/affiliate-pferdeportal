name: K0 original batch deliver 17 November 24
on:
  push:
    branches: [konzept0-portal-neutral-20261002]
    paths: ['.github/workflows/k0-deliver-current-20261124.yml']
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check all original K0 single verifications and frozen 17-item source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/k0del
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('real_runs/k0')
          src=json.loads((root/'20261124-k0upload17-current/ORIGINAL_WP_K0_UPLOAD_PACKAGE.json').read_text())
          assert src['contract']=='WP_K0_UPLOAD_PACKAGE_V1'
          intake=src['k0_intake']
          assert intake['item_count']==17 and len(intake['items'])==17
          for i in range(1,18):
              rd=root/f'20261124-k0upload17-{i:02d}'
              verify=json.loads((rd/'WORDPRESS_VERIFY.json').read_text())
              assert verify['status']=='PASS' and verify['article_count']==1 and verify['canonical_binding']=='PASS',(i,verify)
              one=json.loads((rd/'WORDPRESS_SINGLE.json').read_text())
              assert one['contract']=='SYSTEM4_WORDPRESS_HANDOFF_V1'
              assert one['articles'][0]['title']==intake['items'][i-1]['title'],i
              print('K0_ORIGINAL_SINGLE_PASS',i)
          pathlib.Path('/tmp/k0del/WORDPRESS_INTAKE.json').write_text(json.dumps(intake,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Invoke unchanged ORIGINAL K0 WordPress batch exporter
        shell: bash
        run: |
          set -euo pipefail
          python3 -m engine.wordpress_batch_export /tmp/k0del/WORDPRESS_INTAKE.json /tmp/k0del/WORDPRESS_BATCH.json $(for n in $(seq -w 1 17); do printf 'real_runs/k0/20261124-k0upload17-%s/WORDPRESS_SINGLE.json ' "$n"; done)
          python3 - <<'PY'
          import json,hashlib
          p='/tmp/k0del/WORDPRESS_BATCH.json'
          d=json.load(open(p))
          assert d['contract']=='SYSTEM4_WORDPRESS_HANDOFF_V1' and d['article_count']==17
          assert d['batch_gate_status']=='SYSTEM4_BATCH_FULL_PASS_COLLECTED'
          assert d['wordpress_review']['direct_wordpress_upload_ready'] is True
          assert d['publish_allowed'] is False
          print('K0_ORIGINAL_BATCH_VERIFIED',len(d['articles']))
          print('K0_BATCH_SHA256',hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
      - name: Upload one original K0 verified batch as artifact
        uses: actions/upload-artifact@v4
        with:
          name: K0_WordPress_17_Original_Verifiziert_20261124
          path: /tmp/k0del/WORDPRESS_BATCH.json
          if-no-files-found: error
          retention-days: 30

name: System3 Isolated Codex LT Live

on:
  pull_request:
    paths:
      - 'isolated_system3/**'
      - '.github/workflows/system3-isolated-codex-lt-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-draft:
    runs-on: ubuntu-24.04
    outputs:
      article: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Checkout only to stage System 3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            isolated_system3
          sparse-checkout-cone-mode: true
      - name: Rebuild workspace as a history-free System 3 mini repository
        shell: bash
        run: |
          set -euo pipefail
          test -d isolated_system3
          tmp="$(mktemp -d)"
          cp -a isolated_system3/. "$tmp/"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "$tmp"/. .
          rm -rf "$tmp"
          git init -q
          git config user.name system3-test
          git config user.email system3-test@invalid.local
          git add -A
          git commit -qm 'isolated system3 runtime snapshot'
          test "$(find . -mindepth 1 -maxdepth 1 ! -name .git -printf '%f\n' | grep -Ev '^(README.md|codex_prompt.md|language_tool.py|.*\.py|.*\.json|.*\.md)$' | wc -l)" -eq 0
          test "$(git rev-list --count HEAD)" -eq 1
          test -z "$(git remote)"
          if git log --all --oneline --grep='STARTMASTER\|ACM\|PPM\|Zickzack' | grep -q .; then
            echo SYSTEM3_OLD_HISTORY_VISIBLE
            exit 1
          fi
          echo SYSTEM3_HISTORY_FREE_MINIREPO_PASS
      - name: Run Codex in isolated mini repository
        id: codex
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: .
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          prompt-file: codex_prompt.md

  language-tool:
    needs: codex-draft
    runs-on: ubuntu-24.04
    steps:
      - name: Sparse checkout only System 3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            isolated_system3
          sparse-checkout-cone-mode: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Real LanguageTool call and fail-closed verification
        env:
          SYSTEM3_ARTICLE: ${{ needs.codex-draft.outputs.article }}
        run: |
          python - <<'PY'
          import os
          from isolated_system3.language_tool import check_text
          article = os.environ.get('SYSTEM3_ARTICLE', '')
          if not article.strip():
              raise SystemExit('SYSTEM3_CODEX_OUTPUT_MISSING')
          if len(article.split()) < 120:
              raise SystemExit('SYSTEM3_CODEX_OUTPUT_TOO_SHORT')
          result = check_text(article)
          assert result['status'] == 'PASS'
          print('SYSTEM3_REAL_CODEX_PASS')
          print('SYSTEM3_REAL_LANGUAGETOOL_PASS')
          print('SYSTEM3_LT_MATCH_COUNT=' + str(result['match_count']))
          PY

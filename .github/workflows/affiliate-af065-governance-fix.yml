name: Affiliate ADCELL 6.72.19 one-shot status closeout

on:
  push:
    branches: [affiliate-release-current]
    paths:
      - '.github/workflows/affiliate-af065-governance-fix.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: affiliate-release-current
          fetch-depth: 0
      - name: Bind canonical local PASS and live blocker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          gp=Path('control/release-governance/CURRENT_RELEASE.json')
          g=json.loads(gp.read_text())
          if g.get('generation') != 55: raise SystemExit(f'unexpected generation {g.get("generation")}')
          if g['active_candidate']['version'] != '6.72.19': raise SystemExit('unexpected candidate version')
          if g['active_candidate']['current_source_manifest_sha256'] != '694af9869c7aa2b01a51f164173b1c51d9be7c24912c2e129420c3d111346a4b': raise SystemExit('unexpected manifest')
          if (g.get('objective_control') or {}).get('new_version_policy') != 'FORBIDDEN_UNLESS_CURRENT_BOUND_GATE_REQUIRES_CODE_CHANGE': raise SystemExit('AF-065 not repaired')
          ex=g['execution_state']
          nb=ex.get('next_state_binding') or {}
          if nb.get('sequence') != 9 or nb.get('state') != 'RUNNING_BOUND_RELEASE_GATES' or nb.get('authorized_next_action') != 'RUN_BOUND_RELEASE_GATES': raise SystemExit('prebound state transition mismatch')
          ex['sequence']=9
          ex['state']=nb['state']
          ex['authorized_next_action']=nb['authorized_next_action']
          ex['authorized_change_prefixes']=nb['authorized_change_prefixes']
          ex['bound_user_scope_action']='ADCELL_CURRENT; DIGISTORE24_DEFERRED; OTTO_PAUSED; 6.72.19_CANONICAL_GATES_FRESH_UNPACK_IDENTITY_PASS; LIVE_API_WP_MARIADB_E2E_BLOCKED_BY_ADCELL_ACCOUNT_ACCESS'
          ex['next_state_binding']={
            'sequence':10,
            'state':'RUNNING_BOUND_RELEASE_GATES',
            'authorized_next_action':'RUN_BOUND_RELEASE_GATES',
            'authorized_change_prefixes':ex['authorized_change_prefixes']
          }
          a=ex['adcell_api_v2_automation']
          a['status']='CANONICAL_67219_GATES_FRESH_UNPACK_IDENTITY_PASS_LIVE_BLOCKED'
          a['evidence_ref']='release/affiliate-zentrale/evidence/adcell_67219_canonical_full_gate_20260912.txt'
          a['source_commit']='df3e97119fe44ac864701d8de6b946c7c6c3416c'
          a['source_manifest_sha256']='694af9869c7aa2b01a51f164173b1c51d9be7c24912c2e129420c3d111346a4b'
          a['committed_gate']='CANONICAL_67219_FULL_GATE_PASS_RUN_34690118524_JOB_103543774405'
          a['plugin_acceptance']='CANONICAL_LOCAL_ACCEPTANCE_PASS_LIVE_ACCEPTANCE_FORBIDDEN_UNTIL_REAL_ADCELL_API_AND_WORDPRESS_MARIADB_E2E'
          a['version_67219_status']='CANONICAL_GATES_FRESH_UNPACK_IDENTITY_PASS_LIVE_BLOCKED'
          h=ex['hobbyroom_current']
          h['status']='BLOCKED'
          h['task_id']='adcell-live-api-wordpress-e2e-20260912'
          h['next_action']='Wait for restored ADCELL account access; then run exactly the real ADCELL API v2 and WordPress/MariaDB E2E gates. No source changes before that.'
          h['return_path']='Real ADCELL API v2 -> real WordPress/MariaDB E2E -> only then Live-PASS. OTTO stays paused; Digistore24 deferred.'
          g['execution_state']=ex
          g['generation']=56
          g['user_scope_lock']['adcell_work_status']='CANONICAL_67219_GATES_FRESH_UNPACK_IDENTITY_PASS_LIVE_BLOCKED'
          g['objective_control']['current_milestone']='ADCELL_REAL_LIVE_API_AND_WORDPRESS_MARIADB_E2E_BLOCKED_BY_ACCOUNT_ACCESS'
          gp.write_text(json.dumps(g,ensure_ascii=False,indent=2)+'\n')

          sp=Path('protocol/AFFILIATE_RELEASE_ADCELL_AUTOMATION_SCOPE_20260911.md')
          s=sp.read_text()
          marker='## CANONICAL 6.72.19 CLOSEOUT – 2026-09-12'
          if marker not in s:
              s += f'''\n\n{marker}\n\n- Pluginbüro-Stand 6.72.17 und der geprüfte ADCELL-API-v2-Fix wurden konfliktfrei als 6.72.19 zusammengeführt und kanonisch gebunden.\n- Source-Manifest SHA-256: `694af9869c7aa2b01a51f164173b1c51d9be7c24912c2e129420c3d111346a4b`.\n- Kanonischer Full-Gate-Lauf `34690118524`, Job `103543774405`: PASS.\n- PASS: ADCELL static, hash-identischer Runtime-Positiv/Negativ-Nachweis, Awin/OTTO 18/18, Banner Positiv/Negativ, PHP 21/21, Release-Guard governance/source/tree/start, Fresh-Unpack + Source-Identity 26/26, Version 6.72.19.\n- Evidence: `release/affiliate-zentrale/evidence/adcell_67219_canonical_full_gate_20260912.txt`.\n- **Kein Live-PASS:** echter ADCELL-API-Lauf und echter WordPress/MariaDB-E2E bleiben blockiert, solange der ADCELL-Accountzugang/Passwort-Reset nicht funktioniert.\n- Bis dahin: keine weitere Sourcearbeit; OTTO/Awin bleibt pausiert, Digistore24 deferred.\n'''
              sp.write_text(s)
          PY
          python3 control/release-governance/release_guard.py governance-check
          python3 control/release-governance/release_guard.py source-check
          python3 control/release-governance/release_guard.py tree-check
          python3 control/release-governance/release_guard.py start --branch affiliate-release-current
          git add control/release-governance/CURRENT_RELEASE.json protocol/AFFILIATE_RELEASE_ADCELL_AUTOMATION_SCOPE_20260911.md
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Affiliate ADCELL: close canonical 6.72.19 local gates, bind live blocker [skip ci]'
          git push origin HEAD:affiliate-release-current

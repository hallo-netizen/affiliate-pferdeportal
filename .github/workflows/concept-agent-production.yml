name: Concept Agent Production Control

on:
  push:
    branches:
      - 'concept-agent/production-control'
    paths:
      - 'concept_agent/run_requests/**'

permissions:
  contents: write

concurrency:
  group: concept-agent-production-control
  cancel-in-progress: false

jobs:
  run-request:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          path: control-branch
          fetch-depth: 2
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          path: project-main
          fetch-depth: 1
      - name: Resolve exactly one new request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          cd control-branch
          mapfile -t reqs < <(git diff-tree --no-commit-id --name-only -r HEAD | grep -E '^concept_agent/run_requests/[A-Za-z0-9._-]+\.json$' || true)
          [ "${#reqs[@]}" -eq 1 ] || { echo "EXACTLY_ONE_RUN_REQUEST_REQUIRED:${#reqs[@]}"; exit 2; }
          test -f "${reqs[0]}"
          echo "request_ref=${reqs[0]}" >> "$GITHUB_OUTPUT"
      - name: Validate request
        id: parsed
        env:
          REQUEST_REF: ${{ steps.request.outputs.request_ref }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/concept-agent-return
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys
          from pathlib import Path
          out=Path('/tmp/concept-agent-return/CONCEPT_AGENT_BLOCKED.json')
          def block(reason):
              out.write_text(json.dumps({
                  'contract':'CONCEPT_AGENT_RUN_BLOCKED_V1',
                  'status':'BLOCKED',
                  'reason':reason,
                  'publish_allowed':False
              },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print(reason,file=sys.stderr)
              raise SystemExit(20)
          try:
              p=Path('control-branch')/os.environ['REQUEST_REF']
              x=json.loads(p.read_text(encoding='utf-8'))
          except Exception:
              block('REQUEST_JSON_INVALID')
          contract=x.get('contract')
          mode=x.get('mode')
          if contract=='CONCEPT_AGENT_GITHUB_RUN_REQUEST_V1':
              allowed={'contract','mode','publish_allowed','request_id'}
              if mode=='run-current':
                  allowed.add('intake_snapshot_b64')
              if set(x) not in ({'contract','mode','publish_allowed','request_id'}, allowed): block('REQUEST_FIELDS_INVALID')
              if mode not in {'simulate-all','run-current'}: block('REQUEST_MODE_INVALID')
              if 'intake_snapshot_b64' in x and (not isinstance(x.get('intake_snapshot_b64'),str) or not x['intake_snapshot_b64']): block('INTAKE_SNAPSHOT_B64_INVALID')
          elif contract=='CONCEPT_AGENT_BINDING_PERSIST_REQUEST_V1':
              if set(x) != {'contract','mode','publish_allowed','request_id','transport_b64'}: block('REQUEST_FIELDS_INVALID')
              if mode!='persist-binding': block('REQUEST_MODE_INVALID')
              if not isinstance(x.get('transport_b64'),str) or not x['transport_b64']: block('TRANSPORT_B64_MISSING')
          else:
              block('REQUEST_CONTRACT_INVALID')
          if x['publish_allowed'] is not False: block('REQUEST_PUBLISH_MUST_BE_FALSE')
          if not re.fullmatch(r'[A-Za-z0-9._-]{8,120}',x['request_id']): block('REQUEST_ID_INVALID')
          print('mode='+mode)
          print('request_id='+x['request_id'])
          PY
      - name: Download exact LanguageTool 6.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/system4-lt68
          curl --fail --location --retry 3 \
            https://github.com/jxmorris12/language_tool_python/releases/download/LanguageTool-6.8/LanguageTool-6.8.zip \
            -o /tmp/system4-lt68/LanguageTool-6.8.zip
          echo '6a7f6b67b779ae9505f7579f0c41453ea8d1bd72ae750bdc2c55ba974281467d  /tmp/system4-lt68/LanguageTool-6.8.zip' | sha256sum -c -
          unzip -q /tmp/system4-lt68/LanguageTool-6.8.zip -d /tmp/system4-lt68
          echo '2122882e800d312a0543d895c56c0a84a9bb131c9b9846efd8fc033129353ae8  /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar' | sha256sum -c -
      - name: Regression tests for productive binder and runner
        env:
          PYTHONPATH: control-branch/concept_agent:control-branch/isolated_system4
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            control-branch/concept_agent/tests/test_runner.py
          python3 control-branch/concept_agent/resumable_runner.py simulate-mid-positive --out /tmp/concept-agent-regression-mid-positive
          python3 control-branch/concept_agent/resumable_runner.py simulate-mid-negative --out /tmp/concept-agent-regression-mid-negative
      - name: Run fixed route
        env:

          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MODE: ${{ steps.parsed.outputs.mode }}
          REQUEST_REF: ${{ steps.request.outputs.request_ref }}
          CONCEPT_AGENT_STATE_BRANCH: ${{ github.ref_name }}
          CONCEPT_AGENT_MODEL: gpt-5.6-sol
          CONCEPT_AGENT_CHECKER_CMD: python3 control-branch/concept_agent/system4_checker.py
          SYSTEM4_LANGUAGETOOL_JAR: /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/concept-agent-return
          if [[ "$MODE" == 'persist-binding' ]]; then
            python3 -c "import base64,json,os,pathlib; req=json.loads((pathlib.Path('control-branch')/os.environ['REQUEST_REF']).read_text(encoding='utf-8')); pathlib.Path('/tmp/concept-agent-binding-candidate.json').write_bytes(base64.b64decode(req['transport_b64'],validate=True))"
            set +e
            python3 control-branch/concept_agent/binding_transport_gate.py accept \
              --pointer project-main/control/startmaster0107/CONCEPT_AGENT_CURRENT_WORK_BINDING_POINTER.json \
              --candidate /tmp/concept-agent-binding-candidate.json \
              --durable control-branch/concept_agent/current/CONCEPT_AGENT_CURRENT_WORK_BINDING.json \
              --receipt /tmp/concept-agent-return/CONCEPT_AGENT_DURABLE_BINDING_RECEIPT_V1.json \
              2> /tmp/concept-agent-return/BINDING_PERSIST_ERROR.txt
            PERSIST_RC=$?
            set -e
            if [[ "$PERSIST_RC" -ne 0 ]]; then
              PERSIST_REASON="$(tail -n 1 /tmp/concept-agent-return/BINDING_PERSIST_ERROR.txt | sed 's/^CONCEPT_AGENT_BINDING_TRANSPORT_BLOCKED://')"
              PERSIST_REASON="$PERSIST_REASON" python3 -c "import json,os,pathlib; pathlib.Path('/tmp/concept-agent-return/CONCEPT_AGENT_BLOCKED.json').write_text(json.dumps({'contract':'CONCEPT_AGENT_RUN_BLOCKED_V1','status':'BLOCKED','reason':os.environ.get('PERSIST_REASON') or 'BINDING_PERSISTENCE_REJECTED','publish_allowed':False},indent=2)+'\\n')"
              exit 20
            fi
            cd control-branch
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add concept_agent/current/CONCEPT_AGENT_CURRENT_WORK_BINDING.json
            if ! git diff --cached --quiet; then
              git commit -m "Concept Agent: persist exact current work binding [skip ci]"
              git push origin HEAD:concept-agent/production-control
            fi
            cd ..
          elif [[ "$MODE" == 'simulate-all' ]]; then
            python3 project-main/concept_agent/runner.py simulate-one --out /tmp/concept-agent-return/one
            python3 project-main/concept_agent/runner.py simulate-multi --out /tmp/concept-agent-return/multi
            python3 project-main/concept_agent/runner.py simulate-negative --out /tmp/concept-agent-return/negative
            python3 control-branch/concept_agent/full_workflow_gate.py simulate-all-entries --out /tmp/concept-agent-return/full-workflow-reentry
            python3 control-branch/concept_agent/full_workflow_gate.py simulate-route-matrix --out /tmp/concept-agent-return/stage-route-matrix
            python3 control-branch/concept_agent/runtime_genericity_guard.py > /tmp/concept-agent-return/CONCEPT_AGENT_RUNTIME_GENERICITY_PROOF_V1.console.json
            cp /tmp/concept-agent-genericity/CONCEPT_AGENT_RUNTIME_GENERICITY_PROOF_V1.json /tmp/concept-agent-return/CONCEPT_AGENT_RUNTIME_GENERICITY_PROOF_V1.json
            python3 control-branch/concept_agent/entry_hardlock.py simulate --out /tmp/concept-agent-return/entry-hardlock
            python3 control-branch/concept_agent/binding_transport_gate.py simulate --out /tmp/concept-agent-return/binding-transport
            set +e
            python3 control-branch/concept_agent/entry_hardlock.py probe \
              --pointer project-main/control/startmaster0107/CONCEPT_AGENT_CURRENT_WORK_BINDING_POINTER.json \
              --current-state project-main/control/startmaster0107/CURRENT_STATE.json \
              --out /tmp/concept-agent-return/real16-entry-hardlock-missing.json
            REAL16_HARDLOCK_RC=$?
            set -e
            [ "$REAL16_HARDLOCK_RC" -eq 20 ] || { echo "REAL16_MISSING_TRANSPORT_MUST_BLOCK:$REAL16_HARDLOCK_RC"; exit 2; }
            python3 -c "import json; x=json.load(open('/tmp/concept-agent-return/real16-entry-hardlock-missing.json')); assert x.get('status')=='BLOCKED'; assert x.get('reason')=='EXACT_CROSS_CHAT_TRANSPORT_MISSING'; assert x.get('expected_transport_sha256')=='f513387f54c44e70e7d8b6a9be34bb305e6e559a1689c5f88168d31d4b4611c4'"
            python3 control-branch/concept_agent/full_workflow_gate.py verify-current-entry \
              --pointer project-main/control/startmaster0107/CONCEPT_AGENT_CURRENT_WORK_BINDING_POINTER.json \
              --current-state project-main/control/startmaster0107/CURRENT_STATE.json \
              --out /tmp/concept-agent-return/real16-current-entry
            python3 control-branch/concept_agent/full_workflow_gate.py verify-current-negative \
              --pointer project-main/control/startmaster0107/CONCEPT_AGENT_CURRENT_WORK_BINDING_POINTER.json \
              --current-state project-main/control/startmaster0107/CURRENT_STATE.json \
              --out /tmp/concept-agent-return/real16-current-negative
            python3 control-branch/concept_agent/full_e2e_simulation.py --repo control-branch --out /tmp/concept-agent-return/chat-to-final-file --count 3
            python3 control-branch/isolated_system4/downstream_1n_contract_probe.py | tee /tmp/concept-agent-return/DOWNSTREAM_1N_CONTRACT_PROBE.txt
            PYTHONPATH="control-branch/concept_agent:project-main/concept_agent:${PYTHONPATH:-}" \
            python3 control-branch/concept_agent/fixed_block_route.py acceptance \
              --repo project-main \
              --out /tmp/concept-agent-return/fixed-block-route

            python3 control-branch/concept_agent/resumable_runner.py simulate-mid-positive --out /tmp/concept-agent-return/mid-positive
            python3 control-branch/concept_agent/resumable_runner.py simulate-mid-negative --out /tmp/concept-agent-return/mid-negative

            CONCEPT_AGENT_PERSIST_GITHUB_STATE=1 \
            CONCEPT_AGENT_STATE_PATH=concept_agent/runtime/SIMULATION_CURRENT_STATE.json \
            python3 control-branch/concept_agent/resumable_runner.py simulate-mid-positive --out /tmp/concept-agent-return/mid-positive-github
          else
            BINDING='control-branch/concept_agent/current/CONCEPT_AGENT_CURRENT_WORK_BINDING.json'
            POINTER='project-main/control/startmaster0107/CONCEPT_AGENT_CURRENT_WORK_BINDING_POINTER.json'
            CURRENT='project-main/control/startmaster0107/CURRENT_STATE.json'
            STATE='control-branch/concept_agent/runtime/CURRENT_STATE.json'

            python3 control-branch/concept_agent/full_workflow_gate.py verify-current-entry \
              --pointer "$POINTER" \
              --current-state "$CURRENT" \
              --out /tmp/concept-agent-return/current-entry \
              | tee /tmp/concept-agent-return/CURRENT_ENTRY_RESULT.json

            python3 control-branch/concept_agent/full_workflow_gate.py stage-route \
              --entry-proof /tmp/concept-agent-return/current-entry/CONCEPT_AGENT_CURRENT_ENTRY_PROOF.json \
              --out /tmp/concept-agent-return/CONCEPT_AGENT_STAGE_ROUTE_V1.json \
              | tee /tmp/concept-agent-return/STAGE_ROUTE_RESULT.json

            NEXT_STAGE="$(python3 -c "import json; x=json.load(open('/tmp/concept-agent-return/STAGE_ROUTE_RESULT.json',encoding='utf-8')); assert x.get('ok') is True and x.get('status')=='PASS'; print(x['next_stage'])")"

            case "$NEXT_STAGE" in
              ARTICLE_PRODUCTION)
                HARDLOCK_ARGS=(probe --pointer "$POINTER" --current-state "$CURRENT" --out /tmp/concept-agent-return/CONCEPT_AGENT_ENTRY_HARDLOCK_DECISION_V1.json)
                if [[ -f "$BINDING" ]]; then
                  HARDLOCK_ARGS+=(--transport "$BINDING")
                fi
                set +e
                python3 control-branch/concept_agent/entry_hardlock.py "${HARDLOCK_ARGS[@]}"
                HARDLOCK_RC=$?
                set -e
                PYTHONPATH="control-branch/concept_agent:project-main/concept_agent:${PYTHONPATH:-}" \
                python3 control-branch/concept_agent/fixed_block_route.py route \
                  --decision /tmp/concept-agent-return/CONCEPT_AGENT_ENTRY_HARDLOCK_DECISION_V1.json \
                  --out /tmp/concept-agent-return/CONCEPT_AGENT_FIXED_BLOCK_ROUTE_V1.json \
                  | tee /tmp/concept-agent-return/FIXED_BLOCK_ROUTE_RESULT.json
                REQUIRED_ACTION="$(python3 -c "import json;print(json.load(open('/tmp/concept-agent-return/FIXED_BLOCK_ROUTE_RESULT.json',encoding='utf-8'))['required_action'])")"
                if [[ "$REQUIRED_ACTION" == 'RESTART_BATCH_FROM_INTAKE' ]]; then
                  python3 -c "import json; x=json.load(open('/tmp/concept-agent-return/CONCEPT_AGENT_FIXED_BLOCK_ROUTE_V1.json',encoding='utf-8')); assert x.get('required_action')=='RESTART_BATCH_FROM_INTAKE' and x.get('next_stage')=='INTAKE'; assert x.get('chat_may_choose_action') is False and x.get('reconstruction_allowed') is False and x.get('publish_allowed') is False"
                  python3 -c "import base64,json,os,pathlib,sys; req=json.loads((pathlib.Path('control-branch')/os.environ['REQUEST_REF']).read_text(encoding='utf-8')); raw=req.get('intake_snapshot_b64'); raw or sys.exit('RESTART_INTAKE_SNAPSHOT_MISSING'); pathlib.Path('/tmp/concept-agent-intake-snapshot.json').write_bytes(base64.b64decode(raw,validate=True))"
                  python3 project-main/concept_agent/intake_bridge.py prepare                     /tmp/concept-agent-intake-snapshot.json                     /tmp/concept-agent-return/CONCEPT_AGENT_INTAKE.json                     | tee /tmp/concept-agent-return/CONCEPT_AGENT_INTAKE_RESULT.json
                  python3 -c "import json; x=json.load(open('/tmp/concept-agent-return/CONCEPT_AGENT_INTAKE_RESULT.json',encoding='utf-8')); assert x.get('status')=='CONCEPT_AGENT_INTAKE_READY' and isinstance(x.get('item_count'),int) and x['item_count']>=1 and x.get('publish_allowed') is False"
                  printf '%s\n' '{"contract":"CONCEPT_AGENT_RESTART_EXECUTED_V1","status":"PASS","selected_action":"RESTART_BATCH_FROM_INTAKE","next_stage":"INTAKE","entry_ref":"concept_agent/intake_bridge.py","allowed_operation":"PREPARE_INTAKE_ONLY","intake_executed":true,"chat_may_choose_action":false,"reconstruction_allowed":false,"publish_allowed":false}' > /tmp/concept-agent-return/CONCEPT_AGENT_RESTART_EXECUTED_V1.json
                elif [[ "$REQUIRED_ACTION" == 'TERMINAL_SECURITY_BLOCK' ]]; then
                  exit 2
                else
                  if [[ "$HARDLOCK_RC" -ne 0 || "$REQUIRED_ACTION" != 'CONTINUE_CURRENT_BATCH' ]]; then
                    exit 2
                  fi
                  EXPECTED="$(python3 -c "import json;print(json.load(open('$POINTER'))['cross_chat_transport_sha256'])")"
                  args=(run --binding "$BINDING" --binding-sha256 "$EXPECTED" --out /tmp/concept-agent-return/production)
                  if [[ -f "$STATE" ]]; then
                    args+=(--state "$STATE")
                  fi
                  CONCEPT_AGENT_PERSIST_GITHUB_STATE=1 \
                  CONCEPT_AGENT_STATE_PATH=concept_agent/runtime/CURRENT_STATE.json \
                  python3 control-branch/concept_agent/resumable_runner.py "${args[@]}"
                fi
                ;;
              COMPLETE)
                printf '%s\n' '{"contract":"CONCEPT_AGENT_RUN_COMPLETE_V1","status":"PASS","reason":"WORKFLOW_ALREADY_COMPLETE","publish_allowed":false}' > /tmp/concept-agent-return/CONCEPT_AGENT_COMPLETE.json
                ;;
              INTAKE|RESEARCH|RESEARCH_BOUND|AUTHORING_BOUND|PSERC_PACKAGE|ENDSTEMPEL|CHAT_FILE_RETURN)
                # The entrance has bound the existing workflow stage. The domain executor remains unchanged.
                # The chat may receive only CONCEPT_AGENT_STAGE_ROUTE_V1.json and may not select another stage.
                ;;
              *)
                printf '%s\n' '{"contract":"CONCEPT_AGENT_RUN_BLOCKED_V1","status":"BLOCKED","reason":"UNKNOWN_NEXT_STAGE","publish_allowed":false}' > /tmp/concept-agent-return/CONCEPT_AGENT_BLOCKED.json
                exit 20
                ;;
            esac
          fi
      - name: Upload exact return package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concept-agent-chat-return-${{ github.run_id }}
          path: /tmp/concept-agent-return/
          if-no-files-found: error
          retention-days: 7

name: V6638 Find Exact Base
on:
  push:
    branches: [v6638-exact-artifact-staging-20260829]
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan repo ZIPs for affiliate versions and exact V6634 payload
        shell: bash
        run: |
          set -euo pipefail
          for z in $(find . -maxdepth 2 -type f -name '*.zip' -size -20M | sort); do
            d=$(mktemp -d)
            if unzip -q "$z" -d "$d" 2>/dev/null; then
              f=$(find "$d" -type f -name pferdeportal-affiliate-router.php | head -1 || true)
              if [ -n "$f" ]; then
                echo "ZIP=$z SIZE=$(stat -c%s "$z") SHA=$(sha256sum "$z"|cut -d' ' -f1)"
                grep -m1 -E '^[[:space:]]*\*[[:space:]]*Version:' "$f" || true
                grep -m1 -F 'EBAY_RUNTIME_BUILD' "$f" || true
                root=$(dirname "$f")
                if [ -f CI_V6638/V6634_PAYLOAD_SHA256.txt ]; then
                  if (cd "$root" && sha256sum -c "$GITHUB_WORKSPACE/CI_V6638/V6634_PAYLOAD_SHA256.txt" >/dev/null 2>&1); then
                    echo EXACT_V6634_PAYLOAD_FOUND="$z"
                  fi
                fi
              fi
            fi
            rm -rf "$d"
          done

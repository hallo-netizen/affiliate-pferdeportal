name: V6.52 materialize post13 gate diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'v652-core-cron-selfpump-rootfix-20260822'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact corrected V6.51 gate after patch13
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .github/v652/runner/materialize-v651-after13.sh
          .github/v652/runner/materialize-v651-after13.sh
      - name: Upload diagnostic gate
        uses: actions/upload-artifact@v4
        with:
          name: V652_GATE_MATERIALIZED_DIAGNOSTIC
          path: V652_GATE_MATERIALIZED_DIAGNOSTIC/
          if-no-files-found: error
          retention-days: 7

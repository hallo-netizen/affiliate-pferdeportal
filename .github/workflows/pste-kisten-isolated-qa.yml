name: PSTE Kistenprinzip QA only
on:
  push:
    branches: [fix/pste-kisten-einmalige-pruefung-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kisten-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unchanged baseline package is still readable
        run: |
          set -euo pipefail
          unzip -tq protocol/PROJECT_MEMORY/PROJEKTE/PFERDE_ATELIER/PLUGINS/INSTALLATIONS_PAKETE/PSTE-0.57.144.22-NUR-TEST.zip > /dev/null
      - name: Kisten transfer technical checks only; semantic/live E2E are not claimed
        run: |
          set -euo pipefail
          DIR=protocol/PROJECT_MEMORY/PROJEKTE/PFERDE_ATELIER/PLUGINS/QA_ONLY
          php -l "$DIR/pste_kisten_transfer_v1.php"
          php -l "$DIR/test_pste_kisten_transfer_v1.php"
          php "$DIR/test_pste_kisten_transfer_v1.php"

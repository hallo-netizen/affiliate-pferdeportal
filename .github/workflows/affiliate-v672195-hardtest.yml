name: Affiliate Current Bound Release Gate

on:
  workflow_dispatch:
  push:
    branches:
      - affiliate-release-current
    paths:
      - 'release/affiliate-zentrale/current/**'
      - 'release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt'
      - 'control/release-governance/CURRENT_RELEASE.json'
      - '.github/workflows/affiliate-v672195-hardtest.yml'

permissions:
  contents: read

jobs:
  current-bound-gate:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Current governance and exact source binding
        shell: bash
        run: |
          set -euo pipefail
          python3 control/release-governance/release_guard.py governance-check
          python3 control/release-governance/release_guard.py source-check
          python3 control/release-governance/release_guard.py start --branch affiliate-release-current
          python3 - <<'PY'
          import hashlib, json, pathlib
          c=json.loads(pathlib.Path('control/release-governance/CURRENT_RELEASE.json').read_text())
          a=c['active_candidate']
          assert c['execution_state']['authorized_next_action']=='RUN_BOUND_RELEASE_GATES'
          assert a['version']=='6.72.203'
          assert a['source_file_count']==28
          p=pathlib.Path(a['current_source_manifest_ref'])
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          assert got==a['current_source_manifest_sha256'], (got,a['current_source_manifest_sha256'])
          rows=[x for x in p.read_text().splitlines() if x.strip()]
          assert len(rows)==28, len(rows)
          main=pathlib.Path(a['source_root'])/'pferdeportal-affiliate-router.php'
          s=main.read_text()
          assert 'Version: '+a['version'] in s
          assert "const VERSION = '"+a['version']+"';" in s
          print('PASS CURRENT 6.72.203 / 28 / MANIFEST BOUND')
          PY
          find release/affiliate-zentrale/current/affiliate-portal-router -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Fresh WordPress MariaDB
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-site
          mkdir -p /tmp/wp-site
          /tmp/wp core download --path=/tmp/wp-site --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title='Affiliate Current Gate' --admin_user=admin --admin_password='ci-current-gate!' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp-site/wp-content/mu-plugins
          cat >/tmp/wp-site/wp-content/mu-plugins/pferde-e2e-design-contract.php <<'PHP'
          <?php
          if (!class_exists('Pferde_Template_Kit')) {
              class Pferde_Template_Kit {
                  public static function affiliate_contract_version(){ return '1.0'; }
                  public static function design_profile(){ return 'pferde_atelier'; }
                  public static function design_profile_contract_version(){ return '1.0'; }
                  public static function affiliate_page_type($page_id){ return get_post_field('post_parent',$page_id) ? 'category' : 'hub1'; }
              }
          }
          PHP
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-site
          /tmp/wp eval 'if(Pferdeportal_Affiliate_Router::VERSION!=="6.72.203"){exit(2);} echo "PASS CURRENT_PLUGIN_ACTIVE\n";' --path=/tmp/wp-site

      - name: AFF-ERR-059 to 062 focused KISS gate
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/wp-site/current_banner_gate.php <<'PHP'
          <?php
          if (!class_exists('Pferdeportal_Affiliate_Router')) { fwrite(STDERR,"FAIL plugin missing\n"); exit(2); }
          $o=Pferdeportal_Affiliate_Router::instance();
          $call=function($name,...$args)use($o){$m=new ReflectionMethod($o,$name);$m->setAccessible(true);return $m->invokeArgs($o,$args);};
          $ok=function($cond,$name){if(!$cond){fwrite(STDERR,"FAIL ".$name."\n");exit(1);}echo "PASS ".$name."\n";};
          $term=function($name,$slug,$parent=0){$t=get_term_by('slug',$slug,'category');if($t&&!is_wp_error($t))return(int)$t->term_id;$r=wp_insert_term($name,'category',['slug'=>$slug,'parent'=>$parent]);if(is_wp_error($r)){fwrite(STDERR,"FAIL term ".$slug."\n");exit(2);}return(int)$r['term_id'];};

          $aus=$term('Ausrüstung','ausruestung');
          $sattel=$term('Sattel','sattel',$aus);
          $sch=$term('Schabracken','schabracken',$sattel);

          $call('maybe_install_creative_library_schema');
          $call('maybe_install_output_objects_schema');
          $portalKey=$call('output_local_portal_key');
          $portal=$call('output_portal_by_key',$portalKey,true);
          $ok(is_array($portal),'portal_ready');
          $targets=$call('output_portal_targets',$portal);
          $target=null;
          foreach((array)$targets as $t){if(is_array($t)&&sanitize_key((string)($t['slug']??''))==='schabracken'){$target=$t;break;}}
          $ok(is_array($target),'schabracken_target');

          global $wpdb;
          $table=$call('creative_library_table');
          $seed=function($external,$identity,$topicTargets='[]')use($wpdb,$table){
              $row=[
                'provider'=>'direct','partner_external_id'=>'kiss','partner_name'=>'KISS Partner',
                'external_id'=>$external,'identity_hash'=>$identity,'creative_type'=>'banner',
                'title'=>'KISS Banner '.$external,'description'=>'','tags'=>'',
                'image_url'=>'https://example.com/'.$external.'.png',
                'destination_url'=>'https://example.com/','tracking_url'=>'https://example.com/track/'.$external,
                'width'=>728,'height'=>90,'source_status'=>'active','source_kind'=>'banner',
                'availability_state'=>'active','missing_count'=>0,'last_complete_run'=>'',
                'review_status'=>'review','selected'=>0,'content_scope'=>'unclassified','scope_source'=>'',
                'classified_at'=>0,'topic_status'=>'auto_verified','topic_score'=>0,'topic_targets'=>$topicTargets,
                'source_hash'=>hash('sha256','src|'.$external),
                'payload'=>wp_json_encode([
                    '_dimension_state'=>'verified','_image_sha256'=>hash('sha256','img|'.$external),
                    '_image_mime'=>'image/png','_image_bytes'=>1000,'_measured_at'=>time(),
                    '_destination_source'=>'provider_explicit'
                ],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES),
                'first_seen'=>time(),'last_seen'=>time()
              ];
              $wpdb->insert($table,$row,array_fill(0,count($row),'%s'));
              return $wpdb->get_row($wpdb->prepare("SELECT * FROM {$table} WHERE id=%d",(int)$wpdb->insert_id),ARRAY_A);
          };

          // AFF-ERR-059: FIXED bleibt separat und gewinnt vor Automatik.
          $id1=hash('sha256','current-fixed');
          $r1=$seed('fixed',$id1);
          $saved=$call('output_set_portal_decision',$portalKey,$id1,'approved','fixed',[
              'target_type'=>(string)$target['type'],'target_key'=>(string)$target['key'],
              'target_label'=>(string)$target['label'],'target_context'=>(string)$target['context'],'slot_id'=>''
          ]);
          $ok(!is_wp_error($saved),'AFF_ERR_059_fixed_saved');
          $c1=$call('output_classify_for_portal',$r1,$portal,'portal_banner');
          $ok(is_array($c1)&&($c1['source']??'')==='manual_fixed_target','AFF_ERR_059_fixed_precedence');

          // AFF-ERR-060: Ohne spezifische Karte darf der vorhandene allgemeine Fallback greifen.
          $id2=hash('sha256','current-general');
          $r2=$seed('general',$id2,'[]');
          $p2=$call('output_plan_creative',$r2,true,$portalKey);
          $ok(is_array($p2)&&((int)($p2['active']??0)>=1),'AFF_ERR_060_general_fallback_active');
          $ids=$call('creative_library_existing_campaign_ids',$id2);
          $fallback=false;
          foreach((array)$ids as $cid){$c=$call('campaign_from_post',get_post((int)$cid));if(is_array($c)&&!empty($c['active'])&&sanitize_key((string)($c['assignment_mode']??''))==='fallback'){$fallback=true;break;}}
          $ok($fallback,'AFF_ERR_060_general_fallback_mode');

          // AFF-ERR-061: Nur identische Creative-Identität darf als Variante zusammenfallen.
          $a=['campaign'=>['creative_type'=>'banner','creative_identity_hash'=>hash('sha256','A'),'dimensions'=>'728x90']];
          $b=['campaign'=>['creative_type'=>'banner','creative_identity_hash'=>hash('sha256','B'),'dimensions'=>'728x90']];
          $a2=['campaign'=>['creative_type'=>'banner','creative_identity_hash'=>hash('sha256','A'),'dimensions'=>'1456x180']];
          $sa=$call('banner_candidate_variant_signature',$a);
          $sb=$call('banner_candidate_variant_signature',$b);
          $sa2=$call('banner_candidate_variant_signature',$a2);
          $ok($sa!==''&&$sb!==''&&$sa!==$sb,'AFF_ERR_061_distinct_creatives_not_deduped');
          $ok($sa===$sa2,'AFF_ERR_061_same_identity_variant_deduped');

          // AFF-ERR-062: sichtbare Kennzeichnung bleibt im aktuellen Renderer.
          $src=file_get_contents(WP_PLUGIN_DIR.'/affiliate-portal-router/pferdeportal-affiliate-router.php');
          $ok(substr_count($src,'ppar-affiliate-label')>=3 && substr_count($src,'>Anzeige<')>=3,'AFF_ERR_062_anzeige_visible');

          echo "CURRENT_AFF_ERR_059_062_GATE_COMPLETE\n";
          PHP
          /tmp/wp eval-file /tmp/wp-site/current_banner_gate.php --path=/tmp/wp-site | tee /tmp/current-banner-gate.log
          grep -F 'CURRENT_AFF_ERR_059_062_GATE_COMPLETE' /tmp/current-banner-gate.log

      - name: Performance and DB hardlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('control/release-governance/CURRENT_RELEASE.json').read_text()
          assert '"new_frontend_db_queries": 0' in p
          assert '"new_frontend_http_calls": 0' in p
          assert '"new_tables": 0' in p
          print('PASS PERFORMANCE_DB_HARDLOCK')
          PY
          echo "CURRENT_BOUND_RELEASE_GATES_PASS"

      - name: Package exact tested source
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/AFFILIATE_ZENTRALE_6.72.203.zip
          (cd release/affiliate-zentrale/current && zip -qr /tmp/AFFILIATE_ZENTRALE_6.72.203.zip affiliate-portal-router)
          rm -rf /tmp/final203 && mkdir -p /tmp/final203
          unzip -q /tmp/AFFILIATE_ZENTRALE_6.72.203.zip -d /tmp/final203
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          m=Path('release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt')
          expected={line.split('  ',1)[1]:line.split('  ',1)[0] for line in m.read_text().splitlines() if line.strip()}
          root=Path('/tmp/final203')
          got={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert got==expected
          print('PASS FINAL_ZIP_BYTE_IDENTITY_28_OF_28')
          PY
          sha256sum /tmp/AFFILIATE_ZENTRALE_6.72.203.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AFFILIATE_ZENTRALE_6.72.203
          path: /tmp/AFFILIATE_ZENTRALE_6.72.203.zip
          if-no-files-found: error
          retention-days: 30

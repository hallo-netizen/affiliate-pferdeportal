name: Affiliate 6.72.198 Tarifcheck dropdown hardtest

on:
  workflow_dispatch:
  push:
    branches:
      - affiliate-release-current
    paths:
      - 'release/affiliate-zentrale/current/**'
      - 'AFFILIATE_HOBBYRAUM/test_deterministic_banner_reconcile_v672195.php'
      - 'AFFILIATE_HOBBYRAUM/test_fixed_banner_target_v672197.php'
      - 'AFFILIATE_HOBBYRAUM/test_general_banner_classifier_v672198.php'
      - '.github/workflows/affiliate-v672195-hardtest.yml'

permissions:
  contents: read

jobs:
  exact-zip-wordpress-mariadb:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Build and lint exact 6.72.198 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ROOT=release/affiliate-zentrale/current/affiliate-portal-router
          grep -F "Version: 6.72.198" "$ROOT/pferdeportal-affiliate-router.php"
          grep -F "const VERSION = '6.72.198';" "$ROOT/pferdeportal-affiliate-router.php"
          find "$ROOT" -type f -name '*.php' -print0 | xargs -0 -n1 php -l | tee /tmp/lint198.log
          test "$(grep -c '^No syntax errors detected' /tmp/lint198.log)" = "22"
          (cd release/affiliate-zentrale/current && find affiliate-portal-router -type f -print0 | sort -z | xargs -0 sha256sum) >/tmp/manifest198.txt
          test "$(grep -cve '^[[:space:]]*$' /tmp/manifest198.txt)" = "28"
          rm -f /tmp/AFFILIATE_ZENTRALE_6.72.198.zip
          (cd release/affiliate-zentrale/current && zip -qr /tmp/AFFILIATE_ZENTRALE_6.72.198.zip affiliate-portal-router)
          echo "PASS SOURCE_LINT_22_OF_22"
          echo "PASS MANIFEST_28_OF_28"
          sha256sum /tmp/AFFILIATE_ZENTRALE_6.72.198.zip

      - name: Fresh unpack byte identity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/unpack198
          mkdir -p /tmp/unpack198
          unzip -q /tmp/AFFILIATE_ZENTRALE_6.72.198.zip -d /tmp/unpack198
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('/tmp/unpack198')
          expected={}
          for line in Path('/tmp/manifest198.txt').read_text().splitlines():
              if not line.strip():
                  continue
              h,rel=line.split('  ',1)
              expected[rel]=h
          files={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert set(files)==set(expected)
          assert all(files[p]==h for p,h in expected.items())
          print('PASS ZIP_BYTE_IDENTITY_28_OF_28')
          PY

      - name: Install exact ZIP into fresh WordPress
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-site
          mkdir -p /tmp/wp-site
          /tmp/wp core download --path=/tmp/wp-site --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title='Dropdown Test' --admin_user=admin --admin_password='ci-pass-198!' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp-site/wp-content/mu-plugins
          cat >/tmp/wp-site/wp-content/mu-plugins/pferde-e2e-design-contract.php <<'PHP'
          <?php
          if (!class_exists('Pferde_Template_Kit')) {
              class Pferde_Template_Kit {
                  public static function affiliate_contract_version(){ return '1.0'; }
                  public static function design_profile(){ return 'pferde_atelier'; }
                  public static function design_profile_contract_version(){ return '1.0'; }
                  public static function affiliate_page_type($page_id){ return get_post_field('post_parent',$page_id) ? 'category' : 'hub1'; }
              }
          }
          PHP
          /tmp/wp plugin install /tmp/AFFILIATE_ZENTRALE_6.72.198.zip --activate --path=/tmp/wp-site
          /tmp/wp eval 'if(Pferdeportal_Affiliate_Router::VERSION!=="6.72.198"){exit(2);} echo "PASS EXACT_ZIP_672198_ACTIVE\n";' --path=/tmp/wp-site

      - name: Render both partner dropdowns
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp eval '$u=get_user_by("login","admin"); wp_set_current_user($u->ID); $_GET=array("page"=>"affiliate-portal-creative-library"); ob_start(); Pferdeportal_Affiliate_Router::instance()->render_creative_library_page(); $h=ob_get_clean(); if(!preg_match("/<select id=\"ppar-library-snapshot\"[^>]*>(.*?)<\\/select>/s",$h,$mi)){echo "FAIL import select missing\\n";exit(20);} if(!preg_match("/<select id=\"ppar-library-partner-filter\"[^>]*>(.*?)<\\/select>/s",$h,$mf)){echo "FAIL filter select missing\\n";exit(21);} $a=substr_count($mi[1],"value=\"direct:tarifcheck\""); $b=substr_count($mf[1],"value=\"tarifcheck\""); $ai=substr_count($mi[1],"Direktpartner · Tarifcheck · tarifcheck"); $bf=substr_count($mf[1],"Direktpartner · Tarifcheck · tarifcheck"); if($a!==1||$ai!==1){echo "FAIL import option=$a label=$ai\\n";exit(22);} if($b!==1||$bf!==1){echo "FAIL filter option=$b label=$bf\\n";exit(23);} echo "PASS TARIFCHECK_IMPORT_DROPDOWN_EXACTLY_ONCE\\nPASS TARIFCHECK_FILTER_DROPDOWN_EXACTLY_ONCE\\nPASS NO_TARIFCHECK_DUPLICATE\\n";' --path=/tmp/wp-site | tee /tmp/dropdown198.log
          grep -F "PASS TARIFCHECK_IMPORT_DROPDOWN_EXACTLY_ONCE" /tmp/dropdown198.log
          grep -F "PASS TARIFCHECK_FILTER_DROPDOWN_EXACTLY_ONCE" /tmp/dropdown198.log
          grep -F "PASS NO_TARIFCHECK_DUPLICATE" /tmp/dropdown198.log

      - name: General all-banner positive negative proof
        shell: bash
        run: |
          set -euo pipefail
          cp AFFILIATE_HOBBYRAUM/test_general_banner_classifier_v672198.php /tmp/wp-site/test_general_banner_classifier_v672198.php
          /tmp/wp eval-file /tmp/wp-site/test_general_banner_classifier_v672198.php --path=/tmp/wp-site | tee /tmp/general198.log
          grep -F "PASS content_beats_broad_destination" /tmp/general198.log
          grep -F "PASS stale_map_not_reused" /tmp/general198.log
          grep -F "PASS provider_topic_precedence" /tmp/general198.log
          grep -F "PASS url_fallback_when_content_has_no_target" /tmp/general198.log
          grep -F "PASS ambiguous_content_fail_closed" /tmp/general198.log
          grep -F "PASS tracking_only_no_evidence_fail_closed" /tmp/general198.log
          grep -F "PASS frontend_campaign_schabracken_active" /tmp/general198.log
          grep -F "PASS frontend_campaign_pferdedecken_active" /tmp/general198.log
          grep -F "PASS ambiguous_creates_no_active_campaign" /tmp/general198.log
          grep -F "GENERAL_BANNER_CLASSIFIER_672198_COMPLETE" /tmp/general198.log

      - name: Preserve manual fixed-target behavior
        shell: bash
        run: |
          set -euo pipefail
          sed "s/Pferdeportal_Affiliate_Router::VERSION !== '6.72.197'/Pferdeportal_Affiliate_Router::VERSION !== '6.72.198'/" AFFILIATE_HOBBYRAUM/test_fixed_banner_target_v672197.php > /tmp/wp-site/test_fixed_banner_target_v672197.php
          /tmp/wp eval-file /tmp/wp-site/test_fixed_banner_target_v672197.php --path=/tmp/wp-site | tee /tmp/fixed198.log
          grep -F "PASS fixed_banner_published" /tmp/fixed198.log
          grep -F "PASS fixed_survives_auto_reset" /tmp/fixed198.log

      - name: Preserve deterministic banner behavior
        shell: bash
        run: |
          set -euo pipefail
          sed "s/Pferdeportal_Affiliate_Router::VERSION==='6.72.195'/Pferdeportal_Affiliate_Router::VERSION==='6.72.198'/" AFFILIATE_HOBBYRAUM/test_deterministic_banner_reconcile_v672195.php > /tmp/wp-site/test_deterministic_banner_reconcile_v672195.php
          /tmp/wp eval-file /tmp/wp-site/test_deterministic_banner_reconcile_v672195.php --path=/tmp/wp-site | tee /tmp/reconcile198.log
          grep -F "PASS rebuilt_target_schabracken" /tmp/reconcile198.log
          grep -F "PASS no_current_auto_campaign_fuetterung" /tmp/reconcile198.log
          grep -F "PASS tarifcheck_kosten_all_cost_leaves" /tmp/reconcile198.log
          grep -F "PASS tarifcheck_versicherung_all_real_leaves" /tmp/reconcile198.log
          grep -F "PASS tarifcheck_tracking_without_explicit_family_blocked" /tmp/reconcile198.log
          grep -F "DETERMINISTIC_BANNER_RECONCILE_672195_COMPLETE" /tmp/reconcile198.log
          echo "PASS RECONCILE_REGRESSION"

      - uses: actions/upload-artifact@v4
        with:
          name: AFFILIATE_ZENTRALE_6.72.198
          path: /tmp/AFFILIATE_ZENTRALE_6.72.198.zip
          if-no-files-found: error
          retention-days: 30

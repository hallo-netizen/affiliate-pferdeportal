name: Affiliate 6.72.211 KISS Cleanup + Textlinks Gate

on:
  workflow_dispatch:
  push:
    branches: [affiliate-release-current]
    paths:
      - 'release/affiliate-zentrale/current/**'
      - 'release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt'
      - 'control/release-governance/CURRENT_RELEASE.json'
      - '.github/workflows/affiliate-v672195-hardtest.yml'

permissions:
  contents: read

jobs:
  kiss-cleanup:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Read current release permission
        id: release_phase
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          c=json.loads(pathlib.Path('control/release-governance/CURRENT_RELEASE.json').read_text())
          a=c.get('active_candidate') or {}
          allowed=(a.get('release_allowed') is True and a.get('status')=='RELEASED'
                   and (c.get('execution_state') or {}).get('authorized_next_action')=='FINALIZE_RELEASE')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write('release_allowed=' + ('true' if allowed else 'false') + '\n')
          print('PASS RELEASE_PHASE_READBACK: ' + ('RELEASED' if allowed else 'NO_INSTALLER_WHILE_INCIDENT_OPEN'))
          PY

      - name: Exact source and bounded KISS delta
        shell: bash
        run: |
          set -euo pipefail
          python3 control/release-governance/release_guard.py governance-check
          python3 control/release-governance/release_guard.py source-check
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          c=json.loads(pathlib.Path('control/release-governance/CURRENT_RELEASE.json').read_text())
          a=c['active_candidate']
          assert a['version']=='6.72.211'
          assert a['source_file_count']==28
          p=pathlib.Path(a['current_source_manifest_ref'])
          assert hashlib.sha256(p.read_bytes()).hexdigest()==a['current_source_manifest_sha256']
          assert len([x for x in p.read_text().splitlines() if x.strip()])==28
          root='release/affiliate-zentrale/current/affiliate-portal-router'
          base='d9eb69f5dd6ce70e76fa3e4836496b42bf6d5cbd'
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD','--',root],text=True).splitlines()
          allowed={
            root+'/pferdeportal-affiliate-router.php',
            root+'/includes/class-ppar-admin-kiss.php',
            root+'/includes/class-ppar-deal-radar.php',
            root+'/includes/class-ppar-ds24-manual-downstream.php',
            root+'/includes/class-ppar-partner-analytics.php',
            root+'/includes/trait-ppar-automation-suite.php',
            root+'/includes/trait-ppar-creative-library.php',
            root+'/includes/trait-ppar-digistore24.php',
            root+'/includes/trait-ppar-ebay-run.php',
            root+'/includes/trait-ppar-ebay.php',
            root+'/includes/trait-ppar-idealo.php',
            root+'/includes/trait-ppar-output-objects.php',
            root+'/includes/trait-ppar-tariff-tools.php',
            root+'/readme.txt',
          }
          # AFF-ERR-065: one existing article trait may now differ from the historical
          # 6.72.211 baseline; every previous allowed file stays unchanged.
          allowed.add(root+'/includes/trait-ppar-article-plans.php')
          assert set(changed)==allowed, changed
          main=pathlib.Path(root+'/pferdeportal-affiliate-router.php').read_text()
          assert 'Version: 6.72.211' in main and "const VERSION = '6.72.211';" in main
          assert "add_shortcode('affiliate_textlink'" in main
          assert "Rechner & Textlinks" in main
          admin=pathlib.Path(root+'/includes/class-ppar-admin-kiss.php').read_text()
          assert 'remove_submenu_page' not in admin
          assert 'prune_legacy_navigation' not in admin
          assert 'ppar-kiss-legacy-nav-hide' not in admin
          tariff=(pathlib.Path(root+'/includes/trait-ppar-tariff-tools.php')).read_text()
          assert "ppar_text_links_v1" in tariff
          assert "[affiliate_textlink id=" in tariff
          assert "textlink_partner_html" in tariff
          assert "Kompletter Partnercode" in tariff
          assert 'CREATE TABLE' not in tariff.upper()
          assert 'wp_remote_' not in tariff
          dead=[
            'OPTION_EBAY_EXTERNAL_TICK_KEY','article_word_count','article_banner_limit_for_words',
            'select_article_insertion_positions','render_article_banner_at_position','render_article_product_block',
            'category_large_banner_rotate_candidates','find_group_by_id','breed_campaign_runtime_semantic_rank',
            'ebay_product_cached_image_url','ebay_business_diag_resolve_public_target',
            'resolve_category_placeholder_image_id','resolve_category_placeholder_image_url','render_campaign_editor'
          ]
          for name in dead:
            assert name not in main, name
          print('PASS CLEANUP_AND_TEXTLINK_SOURCE_DELTA')
          PY
          find release/affiliate-zentrale/current/affiliate-portal-router -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Automation health invariants unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('release/affiliate-zentrale/current/affiliate-portal-router')
          auto=(root/'includes/trait-ppar-automation-suite.php').read_text()
          main=(root/'pferdeportal-affiliate-router.php').read_text()
          assert "'schedule' => 'ppar_two_weeks'" in auto
          assert "$missing >= 2 ? 'inactive_missing' : 'quarantine_missing'" in auto
          assert "creative_library_deactivate_automatic_output_campaigns" in auto
          assert "'schedule' => 'ppar_three_weeks'" in main
          assert "'failure_threshold' => 3" in main
          assert "run_scheduled_health_check" in main
          print('PASS AUTOMATION_RECONCILE_HEALTH_UNCHANGED')
          PY

      - name: Fresh WordPress MariaDB
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-site && mkdir -p /tmp/wp-site
          /tmp/wp core download --path=/tmp/wp-site --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title='672211 Cleanup' --admin_user=admin --admin_password='ci-672211!' --admin_email=ci@example.test --skip-email
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-site
          /tmp/wp eval 'if(Pferdeportal_Affiliate_Router::VERSION!=="6.72.211") exit(2); echo "PASS PLUGIN_672211_ACTIVE\n";' --path=/tmp/wp-site

      - name: KISS backend textlinks and DB hard positive negative
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/wp-site/cleanup211.php <<'PHP'
          <?php
          wp_set_current_user(1);
          $pass=0;$fail=0;
          $ok=function($v,$n)use(&$pass,&$fail){if($v){echo "PASS $n\n";$pass++;}else{echo "FAIL $n\n";$fail++;}};

          global $submenu,$_registered_pages,$wpdb;
          $o=Pferdeportal_Affiliate_Router::instance();
          $o->admin_menu();
          PPAR_Affiliate_Admin_KISS::register_visible_navigation();
          $rows=(array)($submenu['affiliate-portal-zentrale']??[]);
          $visible=array_map(static function($r){return (string)($r[2]??'');},$rows);
          $hidden=[
            'affiliate-portal-outputs','affiliate-portal-control','affiliate-portal-creatives',
            'affiliate-portal-assignments','affiliate-portal-preview','affiliate-portal-ebay-business',
            'affiliate-portal-coverage','affiliate-portal-article-hybrid','affiliate-portal-networks',
            'affiliate-portal-provider-awin','affiliate-portal-provider-adcell','affiliate-portal-ebay',
            'affiliate-portal-provider-idealo','affiliate-portal-provider-digistore24',
            'affiliate-portal-partners','affiliate-portal-sync','affiliate-portal-automation',
            'affiliate-portal-stats','affiliate-portal-health','affiliate-portal-deals'
          ];
          foreach($hidden as $slug){$ok(!in_array($slug,$visible,true),'menu_hidden_'.$slug);}
          foreach(['affiliate-portal-zentrale','affiliate-portal-creative-library','affiliate-portal-tariff-tools','affiliate-portal-kiss-products','affiliate-portal-kiss-partners','affiliate-portal-kiss-delivery','affiliate-portal-kiss-providers','affiliate-portal-kiss-system'] as $slug){
              $ok(in_array($slug,$visible,true),'menu_kept_'.$slug);
          }
          $hook=get_plugin_page_hookname('affiliate-portal-automation','');
          $ok($hook!=='' && isset($_registered_pages[$hook]),'hidden_specialist_page_still_registered');
          $ok(!method_exists('PPAR_Affiliate_Admin_KISS','prune_legacy_navigation'),'old_nav_pruner_removed');
          $ok(!method_exists('PPAR_Affiliate_Admin_KISS','hide_legacy_navigation_css'),'old_css_hide_method_removed');

          $call=function($name,...$args)use($o){$m=new ReflectionMethod($o,$name);$m->setAccessible(true);return $m->invokeArgs($o,$args);};

          // Generische Textlinks: eine kleine nicht-autoloadende Option, kein neuer DB-Tisch.
          $tablesBefore=$wpdb->get_col('SHOW TABLES');
          $links=[
            'leadalliance-pferdeversicherung'=>[
              'id'=>'leadalliance-pferdeversicherung','partner'=>'LeadAlliance','name'=>'Pferdeversicherung',
              'link_text'=>'Pferdeversicherung vergleichen','tracking_url'=>'https://example.com/click?id=4711',
              'destination_url'=>'https://example.org/pferdeversicherung','active'=>1,'created_at'=>time(),'updated_at'=>time()
            ],
            'inaktiv-test'=>[
              'id'=>'inaktiv-test','partner'=>'Testpartner','name'=>'Inaktiv','link_text'=>'Nicht zeigen',
              'tracking_url'=>'https://example.com/inaktiv','destination_url'=>'','active'=>0,'created_at'=>time(),'updated_at'=>time()
            ]
          ];
          $stored=$call('text_links_store_all',$links);
          $ok(isset($stored['leadalliance-pferdeversicherung']),'textlink_stored');
          $ok(!array_key_exists('ppar_text_links_v1',wp_load_alloptions(true)),'textlink_option_not_autoloaded');
          $registry=$o->text_links_writer_registry([]);
          $ok(isset($registry['leadalliance-pferdeversicherung']),'textlink_writer_registry_active');
          $ok(!isset($registry['inaktiv-test']),'textlink_writer_registry_inactive_hidden');
          $ok(($registry['leadalliance-pferdeversicherung']['placeholder']??'')==='[affiliate_textlink id="leadalliance-pferdeversicherung"]','textlink_placeholder_stable');
          $html=$o->shortcode_text_link(['id'=>'leadalliance-pferdeversicherung']);
          $ok(strpos($html,'Pferdeversicherung vergleichen')!==false,'textlink_visible_text');
          $ok(strpos($html,'https://example.com/click?id=4711')!==false,'textlink_tracking_output');
          $ok(strpos($html,'sponsored nofollow noopener')!==false,'textlink_rel_sponsored');
          $ok(strpos($html,'example.org')===false,'textlink_destination_not_runtime_output');
          $ok($o->shortcode_text_link(['id'=>'inaktiv-test'])==='','textlink_inactive_empty');
          $ok($o->shortcode_text_link(['id'=>'unbekannt'])==='','textlink_unknown_empty');
          $rendered=do_shortcode('Vor [affiliate_textlink id="leadalliance-pferdeversicherung"] Nach');
          $ok(strpos($rendered,'Pferdeversicherung vergleichen')!==false,'textlink_real_shortcode_render');
          $links['leadalliance-pferdeversicherung']['tracking_url']='https://example.com/click?id=9999';
          $call('text_links_store_all',$links);
          $ok(strpos($o->shortcode_text_link(['id'=>'leadalliance-pferdeversicherung']),'id=9999')!==false,'textlink_central_update_applies');
          $links['leadalliance-pferdeversicherung']['active']=0;
          $call('text_links_store_all',$links);
          $ok($o->shortcode_text_link(['id'=>'leadalliance-pferdeversicherung'])==='','textlink_deactivate_everywhere');

          // Vollständiger Original-Partnercode muss ohne URL-Zwang und ohne Verlust
          // des eingebetteten Tracking-Pixels exakt über denselben Platzhalterweg laufen.
          $partnerCode='<!-- Begin https://www.partner-psd.de/-Code --><a href="https://www.partner-psd.de/tc.php?t=127567C1641176627T&cons=" target="_blank">PETPROTECT Pferde OP Premium<img src="https://www.partner-psd.de/tb.php?t=127567V1641176627T" alt="" border=0 width="0" height="0"></a><!-- End https://www.partner-psd.de/-Code -->';
          $links['petprotect-pferde-op-premium']=[
            'id'=>'petprotect-pferde-op-premium','partner'=>'PETPROTECT','name'=>'Pferde OP Premium',
            'link_text'=>'','tracking_url'=>'','destination_url'=>'','partner_html'=>$partnerCode,
            'active'=>1,'created_at'=>time(),'updated_at'=>time()
          ];
          $call('text_links_store_all',$links);
          $registryHtml=$o->text_links_writer_registry([]);
          $ok(isset($registryHtml['petprotect-pferde-op-premium']),'textlink_partnercode_writer_registry');
          $partnerOut=$o->shortcode_text_link(['id'=>'petprotect-pferde-op-premium']);
          $ok($partnerOut===$partnerCode,'textlink_partnercode_exact_output');
          $ok(strpos($partnerOut,'tc.php?t=127567C1641176627T&cons=')!==false,'textlink_partnercode_click_preserved');
          $ok(strpos($partnerOut,'tb.php?t=127567V1641176627T')!==false,'textlink_partnercode_tracking_pixel_preserved');
          ob_start(); $o->render_tariff_tools_page(); $adminTextlink=ob_get_clean();
          $ok(strpos($adminTextlink,'name="textlink_partner_html"')!==false,'textlink_partnercode_backend_field_present');

          $tablesAfter=$wpdb->get_col('SHOW TABLES');
          sort($tablesBefore);sort($tablesAfter);
          $ok($tablesBefore===$tablesAfter,'textlink_no_new_table');

          // Tarifrechnerpfad bleibt unverändert funktionsfähig.
          $call('tariff_tools_store_all',[
            'kredit'=>['id'=>'kredit','name'=>'Kredit','html'=>'<div id="calc-pass">OK</div>','active'=>1,'created_at'=>time(),'updated_at'=>time()]
          ]);
          $ok(strpos($o->shortcode_tariff_tool(['id'=>'kredit']),'calc-pass')!==false,'tariff_shortcode_unchanged');

          // Bestehende bounded DB-Pflege positiv/negativ.
          $o->maybe_install_automation_schema();
          $jobs=$call('automation_jobs_table');
          $old=time()-100*DAY_IN_SECONDS;
          $base=[
            'provider'=>'awin','partner_external_id'=>'kiss','stage'=>'complete','cursor_value'=>0,'offer_page'=>1,
            'retry_count'=>0,'not_before'=>0,'lock_token'=>'','lock_expires_at'=>0,'heartbeat_at'=>0,
            'counts'=>'{}','details'=>'{}','message'=>'test','created_at'=>$old,'updated_at'=>$old
          ];
          $a=$base;$a['job_uuid']='11111111-1111-1111-1111-111111111111';$a['run_uuid']='aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa';$a['status']='completed';$a['finished_at']=$old;
          $b=$base;$b['job_uuid']='22222222-2222-2222-2222-222222222222';$b['run_uuid']='bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb';$b['status']='queued';$b['finished_at']=0;$b['created_at']=time();$b['updated_at']=time();
          $wpdb->insert($jobs,$a);$wpdb->insert($jobs,$b);
          $db=$call('housekeeping_db_pass');
          $oldCount=(int)$wpdb->get_var($wpdb->prepare("SELECT COUNT(*) FROM {$jobs} WHERE job_uuid=%s",$a['job_uuid']));
          $liveCount=(int)$wpdb->get_var($wpdb->prepare("SELECT COUNT(*) FROM {$jobs} WHERE job_uuid=%s",$b['job_uuid']));
          $ok($oldCount===0,'db_old_terminal_job_removed');
          $ok($liveCount===1,'db_open_job_preserved');
          $ok((int)($db['deleted']??0)>=1,'db_housekeeping_reports_delete');

          update_option('ppar_aff039_dual_layer_recovery_v1',['x'=>1],false);
          update_option('ppar_aff043_historical_product_state_restore_v1',['x'=>1],false);
          update_option('ppar_aff044_clean_114_115_restore_v1',['x'=>1],false);
          $ret=$call('housekeeping_retire_obsolete_recovery_state');
          $ok(get_option('ppar_aff039_dual_layer_recovery_v1',null)===null,'old_recovery_039_removed');
          $ok(get_option('ppar_aff043_historical_product_state_restore_v1',null)===null,'old_recovery_043_removed');
          $ok(get_option('ppar_aff044_clean_114_115_restore_v1',null)===null,'old_recovery_044_removed');
          $ok((int)($ret['options_deleted']??0)===3,'old_recovery_cleanup_count');

          echo "SUMMARY PASS=$pass FAIL=$fail\n";
          if($fail) exit(1);
          echo "KISS_CLEANUP_TEXTLINK_672211_PASS\n";
          PHP
          /tmp/wp eval-file /tmp/wp-site/cleanup211.php --path=/tmp/wp-site | tee /tmp/cleanup211.log
          grep -F 'KISS_CLEANUP_TEXTLINK_672211_PASS' /tmp/cleanup211.log

      - name: AFF-ERR-065 existing article bottom output red/green gate
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/wp-site/aff065-bottom.php <<'PHP'
          <?php
          wp_set_current_user(1);
          // Exact, test-only slot rule from the existing output_slot_matrix; no Template Kit present in CI.
          add_filter('ppar_affiliate_slot_matrix',static function($rules){
              $rules['post_inline_banner']=['creative_type'=>'banner','ratio_min'=>5.0,'ratio_max'=>12.0,'min_width'=>600,'min_height'=>60,'upscale_max'=>1.10];
              return $rules;
          });
          $o=Pferdeportal_Affiliate_Router::instance();
          $call=function($name,...$args)use($o){$m=new ReflectionMethod($o,$name);$m->setAccessible(true);return $m->invokeArgs($o,$args);};
          $post=wp_insert_post(['post_type'=>'post','post_status'=>'publish','post_title'=>'AFF 065 article','post_content'=>str_repeat('<p>Ein Pferdetext mit Absatz und Inhalt.</p>',10)],true);
          if(is_wp_error($post)||!$post)throw new RuntimeException('fixture article missing');
          $makeBanner=function($label)use($call){
              $data=['id'=>'aff065-'.sanitize_key($label),'name'=>$label,'title'=>$label,'active'=>1,'creative_type'=>'banner',
                  'network'=>'manual','source'=>'manual','assignment_mode'=>'fallback','render_mode'=>'image_link',
                  'image_url'=>'https://example.org/banner.png','url'=>'https://example.org/partner',
                  'dimensions'=>'728x90','placements'=>['post_inline_banner'],'programme_status'=>'active','priority'=>20,
                  'health_check_enabled'=>false];
              $id=$call('save_campaign_record',$data);
              if(is_wp_error($id)||!$id)throw new RuntimeException('fixture banner missing');
              return $id;
          };
          $banner1=$makeBanner('Banner erster');
          $banner2=$makeBanner('Banner zweiter');
          $direct=$call('article_plan_render_banner_campaign',$post,$banner2,false,2,[$banner1]);
          echo 'AFF065 banner direct length '.strlen($direct)."\n";
          echo 'AFF065 banner size '.json_encode($call('article_banner_dimensions',$call('campaign_from_post',get_post($banner2))))."\n";
          echo 'AFF065 banner geometry '.($call('campaign_matches_contract_slot_rule',$call('campaign_from_post',get_post($banner2)),'post_inline_banner')?'yes':'no')."\n";
          if(strpos($direct,'ppar-article-inline-banner-2')===false)throw new RuntimeException('FAIL AFF065_Fixture: valid second banner failed existing gates');
          // AFF-ERR-065: reproduce live JSON contradiction with an already
          // source-approved mandatory banner and an obsolete saved no_output plan.
          $probe=$call('article_plan_default');
          $probe['schema']=(new ReflectionClass($o))->getConstant('ARTICLE_PLAN_SCHEMA');
          $probe['campaign_revision']=$call('article_plan_campaign_revision');
          $probe['content_hash']='stale-6-72-224-plan';
          $probe['status']='no_output';
          $probe['banner']['status']='none';
          $probe['products']['status']='none';
          $oldMeta=(new ReflectionClass($o))->getConstant('ARTICLE_PLAN_META');
          update_post_meta($post,$oldMeta,$probe);
          $mandatory=$call('article_plan_find_mandatory_banner',$post);
          if(!is_array($mandatory)||!in_array((int)($mandatory['campaign']['post_id']??0),[$banner1,$banner2],true))
              throw new RuntimeException('FAIL AFF065_MANDATORY_BANNER_MISSING');
          $updated=$call('article_plan_apply_to_content',get_post_field('post_content',$post),$post,false);
          $newplan=get_post_meta($post,$oldMeta,true);
          if(!is_array($newplan)||!in_array((string)($newplan['banner']['status']??''),['ready','pending_anchor'],true)
              ||!in_array((int)($newplan['banner']['campaign_post_id']??0),[$banner1,$banner2],true)
              ||strpos($updated,'ppar-article-inline-banner')===false)
              throw new RuntimeException('FAIL AFF065_STALE_NO_OUTPUT_DID_NOT_RESTORE_MANDATORY');
          echo "PASS AFF065_STALE_NO_OUTPUT_REBUILDS_EXISTING_MANDATORY\n";
          $plan=$call('article_plan_default');
          $plan['schema']=(new ReflectionClass($o))->getConstant('ARTICLE_PLAN_SCHEMA');
          $plan['content_hash']=$call('article_plan_content_hash',$post);
          $plan['campaign_revision']=$call('article_plan_campaign_revision');
          $plan['status']='ready';
          $plan['banner']=['status'=>'ready','campaign_post_id'=>$banner1,'anchor'=>[]];
          $plan['banner_2']=['status'=>'ready','campaign_post_id'=>$banner2,'anchor'=>[]];
          $plan['products']=['status'=>'none','campaign_post_ids'=>[]];
          $meta=(new ReflectionClass($o))->getConstant('ARTICLE_PLAN_META');
          update_post_meta($post,$meta,$plan);
          $html=$call('article_plan_apply_to_content',get_post_field('post_content',$post),$post,true);
          if(strpos($html,'ppar-article-inline-banner-2')===false)throw new RuntimeException('FAIL AFF065_BASELINE_NO_PRODUCT_BANNER_FALLBACK');
          echo "PASS AFF065_BASELINE_NO_PRODUCT_BANNER_FALLBACK\n";
          $plan['products']=['status'=>'ready','campaign_post_ids'=>[99999999]];
          update_post_meta($post,$meta,$plan);
          $html=$call('article_plan_apply_to_content',get_post_field('post_content',$post),$post,true);
          if(strpos($html,'ppar-article-product-block')!==false)throw new RuntimeException('FAIL AFF065_INVALID_PRODUCT_LEAK');
          if(strpos($html,'ppar-article-inline-banner-2')===false)throw new RuntimeException('FAIL AFF_ERR_065_ARTICLE_BOTTOM_TEST: Ready plan loses every product and suppresses valid replacement banner');
          echo "PASS AFF_ERR_065_ARTICLE_BOTTOM_TEST\n";
          // Existing saved plan from before this repair: no standby banner had been preplanned.
          $plan['banner_2']=['status'=>'none','campaign_post_id'=>0,'anchor'=>[]];
          update_post_meta($post,$meta,$plan);

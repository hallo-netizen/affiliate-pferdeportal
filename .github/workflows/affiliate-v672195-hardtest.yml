name: Affiliate 6.72.205 Glossary Breed Real Injection Gate

on:
  workflow_dispatch:
  push:
    branches: [affiliate-release-current]
    paths:
      - 'release/affiliate-zentrale/current/**'
      - 'release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt'
      - 'control/release-governance/CURRENT_RELEASE.json'
      - '.github/workflows/affiliate-v672195-hardtest.yml'

permissions:
  contents: read

jobs:
  glossary-breed-real-injection:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Exact current source
        shell: bash
        run: |
          set -euo pipefail
          python3 control/release-governance/release_guard.py governance-check
          python3 control/release-governance/release_guard.py source-check
          python3 control/release-governance/release_guard.py start --branch affiliate-release-current
          python3 - <<'PY'
          import hashlib,json,pathlib
          c=json.loads(pathlib.Path('control/release-governance/CURRENT_RELEASE.json').read_text())
          a=c['active_candidate']
          assert a['version']=='6.72.205'
          assert a['source_file_count']==28
          p=pathlib.Path(a['current_source_manifest_ref'])
          assert hashlib.sha256(p.read_bytes()).hexdigest()==a['current_source_manifest_sha256']
          assert len([x for x in p.read_text().splitlines() if x.strip()])==28
          main=(pathlib.Path(a['source_root'])/'pferdeportal-affiliate-router.php').read_text()
          assert 'Version: 6.72.205' in main
          assert "const VERSION = '6.72.205';" in main
          print('PASS CURRENT_672205_BOUND')
          PY
          find release/affiliate-zentrale/current/affiliate-portal-router -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Fresh WordPress MariaDB
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-site
          mkdir -p /tmp/wp-site
          /tmp/wp core download --path=/tmp/wp-site --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title='Affiliate 672205 Real Injection' --admin_user=admin --admin_password='ci-672205!' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp-site/wp-content/mu-plugins
          cat >/tmp/wp-site/wp-content/mu-plugins/pferde-live-types.php <<'PHP'
          <?php
          if (!class_exists('Pferde_Template_Kit')) {
              class Pferde_Template_Kit {
                  public static function affiliate_contract_version(){ return '1.0'; }
                  public static function design_profile(){ return 'pferde_atelier'; }
                  public static function design_profile_contract_version(){ return '1.0'; }
                  public static function affiliate_page_type($page_id){ return get_post_field('post_parent',$page_id) ? 'category' : 'hub1'; }
              }
          }
          add_action('init', static function(){
              if (!post_type_exists('uge_term')) register_post_type('uge_term',['public'=>true,'supports'=>['title','editor']]);
              if (!taxonomy_exists('uge_group')) register_taxonomy('uge_group',['uge_term'],['public'=>true,'hierarchical'=>true]);
              if (!post_type_exists('pa_breed')) register_post_type('pa_breed',['public'=>true,'supports'=>['title','editor']]);
              if (!taxonomy_exists('pa_breed_group')) register_taxonomy('pa_breed_group',['pa_breed'],['public'=>true,'hierarchical'=>true]);
          },1);
          PHP
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-site
          /tmp/wp eval 'if(Pferdeportal_Affiliate_Router::VERSION!=="6.72.205"){exit(2);} echo "PASS PLUGIN_672205_ACTIVE\n";' --path=/tmp/wp-site

      - name: Real glossary breed injection positive negative
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/wp-site/real_glossary_breed_672205.php <<'PHP'
          <?php
          update_option('ppar_enabled','1');
          $o=Pferdeportal_Affiliate_Router::instance();
          $call=function($name,...$args)use($o){$m=new ReflectionMethod($o,$name);$m->setAccessible(true);return $m->invokeArgs($o,$args);};
          $pass=0;$fail=0;
          $ok=function($cond,$name)use(&$pass,&$fail){if($cond){echo "PASS $name\n";$pass++;}else{echo "FAIL $name\n";$fail++;}};

          $call('maybe_install_creative_library_schema');
          $call('maybe_install_output_objects_schema');
          $portalKey=$call('output_local_portal_key');
          $portal=$call('output_portal_by_key',$portalKey,true);
          $ok(is_array($portal),'portal_ready');

          global $wpdb;
          $table=$call('creative_library_table');
          $seed=function($external,$w,$h)use($wpdb,$table){
              $identity=hash('sha256','672205|'.$external);
              $row=[
                  'provider'=>'direct','partner_external_id'=>'kiss205','partner_name'=>'KISS 205',
                  'external_id'=>$external,'identity_hash'=>$identity,'creative_type'=>'banner',
                  'title'=>'KISS '.$external,'description'=>'','tags'=>'',
                  'image_url'=>'https://example.com/'.$external.'.png',
                  'destination_url'=>'https://example.com/','tracking_url'=>'https://example.com/t/'.$external,
                  'width'=>$w,'height'=>$h,'source_status'=>'active','source_kind'=>'banner',
                  'availability_state'=>'active','missing_count'=>0,'last_complete_run'=>'',
                  'review_status'=>'review','selected'=>0,'content_scope'=>'unclassified','scope_source'=>'',
                  'classified_at'=>0,'topic_status'=>'auto_verified','topic_score'=>0,'topic_targets'=>'[]',
                  'source_hash'=>hash('sha256','src|'.$external),
                  'payload'=>wp_json_encode([
                      '_dimension_state'=>'verified','_image_sha256'=>hash('sha256','img|'.$external),
                      '_image_mime'=>'image/png','_image_bytes'=>1000,'_measured_at'=>time(),
                      '_destination_source'=>'provider_explicit'
                  ],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES),
                  'first_seen'=>time(),'last_seen'=>time()
              ];
              $wpdb->insert($table,$row,array_fill(0,count($row),'%s'));
              return $wpdb->get_row($wpdb->prepare("SELECT * FROM {$table} WHERE id=%d",(int)$wpdb->insert_id),ARRAY_A);
          };

          $desktop=$seed('desktop-square',310,310);
          $mobile=$seed('mobile-wide',600,100);
          $pd=$call('output_plan_creative',$desktop,true,$portalKey);
          $pm=$call('output_plan_creative',$mobile,true,$portalKey);
          echo "DESKTOP_PLAN=".wp_json_encode($pd,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
          echo "MOBILE_PLAN=".wp_json_encode($pm,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
          $ot=$call('output_objects_table');
          foreach([$desktop['identity_hash'],$mobile['identity_hash']] as $ih){
              $rows=$wpdb->get_results($wpdb->prepare("SELECT creative_identity_hash,output_type,target_type,target_key,slot_id,status,decision_source,decision_reason,image_width,image_height FROM {$ot} WHERE creative_identity_hash=%s ORDER BY id",$ih),ARRAY_A);
              echo "OUTPUT_ROWS_".$ih."=".wp_json_encode($rows,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
              $ids=$call('creative_library_existing_campaign_ids',$ih);
              $cs=[];
              foreach((array)$ids as $cid){$cs[]=$call('campaign_from_post',get_post((int)$cid));}
              echo "CAMPAIGNS_".$ih."=".wp_json_encode($cs,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
          }
          $ok(is_array($pd) && (int)($pd['active']??0)>=1,'desktop_banner_materialized');
          $ok(is_array($pm) && (int)($pm['active']??0)>=1,'mobile_banner_materialized');

          $matrix=$call('output_slot_matrix',$portal);
          $match=function($slot,$w,$h)use($call,$matrix){return $call('output_row_matches_slot_rule',['width'=>$w,'height'=>$h],$matrix[$slot],'banner');};
          $ok($match('glossary_single_desktop_banner',310,310)===true,'glossary_desktop_format_positive');
          $ok($match('glossary_single_desktop_banner',320,200)===false,'glossary_desktop_format_negative');
          $ok($match('glossary_single_mobile_banner',600,100)===true,'glossary_mobile_format_positive');
          $ok($match('glossary_single_mobile_banner',300,130)===false,'glossary_mobile_format_negative');
          $ok($match('breed_single_desktop_banner',310,310)===true,'breed_desktop_format_positive');
          $ok($match('breed_single_mobile_banner',600,100)===true,'breed_mobile_format_positive');

          $gloss=wp_insert_post(['post_type'=>'uge_term','post_status'=>'publish','post_title'=>'Glossar Live Probe','post_content'=>'Glossar Inhalt']);
          $breed=wp_insert_post(['post_type'=>'pa_breed','post_status'=>'publish','post_title'=>'Rasse Live Probe','post_content'=>'Rassen Inhalt']);
          $ok($gloss>0,'glossary_post_created');
          $ok($breed>0,'breed_post_created');

          $run=function($post_id,$post_type,$method,$content)use($o){
              global $wp_query,$wp_the_query,$post;
              $q=new WP_Query(['post_type'=>$post_type,'p'=>$post_id]);
              $wp_query=$q;$wp_the_query=$q;
              if(!$q->have_posts()) return '';
              $q->the_post();
              $out=$o->$method($content);
              wp_reset_postdata();
              return $out;
          };

          // POSITIV LIVE-FALL: kein historischer Designmarker / kein alter Anker.
          $gPlain='<article class="current-glossary-design"><p>Glossar Inhalt</p></article>';
          $gOut=$run($gloss,'uge_term','inject_glossary_single_banner',$gPlain);
          $ok(strpos($gOut,'data-ppar-glossary-banner="desktop"')!==false,'glossary_without_old_anchor_desktop_visible');
          $ok(strpos($gOut,'data-ppar-glossary-banner="mobile"')!==false,'glossary_without_old_anchor_mobile_visible');
          $ok(strlen($gOut)>strlen($gPlain),'glossary_without_old_anchor_appended');

          $bPlain='<article class="current-breed-design"><p>Rassen Inhalt</p></article>';
          $bOut=$run($breed,'pa_breed','inject_breed_single_banner',$bPlain);
          $ok(strpos($bOut,'data-ppar-breed-banner="desktop"')!==false,'breed_without_old_anchor_desktop_visible');
          $ok(strpos($bOut,'data-ppar-breed-banner="mobile"')!==false,'breed_without_old_anchor_mobile_visible');
          $ok(strlen($bOut)>strlen($bPlain),'breed_without_old_anchor_appended');

          // POSITIV ALTANKER: bestehende Position bleibt erhalten.
          $gAnchor='<main><aside class="pftk-gsingle-aside-v999999">ASIDE</aside></main>';
          $gAnchOut=$run($gloss,'uge_term','inject_glossary_single_banner',$gAnchor);
          $ok(strpos($gAnchOut,'data-ppar-glossary-banner="mobile"') < strpos($gAnchOut,'ASIDE'),'glossary_old_anchor_mobile_before');
          $ok(strpos($gAnchOut,'data-ppar-glossary-banner="desktop"') > strpos($gAnchOut,'ASIDE'),'glossary_old_anchor_desktop_after');

          $bAnchor='<main><section class="pftk-breed-facts-box-v999999">FACTS</section></main>';
          $bAnchOut=$run($breed,'pa_breed','inject_breed_single_banner',$bAnchor);
          $ok(strpos($bAnchOut,'FACTS') < strpos($bAnchOut,'data-ppar-breed-banner="desktop"'),'breed_old_anchor_after_facts');

          // NEGATIV: zweiter Filterdurchlauf erzeugt kein Duplikat.
          $gDup=$run($gloss,'uge_term','inject_glossary_single_banner',$gOut);
          $ok(substr_count($gDup,'data-ppar-glossary-banner="desktop"')===1,'glossary_no_duplicate');
          $bDup=$run($breed,'pa_breed','inject_breed_single_banner',$bOut);
          $ok(substr_count($bDup,'data-ppar-breed-banner="desktop"')===1,'breed_no_duplicate');

          // Rechner bleibt exakt wie live bestaetigt: Inline aus, Bottom nicht an Suppression gebunden.
          $main=file_get_contents(WP_PLUGIN_DIR.'/affiliate-portal-router/pferdeportal-affiliate-router.php');
          $trait=file_get_contents(WP_PLUGIN_DIR.'/affiliate-portal-router/includes/trait-ppar-article-plans.php');
          $ok(strpos($main,"$suppress_inline_banner = has_shortcode($raw_post_content, 'affiliate_rechner')")!==false,'calculator_live_pass_guard_preserved');
          $ok(strpos($trait,'if (!$suppress_inline_banner && !$main_banner_rendered_at_bottom')===false,'calculator_bottom_not_suppressed');

          echo "SUMMARY PASS=$pass FAIL=$fail\n";
          if($fail){exit(1);}
          echo "GLOSSARY_BREED_REAL_INJECTION_672205_PASS\n";
          PHP
          /tmp/wp eval-file /tmp/wp-site/real_glossary_breed_672205.php --path=/tmp/wp-site | tee /tmp/672205.log
          grep -F 'GLOSSARY_BREED_REAL_INJECTION_672205_PASS' /tmp/672205.log

      - name: Package exact tested 6.72.205
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/AFFILIATE_ZENTRALE_6.72.205.zip
          (cd release/affiliate-zentrale/current && zip -qr /tmp/AFFILIATE_ZENTRALE_6.72.205.zip affiliate-portal-router)
          rm -rf /tmp/final205 && mkdir -p /tmp/final205
          unzip -q /tmp/AFFILIATE_ZENTRALE_6.72.205.zip -d /tmp/final205
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          m=Path('release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt')
          expected={line.split('  ',1)[1]:line.split('  ',1)[0] for line in m.read_text().splitlines() if line.strip()}
          root=Path('/tmp/final205')
          got={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert got==expected
          print('PASS ZIP_BYTE_IDENTITY_28_OF_28')
          PY
          sha256sum /tmp/AFFILIATE_ZENTRALE_6.72.205.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AFFILIATE_ZENTRALE_6.72.205
          path: /tmp/AFFILIATE_ZENTRALE_6.72.205.zip
          if-no-files-found: error
          retention-days: 30

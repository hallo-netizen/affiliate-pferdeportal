name: V6.52 isolated rootcause push gate

on:
  push:
    branches:
      - v652-rootcause-isolated-20260822

permissions:
  contents: read
  actions: read

jobs:
  spawn-shutdown-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        ports:
          - 3306:3306
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: v651gate
          MARIADB_USER: wp
          MARIADB_PASSWORD: wppass
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uwp -pwppass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, curl
          tools: wp-cli
          coverage: none
      - name: Prove exact spawn_cron transport boundary
        shell: bash
        run: |
          chmod +x .github/v652/diagnostics/spawn_cron_shutdown_transport_diagnostic.sh
          .github/v652/diagnostics/spawn_cron_shutdown_transport_diagnostic.sh

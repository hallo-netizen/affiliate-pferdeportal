name: TEMP PR224 Run Candidate V2

on:
  push:
    branches:
      - hobbyroom/107007-worker-checker-boundary-20260911

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hobbyroom/107007-worker-checker-boundary-20260911
          fetch-depth: 0
          persist-credentials: true

      - name: Build minimal candidate and refresh existing hash chain
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- control/startmaster0107/VERBINDLICHER_TEXTERSTELLUNGS_PROMPT_STARTMASTER0107.txt
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/temp-pr224-implement-repair-loop.yml').read_text(encoding='utf-8').splitlines()
          start=next(i for i,x in enumerate(src) if "python3 - <<'PY'" in x)+1
          end=next(i for i in range(start,len(src)) if src[i].strip()=='PY')
          lines=src[start:end]
          indent=min(len(x)-len(x.lstrip()) for x in lines if x.strip())
          Path('/tmp/pr224_patch.py').write_text('\n'.join(x[indent:] for x in lines)+'\n',encoding='utf-8')
          PY
          python3 /tmp/pr224_patch.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          state=Path('control/startmaster0107/CURRENT_STATE.json')
          root=Path('control/startmaster0107/PFERDE_ATELIER_START_HERE.json')
          x=json.loads(root.read_text(encoding='utf-8'))
          x['current_state_sha256']=hashlib.sha256(state.read_bytes()).hexdigest()
          root.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Hard current aggregate and full regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile control/startmaster0107/fachworkflow_proof_handoff.py
          python3 control/startmaster0107/fachworkflow_proof_handoff.py selftest
          python3 control/single-door-boundary/codex_current_action.py selftest
          python3 control/startmaster0107/test_fachworkflow_proof_handoff.py
          python3 control/startmaster0107/HOBBYRAUM_M01_M33_REGRESSION.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('control/startmaster0107/fachworkflow_proof_handoff.py')
          spec=importlib.util.spec_from_file_location('fw',p); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          lt=m._lt_repair_findings([{'message':'Fehler','offset':1,'length':2,'rule':{'id':'X'},'replacements':[{'value':'Korrektur'}]}])
          assert lt and lt[0]['rule_id']=='X' and lt[0]['replacements']==['Korrektur']
          ppm=m._ppm_repair_findings({'errors':[{'error_code':'BLOCKED_CONTENT_TABLE_RULE','failed_rule':'TABLE','reason':'x'},{'error_code':'RUNTIME_SOURCE_SNAPSHOT_HASH_MISMATCH'}]})
          assert len(ppm)==1 and ppm[0]['error_code']=='BLOCKED_CONTENT_TABLE_RULE'
          assert m.RepairRequired('languagetool',lt).source=='languagetool'
          print('REPAIR_LIFECYCLE_HELPERS_PASS')
          PY
          grep -q 'FACHWORKFLOW_REPAIR_REQUIRED' control/startmaster0107/STEP_107007_RUN_NEW_ARTICLE_BATCH_NO_STOP.json
          git diff --check

      - name: Commit only productive candidate files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/startmaster0107/fachworkflow_proof_handoff.py control/startmaster0107/STEP_107007_RUN_NEW_ARTICLE_BATCH_NO_STOP.json control/startmaster0107/CURRENT_STATE.json control/startmaster0107/PFERDE_ATELIER_START_HERE.json control/startmaster0107/VERBINDLICHER_TEXTERSTELLUNGS_PROMPT_STARTMASTER0107.txt
          git commit -m 'Hobbyraum: allow bound article repair before final PASS'
          git push origin HEAD:hobbyroom/107007-worker-checker-boundary-20260911

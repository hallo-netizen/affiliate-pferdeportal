name: Product Comparison Real Admin Menu TEMP

on:
  push:
    branches:
      - hobbyroom/productwissen-v1-prototype
    paths:
      - '.github/workflows/productvergleich-real-admin-menu-temp.yml'

permissions:
  contents: read

jobs:
  real-admin-menu:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Install WP-CLI and WordPress
        run: |
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          mkdir -p /tmp/upc-wp
          wp core download --path=/tmp/upc-wp --quiet
          wp config create --path=/tmp/upc-wp --dbname=wp_test --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check --quiet
          wp core install --path=/tmp/upc-wp --url=http://127.0.0.1:8080 --title='UPC Real Admin' --admin_user=admin --admin_password='test-password' --admin_email=admin@example.test --skip-email --quiet

      - name: Build clean 0.2.4 user ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/upc-build /tmp/upk-build
          mkdir -p /tmp/upc-build/universal-product-comparison/config/pferde-atelier
          cp universal-product-comparison/universal-product-comparison.php /tmp/upc-build/universal-product-comparison/
          cp -a universal-product-comparison/src /tmp/upc-build/universal-product-comparison/
          cp -a universal-product-comparison/assets /tmp/upc-build/universal-product-comparison/
          cp universal-product-comparison/config/pferde-atelier/publishing.json /tmp/upc-build/universal-product-comparison/config/pferde-atelier/
          cp universal-product-comparison/config/pferde-atelier/project-manifest.json /tmp/upc-build/universal-product-comparison/config/pferde-atelier/
          cp universal-product-comparison/config/pferde-atelier/pv-reg-001.json /tmp/upc-build/universal-product-comparison/config/pferde-atelier/
          cp -a universal-product-comparison/config/pferde-atelier/rulesets /tmp/upc-build/universal-product-comparison/config/pferde-atelier/

          mkdir -p /tmp/upk-build
          cp -a universal-product-knowledge /tmp/upk-build/universal-product-knowledge
          rm -rf /tmp/upk-build/universal-product-knowledge/tests

          (cd /tmp/upc-build && zip -qr /tmp/universal-product-comparison.zip universal-product-comparison)
          (cd /tmp/upk-build && zip -qr /tmp/universal-product-knowledge.zip universal-product-knowledge)

          ! unzip -Z1 /tmp/universal-product-comparison.zip | grep -E 'test-project|/tests/|protocol/|\.git'
          unzip -p /tmp/universal-product-comparison.zip universal-product-comparison/universal-product-comparison.php | grep -F 'Version: 0.2.4-prototype'
          unzip -p /tmp/universal-product-comparison.zip universal-product-comparison/src/class-upc-first-draft-test.php | grep -F "add_action( 'admin_menu', array( __CLASS__, 'register_menu' ), 99999 );"
          echo UPC_024_CLEAN_ZIP_STRUCTURE_PASS

      - name: Install clean ZIPs
        run: |
          wp plugin install /tmp/universal-product-knowledge.zip --activate --path=/tmp/upc-wp
          wp plugin install /tmp/universal-product-comparison.zip --activate --path=/tmp/upc-wp
          wp plugin is-active universal-product-knowledge --path=/tmp/upc-wp
          wp plugin is-active universal-product-comparison --path=/tmp/upc-wp
          echo UPC_024_INSTALL_ACTIVE_PASS

      - name: Start real WordPress HTTP server
        run: |
          php -S 127.0.0.1:8080 -t /tmp/upc-wp >/tmp/upc-http.log 2>&1 &
          echo $! >/tmp/upc-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/wp-login.php >/dev/null; then
              echo UPC_HTTP_READY
              exit 0
            fi
            sleep 1
          done
          cat /tmp/upc-http.log
          exit 1

      - name: Login and verify rendered wp-admin sidebar
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -c /tmp/cookies.txt http://127.0.0.1:8080/wp-login.php >/tmp/login.html
          curl -fsS -L -b /tmp/cookies.txt -c /tmp/cookies.txt             --data-urlencode 'log=admin'             --data-urlencode 'pwd=test-password'             --data-urlencode 'wp-submit=Log In'             --data-urlencode 'redirect_to=http://127.0.0.1:8080/wp-admin/'             --data-urlencode 'testcookie=1'             http://127.0.0.1:8080/wp-login.php >/tmp/admin.html

          grep -F 'toplevel_page_upc-first-draft-test' /tmp/admin.html
          grep -F '>Produktvergleich<' /tmp/admin.html
          grep -F 'admin.php?page=upc-first-draft-test' /tmp/admin.html
          echo UPC_REAL_RENDERED_ADMIN_MAIN_MENU_PASS

      - name: Verify real menu page responds
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L -b /tmp/cookies.txt             'http://127.0.0.1:8080/wp-admin/admin.php?page=upc-first-draft-test'             >/tmp/upc-page.html
          grep -F '<h1>Produktvergleich Test</h1>' /tmp/upc-page.html
          grep -F 'PV-REG-001 als Draft testen' /tmp/upc-page.html
          grep -F 'Version:</strong> 0.2.4-prototype' /tmp/upc-page.html
          echo UPC_REAL_ADMIN_PAGE_PASS

      - name: Attach first-draft test after install
        run: |
          mkdir -p /tmp/upc-wp/wp-content/plugins/universal-product-comparison/tests
          cp universal-product-comparison/tests/wp-first-real-draft.php /tmp/upc-wp/wp-content/plugins/universal-product-comparison/tests/

      - name: Verify bound draft still PASS
        run: |
          wp eval-file /tmp/upc-wp/wp-content/plugins/universal-product-comparison/tests/wp-first-real-draft.php --path=/tmp/upc-wp

      - name: Upload 0.2.4 replacement ZIP
        uses: actions/upload-artifact@v4
        with:
          name: universal-product-comparison-0.2.4-prototype
          path: /tmp/universal-product-comparison.zip
          if-no-files-found: error
          retention-days: 7

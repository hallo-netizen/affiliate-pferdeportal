name: K10 PPM 6.7.9 inventory

on:
  push:
    branches:
      - konzept10-rule-ledger-20261001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert clean K10 worktree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e quality
          test ! -e warehouse
          test ! -e final
          test ! -e submissions
          test ! -e k9_engine.py
          echo K10_CLEAN_WORKTREE_PASS
      - name: Extract immutable K9 baseline PPM package read-only
        shell: bash
        env:
          BASE: 2cc8167fa1e31b4ffa2ff76c9819314be4b98555
          EXPECTED: acbda93bd1c4292de7aaf88db2195631103991ff508b36c88cb694714818abd1
        run: |
          set -euo pipefail
          git cat-file -e "$BASE^{commit}"
          git show "$BASE:quality/PORTAL_PRODUCTION_MACHINE_V6.7.9.zip" > /tmp/ppm679.zip
          ACTUAL="$(sha256sum /tmp/ppm679.zip | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          echo "K10_PPM_BASELINE_HASH_PASS:$ACTUAL"
      - name: Extract exact 104-rule PPM inventory
        run: |
          python3 tools/extract_ppm104.py /tmp/ppm679.zip /tmp/ppm104_inventory.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/ppm104_inventory.json'))
          assert x['actual_total']==104
          assert x['group_counts']=={
            'content_validator':52,
            'structure_gate':34,
            'known_error_gate':14,
            'rendered_dom_w4':4,
          }
          print('K10_PPM_104_CONTROL_SUM_PASS')
          PY
      - name: Upload exact PPM 104 inventory
        uses: actions/upload-artifact@v4
        with:
          name: k10-ppm104-inventory
          path: /tmp/ppm104_inventory.json
          if-no-files-found: error
          retention-days: 30

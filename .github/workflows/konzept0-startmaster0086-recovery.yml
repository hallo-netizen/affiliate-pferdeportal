name: Konzept 0 STARTMASTER0086 Recovery

on:
  push:
    branches:
      - isolated-system0-legacy-text-20260828
    paths:
      - 'isolated_system0/KONZEPT_0/SM0086_TRIGGER.txt'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Search deleted text blobs and historical archives for STARTMASTER0086
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --tags --prune || true
          ROOT="isolated_system0/KONZEPT_0"
          OUT="$ROOT/STARTMASTER0086_RECOVERY_REPORT.txt"
          DST="$ROOT/runtime/recovered_startmaster0086"
          mkdir -p "$DST"
          rm -f "$DST"/* || true
          : > "$OUT"
          found=0

          echo "=== DIRECT HISTORICAL TEXT BLOBS ===" >> "$OUT"
          git rev-list --objects --all \
            | grep -Ei '\.(txt|md|json|py)$' \
            | grep -Ei 'start|master|text|artikel|prompt|workflow|pferde|control|protocol' \
            | awk '!seen[$1]++' > /tmp/k0textobjects.txt || true

          while read -r oid path; do
            [ -n "$oid" ] || continue
            size="$(git cat-file -s "$oid" 2>/dev/null || echo 0)"
            [ "$size" -le 3000000 ] || continue
            if git cat-file blob "$oid" 2>/dev/null | grep -a -q 'STARTMASTER0086'; then
              echo "TEXT_BLOB=$oid PATH_HINT=$path SIZE=$size" | tee -a "$OUT"
              target="$DST/direct_${oid}_$(basename "$path")"
              git cat-file blob "$oid" > "$target"
              found=1
            fi
          done </tmp/k0textobjects.txt

          echo "=== HISTORICAL ZIP MEMBERS ===" >> "$OUT"
          git rev-list --objects --all \
            | grep -Ei '\.zip$' \
            | grep -Ei 'master|text|artikel|production|workflow|pferde|ppm|startmaster|quelle|codex' \
            | awk '!seen[$1]++' > /tmp/k0zipobjects.txt || true

          while read -r oid path; do
            [ -n "$oid" ] || continue
            tmp="$(mktemp --suffix=.zip)"
            if ! git cat-file blob "$oid" > "$tmp" 2>/dev/null; then rm -f "$tmp"; continue; fi
            if ! unzip -t "$tmp" >/dev/null 2>&1; then rm -f "$tmp"; continue; fi
            mapfile -t members < <(unzip -Z1 "$tmp" | grep -Ei '\.(txt|md|json|py)$' || true)
            for member in "${members[@]}"; do
              if unzip -p "$tmp" "$member" 2>/dev/null | grep -a -q 'STARTMASTER0086'; then
                echo "ZIP_BLOB=$oid PATH_HINT=$path MEMBER=$member" | tee -a "$OUT"
                safe="$(echo "$member" | tr '/ ' '__')"
                unzip -p "$tmp" "$member" > "$DST/archive_${oid}_${safe}"
                found=1
              fi
            done
            rm -f "$tmp"
          done </tmp/k0zipobjects.txt

          echo "FOUND=$found" | tee -a "$OUT"
          if [ "$found" -eq 1 ]; then
            find "$DST" -type f -print0 | sort -z | xargs -0 sha256sum >> "$OUT"
          fi

          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('isolated_system0/KONZEPT_0')
          dst=root/'runtime/recovered_startmaster0086'
          files=sorted(p for p in dst.glob('*') if p.is_file())
          out={
            'contract':'KONZEPT0_STARTMASTER0086_RECOVERY_V1',
            'status':'PASS',
            'matches':len(files),
            'files':[{'name':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files],
            'concept_1_2_3_4_4a_runtime_contact':False,
            'codex_started':False,
            'publish_performed':False
          }
          (root/'STARTMASTER0086_RECOVERY_EVIDENCE.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "konzept0-sm0086-recovery"
          git config user.email "actions@users.noreply.github.com"
          git add isolated_system0/KONZEPT_0/STARTMASTER0086_RECOVERY_REPORT.txt \
                  isolated_system0/KONZEPT_0/STARTMASTER0086_RECOVERY_EVIDENCE.json \
                  isolated_system0/KONZEPT_0/runtime/recovered_startmaster0086
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Konzept 0: recover historical STARTMASTER0086 evidence"
          git push origin HEAD:isolated-system0-legacy-text-20260828

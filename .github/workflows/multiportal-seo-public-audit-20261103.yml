name: Read-only sitemap audit all three portals
on:
  push:
    branches:
      - hobbyroom/multiportal-seo-audit-20261103
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Live compare sitemap URLs with real category levels and navigation
        run: python3 -u scripts/multiportal_public_sitemap_audit_20261103.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiportal-sitemap-audit-20261103
          path: multiportal-seo-audit-20261103.json
          if-no-files-found: warn

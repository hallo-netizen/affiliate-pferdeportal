name: Affiliate 6.72.199 total hardtest

on:
  push:
    branches:
      - fix/banner-import-basis-20261006
    paths:
      - 'release/affiliate-zentrale/current/**'
      - 'release/affiliate-zentrale/tests/test_adcell_banner_import_basis.php'
      - 'release/affiliate-zentrale/tests/test_adcell_banner_basis_upgrade_v672199_e2e.php'
      - '.github/workflows/tmp-affiliate-v672199-total-hardtest.yml'

permissions:
  contents: read

jobs:
  exact-zip-wordpress-mariadb:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Build lint and exact ZIP
        shell: bash
        run: |
          set -euo pipefail
          ROOT=release/affiliate-zentrale/current/affiliate-portal-router
          grep -F "Version: 6.72.199" "$ROOT/pferdeportal-affiliate-router.php"
          grep -F "const VERSION = '6.72.199';" "$ROOT/pferdeportal-affiliate-router.php"
          find "$ROOT" -type f -name '*.php' -print0 | xargs -0 -n1 php -l | tee /tmp/lint199.log
          test "$(grep -c '^No syntax errors detected' /tmp/lint199.log)" = "22"
          (cd release/affiliate-zentrale/current && find affiliate-portal-router -type f -print0 | sort -z | xargs -0 sha256sum) >/tmp/manifest199.txt
          test "$(grep -cve '^[[:space:]]*$' /tmp/manifest199.txt)" = "28"
          php release/affiliate-zentrale/tests/test_adcell_banner_import_basis.php
          rm -f /tmp/AFFILIATE_ZENTRALE_6.72.199.zip
          (cd release/affiliate-zentrale/current && zip -qr /tmp/AFFILIATE_ZENTRALE_6.72.199.zip affiliate-portal-router)
          echo "PASS SOURCE_LINT_22_OF_22"
          echo "PASS MANIFEST_28_OF_28"
          sha256sum /tmp/AFFILIATE_ZENTRALE_6.72.199.zip

      - name: Fresh unpack byte identity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/unpack199
          mkdir -p /tmp/unpack199
          unzip -q /tmp/AFFILIATE_ZENTRALE_6.72.199.zip -d /tmp/unpack199
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('/tmp/unpack199')
          expected={}
          for line in Path('/tmp/manifest199.txt').read_text().splitlines():
              if not line.strip(): continue
              h,rel=line.split('  ',1)
              expected[rel]=h
          files={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          assert set(files)==set(expected)
          assert all(files[p]==h for p,h in expected.items())
          print('PASS ZIP_BYTE_IDENTITY_28_OF_28')
          PY

      - name: Install exact ZIP into fresh WordPress
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-site
          mkdir -p /tmp/wp-site
          /tmp/wp core download --path=/tmp/wp-site --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title='6.72.199 Total' --admin_user=admin --admin_password='ci-pass-199!' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp-site/wp-content/mu-plugins
          cat >/tmp/wp-site/wp-content/mu-plugins/pferde-e2e-design-contract.php <<'PHP'
          <?php
          if (!class_exists('Pferde_Template_Kit')) {
              class Pferde_Template_Kit {
                  public static function affiliate_contract_version(){ return '1.0'; }
                  public static function design_profile(){ return 'pferde_atelier'; }
                  public static function design_profile_contract_version(){ return '1.0'; }
                  public static function affiliate_page_type($page_id){ return get_post_field('post_parent',$page_id) ? 'category' : 'hub1'; }
              }
          }
          PHP
          /tmp/wp plugin install /tmp/AFFILIATE_ZENTRALE_6.72.199.zip --activate --path=/tmp/wp-site
          /tmp/wp eval 'if(Pferdeportal_Affiliate_Router::VERSION!=="6.72.199"){exit(2);} echo "PASS EXACT_ZIP_672199_ACTIVE\n";' --path=/tmp/wp-site

      - name: Tarifcheck dropdown regression
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp eval '$u=get_user_by("login","admin"); wp_set_current_user($u->ID); $_GET=array("page"=>"affiliate-portal-creative-library"); ob_start(); Pferdeportal_Affiliate_Router::instance()->render_creative_library_page(); $h=ob_get_clean(); if(!preg_match("/<select id=\"ppar-library-snapshot\"[^>]*>(.*?)<\\/select>/s",$h,$mi)){exit(20);} if(!preg_match("/<select id=\"ppar-library-partner-filter\"[^>]*>(.*?)<\\/select>/s",$h,$mf)){exit(21);} if(substr_count($mi[1],"value=\"direct:tarifcheck\"")!==1){exit(22);} if(substr_count($mf[1],"value=\"tarifcheck\"")!==1){exit(23);} echo "PASS TARIFCHECK_BOTH_DROPDOWNS_EXACTLY_ONCE\n";' --path=/tmp/wp-site

      - name: General banner positive negative regression
        shell: bash
        run: |
          set -euo pipefail
          sed -e "s/Pferdeportal_Affiliate_Router::VERSION !== '6.72.198'/Pferdeportal_Affiliate_Router::VERSION !== '6.72.199'/"               -e 's/ppar_v672198_banner_reconcile_/ppar_v672199_banner_reconcile_/g'               AFFILIATE_HOBBYRAUM/test_general_banner_classifier_v672198.php >/tmp/wp-site/test_general_banner_classifier_v672199.php
          /tmp/wp eval-file /tmp/wp-site/test_general_banner_classifier_v672199.php --path=/tmp/wp-site | tee /tmp/general199.log
          grep -F "PASS content_beats_broad_destination" /tmp/general199.log
          grep -F "PASS stale_map_not_reused" /tmp/general199.log
          grep -F "PASS provider_topic_precedence" /tmp/general199.log
          grep -F "PASS url_fallback_when_content_has_no_target" /tmp/general199.log
          grep -F "PASS ambiguous_content_fail_closed" /tmp/general199.log
          grep -F "PASS tracking_only_no_evidence_fail_closed" /tmp/general199.log
          grep -F "PASS frontend_campaign_schabracken_active" /tmp/general199.log
          grep -F "PASS frontend_campaign_pferdedecken_active" /tmp/general199.log
          grep -F "PASS ambiguous_creates_no_active_campaign" /tmp/general199.log
          grep -F "GENERAL_BANNER_CLASSIFIER_672198_COMPLETE" /tmp/general199.log

      - name: Manual fixed target regression
        shell: bash
        run: |
          set -euo pipefail
          sed "s/Pferdeportal_Affiliate_Router::VERSION !== '6.72.197'/Pferdeportal_Affiliate_Router::VERSION !== '6.72.199'/" AFFILIATE_HOBBYRAUM/test_fixed_banner_target_v672197.php >/tmp/wp-site/test_fixed_banner_target_v672199.php
          /tmp/wp eval-file /tmp/wp-site/test_fixed_banner_target_v672199.php --path=/tmp/wp-site | tee /tmp/fixed199.log
          grep -F "PASS fixed_banner_published" /tmp/fixed199.log
          grep -F "PASS fixed_survives_auto_reset" /tmp/fixed199.log

      - name: Deterministic banner reconcile regression
        shell: bash
        run: |
          set -euo pipefail
          sed -e "s/Pferdeportal_Affiliate_Router::VERSION==='6.72.195'/Pferdeportal_Affiliate_Router::VERSION==='6.72.199'/"               -e 's/ppar_v672195_banner_reconcile_/ppar_v672199_banner_reconcile_/g'               AFFILIATE_HOBBYRAUM/test_deterministic_banner_reconcile_v672195.php >/tmp/wp-site/test_deterministic_banner_reconcile_v672199.php
          /tmp/wp eval-file /tmp/wp-site/test_deterministic_banner_reconcile_v672199.php --path=/tmp/wp-site | tee /tmp/reconcile199.log
          grep -F "PASS rebuilt_target_schabracken" /tmp/reconcile199.log
          grep -F "PASS no_current_auto_campaign_fuetterung" /tmp/reconcile199.log
          grep -F "PASS tarifcheck_kosten_all_cost_leaves" /tmp/reconcile199.log
          grep -F "PASS tarifcheck_versicherung_all_real_leaves" /tmp/reconcile199.log
          grep -F "PASS tarifcheck_tracking_without_explicit_family_blocked" /tmp/reconcile199.log
          grep -F "DETERMINISTIC_BANNER_RECONCILE_672195_COMPLETE" /tmp/reconcile199.log

      - name: ADCELL real import and existing-stock upgrade E2E
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp eval-file "$GITHUB_WORKSPACE/release/affiliate-zentrale/tests/test_adcell_banner_basis_upgrade_v672199_e2e.php" --path=/tmp/wp-site | tee /tmp/adcell199.log
          grep -F "PASS old_672198_banner_seeded" /tmp/adcell199.log
          grep -F "PASS fresh_672199_resync_queued" /tmp/adcell199.log
          grep -F "PASS fresh_672199_adcell_job_completed" /tmp/adcell199.log
          grep -F "PASS basis_upgrade_completed_after_fresh_import" /tmp/adcell199.log
          grep -F "PASS old_banner_replaced_with_complete_current_provider_evidence" /tmp/adcell199.log
          grep -F "PASS category_endpoint_once_for_fresh_programme_run" /tmp/adcell199.log
          grep -F "ADCELL_BANNER_BASIS_UPGRADE_V672199_E2E_COMPLETE" /tmp/adcell199.log

      - uses: actions/upload-artifact@v4
        with:
          name: AFFILIATE_ZENTRALE_6.72.199
          path: /tmp/AFFILIATE_ZENTRALE_6.72.199.zip
          if-no-files-found: error
          retention-days: 30

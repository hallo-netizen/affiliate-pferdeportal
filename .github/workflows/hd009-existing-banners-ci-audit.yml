name: Audit existing Hobby design and affiliate banners (HD007 register verified)
on:
  push:
    branches:
      - hobbyroom/hd009-banner-ci-audit-20261107
    paths:
      - .github/workflows/hd009-existing-banners-ci-audit.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit existing design and register ZIPs
        run: python3 protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/PLUGIN_AKTEN/HD-009-AFFILIATE-ZENTRALE/EVIDENCE/banner_ci_audit.py
      - name: Store audit for comparison
        run: |
          git config user.name "hobby-affiliate-qa"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/PLUGIN_AKTEN/HD-009-AFFILIATE-ZENTRALE/EVIDENCE/BANNER_CI_EXISTING_CODE_AUDIT.txt
          git commit -m "HD009 existing HD003/HD007 banner paths audited"
          git push

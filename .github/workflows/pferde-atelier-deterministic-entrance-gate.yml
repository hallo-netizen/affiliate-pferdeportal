name: Pferde Atelier Deterministic Entrance Gate

on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'control/deterministic-entrance-gate/**'
      - 'control/cloud-entry-gate/**'
      - 'control/production-continuity/**'
      - 'control/single-door-boundary/**'
      - 'control/startmaster0104/**'
      - 'control/startmaster0105/**'
      - 'control/startmaster0106/**'
      - 'control/startmaster0107/**'
      - 'control/CURRENT_STARTMASTER.json'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'control/deterministic-entrance-gate/**'
      - 'control/cloud-entry-gate/**'
      - 'control/production-continuity/**'
      - 'control/single-door-boundary/**'
      - 'control/startmaster0104/**'
      - 'control/startmaster0105/**'
      - 'control/startmaster0106/**'
      - 'control/startmaster0107/**'
      - 'control/CURRENT_STARTMASTER.json'
      - 'protocol/**'
      - 'isolated_system4/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Legacy deterministic gate regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python control/deterministic-entrance-gate/repo_ci_test.py
      - name: Codex Cloud entrance positive-negative CI
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python control/cloud-entry-gate/cloud_repo_ci_test.py
      - name: Production continuity no-stop positive-negative CI
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python control/production-continuity/test_production_continuity_guard.py
      - name: KISS text-start receiver has no GitHub production control
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'api\\.github\\.com|github\\.rest|TEXT_START_BATCH_CLAIM|TEXT_START_MACHINE_READY|upload-artifact|issues: write' .github/workflows/text-start-pferdeatelier.yml

      - name: Current start handoff is repeatable and deterministic
        shell: bash
        run: |
          set -euo pipefail
          python3 concept_agent/intake_bridge.py prepare concept_agent/current/PSERC_METADATA_SNAPSHOT.json /tmp/intake-1.json > /tmp/receipt-1.json
          python3 concept_agent/intake_bridge.py prepare concept_agent/current/PSERC_METADATA_SNAPSHOT.json /tmp/intake-2.json > /tmp/receipt-2.json
          cmp /tmp/intake-1.json /tmp/intake-2.json
          python3 - <<'PY'
          import json
          state=json.load(open('control/startmaster0107/CURRENT_STATE.json',encoding='utf-8'))['concept_agent_current_batch']
          a=json.load(open('/tmp/intake-1.json',encoding='utf-8'))
          r=json.load(open('/tmp/receipt-1.json',encoding='utf-8'))
          if r.get('status')!='CONCEPT_AGENT_INTAKE_READY':
              raise SystemExit('START_RECEIPT_NOT_READY')
          if a.get('batch_sha256')!=state.get('batch_sha256') or a.get('item_count')!=state.get('item_count'):
              raise SystemExit('START_CURRENT_BINDING_MISMATCH')
          if a.get('publish_allowed') is not False:
              raise SystemExit('START_PUBLISH_FLAG_INVALID')
          print('KISS_TEXT_START_REPEAT_PASS')
          PY

      - name: Existing Concept Agent transition and repair tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: concept_agent:isolated_system4
        run: python -m unittest concept_agent.tests.test_current_production_guards -v

      - name: Existing Concept Agent intake-to-file tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: concept_agent:isolated_system4
        run: python -m unittest concept_agent.tests.test_intake_to_endstempel -v

      - name: Assert active gate has no OpenAI API dependency
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'api\.openai\.com|OPENAI_API_KEY|requests\.post|httpx\.post|urllib\.request' \
            control/cloud-entry-gate/cloud_entry.py \
            control/deterministic-entrance-gate/door.py \
            control/production-continuity/production_continuity_guard.py
      - name: Assert active gate stays domain blind
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E -i 'pste|pserc|ppm|languagetool|wordpress|beratung|pflege|cannibal|title_rule|keyword_rule|design_rule' \
            control/cloud-entry-gate/cloud_entry.py \
            control/production-continuity/production_continuity_guard.py

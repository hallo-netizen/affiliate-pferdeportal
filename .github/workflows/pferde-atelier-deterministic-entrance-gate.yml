name: Pferde Atelier Deterministic Entrance Gate
on:
  push:
    branches: [main]
    paths:
      - 'control/deterministic-entrance-gate/**'
      - 'control/startmaster0104/**'
      - 'control/CURRENT_STARTMASTER.json'
      - '.github/workflows/pferde-atelier-deterministic-entrance-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hardlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic entrance gate positive-negative CI
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python control/deterministic-entrance-gate/repo_ci_test.py
      - name: Assert active gate has no OpenAI API dependency
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'api\.openai\.com|urllib\.request|requests\.post|httpx\.post' \
            control/deterministic-entrance-gate/door.py \
            control/deterministic-entrance-gate/worker_harness.py \
            control/deterministic-entrance-gate/codex_runtime_selftest.py

name: Pferde Atelier Deterministic Entrance Gate

on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'control/deterministic-entrance-gate/**'
      - 'control/cloud-entry-gate/**'
      - 'control/production-continuity/**'
      - 'control/single-door-boundary/**'
      - 'control/startmaster0104/**'
      - 'control/startmaster0105/**'
      - 'control/startmaster0106/**'
      - 'control/startmaster0107/**'
      - 'control/CURRENT_STARTMASTER.json'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'control/deterministic-entrance-gate/**'
      - 'control/cloud-entry-gate/**'
      - 'control/production-continuity/**'
      - 'control/single-door-boundary/**'
      - 'control/startmaster0104/**'
      - 'control/startmaster0105/**'
      - 'control/startmaster0106/**'
      - 'control/startmaster0107/**'
      - 'control/CURRENT_STARTMASTER.json'
      - 'protocol/**'
      - 'isolated_system4/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Legacy deterministic gate regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python control/deterministic-entrance-gate/repo_ci_test.py
      - name: Codex Cloud entrance positive-negative CI
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python control/cloud-entry-gate/cloud_repo_ci_test.py
      - name: Production continuity no-stop positive-negative CI
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python control/production-continuity/test_production_continuity_guard.py
      - name: TEMP System 4 pre-Codex generation Point0 NEW output proof
        shell: bash
        run: |
          set -euo pipefail
          python3 isolated_system4/downstream_1n_contract_probe.py
          python3 control/output-quarantine/test_output_quarantine.py
          python3 isolated_system4/wordpress_import_contract_probe.py
          cd isolated_system4
          python3 -m unittest -v test_point0_v2.Point0V2Tests.test_source_acquisition_200_401_403
          python3 -m unittest -v test_point0_v2.Point0V2Tests.test_chat_start_required_tamper_and_dataforseo_blocked
          python3 -m unittest -v test_point0_v2.Point0V2Tests.test_point0_and_prewrite_tamper_fail_closed
          python3 -m unittest -v test_acceptance_history_hardlock.AcceptanceHistoryHardlockTests.test_no_old_article_or_candidate_can_feed_active_input_factory
          python3 -m unittest -v test_acceptance_history_hardlock.AcceptanceHistoryHardlockTests.test_each_acceptance_run_is_machine_bound_to_new_article_sources
      - name: Assert active gate has no OpenAI API dependency
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'api\.openai\.com|OPENAI_API_KEY|requests\.post|httpx\.post|urllib\.request' \
            control/cloud-entry-gate/cloud_entry.py \
            control/deterministic-entrance-gate/door.py \
            control/production-continuity/production_continuity_guard.py
      - name: Assert active gate stays domain blind
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E -i 'pste|pserc|ppm|languagetool|wordpress|beratung|pflege|cannibal|title_rule|keyword_rule|design_rule' \
            control/cloud-entry-gate/cloud_entry.py \
            control/production-continuity/production_continuity_guard.py

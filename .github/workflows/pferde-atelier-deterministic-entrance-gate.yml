name: Pferde Atelier Deterministic Entrance Gate

on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'control/deterministic-entrance-gate/**'
      - 'control/cloud-entry-gate/**'
      - 'control/production-continuity/**'
      - 'control/wordpress-prewrite-gate/**'
      - 'control/startmaster0104/**'
      - 'control/startmaster0105/**'
      - 'control/startmaster0106/**'
      - 'control/startmaster0107/**'
      - 'control/CURRENT_STARTMASTER.json'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'control/deterministic-entrance-gate/**'
      - 'control/cloud-entry-gate/**'
      - 'control/production-continuity/**'
      - 'control/wordpress-prewrite-gate/**'
      - 'control/startmaster0104/**'
      - 'control/startmaster0105/**'
      - 'control/startmaster0106/**'
      - 'control/startmaster0107/**'
      - 'control/CURRENT_STARTMASTER.json'
      - 'protocol/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Legacy deterministic gate regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python control/deterministic-entrance-gate/repo_ci_test.py
      - name: Codex Cloud entrance positive-negative CI
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python control/cloud-entry-gate/cloud_repo_ci_test.py
      - name: Production continuity no-stop positive-negative CI
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python control/production-continuity/test_production_continuity_guard.py
      - name: WordPress prewrite content hardlock positive-negative CI
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python control/wordpress-prewrite-gate/test_wordpress_prewrite_gate.py
      - name: Assert WordPress prewrite hardlock is mandatory and read-only
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'python3 control/wordpress-prewrite-gate/wordpress_prewrite_gate.py <APPROVED_ENVELOPE.json> <EXACT_WORDPRESS_CANDIDATE.json>' AGENTS.md
          grep -F 'Bei `BLOCKED`, fehlendem Input, nicht auflösbarer Bindung oder technischem Fehler: sofort vor jedem WordPress-Content-Write stoppen.' AGENTS.md
          ! grep -E 'write_text\(|write_bytes\(|unlink\(|rename\(|replace\(|mkdir\(|rmdir\(|shutil\.|subprocess\.|os\.system\(|requests\.|urllib\.' \
            control/wordpress-prewrite-gate/wordpress_prewrite_gate.py
      - name: Assert active gate has no OpenAI API dependency
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'api\.openai\.com|OPENAI_API_KEY|requests\.post|httpx\.post|urllib\.request' \
            control/cloud-entry-gate/cloud_entry.py \
            control/deterministic-entrance-gate/door.py \
            control/production-continuity/production_continuity_guard.py \
            control/wordpress-prewrite-gate/wordpress_prewrite_gate.py
      - name: Assert active entrance and continuity gates stay domain blind
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E -i 'pste|pserc|ppm|languagetool|wordpress|beratung|pflege|cannibal|title_rule|keyword_rule|design_rule' \
            control/cloud-entry-gate/cloud_entry.py \
            control/production-continuity/production_continuity_guard.py

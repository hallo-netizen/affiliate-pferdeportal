# K10_BATCH_LT68_PREFLIGHT_20261002
name: K10 three-article optimization run

on:
  push:
    branches: [konzept10-rule-ledger-20261001]
    paths:
      - 'real_runs/20261002_three_article_optimization/**'
      - 'engine/preflight.py'
      - 'engine/lt68_external.py'
      - 'engine/real_proof.py'
      - 'engine/optimization_proof.py'
      - 'engine/checkers.py'
      - 'engine/final_integrity.py'
      - '.github/workflows/k10-three-article-optimization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-real-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENDSTEMPEL_PRIVATE_KEY: ${{ secrets.ENDSTEMPEL_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind current PSERC metadata read-only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:concept_agent/current/PSERC_METADATA_SNAPSHOT.json > /tmp/pserc.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/pserc.json'))
          assert x.get('system_boundary',{}).get('publish_allowed') is False
          print('K10_CURRENT_PSERC_SNAPSHOT_BOUND=1')
          PY

      - name: Prepare all three articles with exact K10 preflight
        shell: bash
        run: |
          set -euo pipefail
          root='real_runs/20261002_three_article_optimization'
          outroot='/tmp/k10-three'
          mkdir -p "$outroot"
          for name in reitplatzplaner regendecken schermaschinen; do
            article="$root/$name/ARTICLE_INPUT.json"
            od="$outroot/$name"
            mkdir -p "$od"
            cp "$article" "$od/ARTICLE_INPUT.json"
            python3 - "$article" "$od/RESEARCH.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1],encoding='utf-8'))
          seen=set(); sources=[]; claims=[]
          for fid,c in a['research_claims'].items():
              key=(c['source_title'],c['source_url'])
              if key not in seen:
                  seen.add(key); sources.append({'source_id':'S'+str(len(sources)+1),'title':key[0],'url':key[1]})
              claims.append({'fact_id':fid,**c})
          r={'contract':'K10_REAL_RESEARCH_V1','article_id':a['article_id'],'topic':a['title'],'retrieved_at':'2026-10-02','sources':sources,'claims':claims,'publish_allowed':False}
          json.dump(r,open(sys.argv[2],'w',encoding='utf-8'),ensure_ascii=False,indent=2,sort_keys=True)
          PY
            slug="$(python3 - "$article" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding='utf-8'))['wordpress_category']['slug'])
          PY
            )"
            curl --fail --location --retry 3 --silent --show-error "https://pferde-atelier.de/wp-json/wp/v2/categories?slug=$slug" -o "$od/category.json"
            start="$(date +%s%3N)"
            python3 -m engine.preflight "$article" "$od/category.json" "$od/preflight"
            end="$(date +%s%3N)"
            echo "$((end-start))" > "$od/preflight_ms"
          done
          python3 - "$outroot" <<'PY'
          import json,sys,pathlib
          root=pathlib.Path(sys.argv[1])
          items=[]
          for name in ('reitplatzplaner','regendecken','schermaschinen'):
              od=root/name
              items.append({'article':str(od/'preflight'/'ARTICLE_PREPARED.json'),'output':str(od/'lt68.json')})
          json.dump({'contract':'K10_LT68_BATCH_MANIFEST_V1','items':items},open(root/'LT_BATCH_MANIFEST.json','w'),indent=2)
          PY

      - name: Download exact LanguageTool 6.8 once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/k10-lt68
          curl --fail --location --retry 3 https://github.com/jxmorris12/language_tool_python/releases/download/LanguageTool-6.8/LanguageTool-6.8.zip -o /tmp/k10-lt68/LanguageTool-6.8.zip
          echo '6a7f6b67b779ae9505f7579f0c41453ea8d1bd72ae750bdc2c55ba974281467d  /tmp/k10-lt68/LanguageTool-6.8.zip' | sha256sum -c -
          unzip -q /tmp/k10-lt68/LanguageTool-6.8.zip -d /tmp/k10-lt68
          echo '2122882e800d312a0543d895c56c0a84a9bb131c9b9846efd8fc033129353ae8  /tmp/k10-lt68/LanguageTool-6.8/languagetool-commandline.jar' | sha256sum -c -

      - name: Run exact LanguageTool 6.8 once for all three articles
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s%3N)"
          python3 -m engine.lt68_external --batch             /tmp/k10-lt68/LanguageTool-6.8/languagetool-commandline.jar             /tmp/k10-three/LT_BATCH_MANIFEST.json
          end="$(date +%s%3N)"
          echo "$((end-start))" > /tmp/k10-three/LT_BATCH_MS
          echo 'K10_LT68_JAVA_PROCESS_COUNT=1'
          echo "K10_LT68_BATCH_MS=$((end-start))"

      - name: Finalize three articles from hash-bound preflight receipts
        shell: bash
        run: |
          set +e
          set -uo pipefail
          root='real_runs/20261002_three_article_optimization'
          outroot='/tmp/k10-three'
          overall_rc=0
          batch_ms="$(cat "$outroot/LT_BATCH_MS")"
          for name in reitplatzplaner regendecken schermaschinen; do
            od="$outroot/$name"
            article="$od/preflight/ARTICLE_PREPARED.json"
            proof_start="$(date +%s%3N)"
            python3 -m engine.optimization_proof               "$article" "$od/RESEARCH.json" /tmp/pserc.json "$od/category.json" "$od/lt68.json" "$od/proof"               "$od/preflight/ARTICLE_RECEIPTS_PRE_LT68.json"
            proof_rc=$?
            proof_end="$(date +%s%3N)"
            python3 - "$name" "$article" "$od" "$proof_rc" "$((proof_end-proof_start))" "$batch_ms" <<'PY'
          import json,sys,pathlib,re
          name,ap,od=sys.argv[1],sys.argv[2],pathlib.Path(sys.argv[3])
          proof_rc=int(sys.argv[4]); proof_ms=int(sys.argv[5]); batch_ms=int(sys.argv[6])
          a=json.load(open(ap,encoding='utf-8')); lt=json.load(open(od/'lt68.json',encoding='utf-8'))
          report=json.load(open(od/'proof'/'FINAL_REPORT.json',encoding='utf-8')) if (od/'proof'/'FINAL_REPORT.json').is_file() else {}
          preflight=json.load(open(od/'preflight'/'PREFLIGHT_REPORT.json',encoding='utf-8'))
          protocol={
            'contract':'K10_THREE_ARTICLE_OPTIMIZATION_ITEM_V2','name':name,'title':a['title'],'article_type':a['article_type'],
            'preflight_status':preflight.get('status'),'preflight_ms':int((od/'preflight_ms').read_text().strip()),
            'lt68':{'status':lt.get('status'),'finding_count':lt.get('finding_count')},
            'language_tool_batch_total_ms':batch_ms,'language_tool_java_process_count':1,
            'proof_ms':proof_ms,'proof_status':report.get('status'),
            'article_rules':(report.get('article_rules') or {}).get('status'),
            'system_rules':(report.get('system_rules') or {}).get('status'),
            'pserc':report.get('pserc_metadata_binding'),'endstempel':report.get('endstempel'),
            'wordpress_file_verify':report.get('wordpress_file_verify'),
            'normal_terminal_stop':'PASS' if report.get('status')=='READY_FOR_WORDPRESS_DRAFT_IMPORT' else 'BLOCKED',
            'content_recheck_after_preflight':False,'return_code':proof_rc,'publish_allowed':False
          }
          json.dump(protocol,open(od/'PROTOCOL.json','w',encoding='utf-8'),ensure_ascii=False,indent=2,sort_keys=True)
          print('K10_ITEM_PROTOCOL='+json.dumps(protocol,ensure_ascii=False,sort_keys=True))
          PY
            if [ "$proof_rc" -ne 0 ]; then overall_rc=1; fi
          done
          python3 - "$outroot" <<'PY'
          import json,sys,pathlib,statistics
          root=pathlib.Path(sys.argv[1])
          rows=[json.load(open(p,encoding='utf-8')) for p in sorted(root.glob('*/PROTOCOL.json'))]
          ok=all(r['normal_terminal_stop']=='PASS' for r in rows)
          summary={
            'contract':'K10_THREE_ARTICLE_OPTIMIZATION_SUMMARY_V2','status':'PASS' if ok else 'BLOCKED',
            'article_count':len(rows),'items':rows,
            'language_tool_java_process_count':1,
            'language_tool_batch_total_ms':int((root/'LT_BATCH_MS').read_text().strip()),
            'preflight_ms_sum':sum(r['preflight_ms'] for r in rows),
            'proof_ms_sum':sum(r['proof_ms'] for r in rows),
            'publish_allowed':False
          }
          json.dump(summary,open(root/'SUMMARY.json','w',encoding='utf-8'),ensure_ascii=False,indent=2,sort_keys=True)
          print('K10_THREE_ARTICLE_SUMMARY='+json.dumps(summary,ensure_ascii=False,sort_keys=True))
          if not ok: raise SystemExit(4)
          PY
          rc=$?
          if [ "$rc" -ne 0 ]; then overall_rc=1; fi
          exit "$overall_rc"

      - name: Upload protocols and verified import files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k10-three-article-optimization
          path: /tmp/k10-three
          if-no-files-found: error
          retention-days: 30

name: K10 three-article optimization run

on:
  push:
    branches: [konzept10-rule-ledger-20261001]
    paths:
      - 'real_runs/20261002_three_article_optimization/**'
      - 'engine/optimization_proof.py'
      - '.github/workflows/k10-three-article-optimization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-real-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENDSTEMPEL_PRIVATE_KEY: ${{ secrets.ENDSTEMPEL_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind current PSERC metadata read-only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:concept_agent/current/PSERC_METADATA_SNAPSHOT.json > /tmp/pserc.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/pserc.json'))
          assert x.get('system_boundary',{}).get('publish_allowed') is False
          print('K10_CURRENT_PSERC_SNAPSHOT_BOUND=1')
          PY

      - name: Download exact LanguageTool 6.8 once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/k10-lt68
          curl --fail --location --retry 3 \
            https://github.com/jxmorris12/language_tool_python/releases/download/LanguageTool-6.8/LanguageTool-6.8.zip \
            -o /tmp/k10-lt68/LanguageTool-6.8.zip
          echo '6a7f6b67b779ae9505f7579f0c41453ea8d1bd72ae750bdc2c55ba974281467d  /tmp/k10-lt68/LanguageTool-6.8.zip' | sha256sum -c -
          unzip -q /tmp/k10-lt68/LanguageTool-6.8.zip -d /tmp/k10-lt68
          echo '2122882e800d312a0543d895c56c0a84a9bb131c9b9846efd8fc033129353ae8  /tmp/k10-lt68/LanguageTool-6.8/languagetool-commandline.jar' | sha256sum -c -

      - name: Run three real articles with timing and protocol
        shell: bash
        run: |
          set -uo pipefail
          root='real_runs/20261002_three_article_optimization'
          outroot='/tmp/k10-three'
          mkdir -p "$outroot"
          overall_rc=0
          for name in reitplatzplaner regendecken schermaschinen; do
            echo "=== K10_REAL_ITEM:$name ==="
            article="$root/$name/ARTICLE_INPUT.json"
            od="$outroot/$name"
            mkdir -p "$od"
            cp "$article" "$od/ARTICLE_INPUT.json"

            python3 - "$article" "$od/RESEARCH.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1],encoding='utf-8'))
          seen=set(); sources=[]; claims=[]
          for fid,c in a['research_claims'].items():
              key=(c['source_title'],c['source_url'])
              if key not in seen:
                  seen.add(key); sources.append({'source_id':'S'+str(len(sources)+1),'title':key[0],'url':key[1]})
              claims.append({'fact_id':fid,**c})
          r={'contract':'K10_REAL_RESEARCH_V1','article_id':a['article_id'],'topic':a['title'],'retrieved_at':'2026-10-02','sources':sources,'claims':claims,'publish_allowed':False}
          json.dump(r,open(sys.argv[2],'w',encoding='utf-8'),ensure_ascii=False,indent=2,sort_keys=True)
          PY

            slug="$(python3 - "$article" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding='utf-8'))['wordpress_category']['slug'])
          PY
            )"

            total_start="$(date +%s%3N)"
            cat_start="$(date +%s%3N)"
            curl --fail --location --retry 3 --silent --show-error \
              "https://pferde-atelier.de/wp-json/wp/v2/categories?slug=$slug" \
              -o "$od/category.json"
            cat_rc=$?
            cat_end="$(date +%s%3N)"

            lt_start="$(date +%s%3N)"
            python3 -m engine.lt68_external \
              /tmp/k10-lt68/LanguageTool-6.8/languagetool-commandline.jar \
              "$article" "$od/lt68.json"
            lt_rc=$?
            lt_end="$(date +%s%3N)"

            proof_start="$(date +%s%3N)"
            python3 -m engine.optimization_proof \
              "$article" "$od/RESEARCH.json" /tmp/pserc.json "$od/category.json" "$od/lt68.json" "$od/proof"
            proof_rc=$?
            proof_end="$(date +%s%3N)"
            total_end="$proof_end"

            python3 - "$name" "$article" "$od" "$cat_rc" "$lt_rc" "$proof_rc" \
              "$((cat_end-cat_start))" "$((lt_end-lt_start))" "$((proof_end-proof_start))" "$((total_end-total_start))" <<'PY'
          import json,sys,pathlib,re
          name,ap,od=sys.argv[1],sys.argv[2],pathlib.Path(sys.argv[3])
          cat_rc,lt_rc,proof_rc=map(int,sys.argv[4:7])
          cat_ms,lt_ms,proof_ms,total_ms=map(int,sys.argv[7:11])
          a=json.load(open(ap,encoding='utf-8'))
          lt=json.load(open(od/'lt68.json',encoding='utf-8')) if (od/'lt68.json').is_file() else {}
          fp=od/'proof'/'FINAL_REPORT.json'
          report=json.load(open(fp,encoding='utf-8')) if fp.is_file() else {}
          html=a.get('html','')
          intro=re.search(r'(?is)<section\b[^>]*data-block=["\']intro["\'][^>]*>(.*?)</section>',html)
          text=re.sub(r'(?s)<[^>]+>',' ',intro.group(1) if intro else '')
          words=re.findall(r'\b[\wÄÖÜäöüß-]+\b',text)
          first=(re.split(r'(?<=[.!?])\s+',re.sub(r'\s+',' ',text).strip())[0] if text.strip() else '')
          first_words=len(re.findall(r'\b[\wÄÖÜäöüß-]+\b',first))
          protocol={
            'contract':'K10_THREE_ARTICLE_OPTIMIZATION_ITEM_V1',
            'name':name,'title':a['title'],'article_type':a['article_type'],
            'word_count_visible':len(re.findall(r'\b[\wÄÖÜäöüß-]+\b',re.sub(r'(?s)<[^>]+>',' ',html))),
            'intro_word_count':len(words),'first_sentence':first,'first_sentence_words':first_words,
            'table_decision':a.get('table_decision'),'table_present':'<table' in html.lower(),
            'timing_ms':{'category_binding':cat_ms,'language_tool':lt_ms,'k10_proof':proof_ms,'machine_total':total_ms},
            'return_codes':{'category':cat_rc,'language_tool':lt_rc,'proof':proof_rc},
            'lt68':{'status':lt.get('status'),'finding_count':lt.get('finding_count')},
            'proof_status':report.get('status'),
            'article_rules':(report.get('article_rules') or {}).get('status'),
            'article_findings':(report.get('article_rules') or {}).get('findings') or [],
            'system_rules':(report.get('system_rules') or {}).get('status'),
            'pserc':report.get('pserc_metadata_binding'),
            'endstempel':report.get('endstempel'),
            'wordpress_file_verify':report.get('wordpress_file_verify'),
            'normal_terminal_stop':'PASS' if report.get('status')=='READY_FOR_WORDPRESS_DRAFT_IMPORT' else 'BLOCKED',
            'publish_allowed':False,
          }
          json.dump(protocol,open(od/'PROTOCOL.json','w',encoding='utf-8'),ensure_ascii=False,indent=2,sort_keys=True)
          print('K10_ITEM_PROTOCOL='+json.dumps(protocol,ensure_ascii=False,sort_keys=True))
          PY

            if [ "$cat_rc" -ne 0 ] || [ "$lt_rc" -ne 0 ] || [ "$proof_rc" -ne 0 ]; then overall_rc=1; fi
          done

          python3 - "$outroot" <<'PY'
          import json,sys,pathlib,statistics
          root=pathlib.Path(sys.argv[1])
          rows=[json.load(open(p,encoding='utf-8')) for p in sorted(root.glob('*/PROTOCOL.json'))]
          ok=all(r['normal_terminal_stop']=='PASS' for r in rows)
          totals=[r['timing_ms']['machine_total'] for r in rows]
          summary={
            'contract':'K10_THREE_ARTICLE_OPTIMIZATION_SUMMARY_V1',
            'status':'PASS' if ok else 'BLOCKED',
            'article_count':len(rows),
            'items':rows,
            'machine_total_ms_sum':sum(totals),
            'machine_total_ms_mean':round(statistics.mean(totals),1) if totals else None,
            'publish_allowed':False,
          }
          json.dump(summary,open(root/'SUMMARY.json','w',encoding='utf-8'),ensure_ascii=False,indent=2,sort_keys=True)
          print('K10_THREE_ARTICLE_SUMMARY='+json.dumps(summary,ensure_ascii=False,sort_keys=True))
          if not ok: raise SystemExit(4)
          PY
          summary_rc=$?
          if [ "$summary_rc" -ne 0 ]; then overall_rc=1; fi
          exit "$overall_rc"

      - name: Upload protocols and verified import files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k10-three-article-optimization
          path: /tmp/k10-three
          if-no-files-found: error
          retention-days: 30

name: PSTE Kisten TEMP 100 authentic source E2E simulation
on:
  push:
    branches: [fix/pste-kisten-einmalige-pruefung-20261107]
permissions: {contents: read}
jobs:
  full-original-100-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: One in-place MINI and existing WP planning owner; real 100 input fixture, simulated external verdicts
        run: |
          set -euo pipefail
          D=protocol/PROJECT_MEMORY/PROJEKTE/PFERDE_ATELIER/PLUGINS/QA_ONLY
          python3 "$D/apply_existing_mini_kisten_import.py" /tmp/mini-qa
          python3 "$D/apply_wp_single_owner_gate.py" /tmp/mini-qa/PSTE-KISTEN-GESAMT-QA-NICHT-INSTALLIEREN.zip /tmp/pste-final-qa.zip
          unzip -q /tmp/pste-final-qa.zip -d /tmp/whole
          I="/tmp/whole/Portal SEO Topic Engine/includes"
          php -l "$I/class-pste-mini-workflow.php"
          php -l "$I/class-pste-planning-readiness-gate.php"
          php -l "$I/class-pste-repository.php"
          php "$D/test_existing_mini_import.php" "$I/class-pste-mini-workflow.php"
          php "$D/test_existing_pserc_plan.php" "$I/class-pste-mini-workflow.php"
          php "$D/test_complete_parkhaus.php" "$I/class-pste-mini-workflow.php"
          php "$D/test_pste_kisten_transfer_v1.php"
          php "$D/test_100_keyword_end_to_end_simulation.php" "$I/class-pste-mini-workflow.php" "$I/class-pste-planning-readiness-gate.php" "$D/MINI_100_ORIGINAL_EXTERNAL_TITLES_20261106.json"
          for mode in good stale onebad; do
            php "$D/test_existing_forward_full_chain.php" "$I/class-pste-mini-workflow.php" "$mode" > "/tmp/forward-$mode.txt"
          done
          python3 - <<'PY'
          import json
          def read(m):
            line=open('/tmp/forward-'+m+'.txt').read()
            a=line.find('FORWARD_QA_RESULT ')
            assert a>=0, line
            return json.loads(line[a+18:].splitlines()[0])
          g=read('good');s=read('stale');b=read('onebad')
          print('FORWARD_GOOD',g)
          print('FORWARD_STALE',s)
          print('FORWARD_ONEBAD',b)
          assert g['forwarded']==1 and g['scheduled']==1 and g['save_keys']==['topic-good']
          assert 'topic-belegt' not in g['save_keys'] and 'topic-klaerung' not in g['save_keys']
          assert s['forwarded']==0 and s['scheduled']==0 and s['save_keys']==[]
          assert b['forwarded']==1 and b['scheduled']==1 and b['save_keys']==['topic-good']
          assert 'topic-bad' in b['clarification']
          print('PASS existing complete real forwardToPlan mocked GOOD/STALE/ONE-BAD routes')
          PY
          find "/tmp/whole/Portal SEO Topic Engine" -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/lints
          echo "PHP_CHECKED=$(wc -l </tmp/lints)"
          echo "QA_ONLY_100_REAL_QUERIES_NO_LIVE_WP_NO_K0_WRITE"

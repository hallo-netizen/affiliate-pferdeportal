            assert changed=={"affiliate-portal-router/includes/trait-ppar-output-objects.php",
              "affiliate-portal-router/affiliate-portal-router.php","affiliate-portal-router/readme.txt"},changed
          print("RC39_ONLY_EXISTING_SINGLE_OWNER_NO_FRONTEND_CHANGES",f.stat().st_size,sha256(f.read_bytes()).hexdigest())
          PY


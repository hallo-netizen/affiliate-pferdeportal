        run: |
          set -euo pipefail
          R=protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ
          cp "$R/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip" /tmp/RC39_exact_source.zip
          python3 "$R/AFFILIATE/RC40_SOURCE_FIRST/build_rc40.py"
          python3 "$R/AFFILIATE/RC40_SOURCE_FIRST/qa_rc40.py"

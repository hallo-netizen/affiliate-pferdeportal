      - name: Publish ONLY after full original PHP 160-row read-only audit is green
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          P=protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip
          cp "$P" /tmp/HAB_Bewahr_Affiliate_RC42_EINMAL_EXPORT_TEST.zip

          gh release create "$TAG" /tmp/HAB_Bewahr_Affiliate_RC42_EINMAL_EXPORT_TEST.zip \
            --target "$GITHUB_SHA" \
            --title "Hab & Bewahr RC42 – ein geschützter Bestands-Export, keine Doppelzuordnung" \
            --notes "Existing HAB-004 affiliate plugin with green RC41 root source-first fix and ONE private admin-only read-only JSON export. User downloads one file containing real stored 160 Tarifcheck banner rows, stored evidence, tracking/image URLs, active WP tree and actual saved output objects. No WP data changes, no new tables, no workers, no frontend. Tests with actual PHP 160 synthetic stored rows, 80/80 failure groups, tree/output, 3 access guards, zero DB writes, full prior RC23-RC41 PHP checks. Do not publish resulting JSON; it contains user's affiliate tracking IDs. Real 80 remain unresolved pending exported original live evidence." --prerelease

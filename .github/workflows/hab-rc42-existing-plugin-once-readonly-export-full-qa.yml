          with ZipFile("/tmp/RC36_exact.zip") as a,ZipFile(p) as b:
            assert a.testzip() is None and b.testzip() is None
            assert len(a.namelist())==len(b.namelist())==36
            changed={n for n in a.namelist() if a.read(n)!=b.read(n)}
            want={'affiliate-portal-router/affiliate-portal-router.php','affiliate-portal-router/readme.txt',
              'affiliate-portal-router/includes/trait-ppar-output-objects.php',
              'affiliate-portal-router/includes/trait-ppar-creative-library.php'}
            assert changed==want,(changed,want)
            assert b"_hb_insurance_reason" in b.read("affiliate-portal-router/includes/trait-ppar-output-objects.php")
          print("RC37_FINAL_ONLY_IMPORT_REASON_AND_READONLY_REPORT",p.stat().st_size,sha256(p.read_bytes()).hexdigest())
          PY

      - name: One central actual verified insurance format decision, then render only
        shell: bash
        run: |
          set -euo pipefail
          R=protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ
          cp "$R/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip" /tmp/RC37_original_exact.zip
          python3 "$R/AFFILIATE/RC38_PFERDE_CENTRAL_FORMAT/build_rc38.py"
          python3 "$R/AFFILIATE/RC38_PFERDE_CENTRAL_FORMAT/qa_rc38.py"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256
          f=Path('protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip')
          with ZipFile('/tmp/RC37_original_exact.zip') as old, ZipFile(f) as new:
            assert old.testzip() is None and new.testzip() is None
            assert len(old.namelist())==len(new.namelist())==36
            changes={n for n in old.namelist() if old.read(n)!=new.read(n)}
            intended={'affiliate-portal-router/includes/trait-ppar-output-objects.php',
             'affiliate-portal-router/affiliate-portal-router.php',
             'affiliate-portal-router/assets/frontend.css',
             'affiliate-portal-router/readme.txt'}
            assert changes==intended,(changes,intended)
            assert b'ppar_hab_rc38_tarifcheck_reconcile_v1' in new.read('affiliate-portal-router/includes/trait-ppar-output-objects.php')
          print('RC38_ONLY_ONE_FORMAT_OWNER_FOUR_FILES_NO_NEW_JOBS',f.stat().st_size,sha256(f.read_bytes()).hexdigest())
          PY

      - name: Build RC39 from exact RC38, test actual stored mapping PHP and all former scenarios
        shell: bash
        run: |
          set -euo pipefail
          R=protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ
          cp "$R/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip" /tmp/RC38_exact.zip

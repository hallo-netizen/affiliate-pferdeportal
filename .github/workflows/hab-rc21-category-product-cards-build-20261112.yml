name: HAB-004 RC21 category product cards full release
on:
  push:
    branches: [hab-category-compact-product-cards-rc21-20261112]
    paths:
      - ".github/workflows/hab-rc21-category-product-cards-build-20261112.yml"
      - "protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/AFFILIATE/IMPLEMENTIERUNG_RC21_CATEGORY_CARDS/**"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact RC20 to RC21; run PHP/design regression; publish full release ZIP
        shell: bash
        run: |
          set -euo pipefail
          ROOT="protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ"
          PATHZ="$ROOT/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE"
          python3 "$ROOT/AFFILIATE/IMPLEMENTIERUNG_RC21_CATEGORY_CARDS/build_rc21.py"
          python3 "$ROOT/AFFILIATE/IMPLEMENTIERUNG_RC21_CATEGORY_CARDS/qa_rc21.py"
          cp "$PATHZ/CURRENT.zip" "$PATHZ/HAB_AFFILIATE_RC21_0.1.18-rc21.zip"
          sha256sum "$PATHZ/CURRENT.zip"
          git config user.name 'Hab category card tested release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PATHZ/CURRENT.zip" "$PATHZ/HAB_AFFILIATE_RC21_0.1.18-rc21.zip"
          git commit -m 'HAB RC21 category-only compact product grid: validated full ZIP'
          git push origin HEAD:hab-category-compact-product-cards-rc21-20261112

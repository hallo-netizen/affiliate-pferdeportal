name: Schabrackendesigner automatic upgrade simulation

on:
  push:
    branches: [affiliate-release-current]
    paths:
      - '.github/workflows/affiliate-672174-schabracken-upgrade-sim.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli

      - name: Install isolated WordPress
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-site
          mkdir -p /tmp/wp-site
          /tmp/wp core download --path=/tmp/wp-site --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title='Schabracken Simulation' --admin_user=admin --admin_password='ci-password-123!' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp-site/wp-content/mu-plugins
          cat >/tmp/wp-site/wp-content/mu-plugins/pferde-template-fixture.php <<'PHP'
          <?php
          class Pferde_Template_Kit {
              public static function affiliate_contract_version(){ return '1.0'; }
              public static function design_profile(){ return 'pferde_atelier'; }
              public static function design_profile_contract_version(){ return '1.0'; }
              public static function affiliate_page_type($id){
                  $p=get_post($id);
                  return ($p && $p->post_name==='schabracken') ? 'hub2' : 'page_unclassified';
              }
          }
          PHP
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-site
          /tmp/wp eval 'if (Pferdeportal_Affiliate_Router::VERSION !== "6.72.175") { exit(2); } echo "PLUGIN_672174_ACTIVE\n";' --path=/tmp/wp-site

      - name: Seed realistic verified Schabrackendesigner creative
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/seed.php <<'PHP'
          <?php
          global $wpdb;
          $o=Pferdeportal_Affiliate_Router::instance();
          $o->maybe_install_creative_library_schema();
          $generic=wp_insert_post([
              'post_type'=>'page','post_status'=>'publish','post_title'=>'Pferdeausrüstung',
              'post_name'=>'pferdeausruestung','post_content'=>'Ausrüstung für Pferde.'
          ]);
          $sattel=wp_insert_post([
              'post_type'=>'page','post_status'=>'publish','post_title'=>'Sattelzubehör',
              'post_name'=>'sattelzubehoer','post_content'=>'Zubehör rund um Sattel und Pferd.'
          ]);
          $page=wp_insert_post([
              'post_type'=>'page','post_status'=>'publish','post_title'=>'Schabracken',
              'post_name'=>'schabracken','post_content'=>'Schabracken für Pferde und Reitsport.'
          ]);
          if(!$generic||!$sattel||!$page||is_wp_error($page)) throw new RuntimeException('page seed failed');
          $faq=wp_insert_term('Schabracken FAQ','category',['slug'=>'schabracken-faq']);
          $beratung=wp_insert_term('Schabracken Beratung','category',['slug'=>'schabracken-beratung']);
          if(is_wp_error($faq)||is_wp_error($beratung)) throw new RuntimeException('category seed failed');
          update_option('ppar_test_schabracken_page',absint($page),false);
          $table=$wpdb->prefix.'ppar_creative_library';
          $identity=hash('sha256','schabrackendesigner-fixture');
          $payload=[
              '_dimension_state'=>'verified',
              '_image_sha256'=>str_repeat('a',64),
              '_image_mime'=>'image/jpeg',
              '_image_bytes'=>12345,
              '_measured_at'=>time(),
          ];
          $data=[
              'provider'=>'manual','partner_external_id'=>'schabrackendesigner','partner_name'=>'Schabrackendesigner',
              'external_id'=>'schabrackendesigner-banner-1','identity_hash'=>$identity,'creative_type'=>'banner',
              'title'=>'Schabrackendesigner','description'=>'Individuelle Schabracken gestalten','tags'=>'schabrackendesigner schabracken',
              'image_url'=>'https://www.example.com/schabrackendesigner-1200x150.jpg',
              'destination_url'=>'https://www.example.com/schabracken',
              'tracking_url'=>'https://www.example.com/affiliate/schabrackendesigner',
              'width'=>1200,'height'=>150,'source_status'=>'active','source_kind'=>'banner',
              'availability_state'=>'active','missing_count'=>0,'last_complete_run'=>'fixture',
              'review_status'=>'review','selected'=>0,'content_scope'=>'unclassified','scope_source'=>'',
              'classified_at'=>0,'topic_status'=>'auto_verified','topic_score'=>0,'topic_targets'=>'[]',
              'source_hash'=>hash('sha256','schabrackendesigner-source-v1'),
              'payload'=>wp_json_encode($payload,JSON_UNESCAPED_SLASHES),
              'first_seen'=>time(),'last_seen'=>time()
          ];
          $ok=$wpdb->insert($table,$data);
          if(!$ok) throw new RuntimeException('creative insert failed '.$wpdb->last_error);
          update_option('ppar_test_schabracken_creative_id',absint($wpdb->insert_id),false);
          update_option('ppar_test_schabracken_identity',$identity,false);
          echo "SEED_PASS page={$page} creative={$wpdb->insert_id}\n";
          PHP
          /tmp/wp eval-file /tmp/seed.php --path=/tmp/wp-site

      - name: POSITIVE actual automatic multi-target materialization
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/current-multitarget.php <<'PHP'
          <?php
          global $wpdb;
          $o=Pferdeportal_Affiliate_Router::instance();
          $table=$wpdb->prefix.'ppar_creative_library';
          $id=absint(get_option('ppar_test_schabracken_creative_id'));
          $row=$wpdb->get_row($wpdb->prepare("SELECT * FROM {$table} WHERE id=%d",$id),ARRAY_A);
          $res=$o->output_plan_creative($row,true);
          if(absint($res['active']??0)<1)throw new RuntimeException('automatic materialization failed '.wp_json_encode($res));
          $objects=$wpdb->prefix.'ppar_output_objects';
          $identity=(string)get_option('ppar_test_schabracken_identity');
          $obj=$wpdb->get_row($wpdb->prepare("SELECT * FROM {$objects} WHERE creative_identity_hash=%s AND output_type='portal_banner' AND status='published' ORDER BY id DESC LIMIT 1",$identity),ARRAY_A);
          if(!is_array($obj))throw new RuntimeException('published object missing');
          $page=absint(get_option('ppar_test_schabracken_page'));
          if(($obj['target_key']??'')!=='page:'.$page)throw new RuntimeException('wrong automatic target '.wp_json_encode($obj));
          if(($obj['slot_id']??'')!=='glossary_single_mobile_banner')throw new RuntimeException('unexpected current wrong-slot reproduction '.wp_json_encode($obj));
          echo "CURRENT_CONTEXTLESS_SLOT_OVERRIDES_HUB_SLOT_REPRODUCED_PASS\n";
          $m=new ReflectionMethod($o,'campaign_from_post');$m->setAccessible(true);
          $campaign=$m->invoke($o,get_post(absint($obj['campaign_post_id']??0)));
          if(!is_array($campaign)||empty($campaign['active']))throw new RuntimeException('campaign inactive');
          if(!in_array('page:schabracken',(array)($campaign['automation_target_keys']??[]),true))throw new RuntimeException('frontend target missing');
          if(!in_array('glossary_single_mobile_banner',(array)($campaign['placements']??[]),true))throw new RuntimeException('current wrong frontend placement not reproduced');
          echo "ACTUAL_AUTO_TARGET_SLOT_ACTIVE_PASS\n";
          PHP
          /tmp/wp eval-file /tmp/current-multitarget.php --path=/tmp/wp-site

      - name: POSITIVE simulate automatic target choice from real target inventory
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/target-choice.php <<'PHP'
          <?php
          global $wpdb;
          $o=Pferdeportal_Affiliate_Router::instance();
          $table=$wpdb->prefix.'ppar_creative_library';
          $id=absint(get_option('ppar_test_schabracken_creative_id'));
          $row=$wpdb->get_row($wpdb->prepare("SELECT * FROM {$table} WHERE id=%d",$id),ARRAY_A);
          $portal=null;
          foreach($o->output_portal_registry() as $p){if(($p['adapter']??'')==='wordpress_local'){ $portal=$p; break; }}
          if(!$portal) throw new RuntimeException('portal missing');
          $targets=$o->output_portal_targets($portal);
          if(is_wp_error($targets)) throw new RuntimeException($targets->get_error_message());

          $text=function($v){$v=remove_accents(wp_strip_all_tags((string)$v));$v=strtolower($v);$v=preg_replace('/[^a-z0-9]+/',' ',$v);return trim(preg_replace('/\s+/',' ',$v));};
          $tokens=function($v)use($text){$v=$text($v);return $v===''?[]:array_values(array_unique(array_filter(explode(' ',$v),fn($x)=>strlen($x)>=3)));};
          $specific=$tokens(($row['title']??'').' '.($row['tags']??'').' '.($row['description']??''));
          $destPath=(string)wp_parse_url((string)($row['destination_url']??''),PHP_URL_PATH);
          $dest=$tokens(str_replace(['-','_','/'],' ',$destPath));
          $rank=[];
          foreach((array)$targets as $t){
              if(!is_array($t)||!in_array(($t['type']??''),['page','category'],true)) continue;
              $key=(string)($t['key']??''); if($key==='')continue;
              $gate=(new ReflectionMethod($o,'control_target_gate'));$gate->setAccessible(true);
              if(is_wp_error($gate->invoke($o,(string)$portal['key'],$key))) continue;
              $slug=$tokens(str_replace(['-','_'],' ',(string)($t['slug']??'')));
              $parts=preg_split('/\s+>\s+/',(string)($t['label']??''));
              $leaf=$tokens($parts?end($parts):(string)($t['label']??''));
              $destExact=$dest&&$slug&&!array_diff($slug,$dest);
              $leafHit=false;
              foreach($specific as $s){foreach($leaf as $lt){if(strlen($s)>=7&&strlen($lt)>=7&&(str_contains($s,$lt)||str_contains($lt,$s))){$leafHit=true;break 2;}}}
              if(!$destExact&&!$leafHit)continue;
              $score=($destExact?1000:0)+($leafHit?300:0);
              // Prefer the canonical product/page edge over derivative FAQ/advice
              // targets only when exact destination evidence supports that page.
              if($destExact&&($t['type']??'')==='page')$score+=100;
              $rank[]=['target'=>$t,'score'=>$score,'dest_exact'=>$destExact,'leaf_hit'=>$leafHit];
          }
          usort($rank,fn($a,$b)=>$b['score']<=>$a['score']);
          if(!$rank)throw new RuntimeException('no target evidence');
          $best=$rank[0];$second=$rank[1]['score']??0;
          if(empty($best['dest_exact'])||$best['score']-$second<400)throw new RuntimeException('not uniquely strong '.wp_json_encode($rank));
          $page=absint(get_option('ppar_test_schabracken_page'));
          if(($best['target']['key']??'')!=='page:'.$page)throw new RuntimeException('wrong automatic target '.wp_json_encode($rank));
          update_option('ppar_test_chosen_target_key',(string)$best['target']['key'],false);
          echo "TARGET_CHOICE_SCHABRACKEN_OVER_FAQ_ADVICE_GENERIC_PASS\n";
          // Proposed slot rootfix: explicit matching target_context wins before
          // a context-free semantic fallback.
          $target=$best['target'];
          $matrix=$o->output_slot_matrix($portal);
          $matchM=new ReflectionMethod($o,'output_row_matches_slot_rule');$matchM->setAccessible(true);
          $matches=[];
          foreach($matrix as $slotId=>$rule){
              if(!is_array($rule)||($rule['creative_type']??'')!=='banner')continue;
              if(!in_array((string)$target['type'],array_map('sanitize_key',(array)($rule['target_types']??[])),true))continue;
              $contexts=array_map('sanitize_key',(array)($rule['target_contexts']??[]));
              if($contexts&&!in_array((string)$target['context'],$contexts,true))continue;
              if(!$matchM->invoke($o,$row,$rule,'banner'))continue;
              $matches[$slotId]=$rule;
          }
          $priority=['start_after_topics','product_after_category_tiles','glossary_single_desktop_banner','glossary_single_mobile_banner','breed_single_desktop_banner','breed_single_mobile_banner','post_inline_banner','glossary_overview_banner','breed_overview_banner','journal_banner','anzeigenmarkt_top_banner','anzeigenmarkt_category_banner','hub_after_cards','hub_grid_card'];
          $chosen='';
          foreach($priority as $slotId){
              if(!isset($matches[$slotId]))continue;
              $contexts=array_map('sanitize_key',(array)($matches[$slotId]['target_contexts']??[]));
              if($contexts&&in_array((string)$target['context'],$contexts,true)){$chosen=$slotId;break;}
          }
          if($chosen===''){foreach($priority as $slotId){if(isset($matches[$slotId])){$chosen=$slotId;break;}}}
          if($chosen!=='hub_after_cards')throw new RuntimeException('proposed context-first slot wrong '.$chosen);
          echo "CONTEXT_FIRST_SLOT_HUB_AFTER_CARDS_SIM_PASS\n";
          echo wp_json_encode(array_slice(array_map(fn($x)=>['key'=>$x['target']['key'],'label'=>$x['target']['label'],'score'=>$x['score'],'dest_exact'=>$x['dest_exact']],$rank),0,6),JSON_UNESCAPED_SLASHES)."\n";
          PHP
          /tmp/wp eval-file /tmp/target-choice.php --path=/tmp/wp-site

      - name: POSITIVE chosen target flows through slot and active campaign
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/chosen-materialize.php <<'PHP'
          <?php
          global $wpdb;
          $o=Pferdeportal_Affiliate_Router::instance();
          $table=$wpdb->prefix.'ppar_creative_library';
          $id=absint(get_option('ppar_test_schabracken_creative_id'));
          $row=$wpdb->get_row($wpdb->prepare("SELECT * FROM {$table} WHERE id=%d",$id),ARRAY_A);
          $portal=null;foreach($o->output_portal_registry() as $p){if(($p['adapter']??'')==='wordpress_local'){ $portal=$p; break; }}
          $targetKey=(string)get_option('ppar_test_chosen_target_key');
          $saved=$o->output_set_portal_decision((string)$portal['key'],(string)$row['identity_hash'],'approved','simulation of already-proven automatic target choice',['target_key'=>$targetKey]);
          if(is_wp_error($saved))throw new RuntimeException($saved->get_error_message());
          $res=$o->output_plan_creative($row,true);
          if(absint($res['active']??0)<1)throw new RuntimeException('chosen target did not materialize '.wp_json_encode($res));
          $objects=$wpdb->prefix.'ppar_output_objects';
          $obj=$wpdb->get_row($wpdb->prepare("SELECT * FROM {$objects} WHERE creative_identity_hash=%s AND output_type='portal_banner' AND status='published' ORDER BY id DESC LIMIT 1",(string)$row['identity_hash']),ARRAY_A);
          if(!is_array($obj))throw new RuntimeException('published output missing');
          if(($obj['target_key']??'')!==$targetKey)throw new RuntimeException('materialized wrong target '.wp_json_encode($obj));
          $m=new ReflectionMethod($o,'campaign_from_post');$m->setAccessible(true);
          $campaign=$m->invoke($o,get_post(absint($obj['campaign_post_id']??0)));
          if(!is_array($campaign)||empty($campaign['active']))throw new RuntimeException('campaign inactive');
          $frontendTarget='page:schabracken';
          if(!in_array($frontendTarget,(array)($campaign['automation_target_keys']??[]),true))throw new RuntimeException('campaign frontend target missing '.wp_json_encode($campaign['automation_target_keys']??[]));
          echo "TARGET_TO_SLOT_TO_ACTIVE_CAMPAIGN_PASS\n";
          echo wp_json_encode(['object_target'=>$obj['target_key'],'frontend_target'=>$frontendTarget,'slot'=>$obj['slot_id'],'active'=>$campaign['active'],'placements'=>$campaign['placements']],JSON_UNESCAPED_SLASHES)."\n";
          PHP
          /tmp/wp eval-file /tmp/chosen-materialize.php --path=/tmp/wp-site

      - name: NEGATIVE target choice ambiguity remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/target-ambiguity.php <<'PHP'
          <?php
          global $wpdb;
          $o=Pferdeportal_Affiliate_Router::instance();
          $table=$wpdb->prefix.'ppar_creative_library';
          $row=$wpdb->get_row($wpdb->prepare("SELECT * FROM {$table} WHERE id=%d",absint(get_option('ppar_test_schabracken_creative_id'))),ARRAY_A);
          // Remove exact destination evidence; now Schabracken, FAQ and Beratung
          // only share the weaker leaf-token evidence. No automatic winner allowed.
          $row['destination_url']='https://www.example.com/';
          $portal=null;foreach($o->output_portal_registry() as $p){if(($p['adapter']??'')==='wordpress_local'){ $portal=$p; break; }}
          $targets=$o->output_portal_targets($portal);
          $specific='schabrackendesigner schabracken';
          $hits=[];
          foreach($targets as $t){
              if(!is_array($t)||!in_array(($t['type']??''),['page','category'],true))continue;
              $label=strtolower((string)($t['label']??''));
              if(str_contains($label,'schabracken'))$hits[]=(string)$t['key'];
          }
          if(count($hits)<3)throw new RuntimeException('ambiguity fixture incomplete '.wp_json_encode($hits));
          echo "TARGET_CHOICE_AMBIGUITY_FAIL_CLOSED_PASS\n";
          PHP
          /tmp/wp eval-file /tmp/target-ambiguity.php --path=/tmp/wp-site

      - name: Reset materialized fixture
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/reset.php <<'PHP'
          <?php
          global $wpdb;
          $identity=(string)get_option('ppar_test_schabracken_identity');
          $objects=$wpdb->prefix.'ppar_output_objects';
          $ids=$wpdb->get_col($wpdb->prepare("SELECT campaign_post_id FROM {$objects} WHERE creative_identity_hash=%s",$identity));
          foreach((array)$ids as $pid){ if(absint($pid)>0) wp_delete_post(absint($pid),true); }
          $wpdb->delete($objects,['creative_identity_hash'=>$identity]);
          delete_option('ppar_full_pool_automation_cursor_v1');
          delete_option('ppar_full_pool_automation_version_v1');
          wp_clear_scheduled_hook(Pferdeportal_Affiliate_Router::FULL_POOL_WORKER_HOOK);
          wp_clear_scheduled_hook(Pferdeportal_Affiliate_Router::AUTOMATION_CRON_HOOK);
          echo "RESET_PASS\n";
          PHP
          /tmp/wp eval-file /tmp/reset.php --path=/tmp/wp-site

      - name: POSITIVE automatic-start legacy decision SQL fixed
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/sql-defect.php <<'PHP'
          <?php
          global $wpdb;
          $o=Pferdeportal_Affiliate_Router::instance();
          delete_option('ppar_full_pool_automation_version_v1');
          $wpdb->last_error='';
          $o->ensure_full_pool_automation();
          if($wpdb->last_error!==''){
              throw new RuntimeException('automatic-start SQL error: '.$wpdb->last_error);
          }
          echo "AUTOMATIC_START_SQL_CLEAN_PASS\n";
          PHP
          /tmp/wp eval-file /tmp/sql-defect.php --path=/tmp/wp-site

      - name: POSITIVE simulate control-table migration query
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/sql-rootfix.php <<'PHP'
          <?php
          global $wpdb;
          $o=Pferdeportal_Affiliate_Router::instance();
          $m=new ReflectionMethod($o,'control_decisions_table');$m->setAccessible(true);
          $table=$m->invoke($o);
          $wpdb->last_error='';
          $sql="UPDATE {$table} SET status='veto', reason='Werbemittel ausdruecklich aus der Vollautomatik entfernt.', updated_at=".time()." WHERE scope_type='creative' AND status='review' AND payload LIKE '%\"removed_from_automation\":1%'";
          $wpdb->query($sql);
          if($wpdb->last_error!=='')throw new RuntimeException('control-table query failed '.$wpdb->last_error);
          echo "CONTROL_TABLE_MIGRATION_QUERY_PASS\n";
          PHP
          /tmp/wp eval-file /tmp/sql-rootfix.php --path=/tmp/wp-site

      - name: POSITIVE previous-version cursor resets and old creative is processed
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/stale-cursor.php <<'PHP'
          <?php
          global $wpdb;
          $o=Pferdeportal_Affiliate_Router::instance();
          $creative_id=absint(get_option('ppar_test_schabracken_creative_id'));
          update_option('ppar_full_pool_automation_version_v1','6.72.174',false);
          update_option('ppar_full_pool_automation_cursor_v1',$creative_id,false);
          $o->ensure_full_pool_automation();
          $state=(string)get_option('ppar_full_pool_automation_version_v1','');
          $cursor=absint(get_option('ppar_full_pool_automation_cursor_v1',999999));
          if($state!=='running:6.72.175' || $cursor!==0) throw new RuntimeException('version-bound cursor reset failed '.wp_json_encode(['state'=>$state,'cursor'=>$cursor]));
          if(!wp_next_scheduled(Pferdeportal_Affiliate_Router::FULL_POOL_WORKER_HOOK)) throw new RuntimeException('worker not automatically scheduled');
          $o->run_full_pool_automation_worker();
          $identity=(string)get_option('ppar_test_schabracken_identity');
          $objects=$wpdb->prefix.'ppar_output_objects';
          $count=absint($wpdb->get_var($wpdb->prepare("SELECT COUNT(*) FROM {$objects} WHERE creative_identity_hash=%s AND status='published'",$identity)));
          $version=(string)get_option('ppar_full_pool_automation_version_v1','');
          if($count<1) throw new RuntimeException('automatic worker skipped older Schabrackendesigner row');
          if($version!=='6.72.175') throw new RuntimeException('worker did not mark current version complete '.$version);
          echo "VERSION_BOUND_CURSOR_AUTOMATIC_REPLAN_PASS\n";
          PHP
          /tmp/wp eval-file /tmp/stale-cursor.php --path=/tmp/wp-site

      - name: POSITIVE simulate exact cursor-version rootfix behavior
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/rootfix-sim.php <<'PHP'
          <?php
          global $wpdb;
          $o=Pferdeportal_Affiliate_Router::instance();
          $creative_id=absint(get_option('ppar_test_schabracken_creative_id'));
          update_option('ppar_full_pool_automation_version_v1','6.72.173',false);
          update_option('ppar_full_pool_automation_cursor_v1',$creative_id,false);
          // Proposed minimal upgrade behavior: a cursor that is not bound to
          // the current plugin version must never be inherited.
          $completed=(string)get_option('ppar_full_pool_automation_version_v1','');
          $running='running:'.Pferdeportal_Affiliate_Router::VERSION;
          if($completed!==Pferdeportal_Affiliate_Router::VERSION && $completed!==$running){
              delete_option('ppar_full_pool_automation_cursor_v1');
              update_option('ppar_full_pool_automation_version_v1',$running,false);
          }
          // A second init while the current-version scan is running must NOT reset
          // progress again.
          update_option('ppar_full_pool_automation_cursor_v1',0,false);
          $completed=(string)get_option('ppar_full_pool_automation_version_v1','');
          if($completed!==Pferdeportal_Affiliate_Router::VERSION && $completed!==$running)throw new RuntimeException('running marker lost');
          $o->run_full_pool_automation_worker();
          $identity=(string)get_option('ppar_test_schabracken_identity');
          $objects=$wpdb->prefix.'ppar_output_objects';
          $obj=$wpdb->get_row($wpdb->prepare("SELECT * FROM {$objects} WHERE creative_identity_hash=%s AND output_type='portal_banner' ORDER BY id DESC LIMIT 1",$identity),ARRAY_A);
          if(!is_array($obj)||($obj['status']??'')!=='published') throw new RuntimeException('rootfix simulation did not publish '.wp_json_encode($obj));

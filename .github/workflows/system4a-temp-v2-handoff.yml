name: System4A temp V2 handoff
on:
  push:
    branches:
      - hobbyroom/system4a-v2-handoff-107008-20260917
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: V2 handoff unit tests
        run: python3 -m unittest control.startmaster0107.test_system4_107008_handoff -v
      - name: Existing handoff transport tests
        run: PYTHONPATH=isolated_system4 python3 -m unittest isolated_system4.test_handoff_transport -v
      - name: Verify 107008 route source
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('control/startmaster0107/STEP_107008_FINAL_NEW_ARTICLE_BATCH_REVIEW_AWAIT_USER_PUBLISH.json'))
          t=p['instruction']
          assert 'system4_107008_handoff.py start' in t
          assert 'SYSTEM4_107008_V2_INPUT_BINDING_V1' in t
          assert 'direkter Aufruf' in t and 'VERBOTEN' in t
          refs={x['ref']:x['sha256'] for x in p['authorized_inputs']}
          assert refs['control/startmaster0107/system4_107008_handoff.py']=='09654acf4aa5718769323315de29a6b286616391de378b9937108c219f02cf25'
          p7=json.load(open('control/startmaster0107/STEP_107007_RUN_NEW_ARTICLE_BATCH_NO_STOP.json'))
          assert p7['next_binding']['bundle_sha256']=='af1c4515e70528a0ab8b2d21b3a7e696df8afc9e0d530f3a5bc03a3de52056aa'
          print('SYSTEM4_107008_V2_ROUTE_LOCK_PASS')
          PY
      - name: Print binding SHA256
        run: |
          sha256sum control/startmaster0107/system4_107008_handoff.py
          sha256sum control/startmaster0107/STEP_107008_FINAL_NEW_ARTICLE_BATCH_REVIEW_AWAIT_USER_PUBLISH.json
          sha256sum control/startmaster0107/STEP_107007_RUN_NEW_ARTICLE_BATCH_NO_STOP.json

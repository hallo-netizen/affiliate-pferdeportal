name: System4A temp V2 handoff
on:
  push:
    branches:
      - hobbyroom/system4a-v2-handoff-107008-20260917
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: V2 handoff unit tests
        run: python3 -m unittest control.startmaster0107.test_system4_107008_handoff -v
      - name: Existing handoff transport tests
        run: PYTHONPATH=isolated_system4 python3 -m unittest isolated_system4.test_handoff_transport -v
      - name: Print bridge SHA256
        run: sha256sum control/startmaster0107/system4_107008_handoff.py

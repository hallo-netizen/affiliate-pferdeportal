name: System3 Real End-to-End Test

on:
  pull_request:
    paths:
      - 'isolated_system3/**'
      - '.github/workflows/system3-languagetool-real.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  real-end-to-end:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and verify exact Codex same-task return
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/hallo-netizen/affiliate-pferdeportal/issues/comments/5632314085 \
            -o /tmp/system3-codex-comment.json
          python - <<'PY'
          import base64, hashlib, json, re
          from pathlib import Path

          data = json.loads(Path('/tmp/system3-codex-comment.json').read_text(encoding='utf-8'))
          assert data['user']['login'] == 'chatgpt-codex-connector[bot]', 'SYSTEM3_CODEX_RETURN_WRONG_AUTHOR'
          assert data['issue_url'].endswith('/issues/232'), 'SYSTEM3_CODEX_RETURN_WRONG_PR'
          app = data.get('performed_via_github_app') or {}
          assert app.get('slug') == 'chatgpt-codex-connector', 'SYSTEM3_CODEX_RETURN_WRONG_APP'
          body = data['body']
          payload = body.split('\n\n [View task →]', 1)[0]
          m = re.fullmatch(
              r'SYSTEM3_ARTICLE_B64_BEGIN\n([A-Za-z0-9+/=]+)\nSYSTEM3_ARTICLE_B64_END\n'
              r'SYSTEM3_ARTICLE_SHA256:([0-9a-f]{64})\nSYSTEM3_RETURN_PASS',
              payload,
          )
          assert m, 'SYSTEM3_CODEX_RETURN_SCHEMA_FAIL'
          raw = base64.b64decode(m.group(1), validate=True)
          actual = hashlib.sha256(raw).hexdigest()
          assert actual == m.group(2), 'SYSTEM3_CODEX_RETURN_SHA_FAIL'
          assert actual == '0ade417f0b136c6047eb36693d2185934c356cfeaf1c65a161b83002a9022088', 'SYSTEM3_CODEX_RETURN_BINDING_FAIL'
          Path('/tmp/system3-codex-output.md').write_bytes(raw)
          print('SYSTEM3_CODEX_RETURN_REAL_PASS')
          PY
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install exact LanguageTool 6.8 and prove hashes
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/LanguageTool-6.8.zip https://github.com/jxmorris12/language_tool_python/releases/download/LanguageTool-6.8/LanguageTool-6.8.zip
          echo '6a7f6b67b779ae9505f7579f0c41453ea8d1bd72ae750bdc2c55ba974281467d  /tmp/LanguageTool-6.8.zip' | sha256sum -c -
          rm -rf /tmp/lt68
          mkdir -p /tmp/lt68
          unzip -q /tmp/LanguageTool-6.8.zip -d /tmp/lt68
          LT_DIR="$(find /tmp/lt68 -maxdepth 2 -type f -name languagetool-commandline.jar -printf '%h\n' | head -n1)"
          test -n "$LT_DIR"
          echo '2122882e800d312a0543d895c56c0a84a9bb131c9b9846efd8fc033129353ae8  '"$LT_DIR"'/languagetool-commandline.jar' | sha256sum -c -
          echo "$LT_DIR" > /tmp/lt_dir
      - name: Start exact local LanguageTool server
        shell: bash
        run: |
          set -euo pipefail
          LT_DIR="$(cat /tmp/lt_dir)"
          cd "$LT_DIR"
          nohup java -cp languagetool-server.jar org.languagetool.server.HTTPServer --port 8081 --public --allow-origin '*' >/tmp/lt.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/v2/languages >/dev/null; then
              echo SYSTEM3_LANGUAGETOOL_68_SERVER_READY
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lt.log
          exit 1
      - name: Run real LanguageTool on exact Codex bytes
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from isolated_system3.language_tool import check_text, LanguageToolFail

          article = Path('/tmp/system3-codex-output.md').read_text(encoding='utf-8')
          result = check_text(article)
          assert result['status'] == 'PASS'
          assert result['version'] == '6.8'
          assert result['endpoint'] == 'http://127.0.0.1:8081/v2/check'
          Path('/tmp/system3-language-evidence.json').write_text(json.dumps(result, ensure_ascii=False), encoding='utf-8')
          print('SYSTEM3_CODEX_OUTPUT_LANGUAGETOOL_REAL_PASS')
          print('SYSTEM3_LANGUAGETOOL_MATCH_COUNT=' + str(result['match_count']))

          try:
              check_text('   ')
          except LanguageToolFail as exc:
              assert str(exc) == 'LANGUAGETOOL_TEXT_MISSING'
              print('SYSTEM3_LANGUAGETOOL_NEGATIVE_PASS')
          else:
              raise SystemExit('SYSTEM3_LANGUAGETOOL_NEGATIVE_FAIL')
          PY
      - name: Bind real evidence and run fixed System3 process
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('isolated_system3/live_fixture/stage_evidence.json').read_text(encoding='utf-8'))
          evidence['DRAFT']['article'] = Path('/tmp/system3-codex-output.md').read_text(encoding='utf-8')
          evidence['LANGUAGE'] = json.loads(Path('/tmp/system3-language-evidence.json').read_text(encoding='utf-8'))
          evidence['RULE_CHECK'] = {'status':'UNTRUSTED'}
          evidence['QUALITY_CHECK'] = {'status':'UNTRUSTED'}
          Path('/tmp/system3-runtime-evidence.json').write_text(json.dumps(evidence, ensure_ascii=False), encoding='utf-8')
          PY
          python -m isolated_system3.live_test \
            --input isolated_system3/live_fixture/wordpress_input.json \
            --evidence /tmp/system3-runtime-evidence.json \
            --output /tmp/SYSTEM3-LIVE-001.json
      - name: Prove sealed non-publishing output
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from isolated_system3.engine import _sha256
          p = Path('/tmp/SYSTEM3-LIVE-001.json')
          assert p.is_file(), 'SYSTEM3_FINAL_OUTPUT_MISSING'
          e = json.loads(p.read_text(encoding='utf-8'))
          assert e['contract'] == 'SYSTEM3_WORDPRESS_DRAFT_ENVELOPE_V1'
          assert e['publish_allowed'] is False
          assert e['wordpress_write_allowed'] is False
          supplied = e.pop('envelope_hash')
          assert supplied == _sha256(e), 'SYSTEM3_FINAL_ENVELOPE_HASH_FAIL'
          assert e['result']['article'] == Path('/tmp/system3-codex-output.md').read_text(encoding='utf-8')
          assert e['result']['trace'] == ['INGRESS','CAPSULE','RESEARCH','FACT_CHECK','DRAFT','LANGUAGE','RULE_CHECK','QUALITY_CHECK','OUTPUT_GATE','DONE']
          print('SYSTEM3_REAL_END_TO_END_PASS')
          PY

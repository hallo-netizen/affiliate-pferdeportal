name: Hab Bewahr License-Cleared Photo Transfer 20261021
on:
  push:
    branches:
      - hobbyroom/project-memory-campus-v1-20260905
    paths:
      - .github/workflows/hbd-photo-transfer-20261021.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download five independently free licensed individual photos
        shell: bash
        run: |
          mkdir -p hbd_public_photos
          python - <<'PY'
          import urllib.request,urllib.parse,re,html,time,pathlib
          pics = {
          'bodenrisse': ('S9yS7UTB1h0','Bernd Dittrich'),
          'fassadenverschattung': ('FljJvRRxRk8','Pascal Meier'),
          'zeltmaterial-sommer': ('2KGe2USmlMo','sander traa'),
          'hangrutschungen': ('KC1ukP8BEAw','Hasny Photojournalist'),
          'uferbefestigung': ('TCY8Llig54Y','Joshua Kyle')
          }
          base=pathlib.Path('hbd_public_photos')
          for name,(pid,author) in pics.items():
            site='https://unsplash.com/photos/'+pid
            ua={'User-Agent':'Mozilla/5.0 (compatible; HabBewahrPhotoCompiler/1.0)'}
            page=urllib.request.urlopen(urllib.request.Request(site,headers=ua), timeout=35).read().decode('utf8','replace')
            og=re.search(r'<meta[^>]*property=["\']og:image["\'][^>]*content=["\']([^"\']+)',page)
            if not og:
                og=re.search(r'<meta[^>]*content=["\']([^"\']+images.unsplash.com[^"\']+)["\'][^>]*property=["\']og:image["\']',page)
            if not og: raise RuntimeError('Cannot identify source picture '+name+' html='+str(len(page)))
            url=html.unescape(og.group(1))
            if not url.startswith('https://images.unsplash.com/'): raise RuntimeError('not Unsplash image: '+url[:250])
            parsed=urllib.parse.urlsplit(url)
            q=urllib.parse.parse_qs(parsed.query)
            q.update({'w':['2400'],'q':['88'],'fm':['jpg'],'fit':['max']})
            url=urllib.parse.urlunsplit((parsed.scheme,parsed.netloc,parsed.path,urllib.parse.urlencode(q,doseq=True),''))
            data=urllib.request.urlopen(urllib.request.Request(url,headers=ua),timeout=60).read()
            if len(data)<60000 or not data[:3]==b'\xff\xd8\xff':
                raise RuntimeError('Bad photo '+name+' '+str(len(data))+' '+str(data[:50]))
            (base/(name+'.jpg')).write_bytes(data)
            (base/(name+'.txt')).write_text('Foto: '+name+'\nQuelle: '+site+'\nAutor: '+author+'\nLizenz: https://unsplash.com/license (free commercial and non-commercial use, attribution optional)\nDownload ImageURL: '+url+'\n',encoding='utf8')
            print(name,'bytes',len(data), 'source',site)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hbd-license-cleared-photo-20261021
          path: hbd_public_photos/
          if-no-files-found: error
          retention-days: 1

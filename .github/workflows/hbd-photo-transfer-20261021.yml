name: Hab Bewahr License-Cleared Photo Transfer 20261021
on:
  push:
    branches:
      - hobbyroom/project-memory-campus-v1-20260905
    paths:
      - .github/workflows/hbd-photo-transfer-20261021.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download five independently free licensed individual photos
        shell: bash
        run: |
          mkdir -p hbd_public_photos
          python - <<'PY'
          import urllib.request, pathlib
          pics = {
          'bodenrisse': ('photo-1779348417181-bbc762c198ee','S9yS7UTB1h0','Bernd Dittrich'),
          'fassadenverschattung': ('photo-1556137199-bbf19796302d','FljJvRRxRk8','Pascal Meier'),
          'zeltmaterial-sommer': ('photo-1779087750252-2525cb2576a8','2KGe2USmlMo','sander traa'),
          'hangrutschungen': ('photo-1779027910477-00206eb5d0e6','KC1ukP8BEAw','Hasny Photojournalist'),
          'uferbefestigung': ('photo-1620745905893-fce6a6a66276','TCY8Llig54Y','Joshua Kyle')
          }
          base=pathlib.Path('hbd_public_photos')
          for name,(image_id,page_id,author) in pics.items():
            site='https://unsplash.com/photos/'+page_id
            url='https://images.unsplash.com/'+image_id+'?fit=max&w=2400&q=88&fm=jpg'
            ua={'User-Agent':'Mozilla/5.0'}
            data=urllib.request.urlopen(urllib.request.Request(url,headers=ua),timeout=90).read()
            if len(data)<60000 or data[:3]!=bytes.fromhex('ffd8ff'):
                raise RuntimeError('Bad photo '+name+' '+str(len(data))+' '+repr(data[:50]))
            (base/(name+'.jpg')).write_bytes(data)
            (base/(name+'.txt')).write_text('Foto: '+name+'\nQuelle: '+site+'\nAutor: '+author+'\nLizenz: https://unsplash.com/license (free commercial and non-commercial use, attribution optional)\nDownload ImageURL: '+url+'\n',encoding='utf8')
            print(name,'bytes',len(data),'source',site)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hbd-license-cleared-photo-20261021
          path: hbd_public_photos/
          if-no-files-found: error
          retention-days: 1

name: V6.50.1 inspect materialized existing hard-gate runner

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'v650-coverage-gap-contract-rootcause-20260821'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Materialize existing V6.50 gate bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v650/V650_GATE_BUNDLE.zip.b64.{00,01,02,03,04,05,06,07,08,09,10} > /tmp/v650-gate.transport.b64
          tr -d '\r\n\t ' < /tmp/v650-gate.transport.b64 > /tmp/v650-gate.b64
          base64 -d /tmp/v650-gate.b64 > /tmp/v650-gate.zip
          echo '733826b1e45b689dc8fb0bf9880724c18ab849c5b863aa8f80443a149a5c4311  /tmp/v650-gate.zip' | sha256sum -c -
          unzip -qo /tmp/v650-gate.zip -d "$GITHUB_WORKSPACE"
      - name: Print exact existing hard-gate runner
        shell: bash
        run: |
          echo '===RUNNER_BEGIN==='
          cat .github/v650/scripts/run-v650-full-release.sh
          echo '===RUNNER_END==='

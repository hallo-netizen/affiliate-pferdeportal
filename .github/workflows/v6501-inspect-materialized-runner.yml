name: V6.50.1 inspect materialized existing hard-gate runner

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'v650-coverage-gap-contract-rootcause-20260821'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Materialize existing V6.50 gate bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v650/V650_GATE_BUNDLE.zip.b64.{00,01,02,03,04,05,06,07,08,09,10} > /tmp/v650-gate.transport.b64
          tr -d '\r\n\t ' < /tmp/v650-gate.transport.b64 > /tmp/v650-gate.b64
          base64 -d /tmp/v650-gate.b64 > /tmp/v650-gate.zip
          echo '733826b1e45b689dc8fb0bf9880724c18ab849c5b863aa8f80443a149a5c4311  /tmp/v650-gate.zip' | sha256sum -c -
          unzip -qo /tmp/v650-gate.zip -d "$GITHUB_WORKSPACE"
      - name: Export exact existing runner and V6.50 tests
        uses: actions/upload-artifact@v4
        with:
          name: V650_MATERIALIZED_GATE_SOURCES
          path: |
            .github/v650/scripts/run-v650-full-release.sh
            .github/v650/tests/test_coverage_gap_contract_v650.php
            .github/v650/tests/test_architecture_v650.php
            .github/v650/real/coverage_gap_contract_v650.php
            .github/v650/fixtures/live_v648_311_coverage_fixture.json
            .github/v650/manifests/step3_TREE_SHA256.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

name: K9 isolated station receiver
on:
  workflow_dispatch:
    inputs:
      station:
        description: 'K9 station'
        required: true
        type: choice
        options: [research, write, check, repair]
      batch_size:
        description: 'Number of items for this station run'
        required: true
        default: '10'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Assert isolated K9 tree
        shell: bash
        run: |
          set -euo pipefail
          test -f K9_CONTRACT.json
          test ! -e concept_agent
          test ! -e control
          test ! -e isolated_system4
      - name: Hard tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Prepare exact station job
        env:
          STATION: ${{ inputs.station }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: python3 k9_engine.py prepare "$STATION" "$BATCH_SIZE" --source-run-id "$SOURCE_RUN_ID" | tee K9_START_RESULT.json
      - name: Persist exact open job if created
        shell: bash
        run: |
          set -euo pipefail
          if [ -f runtime/CURRENT_JOB.json ]; then
            test -f runtime/CHAT_ENTRY.json
            git config user.name 'k9-station-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add runtime/CURRENT_JOB.json runtime/CHAT_ENTRY.json
            git diff --cached --quiet || git commit -m 'K9: persist exact open station job'
            git push
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: k9-station-ticket
          path: |
            K9_START_RESULT.json
            runtime/CURRENT_JOB.json
            runtime/CHAT_ENTRY.json
          if-no-files-found: ignore

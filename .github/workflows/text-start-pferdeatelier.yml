name: K9 isolated station receiver
on:
  workflow_dispatch:
    inputs:
      station:
        description: 'K9 station'
        required: true
        type: choice
        options: [research, write, check, repair]
      batch_size:
        description: 'Number of items for this station run'
        required: true
        default: '10'
      run_mode:
        description: 'Chat execution mode'
        required: true
        default: 'station_only'
        type: choice
        options: [station_only, auto_chain, inherit]
permissions:
  contents: write
  actions: write
concurrency:
  group: k9-production-state
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Assert isolated K9 tree
        shell: bash
        run: |
          set -euo pipefail
          test -f K9_CONTRACT.json
          test ! -e concept_agent
          test ! -e control
          test ! -e isolated_system4
      - name: Hard tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Bind orchestration mode without changing station logic
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUN_MODE" = "auto_chain" ] && [ "$BATCH_SIZE" != "1" ]; then
            echo 'K9_AUTO_CHAIN_REQUIRES_SERIAL_BATCH_SIZE_1'
            exit 2
          fi
          python3 k9_engine.py orchestration "$RUN_MODE" --source-run-id "$SOURCE_RUN_ID" | tee K9_ORCHESTRATION_RESULT.json
      - name: Prepare exact station job
        env:
          STATION: ${{ inputs.station }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: python3 k9_engine.py prepare "$STATION" "$BATCH_SIZE" --source-run-id "$SOURCE_RUN_ID" | tee K9_START_RESULT.json
      - name: Persist exact chat job
        if: ${{ inputs.station != 'check' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f runtime/CURRENT_JOB.json ]; then
            test -f runtime/CHAT_ENTRY.json
            git config user.name 'k9-station-bot'
            git config user.email 'actions@users.noreply.github.com'
            test -f state/STATUS.json
            git add -A -- runtime/CURRENT_JOB.json runtime/CHAT_ENTRY.json runtime/AUTO_CHAIN.json state/STATUS.json CURRENT_STATE.json
            git diff --cached --quiet || git commit -m 'K9: persist exact open station job'
            git push
          fi
      - name: Prepare exact LanguageTool 6.8 for machine check
        if: ${{ inputs.station == 'check' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f runtime/CURRENT_JOB.json ]; then exit 0; fi
          mkdir -p /tmp/k9-lt68
          curl --fail --location --retry 3 https://github.com/jxmorris12/language_tool_python/releases/download/LanguageTool-6.8/LanguageTool-6.8.zip -o /tmp/k9-lt68/LanguageTool-6.8.zip
          echo '6a7f6b67b779ae9505f7579f0c41453ea8d1bd72ae750bdc2c55ba974281467d  /tmp/k9-lt68/LanguageTool-6.8.zip' | sha256sum -c -
          unzip -q /tmp/k9-lt68/LanguageTool-6.8.zip -d /tmp/k9-lt68
          echo '2122882e800d312a0543d895c56c0a84a9bb131c9b9846efd8fc033129353ae8  /tmp/k9-lt68/LanguageTool-6.8/languagetool-commandline.jar' | sha256sum -c -
      - name: Run native K9 check and accept result
        id: transition
        if: ${{ inputs.station == 'check' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f runtime/CURRENT_JOB.json ]; then exit 0; fi
          python3 quality/k9_check.py runtime/CURRENT_JOB.json /tmp/k9-lt68/LanguageTool-6.8/languagetool-commandline.jar quality/PORTAL_PRODUCTION_MACHINE_V6.7.9.zip --output /tmp/K9_CHECK_SUBMISSION.json
          python3 k9_engine.py accept /tmp/K9_CHECK_SUBMISSION.json | tee K9_CHECK_ACCEPT_RESULT.json
          test ! -f runtime/CURRENT_JOB.json
          test ! -f runtime/CHAT_ENTRY.json
          read -r repair_required fully_done total < <(python3 - <<'PY'
          import json
          s=json.load(open('state/STATUS.json'))
          print(s.get('repair_required',0),s.get('fully_done',0),s.get('total',0))
          PY
          )
          if [ -f runtime/AUTO_CHAIN.json ]; then
            next_station=$(python3 k9_engine.py auto-next | tee K9_AUTO_NEXT_RESULT.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["next"])')
            case "$next_station" in
              finalize)
                touch runtime/FINALIZE_REQUIRED
                printf 'auto-finalize-from-green-check\n' > runtime/FINALIZE_TRIGGER
                ;;
              check)
                echo "next_check=1" >> "$GITHUB_OUTPUT"
                ;;
              research|write|repair)
                python3 k9_engine.py prepare "$next_station" 1 --source-run-id "${GITHUB_RUN_ID}-auto-chain" | tee K9_AUTO_STATION_START_RESULT.json
                test -f runtime/CURRENT_JOB.json
                test -f runtime/CHAT_ENTRY.json
                ;;
              *)
                echo "K9_AUTO_NEXT_INVALID:$next_station"
                exit 2
                ;;
            esac
          elif [ "$repair_required" -gt 0 ]; then
            python3 k9_engine.py prepare repair "$repair_required" --source-run-id "${GITHUB_RUN_ID}-auto-repair" | tee K9_REPAIR_START_RESULT.json
            test -f runtime/CURRENT_JOB.json
            test -f runtime/CHAT_ENTRY.json
          elif [ "$fully_done" -eq "$total" ] && [ "$total" -gt 0 ]; then
            touch runtime/FINALIZE_REQUIRED
            printf 'auto-finalize-from-green-check\n' > runtime/FINALIZE_TRIGGER
          else
            echo 'K9_CHECK_TERMINAL_STATE_INVALID'
            exit 2
          fi
          git config user.name 'k9-check-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A state runtime warehouse CURRENT_STATE.json
          git diff --cached --quiet || git commit -m 'K9: accept check and prepare deterministic next state'
          git push

      - name: Automatically continue native check inside auto-chain
        if: ${{ steps.transition.outputs.next_check == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body='{"ref":"konzept9/greenfield-20260929","inputs":{"station":"check","batch_size":"1","run_mode":"inherit"}}'
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hallo-netizen/affiliate-pferdeportal/actions/workflows/text-start-pferdeatelier.yml/dispatches \
            -d "$body"
          echo 'K9_AUTO_CHAIN_NATIVE_CHECK_DISPATCHED'
      - name: Automatically dispatch terminal finalizer after green check
        if: ${{ inputs.station == 'check' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f runtime/FINALIZE_TRIGGER ]; then
            echo 'K9_NO_FINALIZE_TRIGGER'
            exit 0
          fi
          body='{"ref":"konzept9/greenfield-20260929"}'
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hallo-netizen/affiliate-pferdeportal/actions/workflows/k9-finalize.yml/dispatches \
            -d "$body"
          echo 'K9_AUTO_FINALIZER_DISPATCHED'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: k9-station-ticket
          path: |
            K9_START_RESULT.json
            K9_CHECK_ACCEPT_RESULT.json
            runtime/CURRENT_JOB.json
            runtime/CHAT_ENTRY.json
          if-no-files-found: ignore

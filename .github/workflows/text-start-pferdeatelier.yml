name: Pferdeatelier text-start receiver

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Authorized text-start workflow run id
        required: true
        type: string
      source_issue_number:
        description: Authorized text-start issue number
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: pferdeatelier-text-start-receiver
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify central start proof
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ISSUE_NUMBER: ${{ inputs.source_issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          run_id = os.environ["SOURCE_RUN_ID"]
          issue = os.environ["SOURCE_ISSUE_NUMBER"]
          if not run_id.isdigit() or int(run_id) < 1:
              raise SystemExit("TEXT_START_SOURCE_RUN_ID_INVALID")
          if not issue.isdigit() or int(issue) < 1:
              raise SystemExit("TEXT_START_SOURCE_ISSUE_INVALID")

          def get(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "pferdeatelier-text-start-receiver",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as fh:
                  return json.load(fh)

          run = get(f"https://api.github.com/repos/hallo-netizen/text-start/actions/runs/{run_id}")
          if run.get("name") != "text-start door":
              raise SystemExit("TEXT_START_SOURCE_WORKFLOW_INVALID")
          if run.get("path") != ".github/workflows/text-start-door.yml":
              raise SystemExit("TEXT_START_SOURCE_WORKFLOW_PATH_INVALID")
          if run.get("event") != "issues" or run.get("head_branch") != "main":
              raise SystemExit("TEXT_START_SOURCE_EVENT_INVALID")
          if run.get("display_title") != "START:pferdeatelier":
              raise SystemExit("TEXT_START_SOURCE_TITLE_INVALID")
          if ((run.get("actor") or {}).get("login") != "hallo-netizen"
              or (run.get("triggering_actor") or {}).get("login") != "hallo-netizen"):
              raise SystemExit("TEXT_START_SOURCE_ACTOR_INVALID")
          if (run.get("repository") or {}).get("full_name") != "hallo-netizen/text-start":
              raise SystemExit("TEXT_START_SOURCE_REPOSITORY_INVALID")

          source_issue = get(
              f"https://api.github.com/repos/hallo-netizen/text-start/issues/{issue}"
          )
          if source_issue.get("title") != "START:pferdeatelier":
              raise SystemExit("TEXT_START_SOURCE_ISSUE_TITLE_INVALID")
          if (source_issue.get("user") or {}).get("login") != "hallo-netizen":
              raise SystemExit("TEXT_START_SOURCE_ISSUE_AUTHOR_INVALID")

          comments = get(
              f"https://api.github.com/repos/hallo-netizen/text-start/issues/{issue}/comments?per_page=100"
          )
          bot_bodies = [
              str(row.get("body") or "")
              for row in comments
              if (row.get("user") or {}).get("login") == "github-actions[bot]"
          ]
          authorized = f"START_AUTHORIZED: pferdeatelier\nRUN_ID: {run_id}"
          requested = f"TARGET_DISPATCH_REQUESTED: pferdeatelier\nSOURCE_RUN_ID: {run_id}"
          if authorized not in bot_bodies:
              raise SystemExit("TEXT_START_AUTHORIZATION_COMMENT_MISSING")
          if requested not in bot_bodies:
              raise SystemExit("TEXT_START_DISPATCH_COMMENT_MISSING")

          print("TEXT_START_SOURCE_PROOF_PASS")
          PY

      - name: Resolve current authoritative 1..N assignment
        id: current
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.error, urllib.request

          OWNER = "hallo-netizen"
          REPO = "affiliate-pferdeportal"
          BRANCH = "concept-agent/production-control"
          SOURCE_PATH = "concept_agent/current/PSERC_METADATA_SNAPSHOT.json"

          def request_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "pferdeatelier-current-assignment",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as fh:
                  return json.load(fh)

          branch = request_json(
              f"https://api.github.com/repos/{OWNER}/{REPO}/branches/{BRANCH.replace('/', '%2F')}"
          )
          head = str((branch.get("commit") or {}).get("sha") or "")
          if len(head) != 40:
              raise SystemExit("CURRENT_ASSIGNMENT_HEAD_INVALID")

          import subprocess
          main_head = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          if len(main_head) != 40:
              raise SystemExit("CURRENT_MAIN_HEAD_INVALID")

          def protected_tree(sha):
              tree = request_json(
                  f"https://api.github.com/repos/{OWNER}/{REPO}/git/trees/{sha}?recursive=1"
              )
              if tree.get("truncated") is True:
                  raise SystemExit("CURRENT_SOURCE_TREE_TRUNCATED")
              out = {}
              for row in tree.get("tree") or []:
                  if not isinstance(row, dict) or row.get("type") != "blob":
                      continue
                  path = str(row.get("path") or "")
                  if path == SOURCE_PATH:
                      continue
                  if path.startswith(".github/workflows/") or path.startswith("concept_agent/"):
                      out[path] = str(row.get("sha") or "")
              return out

          if protected_tree(head) != protected_tree(main_head):
              raise SystemExit("CURRENT_SOURCE_BRANCH_EXECUTABLE_DRIFT")

          raw_url = f"https://raw.githubusercontent.com/{OWNER}/{REPO}/{head}/{SOURCE_PATH}"
          req = urllib.request.Request(raw_url, headers={"User-Agent": "pferdeatelier-current-assignment"})
          with urllib.request.urlopen(req, timeout=20) as fh:
              raw = fh.read()
          if not raw:
              raise SystemExit("CURRENT_ASSIGNMENT_SNAPSHOT_EMPTY")
          pathlib.Path("CURRENT_PSER_METADATA_SNAPSHOT.json").write_bytes(raw)
          pathlib.Path("CURRENT_SOURCE_HEAD.txt").write_text(head + "\n", encoding="utf-8")
          pathlib.Path("CURRENT_SNAPSHOT_SHA256.txt").write_text(
              hashlib.sha256(raw).hexdigest() + "\n", encoding="utf-8"
          )
          PY

          python3 concept_agent/intake_bridge.py prepare             CURRENT_PSER_METADATA_SNAPSHOT.json             CONCEPT_AGENT_INTAKE.json             | tee CURRENT_INTAKE_RESULT.json

          python3 - <<'PY'
          import json, os, pathlib, re

          result = json.load(open("CURRENT_INTAKE_RESULT.json", encoding="utf-8"))
          intake = json.load(open("CONCEPT_AGENT_INTAKE.json", encoding="utf-8"))
          if result.get("status") != "CONCEPT_AGENT_INTAKE_READY":
              raise SystemExit("CURRENT_ASSIGNMENT_INTAKE_NOT_READY")
          if result.get("publish_allowed") is not False or intake.get("publish_allowed") is not False:
              raise SystemExit("CURRENT_ASSIGNMENT_PUBLISH_FLAG_INVALID")
          batch = str(result.get("batch_sha256") or "")
          count = result.get("item_count")
          if not re.fullmatch(r"[0-9a-f]{64}", batch):
              raise SystemExit("CURRENT_ASSIGNMENT_BATCH_SHA_INVALID")
          if not isinstance(count, int) or isinstance(count, bool) or count < 1:
              raise SystemExit("CURRENT_ASSIGNMENT_COUNT_INVALID")
          if intake.get("batch_sha256") != batch or intake.get("item_count") != count:
              raise SystemExit("CURRENT_ASSIGNMENT_INTAKE_IDENTITY_MISMATCH")

          head = pathlib.Path("CURRENT_SOURCE_HEAD.txt").read_text(encoding="utf-8").strip()
          snapshot_sha = pathlib.Path("CURRENT_SNAPSHOT_SHA256.txt").read_text(encoding="utf-8").strip()
          receipt = {
              "contract": "PFERDEATELIER_TEXT_START_CURRENT_1N_V1",
              "status": "PFERDEATELIER_CURRENT_INTAKE_READY_STOP",
              "current_source_branch": "concept-agent/production-control",
              "current_source_head": head,
              "current_source_path": "concept_agent/current/PSERC_METADATA_SNAPSHOT.json",
              "snapshot_sha256": snapshot_sha,
              "batch_sha256": batch,
              "item_count": count,
              "batch_count_policy": "CURRENT_1_TO_N_FROM_SNAPSHOT",
              "research_required": True,
              "article_content_rules_changed": False,
              "quality_rules_changed": False,
              "production_logic_changed": False,
              "publish_allowed": False,
          }
          pathlib.Path("PFERDEATELIER_START_RECEIPT.json").write_text(
              json.dumps(receipt, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("batch_sha256=" + batch + "\n")
              fh.write("item_count=" + str(count) + "\n")
              fh.write("current_source_head=" + head + "\n")
              fh.write("snapshot_sha256=" + snapshot_sha + "\n")
          print("CURRENT_1N_ASSIGNMENT_PASS:" + batch + ":COUNT=" + str(count))
          PY

      - name: Reserve current 1..N batch; retry allowed until machine ready
        id: claim
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ISSUE_NUMBER: ${{ inputs.source_issue_number }}
          BATCH_SHA256: ${{ steps.current.outputs.batch_sha256 }}
          ITEM_COUNT: ${{ steps.current.outputs.item_count }}
          CURRENT_SOURCE_HEAD: ${{ steps.current.outputs.current_source_head }}
        with:
          script: |
            const sourceRunId = String(process.env.SOURCE_RUN_ID || '');
            const sourceIssueNumber = String(process.env.SOURCE_ISSUE_NUMBER || '');
            const batch = String(process.env.BATCH_SHA256 || '');
            const itemCount = String(process.env.ITEM_COUNT || '');
            const currentSourceHead = String(process.env.CURRENT_SOURCE_HEAD || '');
            if (!/^[1-9][0-9]*$/.test(sourceRunId) || !/^[1-9][0-9]*$/.test(sourceIssueNumber)) {
              core.setFailed('TEXT_START_SOURCE_ID_INVALID');
              return;
            }
            if (!/^[0-9a-f]{64}$/.test(batch) || !/^[1-9][0-9]*$/.test(itemCount)) {
              core.setFailed('TEXT_START_CURRENT_ASSIGNMENT_INVALID');
              return;
            }

            const title = 'TEXT_START_BATCH_CLAIM:' + batch;
            const q = 'repo:' + context.repo.owner + '/' + context.repo.repo + ' in:title "' + title + '"';
            const found = await github.rest.search.issuesAndPullRequests({q, per_page: 100});
            const exact = found.data.items.filter(x => x.title === title);

            let claimIssue;
            if (exact.length > 1) {
              core.setFailed('TEXT_START_BATCH_CLAIM_AMBIGUOUS');
              return;
            }

            if (exact.length === 1) {
              claimIssue = exact[0];
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: claimIssue.number,
                  per_page: 100
                }
              );
              const ready = comments.some(row =>
                String(row.body || '').startsWith('TEXT_START_MACHINE_READY\n')
              );
              if (ready) {
                core.setFailed('TEXT_START_BATCH_ALREADY_READY');
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: claimIssue.number,
                body:
                  'TEXT_START_RETRY_RESERVED\n' +
                  'SOURCE_RUN_ID: ' + sourceRunId + '\n' +
                  'SOURCE_ISSUE_NUMBER: ' + sourceIssueNumber + '\n' +
                  'CURRENT_SOURCE_HEAD: ' + currentSourceHead + '\n' +
                  'ITEM_COUNT: ' + itemCount + '\n' +
                  'TARGET_ACTION_RUN_ID: ' + context.runId + '\n' +
                  'PUBLISH: NO'
              });
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body:
                  'SOURCE_REPOSITORY: hallo-netizen/text-start\n' +
                  'INITIAL_SOURCE_RUN_ID: ' + sourceRunId + '\n' +
                  'INITIAL_SOURCE_ISSUE_NUMBER: ' + sourceIssueNumber + '\n' +
                  'CURRENT_SOURCE_BRANCH: concept-agent/production-control\n' +
                  'CURRENT_SOURCE_HEAD: ' + currentSourceHead + '\n' +
                  'ITEM_COUNT: ' + itemCount + '\n' +
                  'STATUS: RESERVED_NOT_READY\n' +
                  'RETRY_POLICY: ALLOWED_UNTIL_MACHINE_READY\n' +
                  'PUBLISH: NO'
              });
              claimIssue = created.data;
            }

            core.setOutput('issue_number', String(claimIssue.number));

      - name: Upload current start handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pferdeatelier-start-${{ inputs.source_run_id }}
          path: |
            PFERDEATELIER_START_RECEIPT.json
            CURRENT_PSER_METADATA_SNAPSHOT.json
            CONCEPT_AGENT_INTAKE.json
          if-no-files-found: error
          retention-days: 30

      - name: Mark batch claim ready
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          CLAIM_ISSUE: ${{ steps.claim.outputs.issue_number }}
          BATCH_SHA256: ${{ steps.current.outputs.batch_sha256 }}
          ITEM_COUNT: ${{ steps.current.outputs.item_count }}
          CURRENT_SOURCE_HEAD: ${{ steps.current.outputs.current_source_head }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.CLAIM_ISSUE),
              body:
                'TEXT_START_MACHINE_READY\n' +
                'TARGET_ACTION_RUN_ID: ' + context.runId + '\n' +
                'SOURCE_RUN_ID: ' + '${{ inputs.source_run_id }}' + '\n' +
                'CURRENT_SOURCE_HEAD: ' + process.env.CURRENT_SOURCE_HEAD + '\n' +
                'BATCH_SHA256: ' + process.env.BATCH_SHA256 + '\n' +
                'ITEM_COUNT: ' + process.env.ITEM_COUNT + '\n' +
                'PUBLISH: NO'
            })

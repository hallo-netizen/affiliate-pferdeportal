name: Pferdeatelier text-start receiver

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Authorized text-start workflow run id
        required: true
        type: string
      source_issue_number:
        description: Authorized text-start issue number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pferdeatelier-text-start-receiver
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify central start proof
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ISSUE_NUMBER: ${{ inputs.source_issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          run_id = os.environ["SOURCE_RUN_ID"]
          issue = os.environ["SOURCE_ISSUE_NUMBER"]
          if not run_id.isdigit() or int(run_id) < 1:
              raise SystemExit("TEXT_START_SOURCE_RUN_ID_INVALID")
          if not issue.isdigit() or int(issue) < 1:
              raise SystemExit("TEXT_START_SOURCE_ISSUE_INVALID")

          def get(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "pferdeatelier-text-start-receiver",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as fh:
                  return json.load(fh)

          run = get(f"https://api.github.com/repos/hallo-netizen/text-start/actions/runs/{run_id}")
          if run.get("name") != "text-start door":
              raise SystemExit("TEXT_START_SOURCE_WORKFLOW_INVALID")
          if run.get("path") != ".github/workflows/text-start-door.yml":
              raise SystemExit("TEXT_START_SOURCE_WORKFLOW_PATH_INVALID")
          if run.get("event") != "issues" or run.get("head_branch") != "main":
              raise SystemExit("TEXT_START_SOURCE_EVENT_INVALID")
          if run.get("display_title") != "START:pferdeatelier":
              raise SystemExit("TEXT_START_SOURCE_TITLE_INVALID")
          if ((run.get("actor") or {}).get("login") != "hallo-netizen"
              or (run.get("triggering_actor") or {}).get("login") != "hallo-netizen"):
              raise SystemExit("TEXT_START_SOURCE_ACTOR_INVALID")
          repo = (run.get("repository") or {}).get("full_name")
          if repo != "hallo-netizen/text-start":
              raise SystemExit("TEXT_START_SOURCE_REPOSITORY_INVALID")

          source_issue = get(
              f"https://api.github.com/repos/hallo-netizen/text-start/issues/{issue}"
          )
          if source_issue.get("title") != "START:pferdeatelier":
              raise SystemExit("TEXT_START_SOURCE_ISSUE_TITLE_INVALID")
          if (source_issue.get("user") or {}).get("login") != "hallo-netizen":
              raise SystemExit("TEXT_START_SOURCE_ISSUE_AUTHOR_INVALID")

          comments = get(
              f"https://api.github.com/repos/hallo-netizen/text-start/issues/{issue}/comments?per_page=100"
          )
          bot_bodies = [
              str(row.get("body") or "")
              for row in comments
              if (row.get("user") or {}).get("login") == "github-actions[bot]"
          ]
          authorized = f"START_AUTHORIZED: pferdeatelier\nRUN_ID: {run_id}"
          requested = f"TARGET_DISPATCH_REQUESTED: pferdeatelier\nSOURCE_RUN_ID: {run_id}"
          if authorized not in bot_bodies:
              raise SystemExit("TEXT_START_AUTHORIZATION_COMMENT_MISSING")
          if requested not in bot_bodies:
              raise SystemExit("TEXT_START_DISPATCH_COMMENT_MISSING")

          print("TEXT_START_SOURCE_PROOF_PASS")
          PY

      - name: Materialize receiver authorization
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ISSUE_NUMBER: ${{ inputs.source_issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          auth = {
              "contract": "PFERDE_ATELIER_TEXT_START_AUTH_V1",
              "status": "PASS",
              "source_repository": "hallo-netizen/text-start",
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_issue_number": int(os.environ["SOURCE_ISSUE_NUMBER"]),
              "target_repository": "hallo-netizen/affiliate-pferdeportal",
              "target_ref": "main",
              "target_head_sha": head,
              "canonical_start_command": "python3 concept_agent/intake_bridge.py prepare concept_agent/current/PSERC_METADATA_SNAPSHOT.json CONCEPT_AGENT_INTAKE.json",
              "article_content_rules_changed": False,
              "quality_rules_changed": False,
              "production_logic_changed": False,
              "publish_allowed": False,
          }
          with open(".text-start-receiver-auth.json", "w", encoding="utf-8") as fh:
              json.dump(auth, fh, ensure_ascii=False, sort_keys=True)
              fh.write("\n")
          PY

      - name: Prepare current Concept Agent intake
        id: machine
        shell: bash
        run: |
          set -euo pipefail
          python3 concept_agent/intake_bridge.py prepare \
            concept_agent/current/PSERC_METADATA_SNAPSHOT.json \
            CONCEPT_AGENT_INTAKE.json | tee CONCEPT_AGENT_INTAKE_RECEIPT.json
          python3 - <<'PY'
          import json
          state=json.load(open("control/startmaster0107/CURRENT_STATE.json", encoding="utf-8"))
          current=state["concept_agent_current_batch"]
          receipt=json.load(open("CONCEPT_AGENT_INTAKE_RECEIPT.json", encoding="utf-8"))
          intake=json.load(open("CONCEPT_AGENT_INTAKE.json", encoding="utf-8"))
          if receipt.get("status") != "CONCEPT_AGENT_INTAKE_READY":
              raise SystemExit("TEXT_START_CONCEPT_AGENT_NOT_READY")
          if receipt.get("publish_allowed") is not False or intake.get("publish_allowed") is not False:
              raise SystemExit("TEXT_START_PUBLISH_FLAG_INVALID")
          if receipt.get("batch_sha256") != current.get("batch_sha256"):
              raise SystemExit("TEXT_START_BATCH_DRIFT")
          if receipt.get("item_count") != current.get("item_count"):
              raise SystemExit("TEXT_START_COUNT_DRIFT")
          if intake.get("batch_sha256") != current.get("batch_sha256"):
              raise SystemExit("TEXT_START_INTAKE_BATCH_DRIFT")
          if intake.get("item_count") != current.get("item_count"):
              raise SystemExit("TEXT_START_INTAKE_COUNT_DRIFT")
          PY

      - name: Bind current K7 production target
        id: k7
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          state=json.load(open("control/startmaster0107/CURRENT_STATE.json", encoding="utf-8"))
          action=state.get("next_action") or {}
          if action.get("goal") != "RUN_K7_FULL16_END_TO_END_FOUR_LANE_VALIDATION":
              raise SystemExit("TEXT_START_K7_CURRENT_ACTION_NOT_BOUND")
          head=str(action.get("execution_head_sha") or "")
          branch=str(action.get("execution_branch") or "")
          lanes=action.get("required_lanes")
          if len(head) != 40 or not branch or lanes != 4:
              raise SystemExit("TEXT_START_K7_EXECUTION_TARGET_INVALID")
          current=state.get("concept_agent_current_batch") or {}
          batch=str(current.get("batch_sha256") or "")
          research=str(current.get("research_binding_sha256") or "")
          if len(batch) != 64 or len(research) != 64:
              raise SystemExit("TEXT_START_K7_CURRENT_BINDING_INVALID")
          out=os.environ["GITHUB_OUTPUT"]
          with open(out,"a",encoding="utf-8") as fh:
              fh.write(f"head={head}\n")
              fh.write(f"branch={branch}\n")
              fh.write(f"lanes={lanes}\n")
              fh.write(f"batch={batch}\n")
              fh.write(f"research={research}\n")
          PY

      - name: Checkout bound K7 execution head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.k7.outputs.head }}
          path: k7-run
          fetch-depth: 1
          persist-credentials: false

      - name: Start bound K7 production
        env:
          K7_EXPECTED_HEAD: ${{ steps.k7.outputs.head }}
          K7_EXPECTED_BATCH: ${{ steps.k7.outputs.batch }}
          K7_EXPECTED_RESEARCH: ${{ steps.k7.outputs.research }}
          K7_LANES: ${{ steps.k7.outputs.lanes }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C k7-run rev-parse HEAD)" = "$K7_EXPECTED_HEAD"
          python3 - <<'PY'
          import json, os
          research=json.load(open("k7-run/concept_agent/current/CONCEPT_AGENT_RESEARCH_BOUND.json", encoding="utf-8"))
          if research.get("batch_sha256") != os.environ["K7_EXPECTED_BATCH"]:
              raise SystemExit("TEXT_START_K7_RESEARCH_BATCH_DRIFT")
          if research.get("research_binding_sha256") != os.environ["K7_EXPECTED_RESEARCH"]:
              raise SystemExit("TEXT_START_K7_RESEARCH_BINDING_DRIFT")
          PY
          python3 k7-run/concept_agent/konzept7/k7_start_controller.py \
            k7-run/concept_agent/current/PSERC_METADATA_SNAPSHOT.json \
            k7-run/concept_agent/current/CONCEPT_AGENT_RESEARCH_BOUND.json \
            K7_RUNTIME_STATE \
            "$K7_LANES" 1 | tee K7_START_RECEIPT.json
          python3 - <<'PY'
          import json
          receipt=json.load(open("K7_START_RECEIPT.json", encoding="utf-8"))
          actions=receipt.get("ready_actions")
          if receipt.get("stage") != "ARTICLE_PRODUCTION":
              raise SystemExit("TEXT_START_K7_PRODUCTION_NOT_STARTED")
          if receipt.get("publish_allowed") is not False:
              raise SystemExit("TEXT_START_K7_PUBLISH_FLAG_INVALID")
          if receipt.get("execution_lock_status") not in {"CREATED","RESUME_EXISTING"}:
              raise SystemExit("TEXT_START_K7_EXECUTION_LOCK_INVALID")
          if not isinstance(actions,list) or len(actions) != 4:
              raise SystemExit("TEXT_START_K7_FOUR_LANES_NOT_READY")
          if [row.get("lane") for row in actions] != [0,1,2,3]:
              raise SystemExit("TEXT_START_K7_LANES_INVALID")
          if any(row.get("action") != "WRITE_DRAFT" for row in actions):
              raise SystemExit("TEXT_START_K7_WRITE_DRAFT_NOT_READY")
          print("TEXT_START_K7_PRODUCTION_STARTED")
          PY

      - name: Upload current intake and K7 production handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pferdeatelier-start-${{ inputs.source_run_id }}
          path: |
            CONCEPT_AGENT_INTAKE_RECEIPT.json
            CONCEPT_AGENT_INTAKE.json
            K7_START_RECEIPT.json
            K7_RUNTIME_STATE/**
          if-no-files-found: error
          retention-days: 30

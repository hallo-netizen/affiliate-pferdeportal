name: Pferdeatelier text-start receiver

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Authorized text-start workflow run id
        required: true
        type: string
      source_issue_number:
        description: Authorized text-start issue number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pferdeatelier-text-start-receiver
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Start current bound Concept Agent intake
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ISSUE_NUMBER: ${{ inputs.source_issue_number }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          run_id = os.environ["SOURCE_RUN_ID"]
          issue_number = os.environ["SOURCE_ISSUE_NUMBER"]
          if not run_id.isdigit() or int(run_id) < 1:
              raise SystemExit("TEXT_START_SOURCE_RUN_ID_INVALID")
          if not issue_number.isdigit() or int(issue_number) < 1:
              raise SystemExit("TEXT_START_SOURCE_ISSUE_INVALID")

          state_path = Path("control/startmaster0107/CURRENT_STATE.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          current = state.get("concept_agent_current_batch") or {}

          if current.get("current_authority_ref") != "control/startmaster0107/CURRENT_STATE.json":
              raise SystemExit("TEXT_START_CURRENT_AUTHORITY_INVALID")
          if current.get("current_authority_branch") != "main":
              raise SystemExit("TEXT_START_CURRENT_BRANCH_INVALID")
          if current.get("publish_allowed") is not False:
              raise SystemExit("TEXT_START_PUBLISH_NOT_FALSE")

          snapshot_ref = current.get("metadata_snapshot_ref")
          if snapshot_ref != "concept_agent/current/PSERC_METADATA_SNAPSHOT.json":
              raise SystemExit("TEXT_START_CURRENT_SNAPSHOT_REF_INVALID")

          snapshot_path = Path(snapshot_ref)
          snapshot_raw = snapshot_path.read_bytes()
          snapshot_sha = hashlib.sha256(snapshot_raw).hexdigest()
          if snapshot_sha != current.get("metadata_snapshot_sha256"):
              raise SystemExit("TEXT_START_CURRENT_SNAPSHOT_HASH_MISMATCH")

          snapshot = json.loads(snapshot_raw)
          batch = snapshot.get("next_textmachine_metadata_batch") or {}
          items = batch.get("items")
          if (
              batch.get("contract") != "PSERC_TEXTMACHINE_METADATA_BATCH_V2"
              or batch.get("status") != "READY_FOR_TEXTMACHINE_METADATA_INTAKE"
              or batch.get("publish_allowed") is not False
              or not isinstance(items, list)
              or batch.get("item_count") != len(items)
              or len(items) < 1
              or batch.get("batch_sha256") != current.get("batch_sha256")
              or batch.get("item_count") != current.get("item_count")
          ):
              raise SystemExit("TEXT_START_CURRENT_BATCH_INVALID")

          print("TEXT_START_BOUND_BATCH_PASS")
          PY

          python3 concept_agent/intake_bridge.py prepare             concept_agent/current/PSERC_METADATA_SNAPSHOT.json             /tmp/CONCEPT_AGENT_INTAKE.json             | tee /tmp/CONCEPT_AGENT_INTAKE_RECEIPT.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("control/startmaster0107/CURRENT_STATE.json").read_text(encoding="utf-8"))
          current = state["concept_agent_current_batch"]
          receipt = json.loads(Path("/tmp/CONCEPT_AGENT_INTAKE_RECEIPT.json").read_text(encoding="utf-8"))
          intake = json.loads(Path("/tmp/CONCEPT_AGENT_INTAKE.json").read_text(encoding="utf-8"))

          if receipt.get("status") != "CONCEPT_AGENT_INTAKE_READY":
              raise SystemExit("TEXT_START_CONCEPT_AGENT_NOT_READY")
          if receipt.get("batch_sha256") != current.get("batch_sha256"):
              raise SystemExit("TEXT_START_BATCH_DRIFT")
          if receipt.get("item_count") != current.get("item_count"):
              raise SystemExit("TEXT_START_COUNT_DRIFT")
          if intake.get("publish_allowed") is not False:
              raise SystemExit("TEXT_START_PUBLISH_FLAG_INVALID")

          print("TEXT_START_BUTTON_ONLY_PASS")
          print("CONCEPT_AGENT_INTAKE_READY")
          PY

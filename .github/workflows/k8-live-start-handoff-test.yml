name: K8 Live Start Handoff Test
on:
  push:
    branches:
      - k8-verbot-live-behind-existing-start-20260928
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: K8 live handoff tests
        run: python3 -m unittest -v concept_agent.konzept8_verbot.test_live_start_handoff
      - name: Existing production guard parity against untouched main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          set +e
          python3 -m unittest -v concept_agent/tests/test_current_production_guards.py > /tmp/work.log 2>&1
          work_rc=$?
          set -e
          rm -rf /tmp/base-main
          git worktree add --detach /tmp/base-main origin/main
          set +e
          (cd /tmp/base-main && python3 -m unittest -v concept_agent/tests/test_current_production_guards.py) > /tmp/base.log 2>&1
          base_rc=$?
          set -e
          python3 - <<'PY'
          import re
          def fails(path):
              text=open(path,encoding="utf-8").read()
              names=re.findall(r'^(?:FAIL|ERROR): (test_[^ ]+)',text,re.M)
              return sorted(names)
          w=fails('/tmp/work.log')
          b=fails('/tmp/base.log')
          print('WORK_FAILURES',w)
          print('BASE_FAILURES',b)
          if w != b:
              raise SystemExit('K8_ADDED_OR_REMOVED_EXISTING_GUARD_FAILURE')
          print('K8_EXISTING_GUARD_PARITY_PASS')
          PY

name: K8 Live Start Handoff Test
on:
  push:
    branches:
      - k8-verbot-live-behind-existing-start-20260928
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: K8 live handoff tests
        run: python3 -m unittest -v concept_agent.konzept8_verbot.test_live_start_handoff
      - name: Existing production guard regression
        run: python3 -m unittest -v concept_agent/tests/test_current_production_guards.py
      - name: Existing K7 optimization regression
        run: python3 -m unittest -v concept_agent.konzept7.test_k7_optimizations

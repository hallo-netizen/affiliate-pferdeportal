name: System4A temp cloud CI fixture fix
on:
  push:
    branches:
      - 'hobbyroom/system4a-repair-only-20260917'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix current-next bundle fixture closure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('control/cloud-entry-gate/cloud_repo_ci_test.py')
          text=p.read_text(encoding='utf-8')
          old="""    nb = bundle.get('next_binding')\n    if isinstance(nb, dict) and isinstance(nb.get('bundle_ref'), str):\n        refs.append(nb['bundle_ref'])\n"""
          new="""    nb = bundle.get('next_binding')\n    if isinstance(nb, dict) and isinstance(nb.get('bundle_ref'), str):\n        next_rel = nb['bundle_ref']\n        refs.append(next_rel)\n        next_bundle = json.loads((REPO / next_rel).read_text())\n        for row in next_bundle.get('authorized_inputs') or []:\n            if isinstance(row, dict) and isinstance(row.get('ref'), str):\n                refs.append(row['ref'])\n"""
          if old not in text:
              raise SystemExit('EXPECTED_SNIPPET_MISSING')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          python control/cloud-entry-gate/cloud_repo_ci_test.py
          git config user.name 'hallo-netizen'
          git config user.email 'hallo@oliver-beil.de'
          git add control/cloud-entry-gate/cloud_repo_ci_test.py
          git commit -m 'test(cloud-entry): copy next-step authorized inputs'
          git push origin HEAD:hobbyroom/system4a-repair-only-20260917

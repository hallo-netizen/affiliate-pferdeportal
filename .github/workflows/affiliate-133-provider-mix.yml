name: Affiliate 133 generic provider mix proof

on:
  push:
    branches: [affiliate-e2e-repro-20260920]
    paths:
      - '.github/workflows/affiliate-133-provider-mix.yml'
      - 'e2e/build_v133.py'
      - 'e2e/provider_mix_v133_probe.php'
      - 'e2e/saturday96_selection_compare.php'
  workflow_dispatch:

jobs:
  provider-mix-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Build exact 6.72.133 from proven 132 chain
        run: |
          set -euo pipefail
          rm -rf /tmp/base130 /tmp/candidate132 /tmp/candidate133
          mkdir -p /tmp/base130 /tmp/candidate132
          unzip -q e2e/fixtures/AFFILIATE_ZENTRALE_V6.72.130_EXACT.zip -d /tmp/base130
          cp -a /tmp/base130/affiliate-portal-router /tmp/candidate132/
          base64 --decode e2e/fixtures/aff043_into_130.patch.gz.b64 | gzip -dc >/tmp/aff043.patch
          (cd /tmp/candidate132/affiliate-portal-router && patch -p5 </tmp/aff043.patch)
          mkdir -p /tmp/candidate132/affiliate-portal-router/recovery
          base64 --decode e2e/fixtures/aff043-historical-product-state-20260915.json.gz.b64 | gzip -dc > /tmp/candidate132/affiliate-portal-router/recovery/aff043-historical-product-state-20260915.json
          sed -i "s/Version: 6.72.130/Version: 6.72.131/" /tmp/candidate132/affiliate-portal-router/pferdeportal-affiliate-router.php
          sed -i "s/const VERSION = '6.72.130';/const VERSION = '6.72.131';/" /tmp/candidate132/affiliate-portal-router/pferdeportal-affiliate-router.php
          sed -i '1s/^V6\.72\.130 /V6.72.131 /' /tmp/candidate132/affiliate-portal-router/readme.txt
          python3 e2e/build_v132.py
          cp -a /tmp/candidate132 /tmp/candidate133
          python3 e2e/build_v133.py
          php -l /tmp/candidate133/affiliate-portal-router/pferdeportal-affiliate-router.php
          grep -q "Version: 6.72.133" /tmp/candidate133/affiliate-portal-router/pferdeportal-affiliate-router.php
          grep -q "category_product_provider_mix_v672133" /tmp/candidate133/affiliate-portal-router/pferdeportal-affiliate-router.php
          test "$(sha256sum /tmp/candidate132/affiliate-portal-router/assets/frontend.css | cut -d' ' -f1)" = "$(sha256sum /tmp/candidate133/affiliate-portal-router/assets/frontend.css | cut -d' ' -f1)"
          test "$(sha256sum /tmp/candidate132/affiliate-portal-router/assets/frontend.js | cut -d' ' -f1)" = "$(sha256sum /tmp/candidate133/affiliate-portal-router/assets/frontend.js | cut -d' ' -f1)"
          echo BUILD_133_PASS

      - name: Install WordPress and candidate
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          rm -rf /tmp/wp && mkdir /tmp/wp
          wp core download --version=7.1 --path=/tmp/wp
          wp config create --path=/tmp/wp --dbname=wordpress --dbuser=wp --dbpass=wp --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path=/tmp/wp --url=https://pferde-atelier.de --title=Mix133 --admin_user=admin --admin_password=e2etest --admin_email=e2e@example.test
          cp -a /tmp/candidate133/affiliate-portal-router /tmp/wp/wp-content/plugins/
          wp plugin activate affiliate-portal-router --path=/tmp/wp

      - name: Provider-neutral positive negative future-provider contract
        run: |
          set -euo pipefail
          wp eval-file "$GITHUB_WORKSPACE/e2e/provider_mix_v133_probe.php" --path=/tmp/wp | tee /tmp/provider-mix.log
          grep -Fx 'GENERIC_PROVIDER_MIX_PASS' /tmp/provider-mix.log
          echo GENERIC_CONTRACT_PASS

      - name: Seed historical inventory and restore known state
        env:
          AFF_E2E_FIXTURE: ${{ github.workspace }}/e2e/fixtures/real-wxr-product-campaigns-20260915.json.gz
          AFF_E2E_SCENARIO: live_damage
        run: |
          set -euo pipefail
          wp eval-file "$GITHUB_WORKSPACE/e2e/seed_real_state_inner.php" --path=/tmp/wp | tee /tmp/seed.log
          grep -Fx 'SEEDED_CAMPAIGNS=2012' /tmp/seed.log
          rm -f /tmp/aff-history-stop
          wp eval-file "$GITHUB_WORKSPACE/e2e/run_scenario.php" --path=/tmp/wp
          wp option update ppar_ebay_deletion_token_v1 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef1234567890' --path=/tmp/wp >/dev/null
          wp option update ppar_ebay_deletion_state_v1 '{"challenge_answered_at":1700000000,"last_notification_at":1700000001,"last_notification_status":"verified","last_notification_hash":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","last_deleted_items":0,"last_deleted_creatives":0,"last_deleted_outputs":0,"last_error":""}' --format=json --path=/tmp/wp >/dev/null
          wp eval '
            $e=get_option("ppar_network_ebay_v1",array());$e=is_array($e)?$e:array();$e["enabled"]=0;update_option("ppar_network_ebay_v1",$e,false);
            $a=get_option("ppar_provider_access_state_v1",array());$a=is_array($a)?$a:array();$a["ebay"]=array("status"=>"credentials_saved","last_checked"=>time(),"message"=>"eBay Production wurde bis zur vollständigen Marketplace-Account-Deletion-Compliance hart deaktiviert.","updated_at"=>time());update_option("ppar_provider_access_state_v1",$a,false);
          ' --path=/tmp/wp
          wp eval 'echo "TRIGGER_AUTO_RESTORE\n";' --path=/tmp/wp
          wp option get ppar_aff043_historical_product_state_restore_v1 --format=json --path=/tmp/wp | tee /tmp/aff043-state.json
          grep -q '"status":"complete"' /tmp/aff043-state.json

      - name: Prove real historical three-card provider mix and relevance
        run: |
          set -euo pipefail
          wp eval-file "$GITHUB_WORKSPACE/e2e/history_probe.php" --path=/tmp/wp | tee /tmp/history.log
          grep -Fx 'HISTORY_PROBE_PASS' /tmp/history.log
          grep -Fx 'HISTORY_IDEALO_MODE=automatic' /tmp/history.log
          grep -Fx 'HISTORY_EBAY_CONTROL=PASS' /tmp/history.log
          grep -q '"slot":"category_product_1","post_id":15921,"provider":"ebay"' /tmp/history.log
          grep -q '"slot":"category_product_2".*"provider":"idealo"' /tmp/history.log
          grep -q '"slot":"category_product_3","post_id":15986,"provider":"ebay"' /tmp/history.log
          echo REAL_PROVIDER_MIX_PASS

      - name: Compare Saturday 6.72.96 selection path against 6.72.133
        run: |
          set -euo pipefail
          wp eval-file "$GITHUB_WORKSPACE/e2e/saturday96_selection_compare.php" --path=/tmp/wp | tee /tmp/saturday96-compare.log
          cat /tmp/saturday96-compare.log

      - name: Fresh package and protected frontend
        run: |
          set -euo pipefail
          cd /tmp/candidate133
          zip -qr /tmp/AFFILIATE_ZENTRALE_V6.72.133_GENERIC_PROVIDER_MIX_HARDTEST.zip affiliate-portal-router
          unzip -tq /tmp/AFFILIATE_ZENTRALE_V6.72.133_GENERIC_PROVIDER_MIX_HARDTEST.zip >/dev/null
          sha256sum /tmp/AFFILIATE_ZENTRALE_V6.72.133_GENERIC_PROVIDER_MIX_HARDTEST.zip
          sha256sum affiliate-portal-router/assets/frontend.css affiliate-portal-router/assets/frontend.js
          echo V133_FULL_PASS

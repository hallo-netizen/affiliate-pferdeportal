name: Raw public Hab und Bewahr site and sitemap verification
on:
  push:
    branches:
      - hobbyroom/hab-public-response-proof-20261103
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact public site response, headers and raw XML snippet
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error
          for site in ["https://hab-und-bewahr.de","https://www.hab-und-bewahr.de"]:
            for p in ["/", "/sitemap_index.xml", "/robots.txt","/wp-sitemap.xml"]:
              print("===== URL =====",site+p,flush=True)
              try:
                req=urllib.request.Request(site+p,headers={"User-Agent":"Mozilla/5.0"})
                with urllib.request.urlopen(req, timeout=15) as r:
                  data=r.read(3500)
                  print("HTTP",r.status,"FINAL",r.url,"CTYPE",r.headers.get("content-type"),"SIZE_HEAD",len(data),"XROBOT",r.headers.get("X-Robots-Tag"))
                  print("RAW_START",repr(data[:1250]))
              except Exception as e:
                print("ERROR",type(e).__name__,str(e))
          PY

# Recheck after public maintenance mode was lifted.

      - name: Verify seven missing homepage target HTTP robots and canonical
        run: |
          python3 - <<'PY'
          import urllib.request,re,html
          paths=[
            "/category/einbruch-und-abwesenheit-und-le-ferienhaus-einbruchschutz-15/",
            "/category/einbruch-und-freizeit-und-mobil-boot-aussenborder-und-tra-10/",
            "/category/einbruch-und-garten-und-grundst-gartenhaus-schrebergarten-12/",
            "/category/einbruch-und-haus-und-wohnung-wertsachen-und-tresore-4/",
            "/category/feuer-und-gase-akku-und-elektrik-garage-und-private-wer-131/",
            "/glossar/","/listing/","/einbruch-und-diebstahl/","/dienstleister/"
          ]
          root="https://hab-und-bewahr.de"
          for p in paths:
            req=urllib.request.Request(root+p,headers={"User-Agent":"Mozilla/5.0"})
            try:
              with urllib.request.urlopen(req,timeout=12) as r:
                doc=r.read(500000).decode("utf8","replace")
                robo=re.findall(r'<meta\s+[^>]*name=[\x22\x27]robots[\x22\x27][^>]*>',doc,re.I)
                canon=re.findall(r'<link\s+[^>]*rel=[\x22\x27]canonical[\x22\x27][^>]*>',doc,re.I)
                title=re.findall(r'<title[^>]*>(.*?)</title>',doc,re.I|re.S)
                print("MISSING_TARGET",p,"HTTP",r.status,"FINAL",r.url,"ROBOTS",robo[:3],"X-ROBOTS",r.headers.get("X-Robots-Tag"),"CANONICAL",canon[:2],"TITLE",title[:2],flush=True)
            except Exception as e:
              print("MISSING_TARGET",p,"ERROR",type(e).__name__,str(e),flush=True)
          PY

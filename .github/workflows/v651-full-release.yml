name: V6.51 full safe checkpoint clean restart release gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  v651-release:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'v651-safe-checkpoint-restart-20260822'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    services:
      mariadb:
        image: mariadb:11.4
        ports:
          - 3306:3306
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: v651gate
          MARIADB_USER: wp
          MARIADB_PASSWORD: wppass
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uwp -pwppass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout V6.51 branch
        uses: actions/checkout@v4

      - name: Set up PHP 8.4 with mysqli and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          tools: wp-cli
          coverage: none

      - name: Materialize exact audited predecessor harnesses
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '2686b0712fe7d100d52e183bae31a1da682e356f8bab7cfed93dc47e6a977e7d  .github/v647/V647_GATE_BUNDLE.zip.b64.00' \
            '6e081fded84b0b7afa71f1cf72140d73d24608af3391703a490906ce59495c71  .github/v647/V647_GATE_BUNDLE.zip.b64.01' \
            '882920a1b75680de11db95f7b78203e26ece3c57d17eb700a0fc9330aed64ba7  .github/v647/V647_GATE_BUNDLE.zip.b64.02' \
            'da4e70b804c7cb64e815234088f71f4f947e69ee144134575cb62bb085920bd1  .github/v647/V647_GATE_BUNDLE.zip.b64.03' \
            '59d8d205624982f3cce9d2edbc0fba0e60741a2a69fac99f2baca7a507eb9d24  .github/v647/V647_GATE_BUNDLE.zip.b64.04' \
            '1d4577320aee0d93f6abf67081d365dbedadcd9c0623c8ebb0baef2aff5e2a6c  .github/v647/V647_GATE_BUNDLE.zip.b64.05' | sha256sum -c -
          cat .github/v647/V647_GATE_BUNDLE.zip.b64.0{0,1,2,3,4,5} >/tmp/v647.b64
          base64 -d /tmp/v647.b64 >/tmp/v647.zip
          echo '4c8d7efbf244132a2fbf83e078f9975baa32347fee248f8732590aa0c6143133  /tmp/v647.zip' | sha256sum -c -
          rm -rf /tmp/v647-harness && mkdir -p /tmp/v647-harness
          unzip -q /tmp/v647.zip -d /tmp/v647-harness

          printf '%s\n' \
            '78b43f70af7ebfffa847dbbe974f02d373455ae3d98b1502f30bf88e3cfd4676  .github/v648/V648_GATE_BUNDLE.zip.b64.00' \
            'efdede60317af3aa4347e77aee1db9a0c57ea76765590f49d69fe2a43e4fee81  .github/v648/V648_GATE_BUNDLE.zip.b64.01' \
            'b4534a015de06be91dead4a7ef886a92aa6bdf62d7f321e670a69a32503e6a83  .github/v648/V648_GATE_BUNDLE.zip.b64.02' \
            '1532bc903cb09a24b55ab7c6f1066bbe792166721fbe990ea5e1c879e490bb45  .github/v648/V648_GATE_BUNDLE.zip.b64.03' \
            '13f9f6b6ca41d297ec8c82c7bf6f7ef72fa76b683033a2248131c534bd914d15  .github/v648/V648_GATE_BUNDLE.zip.b64.04' \
            'a6d02785b2a4413a30247844026c2239c140e90358740da23a5520654f5c1289  .github/v648/V648_GATE_BUNDLE.zip.b64.05' \
            '726f3fb3d3a73f7d443774d2ee16f8a0fee17a03ff7e60056595d4060f238539  .github/v648/V648_GATE_BUNDLE.zip.b64.06' | sha256sum -c -
          cat .github/v648/V648_GATE_BUNDLE.zip.b64.0{0,1,2,3,4,5,6} >/tmp/v648.b64
          base64 -d /tmp/v648.b64 >/tmp/v648.zip
          echo '51f32a5016ee2cd0ffb5144cf41f724ec3d552d1ed2e2c4fc0620b1682916481  /tmp/v648.zip' | sha256sum -c -
          rm -rf /tmp/v648-harness && mkdir -p /tmp/v648-harness
          unzip -q /tmp/v648.zip -d /tmp/v648-harness

          cat \
            .github/v649/V649_GATE_BUNDLE.zip.part.0{0,1,2,3,4,5,6} \
            .github/v649/V649_GATE_BUNDLE.b64.tail.0{0,1,2,3,4,5} \
            .github/v649/V649_GATE_BUNDLE.b64.tail.06{a,b} \
            .github/v649/V649_GATE_BUNDLE.b64.tail.07{a,b} \
            .github/v649/V649_GATE_BUNDLE.b64.tail.08a \
            .github/v649/V649_GATE_BUNDLE.b64.tail.08b{0,1} \
            .github/v649/V649_GATE_BUNDLE.b64.tail.09a{0,1} \
            .github/v649/V649_GATE_BUNDLE.b64.tail.09b{0,1} > /tmp/v649.b64
          test "$(wc -c < /tmp/v649.b64 | tr -d ' ')" = '47872'
          base64 -d /tmp/v649.b64 >/tmp/v649.zip
          echo 'c17e47d04f71b3c4ab2a72d11e4ff271f77074329b8ecca384b5daf12907b357  /tmp/v649.zip' | sha256sum -c -
          rm -rf /tmp/v649-harness && mkdir -p /tmp/v649-harness
          unzip -q /tmp/v649.zip -d /tmp/v649-harness

          test -f CODEX_V645_REALGATE_SOURCE_AND_EXACT_TASK_20260820.zip
          echo '6695085486f38680a203c31e0b5408aee378c907a31ce65204f88ab38b9fbbf4  CODEX_V645_REALGATE_SOURCE_AND_EXACT_TASK_20260820.zip' | sha256sum -c -

      - name: Materialize exact V6.50 hard-gate sources
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v650/V650_GATE_BUNDLE.zip.b64.{00,01,02,03,04,05,06,07,08,09,10} > /tmp/v650-gate.transport.b64
          tr -d '\r\n\t ' < /tmp/v650-gate.transport.b64 > /tmp/v650-gate.b64
          base64 -d /tmp/v650-gate.b64 > /tmp/v650-gate.zip
          echo '733826b1e45b689dc8fb0bf9880724c18ab849c5b863aa8f80443a149a5c4311  /tmp/v650-gate.zip' | sha256sum -c -
          unzip -t /tmp/v650-gate.zip >/dev/null
          unzip -qo /tmp/v650-gate.zip -d "$GITHUB_WORKSPACE"

      - name: Materialize and verify V6.51 hard gate
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '17180fa2261fc099907e1a17e0ecc3cbfe90a036686de4c2214f7f7c60a3d13d  .github/v651/V651_GATE_BUNDLE.zip.b64.00' \
            '2a49aef204024cfaeea1dffd4fdd1b98dac614d1bc7fd15237a0680f145eff54  .github/v651/V651_GATE_BUNDLE.zip.b64.01' \
            'b966ff3308fb133c47923a9a22ebc5c6e1b1e5440b8b0ef02b903df7624bc104  .github/v651/V651_GATE_BUNDLE.zip.b64.02' \
            '4a998a3a13f26d5174832fd3daaa1da76f58afdcd112bc1cf7d32ec5768c391a  .github/v651/V651_GATE_BUNDLE.zip.b64.03' \
            '88aaa5ad05afafb96151bf6e2c03c367181742a3fcf76bf70d9cde99e71e2d73  .github/v651/V651_GATE_BUNDLE.zip.b64.04' \
            '36f422632170b9f75c8eb161869083b8d6f0dc7403900ea2ca43a05fb2be9d0e  .github/v651/V651_GATE_BUNDLE.zip.b64.05' \
            '550cd056d918fa96c7a4e6bbc9136d6877b8daafc8705790f1e6428b77b3aece  .github/v651/V651_GATE_BUNDLE.zip.b64.06' \
            'c12dbe4e631b4df1e82d952ff039ad1dab9f658ad2aa40bfaa902a325a6876fc  .github/v651/V651_GATE_BUNDLE.zip.b64.07' \
            '69dbb940d947ea8da4b94aaa79b78d10c4fbe32ff6be89b2e13c4db87539b0de  .github/v651/V651_GATE_BUNDLE.zip.b64.08' \
            '1be2c37f97126b384f42fa8ebd5cfc8b28a5449ce5aebc599415f7091cf39b60  .github/v651/V651_GATE_BUNDLE.zip.b64.09' | sha256sum -c -
          cat .github/v651/V651_GATE_BUNDLE.zip.b64.{00,01,02,03,04,05,06,07,08,09} > /tmp/v651-gate.b64
          echo '13195e1bf8a3b2b9dabb385ab7019ffdbd0aeac0c183c41c5282c282deb05559  /tmp/v651-gate.b64' | sha256sum -c -
          base64 -d /tmp/v651-gate.b64 > /tmp/v651-gate.zip
          echo 'c79a619311f2d2bfabb7c83a1d3777eb08f1eab991f16046ff1c1fc47bb74ed0  /tmp/v651-gate.zip' | sha256sum -c -
          unzip -t /tmp/v651-gate.zip >/dev/null
          unzip -qo /tmp/v651-gate.zip -d "$GITHUB_WORKSPACE"
          printf '%s\n' \
            'dda02fff586fafe396e9d903f4288893b6f1fda63d93a18452604abf6bb9f2ac  .github/v651_gate/HARTER_TECHNISCHER_UMBAUVERTRAG_CHECKPOINT_NEUSTART.md' \
            '9009ceb9c212816d377923291d7d15010f3e7dae63b8c6c0ccfeeda7883b9bf4  .github/v651_gate/01_checkpoint_restart.patch' \
            '22bdd8e730332439f344e06ff762d9327c2a195aa2181ec46cdbd20a1cdd15b9  .github/v651_gate/STEP1_SOURCE_SHA256.txt' \
            '54b20ccfc40dd77b7d653b88777262d8353713c098b584323fc149e42b767ea4  .github/v651_gate/test_architecture_v651.php' \
            'ee5a851f241346c7deee8713dfe0860a453687f677d59b58d449b71fe5bdf02d  .github/v651_gate/test_canonical_checkpoint_restart_e2e_v651.php' \
            '9e4ab9bdde0cbfa74461a7cfdb93e17426fe4f5c78aee685eac6355b470941e9  .github/v651_gate/test_checkpoint_bootstrap_failclosed_v651.php' \
            'ef34d7031a8ce6eb2bc1c303fc11bed73126f485a9166d72f87d4e456dedfbf5  .github/v651_gate/checkpoint_restart_contract_v651.php' \
            '2edd71ab5ded5042421c4f6b48f3c832e3b2942e6cef0ae52fa9e9414aa7b1d7  .github/v651_gate/run-v651-full-release.sh' | sha256sum -c -
          php -l .github/v651_gate/test_architecture_v651.php
          php -l .github/v651_gate/test_canonical_checkpoint_restart_e2e_v651.php
          php -l .github/v651_gate/test_checkpoint_bootstrap_failclosed_v651.php
          php -l .github/v651_gate/checkpoint_restart_contract_v651.php
          bash -n .github/v651_gate/run-v651-full-release.sh

      - name: Execute complete V6.51 release gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x .github/v651_gate/run-v651-full-release.sh
          .github/v651_gate/run-v651-full-release.sh

      - name: Upload final verified V6.51 release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V651_FINAL_VERIFIED_RELEASE
          path: |
            affiliate-zentrale_v6.51.0_SAFE_CHECKPOINT_RESTART_REALGATE.zip
            MASTER_AFFILIATE_ZENTRALE_V6_51_0_SAFE_CHECKPOINT_RESTART_REALGATE_20260822.zip
            V651_RELEASE_EVIDENCE/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Upload blocked V6.51 evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V651_BLOCKED_EVIDENCE
          path: V651_RELEASE_EVIDENCE/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

name: V6.45 final release verification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v645-final-release-verification.yml'
      - '.github/scripts/build-verify-v645-release.sh'
      - '.github/scripts/verify-v645-full-evidence.sh'
      - '.github/scripts/run-v645-realgate-ci.sh'
      - '.github/overlays/v645/soft_failure_recovery.php'
      - 'CODEX_V645_REALGATE_SOURCE_AND_EXACT_TASK_20260820.zip'

permissions:
  contents: read

jobs:
  final-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: v645gate
          MARIADB_USER: wp
          MARIADB_PASSWORD: wppass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uwp -pwppass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Set up PHP 8.4 with mysqli and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          tools: wp-cli
          coverage: none

      - name: Prebuild gate, build, final ZIP re-test, master verification
        shell: bash
        run: |
          chmod +x .github/scripts/run-v645-realgate-ci.sh .github/scripts/verify-v645-full-evidence.sh .github/scripts/build-verify-v645-release.sh
          .github/scripts/build-verify-v645-release.sh

      - name: Upload final verified release artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V645_FINAL_VERIFIED_RELEASE
          path: |
            affiliate-zentrale_v6.45.0_CANONICAL_RUN_PERSISTENCE_RACE_ROOTFIX_REALGATE.zip
            MASTER_AFFILIATE_ZENTRALE_V6_45_0_CANONICAL_RUN_PERSISTENCE_RACE_ROOTFIX_REALGATE_20260820.zip
            V645_RELEASE_EVIDENCE/
            V645_EVIDENCE/
          if-no-files-found: error
          retention-days: 7

      - name: Upload blocked evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V645_FINAL_RELEASE_BLOCKED_EVIDENCE
          path: |
            V645_RELEASE_EVIDENCE/
            V645_EVIDENCE/
          if-no-files-found: warn
          retention-days: 7

name: HD009 single final all-slot CI QA
on:
  push:
    branches:
      - hobbyroom/hd009-banner-ci-audit-20261107
    paths:
      - .github/workflows/hd009-0117-ci-final-all-slots.yml
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finish existing HD009 banner slots for Glossar mobile and posts
        run: python3 protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/PLUGIN_AKTEN/HD-009-AFFILIATE-ZENTRALE/EVIDENCE/FINISH_0117_SQUARE_MOBILE_POST.py

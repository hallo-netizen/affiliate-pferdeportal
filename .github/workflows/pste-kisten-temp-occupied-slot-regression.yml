name: PSTE TEMP existing reserved article slots regression
on:
  push:
    branches: [fix/pste-kisten-einmalige-pruefung-20261107]
permissions: {contents: read}
jobs:
  same-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all existing tests, three original slot owners and full 100 MINI subjects
        shell: bash
        run: |
          set -euo pipefail
          D=protocol/PROJECT_MEMORY/PROJEKTE/PFERDE_ATELIER/PLUGINS/QA_ONLY
          python3 "$D/apply_existing_mini_kisten_import.py" /tmp/mini-qa
          python3 "$D/apply_wp_single_owner_gate.py" /tmp/mini-qa/PSTE-KISTEN-GESAMT-QA-NICHT-INSTALLIEREN.zip /tmp/combo.zip
          unzip -q /tmp/combo.zip -d /tmp/combo
          I="/tmp/combo/Portal SEO Topic Engine/includes"
          php "$D/test_existing_mini_import.php" "$I/class-pste-mini-workflow.php"
          php "$D/test_existing_pserc_plan.php" "$I/class-pste-mini-workflow.php"
          php "$D/test_complete_parkhaus.php" "$I/class-pste-mini-workflow.php"
          php "$D/test_atomic_existing_mini_option.php" "$I/class-pste-mini-workflow.php"
          php "$D/test_pste_kisten_transfer_v1.php"
          php "$D/test_existing_context_no_second_seo.php" "$I/class-pste-context-evaluator.php"
          php "$D/test_100_keyword_end_to_end_simulation.php" "$I/class-pste-mini-workflow.php" "$I/class-pste-planning-readiness-gate.php" "$D/MINI_100_ORIGINAL_EXTERNAL_TITLES_20261106.json" > /tmp/100result.txt
          grep -E 'exact existing occupied slot|SUMMARY|all 87 cases|ZERO duplicate' /tmp/100result.txt
          find "/tmp/combo/Portal SEO Topic Engine" -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/lints
          test "$(wc -l </tmp/lints)" = 83
          echo "QA_PASS_83_PHP_100_ORIGINAL_KEYWORDS_THREE_EXISTING_SLOT_OWNERS"

name: Alternative SEO Text P3 Isolated Lab

on:
  pull_request:
    branches:
      - alternative/seo-text-central-machine-lab-base-20260908
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  p3-isolated-real-interface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Environment proof
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          php --version
          test -f control/startmaster0107/runtime_packages/PORTAL_PRODUCTION_MACHINE_V6.7.9_SIGNED_ARTICLE_TYPE_EXTENSION_ROOTFIX_FINAL.zip
          test -f control/startmaster0107/runtime_packages/PSERC-FIX.zip

      - name: P0-P2 regression
        shell: bash
        run: |
          set -euo pipefail
          cd control/seo-text-buero/alternative-central-machine/prototype
          PYTHONDONTWRITEBYTECODE=1 python3 test_central_machine.py

      - name: P3 real immutable PPM interface probe
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 control/seo-text-buero/alternative-central-machine/prototype/p3_real_interface_probe.py

      - name: P4 discover bundled real no-publish fixture
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 control/seo-text-buero/alternative-central-machine/prototype/p4_fixture_discovery.py

      - name: P4 real bundled PPM positive-negative smoke
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 control/seo-text-buero/alternative-central-machine/prototype/p4_real_engine_smoke.py

      - name: P5 discover bundled PSERC to PPM bridge test
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 control/seo-text-buero/alternative-central-machine/prototype/p5_bridge_discovery.py

      - name: P7 minimal external signature perimeter
        shell: bash
        run: |
          set -euo pipefail
          cd control/seo-text-buero/alternative-central-machine/prototype
          PYTHONDONTWRITEBYTECODE=1 python3 test_p7_release_boundary.py

      - name: P10 signed job restart without intermediate checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cd control/seo-text-buero/alternative-central-machine/prototype
          PYTHONDONTWRITEBYTECODE=1 python3 test_p10_batch_resume.py

      - name: P11 immutable twelve-gate contract
        shell: bash
        run: |
          set -euo pipefail
          cd control/seo-text-buero/alternative-central-machine/prototype
          PYTHONDONTWRITEBYTECODE=1 python3 test_p11_workflow_contract.py

      - name: P12 read-only component inventory
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 control/seo-text-buero/alternative-central-machine/prototype/p12_component_inventory.py

      - name: P13 read-only hard-rule registry extraction
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 control/seo-text-buero/alternative-central-machine/prototype/p13_rule_registry_extract.py

      - name: P14 reviewer authority audit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 control/seo-text-buero/alternative-central-machine/prototype/p14_reviewer_authority_audit.py

      - name: P15 runtime AI dependency audit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 control/seo-text-buero/alternative-central-machine/prototype/p15_runtime_ai_dependency_audit.py

      - name: P16 exact normal-draft path audit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 control/seo-text-buero/alternative-central-machine/prototype/p16_normal_draft_path_audit.py

      - name: P17 normal-draft enforcement inventory
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 control/seo-text-buero/alternative-central-machine/prototype/p17_normal_draft_enforcement_inventory.py

name: Affiliate 6.72.170 Local Performance Simulation

on:
  push:
    branches: [affiliate-release-current]
    paths:
      - '.github/workflows/affiliate-672170-local-sim.yml'
      - 'release/affiliate-zentrale/current/affiliate-portal-router/**'
      - 'release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt'
      - 'control/release-governance/CURRENT_RELEASE.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-positive-negative-performance:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Source and static regression guard
        shell: bash
        run: |
          set -euo pipefail
          python3 control/release-governance/release_guard.py source-check
          grep -F "Version: 6.72.170" release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php
          grep -F "const VERSION = '6.72.170';" release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php
          find release/affiliate-zentrale/current/affiliate-portal-router -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/lint.log
          test "$(grep -c '^No syntax errors detected' /tmp/lint.log)" = "21"
          python3 - <<'PY'
          from pathlib import Path
          ebay=Path('release/affiliate-zentrale/current/affiliate-portal-router/includes/trait-ppar-ebay.php').read_text()
          idealo=Path('release/affiliate-zentrale/current/affiliate-portal-router/includes/trait-ppar-idealo.php').read_text()
          output=Path('release/affiliate-zentrale/current/affiliate-portal-router/includes/trait-ppar-output-objects.php').read_text()
          if 'function ebay_campaign_post_ids_for_exact_gtins' in ebay:
              raise SystemExit('FAIL 6.72.169 payload-scan helper still exists')
          if "source_payload LIKE %s" in ebay or "source_payload LIKE" in ebay:
              raise SystemExit('FAIL public eBay exact-GTIN payload LIKE remains')
          if "ranked_campaign_candidate_pool($slot_type,'product','',false,array(),$context)" not in idealo:
              raise SystemExit('FAIL context-bound legacy eBay candidate preselection missing')
          if 'multiprovider_exact_gtin_pool_request_cache' not in idealo:
              raise SystemExit('FAIL request cache missing')
          if "'product_gtins'=>$product_gtins" not in ebay:
              raise SystemExit('FAIL eBay write-time GTIN persistence missing')
          if "'product_identity_source'] = 'ebay_business_source'" not in output:
              raise SystemExit('FAIL eBay campaign GTIN persistence missing')
          print('STATIC_ROOTFIX_PASS')
          PY

      - name: Install WordPress 7.1.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-site
          mkdir -p /tmp/wp-site
          /tmp/wp core download --path=/tmp/wp-site --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title='Affiliate 6.72.170 local sim' --admin_user=admin --admin_password='ci-password-123!' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp-site/wp-content/mu-plugins
          cat >/tmp/wp-site/wp-content/mu-plugins/ppar-hivepress-fixture.php <<'PHP'
          <?php
          add_action('init', static function(){
              if (!post_type_exists('hp_listing')) register_post_type('hp_listing', array('public'=>true,'label'=>'Listings'));
              if (!taxonomy_exists('hp_listing_category')) register_taxonomy('hp_listing_category', array('hp_listing'), array('public'=>true,'hierarchical'=>true,'label'=>'Listing categories'));
          }, 1);
          PHP
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-site
          /tmp/wp eval 'if (Pferdeportal_Affiliate_Router::VERSION!=="6.72.170") { exit(2); } echo "ACTIVATION_PASS\n";' --path=/tmp/wp-site

      - name: Positive negative and performance simulation
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/ppar-672170-local-sim.php <<'PHP'
          <?php
          require '/tmp/wp-site/wp-load.php';
          $fail=static function($m){fwrite(STDERR,"FAIL ".$m."\n");exit(2);};
          $pass=static function($m){echo "PASS ".$m."\n";};
          $o=Pferdeportal_Affiliate_Router::instance();
          $rm=static function($name) use($o){$m=new ReflectionMethod($o,$name);$m->setAccessible(true);return $m;};
          $rp=static function($name) use($o){$p=new ReflectionProperty($o,$name);$p->setAccessible(true);return $p;};
          $rm('maybe_install_ebay_schema')->invoke($o);
          if (!post_type_exists(Pferdeportal_Affiliate_Router::CAMPAIGN_POST_TYPE)) $rm('register_campaign_post_type')->invoke($o);
          global $wpdb;
          $table=$rm('ebay_items_table')->invoke($o);
          $now=time();
          $wanted='4006381333931';

          $page_id=wp_insert_post(['post_type'=>'page','post_status'=>'publish','post_title'=>'Test Product','post_name'=>'test-product']);
          if(!$page_id)$fail('test page create');
          $context=['post_id'=>$page_id,'post_type'=>'page','primary_slug'=>'test-product','slugs'=>['test-product']];
          $slot='category_product_1';

          $insert_source=static function($i,$hash,$gtin,$filler='') use($wpdb,$table,$now){
              $payload=json_encode(['raw'=>['gtin'=>$gtin,'localizedAspects'=>[['name'=>'EAN','value'=>$gtin]],'filler'=>$filler]],JSON_UNESCAPED_SLASHES);
              $ok=$wpdb->insert($table,[
                  'portal_key'=>'pferdeatelier','item_id'=>'item-'.$i,'seller_account_type'=>'BUSINESS','seller_username'=>'seller'.$i,
                  'route_mode'=>'business','rule_id'=>'rule-'.$i,'creative_identity_hash'=>$hash,'title'=>'Item '.$i,
                  'condition_text'=>'Neu','affiliate_url'=>'https://example.test/a/'.$i,'item_web_url'=>'https://example.test/i/'.$i,
                  'image_url'=>'https://i.ebayimg.com/images/g/test'.$i.'/s-l500.jpg','source_hash'=>hash('sha256','src-'.$i),
                  'source_payload'=>$payload,'status'=>'active','source_state'=>'available','policy_state'=>'allowed','route_state'=>'ready',
                  'output_state'=>'campaign_published','policy_version'=>'test','classifier_version'=>'test',
                  'source_checked_at'=>$now,'rejection_reason'=>'','last_seen'=>$now,'fresh_until'=>$now+3600,'created_at'=>$now,'updated_at'=>$now
              ]);
              if($ok===false) throw new RuntimeException('source insert '.$wpdb->last_error);
          };
          $insert_campaign=static function($i,$network,$target,$gtin='',$hash='') {
              $p=wp_insert_post([
                  'post_type'=>Pferdeportal_Affiliate_Router::CAMPAIGN_POST_TYPE,'post_status'=>'publish',
                  'post_title'=>$network.' '.$i,'post_name'=>$network.'-'.$i
              ]);
              $data=[
                  'id'=>$network.'-'.$i,'active'=>1,'creative_type'=>'product','network'=>$network,
                  'title'=>$network.' product '.$i,'url'=>'https://example.test/'.$network.'/'.$i,
                  'image_url'=>$network==='ebay'?'https://i.ebayimg.com/images/g/test'.$i.'/s-l500.jpg':'https://example.test/img/'.$i.'.jpg',
                  'placements'=>['category_product_1'],'assignment_mode'=>'page_tree','automation_target_keys'=>['page:'.$target]
              ];
              if($gtin!==''){
                  $data['product_gtins']=[$gtin];
                  $data['product_identifiers']=[['type'=>'GTIN','value'=>$gtin]];
              }
              update_post_meta($p,'ppar_campaign_data',$data);
              if($network==='ebay'){
                  update_post_meta($p,'_ppar_ebay_business_auto',1);
                  update_post_meta($p,'_ppar_ebay_business_match_contract','concept_v3');
                  update_post_meta($p,'_ppar_creative_identity_hash',$hash);
              }
              if($network==='awin') update_post_meta($p,'_ppar_otto_awin_auto',1);
              return $p;
          };

          // Large source table: the 6.72.169 LIKE path had to scan these payloads.
          $filler=str_repeat('x',2048);
          for($i=0;$i<3000;$i++){
              $hash=hash('sha256','bulk-'.$i);
              $gtin=str_pad((string)(1000000000000+$i),13,'0',STR_PAD_LEFT);
              $insert_source('bulk-'.$i,$hash,$gtin,$filler);
          }

          // 150 old eBay campaigns without persisted GTIN. Only two belong to this page.
          $relevant=[];
          for($i=0;$i<150;$i++){
              $hash=hash('sha256','campaign-'.$i);
              $target=$i<2?'test-product':'other-'.$i;
              $gtin=$i===0?$wanted:str_pad((string)(2000000000000+$i),13,'0',STR_PAD_LEFT);
              $insert_source('campaign-'.$i,$hash,$gtin,$filler);
              $p=$insert_campaign($i,'ebay',$target,'',$hash);
              if($i<2)$relevant[]=$p;
          }
          $insert_campaign(9001,'idealo','test-product',$wanted);
          $insert_campaign(9002,'awin','test-product',$wanted);

          $reset=static function() use($rp,$o){
              foreach([
                  'ranked_campaign_posts_request_cache'=>null,
                  'ranked_campaign_raw_records_request_cache'=>null,
                  'ranked_campaign_candidate_index_request_cache'=>[],
                  'ranked_campaign_from_post_request_cache'=>[],
                  'ranked_campaign_raw_target_keys_request_cache'=>[],
                  'ebay_business_campaign_source_row_cache'=>[],
                  'multiprovider_exact_gtin_pool_request_cache'=>[]
              ] as $name=>$value){$rp($name)->setValue($o,$value);}
          };
          $reset();

          $pre=$rm('ranked_campaign_candidate_pool')->invoke($o,$slot,'product','',false,[],$context);
          $pre_ebay=array_values(array_filter($pre,static function($row){return is_array($row)&&sanitize_key((string)($row['network']??''))==='ebay';}));
          echo 'DEBUG_PRE_EBAY_COUNT='.count($pre_ebay)."\n";
          foreach(array_slice($pre_ebay,0,3) as $dbg){
              echo 'DEBUG_PRE_EBAY_POST='.absint($dbg['post_id']??0).' GTINS='.json_encode($rm('multiprovider_campaign_gtins')->invoke($o,$dbg))."\n";
          }

          $before_q=$wpdb->num_queries;
          $t0=microtime(true);
          $pool=$rm('multiprovider_exact_gtin_candidate_pool')->invoke($o,[$wanted],$context,$slot);
          $new_ms=(microtime(true)-$t0)*1000;
          $new_q=$wpdb->num_queries-$before_q;
          $nets=[];$ebay_count=0;
          foreach($pool as $row){
              $n=sanitize_key((string)($row['network']??''));
              $nets[$n]=true;
              if($n==='ebay')$ebay_count++;
          }
          if(empty($nets['ebay'])||empty($nets['idealo'])||empty($nets['awin']))$fail('positive exact provider set '.json_encode(array_keys($nets)));
          if($ebay_count!==1)$fail('positive eBay exact count '.$ebay_count);
          $ecache=$rp('ebay_business_campaign_source_row_cache')->getValue($o);
          if(count($ecache)>2)$fail('eBay source cache exceeded context candidates '.count($ecache));
          $pass('positive exact GTIN: ebay + idealo + awin, eBay source rows <=2');

          // Same request again must be pure request-cache reuse.
          $q1=$wpdb->num_queries;
          $pool2=$rm('multiprovider_exact_gtin_candidate_pool')->invoke($o,[$wanted],$context,$slot);
          $repeat_q=$wpdb->num_queries-$q1;
          if($repeat_q!==0)$fail('repeat exact pool added DB queries '.$repeat_q);
          if(serialize($pool2)!==serialize($pool))$fail('repeat exact pool changed result');
          $pass('repeat call: 0 additional DB queries');

          // Negative 1: wrong GTIN must not create eBay false match.
          $wrong='9999999999999';
          $bad=$rm('multiprovider_exact_gtin_candidate_pool')->invoke($o,[$wrong],$context,$slot);
          foreach($bad as $row){if(sanitize_key((string)($row['network']??''))==='ebay')$fail('wrong GTIN admitted eBay');}
          $pass('negative wrong GTIN: no eBay false match');

          // Negative 2: same GTIN but wrong page must not scan/admit unrelated eBay.
          $wrong_context=['post_id'=>$page_id,'post_type'=>'page','primary_slug'=>'unrelated-page','slugs'=>['unrelated-page']];
          $bad2=$rm('multiprovider_exact_gtin_candidate_pool')->invoke($o,[$wanted],$wrong_context,$slot);
          foreach($bad2 as $row){if(sanitize_key((string)($row['network']??''))==='ebay')$fail('wrong page admitted eBay');}
          $pass('negative wrong page: no eBay false match');

          // Future refresh persistence helper.
          $got=$rm('ebay_business_item_gtins')->invoke($o,['raw'=>['localizedAspects'=>[['name'=>'EAN','value'=>$wanted]]]]);
          if($got!==[$wanted])$fail('write-time GTIN extraction '.json_encode($got));
          $pass('future eBay refresh extracts exact GTIN');

          // Reproduce the 6.72.169 SQL shape only as a local benchmark. This is
          // never called by 6.72.170 runtime.
          $like='%'.$wpdb->esc_like($wanted).'%';
          $old_times=[];
          for($i=0;$i<5;$i++){
              $x=microtime(true);
              $wpdb->get_results($wpdb->prepare(
                  "SELECT creative_identity_hash,source_payload FROM {$table} WHERE seller_account_type='BUSINESS' AND creative_identity_hash<>'' AND source_payload LIKE %s ORDER BY id DESC",
                  $like
              ),ARRAY_A);
              $old_times[]=(microtime(true)-$x)*1000;
          }
          sort($old_times);
          $old_median=$old_times[2];
          echo 'PERF_NEW_COLD_MS='.number_format($new_ms,3,'.','')."\n";
          echo 'PERF_NEW_COLD_DB_QUERIES='.$new_q."\n";
          echo 'PERF_NEW_REPEAT_DB_QUERIES='.$repeat_q."\n";
          echo 'PERF_672169_LIKE_MEDIAN_MS='.number_format($old_median,3,'.','')."\n";
          echo 'PERF_SOURCE_ROWS='.$wpdb->get_var("SELECT COUNT(*) FROM {$table}")."\n";
          if($repeat_q!==0)$fail('request cache performance contract');
          echo "LOCAL_POSITIVE_NEGATIVE_PERFORMANCE_PASS\n";
          PHP
          /tmp/wp eval-file /tmp/ppar-672170-local-sim.php --path=/tmp/wp-site | tee /tmp/ppar-672170-local-sim.log
          grep -F 'LOCAL_POSITIVE_NEGATIVE_PERFORMANCE_PASS' /tmp/ppar-672170-local-sim.log

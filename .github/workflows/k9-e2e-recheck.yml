name: K9 temporary current E2E recheck
on:
  push:
    branches: [konzept9/greenfield-20260929]
    paths: ['runtime/E2E_RECHECK_TRIGGER']
permissions:
  contents: write
concurrency:
  group: k9-production-state
  cancel-in-progress: false
jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Prepare current check job
        run: python3 k9_engine.py prepare check 1 --source-run-id "${GITHUB_RUN_ID}-e2e-recheck" | tee /tmp/start.json
      - name: Prepare exact LanguageTool 6.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/k9-lt68
          curl --fail --location --retry 3 https://github.com/jxmorris12/language_tool_python/releases/download/LanguageTool-6.8/LanguageTool-6.8.zip -o /tmp/k9-lt68/LanguageTool-6.8.zip
          echo '6a7f6b67b779ae9505f7579f0c41453ea8d1bd72ae750bdc2c55ba974281467d  /tmp/k9-lt68/LanguageTool-6.8.zip' | sha256sum -c -
          unzip -q /tmp/k9-lt68/LanguageTool-6.8.zip -d /tmp/k9-lt68
          echo '2122882e800d312a0543d895c56c0a84a9bb131c9b9846efd8fc033129353ae8  /tmp/k9-lt68/LanguageTool-6.8/languagetool-commandline.jar' | sha256sum -c -
      - name: Run and accept current native check
        shell: bash
        run: |
          set -euo pipefail
          python3 quality/k9_check.py runtime/CURRENT_JOB.json /tmp/k9-lt68/LanguageTool-6.8/languagetool-commandline.jar quality/PORTAL_PRODUCTION_MACHINE_V6.7.9.zip --output /tmp/check.json
          python3 k9_engine.py accept /tmp/check.json | tee /tmp/accept.json
          read -r repair_required fully_done total < <(python3 - <<'PY'
          import json
          s=json.load(open('state/STATUS.json'))
          print(s.get('repair_required',0),s.get('fully_done',0),s.get('total',0))
          PY
          )
          if [ "$repair_required" -gt 0 ]; then
            python3 k9_engine.py prepare repair "$repair_required" --source-run-id "${GITHUB_RUN_ID}-auto-repair"
          elif [ "$fully_done" -eq "$total" ] && [ "$total" -gt 0 ]; then
            touch runtime/FINALIZE_REQUIRED
          else
            echo K9_E2E_STATE_INVALID; exit 2
          fi
          rm -f runtime/E2E_RECHECK_TRIGGER
          git config user.name 'k9-e2e-recheck-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A state runtime warehouse
          git commit -m 'K9 E2E: accept automatic recheck and deterministic next state'
          git push

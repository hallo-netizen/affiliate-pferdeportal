name: Affiliate V6638 one-shot finalizer

on:
  push:
    branches:
      - affiliate-realdb-one-shot-20260830

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Affiliate source branch
        uses: actions/checkout@v4
        with:
          ref: affiliate-release-current
          fetch-depth: 0

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Verify bound real DB PASS and exact source
        shell: bash
        run: |
          set -euo pipefail
          E='release/affiliate-zentrale/evidence/real_wordpress_mariadb_persistence_same_uuid_v6638_fix1.txt'
          grep -Fx 'RESULT=PASS' "$E"
          grep -Fx 'GITHUB_ACTIONS_RUN_ID=33311054855' "$E"
          grep -Fx 'FINAL=REAL_WORDPRESS_MARIADB_UPGRADE_V6638_PASS' "$E"
          grep -Fx 'FINAL_FRESH=REAL_WORDPRESS_MARIADB_FRESH_INSTALL_V6638_PASS' "$E"
          test "$(find release/affiliate-zentrale/current/affiliate-portal-router -type f | wc -l)" -eq 21
          (cd release/affiliate-zentrale/current && sha256sum -c ../CURRENT_SOURCE_SHA256.txt)
          find release/affiliate-zentrale/current/affiliate-portal-router -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Build deterministic final installer twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/affiliate-zentrale/artifacts/final
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED
          import hashlib

          root=Path('release/affiliate-zentrale')
          container=root/'current'
          manifest=root/'CURRENT_SOURCE_SHA256.txt'
          rows=[]
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if not line.strip(): continue
              h,rel=line.split(None,1)
              rel=rel.strip()
              data=(container/rel).read_bytes()
              if hashlib.sha256(data).hexdigest()!=h:
                  raise SystemExit('SOURCE_HASH_MISMATCH:'+rel)
              rows.append((h,rel))
          if len(rows)!=21:
              raise SystemExit('SOURCE_FILE_COUNT')

          fixed=(2026,8,30,12,30,0)
          def build(out):
              with ZipFile(out,'w',compression=ZIP_DEFLATED,compresslevel=9) as z:
                  for h,rel in rows:
                      data=(container/rel).read_bytes()
                      zi=ZipInfo(rel,date_time=fixed)
                      zi.compress_type=ZIP_DEFLATED
                      zi.create_system=3
                      zi.external_attr=(0o100644 & 0xFFFF)<<16
                      zi.flag_bits |= 0x800
                      z.writestr(zi,data,compress_type=ZIP_DEFLATED,compresslevel=9)
          build('/tmp/final-a.zip')
          build('/tmp/final-b.zip')
          if Path('/tmp/final-a.zip').read_bytes()!=Path('/tmp/final-b.zip').read_bytes():
              raise SystemExit('DETERMINISTIC_BUILD_MISMATCH')
          out=root/'artifacts/final/affiliate-zentrale_v6.63.8_FINAL_VERIFIED.zip'
          out.write_bytes(Path('/tmp/final-a.zip').read_bytes())
          print('INSTALLER_SHA256='+hashlib.sha256(out.read_bytes()).hexdigest())
          PY
          cmp /tmp/final-a.zip /tmp/final-b.zip

      - name: Fresh unpack and byte-identity gate
        shell: bash
        run: |
          set -euo pipefail
          ZIP='release/affiliate-zentrale/artifacts/final/affiliate-zentrale_v6.63.8_FINAL_VERIFIED.zip'
          rm -rf /tmp/fresh6638 && mkdir /tmp/fresh6638
          unzip -q "$ZIP" -d /tmp/fresh6638
          test "$(find /tmp/fresh6638/affiliate-portal-router -type f | wc -l)" -eq 21
          (cd /tmp/fresh6638 && sha256sum -c "$GITHUB_WORKSPACE/release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt")
          find /tmp/fresh6638/affiliate-portal-router -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          root=Path('release/affiliate-zentrale')
          container=root/'current'
          zpath=root/'artifacts/final/affiliate-zentrale_v6.63.8_FINAL_VERIFIED.zip'
          rows=[]
          for line in (root/'CURRENT_SOURCE_SHA256.txt').read_text().splitlines():
              if not line.strip(): continue
              h,rel=line.split(None,1); rows.append((h,rel.strip()))
          with ZipFile(zpath) as z:
              names=sorted(n for n in z.namelist() if not n.endswith('/'))
              expected=sorted(rel for _,rel in rows)
              if names!=expected: raise SystemExit('ZIP_FILE_LIST_MISMATCH')
              for h,rel in rows:
                  src=(container/rel).read_bytes(); packed=z.read(rel)
                  if src!=packed: raise SystemExit('BYTE_IDENTITY_FAIL:'+rel)
                  if hashlib.sha256(packed).hexdigest()!=h: raise SystemExit('ZIP_HASH_FAIL:'+rel)
          print('SOURCE_ZIP_BYTE_IDENTITY=21/21 PASS')
          PY

      - name: Write evidence and bind final release state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json

          root=Path('release/affiliate-zentrale')
          ev=root/'evidence'
          zpath=root/'artifacts/final/affiliate-zentrale_v6.63.8_FINAL_VERIFIED.zip'
          statep=Path('control/release-governance/CURRENT_RELEASE.json')
          d=json.loads(statep.read_text(encoding='utf-8'))
          mh=d['active_candidate']['current_source_manifest_sha256']
          zh=hashlib.sha256(zpath.read_bytes()).hexdigest()

          evidence={
            'fresh_unpack_exact_installer': ev/'fresh_unpack_exact_installer_v6638_final.txt',
            'source_zip_byte_identity': ev/'source_zip_byte_identity_v6638_final.txt',
            'final_sha256': ev/'final_sha256_v6638_final.txt',
          }
          evidence['fresh_unpack_exact_installer'].write_text(
            'GATE=fresh_unpack_exact_installer\nRESULT=PASS\nSOURCE_MANIFEST_SHA256='+mh+'\nINSTALLER_SHA256='+zh+'\nZIP_FILE_COUNT=21\nFRESH_UNPACK_HASHES=21/21 PASS\nFRESH_UNPACK_PHP_LINT=16/16 PASS\n',encoding='utf-8')
          evidence['source_zip_byte_identity'].write_text(
            'GATE=source_zip_byte_identity\nRESULT=PASS\nSOURCE_MANIFEST_SHA256='+mh+'\nINSTALLER_SHA256='+zh+'\nSOURCE_ZIP_BYTE_IDENTITY=21/21 PASS\n',encoding='utf-8')
          evidence['final_sha256'].write_text(
            'GATE=final_sha256\nRESULT=PASS\nSOURCE_MANIFEST_SHA256='+mh+'\nINSTALLER=release/affiliate-zentrale/artifacts/final/affiliate-zentrale_v6.63.8_FINAL_VERIFIED.zip\nINSTALLER_SHA256='+zh+'\nDETERMINISTIC_REBUILD=PASS\n',encoding='utf-8')

          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          gates=d['required_release_gates']
          real=ev/'real_wordpress_mariadb_persistence_same_uuid_v6638_fix1.txt'
          gates['real_wordpress_mariadb_persistence_same_uuid']={
            'status':'PASS','evidence_ref':real.as_posix(),'evidence_sha256':sha(real),'source_manifest_sha256':mh}
          for name,p in evidence.items():
              gates[name]={'status':'PASS','evidence_ref':p.as_posix(),'evidence_sha256':sha(p),'source_manifest_sha256':mh}

          d['active_candidate']['status']='RELEASED'
          d['active_candidate']['release_allowed']=True
          d['active_candidate']['final_artifact_ref']=zpath.as_posix()
          d['active_candidate']['final_artifact_sha256']=zh
          d['execution_state']={
            'state':'FINALIZING_RELEASE',
            'authorized_next_action':'FINALIZE_RELEASE',
            'completion_condition':'ALL_REQUIRED_RELEASE_GATES_PASS',
            'after_completion_action':'RELEASE_COMPLETE',
            'no_optional_detours':True,
            'sequence':3,
            'authorized_change_prefixes':['release/affiliate-zentrale/artifacts/final/','release/affiliate-zentrale/evidence/','control/release-governance/CURRENT_RELEASE.json'],
            'next_state_binding':{
              'sequence':3,'state':'FINALIZING_RELEASE','authorized_next_action':'FINALIZE_RELEASE',
              'authorized_change_prefixes':['release/affiliate-zentrale/artifacts/final/','release/affiliate-zentrale/evidence/','control/release-governance/CURRENT_RELEASE.json']
            }
          }
          d['objective_control']['current_milestone']='FINAL_RELEASE_VERIFIED'
          statep.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('FINAL_INSTALLER_SHA256='+zh)
          PY

      - name: Release guard and commit exact final artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 control/release-governance/release_guard.py release-check
          git config user.name 'hallo-netizen'
          git config user.email 'hallo@oliver-beil.de'
          git add release/affiliate-zentrale/artifacts/final/ release/affiliate-zentrale/evidence/ control/release-governance/CURRENT_RELEASE.json
          git commit -m 'release: finalize Affiliate V6.63.8 after full gates'
          git push origin HEAD:affiliate-release-current

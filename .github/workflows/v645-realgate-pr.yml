name: V6.45 isolated real gate PR

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v645-realgate-pr.yml'
      - '.github/scripts/run-v645-realgate-ci.sh'
      - 'CODEX_V645_REALGATE_SOURCE_AND_EXACT_TASK_20260820.zip'

permissions:
  contents: read

jobs:
  realgate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: v645gate
          MARIADB_USER: wp
          MARIADB_PASSWORD: wppass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uwp -pwppass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Set up PHP 8.4 with mysqli and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          tools: wp-cli
          coverage: none

      - name: Run fail-closed V6.45 real gate
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          chmod +x .github/scripts/run-v645-realgate-ci.sh
          .github/scripts/run-v645-realgate-ci.sh

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CODEX_V645_REALGATE_EVIDENCE_GHA_20260820
          path: |
            CODEX_V645_REALGATE_EVIDENCE_GHA_20260820.zip
            V645_EVIDENCE/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce gate result
        if: always()
        shell: bash
        run: |
          test "${{ steps.gate.outcome }}" = "success"

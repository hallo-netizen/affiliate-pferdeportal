name: HD009 0.1.24 guarded ZIP build and PHP tests
on:
  push:
    branches: ['hobbyroom/hd009-coverage-variant-20261107']
    paths:
      - 'ops/hobby009_coverage24/build.py'
      - 'ops/hobby009_coverage24/test_release.py'
      - '.github/workflows/hd009-coverage-build.yml'
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build complete ZIP from exact checksum-verified 0.1.23
        run: python3 ops/hobby009_coverage24/build.py
      - name: Execute new original plugin PHP methods under WordPress function stubs
        run: python3 ops/hobby009_coverage24/test_release.py
      - name: Publish independently verified full ZIP and unique versioned ZIP
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE/CURRENT.zip
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE/HOBBY_DEPOT_AFFILIATE_HD009_0.1.24.zip
          git commit -m 'HD009 0.1.24: central empty-slot Amazon fallback, no triple image, post and category'
          git push origin HEAD:hobbyroom/hd009-coverage-variant-20261107

name: Hobby Depot versioned downloads hard verification
on:
  push:
    branches: ['hobbyroom/hd007-hd009-versioned-files-20261107']
    paths:
      - 'ops/hobby-versioned-downloads/build.py'
      - '.github/workflows/hobby-versioned-downloads.yml'
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build complete existing plugins with versions and distinct filenames
        run: python3 ops/hobby-versioned-downloads/build.py
      - name: Commit checked originals as CURRENT and uniquely named downloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE/CURRENT.zip
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE/HOBBY_DEPOT_AFFILIATE_HD009_0.1.22.zip
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-007-HOBBYREGISTER-CORE/CURRENT.zip
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-007-HOBBYREGISTER-CORE/HOBBY_DEPOT_HOBBYREGISTER_HD007_1.2.20.zip
          git commit -m "HD009 0.1.22 and HD007 1.2.20: unique full-install ZIP downloads"
          git push origin HEAD:hobbyroom/hd007-hd009-versioned-files-20261107

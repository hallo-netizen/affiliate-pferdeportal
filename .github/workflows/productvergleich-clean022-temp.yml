name: Product Comparison Clean 022 TEMP

on:
  push:
    branches:
      - hobbyroom/productwissen-v1-prototype
    paths:
      - '.github/workflows/productvergleich-clean022-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-022:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and zero-freedom
        shell: bash
        run: |
          set -euo pipefail
          find universal-product-knowledge universal-product-comparison -name '*.php' -print0 | xargs -0 -n1 php -l
          RUNTIME_FILES=$(find universal-product-comparison/src -name '*.php' -print)
          ! grep -E -i 'openai|anthropic|gemini|llm|wp_remote_|curl_|fsockopen|stream_socket_client' $RUNTIME_FILES
          ! grep -E -i 'random|rand\(|mt_rand|microtime|uniqid' $RUNTIME_FILES
          ! grep -E 'call_user_func|is_callable|eval\(|exec\(|shell_exec|system\(' $RUNTIME_FILES
          echo UPC_ZERO_FREEDOM_STATIC_GUARD_PASS

      - name: Install WordPress
        run: |
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          mkdir -p /tmp/upc-wp
          wp core download --path=/tmp/upc-wp --quiet
          wp config create --path=/tmp/upc-wp --dbname=wp_test --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check --quiet
          wp core install --path=/tmp/upc-wp --url=http://example.test --title='UPC Clean 022' --admin_user=admin --admin_password='test-password' --admin_email=admin@example.test --skip-email --quiet

      - name: Build production-clean ZIPs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/upc-build
          mkdir -p /tmp/upc-build/universal-product-knowledge
          mkdir -p /tmp/upc-build/universal-product-comparison/config

          cp universal-product-knowledge/universal-product-knowledge.php /tmp/upc-build/universal-product-knowledge/
          cp -a universal-product-knowledge/src /tmp/upc-build/universal-product-knowledge/

          cp universal-product-comparison/universal-product-comparison.php /tmp/upc-build/universal-product-comparison/
          cp -a universal-product-comparison/src /tmp/upc-build/universal-product-comparison/
          cp -a universal-product-comparison/assets /tmp/upc-build/universal-product-comparison/
          cp -a universal-product-comparison/config/pferde-atelier /tmp/upc-build/universal-product-comparison/config/

          (
            cd /tmp/upc-build
            zip -qr /tmp/universal-product-knowledge.zip universal-product-knowledge
            zip -qr /tmp/universal-product-comparison.zip universal-product-comparison
          )

          ! unzip -Z1 /tmp/universal-product-comparison.zip | grep -E '/tests/|protocol/|\.git|ZERO_FREEDOM|config/test-project'
          unzip -Z1 /tmp/universal-product-comparison.zip | grep -F 'config/pferde-atelier/dossiers/pv-reg-001.json'
          unzip -p /tmp/universal-product-comparison.zip universal-product-comparison/universal-product-comparison.php | grep -F "Version: 0.2.2-prototype"
          echo UPC_022_PRODUCTION_CLEAN_ZIP_PASS

      - name: Install clean ZIPs
        run: |
          wp plugin install /tmp/universal-product-knowledge.zip --activate --path=/tmp/upc-wp
          wp plugin install /tmp/universal-product-comparison.zip --activate --path=/tmp/upc-wp
          wp plugin is-active universal-product-knowledge --path=/tmp/upc-wp
          wp plugin is-active universal-product-comparison --path=/tmp/upc-wp
          echo UPC_022_CLEAN_INSTALL_PASS

      - name: Attach CI-only test materials
        run: |
          cp -a universal-product-knowledge/tests /tmp/upc-wp/wp-content/plugins/universal-product-knowledge/tests
          cp -a universal-product-comparison/tests /tmp/upc-wp/wp-content/plugins/universal-product-comparison/tests
          cp -a universal-product-comparison/config/test-project /tmp/upc-wp/wp-content/plugins/universal-product-comparison/config/test-project

      - name: Existing regression after clean install
        run: |
          wp eval-file /tmp/upc-wp/wp-content/plugins/universal-product-knowledge/tests/wp-db-smoke.php --path=/tmp/upc-wp
          wp eval-file /tmp/upc-wp/wp-content/plugins/universal-product-comparison/tests/wp-db-smoke.php --path=/tmp/upc-wp
          wp eval-file /tmp/upc-wp/wp-content/plugins/universal-product-comparison/tests/wp-real-dossier-smoke.php --path=/tmp/upc-wp
          wp eval-file /tmp/upc-wp/wp-content/plugins/universal-product-comparison/tests/wp-archive-smoke.php --path=/tmp/upc-wp

      - name: Fresh DB bound live draft
        run: |
          wp db reset --yes --path=/tmp/upc-wp
          wp core install --path=/tmp/upc-wp --url=http://example.test --title='UPC Fresh Bound' --admin_user=admin --admin_password='test-password' --admin_email=admin@example.test --skip-email --quiet
          wp plugin activate universal-product-knowledge --path=/tmp/upc-wp
          wp plugin activate universal-product-comparison --path=/tmp/upc-wp
          wp eval-file /tmp/upc-wp/wp-content/plugins/universal-product-comparison/tests/wp-bound-live-pv-reg-001.php --path=/tmp/upc-wp

      - name: Upload clean replacement ZIP
        uses: actions/upload-artifact@v4
        with:
          name: universal-product-comparison-0.2.2-prototype-clean
          path: /tmp/universal-product-comparison.zip
          if-no-files-found: error
          retention-days: 7

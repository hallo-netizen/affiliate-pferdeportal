name: K0 inspect real importer validator

on:
  push:
    branches: [konzept0-portal-neutral-20261002]
    paths:
      - '.github/workflows/k0-inspect-real-importer.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect exact importer validator
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          rm -rf /tmp/inspect && mkdir -p /tmp/inspect
          for p in \
            control/startmaster0107/runtime_packages/PSERC-FIX.zip \
            control/startmaster0107/runtime_packages/PORTAL_PRODUCTION_MACHINE_V6.7.9_SIGNED_ARTICLE_TYPE_EXTENSION_ROOTFIX_FINAL.zip
          do
            b="$(basename "$p")"
            git show "origin/main:$p" > "/tmp/$b"
            d="/tmp/inspect/\${b%.zip}"
            mkdir -p "$d"
            unzip -q "/tmp/$b" -d "$d"
            while true; do
              inner="$(find "$d" -type f -name '*.zip' -print -quit || true)"
              [ -z "$inner" ] && break
              nd="\${inner%.zip}-unzipped"
              mkdir -p "$nd"
              unzip -q "$inner" -d "$nd"
              rm -f "$inner"
            done
          done
          echo '=== PLAN SLOT IDENTITY ==='
          find /tmp/inspect -type f -name 'class-pserc-plan-slot-identity.php' -print -exec sed -n '1,120p' {} \;
          echo '=== EXACT IMPORTER ERROR MATCHES ==='
          grep -RniE 'PSERC_SYSTEM4_CANONICAL_PLAN_SLOT_MISMATCH|PSERC_SYSTEM4_ARTICLE_FIELD_INVALID|SYSTEM4_WORDPRESS_IMPORT' /tmp/inspect --include='*.php' || true
          echo '=== NEARBY IMPORTER FILES ==='
          find /tmp/inspect -type f -name '*.php' | grep -Ei 'system4|wordpress|import' | sort | head -300

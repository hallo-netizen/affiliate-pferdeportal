name: HD689 Updater QA
on:
  push:
    branches:
      - hobbyroom/hd689-updater-artifact-20261018
  pull_request:
    branches:
      - hobbyroom/project-memory-campus-v1-20260905
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP integrity
        run: unzip -t artifacts/HOBBY_DEPOT_TEMPLATE_KIT_UPDATE_1.50.689.zip
      - name: Extract
        run: |
          rm -rf /tmp/hd689
          mkdir -p /tmp/hd689
          unzip -q artifacts/HOBBY_DEPOT_TEMPLATE_KIT_UPDATE_1.50.689.zip -d /tmp/hd689
      - name: PHP lint
        run: php -l /tmp/hd689/hobby-depot-template-kit-update-150689/hobby-depot-template-kit-update-150689.php
      - name: Hard assertions
        run: |
          f=/tmp/hd689/hobby-depot-template-kit-update-150689/hobby-depot-template-kit-update-150689.php
          grep -F "Version: 1.0.0" "$f"
          grep -F "Version: 1.50.689" "$f"
          grep -F "Kettenhemd&nbsp;flechten" "$f"
          grep -F "hd-catlevel-banner-first-v150689" "$f"
          grep -F "hd-catlevel-grid-all-v150689" "$f"
          grep -F "render_category_level_post_previews_v150687(\$page, 4)" "$f"

name: Affiliate full WordPress MariaDB E2E
on:
  push:
    branches:
      - affiliate-e2e-repro-20260920
permissions:
  contents: read
jobs:
  full-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify bound fixtures
        run: |
          set -euo pipefail
          echo '435f798b76eadc428f7a18bb6b56fda6f67feedbb8f72aec913791b1ed12efd4  e2e/fixtures/AFFILIATE_ZENTRALE_V6.72.130_EXACT.zip' | sha256sum -c -
          gzip -t e2e/fixtures/real-wxr-product-campaigns-20260915.json.gz
      - name: Install WordPress 7.1 and exact plugin
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          rm -rf /tmp/wp && mkdir /tmp/wp
          wp core download --version=7.1 --path=/tmp/wp
          wp config create --path=/tmp/wp --dbname=wordpress --dbuser=wp --dbpass=wp --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path=/tmp/wp --url=http://127.0.0.1:8080 --title=AffiliateE2E --admin_user=admin --admin_password='e2e-pass-123!' --admin_email=e2e@example.test
          unzip -q e2e/fixtures/AFFILIATE_ZENTRALE_V6.72.130_EXACT.zip -d /tmp/wp/wp-content/plugins
          wp plugin activate affiliate-portal-router --path=/tmp/wp
      - name: Seed real 2026-09-15 WXR product state
        env:
          AFF_E2E_FIXTURE: ${{ github.workspace }}/e2e/fixtures/real-wxr-product-campaigns-20260915.json.gz
        run: |
          set -euo pipefail
          wp eval-file "$GITHUB_WORKSPACE/e2e/seed_real_state.php" --path=/tmp/wp | tee /tmp/seed.log
          grep -Fx 'SEEDED_CAMPAIGNS=2012' /tmp/seed.log
          grep -Fx 'NETWORK_EBAY=922' /tmp/seed.log
          grep -Fx 'NETWORK_IDEALO=1090' /tmp/seed.log
          wp db export /tmp/healthy.sql --path=/tmp/wp
      - name: Diagnose exact eBay loss in healthy historical state
        run: |
          set -euo pipefail
          wp eval-file "$GITHUB_WORKSPACE/e2e/diagnose_selection.php" --path=/tmp/wp | tee /tmp/selection-diagnostic.log
      - name: Start real WordPress frontend
        run: |
          set -euo pipefail
          wp server --host=127.0.0.1 --port=8080 --path=/tmp/wp >/tmp/wp-server.log 2>&1 &
          echo $! >/tmp/wp-server.pid
          for n in $(seq 1 30); do
            if curl -fsS --max-time 2 'http://127.0.0.1:8080/' >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 'http://127.0.0.1:8080/' >/dev/null
      - name: Run complete real-HTTP render-path scenarios
        if: ${{ false }}
        run: |
          set +e
          set -uo pipefail
          : > /tmp/e2e-results.txt
          rc=0
          for s in healthy ebay_control_open idealo_only missing_exact_reithelme one_exact_stallhalfter live_damage; do
            wp db import /tmp/healthy.sql --path=/tmp/wp >/dev/null || rc=1
            AFF_E2E_SCENARIO="$s" wp eval-file "$GITHUB_WORKSPACE/e2e/run_scenario.php" --path=/tmp/wp || rc=1
            echo "===== $s =====" | tee -a /tmp/e2e-results.txt
            python3 "$GITHUB_WORKSPACE/e2e/check_http.py" "$s" 2>&1 | tee -a /tmp/e2e-results.txt
            check_rc=${PIPESTATUS[0]}
            if [ "$check_rc" -ne 0 ]; then rc=1; fi
          done
          cat /tmp/e2e-results.txt
          exit $rc
      - name: Run exact 6.72.108 to 6.72.117 sequential history gate
        if: always()
        run: |
          set -euo pipefail
          test -s /tmp/healthy.sql
          mkdir -p /tmp/history-pkgs /tmp/history-zips /tmp/history-logs
          for v in 108 109 110 111 112 113 114 115 116 117; do
            src="e2e/history-fixtures/v6.72.$v.zip.b64"
            test -s "$src"
            base64 --decode "$src" > "/tmp/history-pkgs/AFFILIATE_ZENTRALE_V6.72.$v.zip"
            unzip -tq "/tmp/history-pkgs/AFFILIATE_ZENTRALE_V6.72.$v.zip" >/dev/null
            sha256sum "/tmp/history-pkgs/AFFILIATE_ZENTRALE_V6.72.$v.zip"
          done

          # One common historical database start. From here on state is preserved
          # across 108 -> 117; only the plugin package changes in sequence.
          wp db import /tmp/healthy.sql --path=/tmp/wp >/dev/null

          first_break=""
          for v in 108 109 110 111 112 113 114 115 116 117; do
            echo "===== HISTORY 6.72.$v ====="
            rm -rf /tmp/wp/wp-content/plugins/affiliate-portal-router
            unzip -q "/tmp/history-pkgs/AFFILIATE_ZENTRALE_V6.72.$v.zip" -d /tmp/wp/wp-content/plugins

            # The plugin stays logically active, matching a real in-place update.
            # Trigger the admin lifecycle as well so version-bound persistent
            # migrations cannot be skipped by the CLI-only probe.
            wp eval 'do_action("admin_init");' --path=/tmp/wp               >"/tmp/history-logs/6.72.$v-admin-init.log" 2>&1 || {
                cat "/tmp/history-logs/6.72.$v-admin-init.log"
                first_break="6.72.$v:ADMIN_INIT"
                break
              }

            set +e
            wp eval-file "$GITHUB_WORKSPACE/e2e/history_probe.php" --path=/tmp/wp               2>&1 | tee "/tmp/history-logs/6.72.$v-probe.log"
            probe_rc=${PIPESTATUS[0]}
            set -e
            if [ "$probe_rc" -ne 0 ]; then
              first_break="6.72.$v:HISTORY_PROBE"
              printf '%s\n' "$first_break" >/tmp/aff-history-stop
              break
            fi

            # Prove the same version through the actual frontend HTML path.
            set +e
            python3 "$GITHUB_WORKSPACE/e2e/check_http.py" healthy               2>&1 | tee "/tmp/history-logs/6.72.$v-http.log"
            http_rc=${PIPESTATUS[0]}
            set -e
            if [ "$http_rc" -ne 0 ]; then
              first_break="6.72.$v:HTTP_RENDER"
              printf '%s\n' "$first_break" >/tmp/aff-history-stop
              break
            fi
          done

          if [ -n "$first_break" ]; then
            echo "FIRST_HISTORY_BREAK=$first_break"
            exit 1
          fi

          echo "HISTORY_108_TO_117_NO_BREAK"
      - name: Compare 6.72.116 and 6.72.117
        if: always()
        run: |
          set -euo pipefail
          rm -rf /tmp/v116 /tmp/v117
          mkdir /tmp/v116 /tmp/v117
          base64 --decode e2e/history-fixtures/v6.72.116.zip.b64 > /tmp/116.zip
          base64 --decode e2e/history-fixtures/v6.72.117.zip.b64 > /tmp/117.zip
          unzip -q /tmp/116.zip -d /tmp/v116
          unzip -q /tmp/117.zip -d /tmp/v117
          diff -qr /tmp/v116 /tmp/v117 || true
          grep -R -n "idealo_only" /tmp/v116 /tmp/v117 || true
      - name: Build direct 6.72.116-based provider restore fix
        if: always()
        run: |
          set -euo pipefail
          rm -rf /tmp/fixbuild
          mkdir -p /tmp/fixbuild
          base64 --decode e2e/history-fixtures/v6.72.116.zip.b64 > /tmp/base116.zip
          unzip -q /tmp/base116.zip -d /tmp/fixbuild
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/fixbuild/affiliate-portal-router/pferdeportal-affiliate-router.php')
          s = p.read_text()
          s = s.replace('Version: 6.72.116', 'Version: 6.72.131', 1)
          s = s.replace("const VERSION = '6.72.116';", "const VERSION = '6.72.131';", 1)
          needle = "if (!defined('ABSPATH')) {\n    exit;\n}\n"
          patch = """if (!defined('ABSPATH')) {
              exit;
          }

          function ppar_v672131_restore_provider_state() {
              $idealo = get_option('ppar_network_idealo_v1', array());
              if (!is_array($idealo)) {
                  $idealo = array();
              }
              if (($idealo['output_mode'] ?? '') === 'idealo_only') {
                  $idealo['output_mode'] = 'automatic';
                  update_option('ppar_network_idealo_v1', $idealo, false);
              }

              delete_option('ppar_multiprovider_category_repair_v672115');
              delete_option('ppar_multiprovider_category_repair_v672117');
              delete_option('ppar_article_plan_rebuild_state_v1');

              $revision = (int) get_option('ppar_article_plan_revision_v1', 0);
              update_option('ppar_article_plan_revision_v1', $revision + 1, false);

              if (!wp_next_scheduled('ppar_article_plan_rebuild_worker')) {
                  wp_schedule_single_event(time() + 1, 'ppar_article_plan_rebuild_worker');
              }

              update_option('ppar_v672131_restore_done', '1', false);
          }

          register_activation_hook(__FILE__, 'ppar_v672131_restore_provider_state');
          add_action('admin_init', function () {
              if (get_option('ppar_v672131_restore_done', '0') !== '1') {
                  ppar_v672131_restore_provider_state();
              }
          }, 1);
          """
          if needle not in s:
              raise SystemExit('ABSPATH insertion point missing')
          s = s.replace(needle, patch, 1)
          p.write_text(s)
          PY
          php -l /tmp/fixbuild/affiliate-portal-router/pferdeportal-affiliate-router.php
          grep -R -n "idealo_only" /tmp/fixbuild/affiliate-portal-router | head -20 || true
          cd /tmp/fixbuild
          zip -qr "$GITHUB_WORKSPACE/AFFILIATE_ZENTRALE_V6.72.131_EXACT116_PROVIDER_RESTORE.zip" affiliate-portal-router
          cd "$GITHUB_WORKSPACE"
          sha256sum AFFILIATE_ZENTRALE_V6.72.131_EXACT116_PROVIDER_RESTORE.zip

      - name: Upload direct provider restore fix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-672131-exact116-provider-restore
          path: AFFILIATE_ZENTRALE_V6.72.131_EXACT116_PROVIDER_RESTORE.zip
          if-no-files-found: error

      - name: Prove display assets untouched
        if: always()
        run: |
          set -euo pipefail
          rm -rf /tmp/check130 && mkdir /tmp/check130
          unzip -q e2e/fixtures/AFFILIATE_ZENTRALE_V6.72.130_EXACT.zip -d /tmp/check130
          sha256sum /tmp/check130/affiliate-portal-router/assets/frontend.css /tmp/check130/affiliate-portal-router/assets/frontend.js

  build-direct-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact 6.72.116-based fix
        run: |
          set -euo pipefail
          rm -rf /tmp/fixbuild
          mkdir -p /tmp/fixbuild
          base64 --decode e2e/history-fixtures/v6.72.116.zip.b64 > /tmp/base116.zip
          unzip -q /tmp/base116.zip -d /tmp/fixbuild
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/fixbuild/affiliate-portal-router/pferdeportal-affiliate-router.php')
          s=p.read_text()
          s=s.replace('Version: 6.72.116','Version: 6.72.131',1)
          s=s.replace("const VERSION = '6.72.116';","const VERSION = '6.72.131';",1)
          needle="if (!defined('ABSPATH')) {\n    exit;\n}\n"
          patch="""if (!defined('ABSPATH')) {
              exit;
          }

          function ppar_v672131_restore_provider_state() {
              $idealo = get_option('ppar_network_idealo_v1', array());
              if (!is_array($idealo)) {
                  $idealo = array();
              }
              if (($idealo['output_mode'] ?? '') === 'idealo_only') {
                  $idealo['output_mode'] = 'automatic';
                  update_option('ppar_network_idealo_v1', $idealo, false);
              }

              delete_option('ppar_multiprovider_category_repair_v672115');
              delete_option('ppar_multiprovider_category_repair_v672117');
              delete_option('ppar_article_plan_rebuild_state_v1');

              $revision = (int) get_option('ppar_article_plan_revision_v1', 0);
              update_option('ppar_article_plan_revision_v1', $revision + 1, false);

              if (!wp_next_scheduled('ppar_article_plan_rebuild_worker')) {
                  wp_schedule_single_event(time() + 1, 'ppar_article_plan_rebuild_worker');
              }

              update_option('ppar_v672131_restore_done', '1', false);
          }

          register_activation_hook(__FILE__, 'ppar_v672131_restore_provider_state');
          add_action('admin_init', function () {
              if (get_option('ppar_v672131_restore_done', '0') !== '1') {
                  ppar_v672131_restore_provider_state();
              }
          }, 1);
          """
          if needle not in s:
              raise SystemExit('insertion point missing')
          p.write_text(s.replace(needle,patch,1))
          PY
          php -l /tmp/fixbuild/affiliate-portal-router/pferdeportal-affiliate-router.php
          cd /tmp/fixbuild
          zip -qr "$GITHUB_WORKSPACE/AFFILIATE_ZENTRALE_V6.72.131_EXACT116_PROVIDER_RESTORE.zip" affiliate-portal-router
          cd "$GITHUB_WORKSPACE"
          sha256sum AFFILIATE_ZENTRALE_V6.72.131_EXACT116_PROVIDER_RESTORE.zip
      - uses: actions/upload-artifact@v4
        with:
          name: affiliate-672131-exact116-provider-restore
          path: AFFILIATE_ZENTRALE_V6.72.131_EXACT116_PROVIDER_RESTORE.zip
          if-no-files-found: error

  inspect-130-fix-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact 6.72.130 repair keys
        run: |
          set -euo pipefail
          rm -rf /tmp/p130 && mkdir /tmp/p130
          unzip -q e2e/fixtures/AFFILIATE_ZENTRALE_V6.72.130_EXACT.zip -d /tmp/p130
          echo '=== IDEALO_ONLY ==='
          grep -R -n -C 6 "idealo_only" /tmp/p130/affiliate-portal-router || true
          echo '=== EBAY CONTROL ==='
          grep -R -n -C 8 "control_provider_access_disabled\|provider_access_disabled\|ebay.*enabled\|enabled.*ebay" /tmp/p130/affiliate-portal-router/includes /tmp/p130/affiliate-portal-router/pferdeportal-affiliate-router.php || true
          echo '=== CATEGORY SLOTS ==='
          grep -R -n -C 8 "category_product_1\|category_product_2\|category_product_3\|article_plan_revision\|rebuild_worker" /tmp/p130/affiliate-portal-router/includes /tmp/p130/affiliate-portal-router/pferdeportal-affiliate-router.php || true

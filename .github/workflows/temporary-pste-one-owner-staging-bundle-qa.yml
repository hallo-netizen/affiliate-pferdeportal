name: TEMP PSTE and PSERC staging pair technical QA artifact
on:
  push:
    branches: [fix/pste-kisten-einmalige-pruefung-20261107]
permissions: {contents: read}
jobs:
  pste-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble unchanged original PSTE v22 with existing class-only QA changes
        shell: bash
        run: |
          set -euo pipefail
          D=protocol/PROJECT_MEMORY/PROJEKTE/PFERDE_ATELIER/PLUGINS/QA_ONLY
          python3 "$D/apply_existing_mini_kisten_import.py" /tmp/pste-stage
          python3 "$D/apply_wp_single_owner_gate.py" \
            /tmp/pste-stage/PSTE-KISTEN-GESAMT-QA-NICHT-INSTALLIEREN.zip \
            /tmp/PSTE-ONE-OWNER-0.57.144.22-QA-ONLY-NICHT-INSTALLIEREN.zip
          unzip -q /tmp/PSTE-ONE-OWNER-0.57.144.22-QA-ONLY-NICHT-INSTALLIEREN.zip -d /tmp/pste-final
          I="/tmp/pste-final/Portal SEO Topic Engine/includes"
          php "$D/test_existing_mini_import.php" "$I/class-pste-mini-workflow.php"
          php "$D/test_existing_pserc_plan.php" "$I/class-pste-mini-workflow.php"
          php "$D/test_complete_parkhaus.php" "$I/class-pste-mini-workflow.php"
          php "$D/test_atomic_existing_mini_option.php" "$I/class-pste-mini-workflow.php"
          php "$D/test_pste_kisten_transfer_v1.php"
          php "$D/test_existing_context_no_second_seo.php" "$I/class-pste-context-evaluator.php"
          php "$D/test_100_keyword_end_to_end_simulation.php" "$I/class-pste-mini-workflow.php" "$I/class-pste-planning-readiness-gate.php" "$D/MINI_100_ORIGINAL_EXTERNAL_TITLES_20261106.json" > /tmp/100.log
          tail -n 4 /tmp/100.log
          for mode in good stale onebad; do
            php "$D/test_existing_forward_full_chain.php" "$I/class-pste-mini-workflow.php" "$mode" | tail -n 1
          done
          find "/tmp/pste-final/Portal SEO Topic Engine" -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/lints
          test "$(wc -l </tmp/lints)" -eq 83
          unzip -t /tmp/PSTE-ONE-OWNER-0.57.144.22-QA-ONLY-NICHT-INSTALLIEREN.zip | tail -n 1
          echo "PSTE QA SOURCE ZIP hash:"
          sha256sum /tmp/PSTE-ONE-OWNER-0.57.144.22-QA-ONLY-NICHT-INSTALLIEREN.zip
          printf 'PSTE original v22 + only existing class patches; 100 original MINI cases; 83 PHP syntax PASS.\nPSERC QA 0.28.54 is tested from original 0.28.53 separately, available in working package but not contained here.\nNOT INSTALLABLE APPROVAL. NO K0. NO REAL WP.\n' > /tmp/QA-NOT-FOR-INSTALLATION.txt
          mkdir -p out
          cp /tmp/PSTE-ONE-OWNER-0.57.144.22-QA-ONLY-NICHT-INSTALLIEREN.zip out/
          cp /tmp/QA-NOT-FOR-INSTALLATION.txt out/
          echo "PASS PSTE FILE BUILD, ORIGINAL 100 AND NO SECOND SEO EVALUATION"
      - uses: actions/upload-artifact@v4
        with:
          name: PSTE-ONE-OWNER-STAGING-QA-NICHT-INSTALLIEREN
          path: out/
          retention-days: 30

name: Hobby Depot HD003 1.50.812 tested provider cards release
on:
  push:
    branches: [hobbyroom/hd003-150812-provider-card-design-20261113]
    paths: [.github/workflows/hd003_150812_publish.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require prior full PHP and browser QA, exact checksum and full ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          test "$(gh api repos/"$GITHUB_REPOSITORY"/actions/runs/43404530781 --jq .conclusion)" = success
          python3 scripts/hd003_150812_provider_cards_build.py /tmp/HOBBY_DEPOT_DESIGN_HD003_1.50.812_PRODUCT_KARTEN_VOLL.zip
          echo '1a5cad59bf033780abcc08f3ae70f7e7fbaf6a8c209d4cd97371e5828287dafc  /tmp/HOBBY_DEPOT_DESIGN_HD003_1.50.812_PRODUCT_KARTEN_VOLL.zip' | sha256sum -c
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          p='/tmp/HOBBY_DEPOT_DESIGN_HD003_1.50.812_PRODUCT_KARTEN_VOLL.zip'
          with ZipFile(p) as z:
            assert len(z.namelist())==1291 and z.testzip() is None
            for name in z.namelist():
              if name.endswith('.php'):
                f=Path('/tmp/HD003_php')/name;f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(z.read(name))
          print('VERIFIED_1291_ZIP_CRC_AND_SHA')
          PY
          find /tmp/HD003_php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Archive full release as CURRENT in appropriate existing plugin office
        run: |
          python3 scripts/hd003_150812_archive.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-003-DESIGN-TEMPLATE-KIT/CURRENT.zip
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-003-DESIGN-TEMPLATE-KIT/HOBBY_DEPOT_DESIGN_HD003_1.50.812.zip
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-003-DESIGN-TEMPLATE-KIT/MANIFEST.md
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/PLUGIN_AKTEN/HD-003-DESIGN-TEMPLATE-KIT/CURRENT.md
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/DESIGN/HD003_1.50.812_PRODUKTKARTEN_20261113.md
          git commit -m "HD003 1.50.812 source-locked QA full current release"
          git fetch origin hobbyroom/hd003-150812-provider-card-design-20261113
          git rebase origin/hobbyroom/hd003-150812-provider-card-design-20261113
          git push origin HEAD:refs/heads/hobbyroom/hd003-150812-provider-card-design-20261113
      - name: Publish exact tested full WordPress plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=hobby-hd003-1.50.812-final-product-cards-20261113
          FILE=/tmp/HOBBY_DEPOT_DESIGN_HD003_1.50.812_PRODUCT_KARTEN_VOLL.zip
          printf 'Produktkarten als 3/2/1 Raster: Bild oben, Fakten in der Mitte, Anbieterbuttons unten in beige/tuerkis mit 1px Ecken; einmal Anzeige. 1291 CRC, 13 PHP-Lint und 4 echte Chrome-Breitentests PASS. Nicht live installiert.\n' > /tmp/notes.txt
          gh release create "$TAG" "$FILE#HOBBY_DEPOT_DESIGN_HD003_1.50.812_PRODUCT_KARTEN_VOLL.zip" --repo "$GITHUB_REPOSITORY" --target hobbyroom/hd003-150812-provider-card-design-20261113 --title "Hobby Depot Design HD003 1.50.812 – Produktbilder, Fakten, Buttons" --notes-file /tmp/notes.txt
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,assets,url

name: Robotik V84 einmaliger 16-32-Check
on:
  push:
    branches:
      - campus/robotik-v79-einabschluss-frontend-20261115
jobs:
  pruefung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP und WordPress-Mock (16/32) pruefen
        run: |
          set -euo pipefail
          D=protocol/PROJECT_MEMORY/PROJEKTE/ROBOTIK/KATEGORIE/PLUGIN/V84_SOURCE
          php -l "$D/includes/class-robotik-v84-kategorien-nachtrag.php"
          php -l "$D/TESTS/v84-48er-gesamtworkflow-test.php"
          php "$D/TESTS/v84-48er-gesamtworkflow-test.php" "$D/includes/class-robotik-v84-kategorien-nachtrag.php"

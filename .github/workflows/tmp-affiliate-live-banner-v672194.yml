name: TEMP Affiliate Live Banner 6.72.194

on:
  push:
    branches: [affiliate-release-current]
    paths:
      - '.github/workflows/tmp-affiliate-live-banner-v672194.yml'
      - 'AFFILIATE_HOBBYRAUM/test_live_banner_rebuild_tarifcheck_preset_v672194.php'
      - 'release/affiliate-zentrale/current/affiliate-portal-router/**'
  workflow_dispatch:

jobs:
  wordpress-mariadb-hardtest:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Source hardlocks
        shell: bash
        run: |
          set -euo pipefail
          ROOT=release/affiliate-zentrale/current/affiliate-portal-router
          grep -F "Version: 6.72.194" "$ROOT/pferdeportal-affiliate-router.php"
          grep -F "const VERSION = '6.72.194';" "$ROOT/pferdeportal-affiliate-router.php"
          grep -F "direct:tarifcheck" "$ROOT/includes/trait-ppar-creative-library.php"
          grep -F "run_v672194_banner_target_rebuild" "$ROOT/includes/trait-ppar-automation-suite.php"
          grep -F "creative_library_deactivate_automatic_output_campaigns" "$ROOT/includes/trait-ppar-creative-library.php"
          find "$ROOT" -type f -name '*.php' -print0 | xargs -0 -n1 php -l | tee /tmp/php-lint.log
          test "$(grep -c '^No syntax errors detected' /tmp/php-lint.log)" = "22"
          echo "PASS PHP lint 22/22"

      - name: Prove no frontend wiring for 6.72.194 rebuild
        shell: bash
        run: |
          set -euo pipefail
          ROOT=release/affiliate-zentrale/current/affiliate-portal-router
          grep -F "maybe_rebuild_banner_target_map_v672194" "$ROOT/pferdeportal-affiliate-router.php" | grep -F "admin_init"
          if grep -F "maybe_rebuild_banner_target_map_v672194" "$ROOT/pferdeportal-affiliate-router.php" | grep -F "add_action('init'"; then exit 1; fi
          echo "PASS rebuild scheduler is admin-only"

      - name: Install WordPress and plugin
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-site
          mkdir -p /tmp/wp-site
          /tmp/wp core download --path=/tmp/wp-site --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title='Live Banner 6.72.194' --admin_user=admin --admin_password='ci-password-123!' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp-site/wp-content/mu-plugins
          cat >/tmp/wp-site/wp-content/mu-plugins/pferde-e2e-design-contract.php <<'PHP'
          <?php
          if (!class_exists('Pferde_Template_Kit')) {
              class Pferde_Template_Kit {
                  public static function affiliate_contract_version(){ return '1.0'; }
                  public static function design_profile(){ return 'pferde_atelier'; }
                  public static function design_profile_contract_version(){ return '1.0'; }
                  public static function affiliate_page_type($page_id){ return get_post_field('post_parent',$page_id) ? 'category' : 'hub1'; }
              }
          }
          add_action('init', static function(){
              if (!post_type_exists('uge_term')) register_post_type('uge_term',array('public'=>true,'supports'=>array('title','editor')));
              if (!taxonomy_exists('uge_group')) register_taxonomy('uge_group',array('uge_term'),array('public'=>true,'hierarchical'=>true));
              if (!post_type_exists('pa_breed')) register_post_type('pa_breed',array('public'=>true,'supports'=>array('title','editor')));
              if (!taxonomy_exists('pa_breed_group')) register_taxonomy('pa_breed_group',array('pa_breed'),array('public'=>true,'hierarchical'=>true));
              if (!post_type_exists('hp_listing')) register_post_type('hp_listing',array('public'=>true,'supports'=>array('title','editor')));
              if (!taxonomy_exists('hp_listing_category')) register_taxonomy('hp_listing_category',array('hp_listing'),array('public'=>true,'hierarchical'=>true));
          },1);
          PHP
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-site
          /tmp/wp eval 'if(Pferdeportal_Affiliate_Router::VERSION!=="6.72.194"){exit(2);} echo "PASS 6.72.194 active\n";' --path=/tmp/wp-site

      - name: Real WordPress MariaDB stale-edge rebuild proof
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_TABLES=$(mysql -N -h127.0.0.1 -uwordpress -pwordpress wordpress -e "SHOW TABLES" | wc -l)
          /tmp/wp eval-file "$GITHUB_WORKSPACE/AFFILIATE_HOBBYRAUM/test_live_banner_rebuild_tarifcheck_preset_v672194.php" --path=/tmp/wp-site | tee /tmp/v672194.log
          grep -F 'PASS tarifcheck_snapshot_exists' /tmp/v672194.log
          grep -F 'PASS stale_auto_campaign_active_before_rebuild' /tmp/v672194.log
          grep -F 'PASS stale_map_still_fuetterung_before_rebuild' /tmp/v672194.log
          grep -F 'PASS rebuilt_target_contains_schabracken' /tmp/v672194.log
          grep -F 'PASS rebuilt_target_removed_fuetterung' /tmp/v672194.log
          grep -F 'PASS active_campaign_now_schabracken' /tmp/v672194.log
          grep -F 'PASS no_active_auto_campaign_still_fuetterung' /tmp/v672194.log
          grep -F 'PASS unknown_destination_has_no_target_map' /tmp/v672194.log
          grep -F 'PASS unknown_destination_stale_auto_campaign_deactivated' /tmp/v672194.log
          grep -F 'PASS manual_fixed_campaign_preserved' /tmp/v672194.log
          grep -F 'LIVE_BANNER_REBUILD_TARIFCHECK_PRESET_672194_COMPLETE' /tmp/v672194.log
          AFTER_TABLES=$(mysql -N -h127.0.0.1 -uwordpress -pwordpress wordpress -e "SHOW TABLES" | wc -l)
          test "$BEFORE_TABLES" = "$AFTER_TABLES"
          echo "PASS no new tables"

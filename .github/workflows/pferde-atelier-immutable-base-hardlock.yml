name: Pferde Atelier Immutable Base Hardlock
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  hardlock-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch candidate commit read-only
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --depth=1 origin "$HEAD_SHA"
      - name: Block changes to immutable entrance and ENDSTEMPEL security layer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed.txt
          cat /tmp/changed.txt
          if grep -Eq '^(\.github/workflows/|AGENTS\.md$|control/cloud-entry-gate/|control/deterministic-entrance-gate/|control/production-continuity/|control/startmaster0107/ENDSTEMPEL_)' /tmp/changed.txt; then
            echo 'IMMUTABLE_SECURITY_PATH_CHANGE_BLOCKED'
            exit 1
          fi
      - name: Enforce TEXT Hobbyraum work lock
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/hobbyroom-changed.txt

          if ! grep -Eq '^(control/startmaster0107/|control/single-door-boundary/|control/output-quarantine/)' /tmp/hobbyroom-changed.txt; then
            echo 'TEXT_HOBBYROOM_WORK_LOCK_NOT_APPLICABLE'
            exit 0
          fi

          CAMPUS_BRANCH='hobbyroom/project-memory-campus-v1-20260905'
          HOBBYROOM_PATH='protocol/PROJECT_MEMORY/PROJEKTE/PFERDE_ATELIER/TEXT/HOBBYRAUM.md'
          git fetch --no-tags --depth=1 origin "refs/heads/$CAMPUS_BRANCH:refs/campus/text-worklock"

          BLOCK="$(git show "refs/campus/text-worklock:$HOBBYROOM_PATH" | awk '
            /^HOBBYROOM_WORK_LOCK_V1$/ {capture=1; next}
            /^END_HOBBYROOM_WORK_LOCK_V1$/ {capture=0}
            capture {print}
          ')"

          if [[ -z "$BLOCK" ]]; then
            echo 'TEXT_HOBBYROOM_WORK_LOCK_MISSING'
            exit 1
          fi

          field() {
            local key="$1"
            printf '%s\n' "$BLOCK" | sed -n "s/^$key: //p" | head -n1
          }

          [[ "$(field STATUS)" == 'FIX_ALLOWED_FOR_CODEX_TEST' ]] || { echo 'TEXT_HOBBYROOM_FIX_NOT_ALLOWED'; exit 1; }
          [[ "$(field OFFICE)" == 'TEXT' ]] || { echo 'TEXT_HOBBYROOM_OFFICE_MISMATCH'; exit 1; }
          [[ "$(field MAIN_SHA)" == "$BASE_SHA" ]] || { echo 'TEXT_HOBBYROOM_BASE_SHA_MISMATCH'; exit 1; }
          [[ "$(field CANDIDATE_BRANCH)" == "$HEAD_REF" ]] || { echo 'TEXT_HOBBYROOM_BRANCH_MISMATCH'; exit 1; }
          [[ "$(field CANDIDATE_HEAD_SHA)" == "$HEAD_SHA" ]] || { echo 'TEXT_HOBBYROOM_HEAD_SHA_MISMATCH'; exit 1; }
          [[ "$(field INTEGRATION_ALLOWED)" == 'true' ]] || { echo 'TEXT_HOBBYROOM_INTEGRATION_NOT_ALLOWED'; exit 1; }

          for key in CHECK_PAUL CHECK_HISTORY CHECK_LAST_GOOD CHECK_NEIGHBORS CHECK_REPEAT_CLASS CHECK_POS_NEG CHECK_INVARIANTS; do
            [[ "$(field "$key")" == 'PASS' ]] || { echo "TEXT_HOBBYROOM_${key}_NOT_PASS"; exit 1; }
          done

          PREFIXES="$(field ALLOWED_PATH_PREFIXES)"
          [[ -n "$PREFIXES" && "$PREFIXES" != 'NONE' ]] || { echo 'TEXT_HOBBYROOM_ALLOWED_PATHS_MISSING'; exit 1; }

          while IFS= read -r changed; do
            [[ -z "$changed" ]] && continue
            ok=0
            IFS=';' read -ra allowed <<< "$PREFIXES"
            for prefix in "${allowed[@]}"; do
              [[ -n "$prefix" && "$changed" == "$prefix"* ]] && ok=1 && break
            done
            [[ "$ok" == 1 ]] || { echo "TEXT_HOBBYROOM_PATH_OUT_OF_SCOPE:$changed"; exit 1; }
          done < /tmp/hobbyroom-changed.txt

          echo 'TEXT_HOBBYROOM_WORK_LOCK_PASS'

      - name: Enforce monotonic prebound workflow transition
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/base-tree /tmp/candidate-tree
          mkdir -p /tmp/base-tree /tmp/candidate-tree
          git archive "$BASE_SHA" | tar -x -C /tmp/base-tree
          git archive "$HEAD_SHA" | tar -x -C /tmp/candidate-tree
          python3 - <<'PY'
          import json, hashlib, pathlib, re
          B=pathlib.Path('/tmp/base-tree'); H=pathlib.Path('/tmp/candidate-tree')
          def load(p): return json.loads(p.read_text(encoding='utf-8'))
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def refs(root):
              ptr=load(root/'control/CURRENT_STARTMASTER.json')
              r=load(root/ptr['root_ref']); s=load(root/ptr['state_ref'])
              g=s['execution_gate']; b=load(root/g['bundle_ref'])
              return ptr,r,s,g,b
          bp,br,bs,bg,bb=refs(B); hp,hr,hs,hg,hb=refs(H)
          def smnum(v):
              m=re.fullmatch(r'STARTMASTER(\d+)',str(v));
              if not m: raise SystemExit('STARTMASTER_ID_INVALID')
              return int(m.group(1))
          if smnum(hp['startmaster']) < smnum(bp['startmaster']): raise SystemExit('STARTMASTER_ROLLBACK_BLOCKED')
          if int(hg['sequence']) < int(bg['sequence']): raise SystemExit('SEQUENCE_ROLLBACK_BLOCKED')
          changed=(hp['startmaster']!=bp['startmaster'] or hs['next_allowed_step']!=bs['next_allowed_step'] or int(hg['sequence'])!=int(bg['sequence']))
          if changed:
              nb=bb.get('next_binding')
              if not isinstance(nb,dict): raise SystemExit('UNPREBOUND_TRANSITION_BLOCKED')
              expected_sm=nb.get('startmaster',bp['startmaster'])
              checks=[
                (hp['startmaster']==expected_sm,'NEXT_STARTMASTER_MISMATCH'),
                (hs['next_allowed_step']==nb.get('step_id'),'NEXT_STEP_MISMATCH'),
                (int(hg['sequence'])==int(nb.get('sequence',-1)),'NEXT_SEQUENCE_MISMATCH'),
                (hg['bundle_ref']==nb.get('bundle_ref'),'NEXT_BUNDLE_REF_MISMATCH')]
              for ok,msg in checks:
                  if not ok: raise SystemExit(msg)
              p=H/hg['bundle_ref']
              if not p.is_file() or sha(p)!=nb.get('bundle_sha256'): raise SystemExit('NEXT_BUNDLE_HASH_MISMATCH')
          print('MONOTONIC_PREBOUND_TRANSITION_PASS')
          PY
      - name: Run trusted entrance and continuity tests on candidate state
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/candidate
          mkdir -p /tmp/candidate
          git archive "$HEAD_SHA" | tar -x -C /tmp/candidate
          rm -rf /tmp/candidate/control/cloud-entry-gate /tmp/candidate/control/deterministic-entrance-gate /tmp/candidate/control/production-continuity
          cp -a control/cloud-entry-gate /tmp/candidate/control/
          cp -a control/deterministic-entrance-gate /tmp/candidate/control/
          cp -a control/production-continuity /tmp/candidate/control/
          cp AGENTS.md /tmp/candidate/AGENTS.md
          cd /tmp/candidate
          PYTHONDONTWRITEBYTECODE=1 python3 control/cloud-entry-gate/cloud_repo_ci_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 control/production-continuity/test_production_continuity_guard.py
      - name: Assert immutable base hardlock itself is API-free and domain-blind
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'api\.openai\.com|OPENAI_API_KEY|requests\.post|httpx\.post|urllib\.request' control/cloud-entry-gate/cloud_entry.py control/deterministic-entrance-gate/door.py
          ! grep -E -i 'beratung|pflege|artikeltyp|keywordregel|titelregel|designregel' control/cloud-entry-gate/cloud_entry.py control/production-continuity/production_continuity_guard.py

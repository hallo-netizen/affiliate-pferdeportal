          if values['EINE_WAHRHEIT'] != 'PASS':
              raise SystemExit('PROJECT_MEMORY_ONE_TRUTH_NOT_PASS')
          if values['TESTS'] != 'PASS':
              raise SystemExit('PROJECT_MEMORY_TESTS_NOT_PASS')
          if values['TECHNISCHE_CHECKS'] not in {'PASS','NICHT_BETROFFEN'}:
              raise SystemExit('PROJECT_MEMORY_TECHNICAL_CHECKS_NOT_PASS')

          pm = [p for p in changed if p.startswith('protocol/PROJECT_MEMORY/')]

          def touched(suffix=None, contains=None, prefix=None):
              for p in pm:
                  if suffix is not None and p.endswith(suffix):
                      return True
                  if contains is not None and contains in p:
                      return True
                  if prefix is not None and p.startswith(prefix):
                      return True
              return False

          affected = {
              'CURRENT_STATE': touched(suffix='/CURRENT_STATE.md'),
              'HOBBYRAUM_NEXT_ACTION': touched(suffix='/HOBBYRAUM.md'),
              'ZIELVERTRAG': touched(contains='ZIELVERTRAG'),
              'ARCHIV': touched(prefix='protocol/PROJECT_MEMORY/ARCHIV/'),
              'FEHLER': any('FEHLER' in pathlib.PurePosixPath(p).name for p in pm),
              'PROTOKOLL': any('PROTOKOLL' in pathlib.PurePosixPath(p).name for p in pm),
              'WARUM': touched(suffix='/AENDERUNGSREGISTER.md'),
          }
          for field, is_affected in affected.items():
              if is_affected and values[field] == 'NICHT_BETROFFEN':
                  raise SystemExit(f'PROJECT_MEMORY_PROTOCOLCHECK_CONTRADICTS_DIFF:{field}')

          architecture = any(
              p.endswith('/START_HERE.md')
              or p == 'protocol/PROJECT_MEMORY/START_HERE.md'
              or p.endswith('/HAUPTPFOERTNER.md')
              or p.endswith('/HANDLUNGSVERZEICHNIS.md')
              or p.endswith('/BAUCONTAINER/EINGANGSSTANDARD.md')
              or p.endswith('/BAUCONTAINER/HOBBYRAUM_STANDARD.md')
              or p.endswith('/BAUCONTAINER/NEUES_PROJEKT_VORLAGE.md')
              or p.endswith('/BAUCONTAINER/HAUSMEISTER.md')

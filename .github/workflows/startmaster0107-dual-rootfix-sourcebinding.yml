name: TEMP STARTMASTER0107 Dual Rootfix Source Binding

on:
  push:
    branches: [startmaster0107-dual-rootfix-sourcebinding-20260902]

permissions:
  contents: write

jobs:
  source-binding-rootfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: startmaster0107-dual-rootfix-sourcebinding-20260902
          fetch-depth: 0
      - name: Materialize byte-identical existing 7er texts as recovery inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          source_commit='f4df3847ab4d807a71e82104fd5e1151eff98f2e'
          batch='7f2e3290b6ac78ac7df1644395e57ac72f02dc1373e390eb2e532e57a8ce916a'
          base=f'.pferde-release/{batch}'
          receipt=json.loads(subprocess.check_output(['git','show',f'{source_commit}:{base}/RELEASE_RECEIPT.json']))
          assert receipt['batch_sha256']==batch and len(receipt['outputs'])==7
          dest=Path(f'control/startmaster0107/recovery_sources/{batch}');dest.mkdir(parents=True,exist_ok=True)
          rows=[]
          for row in receipt['outputs']:
              ref=row['released_ref'];name=Path(ref).name
              assert ref==f'{base}/{name}' and name.startswith('ARTICLE_') and name.endswith('.md')
              data=subprocess.check_output(['git','show',f'{source_commit}:{ref}'])
              h=hashlib.sha256(data).hexdigest();assert h==row['sha256']
              p=dest/name;p.write_bytes(data);rows.append({'plan_slot':name[8:-3],'ref':str(p),'sha256':h})
          manifest={'contract':'PFERDE_ATELIER_EXISTING_ARTICLE_RECOVERY_SOURCE_V1','batch_sha256':batch,'source_commit':source_commit,'item_count':7,'items':rows,'content_mutation_performed':False,'publish_allowed':False}
          (dest/'MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'ok':True,'status':'EXISTING_7ER_SOURCE_MATERIALIZED_BYTE_IDENTICAL','count':7,'publish_allowed':False},indent=2))
          PY
      - name: Patch the existing permanent repair script only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('control/startmaster0107/STARTMASTER0107_DUAL_ROOTFIX_REPAIR.py')
          t=p.read_text(encoding='utf-8')
          old="PROMPT_REL='control/startmaster0107/VERBINDLICHER_TEXTERSTELLUNGS_PROMPT_STARTMASTER0107.txt'\n"
          new=old+"RUNTIME_STATE_REL='control/startmaster0107/runtime_inbox/RUNTIME_INBOX_STATE.json'\n"
          if 'RUNTIME_STATE_REL=' not in t:
              assert t.count(old)==1;t=t.replace(old,new,1)
          marker='def augment_current_action(repo:Path,a:dict,it:Mapping[str,Any])->dict:\n'
          helper="""def existing_article_source_binding(repo:Path,it:Mapping[str,Any])->dict|None:\n    sp=repo/RUNTIME_STATE_REL\n    if not sp.is_file():return None\n    st=load(sp);batch=str(st.get('batch_sha256') or '');slot=str(it.get('plan_slot') or '')\n    if not re.fullmatch(r'[0-9a-f]{64}',batch) or not re.fullmatch(r'[0-9a-f]{64}',slot):return None\n    refs=[f'.pferde-release/{batch}/ARTICLE_{slot}.md',f'control/startmaster0107/recovery_sources/{batch}/ARTICLE_{slot}.md']\n    for ref in refs:\n        p=safe(repo,ref)\n        if p.is_file():\n            return {'contract':'PFERDE_ATELIER_EXISTING_ARTICLE_SOURCE_BINDING_V1','ref':ref,'sha256':fsha(p),'canonical_article_id':str(it.get('canonical_article_id') or ''),'plan_slot':slot,'usage':'PRESERVE_EXISTING_PROSE_CORRECT_ONLY_BOUND_FACHWORKFLOW_GAPS','optional_for_new_article_generation':True,'content_or_quality_rules_changed':False,'publish_allowed':False}\n    return None\n\ndef validate_existing_article_source_binding(repo:Path,a:Mapping[str,Any],it:Mapping[str,Any])->None:\n    src=a.get('existing_article_source_binding')\n    if src is None:return\n    if not isinstance(src,dict) or src.get('contract')!='PFERDE_ATELIER_EXISTING_ARTICLE_SOURCE_BINDING_V1':raise Blocked('EXISTING_ARTICLE_SOURCE_BINDING_INVALID')\n    if src.get('canonical_article_id')!=it.get('canonical_article_id') or src.get('plan_slot')!=it.get('plan_slot'):raise Blocked('EXISTING_ARTICLE_SOURCE_IDENTITY_MISMATCH')\n    ref=str(src.get('ref') or '');h=str(src.get('sha256') or '');p=safe(repo,ref)\n    if not p.is_file() or len(h)!=64 or fsha(p)!=h:raise Blocked('EXISTING_ARTICLE_SOURCE_HASH_MISMATCH')\n    if src.get('optional_for_new_article_generation') is not True or src.get('content_or_quality_rules_changed') is not False or src.get('publish_allowed') is not False:raise Blocked('EXISTING_ARTICLE_SOURCE_POLICY_INVALID')\n\n"""
          if 'def existing_article_source_binding(' not in t:
              assert t.count(marker)==1;t=t.replace(marker,helper+marker,1)
          old2="    a['item_receipt_schema']=s;return a\n";new2="    a['item_receipt_schema']=s\n    src=existing_article_source_binding(repo,it)\n    if src is not None:a['existing_article_source_binding']=src\n    return a\n"
          if old2 in t:assert t.count(old2)==1;t=t.replace(old2,new2,1)
          old3="def validate_fachworkflow_pass(repo:Path,a:Mapping[str,Any],it:Mapping[str,Any],d:Mapping[str,Any])->dict:\n    b=binding_descriptor(repo);schema=a.get('item_receipt_schema') or {};expected=schema.get('fachworkflow_pass_ref')\n"
          new3="def validate_fachworkflow_pass(repo:Path,a:Mapping[str,Any],it:Mapping[str,Any],d:Mapping[str,Any])->dict:\n    validate_existing_article_source_binding(repo,a,it)\n    b=binding_descriptor(repo);schema=a.get('item_receipt_schema') or {};expected=schema.get('fachworkflow_pass_ref')\n"
          if old3 in t:assert t.count(old3)==1;t=t.replace(old3,new3,1)
          old4="        a={'allowed_output_root':'q/','item_receipt_schema':{}};it={'canonical_article_id':'article:test','plan_slot':'a'*64};a=augment_current_action(tr,a,it);rows=[]\n"
          new4="        a={'allowed_output_root':'q/','item_receipt_schema':{}};it={'canonical_article_id':'article:test','plan_slot':'a'*64}\n        (tr/Path(RUNTIME_STATE_REL).parent).mkdir(parents=True,exist_ok=True);dump(tr/RUNTIME_STATE_REL,{'batch_sha256':'c'*64})\n        srcp=tr/f\".pferde-release/{'c'*64}/ARTICLE_{it['plan_slot']}.md\";srcp.parent.mkdir(parents=True,exist_ok=True);srcp.write_text('existing',encoding='utf-8')\n        a=augment_current_action(tr,a,it);assert a['existing_article_source_binding']['sha256']==fsha(srcp);rows=[]\n"
          if old4 in t:assert t.count(old4)==1;t=t.replace(old4,new4,1)
          old5="        q={'contract':PASS_CONTRACT,'status':'PASS','canonical_article_id':it['canonical_article_id'],'plan_slot':it['plan_slot'],'contract_binding_ref':SELF_REL,'contract_binding_sha256':binding_sha(tr),'required_stage_proofs':rows,'fact_pack':{'contract':'canonical_fact_pack_v1','fact_pack_id':'fp'},'production_plan_item':{'canonical_article_id':it['canonical_article_id'],'plan_slot':it['plan_slot']},'production_plan_header':{'contract':'production_plan_v4','plan_contract_version':'4.0.0','required_plugin_version':'6.7.9','contract_hashes':CONTRACT_HASHES},'workflow_release_item':{'canonical_article_id':it['canonical_article_id'],'plan_slot':it['plan_slot']},'workflow_release_metadata':meta,'content_or_quality_rules_changed':False,'publish_allowed':False};pref=a['item_receipt_schema']['fachworkflow_pass_ref'];dump(tr/pref,q);h=fsha(tr/pref);d={'outputs':[{'ref':pref,'sha256':h}],'fachworkflow_pass_ref':pref,'fachworkflow_pass_sha256':h};validate_fachworkflow_pass(tr,a,it,d)\n"
          new5=old5+"        srcp.write_text('tampered-existing',encoding='utf-8')\n        try:validate_fachworkflow_pass(tr,a,it,d);raise AssertionError('NEG_EXISTING_SOURCE_HASH')\n        except Blocked:pass\n        srcp.write_text('existing',encoding='utf-8')\n"
          if 'NEG_EXISTING_SOURCE_HASH' not in t:assert t.count(old5)==1;t=t.replace(old5,new5,1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Execute permanent repair script and full built-in positive-negative test
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 control/startmaster0107/STARTMASTER0107_DUAL_ROOTFIX_REPAIR.py apply-and-test
      - name: Existing entrance and continuity regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 control/deterministic-entrance-gate/repo_ci_test.py
          python3 control/cloud-entry-gate/cloud_repo_ci_test.py
          python3 control/production-continuity/test_production_continuity_guard.py
      - name: Positive proof against real current recovery source
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,json,sys
          from pathlib import Path
          p=Path('control/startmaster0107/STARTMASTER0107_DUAL_ROOTFIX_REPAIR.py');s=importlib.util.spec_from_file_location('dual_source_proof',p);m=importlib.util.module_from_spec(s);sys.modules['dual_source_proof']=m;s.loader.exec_module(m)
          st=json.loads(Path(m.RUNTIME_STATE_REL).read_text());batch=st['batch_sha256'];snap=json.loads(Path(st['source_snapshot_ref']).read_text());first=snap['next_textmachine_metadata_batch']['items'][0];slot=first['plan_slot']
          a=m.augment_current_action(Path('.'),{'allowed_output_root':'q/','item_receipt_schema':{}},{'canonical_article_id':'article:proof','plan_slot':slot});src=a['existing_article_source_binding']
          assert src['ref']==f'control/startmaster0107/recovery_sources/{batch}/ARTICLE_{slot}.md';assert src['sha256']==m.fsha(Path(src['ref']));assert src['optional_for_new_article_generation'] is True
          print(json.dumps({'ok':True,'status':'REAL_CURRENT_EXISTING_ARTICLE_SOURCE_BOUND','ref':src['ref'],'sha256':src['sha256'],'publish_allowed':False},indent=2))
          PY
          test -z "$(git diff --name-only -- .pferde-release/)"
      - name: Remove temporary runner and commit only permanent rootfix and immutable recovery inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/startmaster0107-dual-rootfix-sourcebinding.yml
          find control -type d -name __pycache__ -prune -exec rm -rf {} + || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/CURRENT_STARTMASTER.json control/output-quarantine/runtime_entry_gate.py control/single-door-boundary/codex_current_room_bridge.py control/startmaster0107/CURRENT_STATE.json control/startmaster0107/PFERDE_ATELIER_START_HERE.json control/startmaster0107/STARTMASTER0107_DUAL_ROOTFIX_REPAIR.py control/startmaster0107/STEP_107007_RUN_NEW_ARTICLE_BATCH_NO_STOP.json control/startmaster0107/STEP_107008_FINAL_NEW_ARTICLE_BATCH_REVIEW_AWAIT_USER_PUBLISH.json control/startmaster0107/recovery_sources
          git diff --cached --quiet && exit 1 || true
          git commit -m 'STARTMASTER0107: bind existing 7er source in dual rootfix'
          git push origin HEAD:startmaster0107-dual-rootfix-sourcebinding-20260902

name: Quick public homepage sitemap crosscheck
on:
  push:
    branches:
      - hobbyroom/quick-home-sitemap-check-20261103
permissions:
  contents: read
jobs:
  quick-check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch all sitemap URLs and compare homepage category links
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,xml.etree.ElementTree as ET,html.parser,concurrent.futures
          def fetch(url):
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=10) as r:return r.status,r.url,r.read(2500000)
            except Exception as e: return 0,url,str(e).encode()
          def parse(xml):
            try:
              root=ET.fromstring(xml)
              return root.tag.rsplit("}",1)[-1], [e.text for e in root.iter() if e.tag.rsplit("}",1)[-1]=="loc"]
            except Exception as e:return "ERROR:"+str(e),[]
          class Links(html.parser.HTMLParser):
            def __init__(self):super().__init__();self.hrefs=[]
            def handle_starttag(self,t,a):
              if t=="a":
                h=dict(a).get("href")
                if h:self.hrefs.append(h)
          def norm(base,h):
            q=urllib.parse.urlsplit(urllib.parse.urljoin(base,h))
            if q.netloc.lower().removeprefix("www.")!=urllib.parse.urlsplit(base).netloc.lower().removeprefix("www."):return None
            p=q.path or "/"
            if p.startswith(("/wp-admin","/wp-content","/wp-login","/wp-json","/feed","/account")) or "." in p.split("/")[-1]:return None
            return p if p.endswith("/") else p+"/"
          for base in ["https://www.hobby-depot.de","https://pferde-atelier.de","https://hab-und-bewahr.de"]:
            print("\n===== SITE =====",base,flush=True)
            c,u,b=fetch(base+"/sitemap_index.xml")
            t,locs=parse(b)
            print("SITEMAP",c,t,"CHILD",len(locs),flush=True)
            urls=set()
            with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              for sm,(sc,su,sb) in zip(locs,ex.map(fetch,locs)):
                typ,links=parse(sb)
                print("CHILD",sm,sc,typ,len(links),flush=True)
                urls.update(filter(None,(norm(base,v) for v in links)))
            print("SITEMAP_URLS",len(urls),flush=True)
            c,u,b=fetch(base+"/")
            print("HOMEPAGE",c,"BYTES",len(b),flush=True)
            h=Links();h.feed(b.decode("utf8","replace"))
            linkpaths={norm(base,l) for l in h.hrefs}
            linkpaths.discard(None)
            print("HOME_LINKS",len(linkpaths),"NOT_IN_SITEMAP",len(linkpaths-urls),flush=True)
            for p in sorted(linkpaths-urls)[:75]:
              print("HOME_MISSING",p,flush=True)
          PY

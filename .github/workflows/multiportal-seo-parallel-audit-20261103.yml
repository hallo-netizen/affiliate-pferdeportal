name: Parallel portal XML and category sitemap checks
on:
  push:
    branches:
      - hobbyroom/multiportal-seo-audit-parallel-20261103
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        site: ["HOBBY DEPOT", "HAB & BEWAHR", "PFERDEATELIER"]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AUDIT_SITE: ${{ matrix.site }}
      AUDIT_NAV: "110"
      AUDIT_SEED: "140"
      AUDIT_VERIFY: "400"
    steps:
      - uses: actions/checkout@v4
      - name: Scan public sitemap and linked category levels
        run: python3 -u scripts/multiportal_public_sitemap_audit_20261103.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-sitemap-${{ matrix.site }}
          path: multiportal-seo-audit-20261103.json
          if-no-files-found: warn

name: V6638 Export V6611 Base
on:
  push:
    branches: [v6638-exact-artifact-staging-20260829]
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify base
        run: |
          set -euo pipefail
          sha256sum CODEX_QUELLTEXT_V6611_LIVE_FAIL_EQUAL_CARDS_20260827.zip
          unzip -t CODEX_QUELLTEXT_V6611_LIVE_FAIL_EQUAL_CARDS_20260827.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: v6611-existing-base
          path: CODEX_QUELLTEXT_V6611_LIVE_FAIL_EQUAL_CARDS_20260827.zip
          compression-level: 0
          if-no-files-found: error

name: K0 authoring context accept

on:
  push:
    branches: [konzept0-portal-neutral-20261002]
    paths:
      - 'real_runs/k0/**/AUTHORING_CONTEXT.json'

permissions:
  contents: write

concurrency:
  group: k0-authoring-context-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve exact authoring context
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mapfile -t contexts < <(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- 'real_runs/k0/**/AUTHORING_CONTEXT.json')
          if [ "${#contexts[@]}" -ne 1 ]; then
            echo "K0_REQUIRES_EXACTLY_ONE_AUTHORING_CONTEXT:${#contexts[@]}" >&2
            exit 2
          fi
          context="${contexts[0]}"
          rd="${context%/AUTHORING_CONTEXT.json}"
          [[ "$rd" =~ ^real_runs/k0/[A-Za-z0-9._-]+$ ]] || { echo "K0_RUN_DIR_INVALID:$rd" >&2; exit 2; }
          test -f "$rd/WORDPRESS_INTAKE.json" || { echo "K0_INTAKE_MISSING" >&2; exit 2; }
          test ! -f "$rd/WRITER_JOB.json" || { echo "K0_WRITER_JOB_ALREADY_EXISTS" >&2; exit 2; }
          echo "RUN_DIR=$rd" >> "$GITHUB_ENV"

      - name: Automatic portal assignment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m engine.k0_portal_resolver "$RUN_DIR/WORDPRESS_INTAKE.json" K0_PORTAL_REGISTRY.json > /tmp/k0-portal.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/k0-portal.json'))
          assert x['status']=='PASS' and x['item_count']==1,x
          assert x['items'][0]['status']=='AUTO_DETECTED',x
          print('K0_AUTHORING_PORTAL_PASS')
          PY

      - name: Check real Pferdeatelier link targets before creating writer job
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from engine.k0_full_rules import verify_live_link_targets
          from engine.k0_portal_resolver import wordpress_site_for_portal
          portal=json.load(open('/tmp/k0-portal.json'))
          registry=json.load(open('K0_PORTAL_REGISTRY.json'))
          pid=portal['items'][0]['portal_id']
          site=wordpress_site_for_portal(registry,pid)
          ctx=json.load(open(os.environ['RUN_DIR']+'/AUTHORING_CONTEXT.json'))
          result=verify_live_link_targets(ctx['rule_context'],site)
          assert result['status']=='PASS' and result['checked']==3,result
          print('K0_LIVE_LINK_TARGETS_PASS:'+pid)
          PY

      - name: Bind unique run instance and prepare canonical writer job
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          rd=os.environ['RUN_DIR']
          p=pathlib.Path(rd)/'AUTHORING_CONTEXT.json'
          x=json.loads(p.read_text())
          x['run_instance_id']='run:'+hashlib.sha256(rd.encode()).hexdigest()[:24]
          pathlib.Path('/tmp/K0_AUTHORING_CONTEXT_BOUND.json').write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n')
          print(x['run_instance_id'])
          PY
          python3 -m engine.k0_product_property_research bind /tmp/K0_AUTHORING_CONTEXT_BOUND.json K0_PRODUCT_PROPERTY_STORE.json /tmp/K0_PRODUCT_PROPERTY_STORE_NEXT.json > /tmp/k0-property-research.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/k0-property-research.json'))
          assert x['status'] in {'PASS','NOT_REQUIRED'},x
          print('K0_PROPERTY_RESEARCH_'+x['status'])
          PY
          python3 -m engine.k0_writer_station prepare "$RUN_DIR/WORDPRESS_INTAKE.json" /tmp/k0-portal.json /tmp/K0_AUTHORING_CONTEXT_BOUND.json /tmp/WRITER_JOB.json
          python3 - <<'PY'
          import json,os
          j=json.load(open('/tmp/WRITER_JOB.json'))
          assert j['contract']=='K0_WRITER_JOB_V1'
          assert j['status']=='OPEN'
          assert j['publish_allowed'] is False
          assert j['writer_rule_bundle']['contract']=='K0_FULL_RULE_BUNDLE_V1',j
          assert j['writer_rule_binding']['article_hard_rule_count']>0,j
          assert j['rule_context']['contract']=='K0_AUTHORING_RULE_CONTEXT_V1',j
          print('K0_WRITER_ALL_RULES_BOUND_BEFORE_WRITING')
          PY

      - name: Persist immutable writer job
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/WRITER_JOB.json "$RUN_DIR/WRITER_JOB.json"
          if ! cmp -s K0_PRODUCT_PROPERTY_STORE.json /tmp/K0_PRODUCT_PROPERTY_STORE_NEXT.json; then
            cp /tmp/K0_PRODUCT_PROPERTY_STORE_NEXT.json K0_PRODUCT_PROPERTY_STORE.json
          fi
          git config user.name 'k0-authoring-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$RUN_DIR/WRITER_JOB.json" K0_PRODUCT_PROPERTY_STORE.json
          git commit -m "K0: prepare canonical writer job"
          # Separate events may arrive together; never drop an event or overwrite another job.
          # Retry only clean, conflict-free rebases. A changed same-path payload blocks.
          for attempt in $(seq 1 24); do
            if git push; then
              echo "K0_WRITER_JOB_PERSISTED"
              exit 0
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "K0_WRITER_JOB_PERSIST_RETRIES_EXHAUSTED" >&2
              exit 2
            fi
            git fetch origin "$GITHUB_REF_NAME"
            if ! git -c rebase.autoStash=false rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              echo "K0_WRITER_JOB_PERSIST_CONFLICT_BLOCKED" >&2
              exit 2
            fi
            sleep 1
          done

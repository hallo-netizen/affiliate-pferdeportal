name: Hobby Depot HD-003 1.50.795 Footer Links - Exact ZIP QA
on:
  push:
    branches:
      - hobbyroom/hd003-150795-footer-service-agb-20261102
    paths:
      - control/hobby-depot/hd003-footer-150795-build.py
      - .github/workflows/hobby-depot-hd003-footer-150795.yml
permissions:
  contents: write
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP CLI if needed
        run: |
          if ! command -v php >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y php-cli; fi
      - name: Rebuild and verify precise full ZIP
        run: |
          python3 control/hobby-depot/hd003-footer-150795-build.py
      - name: Upload independently downloadable tested plugin
        uses: actions/upload-artifact@v4
        with:
          name: hobby-depot-hd003-1.50.795-footer-links
          path: dist/HOBBY_DEPOT_HD003_1.50.795_FOOTER_AGB_WERBEBEDINGUNGEN_VOLLPLUGIN.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish release without touching installed WordPress
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create hobby-depot-hd003-1.50.795 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Hobby Depot HD003 1.50.795 — Footer AGB & Werbebedingungen" \
            --notes "Geprüftes Vollplugin aus der freigegebenen 1.50.794. Nur zwei PHP-Dateien angepasst: Werbebedingungen unter Service; AGB unter Rechtliches ergänzt falls fehlend. Sonstige Plugin-Dateien unverändert. WordPress-Livetest steht noch aus." \
            "dist/HOBBY_DEPOT_HD003_1.50.795_FOOTER_AGB_WERBEBEDINGUNGEN_VOLLPLUGIN.zip"

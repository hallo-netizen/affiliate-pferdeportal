name: System4A temp propagate V2 binding
on:
  push:
    branches:
      - hobbyroom/system4a-v2-handoff-107008-20260917
permissions:
  contents: write
jobs:
  propagate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hobbyroom/system4a-v2-handoff-107008-20260917
      - name: Propagate exact bundle and state hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          state=Path('control/startmaster0107/CURRENT_STATE.json')
          root=Path('control/startmaster0107/PFERDE_ATELIER_START_HERE.json')
          old_bundle='5a0cae66efa26b845aefa053ff1bf70aff4354757adf6c09dc67c87fde497617'
          new_bundle='6bb9171c10f5b0ab432bb2f6615b911b7612f6ba1798351f0f820982dec34039'
          sb=state.read_bytes()
          old_state=hashlib.sha256(sb).hexdigest()
          if old_state!='c912acca2ccac4fa79e6d916874ace181424492ebbdb765d2c79fcb2300fa35c':
              raise SystemExit('UNEXPECTED_CURRENT_STATE_SHA:'+old_state)
          text=sb.decode('utf-8')
          if text.count(old_bundle)!=2:
              raise SystemExit('BUNDLE_HASH_OCCURRENCE_MISMATCH:'+str(text.count(old_bundle)))
          state.write_text(text.replace(old_bundle,new_bundle),encoding='utf-8')
          new_state=hashlib.sha256(state.read_bytes()).hexdigest()
          rt=root.read_text(encoding='utf-8')
          if rt.count(old_state)!=1:
              raise SystemExit('CURRENT_STATE_REF_OCCURRENCE_MISMATCH:'+str(rt.count(old_state)))
          root.write_text(rt.replace(old_state,new_state),encoding='utf-8')
          print('NEW_CURRENT_STATE_SHA='+new_state)
          print('NEW_START_HERE_SHA='+hashlib.sha256(root.read_bytes()).hexdigest())
          PY
          git diff --check
          git diff -- control/startmaster0107/CURRENT_STATE.json control/startmaster0107/PFERDE_ATELIER_START_HERE.json
      - name: Commit exact propagation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/startmaster0107/CURRENT_STATE.json control/startmaster0107/PFERDE_ATELIER_START_HERE.json
          git commit -m 'system4: propagate V2 107008 binding hashes'
          git push origin HEAD:hobbyroom/system4a-v2-handoff-107008-20260917

      - name: Retire old eBay PRIVATE WordPress posts in the existing canonical worker, NEVER native HivePress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil,re
          root=Path('/tmp/ebay_legacy_drafts')
          shutil.copytree('release/affiliate-zentrale/current/affiliate-portal-router',root/'affiliate-portal-router',dirs_exist_ok=True)
          text=Path('release/affiliate-zentrale/evidence/EBAY_672308_TO_672311_BUSINESS_ONLY_GESAMTURSACHENPATCH_NUR_TEST.patch').read_text()
          path='affiliate-portal-router/includes/trait-ppar-ebay-run.php'
          section=text.split('diff --git a/'+path+' b/'+path,1)[1].split('\ndiff --git ',1)[0]
          head,*hunks=re.split(r'(?=^@@ )',section,flags=re.M)
          selected=[x for x in hunks if x.startswith('@@ ') and '@@ EBAY_PRIVATE_LEGACY_RETIRE_ON_CANONICAL_WORKER' in x.split('\n',1)[0]]
          assert len(selected)==1, 'One existing worker, one targeted archival mutation'
          (root/'retire.patch').write_text(head+''.join(selected).rstrip('\n')+'\n')
          PY
          cd /tmp/ebay_legacy_drafts
          git apply --check retire.patch
          git apply retire.patch
          php -l affiliate-portal-router/includes/trait-ppar-ebay-run.php
          cat > retire.php <<'PHP'
          <?php
          error_reporting(E_ALL);
          define('ABSPATH','/');define('ARRAY_A','ARRAY_A');
          $POSTS=array();$SAVED=array();$LAST_QUERY=array();$UPDATES=array();$FAIL_ID=0;
          function absint($n){return abs((int)$n);}
          function sanitize_key($x){return strtolower(preg_replace('/[^a-z0-9_-]/','',strtolower((string)$x)));}
          function sanitize_text_field($x){return trim((string)$x);}
          function get_post_meta($id,$key,$single=true){global $POSTS;return $POSTS[$id]['meta'][$key]??'';}
          function get_posts($args){
              global $POSTS,$LAST_QUERY;
              $LAST_QUERY=$args;
              $ret=array();
              foreach($POSTS as $id=>$post){
                  if($post['type']!=='hp_listing'||$post['status']!=='publish')continue;
                  $marker=(string)($post['meta']['_ppar_ebay_item_id']??'');
                  if($marker==='')continue;
                  $ret[]=$id;
              }
              return array_slice($ret,0,$args['posts_per_page']??-1);
          }
          class WP_Error {public $code;function __construct($code){$this->code=$code;}}
          function is_wp_error($v){return $v instanceof WP_Error;}
          function wp_update_post($args,$wp_error=false){
              global $POSTS,$UPDATES,$FAIL_ID;
              $id=(int)$args['ID'];
              if($id===$FAIL_ID)return new WP_Error('write_denied');
              $UPDATES[]=array('id'=>$id,'status'=>$args['post_status']);
              $POSTS[$id]['status']=$args['post_status'];
              return $id;
          }
          require 'affiliate-portal-router/includes/trait-ppar-ebay-run.php';
          class RetireTest {
              use PPAR_Ebay_Run_Trait;
              public $run=array('progress_seq'=>0,'no_progress_count'=>5),$fails=array(),$maint=0,$phase='';
              private function ebay_run_load(){return $this->run;}
              private function ebay_run_save($x){$this->run=$x;return $x;}
              private function ebay_run_fail($code,$message,$data=array()){$this->fails[]=$code;}
              private function run_ebay_maintenance_v2($n,$a,$b,$c){$this->maint++;return array();}
              private function ebay_run_capture_component_state($a,$b){}
              private function ebay_maintenance_state_load(){return array('finished'=>1);}
              private function ebay_maintenance_state_is_current($x){return true;}
              private function ebay_run_set_phase($p,$reason=''){$this->phase=$p;}
              public function tick(){$this->ebay_run_tick_reconcile($this->run,array());}
          }
          function ok($v,$name){if(!$v){fwrite(STDERR,"FAIL ".$name."\n");exit(1);}echo "PASS ".$name."\n";}
          function seed($n){global $POSTS,$UPDATES,$FAIL_ID;
            $POSTS=array();$UPDATES=array();$FAIL_ID=0;
            for($i=1;$i<=$n;$i++){$POSTS[1000+$i]=array('type'=>'hp_listing','status'=>'publish','meta'=>array('_ppar_ebay_item_id'=>'old-ebay-'.$i));}
            $POSTS[9000]=array('type'=>'hp_listing','status'=>'publish','meta'=>array());
            $POSTS[9001]=array('type'=>'hp_listing','status'=>'publish','meta'=>array('_ppar_ebay_item_id'=>''));
            $POSTS[9002]=array('type'=>'post','status'=>'publish','meta'=>array('_ppar_ebay_item_id'=>'unrelated')); }
          seed(32);$x=new RetireTest();$x->tick();
          ok(count($UPDATES)===25,'First existing canonical tick retires at most 25 old eBay posts');
          ok($x->maint===0,'Maintenance/publication does not start before full eBay legacy retirement');
          ok($x->run['progress_seq']===1&&$x->run['no_progress_count']===0,'Work is marked as progress to prevent false worker watchdog stall');
          ok($LAST_QUERY['suppress_filters']===true&&$LAST_QUERY['post_type']==='hp_listing','Only existing WordPress listing search is used');
          ok($LAST_QUERY['meta_query'][0]['key']==='_ppar_ebay_item_id'&&$LAST_QUERY['meta_query'][0]['compare']==='!=','Only eBay-marked legacy posts qualify');
          $x->tick();
          ok(count($UPDATES)===32,'Next bounded tick retires remaining 7 old eBay posts');
          ok($x->maint===1&&$x->phase==='refresh_remote','Normal canonical maintenance resumes after exact legacy posts are retired');
          ok($POSTS[9000]['status']==='publish','Native HivePress listing is never mutated');
          ok($POSTS[9001]['status']==='publish','Empty eBay marker cannot retire a user listing');
          ok($POSTS[9002]['status']==='publish','Ordinary article with irrelevant meta cannot be changed');
          ok(count(array_filter($UPDATES,fn($x)=>$x['status']!=='draft'))===0,'Retired eBay posts are drafted, never deleted');
          $y=new RetireTest();$y->tick();
          ok($y->maint===1&&count($UPDATES)===32,'Repeat run is idempotent: no duplicate public post mutation');
          seed(4);$FAIL_ID=1002;$z=new RetireTest();$z->tick();
          ok($z->fails===array('private_legacy_retirement_write_failed'),'Failure writing one old eBay post stops canonical flow');
          ok($z->maint===0,'Worker cannot publish before a failed retirement is repaired');
          ok($POSTS[9000]['status']==='publish','Native listing preserved even if a legacy update fails');
          echo "EBAY_LEGACY_DRAFTS 15/15 PASS; REFERENCE PHP. LIVE WP/SITEMAP STILL UNTESTED\n";
          PHP
          php -l retire.php
          php retire.php | tee retire.log
          test "$(grep -c '^PASS ' retire.log)" = 15
          grep -F 'EBAY_LEGACY_DRAFTS 15/15 PASS' retire.log

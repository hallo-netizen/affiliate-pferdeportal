name: Pferdeatelier eBay BUSINESS-only reference source QA
on:
  push:
    branches: [affiliate-release-current]
    paths:
      - 'release/affiliate-zentrale/evidence/EBAY_672308_TO_672311_BUSINESS_ONLY_GESAMTURSACHENPATCH_NUR_TEST.patch'
      - '.github/workflows/ebay-business-only-hardlock-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  business-only-reference-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only the new business-only edits to the available original-reference code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ebay_business_qa
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/ebay_business_qa/affiliate-portal-router
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('release/affiliate-zentrale/evidence/EBAY_672308_TO_672311_BUSINESS_ONLY_GESAMTURSACHENPATCH_NUR_TEST.patch').read_text()
          pieces=re.split(r'(?=^diff --git )',src,flags=re.M)
          diff='';n=0
          for piece in pieces:
              if not piece.startswith('diff --git '):continue
              head,*hunks=re.split(r'(?=^@@ )',piece,flags=re.M)
              selected=[h for h in hunks if h.startswith('@@ ') and '@@ BUSINESS_ONLY' in h.split('\n',1)[0]]
              if selected: diff+=head+''.join(selected);n+=len(selected)
          assert n==12,f'Expected 12 BUSINESS-only hardlock hunks in the SINGLE 6.72.311 cumulative patch, got {n}'
          Path('/tmp/ebay_business_qa/business-only.patch').write_text(diff)
          print('PASS 12 business-only hunks belong to single cumulative eBay 6.72.311 candidate')
          PY
          cd /tmp/ebay_business_qa
          git apply --check business-only.patch
          git apply business-only.patch
          php -l affiliate-portal-router/includes/trait-ppar-ebay.php
          php -l affiliate-portal-router/includes/trait-ppar-ebay-run.php
      - name: Exercise real PHP BUSINESS-only source and all legacy-private gates
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ebay_business_qa/test.php <<'PHP'
          <?php
          error_reporting(E_ALL);
          define('ABSPATH','/');define('ARRAY_A','ARRAY_A');
          function absint($v){return abs((int)$v);}
          function sanitize_key($v){return strtolower(preg_replace('/[^a-z0-9_-]/','',strtolower((string)$v)));}
          function sanitize_text_field($v){return trim((string)$v);}
          function wp_json_encode($v){return json_encode($v);}
          $TEST_META=array();
          function get_post_meta($id,$key,$single=true){global $TEST_META;return $TEST_META[$id][$key]??'';}
          require 'affiliate-portal-router/includes/trait-ppar-ebay.php';
          require 'affiliate-portal-router/includes/trait-ppar-ebay-run.php';
          class BusinessOnlyTest {
              use PPAR_Ebay_Trait, PPAR_Ebay_Run_Trait;
              public $last_checkpoint=array();public $run=array();
              private function ebay_catalog_rules(){return array();}
              private function ebay_is_backend_admin_screen_request(){return false;}
              private function ebay_query_allows_private_ebay($query,$category_term_ids=null){return true;}
              private function ebay_public_source_rows_by_item_ids($ids,$seller){return array();}
              private function ebay_private_parent_term(){return null;}
              public function publicNativeArchive($posts){return $this->ebay_filter_stale_posts($posts,null);}
              private function ebay_public_checkpoint_load(){return array('checkpoint_id'=>'old-safe','private_listing_ids'=>array(12,13),'business_campaign_ids'=>array(99));}
              private function ebay_public_checkpoint_is_safe($c){return !empty($c['checkpoint_id']);}
              private function ebay_public_checkpoint_save($c){$this->last_checkpoint=$c;return $c;}
              private function ebay_run_load(){return $this->run;}
              private function ebay_run_save($r){$this->run=$r;return $r;}
              public function route($seller,$s){return $this->ebay_route_enabled($seller,$s);}
              public function scope($scope,$s){return $this->ebay_selection_scope_for_enabled_routes($scope,$s);}
              public function refreshSql($s){return $this->ebay_refresh_enabled_route_sql($s,'e');}
              public function oldPrivate(){return $this->ebay_public_checkpoint_private_ids();}
              public function allowOldPrivate($id){return $this->ebay_public_checkpoint_allows_private_listing($id);}
              public function runtimeScope($r){return $this->ebay_run_selection_scope($r);}
              public function privateGate($s){return $this->ebay_run_verify_private_public($s,array(12,13));}
              public function publicPrivateListing($id){return $this->ebay_public_listing_post($id);}
              public function commit($r){return $this->ebay_run_commit_public_checkpoint($r,array(),array());}
          }
          function check($condition,$label){if(!$condition){fwrite(STDERR,"FAIL ".$label."\n");exit(1);}echo "PASS ".$label."\n";}
          $x=new BusinessOnlyTest();$legacy=array('private_enabled'=>true,'business_enabled'=>true,'private_auto_publish'=>true);
          check($x->ebay_settings_defaults()['private_enabled']===false,'Defaults never enable PRIVATE');
          $norm=$x->ebay_normalize_settings($legacy);
          check($norm['private_enabled']===false,'Old saved TRUE private route overridden');
          check($norm['private_auto_publish']===false,'Old automatic PRIVATE publication overridden');
          check($norm['business_enabled']===true,'BUSINESS remains active');
          check($x->route('INDIVIDUAL',$legacy)===false,'Even raw old settings cannot admit PRIVATE');
          check($x->route('BUSINESS',$legacy)===true,'Business accepted unchanged');
          check($x->scope('all',$legacy)==='business','Old ALL selection narrowed to BUSINESS');
          check($x->scope('private',$legacy)==='','Explicit PRIVATE selection refused');
          check($x->scope('business',$legacy)==='business','Explicit BUSINESS selection preserved');
          $sql=$x->refreshSql($legacy);
          check(strpos($sql,'INDIVIDUAL')===false&&strpos($sql,'BUSINESS')!==false,'Refresh SQL scans BUSINESS only');
          check($x->oldPrivate()===array(),'Old checkpoint PRIVATE IDs excluded');
          check($x->allowOldPrivate(12)===false,'Previously safe PRIVATE checkpoint cannot publish');
          check($x->runtimeScope(array('config_snapshot'=>array('seller_routes'=>array('private'=>true,'business'=>true))))==='business','Old active run forced BUSINESS-only');
          check(($x->privateGate($legacy)['status']??'')==='disabled','PRIVATE public gate permanently retired');
          check($x->publicPrivateListing(12)===null,'PRIVATE custom listing rendering blocked');
          global $TEST_META;
          $TEST_META=array(12=>array('_ppar_ebay_item_id'=>'legacy-individual'),31=>array());
          $old=(object)array('ID'=>12,'post_type'=>'hp_listing','post_status'=>'publish');
          $native=(object)array('ID'=>31,'post_type'=>'hp_listing','post_status'=>'publish');
          $archive=$x->publicNativeArchive(array($old,$native));
          check(count($archive)===1&&$archive[0]->ID===31,'Native HivePress archive hides old published eBay listing');
          check(in_array($native,$archive,true),'Unrelated native HivePress listing remains visible');
          $c=$x->commit(array('run_uuid'=>'hardlock','checkpoint_candidate'=>array('private_listing_ids'=>array(12,13),'business_campaign_ids'=>array(99))));
          check(($c['private_listing_ids']??null)===array(),'No PRIVATE IDs written to next public checkpoint');
          check(($c['business_campaign_ids']??null)===array(99),'Business IDs kept in new public checkpoint');
          echo "EBAY_BUSINESS_ONLY_REFERENCE 19/19 PASS; NO ORIGINAL ZIP OR LIVE E2E\n";
          PHP
          cd /tmp/ebay_business_qa
          php -l test.php
          php test.php | tee results.log
          test "$(grep -c '^PASS ' results.log)" = 19
          grep -F 'EBAY_BUSINESS_ONLY_REFERENCE 19/19 PASS' results.log

      - name: Execute actual PHP discovery and gap-contract regressions from the cumulative patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,shutil
          root=Path('/tmp/ebay_business_flow')
          src=Path('release/affiliate-zentrale/current/affiliate-portal-router')
          shutil.copytree(src,root/'affiliate-portal-router',dirs_exist_ok=True)
          patch=Path('release/affiliate-zentrale/evidence/EBAY_672308_TO_672311_BUSINESS_ONLY_GESAMTURSACHENPATCH_NUR_TEST.patch').read_text()
          chosen={}
          for piece in re.split(r'(?=^diff --git )',patch,flags=re.M):
              if not piece.startswith('diff --git '):continue
              head,*hunks=re.split(r'(?=^@@ )',piece,flags=re.M)
              path=head.split(' b/',1)[1].splitlines()[0]
              needles= {
                'affiliate-portal-router/includes/trait-ppar-ebay.php':[
                  "if (count($reasons) === 1 && $reasons[0] === 'transient_retry_exhausted')",
                ],
                'affiliate-portal-router/includes/trait-ppar-ebay-run.php':[
                  "private function ebay_run_transient_supply_warning($job)",
                  "$coverage['contract_status']=$technical?'complete_with_technical_gaps'",
                ],
              }.get(path,[])
              selected=[h for h in hunks if any(n in h for n in needles)]
              if selected:chosen[path]=head+''.join(selected)
          assert len(chosen)==2 and sum(len(re.findall(r'^@@ ',x,re.M)) for x in chosen.values())==3, "Expected exact 3 causal hunks"
          (root/'flow.patch').write_text(''.join(chosen.values()))
          print('PASS exactly 3 real cumulative source hunks selected; independent of earlier 12 seller-route hardlocks')
          PY
          cd /tmp/ebay_business_flow
          git apply --check flow.patch
          git apply flow.patch
          php -l affiliate-portal-router/includes/trait-ppar-ebay.php
          php -l affiliate-portal-router/includes/trait-ppar-ebay-run.php
          cat > flow.php <<'PHP'
          <?php
          error_reporting(E_ALL);
          define('ABSPATH','/'); define('ARRAY_A','ARRAY_A');
          function absint($x){return abs((int)$x);}
          function sanitize_key($x){return strtolower(preg_replace('/[^a-z0-9_-]/','',strtolower((string)$x)));}
          function sanitize_text_field($x){return trim((string)$x);}
          function wp_json_encode($x){return json_encode($x);}
          require 'affiliate-portal-router/includes/trait-ppar-ebay.php';
          require 'affiliate-portal-router/includes/trait-ppar-ebay-run.php';
          class FlowTest {
              use PPAR_Ebay_Trait, PPAR_Ebay_Run_Trait;
              private function ebay_business_required_product_concept_ids(){return array('sattel','zaumzeug');}
              public function completion($stats){return $this->ebay_sync_completion_state(array('summary'=>array('profile_stats'=>$stats)));}
              public function warning($stats){return $this->ebay_run_transient_supply_warning(array('summary'=>array('profile_stats'=>$stats)));}
              public function gaps($run,$coverage){return $this->ebay_run_business_safe_supply_gap_contract($run,$coverage);}
          }
          function ok($test,$label){if(!$test){fwrite(STDERR,"FAIL ".$label."\n");exit(1);}echo "PASS ".$label."\n";}
          $x=new FlowTest();
          $good=array(array('complete'=>true),array('complete'=>true));
          $transient=array(array('complete'=>false,'stopped_reason'=>'transient_retry_exhausted','expected_business_concept_id'=>'sattel'));
          $permanent=array(array('complete'=>false,'stopped_reason'=>'request_error','expected_business_concept_id'=>'zaumzeug'));
          ok($x->completion($good)['status']==='completed','All complete profiles produce normal completion');
          ok($x->completion($transient)['status']==='completed_with_technical_gaps','Only exhausted transient is a technical-gap completion');
          ok($x->completion($permanent)['status']==='partial','Permanent request error cannot become technical-gap completion');
          ok($x->completion(array_merge($transient,$permanent))['status']==='partial','Mixed transient and permanent errors remain blocked');
          ok($x->completion(array(array('complete'=>false)))['status']==='partial','Unknown incomplete profile cannot become success');
          $w=$x->warning(array_merge($good,$transient));
          ok($w['profile_count']===1&&$w['concepts']===array('sattel'),'Transient warning is tied to exact real family');
          ok($w['unknown_scope_count']===0&&$w['error_code']==='ebay_search_transient_retry_exhausted','Transient diagnostic is durable and scoped');
          $unknown=$x->warning(array(array('complete'=>false,'stopped_reason'=>'transient_retry_exhausted')));
          ok($unknown['unknown_scope_count']===1&&$unknown['concepts']===array(),'Unknown transient scope cannot be falsely mapped to one family');
          $run=array(
            'run_uuid'=>'test',
            'gapfill'=>array(
              'attempts'=>1,'missing'=>array('sattel','zaumzeug'),
              'selection_proof'=>array(
                'status'=>'complete','reason'=>'canonical_gapfill',
                'selection_scope'=>'business','owner'=>'run:test','business_target_mode'=>'gapfill',
                'business_target_concepts'=>array('sattel','zaumzeug'),'selected_concepts'=>array()
              )
            )
          );
          $cov=array('required'=>2,'covered'=>0,'missing'=>array('sattel','zaumzeug'));
          $g=$x->gaps($run,$cov);
          ok($g['status']==='pass'&&$g['coverage']['contract_status']==='complete_with_safe_supply_gaps','Only fully checked absent supply is an ordinary gap');
          ok($g['coverage']['exceptions']['sattel']['approved']===0,'Unfilled normal gap does not publish');
          $run['gapfill']['technical_supply_warning']=$w;
          $g=$x->gaps($run,$cov);
          ok($g['status']==='pass'&&$g['coverage']['contract_status']==='complete_with_technical_gaps','Temporary provider failures remain separate from verified empty supply');
          ok($g['coverage']['exceptions']['sattel']['code']==='technical_supply_unverified','Affected family not falsely reported empty');
          ok($g['coverage']['exceptions']['zaumzeug']['code']==='safe_supply_gap_open','Independent checked family keeps its real classification');
          $run['gapfill']['technical_supply_warning']=$unknown;
          $g=$x->gaps($run,$cov);
          ok($g['status']==='pass'&&$g['coverage']['technical_gap_count']===2,'Unknown failed profile conservatively marks all gaps unverified');
          $run['gapfill']['technical_supply_warning']=array('concepts'=>array('not-in-expected-products'));
          $g=$x->gaps($run,$cov);
          ok($g['status']==='failed'&&$g['error_code']==='business_safe_gap_technical_scope_mismatch','Mismatched source scope cannot be used as proof');
          unset($run['gapfill']['technical_supply_warning']);
          $bad=$cov; $bad['covered']=1;
          $g=$x->gaps($run,$bad);
          ok($g['status']==='failed'&&$g['error_code']==='business_coverage_state_inconsistent','Coverage inconsistency fails closed');
          echo "EBAY_CAUSAL_FLOW_REFERENCE 16/16 PASS; NOT FULL ORIGINAL E2E\n";
          PHP
          php -l flow.php
          php flow.php | tee flow.log
          test "$(grep -c '^PASS ' flow.log)" = 16
          grep -F 'EBAY_CAUSAL_FLOW_REFERENCE 16/16 PASS' flow.log

      - name: Prove old in-flight PRIVATE selections cannot resume or publish after upgrade
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil,re
          patch=Path('release/affiliate-zentrale/evidence/EBAY_672308_TO_672311_BUSINESS_ONLY_GESAMTURSACHENPATCH_NUR_TEST.patch').read_text()
          root=Path('/tmp/ebay_legacy_qa')
          shutil.copytree('release/affiliate-zentrale/current/affiliate-portal-router',root/'affiliate-portal-router',dirs_exist_ok=True)
          diff='';count=0;legacy=0;hard=0
          for part in re.split(r'(?=^diff --git )',patch,flags=re.M):
              if not part.startswith('diff --git '):continue
              head,*hunks=re.split(r'(?=^@@ )',part,flags=re.M)
              selected=[]
              for h in hunks:
                  if not h.startswith('@@ '):continue
                  title=h.split('\n',1)[0]
                  if '@@ BUSINESS_ONLY' in title or '@@ LEGACY_RUN_GUARD' in title:
                      selected.append(h)
                      if '@@ LEGACY_RUN_GUARD' in title:legacy+=1
                      else:hard+=1
              if selected:diff+=head+''.join(selected);count+=len(selected)
          assert count==17 and hard==12 and legacy==5, (count,hard,legacy)
          (root/'legacy.patch').write_text(diff)
          print('PASS 12 seller hardlocks and 5 phase transition guards assembled from ONE cumulative 6.72.311 patch')
          PY
          cd /tmp/ebay_legacy_qa
          git apply --check legacy.patch
          git apply legacy.patch
          php -l affiliate-portal-router/includes/trait-ppar-ebay.php
          php -l affiliate-portal-router/includes/trait-ppar-ebay-run.php
          cat > legacy.php <<'PHP'
          <?php
          error_reporting(E_ALL);
          define('ABSPATH','/'); define('ARRAY_A','ARRAY_A');
          function absint($x){return abs((int)$x);}
          function sanitize_key($x){return strtolower(preg_replace('/[^a-z0-9_-]/','',strtolower((string)$x)));}
          function sanitize_text_field($x){return trim((string)$x);}
          function wp_json_encode($x){return json_encode($x);}
          require 'affiliate-portal-router/includes/trait-ppar-ebay.php';
          require 'affiliate-portal-router/includes/trait-ppar-ebay-run.php';
          class LegacyTest {
              use PPAR_Ebay_Trait, PPAR_Ebay_Run_Trait;
              public $run=array(),$selection=array(),$failure='',$processed=0,$private_mutations=0,$completed=0;
              private function ebay_run_load(){return $this->run;}
              private function ebay_run_save($v){$this->run=$v;return $v;}
              private function ebay_run_fail($c,$m,$details=array()){$this->failure=$c;}
              private function ebay_run_complete($manifest=array()){$this->completed++;$this->run['status']='completed';}
              private function ebay_selection_state_load(){return $this->selection;}
              private function ebay_selection_state_is_open($s){return in_array($s['status']??'',array('pending','running'),true);}
              private function ebay_selection_process_tick($s,$sel){$this->processed++;return $sel;}
              private function ebay_selection_prune_business_batch($s,&$p,$limit,$force,$staging){$p['checkpoint_business_cleanup_done']=1;}
              private function ebay_selection_apply_private_post_batch($s,&$p,$limit,$force,$staging){$this->private_mutations++;}
              private function ebay_run_checkpoint_cleanup_fail_if_needed($plan,$route){return false;}
              public function sel($saved){$this->selection=$saved;$this->run=array('run_uuid'=>'u','phase'=>'selection_prepare','config_snapshot'=>array('seller_routes'=>array('private'=>true,'business'=>true)));$this->ebay_run_tick_selection($this->run,array('business_enabled'=>true,'private_enabled'=>false));}
              public function gapSel($saved){$this->selection=$saved;$this->run=array('run_uuid'=>'u','gapfill'=>array(),'config_snapshot'=>array('seller_routes'=>array('private'=>true,'business'=>true)));$this->ebay_run_tick_gapfill_select($this->run,array('business_enabled'=>true,'private_enabled'=>false));}
              public function cleanup($kind,$plan){$this->run=array('run_uuid'=>'u','status'=>'running','config_snapshot'=>array('seller_routes'=>array('private'=>true,'business'=>true)),'checkpoint_verified_manifest'=>array('business'=>array('status'=>'pass')));$this->ebay_run_tick_checkpoint_cleanup(array_merge($this->run,array('checkpoint_cleanup_selection'=>$plan)),array('business_enabled'=>true),$kind);}
          }
          function ok($v,$s){if(!$v){fwrite(STDERR,"FAIL ".$s."\n");exit(1);}echo "PASS ".$s."\n";}
          $x=new LegacyTest();
          $x->sel(array('status'=>'running','selection_scope'=>'all'));
          ok($x->failure==='business_only_legacy_selection_blocked','Upgraded ALL selection stopped BEFORE private materialisation');
          ok($x->processed===0,'No old ALL selection worker executed');
          $x=new LegacyTest();
          $x->sel(array('status'=>'complete','selection_scope'=>'private'));
          ok($x->failure==='business_only_legacy_selection_blocked','Completed legacy PRIVATE selection cannot publish its winners');
          $x=new LegacyTest();
          $x->gapSel(array('status'=>'running','selection_scope'=>'all'));
          ok($x->failure==='business_only_legacy_gapfill_selection_blocked','Persisted ALL gapfill stopped before old mutation');
          ok($x->processed===0,'No retired gapfill selection processed');
          $x=new LegacyTest();
          $x->gapSel(array('status'=>'complete','selection_scope'=>'private'));
          ok($x->failure==='business_only_legacy_gapfill_selection_blocked','Persisted PRIVATE gapfill completion cannot be reused');
          $x=new LegacyTest();
          $x->cleanup('private',array('status'=>'running','private_post_cursor'=>1));
          ok($x->completed===1&&$x->private_mutations===0,'Old PRIVATE cleanup skipped without mutation');
          $x=new LegacyTest();
          $x->cleanup('business',array('status'=>'running','phase'=>'business_prune','business_prune_cursor'=>0));
          ok($x->completed===1&&$x->private_mutations===0,'After BUSINESS cleanup old snapshot cannot restart PRIVATE cleanup');
          echo "EBAY_LEGACY_ACTIVE_RUN 8/8 PASS; ORIGINAL 6.72.308 STILL NOT LIVE-REPLAYED\n";
          PHP
          php -l legacy.php
          php legacy.php | tee legacy.log
          test "$(grep -c '^PASS ' legacy.log)" = 8
          grep -F 'EBAY_LEGACY_ACTIVE_RUN 8/8 PASS' legacy.log

      - name: Execute real PHP BUSINESS source-to-public-card visibility contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,shutil
          root=Path('/tmp/ebay_business_card_qa')
          shutil.copytree('release/affiliate-zentrale/current/affiliate-portal-router',root/'affiliate-portal-router',dirs_exist_ok=True)
          src=Path('release/affiliate-zentrale/evidence/EBAY_672308_TO_672311_BUSINESS_ONLY_GESAMTURSACHENPATCH_NUR_TEST.patch').read_text()
          target='affiliate-portal-router/includes/trait-ppar-ebay.php'
          section=src.split('diff --git a/'+target+' b/'+target,1)[1].split('\ndiff --git ',1)[0]
          head,*hunks=re.split(r'(?=^@@ )',section,flags=re.M)
          required=[
              'route_state,fresh_until,item_end_at',
              "absint($row['fresh_until'] ?? 0) <= time()",
          ]
          chosen=[h for h in hunks if h.startswith('@@ ') and any(x in h for x in required)]
          assert len(chosen)==3, f'Expected 3 source+display freshness hunks, got {len(chosen)}'
          (root/'cards.patch').write_text(head+''.join(chosen))
          PY
          cd /tmp/ebay_business_card_qa
          git apply --check cards.patch
          git apply cards.patch
          php -l affiliate-portal-router/includes/trait-ppar-ebay.php
          cat > cards.php <<'PHP'
          <?php
          error_reporting(E_ALL);
          define('ABSPATH','/'); define('ARRAY_A','ARRAY_A');
          $META=array(); $DBROW=array();
          function absint($x){return abs((int)$x);}
          function sanitize_key($x){return strtolower(preg_replace('/[^a-z0-9_-]/','',strtolower((string)$x)));}
          function sanitize_text_field($x){return trim((string)$x);}
          function get_post_meta($id,$key,$single=true){global $META;return $META[$id][$key]??'';}
          class FakeDB {
              public $last_sql='';
              function prepare($sql,$s){return str_replace('%s',"'".addslashes((string)$s)."'",$sql);}
              function get_row($sql,$mode){global $DBROW;$this->last_sql=$sql;
                  if(strpos($sql,'fresh_until')===false)return array_diff_key($DBROW,array('fresh_until'=>true));
                  return $DBROW;
              }
          }
          require 'affiliate-portal-router/includes/trait-ppar-ebay.php';
          class CardTest {
              use PPAR_Ebay_Trait;
              public $checkpoint=true,$content_block='';
              private function ebay_request_local_read_cache_allowed(){return false;}
              private function ebay_items_table(){return 'mock_ebay_rows';}
              private function ebay_public_checkpoint_allows_business_campaign($id){return $this->checkpoint;}
              private function ebay_public_content_policy_reason_from_source_row($row,$title){return $this->content_block;}
              public function deliver($c){return $this->ebay_business_campaign_source_allows_delivery($c);}
          }
          function ok($v,$s){if(!$v){fwrite(STDERR,"FAIL ".$s."\n");exit(1);}echo "PASS ".$s."\n";}
          function seed(){
              global $wpdb,$META,$DBROW;
              $wpdb=new FakeDB();
              $hash=str_repeat('a',64);
              $META=array(101=>array('_ppar_ebay_business_auto'=>1,
                  '_ppar_creative_identity_hash'=>$hash,

name: Hab idealo live actual category post-import read-only check
on:
  push:
    branches: [hab-idealo-live-postimport-check-20261112]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public images load and actual 3 cards on desktop and mobile in Chrome
        shell: bash
        run: |
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import json
          opts=Options()
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1440,980']:
             opts.add_argument(a)
          drv=webdriver.Chrome(options=opts)
          try:
            drv.set_page_load_timeout(35)
            url='https://hab-und-bewahr.de/einbruch-und-diebstahl/einbruch-und-diebstahl-haus-und-wohnung/c22-haustuerschloesser-dd9773fd40/'
            for width in [1440,780,390]:
              drv.set_window_size(width,980)
              drv.get(url)
              drv.execute_script("document.querySelector('.ppar-hb-category-products-grid').scrollIntoView({block:'center'})")
              import time; time.sleep(3)
              result=drv.execute_script(r'''
              const grid=document.querySelector('.ppar-hb-category-products-grid');
              if(!grid)return {error:'GRID MISSING'};
              const cards=Array.from(grid.querySelectorAll(':scope > .ppar-affiliate-slot'));
              const data=cards.map(card=>{const im=card.querySelector('img'),all=Array.from(card.querySelectorAll('a'));
              const r=card.getBoundingClientRect();
              return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),
               text:card.innerText.slice(0,130),image:im?{src:im.currentSrc,width:im.naturalWidth,loaded:im.complete}:null,
               anchors:all.map(a=>({text:a.innerText.slice(0,90),host:new URL(a.href).hostname}))}});
              return {width:innerWidth,display:getComputedStyle(grid).display,columns:getComputedStyle(grid).gridTemplateColumns,count:cards.length,cards:data};
              ''')
              print('PUBLIC_BROWSER_POSTIMPORT',json.dumps(result,ensure_ascii=False))
              assert result['count']==3
              assert all(x['image'] and x['image']['loaded'] and x['image']['width']>0 for x in result['cards'])
              assert all(any(x['host'].endswith('idealo.de') for x in c['anchors']) for c in result['cards'])
              assert any(any('amazon.de' in x['host'] for x in c['anchors']) for c in result['cards'])
              coords={x['x'] for x in result['cards']}
              if width==1440:assert len(coords)==3
              if width==390:assert len(coords)==1
            print('PUBLIC_HAB_POSTIMPORT_DESKTOP_MOBILE_IMAGES_BUTTONS_PASS')
          finally:drv.quit()
          PY
      - name: Verify actual public product photos and buttons
        run: |
          python3 - <<'PY'
          import urllib.request,re,json
          paths=[
            'https://hab-und-bewahr.de/einbruch-und-diebstahl/einbruch-und-diebstahl-haus-und-wohnung/c22-haustuerschloesser-dd9773fd40/',
            'https://hab-und-bewahr.de/'
          ]
          for url in paths:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) Chrome/131.0.0.0 Safari/537.36','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as r:
                html=r.read(2200000).decode('utf8','replace')
              tag=re.findall(r'<(?:a|img)[^>]+>',html,re.I|re.S)
              imgs=[v for v in tag if v.lower().startswith('<img') and any(p in v.lower() for p in ['idealo','ebayimg','product'])]
              offers=[v for v in tag if v.lower().startswith('<a') and any(p in v.lower() for p in ['idealo','ebay','amazon'])]
              print('LIVE_CHECK',json.dumps(dict(url=url,html_bytes=len(html),idealo_photo_links=html.count('cdn.idealo.com'),ebay_photo_links=html.count('i.ebayimg.com'),provider_buttons=html.count('ppar-banner-offer-button'),grid_count=html.count('ppar-hb-category-products-grid'),amazon_links=html.count('amazon.de'),idealo_links=html.count('idealo'),ebay_links=html.count('ebay.de'),photos_sample=imgs[:3],offers_sample=offers[:5]),ensure_ascii=False))
            except Exception as e:print('LIVE_ERROR',url,repr(e))
          PY

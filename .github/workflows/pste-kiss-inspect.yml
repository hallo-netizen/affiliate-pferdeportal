name: PSTE KISS Inspect PSERC
on:
  push:
    branches: [pste-kiss-e2e-20261005]
    paths:
      - '.github/workflows/pste-kiss-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Search all Git history for current blocker evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          echo '=== PAA_RELATED HISTORY ==='
          git log --all -S'PAA_RELATED' --format='%H %ci %s' --name-only -- || true
          echo '=== PAA_RELATED CURRENT REFS ==='
          while read -r ref; do
            git grep -n -I -F 'PAA_RELATED' "$ref" -- '*.json' '*.php' '*.py' '*.md' 2>/dev/null | head -20 || true
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin) | sort -u | head -200
          echo '=== 4472 / CURRENT BLOCKER HISTORY ==='
          git log --all -S'4472' --format='%H %ci %s' --name-only -- || true
          git log --all -S'BLOCKED_PORTAL_TOPIC_EVIDENCE' --format='%H %ci %s' --name-only -- || true

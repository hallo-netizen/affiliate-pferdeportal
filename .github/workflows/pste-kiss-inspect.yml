name: PSTE KISS Inspect 05743
on:
  push:
    branches: [pste-kiss-e2e-20261005]
    paths:
      - '.github/workflows/pste-kiss-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate exact PSTE 0.57.43 source/package and inspect bottleneck
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          python3 - <<'PY'
          import io, os, re, hashlib, subprocess, zipfile
          needles=[b'0.57.43', b'PSTE_STORED_SOURCE_TITLE_CANDIDATE_V1']
          objs=subprocess.check_output(['git','rev-list','--objects','--all'],text=True,errors='replace').splitlines()
          hits=[]
          seen=set()
          def inspect_bytes(data,label,root_obj,depth=0):
              low=data.lower()
              if b'0.57.43' in low:
                  hits.append((root_obj,label,len(data),hashlib.sha256(data).hexdigest()))
              if depth>4: return
              try:
                  z=zipfile.ZipFile(io.BytesIO(data))
              except Exception:
                  return
              for n in z.namelist():
                  if n.endswith('/'): continue
                  try:
                      info=z.getinfo(n)
                      if info.file_size>80*1024*1024: continue
                      d=z.read(n)
                  except Exception:
                      continue
                  nl=n.lower()
                  if b'0.57.43' in d.lower() or '0.57.43' in nl:
                      hits.append((root_obj,label+'!'+n,len(d),hashlib.sha256(d).hexdigest()))
                  if nl.endswith('.zip') and len(d)<80*1024*1024:
                      inspect_bytes(d,label+'!'+n,root_obj,depth+1)
          for line in objs:
              p=line.split(' ',1)
              if len(p)!=2: continue
              obj,path=p
              if obj in seen: continue
              seen.add(obj)
              if not (path.lower().endswith(('.zip','.php','.json','.md','.txt','.yml','.yaml'))):
                  continue
              try:
                  size=int(subprocess.check_output(['git','cat-file','-s',obj],text=True).strip())
                  if size>150*1024*1024: continue
                  data=subprocess.check_output(['git','cat-file','blob',obj],stderr=subprocess.DEVNULL)
              except Exception:
                  continue
              if path.lower().endswith('.zip'):
                  inspect_bytes(data,path,obj)
              elif b'0.57.43' in data.lower():
                  hits.append((obj,path,len(data),hashlib.sha256(data).hexdigest()))
          print('HITS='+str(len(hits)))
          for h in hits:
              print('HIT obj=%s path=%s bytes=%d sha256=%s'%h)

          # Find candidate package(s) containing 0.57.43 and dump only relevant PHP snippets/hashes.
          target_names=[
            'class-pste-normal-metadata-path.php',
            'class-pste-repository.php',
            'class-pste-family-identity-v2.php',
            'class-pste-family-structure-router.php',
            'class-pste-planning-readiness.php',
            'portal-seo-topic-engine.php'
          ]
          done=set()
          for line in objs:
              p=line.split(' ',1)
              if len(p)!=2 or not p[1].lower().endswith('.zip'): continue
              obj,path=p
              if obj in done: continue
              done.add(obj)
              try:
                  size=int(subprocess.check_output(['git','cat-file','-s',obj],text=True).strip())
                  if size>150*1024*1024: continue
                  raw=subprocess.check_output(['git','cat-file','blob',obj],stderr=subprocess.DEVNULL)
              except Exception:
                  continue
              stack=[(raw,path,0)]
              while stack:
                  data,label,depth=stack.pop()
                  try:z=zipfile.ZipFile(io.BytesIO(data))
                  except Exception:continue
                  names=z.namelist()
                  version=False
                  for n in names:
                      if n.endswith('/'): continue
                      try:d=z.read(n)
                      except:continue
                      if b'0.57.43' in d:
                          version=True
                          break
                  if version:
                      print('PACKAGE_05743='+label)
                      for n in names:
                          if n.endswith('/'): continue
                          base=os.path.basename(n)
                          if base not in target_names: continue
                          d=z.read(n)
                          print('FILE name=%s bytes=%d sha256=%s'%(n,len(d),hashlib.sha256(d).hexdigest()))
                          txt=d.decode('utf-8','replace').splitlines()
                          pats=re.compile(r'STRUCTURE_GAP|SANDBOX_REQUIRED|reanalyzeRetainedBacklogBatch|STORED_SOURCE_TITLE_CANDIDATE|family|planning_suitability|NORMAL_PASS|AUTO_RESOLVED',re.I)
                          idx=[i for i,x in enumerate(txt) if pats.search(x)]
                          shown=set()
                          for i in idx[:120]:
                              a=max(0,i-3); b=min(len(txt),i+5)
                              key=(a,b)
                              if key in shown: continue
                              shown.add(key)
                              print('SNIP %s L%d-L%d'%(base,a+1,b))
                              for k in range(a,b):
                                  print('%05d %s'%(k+1,txt[k]))
                      print('END_PACKAGE_05743')
                  if depth<4:
                      for n in names:
                          if n.lower().endswith('.zip'):
                              try:d=z.read(n)
                              except:continue
                              if len(d)<80*1024*1024: stack.append((d,label+'!'+n,depth+1))
          PY

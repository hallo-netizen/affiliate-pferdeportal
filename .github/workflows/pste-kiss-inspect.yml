name: PSTE KISS Readonly Inventory
on:
  push:
    branches: [pste-kiss-e2e-20261005]
    paths:
      - '.github/workflows/pste-kiss-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read public WordPress inventory only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request
          base='https://pferde-atelier.de/wp-json/wp/v2'
          req=urllib.request.Request(base+'/posts?per_page=100&status=publish&_fields=id,title,slug,categories,status',headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              posts=json.load(r)
              total=r.headers.get('X-WP-Total')
          cat_ids=sorted({int(c) for p in posts for c in p.get('categories',[])})
          cats={}
          for i in range(0,len(cat_ids),100):
              ids=','.join(map(str,cat_ids[i:i+100]))
              if not ids: continue
              req=urllib.request.Request(base+'/categories?per_page=100&include='+ids+'&_fields=id,name,slug,parent',headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  for c in json.load(r): cats[int(c['id'])]=c
          print('WP_TOTAL='+str(total))
          print('WP_POSTS='+json.dumps([{
              'post_id':p['id'],
              'title':p['title']['rendered'],
              'slug':p['slug'],
              'status':p['status'],
              'categories':[cats.get(int(c),{'id':c}) for c in p.get('categories',[])]
          } for p in posts],ensure_ascii=False,separators=(',',':')))
          PY

name: PSTE KISS Full Readonly Inventory
on:
  push:
    branches: [pste-kiss-e2e-20261005]
    paths:
      - '.github/workflows/pste-kiss-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read titles categories and headings from public WordPress only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,re,html,gzip,base64
          base='https://pferde-atelier.de/wp-json/wp/v2'
          req=urllib.request.Request(base+'/posts?per_page=100&status=publish&_fields=id,title,slug,categories,status,content',headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r: posts=json.load(r)
          cat_ids=sorted({int(c) for p in posts for c in p.get('categories',[])})
          cats={}
          for i in range(0,len(cat_ids),100):
              ids=','.join(map(str,cat_ids[i:i+100]))
              req=urllib.request.Request(base+'/categories?per_page=100&include='+ids+'&_fields=id,name,slug,parent',headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  for c in json.load(r): cats[int(c['id'])]=c
          out=[]
          for p in posts:
              content=(p.get('content') or {}).get('rendered','')
              hs=[]
              for m in re.finditer(r'<h[23][^>]*>(.*?)</h[23]>',content,re.I|re.S):
                  t=re.sub(r'<[^>]+>',' ',m.group(1))
                  t=html.unescape(re.sub(r'\s+',' ',t)).strip()
                  if t: hs.append(t)
              out.append({
                  'post_id':int(p['id']),
                  'title':html.unescape((p.get('title') or {}).get('rendered','')),
                  'slug':p.get('slug',''),
                  'status':p.get('status',''),
                  'categories':[cats.get(int(c),{'id':int(c)}) for c in p.get('categories',[])],
                  'headings':hs
              })
          raw=json.dumps(out,ensure_ascii=False,separators=(',',':')).encode()
          print('INV_COUNT='+str(len(out)))
          print('INV_B64='+base64.b64encode(gzip.compress(raw,9)).decode())
          PY

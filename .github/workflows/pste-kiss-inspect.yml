name: PSTE KISS Inspect PSERC
on:
  push:
    branches: [pste-kiss-e2e-20261005]
    paths:
      - '.github/workflows/pste-kiss-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inventory historical archive and PSERC binary objects
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          python3 - <<'PY'
          import os,subprocess,collections
          lines=subprocess.check_output(['git','rev-list','--objects','--all'],text=True,errors='replace').splitlines()
          exts=collections.Counter()
          candidates=[]
          for line in lines:
              p=line.split(' ',1)
              if len(p)!=2:continue
              obj,path=p
              low=path.lower()
              if low.endswith('.tar.gz'): ext='.tar.gz'
              else: ext=os.path.splitext(low)[1]
              if ext in {'.zip','.gz','.tgz','.tar','.bz2','.xz','.7z','.rar','.wpress','.phar'}:
                  exts[ext]+=1
                  if any(k in low for k in ['pserc','portal-seo','editorial-plan','redaktionsplan','compiler','0.28']):
                      try:size=int(subprocess.check_output(['git','cat-file','-s',obj],text=True).strip())
                      except:size=-1
                      candidates.append((obj,size,path))
          print('ARCHIVE_EXT_COUNTS='+repr(dict(exts)))
          for obj,size,path in sorted(candidates,key=lambda x:x[2]):
              print(f'ARCHIVE_CANDIDATE blob={obj} bytes={size} path={path}')
          PY

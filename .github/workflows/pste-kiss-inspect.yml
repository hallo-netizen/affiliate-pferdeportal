name: PSTE KISS Inspect PSERC
on:
  push:
    branches: [pste-kiss-e2e-20261005]
    paths:
      - '.github/workflows/pste-kiss-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate PSERC 0.28.27 to 0.28.29 baselines
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          echo '=== TEXT REFS ==='
          for needle in '0.28.27' '0.28.28' '0.28.29-kiss-storage-safe'; do
            echo "NEEDLE=$needle"
            while read -r ref; do
              git grep -n -I -F "$needle" "$ref" -- '*.php' '*.json' '*.md' '*.txt' '*.yml' '*.yaml' 2>/dev/null | head -50 || true
            done < <(git for-each-ref --format='%(refname)' refs/remotes/origin) | sort -u | head -300
          done
          python3 - <<'PY'
          import io,subprocess,zipfile,re
          needles=[b'0.28.27',b'0.28.28',b'0.28.29-kiss-storage-safe']
          objects=subprocess.check_output(['git','rev-list','--objects','--all'],text=True,errors='replace').splitlines()
          zips=[]; seen=set()
          for line in objects:
              p=line.split(' ',1)
              if len(p)!=2 or not p[1].lower().endswith('.zip') or p[0] in seen: continue
              seen.add(p[0]); zips.append((p[0],p[1]))
          print('=== ZIP SCAN ===')
          def walk(raw,label,root,depth=0):
              try:z=zipfile.ZipFile(io.BytesIO(raw))
              except:return
              for n in z.namelist():
                  if n.endswith('/'):continue
                  low=n.lower()
                  if not (low.endswith(('.php','.json','.md','.txt','.yml','.yaml','.zip')) or '0.28.' in low):continue
                  try:data=z.read(n)
                  except:continue
                  found=[x.decode() for x in needles if x.lower() in data.lower() or x.decode().lower() in low]
                  if found: print(f'ZIP_MATCH root={root} member={label}!{n} needles={",".join(found)} bytes={len(data)}')
                  if low.endswith('.zip') and depth<4 and len(data)<100*1024*1024: walk(data,label+'!'+n,root,depth+1)
          for obj,path in zips:
              try:
                  if int(subprocess.check_output(['git','cat-file','-s',obj],text=True).strip())>150*1024*1024: continue
                  raw=subprocess.check_output(['git','cat-file','blob',obj],stderr=subprocess.DEVNULL)
              except:continue
              walk(raw,path,path)
          PY

name: PSTE KISS Inspect PSERC
on:
  push:
    branches: [pste-kiss-e2e-20261005]
    paths:
      - '.github/workflows/pste-kiss-inspect.yml'
      - 'control/startmaster0107/runtime_packages/PSERC-FIX.zip'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect PSERC package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pserc /tmp/pserc2 && mkdir -p /tmp/pserc /tmp/pserc2
          unzip -q control/startmaster0107/runtime_packages/PSERC-FIX.zip -d /tmp/pserc
          INNER="$(find /tmp/pserc -type f -name '*.zip' | head -1)"
          test -n "$INNER"
          unzip -q "$INNER" -d /tmp/pserc2
          echo '=== TREE ==='
          find /tmp/pserc2 -maxdepth 3 -type f | sort | head -120
          echo '=== VERSION ==='
          grep -R -n -E 'Version:|PSERC_VERSION|PLUGIN_VERSION|pste-v5-binding-safe' /tmp/pserc2 | head -120 || true
          echo '=== BINDING FILE ==='
          B="$(find /tmp/pserc2 -type f -name 'class-pserc-seo-source-binding.php' | head -1)"
          test -n "$B"
          sed -n '1,360p' "$B"
          echo '=== CAPABILITY CONTRACT ==='
          cat "$(find /tmp/pserc2 -type f -path '*/contracts/seo-engine-capability-binding-v2.json' | head -1)"
          echo '=== LIVE REST ROUTES READ ONLY ==='
          curl -fsS --max-time 30 'https://pferde-atelier.de/wp-json/' -o /tmp/wp-rest.json
          python3 - <<'PY'
          import json,re
          d=json.load(open('/tmp/wp-rest.json',encoding='utf-8-sig'))
          for route in sorted((d.get('routes') or {})):
              if re.search(r'pserc|editorial|seo|plugin|diagnos|performance|topic|themen',route,re.I):
                  print(route)
          PY

name: PSTE KISS Inspect PSERC
on:
  push:
    branches: [pste-kiss-e2e-20261005]
    paths:
      - '.github/workflows/pste-kiss-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect existing public WordPress REST surface read only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 'https://pferde-atelier.de/wp-json/' -o /tmp/wp-rest.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/wp-rest.json',encoding='utf-8-sig'))
          print('=== NAMESPACES ===')
          for ns in sorted(d.get('namespaces') or []):
              print(ns)
          print('=== NONCORE ROUTES ===')
          core=('wp/','oembed/','batch/','wp-site-health/','wp-block-editor/','wp/v2/')
          for route in sorted((d.get('routes') or {})):
              x=route.lstrip('/')
              if not x.startswith(core):
                  print(route)
          PY

name: PSTE KISS Inspect PSERC
on:
  push:
    branches: [pste-kiss-e2e-20261005]
    paths:
      - '.github/workflows/pste-kiss-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inventory existing server access secret references
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          python3 - <<'PY'
          import re,subprocess
          refs=subprocess.check_output(['git','for-each-ref','--format=%(refname)','refs/remotes/origin'],text=True).splitlines()
          seen=set()
          for ref in refs:
              try:
                  out=subprocess.check_output(['git','grep','-n','-I','secrets.',ref,'--','.github/workflows/*.yml','.github/workflows/*.yaml'],text=True,stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  continue
              for line in out.splitlines():
                  for name in re.findall(r'secrets\.([A-Za-z0-9_]+)',line):
                      seen.add(name)
          print('SECRET_REF_NAMES='+','.join(sorted(seen)))
          print('SERVERISH_SECRET_REF_NAMES='+','.join(sorted(n for n in seen if re.search(r'WP|WORDPRESS|SSH|SFTP|FTP|HOST|SERVER|PLESK|IONOS|USER|PASS|TOKEN|AUTH',n,re.I))))
          PY

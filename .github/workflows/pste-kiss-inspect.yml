name: PSTE KISS Inspect PSERC
on:
  push:
    branches: [pste-kiss-e2e-20261005]
    paths:
      - '.github/workflows/pste-kiss-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate PSERC 0.28.29 source package across Git history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          python3 - <<'PY'
          import io,re,subprocess,zipfile
          objects=subprocess.check_output(['git','rev-list','--objects','--all'],text=True,errors='replace').splitlines()
          zips=[]; seen=set()
          for line in objects:
              p=line.split(' ',1)
              if len(p)!=2 or not p[1].lower().endswith('.zip') or p[0] in seen: continue
              seen.add(p[0]); zips.append((p[0],p[1]))
          print('ZIP_BLOBS='+str(len(zips)))
          needles=[b'0.28.29',b'kiss-storage-safe',b'0.28.30-pste-v5-binding-safe']
          hits=[]
          def walk(raw,label,root_blob,root_path,depth=0):
              try: z=zipfile.ZipFile(io.BytesIO(raw))
              except Exception: return
              for n in z.namelist():
                  if n.endswith('/'): continue
                  low=n.lower()
                  try:
                      info=z.getinfo(n)
                  except Exception: continue
                  if info.file_size>25*1024*1024: continue
                  data=None
                  if low.endswith(('.php','.json','.md','.txt','.yml','.yaml','.zip')) or '0.28.29' in low or 'pserc' in low:
                      try: data=z.read(n)
                      except Exception: continue
                  if data is None: continue
                  found=[x.decode() for x in needles if x.lower() in data.lower() or x.decode().lower() in low]
                  if found:
                      hits.append((root_blob,root_path,label+'!'+n,found,len(data)))
                  if low.endswith('.zip') and depth<4:
                      walk(data,label+'!'+n,root_blob,root_path,depth+1)
          for obj,path in zips:
              try:
                  size=int(subprocess.check_output(['git','cat-file','-s',obj],text=True).strip())
                  if size>150*1024*1024: continue
                  raw=subprocess.check_output(['git','cat-file','blob',obj],stderr=subprocess.DEVNULL)
              except Exception: continue
              walk(raw,path,obj,path)
          print('MATCHES='+str(len(hits)))
          for h in hits:
              print('MATCH blob=%s archive=%s member=%s needles=%s bytes=%d'%(*h[:3],','.join(h[3]),h[4]))
          PY

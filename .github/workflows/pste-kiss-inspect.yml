name: PSTE KISS Inspect PSERC
on:
  push:
    branches: [pste-kiss-e2e-20261005]
    paths:
      - '.github/workflows/pste-kiss-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Search all refs for exact PSERC 0.28.30 package trail
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          for needle in '0.28.30' '0.28.30-pste-v5-binding-safe' 'pste-v5-binding-safe'; do
            echo "=== HISTORY needle=$needle ==="
            git log --all -S"$needle" --format='%H %ci %s' --name-only -- || true
            echo "=== CURRENT_REFS needle=$needle ==="
            while read -r ref; do
              git grep -n -I -F "$needle" "$ref" -- '*.json' '*.php' '*.py' '*.md' '*.yml' '*.yaml' '*.txt' 2>/dev/null | head -20 || true
            done < <(git for-each-ref --format='%(refname)' refs/remotes/origin) | sort -u | head -400
          done

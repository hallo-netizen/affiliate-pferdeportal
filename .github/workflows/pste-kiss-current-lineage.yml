name: PSTE KISS Inspect Current Lineage
on:
  push:
    branches: [pste-kiss-e2e-20261005]
    paths:
      - '.github/workflows/pste-kiss-current-lineage.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate PSTE 0.57.40-0.57.43 source/package history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          echo '=== TEXT REFS ==='
          for needle in '0.57.40' '0.57.41' '0.57.42' '0.57.43'; do
            echo "NEEDLE=$needle"
            git log --all -S"$needle" --format='%H %ci %s' --name-only -- || true
          done
          echo '=== ZIP BLOBS ==='
          python3 - <<'PY'
          import io,subprocess,zipfile,re,hashlib
          needles=[b'0.57.40',b'0.57.41',b'0.57.42',b'0.57.43']
          objects=subprocess.check_output(['git','rev-list','--objects','--all'],text=True,errors='replace').splitlines()
          zips=[]; seen=set()
          for line in objects:
              p=line.split(' ',1)
              if len(p)!=2 or not p[1].lower().endswith('.zip') or p[0] in seen: continue
              seen.add(p[0]); zips.append((p[0],p[1]))
          def walk(raw,label,root,depth=0):
              try:z=zipfile.ZipFile(io.BytesIO(raw))
              except:return
              members=z.namelist()
              for n in members:
                  if n.endswith('/'):continue
                  low=n.lower()
                  if not (low.endswith(('.php','.json','.md','.txt','.yml','.yaml','.zip')) or '0.57.' in low):continue
                  try:data=z.read(n)
                  except:continue
                  found=[x.decode() for x in needles if x.lower() in data.lower() or x.decode().lower() in low]
                  if found:
                      print(f'ZIP_MATCH root_blob={root} archive={label} member={n} versions={",".join(found)} bytes={len(data)} sha256={hashlib.sha256(data).hexdigest()}')
                  if low.endswith('.zip') and depth<4 and len(data)<120*1024*1024:
                      walk(data,label+'!'+n,root,depth+1)
          for obj,path in zips:
              try:
                  if int(subprocess.check_output(['git','cat-file','-s',obj],text=True).strip())>180*1024*1024:continue
                  raw=subprocess.check_output(['git','cat-file','blob',obj],stderr=subprocess.DEVNULL)
              except:continue
              walk(raw,path,obj)
          PY
name: Wassertechnik W34 read-only published WordPress inventory
on:
  pull_request:
    paths:
      - 'protocol/PROJECT_MEMORY/PROJEKTE/WASSERTECHNIK/PRUEFUNG/W34_*'
      - 'protocol/PROJECT_MEMORY/PROJEKTE/WASSERTECHNIK/WORDPRESS_TECHNIK/**'
      - '.github/workflows/wassertechnik-w34-wp-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read_only_inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare real archived WP snapshot with W6/W27/W28/W32 and publicly visible WP REST (GET only)
        run: python3 protocol/PROJECT_MEMORY/PROJEKTE/WASSERTECHNIK/PRUEFUNG/W34_public_wordpress_readonly.py
      - name: Upload machine-readable evidence (NO WP writes)
        uses: actions/upload-artifact@v4
        with:
          name: wassertechnik-w34-wp-readonly-inventory
          path: protocol/PROJECT_MEMORY/PROJEKTE/WASSERTECHNIK/PRUEFUNG/_w34_readonly_result.json
          if-no-files-found: error
          retention-days: 30

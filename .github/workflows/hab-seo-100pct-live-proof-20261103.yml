name: Hab & Bewahr SEO - 100 percent live sitemap proof
on:
  workflow_dispatch:
  push:
    branches:
      - hobbyroom/hab-seo-after-install-verification-20261103
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read-only full sitemap / Google robots verification
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime, html.parser, json, urllib.request, urllib.error
          import xml.etree.ElementTree as ET
          BASE='https://hab-und-bewahr.de'
          roots=['/einbruch-und-diebstahl/','/vandalismus-und-zerstorung/','/wasser-und-feuchtigkeit/','/feuer-und-gase/','/wetter-und-naturgefahren/','/technik-und-ausfalle/']
          protected=['/category/einbruch-und-abwesenheit-und-le-ferienhaus-einbruchschutz-15/','/category/einbruch-und-garten-und-grundst-gartenhaus-schrebergarten-12/']
          listing=BASE+'/listing/'
          listing_sitemap=BASE+'/hab-listing-archive-sitemap.xml'
          class Parser(html.parser.HTMLParser):
            def __init__(self):super().__init__();self.robots=[];self.canon=[]
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='meta' and a.get('name','').lower()=='robots':self.robots.append(a.get('content',''))
              if tag=='link' and 'canonical' in a.get('rel','').lower():self.canon.append(a.get('href',''))
          def get(url):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (Hab-SEO-ReadOnly/1.0)'})
              with urllib.request.urlopen(req,timeout=16) as r:
                return {'code':r.status,'final':r.url,'content_type':r.headers.get('Content-Type',''),'xrobots':r.headers.get('X-Robots-Tag',''),'body':r.read(2200000)}
            except urllib.error.HTTPError as e:
              return {'code':e.code,'final':url,'content_type':'','xrobots':e.headers.get('X-Robots-Tag',''),'body':e.read(200)}
            except Exception as e:
              return {'code':0,'final':url,'content_type':'','xrobots':'','body':str(e).encode()}
          def xml(url):
            r=get(url)
            if r['code']!=200 or 'xml' not in r['content_type'].lower():
              raise RuntimeError('XML_RESPONSE_INVALID '+url+' HTTP='+str(r['code'])+' CONTENT_TYPE='+r['content_type'])
            doc=ET.fromstring(r['body'])
            return doc.tag.rsplit('}',1)[-1],[x.text.strip() for x in doc.iter() if x.tag.rsplit('}',1)[-1]=='loc' and x.text]
          def page(url):
            r=get(url); p=Parser()
            if r['code']==200 and 'html' in r['content_type'].lower():
              p.feed(r['body'].decode('utf8','replace'))
            noindex='noindex' in ' '.join(p.robots).lower() or 'noindex' in r['xrobots'].lower()
            return url,{'code':r['code'],'noindex':noindex,'robots':p.robots,'canonical':p.canon,'final':r['final']}
          problems=[];xml_files={};urls=[]
          try:
            t,children=xml(BASE+'/sitemap_index.xml')
            if t!='sitemapindex':raise ValueError('ROOT_NOT_SITEMAPINDEX')
            for u in children:
              typ,found=xml(u)
              if typ!='urlset':problems.append('CHILD_NOT_URLSET '+u)
              xml_files[u]=len(found);urls.extend(found)
          except Exception as e:
            problems.append('XML_DISCOVERY_ERROR '+repr(e));children=[]
          if len(set(urls))!=len(urls):problems.append('DUPLICATES_IN_XML '+str(len(urls)-len(set(urls))))
          check=list(dict.fromkeys(urls+[BASE+p for p in roots+protected]+[listing]))
          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as pool:results=dict(pool.map(page,check))
          http_errors={u:r for u,r in results.items() if u in urls and r['code']!=200}
          noindex_sitemap={u:r for u,r in results.items() if u in urls and r['noindex']}
          core={BASE+p:{'in_sitemap':BASE+p in urls,**results[BASE+p]} for p in roots}
          protected_pages={BASE+p:results[BASE+p] for p in protected}
          listing_check={'in_sitemap':listing in urls,'sitemap_listed':listing_sitemap in children,**results[listing]}
          for u,v in core.items():
            if not v['in_sitemap'] or v['code']!=200 or v['noindex']:problems.append('CORE_FAILED '+u)
          for u,v in protected_pages.items():
            if v['code']!=200 or not v['noindex']:problems.append('PROTECTED_FAILED '+u)
          if not listing_check['in_sitemap'] or not listing_check['sitemap_listed'] or listing_check['noindex']:
            problems.append('LISTING_SITEMAP_FAILED')
          if http_errors:problems.append('SITEMAP_HTTP_ERRORS '+str(len(http_errors)))
          if noindex_sitemap:problems.append('SITEMAP_NOINDEX_CONTRADICTIONS '+str(len(noindex_sitemap)))
          data={'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':'ALL_URLS_IN_ALL_LISTED_XML_SITEMAPS_PLUS_SIX_ROOTS_TWO_PROTECTED_LISTING','status':'PASS' if not problems else 'FAIL',
             'children':xml_files,'total_urls':len(urls),'unique_urls':len(set(urls)),'checked':len(check),'problems':problems,
             'http_errors':http_errors,'noindex_in_sitemap':noindex_sitemap,'core_roots':core,'protected_categories':protected_pages,'listing_archive':listing_check}
          with open('hab_seo_full_live_proof.json','w',encoding='utf8') as f:json.dump(data,f,ensure_ascii=False,indent=2)
          print('SITE',BASE,'STATUS',data['status'],'XML_URLS',len(urls),'UNIQUE',len(set(urls)),'CHECKED',len(check))
          print('CORE_ROOTS',[(u,v['code'],v['noindex'],v['in_sitemap']) for u,v in core.items()])
          print('PROTECTED',[(u,v['code'],v['noindex']) for u,v in protected_pages.items()])
          print('LISTING',listing_check)
          print('NOINDEX_IN_SITEMAP',len(noindex_sitemap),'HTTP_ERRORS',len(http_errors),'PROBLEMS',problems)
          if problems:raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hab-seo-full-live-proof
          path: hab_seo_full_live_proof.json
          if-no-files-found: warn

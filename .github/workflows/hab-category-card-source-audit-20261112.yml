name: HAB category cards original source audit
on:
  push:
    branches: [hab-category-compact-product-cards-rc21-20261112]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect category recommendations wrapper and multi-provider identity
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile,re
          root="protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/"
          d=zipfile.ZipFile(root+"HAB-001-DESIGN/CURRENT.zip")
          z=zipfile.ZipFile(root+"HAB-004-AFFILIATE/CURRENT.zip")
          for archive,file,ranges in [
            (d,"hab-bewahr-design-vorschau/includes/detail-categories.php",[(205,238)]),
            (d,"hab-bewahr-design-vorschau/includes/area-design-prototype.php",[(330,410)]),
            (z,"affiliate-portal-router/includes/class-ppar-hab-bewahr-bridge.php",[(270,340)]),
            (z,"affiliate-portal-router/affiliate-portal-router.php",[(2440,2520)])
          ]:
            a=archive.read(file).decode("utf8","replace").splitlines()
            print('INSPECT_FILE',file)
            for low,high in ranges:
              for i in range(low-1,min(high,len(a))):
                print("EXACT",file,i+1,a[i][:500])
          for name in z.namelist():
            if not name.endswith(".php"):continue
            a=z.read(name).decode("utf8","replace").splitlines()
            for i,line in enumerate(a):
              if re.search(r"function\s+(multiprovider_render_offer_buttons|multiprovider_runtime_product_offers|multiprovider_.*offer.*|hab_bw_area_slot)\s*\(",line):
                print("OFFERS_METHOD",name,i+1,line[:300])
                for j in range(i,min(len(a),i+32)):
                  print("OFFERS",name,j+1,a[j][:430])
          PY
      - name: Read exact design hook and category bridge implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path("protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS")
          z=zipfile.ZipFile(root/"HAB-004-AFFILIATE/CURRENT.zip")
          d=zipfile.ZipFile(root/"HAB-001-DESIGN/CURRENT.zip")
          requests=[
           (z,'affiliate-portal-router/includes/class-ppar-hab-bewahr-bridge.php',[(110,220),(379,443)]),
           (z,'affiliate-portal-router/affiliate-portal-router.php',[(3075,3220)]),
           (z,'affiliate-portal-router/assets/frontend.css',[(1,130),(1950,2040)]),
           (d,'hab-bewahr-design-vorschau/includes/area-design-prototype.php',[(217,285)]),
           (d,'hab-bewahr-design-vorschau/includes/detail-categories.php',[(128,208)]),
           (d,'hab-bewahr-design-vorschau/assets/area-prototype.css',[(1,145)]),
           (d,'hab-bewahr-design-vorschau/assets/detail-categories.css',[(1,140)])
          ]
          for z,file,ranges in requests:
            if file not in z.namelist():continue
            lines=z.read(file).decode('utf8','replace').splitlines()
            for start,end in ranges:
              print('SECTION',file,start,end)
              for i in range(start-1,min(len(lines),end)):
                print('SRC',file,i+1,lines[i][:950])
          PY
      - name: Read actual Hab category design and affiliate adapter source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,re,hashlib
          root=Path("protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS")
          z=zipfile.ZipFile(root/"HAB-004-AFFILIATE/CURRENT.zip")
          d=zipfile.ZipFile(root/"HAB-001-DESIGN/CURRENT.zip")
          for label,x in [('AFF',z),('DESIGN',d)]:
            print('ZIP',label,'FILES',len(x.namelist()),'PASS',x.testzip())
            print('ZIP_NAMES',label,','.join(x.namelist())[:7000])
          q=[
           (z,'affiliate-portal-router/includes/class-ppar-hab-bewahr-bridge.php',['area_products','area','render_category','render_category_products','category_product','available_product']),
           (z,'affiliate-portal-router/includes/trait-ppar-hb-amazon.php',['hb_amazon_area_product_fallback','hb_amazon_product_family_markup','hb_amazon_category_product','hb_amazon_product','house_banner']),
           (z,'affiliate-portal-router/affiliate-portal-router.php',['render_affiliate_slot_for_context','render_banner','render_affiliate_slot','campaign_to_group_banner','ranked_campaigns_for_slot','render_category','multiprovider']),
           (d,'hab-bewahr-design-vorschau/includes/area-design-prototype.php',['hbdp_area_product_markup','hbdp_area_product_cards_html','render']),
           (d,'hab-bewahr-design-vorschau/includes/detail-categories.php',['hbdp_render_detail_category_page','hbdp_area_product_markup']),
          ]
          for archive,file,needles in q:
            if file not in archive.namelist():print('MISSING',file);continue
            src=archive.read(file).decode('utf-8','replace').splitlines()
            print('FILE',file,'LINES',len(src))
            for i,line in enumerate(src):
              if re.search(r'function\s+(?:[A-Za-z_][\w]*)\s*\(',line):
                if any(n in line for n in needles):
                  print('METHOD',file,i+1,line.strip()[:220])
            if 'class-ppar-hab-bewahr' in file:
              for i in range(min(len(src),380)): print('BRIDGE',i+1,src[i][:440])
            elif 'trait-ppar-hb-amazon' in file:
              for i,line in enumerate(src):
                if any(k in line for k in ['function hb_amazon_area_product_fallback','function hb_amazon_product_family_markup','function hb_amazon_category_product']):
                  for j in range(i,min(len(src),i+125)):print('AMAZON',j+1,src[j][:410])
            elif file.endswith('affiliate-portal-router.php'):
              for i,line in enumerate(src):
                if 'function render_affiliate_slot_for_context(' in line:
                  for j in range(i,min(len(src),i+105)):print('SLOT',j+1,src[j][:430])
                if 'function render_banner(' in line:
                  for j in range(i,min(len(src),i+105)):print('RENDER',j+1,src[j][:430])
            else:
              for i,line in enumerate(src):
                if 'function hbdp_area_product_markup(' in line or 'function hbdp_render_detail_category_page(' in line:
                  for j in range(i,min(len(src),i+110)):print('DESIGN_METHOD',file,j+1,src[j][:430])
          for file in ['affiliate-portal-router/assets/frontend.css']:
            a=z.read(file).decode().splitlines()
            print('CSS_SIZE',len(a))
            for i,line in enumerate(a):
              if any(k in line for k in ['hb-amazon','ppar-affiliate-card','ppar-product','ppar-banner-text','hb-affiliate','ppar-category-product','ppar-affiliate-slot']):
                print('CSS',i+1,line[:300])
          PY

name: TEMP PR221 KISS Rerun
on:
  push:
    branches:
      - hobbyroom/107007-r001-kiss-core-20260910-v2
permissions:
  contents: write
jobs:
  rerun-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Reuse exact patch logic with corrected test writer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/pr221-kiss-finalize.yml').read_text(encoding='utf-8')
          def get(name):
              mark='      - name: '+name+'\n'; a=src.index(mark); r=src.index('        run: |\n',a)+len('        run: |\n'); e=src.find('\n      - name:',r); e=len(src) if e<0 else e
              lines=src[r:e].splitlines(); return '\n'.join((x[10:] if x.startswith('          ') else x) for x in lines)+'\n'
          apply=get('Apply minimal existing-package binding')
          old="TEST.write_text(test_source.replace('          ','',1) if False else '\\n'.join(line[10:] if line.startswith('          ') else line for line in test_source.splitlines())+'\\n',encoding='utf-8')"
          new="TEST.write_text(test_source,encoding='utf-8')"
          if old not in apply: raise SystemExit('BROKEN_TEST_WRITER_NOT_FOUND')
          Path('/tmp/apply.sh').write_text(apply.replace(old,new),encoding='utf-8')
          Path('/tmp/direct.sh').write_text(get('Compile and direct positive-negative tests'),encoding='utf-8')
          Path('/tmp/m01.sh').write_text(get('Full M01-M36 on same candidate with fresh package only where R_001 requires it'),encoding='utf-8')
          PY
          bash /tmp/apply.sh
          bash /tmp/direct.sh
          bash /tmp/m01.sh
      - name: Clean final tree and commit only tested candidate
        shell: bash
        env:
          BASE_SHA: 2f0a3a25da77e95fb28e7da4f500aa3c50ac9910
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- control/startmaster0107/runtime_inbox/runtime_batch_slot_lifecycle.py control/startmaster0107/runtime_inbox/runtime_batch_slot_guard.py control/startmaster0107/runtime_inbox/RUNTIME_BATCH_SLOT_CONTRACT_V1.json
          git show "$BASE_SHA:AGENTS.md" > AGENTS.md
          git rm .github/workflows/pr221-kiss-finalize.yml .github/workflows/pr221-kiss-rerun.yml
          test -z "$(git diff --name-only "$BASE_SHA" -- .github/workflows AGENTS.md control/startmaster0107/runtime_inbox/runtime_batch_slot_lifecycle.py control/startmaster0107/runtime_inbox/runtime_batch_slot_guard.py control/startmaster0107/runtime_inbox/RUNTIME_BATCH_SLOT_CONTRACT_V1.json)"
          ! grep -R "source_owner_contexts\|PSERC_REALTEST_7_READY\|recovery_sources" control/single-door-boundary/codex_current_action.py control/startmaster0107/fachworkflow_proof_handoff.py control/startmaster0107/STEP_107007_RUN_NEW_ARTICLE_BATCH_NO_STOP.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          S=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          step=Path('control/startmaster0107/STEP_107007_RUN_NEW_ARTICLE_BATCH_NO_STOP.json'); state=Path('control/startmaster0107/CURRENT_STATE.json'); start=Path('control/startmaster0107/PFERDE_ATELIER_START_HERE.json')
          st=json.loads(state.read_text()); sh=json.loads(start.read_text())
          assert st['execution_gate']['bundle_sha256']==S(step)
          assert st['execution_gate_rearm_target']['bundle_sha256']==S(step)
          assert sh['current_state_sha256']==S(state)
          assert st['current_execution_blocker']['resolved'] is False
          assert st['publish_allowed'] is False
          print('FINAL_HASH_CHAIN_AND_BLOCKER_STATE_PASS')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control/single-door-boundary/codex_current_action.py control/startmaster0107/fachworkflow_proof_handoff.py control/startmaster0107/STEP_107007_RUN_NEW_ARTICLE_BATCH_NO_STOP.json control/startmaster0107/CURRENT_STATE.json control/startmaster0107/PFERDE_ATELIER_START_HERE.json control/startmaster0107/test_fachworkflow_proof_handoff.py AGENTS.md
          git commit -m "Bind R_001 to existing approved production package"
          git push origin HEAD:hobbyroom/107007-r001-kiss-core-20260910-v2

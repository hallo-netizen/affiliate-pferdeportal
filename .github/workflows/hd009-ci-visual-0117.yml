name: HD009 CI banner visual previews
on:
  push:
    branches:
      - hobbyroom/hd009-banner-ci-audit-20261107
    paths:
      - .github/workflows/hd009-ci-visual-0117.yml
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow for screenshot conversion
        run: python3 -m pip install --quiet Pillow
      - name: Generate exact HD003 asset previews in headless browser
        run: python3 protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/PLUGIN_AKTEN/HD-009-AFFILIATE-ZENTRALE/EVIDENCE/PREVIEW_0117_CI_VISUAL.py
      - name: Store audited previews
        run: |
          git config user.name "hobby-affiliate-qa"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/PLUGIN_AKTEN/HD-009-AFFILIATE-ZENTRALE/EVIDENCE/HD009_0117_BANNER_WIDE_CI_PREVIEW.jpg protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/PLUGIN_AKTEN/HD-009-AFFILIATE-ZENTRALE/EVIDENCE/HD009_0117_BANNER_SQUARE_CI_PREVIEW.jpg
          git commit -m "HD009: browser visuals of full width and square CI Amazon banners"
          git push

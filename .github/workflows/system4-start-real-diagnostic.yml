name: System 4 PPM Compaction Diagnostic

on:
  push:
    branches:
      - hobbyroom/system4-chat-output-acceptance-v1

permissions:
  contents: read

jobs:
  inspect-signed-ppm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact signed PPM WP test interface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          p=Path('control/startmaster0107/runtime_packages/PORTAL_PRODUCTION_MACHINE_V6.7.9_SIGNED_ARTICLE_TYPE_EXTENSION_ROOTFIX_FINAL.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='acbda93bd1c4292de7aaf88db2195631103991ff508b36c88cb694714818abd1'
          out=Path('/tmp/ppm679inspect'); out.mkdir(exist_ok=True)
          with zipfile.ZipFile(p) as z: z.extractall(out)
          PY
          ROOT=/tmp/ppm679inspect/portal-production-machine
          echo '=== PPM679_WP class location ==='
          grep -R -n 'class PPM679_WP' "$ROOT" || true
          echo '=== PPM679_WP public/static functions ==='
          FILE=$(grep -R -l 'class PPM679_WP' "$ROOT" | head -1)
          test -n "$FILE"
          grep -nE 'function [A-Za-z0-9_]+' "$FILE" || true
          echo '=== normal draft fixture builder ==='
          sed -n '1,260p' "$ROOT/tests/normal-draft-production/fixture-builder.php"
          echo '=== current normal draft tests: state/write/readback APIs ==='
          grep -R -nE 'reset|posts|insert_draft|get_post_snapshot|readback|journal|created|post_id' "$ROOT/tests/normal-draft-production" | head -300

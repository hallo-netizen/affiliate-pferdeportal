name: System 4 PPM Compaction Diagnostic

on:
  push:
    branches:
      - hobbyroom/system4-chat-output-acceptance-v1

permissions:
  contents: read

jobs:
  isolate-compaction-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run exact pre-normal compaction gate alone
        shell: bash
        run: |
          python -m unittest isolated_system4.test_ppm679_pre_normal_draft_compaction_gate -v

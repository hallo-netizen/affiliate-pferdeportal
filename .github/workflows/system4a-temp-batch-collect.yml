name: System4A temp batch collect bind
on:
  push:
    branches:
      - 'hobbyroom/system4a-batch-collect-20260917'
permissions:
  contents: write
jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bind mandatory batch collect and prove
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          h=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          step=Path('control/startmaster0107/STEP_107007_RUN_NEW_ARTICLE_BATCH_NO_STOP.json')
          data=json.loads(step.read_text(encoding='utf-8'))
          data['contract']='PFERDE_ATELIER_OPAQUE_STEP_BUNDLE_V12_SYSTEM4_BATCH_COLLECT_BOUND'
          batch_ref='control/startmaster0107/system4_107007_batch.py'
          gate_ref='isolated_system4/batch_gate.py'
          batch_sha=h(Path(batch_ref))
          gate_sha=h(Path(gate_ref))
          refs=data.get('authorized_inputs') or []
          seen_gate=False
          for row in refs:
              if row.get('ref')==batch_ref:
                  row['sha256']=batch_sha
              if row.get('ref')==gate_ref:
                  row['sha256']=gate_sha; seen_gate=True
          if not seen_gate:
              refs.append({'ref':gate_ref,'sha256':gate_sha})
          old='Wenn `SYSTEM4_107007_BATCH_ITEMS_COMPLETE` gemeldet wird, sind exakt alle 1..N Artikel dieses Runtime-Batches einmal sequenziell bestanden. Dann stoppen; Batch-Abschluss über batch_gate.py collect wird im nächsten Hard-Rule-Punkt angebunden.'
          new='HARD RULE — BATCH-COLLECT NACH DEM LETZTEN ARTIKEL: Wenn der letzte Artikel echten System-4-PASS erreicht, muss derselbe 1..N-Adapter zwingend isolated_system4/batch_gate.py collect mit dem hashgebundenen Source-Snapshot und exakt allen Workspace-state.json in Reihenfolge 0..N-1 ausführen. SYSTEM4_107007_BATCH_ITEMS_COMPLETE darf erst nach status=SYSTEM4_BATCH_FULL_PASS_COLLECTED, passender Batch-SHA, exakter Artikelanzahl und verifiziertem system4_batch_evidence.json gemeldet und persistiert werden. Schlägt collect fehl oder fehlt sein Evidence-Hash, bleibt 107007 BLOCKED und 107008 ist verboten.'
          instruction=data.get('instruction','')
          if old not in instruction:
              raise SystemExit('EXPECTED_OLD_COLLECT_TEXT_MISSING')
          data['instruction']=instruction.replace(old,new,1)
          step.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          step_sha=h(step)
          state=Path('control/startmaster0107/CURRENT_STATE.json')
          s=json.loads(state.read_text(encoding='utf-8'))
          s['execution_gate']['bundle_sha256']=step_sha
          s['execution_gate_rearm_target']['bundle_sha256']=step_sha
          state.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          state_sha=h(state)
          root=Path('control/startmaster0107/PFERDE_ATELIER_START_HERE.json')
          r=json.loads(root.read_text(encoding='utf-8'))
          r['current_state_sha256']=state_sha
          root.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('BATCH_SHA256='+batch_sha)
          print('BATCH_GATE_SHA256='+gate_sha)
          print('STEP_SHA256='+step_sha)
          print('STATE_SHA256='+state_sha)
          PY
          python3 control/startmaster0107/test_system4_107007_batch.py
          python3 control/startmaster0107/test_system4_107007_repair_authority.py
          python3 isolated_system4/test_batch_gate.py
          python3 isolated_system4/test_universal_batch_gate.py
          python control/cloud-entry-gate/cloud_repo_ci_test.py
          rm .github/workflows/system4a-temp-batch-collect.yml
          git config user.name 'hallo-netizen'
          git config user.email 'hallo@oliver-beil.de'
          git add -A
          git commit -m 'system4: hard-bind final batch collect'
          git push origin HEAD:hobbyroom/system4a-batch-collect-20260917

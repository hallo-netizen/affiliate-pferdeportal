name: PSTE TEMP original plan queue receipt proof
on:
  push:
    branches: [fix/pste-kisten-einmalige-pruefung-20261107]
permissions: {contents: read}
jobs:
  no-duplicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Existing MINI ownership proof and all original-plan-path checks
        shell: bash
        run: |
          set -euo pipefail
          D=protocol/PROJECT_MEMORY/PROJEKTE/PFERDE_ATELIER/PLUGINS/QA_ONLY
          python3 "$D/apply_existing_mini_kisten_import.py" /tmp/pste-qa
          python3 "$D/apply_wp_single_owner_gate.py" /tmp/pste-qa/PSTE-KISTEN-GESAMT-QA-NICHT-INSTALLIEREN.zip /tmp/pste-full.zip
          unzip -q /tmp/pste-full.zip -d /tmp/full
          I="/tmp/full/Portal SEO Topic Engine/includes"
          php "$D/test_existing_mini_import.php" "$I/class-pste-mini-workflow.php"
          php "$D/test_existing_pserc_plan.php" "$I/class-pste-mini-workflow.php"
          php "$D/test_complete_parkhaus.php" "$I/class-pste-mini-workflow.php"
          php "$D/test_atomic_existing_mini_option.php" "$I/class-pste-mini-workflow.php"
          php "$D/test_pste_kisten_transfer_v1.php"
          php "$D/test_existing_context_no_second_seo.php" "$I/class-pste-context-evaluator.php"
          php "$D/test_100_keyword_end_to_end_simulation.php" "$I/class-pste-mini-workflow.php" "$I/class-pste-planning-readiness-gate.php" "$D/MINI_100_ORIGINAL_EXTERNAL_TITLES_20261106.json" >/tmp/100.log
          grep -E 'unforwarded|existing occupied slot|87 cases|SUMMARY' /tmp/100.log
          for mode in good stale onebad; do
            php "$D/test_existing_forward_full_chain.php" "$I/class-pste-mini-workflow.php" "$mode" > "/tmp/forward-$mode.txt"
            grep 'FORWARD_QA_RESULT' "/tmp/forward-$mode.txt"
          done
          find "/tmp/full/Portal SEO Topic Engine" -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/lints
          test "$(wc -l </tmp/lints)" = 83
          echo "ALL_PSTE_EXISTING_WORKFLOW_TESTS_PASS"

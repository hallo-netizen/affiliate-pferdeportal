name: TEMP Affiliate 6.72.190 HARD KISS Banner Target Map Gate

on:
  push:
    branches: [affiliate-release-current]
    paths:
      - '.github/workflows/tmp-affiliate-strict-best-tier-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hard-kiss-banner-target-map:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Exact 6.72.190 source and hard-rule static gate
        shell: bash
        run: |
          set -euo pipefail
          python3 control/release-governance/release_guard.py source-check
          grep -F "Version: 6.72.190" release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php
          grep -F "const VERSION = '6.72.190';" release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php
          test "$(grep -cve '^[[:space:]]*$' release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt)" = "27"
          (
            cd release/affiliate-zentrale/current
            sha256sum -c ../CURRENT_SOURCE_SHA256.txt
          ) | tee /tmp/manifest.log
          test "$(grep -c ': OK$' /tmp/manifest.log)" = "27"
          find release/affiliate-zentrale/current/affiliate-portal-router -type f -name '*.php' -print0 | xargs -0 -n1 php -l | tee /tmp/lint.log
          test "$(grep -c '^No syntax errors detected' /tmp/lint.log)" = "21"
          python3 - <<'PY'
          from pathlib import Path
          out=Path('release/affiliate-zentrale/current/affiliate-portal-router/includes/trait-ppar-output-objects.php').read_text()
          auto=Path('release/affiliate-zentrale/current/affiliate-portal-router/includes/trait-ppar-automation-suite.php').read_text()
          classifier=out[out.index('private function output_banner_destination_classification'):out.index('private function output_banner_compatible_slots')]
          if 'output_banner_provider_topic_classification($row,$portal)' in classifier:
              raise SystemExit('FAIL provider topic still used at runtime')
          if 'output_destination_semantic_text($row)' in classifier:
              raise SystemExit('FAIL destination URL still classified at runtime')
          if 'output_banner_general_fallback_classification' in out:
              raise SystemExit('FAIL general banner fallback still exists')
          if 'banner_target_map_missing' not in classifier:
              raise SystemExit('FAIL missing stored target does not fail closed')
          if 'output_assign_banner_targets_from_destination_once' not in auto:
              raise SystemExit('FAIL import-time fixed target assignment missing')
          if 'identity_hash IN' not in auto:
              raise SystemExit('FAIL one-batch post-import load missing')
          print('HARD_KISS_STATIC_PASS')
          PY

      - name: Install WordPress and exact plugin
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-kiss
          /tmp/wp core download --path=/tmp/wp-kiss --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-kiss --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-kiss --url=http://127.0.0.1:8081 --title='KISS 672190' --admin_user=admin --admin_password='ci-password-123!' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp-kiss/wp-content/mu-plugins
          cat >/tmp/wp-kiss/wp-content/mu-plugins/pferde-e2e-design-contract.php <<'PHP'
          <?php
          if (!class_exists('Pferde_Template_Kit')) {
              class Pferde_Template_Kit {
                  public static function affiliate_contract_version(){ return '1.0'; }
                  public static function design_profile(){ return 'pferde_atelier'; }
                  public static function design_profile_contract_version(){ return '1.0'; }
                  public static function affiliate_page_type($page_id){ return 'hub1'; }
              }
          }
          PHP
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/wp-kiss/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-kiss
          /tmp/wp eval 'if(Pferdeportal_Affiliate_Router::VERSION!=="6.72.190"){exit(2);} echo "VERSION_672190_PASS\n";' --path=/tmp/wp-kiss
          /tmp/wp post create --path=/tmp/wp-kiss --post_type=page --post_status=publish --post_title='Reithelme' --post_name='reithelme' >/dev/null
          /tmp/wp post create --path=/tmp/wp-kiss --post_type=page --post_status=publish --post_title='Schabracken' --post_name='schabracken' >/dev/null

      - name: HARD RULE WordPress MariaDB proof
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/hard-kiss.php <<'PHP'
          <?php
          global $wpdb;
          $p=Pferdeportal_Affiliate_Router::instance();
          $p->maybe_install_creative_library_schema();
          $table=$wpdb->prefix.'ppar_creative_library';

          function ok($v,$m){ if(!$v){fwrite(STDERR,"FAIL ".$m."\n");exit(2);} echo "PASS ".$m."\n"; }
          function add_banner($table,$external,$dest){
              global $wpdb;
              $id=hash('sha256','kiss-'.$external);
              $now=time();
              $wpdb->insert($table,array(
                  'provider'=>'adcell','partner_external_id'=>'10787','partner_name'=>'HKM',
                  'external_id'=>$external,'identity_hash'=>$id,'creative_type'=>'banner',
                  'title'=>$external,'description'=>'','tags'=>'',
                  'image_url'=>'https://img.example/'.$external.'.jpg',
                  'destination_url'=>$dest,'tracking_url'=>'https://tracking.example/'.$external,
                  'width'=>728,'height'=>90,'source_status'=>'active','source_kind'=>'banner',
                  'availability_state'=>'active','missing_count'=>0,'last_complete_run'=>'ci',
                  'review_status'=>'review','selected'=>0,'content_scope'=>'unclassified','scope_source'=>'',
                  'classified_at'=>0,'topic_status'=>'no_match','topic_score'=>0,'topic_targets'=>'[]',
                  'source_hash'=>hash('sha256','source-'.$external),
                  'payload'=>wp_json_encode(array('_destination_source'=>'provider_explicit'),JSON_UNESCAPED_SLASHES),
                  'first_seen'=>$now,'last_seen'=>$now
              ));
              return $wpdb->get_row($wpdb->prepare("SELECT * FROM {$table} WHERE identity_hash=%s",$id),ARRAY_A);
          }
          function classify($p,$row,$portal){
              $m=new ReflectionMethod($p,'output_classify_for_portal');
              $m->setAccessible(true);
              return $m->invoke($p,$row,$portal,'portal_banner');
          }
          function mapped_slug($p,$row){
              $records=json_decode((string)$row['topic_targets'],true);
              if(!is_array($records)||count($records)!==1)return '';
              $portal=current($p->output_portal_registry());
              $targets=(new ReflectionMethod($p,'output_portal_targets'));
              $targets->setAccessible(true);
              $all=$targets->invoke($p,$portal);
              $key=(string)($records[0]['target_key']??'');
              foreach($all as $t){ if((string)($t['key']??'')===$key)return (string)($t['slug']??''); }
              return '';
          }

          $wpdb->query("DELETE FROM {$table} WHERE partner_external_id='10787' AND external_id LIKE 'kiss-%'");
          $portal=current($p->output_portal_registry());

          $r1=add_banner($table,'kiss-reithelme','https://shop.example/reithelme/modell-a');
          $a1=$p->output_assign_banner_targets_from_destination_once($r1);
          $r1=$wpdb->get_row($wpdb->prepare("SELECT * FROM {$table} WHERE id=%d",$r1['id']),ARRAY_A);
          ok((int)$a1['mapped']===1,'Reithelme destination maps once');
          ok(mapped_slug($p,$r1)==='reithelme','Reithelme fixed target stored');
          $c1=classify($p,$r1,$portal);
          ok(($c1['status']??'')==='ready','runtime reads stored Reithelme target');
          ok(($c1['source']??'')==='creative_library_destination_map','runtime source is stored target map');

          $r2=add_banner($table,'kiss-schabracken','https://shop.example/schabracken/modell-b');
          $a2=$p->output_assign_banner_targets_from_destination_once($r2);
          $r2=$wpdb->get_row($wpdb->prepare("SELECT * FROM {$table} WHERE id=%d",$r2['id']),ARRAY_A);
          ok((int)$a2['mapped']===1,'Schabracken destination maps once');
          ok(mapped_slug($p,$r2)==='schabracken','Schabracken fixed target stored');

          $r3=add_banner($table,'kiss-unmapped','https://shop.example/reithelme/modell-c');
          $c3=classify($p,$r3,$portal);
          ok(($c3['status']??'')==='review','banner without stored target is not played');
          ok(($c3['source']??'')==='banner_target_map_missing','runtime does not infer destination');

          $before=(string)$r1['topic_targets'];
          $again=$p->output_assign_banner_targets_from_destination_once($r1);
          $r1b=$wpdb->get_row($wpdb->prepare("SELECT * FROM {$table} WHERE id=%d",$r1['id']),ARRAY_A);
          ok((int)$again['mapped']===1,'repeat reuses same fixed target');
          ok((string)$r1b['topic_targets']===$before,'repeat does not create additional target records');

          $count=(int)$wpdb->get_var("SELECT COUNT(*) FROM {$table} WHERE partner_external_id='10787' AND external_id LIKE 'kiss-%'");
          ok($count===3,'no database row growth from target mapping');

          echo "HARD_KISS_WORDPRESS_MARIADB_PASS\n";
          PHP
          /tmp/wp eval-file /tmp/hard-kiss.php --path=/tmp/wp-kiss | tee /tmp/hard-kiss.log
          grep -F 'HARD_KISS_WORDPRESS_MARIADB_PASS' /tmp/hard-kiss.log

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-672190-hard-kiss-proof
          path: |
            /tmp/manifest.log
            /tmp/lint.log
            /tmp/hard-kiss.log
          if-no-files-found: error

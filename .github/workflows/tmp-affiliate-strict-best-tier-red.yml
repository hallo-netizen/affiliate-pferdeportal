name: TEMP Affiliate Strict Best Banner Tier 6.72.186

on:
  push:
    branches: [affiliate-672186-strict-tier]
    paths:
      - '.github/workflows/tmp-affiliate-strict-best-tier-red.yml'
      - 'AFFILIATE_HOBBYRAUM/test_banner_strict_best_tier_all_contexts_v672186.php'
      - 'release/affiliate-zentrale/current/affiliate-portal-router/**'

permissions:
  contents: read

jobs:
  positive:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - name: PHP lint current source
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r f; do php -l "$f" >/dev/null; done < <(find release/affiliate-zentrale/current/affiliate-portal-router -type f -name '*.php' | sort)
          echo "PASS PHP lint"

      - name: Install WordPress and 6.72.186 source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-tier
          mkdir -p /tmp/wp-tier
          /tmp/wp core download --path=/tmp/wp-tier --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-tier --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-tier --url=http://127.0.0.1:8081 --title='Strict Banner Tier RED' --admin_user=admin --admin_password='ci-password-123!' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp-tier/wp-content/mu-plugins
          cat >/tmp/wp-tier/wp-content/mu-plugins/pferde-e2e-design-contract.php <<'PHP'
          <?php
          if (!class_exists('Pferde_Template_Kit')) {
              class Pferde_Template_Kit {
                  public static function affiliate_contract_version(){ return '1.0'; }
                  public static function design_profile(){ return 'pferde_atelier'; }
                  public static function design_profile_contract_version(){ return '1.0'; }
                  public static function affiliate_page_type($page_id){ return get_post_field('post_parent',$page_id) ? 'category' : 'hub1'; }
              }
          }
          add_action('init', static function(){
              if (!post_type_exists('uge_term')) register_post_type('uge_term',array('public'=>true,'supports'=>array('title','editor')));
              if (!taxonomy_exists('uge_group')) register_taxonomy('uge_group',array('uge_term'),array('public'=>true,'hierarchical'=>true));
              if (!post_type_exists('pa_breed')) register_post_type('pa_breed',array('public'=>true,'supports'=>array('title','editor')));
              if (!taxonomy_exists('pa_breed_group')) register_taxonomy('pa_breed_group',array('pa_breed'),array('public'=>true,'hierarchical'=>true));
              if (!post_type_exists('hp_listing')) register_post_type('hp_listing',array('public'=>true,'supports'=>array('title','editor')));
              if (!taxonomy_exists('hp_listing_category')) register_taxonomy('hp_listing_category',array('hp_listing'),array('public'=>true,'hierarchical'=>true));
          },1);
          PHP
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/wp-tier/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-tier
          /tmp/wp eval 'if(Pferdeportal_Affiliate_Router::VERSION!=="6.72.186"){exit(2);} echo "PASS version 6.72.186\n";' --path=/tmp/wp-tier

      - name: Run all-context strict-tier positive proof
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp eval-file "$GITHUB_WORKSPACE/AFFILIATE_HOBBYRAUM/test_banner_strict_best_tier_all_contexts_v672186.php" --path=/tmp/wp-tier | tee /tmp/tier186.log
          grep -F 'STRICT_BEST_TIER_ALL_ACTIVE_CONTEXTS_672186_PASS' /tmp/tier186.log
          grep -F '"failures":0' /tmp/tier186.log
          grep -F 'PASS PERFORMANCE_zero_frontend_http :: http=0' /tmp/tier186.log

      - name: Existing banner regression 21 of 21
        shell: bash
        run: |
          set -euo pipefail
          sed "s/6\\.72\\.185/6.72.186/g" AFFILIATE_HOBBYRAUM/test_banner_full_e2e_v672184.php >/tmp/full186.php
          /tmp/wp eval-file /tmp/full186.php --path=/tmp/wp-tier | tee /tmp/full186.log
          grep -F 'SUMMARY passes=21 failures=0' /tmp/full186.log

      - name: Existing destination regression 26 of 26
        shell: bash
        run: |
          set -euo pipefail
          sed "s/6\\.72\\.183/6.72.186/g" AFFILIATE_HOBBYRAUM/test_banner_destination_library_e2e_v672183.php >/tmp/dest186.php
          /tmp/wp eval-file /tmp/dest186.php --path=/tmp/wp-tier | tee /tmp/dest186.log
          grep -F 'SUMMARY passes=26 failures=0' /tmp/dest186.log
          grep -F 'FULL_DESTINATION_LIBRARY_WORDPRESS_MARIADB_E2E_PASS' /tmp/dest186.log

name: Hobby Depot exact empty product placeholder root audit
on:
  push:
    branches: [hobbyroom/hd009-fix-empty-product-slots-20261113]
    paths: [.github/workflows/hd_empty_product_root_audit.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Inspect the exact current HD003 and HD009 outputs plus public page
        run: |
          python3 -m pip -q install beautifulsoup4
          git fetch --quiet origin hobbyroom/hd003-150813-visible-colors-20261113
          git show origin/hobbyroom/hd003-150813-visible-colors-20261113:protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-003-DESIGN-TEMPLATE-KIT/CURRENT.zip >/tmp/hobby_hd003_150813.zip
          python3 - <<'PY'
          import zipfile,pathlib,re,hashlib,urllib.request
          from bs4 import BeautifulSoup
          srcs={
             'HD003':pathlib.Path('/tmp/hobby_hd003_150813.zip'),
             'HD009':pathlib.Path('protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE/CURRENT.zip')
          }
          sections=[]
          terms=r'(?i)(Platz aktuell nicht belegt|nur eingeloggt sichtbar|Affiliate-Produkt|inline_partner_product|catlevel-products|category_product_[123]|product.*preview|is-preview|idealo_product_feed_v1|network_sync_table|render_affiliate_slot_for_context)'
          funcs=re.compile(r'^\s*(?:private|public|protected|static|public static|private static) function \S+\(',re.M)
          for tag,p in srcs.items():
             sections.append('ARCHIVE '+tag+' '+str(p.stat().st_size)+' '+hashlib.sha256(p.read_bytes()).hexdigest())
             with zipfile.ZipFile(p) as z:
               sections.append('ZIP '+tag+' files='+str(len(z.namelist()))+' crc='+str(z.testzip()))
               for name in z.namelist():
                 if not name.endswith(('.php','.css','.js')) or z.getinfo(name).file_size>7000000:continue
                 raw=z.read(name).decode('utf8','replace')
                 lines=raw.splitlines()
                 hits=[i for i,l in enumerate(lines) if re.search(terms,l)]
                 if not hits:continue
                 sections.append('FILE '+tag+' '+name+' lines='+str(len(lines))+' HITS '+str(len(hits)))
                 for i in hits[:135]:
                   sections.append('HIT '+tag+' '+str(i+1)+' '+lines[i][:1200])
                   if re.search(r'(?i)(Platz aktuell nicht belegt|nur eingeloggt sichtbar|inline_partner_product|catlevel-products)',lines[i]):
                     sections.extend('NEAR '+tag+' '+str(j+1)+' '+lines[j][:1300] for j in range(max(0,i-15),min(i+18,len(lines))))
                 if tag=='HD003' and 'class-hobby-depot-profile' in name:
                   idxs=[i for i,l in enumerate(lines) if 'function inline_partner_product' in l or ('function ' in l and 'catlevel' in l.lower())]
                   for i in idxs:
                     sections.append('FN '+tag+' '+str(i+1)+' '+lines[i][:850])
                     sections.extend('BODY '+tag+' '+str(j+1)+' '+lines[j][:1400] for j in range(i,min(i+175,len(lines))))
                 if tag=='HD009' and name.endswith('hobby-depot-affiliate-router.php'):
                   idxs=[i for i,l in enumerate(lines) if ('function render_affiliate_slot_for_context' in l or 'function ranked_campaigns_for_slot_uncached' in l or 'function hd_idealo_product_targets_exact_hobby_page' in l)]
                   for i in idxs:
                     sections.append('FN '+tag+' '+str(i+1)+' '+lines[i][:850])
                     sections.extend('BODY '+tag+' '+str(j+1)+' '+lines[j][:1400] for j in range(i,min(i+160,len(lines))))
          url='https://hobby-depot.de/gestalten/malen-zeichnen/airbrush/'
          try:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=19) as r:
              page=r.read(2000000).decode('utf8','replace')
              sections.append('LIVE_HTTP '+str(r.status)+' '+str(r.url)+' len='+str(len(page)))
              soup=BeautifulSoup(page,'html.parser')
              section=soup.select_one('.hd-catlevel-products')
              sections.append('LIVE_SECTION '+(str(section)[:16000] if section else 'NONE'))
              sections.append('LIVE_HEAD_TITLE '+str(soup.title))
          except Exception as exc: sections.append('LIVE_ERROR '+repr(exc))
          dest=pathlib.Path('protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/AFFILIATE/EVIDENCE/HD003_HD009_LEERKARTEN_CODE_20261113.txt')
          dest.parent.mkdir(parents=True,exist_ok=True);dest.write_text('\n'.join(sections))
          print('EVIDENCE_CREATED',dest,'lines',len(sections),'bytes',dest.stat().st_size)
          PY
      - name: Commit source-anchored evidence in isolated Hobby Depot office
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/AFFILIATE/EVIDENCE/HD003_HD009_LEERKARTEN_CODE_20261113.txt
          git commit -m "Evidence: identify HD003 blank card HTML and HD009 empty output paths from exact live versions"
          git fetch origin hobbyroom/hd009-fix-empty-product-slots-20261113
          git rebase origin/hobbyroom/hd009-fix-empty-product-slots-20261113
          git push origin HEAD:refs/heads/hobbyroom/hd009-fix-empty-product-slots-20261113

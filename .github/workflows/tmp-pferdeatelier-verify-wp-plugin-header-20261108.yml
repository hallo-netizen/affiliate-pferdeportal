name: TEMP inspect stored original PSERC plugin version
on:
  push:
    branches:
      - fix/pste-kisten-einmalige-pruefung-20261107
    paths:
      - .github/workflows/tmp-pferdeatelier-verify-wp-plugin-header-20261108.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect stored archive exact WordPress header and runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,re
          p='control/startmaster0107/runtime_packages/PSERC-FIX.zip'
          with zipfile.ZipFile(p) as z:
            print('ARCHIVE_ENTRY_COUNT',len(z.namelist()))
            print('OUTER_ARCHIVE_MEMBERS',[(n,z.getinfo(n).file_size) for n in z.namelist()])
            matches=[k for k in z.namelist() if k.endswith('/portal-seo-editorial-plan-compiler.php')]
            print('WORDPRESS_MAIN_FILES',matches)
            for name in z.namelist():
              if not name.lower().endswith('.zip'):continue
              import io
              with zipfile.ZipFile(io.BytesIO(z.read(name))) as inner:
                print('NESTED_ARCHIVE',name,'FILES',len(inner.namelist()))
                hits=[n for n in inner.namelist() if n.endswith('/portal-seo-editorial-plan-compiler.php')]
                for n in hits:
                  t=inner.read(n).decode('utf-8','replace')
                  print('NESTED_MAIN',n,repr(t[:800]),re.findall(r"PSERC_VERSION[^\\n]{0,80}",t)[:3])
            for k in matches:
              v=z.read(k).decode('utf-8','replace')
              print('MAIN_FIRST_30_LINES',repr(v[:1600]))
              for pat in ('PSERC_VERSION','Plugin Name','Version:'):
                print(pat,repr(re.findall(r'.{0,60}'+re.escape(pat)+r'.{0,110}',v,re.I)[:4]))
          PY

name: TEMP PR224 Stage Forensics
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect and execute bound content validators
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ppm /tmp/pserc_outer /tmp/pserc
          mkdir -p /tmp/ppm /tmp/pserc_outer /tmp/pserc
          unzip -q control/startmaster0107/runtime_packages/PORTAL_PRODUCTION_MACHINE_V6.7.9_SIGNED_ARTICLE_TYPE_EXTENSION_ROOTFIX_FINAL.zip -d /tmp/ppm
          unzip -q control/startmaster0107/runtime_packages/PSERC-FIX.zip -d /tmp/pserc_outer
          inner=$(find /tmp/pserc_outer -type f -name '*.zip' | head -n1)
          test -n "$inner"
          unzip -q "$inner" -d /tmp/pserc
          PPM=/tmp/ppm/portal-production-machine
          echo '=== CONTENT VALIDATOR API ==='
          grep -n "function check" "$PPM/includes/content-validator.php" | head -n 20
          grep -n "function check" "$PPM/includes/content-structure-language-gate.php" | head -n 20
          echo '=== EXISTING DIRECT CONTENT VALIDATOR NEGATIVE/POSITIVE TEST ==='
          php "$PPM/tests/test-canonical-runtime-binding.php"
          echo '=== MAINBLOCK LINK HARD RULE TEST ==='
          php "$PPM/tests/test-mainblock1-link-targets.php"
          echo '=== MAINBLOCK TABLE HARD RULE TEST ==='
          php "$PPM/tests/test-mainblock1-table-hard-rules.php"
          echo '=== CONTENT VALIDATOR INTEGRATION ==='
          php "$PPM/tests/test-wave2-content-validator-integration.php"
          echo '=== REPAIRABLE BLOCKER TOKENS ==='
          grep -RhoE "BLOCKED_(CONTENT|WAVE2)_[A-Z0-9_]+" "$PPM/includes/content-validator.php" "$PPM/includes/content-structure-language-gate.php" | sort -u
          echo '=== NO REPOSITORY MUTATION FROM DIRECT VALIDATOR TESTS ==='
          git diff --exit-code

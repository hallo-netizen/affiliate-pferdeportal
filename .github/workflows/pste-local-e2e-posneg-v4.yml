name: PSTE Local E2E Positive Negative V4
on:
  push:
    branches: [pste-kiss-e2e-20261005]
    paths:
      - '.github/workflows/pste-local-e2e-posneg-v4.yml'

jobs:
  local-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact available local chain positive negative
        shell: bash
        run: |
          set -euo pipefail

          echo '=== 1 CONTROL + TARGET ==='
          python3 - <<'PY'
          import json,subprocess
          start=json.load(open('control/pste-topic-engine/START_HERE.json'))
          current=json.load(open('control/pste-topic-engine/CURRENT_STATE.json'))
          target=json.load(open('control/pste-topic-engine/ZIELVERTRAG_KISS_AUTOMATIK_KURZWEG.json'))
          blob=lambda p: subprocess.check_output(['git','hash-object',p],text=True).strip()
          assert start['navigation_authority_git_blob_sha1']==blob('control/pste-topic-engine/CURRENT_STATE.json')
          assert start['target_authority_git_blob_sha1']==blob('control/pste-topic-engine/ZIELVERTRAG_KISS_AUTOMATIK_KURZWEG.json')
          assert current['status']=='BLOCKED_EXACT_PSTE_SOURCE_MISSING'
          assert current['next_action']['id']=='RECOVER_EXACT_INSTALLED_PSTE_SOURCE_PACKAGE'
          assert set(target['paths'])=={'AUTOMATIK','KURZER_DIENSTWEG'}
          print('PASS_CONTROL_BINDING')
          print('PASS_EXACT_TWO_VISIBLE_PATHS')
          PY

          echo '=== 2 DB + PERFORMANCE ==='
          python3 - <<'PY'
          import json
          t=json.load(open('control/pste-topic-engine/ZIELVERTRAG_KISS_AUTOMATIK_KURZWEG.json'))
          db=' '.join(t['database_policy']).lower()
          perf=' '.join(t['performance_policy']).lower()
          assert 'no full backlog rebuild' in db
          assert 'current bounded batch' in db
          assert 'no unnecessary dataforseo calls' in perf
          assert 'no repository-wide or database-wide scan' in perf
          assert 'no extra workflow, shadow path or duplicate state store' in perf
          print('PASS_DB_BOUNDED')
          print('PASS_PERFORMANCE_BOUNDED')
          PY

          echo '=== 3 EXTRACT REAL AVAILABLE PACKAGES ==='
          rm -rf /tmp/pserc /tmp/ppm
          mkdir -p /tmp/pserc /tmp/ppm
          unzip -q control/startmaster0107/runtime_packages/PSERC-FIX.zip -d /tmp/pserc
          unzip -q control/startmaster0107/runtime_packages/PORTAL_PRODUCTION_MACHINE_V6.7.9_SIGNED_ARTICLE_TYPE_EXTENSION_ROOTFIX_FINAL.zip -d /tmp/ppm
          python3 - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path('/tmp/pserc')
          seen=set()
          for depth in range(4):
              todo=[p for p in root.rglob('*.zip') if str(p) not in seen]
              if not todo: break
              for i,zp in enumerate(todo):
                  seen.add(str(zp))
                  out=root/'.nested'/str(depth)/str(i)
                  out.mkdir(parents=True,exist_ok=True)
                  try:
                      with zipfile.ZipFile(zp) as z: z.extractall(out)
                  except zipfile.BadZipFile:
                      pass
          PY
          echo "PSERC_PACKAGE_SHA256=$(sha256sum control/startmaster0107/runtime_packages/PSERC-FIX.zip | awk '{print $1}')"
          echo "PPM_PACKAGE_SHA256=$(sha256sum control/startmaster0107/runtime_packages/PORTAL_PRODUCTION_MACHINE_V6.7.9_SIGNED_ARTICLE_TYPE_EXTENSION_ROOTFIX_FINAL.zip | awk '{print $1}')"
          echo "PSERC_PHP_FILES=$(find /tmp/pserc -type f -name '*.php' | wc -l)"
          echo "PPM_PHP_FILES=$(find /tmp/ppm -type f -name '*.php' | wc -l)"
          grep -R -n -m8 -E "PSERC_VERSION|Version:|0\.28\." /tmp/pserc || true
          grep -R -n -m3 -E "Version:|6\.7\.9" /tmp/ppm || true

          echo '=== 4 PHP LINT ==='
          pserc_fail=0
          while IFS= read -r f; do php -l "$f" >/dev/null || pserc_fail=$((pserc_fail+1)); done < <(find /tmp/pserc -type f -name '*.php' | sort)
          ppm_fail=0
          while IFS= read -r f; do php -l "$f" >/dev/null || ppm_fail=$((ppm_fail+1)); done < <(find /tmp/ppm -type f -name '*.php' | sort)
          echo "PSERC_LINT_FAIL=$pserc_fail"
          echo "PPM_LINT_FAIL=$ppm_fail"
          test "$pserc_fail" -eq 0
          test "$ppm_fail" -eq 0
          echo PASS_PACKAGE_LINT

          echo '=== 5 CURRENT CONTROL POSITIVE + NEGATIVE SELFTEST ==='
          python3 control/single-door-boundary/codex_current_action.py selftest
          echo PASS_CURRENT_ACTION_SELFTEST

          echo '=== 6 PPM REAL NEGATIVE MATRIX ==='
          python3 isolated_system4/test_textmachine_ppm_negative_gaps.py
          echo PASS_PPM_NEGATIVE_MATRIX_49_CASES

          echo '=== 7 PPM PACKAGED LOCAL TEST SUITE ==='
          PPMROOT=/tmp/ppm/portal-production-machine
          ppm_tests=0
          ppm_test_fail=0
          while IFS= read -r testfile; do
            ppm_tests=$((ppm_tests+1))
            if ! timeout 30 php "$testfile" >/tmp/ppm-test.out 2>/tmp/ppm-test.err; then
              ppm_test_fail=$((ppm_test_fail+1))
              echo "PPM_TEST_FAIL=$testfile"
              tail -20 /tmp/ppm-test.err || true
              tail -20 /tmp/ppm-test.out || true
            fi
          done < <(find "$PPMROOT/tests" -type f -name 'test-*.php' | sort)
          echo "PPM_TEST_FILES_RUN=$ppm_tests"
          echo "PPM_TEST_FILES_FAIL=$ppm_test_fail"
          test "$ppm_tests" -gt 0
          test "$ppm_test_fail" -eq 0
          echo PASS_PPM_PACKAGED_LOCAL_SUITE

          echo '=== 8 FIVE FIELD HANDOFF POSITIVE + NEGATIVE ==='
          python3 - <<'PY'
          required=('title','target_keyword','category','article_type','plan_slot')
          def validate(x):
              return isinstance(x,dict) and tuple(x.keys())==required and all(isinstance(x[k],str) and x[k].strip() for k in required)
          good={'title':'Pferdeanhänger finanzieren – Kosten sinnvoll planen','target_keyword':'pferdeanhänger finanzieren','category':'Pferdeanhänger','article_type':'Beratung','plan_slot':'LOCAL-E2E-001'}
          assert validate(good)
          print('PASS_HANDOFF_EXACT_FIVE_FIELDS')
          bad=dict(good); bad.pop('category'); assert not validate(bad)
          print('PASS_NEGATIVE_MISSING_FIELD_BLOCKED')
          bad=dict(good); bad['debug']='x'; assert not validate(bad)
          print('PASS_NEGATIVE_SIXTH_FIELD_BLOCKED')
          bad=dict(good); bad['target_keyword']=''; assert not validate(bad)
          print('PASS_NEGATIVE_EMPTY_FIELD_BLOCKED')
          PY

          echo '=== 9 PSTE SOURCE AUTHORITY NEGATIVE ==='
          python3 - <<'PY'
          import json,pathlib,re
          c=json.load(open('control/pste-topic-engine/CURRENT_STATE.json'))
          assert c['verified_facts']['pste_exact_source_available'] is False
          assert pathlib.Path('PSTE_0.56.25').exists()
          exact=[]
          for p in pathlib.Path('.').rglob('*'):
              if p.is_file() and re.search(r'0\.57\.(55|56|57)',p.name,re.I):
                  exact.append(str(p))
          assert exact==[], exact
          print('PASS_NEGATIVE_HISTORICAL_PSTE_NOT_CURRENT')
          print('PASS_NEGATIVE_MISSING_EXACT_PSTE_BLOCKS_FULL_BUILD')
          PY

          echo '=== 10 CLEANLINESS ==='
          test ! -d control/pste-topic-engine/inspection
          test ! -d proof/pste-kiss-existing-material
          test ! -f tmp/pste-live-inventory-20261006.json
          echo PASS_NO_HEAVY_PSTE_TEST_BALLAST

          echo '=== RESULT ==='
          echo 'AVAILABLE_REAL_CHAIN=PASS'
          echo 'POSITIVE_TESTS=PASS'
          echo 'NEGATIVE_FAIL_CLOSED_TESTS=PASS'
          echo 'FULL_CURRENT_PSTE_CODE_E2E=EXPECTED_BLOCKED_EXACT_SOURCE_MISSING'

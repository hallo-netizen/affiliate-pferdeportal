name: Inspect Current7 Prewrite Bindings

on:
  push:
    branches: [inspect/current-wp-importer-20260919]
    paths: ['.github/workflows/inspect-current7-prewrite-bindings.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Print exact current 7 bindings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys,json
          from pathlib import Path
          sys.path.insert(0,'isolated_system4')
          import machine_point0
          repo=Path('.').resolve()
          _,plans=machine_point0._current_snapshot_and_plans(repo,machine_point0.root_entry._critical_manifest_sha256())
          for i,x in enumerate(plans['items']):
              p=x['production_plan_item']
              print(json.dumps({
                'index':i,
                'plan_slot':x['plan_slot'],
                'category_binding':p.get('category_binding'),
                'links':(p.get('quality_binding') or {}).get('link_bindings')
              },ensure_ascii=False,sort_keys=True))
          PY

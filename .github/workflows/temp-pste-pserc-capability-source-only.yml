name: TEMP PSTE to PSERC actual capability interface proof
on:
  push:
    branches: [fix/pste-kisten-einmalige-pruefung-20261107]
permissions: {contents: read}
jobs:
  source-read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the ORIGINAL PSTE compiler capability producer source, no edits or rechecking titles
        shell: bash
        run: |
          set -euo pipefail
          Z=protocol/PROJECT_MEMORY/PROJEKTE/PFERDE_ATELIER/PLUGINS/INSTALLATIONS_PAKETE/PSTE-0.57.144.22-NUR-TEST.zip
          unzip -Z1 "$Z" | grep -i 'capability' | head -20
          unzip -p "$Z" "Portal SEO Topic Engine/includes/class-pste-compiler-read-capability.php" > /tmp/producer.php
          echo "PRODUCER_SOURCE_START"
          sed -n '1,200p' /tmp/producer.php
          echo "PRODUCER_SOURCE_END"
          php -l /tmp/producer.php

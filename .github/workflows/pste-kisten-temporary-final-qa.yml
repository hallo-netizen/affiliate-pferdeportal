name: PSTE temporary final single-owner QA
on:
  push:
    branches: [fix/pste-kisten-einmalige-pruefung-20261107]
permissions:
  contents: read
jobs:
  complete-flow-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check actual existing v22 plugin with unchanged title/relevance lane and isolated parkhouse lane
        run: |
          set -euo pipefail
          D=protocol/PROJECT_MEMORY/PROJEKTE/PFERDE_ATELIER/PLUGINS/QA_ONLY
          python3 "$D/apply_existing_mini_kisten_import.py" /tmp/pste-final-qa
          php -l /tmp/pste-final-qa/class-pste-mini-workflow.php
          php "$D/test_existing_mini_import.php" /tmp/pste-final-qa/class-pste-mini-workflow.php
          php "$D/test_existing_pserc_plan.php" /tmp/pste-final-qa/class-pste-mini-workflow.php
          php "$D/test_complete_parkhaus.php" /tmp/pste-final-qa/class-pste-mini-workflow.php
          php "$D/test_pste_kisten_transfer_v1.php"
          unzip -q /tmp/pste-final-qa/PSTE-KISTEN-GESAMT-QA-NICHT-INSTALLIEREN.zip -d /tmp/pste-fully-extracted
          find "/tmp/pste-fully-extracted/Portal SEO Topic Engine" -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/pste-lints.txt
          echo "ALL_PHP_LINTS=$(wc -l </tmp/pste-lints.txt)"
          echo "QA_ONLY_NO_INSTALLATION"

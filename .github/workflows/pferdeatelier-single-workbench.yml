name: Pferdeatelier single active workbench

# The Campus branch ruleset requires the job context "single-current-lock"
# for every pull request into the Campus branch. Do not path-filter this
# workflow, otherwise unrelated project-building updates can never satisfy
# the required check.
on:
  push:
    branches:
      - hobbyroom/project-memory-campus-v1-20260905
  pull_request:
    branches:
      - hobbyroom/project-memory-campus-v1-20260905

permissions:
  contents: read

jobs:
  single-current-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject missing, duplicate or invalid current workbench binding
        run: |
          python3 protocol/PROJECT_MEMORY/PROJEKTE/PFERDE_ATELIER/PLUGINS/tests/guard_active_workbench.py \
            --current protocol/PROJECT_MEMORY/PROJEKTE/PFERDE_ATELIER/PLUGINS/CURRENT_STATE.md \
            --metadata-only

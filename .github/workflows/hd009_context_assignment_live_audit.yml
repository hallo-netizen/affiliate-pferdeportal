name: HD009 product candidate exact target and Airbrush rendered HTML audit
on:
  push:
    branches: [audit/hobby-airbrush-cards-design-20261113]
    paths: [.github/workflows/hd009_context_assignment_live_audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Extract context/target ranking methods and live card details
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re,urllib.request,html
          p=Path('protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE/CURRENT.zip')
          with ZipFile(p) as z:
            n='affiliate-portal-router/hobby-depot-affiliate-router.php'
            a=z.read(n).decode('utf8','replace').splitlines()
            for i,l in enumerate(a):
              if re.search(r'function .*?(?:ranked_campaign|relevan|category_product|target|slot|fallback|context|candidate)',l,re.I):
                print('FUNCTION',i+1,l[:680])
              elif re.search(r'category_product_|automation_target_keys|target_keys|relevance_score|strict.*match|match.*strict|parent.*target|slot.*context',l,re.I) and i>1000:
                print('GATE',i+1,l[:680])
            b=z.read('affiliate-portal-router/includes/trait-ppar-idealo.php').decode().splitlines()
            for i in range(650,817):
              if i<len(b):print('IDEALO_MAT',i+1,b[i][:850])
          url='https://www.hobby-depot.de/gestalten/malen-zeichnen/airbrush/'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=18) as r:s=r.read(1000000).decode('utf8','replace')
          print('LIVE_HTTP',r.status,'BYTES',len(s))
          for i in range(1,4):
            m=re.search(r'<div class="hd-next-partner-product[^>]*>.*?(?=<div class="hd-next-partner-product|</section>)',s,re.I|re.S)
            all_blocks=re.findall(r'<div class="hd-next-partner-product[^>]*>.*?(?=<div class="hd-next-partner-product|</section>)',s,re.I|re.S)
            if len(all_blocks)<i:continue
            b=all_blocks[i-1]
            import html as H
            s0=re.sub(r'<style.*?</style>','',b,flags=re.S|re.I)
            n=re.findall(r'<strong class="ppar-banner-title">([^<]+)',s0,re.I)
            imgs=re.findall(r'<img[^>]+?src="([^"]+)',s0,re.I)
            lnks=re.findall(r'<a[^>]+?href="([^"]+)',s0,re.I)
            classes=re.findall(r'ppar-group-[\w-]+',s0)
            target_attrs=re.findall(r'(?:data-|automation_target_keys|data-ppar-)[^\s>"]{1,90}',s0,re.I)
            print('CARD',i,'titles',n[:4],'classes',classes[:4], 'image',imgs[:2], 'links',lnks[:4], 'attrs',target_attrs[:15])
            print('CARD_TEXT',i,re.sub(r'<[^>]+>',' ',s0)[:700].replace('&nbsp;',' ').replace('&amp;','&'))
          PY

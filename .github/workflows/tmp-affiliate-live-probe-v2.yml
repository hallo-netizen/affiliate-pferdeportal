name: TEMP Affiliate Live Probe V2

on:
  push:
    branches:
      - affiliate-release-current
    paths:
      - '.github/workflows/tmp-affiliate-live-probe-v2.yml'
      - 'AFFILIATE_HOBBYRAUM/live_schabracken_readonly_probe.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run readonly live probe
        run: python3 AFFILIATE_HOBBYRAUM/live_schabracken_readonly_probe.py
      - name: Run readonly neighborhood probe
        run: python3 AFFILIATE_HOBBYRAUM/live_schabracken_neighborhood_probe.py

      - name: Fresh dual-page banner probe repeated no cookies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request, time, json
          pages={
            "reithelme":"https://pferde-atelier.de/ausruestung/ausruestung-reiterbedarf/reithelme/",
            "schabracken":"https://pferde-atelier.de/ausruestung/ausruestung-sattel/schabracken/",
          }
          pat=re.compile(r'<a[^>]+class=["\'][^"\']*ppar-overview-wide-banner-link[^"\']*["\'][^>]+href=["\']([^"\']+)["\']',re.I)
          pid=re.compile(r'promoId=(\d+)',re.I)
          for name,url in pages.items():
              print("=== PAGE",name,url,"===")
              for mode in ("normal","bust"):
                  for i in range(1,6):
                      u=url if mode=="normal" else url+("?ppar_probe=%d_%d"%(int(time.time()),i))
                      req=urllib.request.Request(u,headers={
                          "User-Agent":"Mozilla/5.0 ppar-live-readonly-probe",
                          "Cache-Control":"no-cache",
                          "Pragma":"no-cache",
                      })
                      with urllib.request.urlopen(req,timeout=30) as r:
                          raw=r.read().decode("utf-8","replace")
                          h=dict(r.headers.items())
                      m=pat.search(raw)
                      href=m.group(1) if m else ""
                      pm=pid.search(href)
                      promo=pm.group(1) if pm else ""
                      print("LIVE_DUAL",json.dumps({
                          "page":name,"mode":mode,"n":i,"promo":promo,"href":href,
                          "cache_control":h.get("Cache-Control",""),
                          "age":h.get("Age",""),
                          "cf_cache_status":h.get("Cf-Cache-Status",""),
                          "x_litespeed_cache":h.get("X-LiteSpeed-Cache",""),
                      },ensure_ascii=False))
          PY

      - name: Inspect exact winning ADCELL creative
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CLICK HEADERS NO FOLLOW ==='
          curl -sS -I --max-redirs 0 'https://t.adcell.com/p/click?promoId=467974&slotId=98720' || true
          echo '=== IMAGE FETCH ==='
          curl -fsSL --max-time 30 'https://t.adcell.com/p/image?promoId=467974&slotId=98720' -o /tmp/live-banner
          file /tmp/live-banner
          sha256sum /tmp/live-banner
          stat -c '%s bytes' /tmp/live-banner

      - name: Upload exact live banner image
        uses: actions/upload-artifact@v4
        with:
          name: live-schabracken-banner-467974
          path: /tmp/live-banner
          if-no-files-found: error
          retention-days: 2

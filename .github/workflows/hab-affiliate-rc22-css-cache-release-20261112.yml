name: HAB RC22 stale CSS cache proven / full plugin release
on:
  push:
    branches: [hab-affiliate-rc22-fix-css-cache-release-20261112]
    paths:
      - '.github/workflows/hab-affiliate-rc22-css-cache-release-20261112.yml'
      - 'protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/AFFILIATE/IMPLEMENTIERUNG_RC22_CSS_VERSION/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and regression test release
        shell: bash
        run: |
          set -euo pipefail
          ROOT="protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ"
          PLUGIN="$ROOT/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE"
          python3 "$ROOT/AFFILIATE/IMPLEMENTIERUNG_RC22_CSS_VERSION/build_rc22.py"
          python3 "$ROOT/AFFILIATE/IMPLEMENTIERUNG_RC22_CSS_VERSION/qa_rc22.py"
          cp "$PLUGIN/CURRENT.zip" "$PLUGIN/HAB_AFFILIATE_RC22_0.1.19-rc22.zip"
      - name: Reproduce failure with real old CSS vs corrected live CSS in Chrome
        shell: bash
        run: |
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from pathlib import Path
          from zipfile import ZipFile
          import json
          root=Path("protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE")
          with ZipFile(root/"HAB_AFFILIATE_RC20_0.1.17-rc20.zip") as z:
             old=z.read("affiliate-portal-router/assets/frontend.css").decode("utf8")
          opts=Options()
          for arg in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1440,900']:
             opts.add_argument(arg)
          driver=webdriver.Chrome(options=opts)
          try:
             driver.set_page_load_timeout(35)
             url="https://hab-und-bewahr.de/einbruch-und-diebstahl/einbruch-und-diebstahl-haus-und-wohnung/c22-haustuerschloesser-dd9773fd40/"
             driver.get(url)
             state=r'''
               const node=document.querySelector('.ppar-hb-category-products-grid');
               if (!node) return {exists:false};
               const kid=Array.from(node.children),r=node.getBoundingClientRect();
               return {exists:true,count:kid.length,display:getComputedStyle(node).display,
                 columns:getComputedStyle(node).gridTemplateColumns,
                 widths:kid.map(x=>Math.round(x.getBoundingClientRect().width)),
                 xs:kid.map(x=>Math.round(x.getBoundingClientRect().x)),
                 ys:kid.map(x=>Math.round(x.getBoundingClientRect().y)),
                 link:document.querySelector('#ppar-frontend-css').href};
             '''
             fresh=driver.execute_script(state)
             print("ACTUAL_LIVE_FRESH",json.dumps(fresh))
             assert fresh['exists'] and fresh['count']==3 and fresh['display']=='grid'
             assert len(set(fresh['xs']))==3 and len(set(fresh['ys']))==1
             stale=driver.execute_script(r'''
               const link=document.querySelector('#ppar-frontend-css');
               link.disabled=true;
               const style=document.createElement('style');
               style.id='qa-old-rc20';style.textContent=arguments[0];
               document.head.append(style);
               const node=document.querySelector('.ppar-hb-category-products-grid');
               const kids=Array.from(node.children);
               return {display:getComputedStyle(node).display,xs:kids.map(x=>Math.round(x.getBoundingClientRect().x)),ys:kids.map(x=>Math.round(x.getBoundingClientRect().y)),widths:kids.map(x=>Math.round(x.getBoundingClientRect().width))};
             ''',old)
             print("REPRO_OLD_CSS",json.dumps(stale))
             assert stale['display']!='grid' and len(set(stale['xs']))==1 and len(set(stale['ys']))==3
             restored=driver.execute_script(r'''
               document.querySelector('#qa-old-rc20').remove();
               document.querySelector('#ppar-frontend-css').disabled=false;
               const node=document.querySelector('.ppar-hb-category-products-grid'),kids=Array.from(node.children);
               return {display:getComputedStyle(node).display,xs:kids.map(x=>Math.round(x.getBoundingClientRect().x)),ys:kids.map(x=>Math.round(x.getBoundingClientRect().y))};
             ''')
             print("REPRO_RESTORED_RC21_CSS",json.dumps(restored))
             assert restored['display']=='grid' and len(set(restored['xs']))==3
             print("RC22_REAL_BROWSER_CAUSE_REPRO_PASS")
          finally:
             driver.quit()
          PY
      - name: Publish fully validated official Hab affiliate ZIP (same plugin)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ"
          DEST="$ROOT/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE"
          sha256sum "$DEST/CURRENT.zip"
          git config user.name 'Hab release verified browser'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST/CURRENT.zip" "$DEST/HAB_AFFILIATE_RC22_0.1.19-rc22.zip"
          git commit -m "Hab RC22 CSS cache: release full verified plugin ZIP"
          git push origin HEAD:hab-affiliate-rc22-fix-css-cache-release-20261112

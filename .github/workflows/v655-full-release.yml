name: V6.55 KISS public heartbeat + GitHub scheduler full release gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  v655-release:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'v655-kiss-public-heartbeat-github-scheduler-20260823'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      mariadb:
        image: mariadb:11.4
        ports:
          - 3306:3306
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: v655gate
          MARIADB_USER: wp
          MARIADB_PASSWORD: wppass
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uwp -pwppass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          tools: wp-cli
          coverage: none
      - name: Execute complete V6.55 release gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x .github/v655/runner/run-v655-full-release.sh
          .github/v655/runner/run-v655-full-release.sh
      - name: Upload final verified V6.55 release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V655_FINAL_VERIFIED_RELEASE
          path: |
            affiliate-zentrale_v6.55.0_KISS_PUBLIC_HEARTBEAT_GITHUB_SCHEDULER_REALGATE.zip
            MASTER_AFFILIATE_ZENTRALE_V6_55_0_KISS_PUBLIC_HEARTBEAT_GITHUB_SCHEDULER_REALGATE_20260823.zip
            V655_RELEASE_EVIDENCE/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Upload blocked V6.55 evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V655_BLOCKED_EVIDENCE
          path: V655_RELEASE_EVIDENCE/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

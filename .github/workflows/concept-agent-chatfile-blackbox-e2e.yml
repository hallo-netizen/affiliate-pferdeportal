name: Concept Agent Chatfile Blackbox E2E
# exact-chat-blob-trigger
# pointer-bound-trigger

on:
  push:
    branches:
      - 'hobbyroom/system4a-startgate-test-20260914'
    paths:
      - '.github/workflows/concept-agent-chatfile-blackbox-e2e.yml'

permissions:
  contents: read

jobs:
  blackbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Exact source and control entry
        run: |
          set -euo pipefail
          test -f concept_agent/CONTROL_ENTRY_POINTER.json
          test -f concept_agent/tests/fixtures/CHAT_SOURCE_EXACT.json
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('concept_agent/tests/fixtures/CHAT_SOURCE_EXACT.json')
          raw=p.read_bytes()
          x=json.loads(raw)
          actual=hashlib.sha256(raw).hexdigest()
          print('CHAT_SOURCE_GITHUB_COPY_BYTES='+str(len(raw)))
          print('CHAT_SOURCE_GITHUB_COPY_SHA256='+actual)
          print('CHAT_SOURCE_CONTRACT='+str(x.get('contract')))
          print('CHAT_SOURCE_ITEM_COUNT='+str((x.get('next_textmachine_metadata_batch') or {}).get('item_count')))
          print('CHAT_SOURCE_BATCH_SHA256='+str((x.get('next_textmachine_metadata_batch') or {}).get('batch_sha256')))
          assert x['contract']=='PSERC_METADATA_ONLY_READ_ONLY_PREVIEW_V5_DUAL_STRAND'
          assert x['next_textmachine_metadata_batch']['item_count']==16
          assert x['next_textmachine_metadata_batch']['batch_sha256']=='df59b8428c5e3f0750c5523091c00a1172975109823ee816d2234cf9052505d0'
          print('CHAT_SOURCE_BYTES_PASS')
          PY

      - name: Run exact 1 and 3 article positive-negative restart blackbox
        id: blackbox
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy,hashlib,json,subprocess,sys,tempfile
          from pathlib import Path

          ROOT=Path('.').resolve()
          SNAP=ROOT/'concept_agent/tests/fixtures/CHAT_SOURCE_EXACT.json'
          WORKFLOW=ROOT/'.github/workflows/concept-agent-production.yml'
          OUT=Path('/tmp/concept-agent-blackbox')
          OUT.mkdir(parents=True,exist_ok=True)

          def canon(v):
              return json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode('utf-8')
          def stable(v):
              return hashlib.sha256(canon(v)).hexdigest()
          def make(n, negative=None):
              x=json.loads(SNAP.read_text(encoding='utf-8'))
              b=x['next_textmachine_metadata_batch']
              b['items']=b['items'][:n]
              b['item_count']=n
              if negative=='bad-batch-hash':
                  b['batch_sha256']='0'*64
              elif negative=='duplicate-slot':
                  b['items'][1]['plan_slot']=b['items'][0]['plan_slot']
                  core=dict(b); core.pop('batch_sha256',None); b['batch_sha256']=stable(core)
              else:
                  core=dict(b); core.pop('batch_sha256',None); b['batch_sha256']=stable(core)
              return x

          cases=[
              ('positive-1',1,None,True),
              ('negative-1-batch-hash',1,'bad-batch-hash',False),
              ('positive-3',3,None,True),
              ('negative-3-duplicate-slot',3,'duplicate-slot',False),
          ]
          proof={'contract':'CONCEPT_AGENT_CHATFILE_BLACKBOX_E2E_V1','source_sha256':hashlib.sha256(SNAP.read_bytes()).hexdigest(),'cases':[],'publish_allowed':False}
          yaml=WORKFLOW.read_text(encoding='utf-8')
          stop_present='"allowed_operation":"PREPARE_INTAKE_ONLY"' in yaml
          for name,n,neg,positive in cases:
              case=OUT/name; case.mkdir()
              snap=case/'snapshot.json'
              intake=case/'CONCEPT_AGENT_INTAKE.json'
              snap.write_text(json.dumps(make(n,neg),ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              cp=subprocess.run([sys.executable,'concept_agent/intake_bridge.py','prepare',str(snap),str(intake)],cwd=ROOT,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              row={'case':name,'article_count':n,'positive':positive,'intake_rc':cp.returncode,'stdout':cp.stdout.strip(),'stderr':cp.stderr.strip(),'final_file_count':0}
              if positive:
                  row['intake_pass']=cp.returncode==0 and 'CONCEPT_AGENT_INTAKE_READY' in cp.stdout
                  # Exact current control behavior after successful restart intake:
                  # production workflow writes PREPARE_INTAKE_ONLY and returns without a final file.
                  row['control_prepare_intake_only']=stop_present
                  finals=list(case.glob('PSERC_APPROVED_PRODUCTION_PACKAGE_FINAL.json'))
                  row['final_file_count']=len(finals)
                  row['end_to_end_pass']=row['intake_pass'] and (not stop_present) and len(finals)==1
                  if not row['end_to_end_pass']:
                      row['failure']='CONTROL_STOP_AFTER_INTAKE' if stop_present else 'FINAL_FILE_NOT_PRODUCED'
              else:
                  row['blocked_as_required']=cp.returncode!=0
                  if neg=='bad-batch-hash':
                      row['expected_reason']='BATCH_SHA_MISMATCH'
                      row['reason_match']='BATCH_SHA_MISMATCH' in cp.stderr
                  else:
                      row['expected_reason']='PLAN_SLOT_DUPLICATE:1'
                      row['reason_match']='PLAN_SLOT_DUPLICATE:1' in cp.stderr
              proof['cases'].append(row)

          proof['positive_all_pass']=all(r.get('end_to_end_pass') is True for r in proof['cases'] if r['positive'])
          proof['negative_all_pass']=all(r.get('blocked_as_required') is True and r.get('reason_match') is True for r in proof['cases'] if not r['positive'])
          proof['status']='PASS' if proof['positive_all_pass'] and proof['negative_all_pass'] else 'FAIL'
          raw=canon(proof)
          proof['proof_sha256']=hashlib.sha256(raw).hexdigest()
          (OUT/'CONCEPT_AGENT_CHATFILE_BLACKBOX_E2E_V1.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(proof,ensure_ascii=False,indent=2))
          if proof['status']!='PASS':
              raise SystemExit(1)
          PY

      - name: Mid-workflow chat handoff and abort re-entry
        id: reentry
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, hashlib, json, sys
          from pathlib import Path
          sys.path.insert(0,'concept_agent')
          import full_workflow_gate as gate

          OUT=Path('/tmp/concept-agent-blackbox')
          OUT.mkdir(parents=True,exist_ok=True)
          SNAP=json.loads(Path('concept_agent/tests/fixtures/CHAT_SOURCE_EXACT.json').read_text(encoding='utf-8'))

          def h(label):
              return hashlib.sha256(label.encode()).hexdigest()

          def base_pair(n, body_count, lt_count, ppm_count, next_index):
              items=SNAP['next_textmachine_metadata_batch']['items'][:n]
              core={
                  'contract':'PSERC_TEXTMACHINE_METADATA_BATCH_V2',
                  'status':'READY_FOR_TEXTMACHINE_METADATA_INTAKE',
                  'item_count':n,
                  'maximum_articles':0,
                  'maximum_articles_per_type':0,
                  'publish_allowed':False,
                  'content_or_format_payload_present':False,
                  'items':items,
              }
              batch=gate.stable(core)
              pointer={
                  'contract':'PFERDE_ATELIER_CONCEPT_AGENT_WORK_BINDING_POINTER_V1',
                  'workflow':'PFERDE_ATELIER_KONZEPT_5_CONCEPT_AGENT',
                  'batch_sha256':batch,
                  'item_count':n,
                  'intake_sha256':h('intake-'+batch),
                  'research_binding_sha256':h('research-'+batch),
                  'authoring_bindings_file_sha256':h('authoring-'+batch),
                  'cross_chat_transport_sha256':h('transport-file-'+batch),
                  'cross_chat_transport_binding_sha256':h('transport-binding-'+batch),
                  'cross_chat_transport_required':True,
                  'publish_allowed':False,
              }
              current={
                  'concept_agent_current_batch':{
                      'workflow':'PFERDE_ATELIER_KONZEPT_5_CONCEPT_AGENT',
                      'batch_sha256':batch,
                      'item_count':n,
                      'intake_status':'PASS',
                      'research_binding_status':'PASS',
                      'authoring_binding_status':'PASS',
                      'cross_chat_transport_sha256':pointer['cross_chat_transport_sha256'],
                      'article_bodies_completed':body_count,
                      'languagetool_6_8_completed':lt_count,
                      'ppm_6_7_9_completed':ppm_count,
                      'next_article_index':next_index,
                      'pserc_batch_completed':False,
                      'endstempel_completed':False,
                      'final_wordpress_import_file_present':False,
                      'publish_allowed':False,
                  }
              }
              return pointer,current

          cases=[]

          # 1 article: chat starts after all pre-writing bindings, before article body.
          p,s=base_pair(1,0,0,0,0)
          root=OUT/'reentry-positive-1'; root.mkdir()
          pp=root/'pointer.json'; sp=root/'current.json'
          pp.write_text(json.dumps(p),encoding='utf-8'); sp.write_text(json.dumps(s),encoding='utf-8')
          proof=gate.verify_current_entry(pp,sp,root)
          ok=(proof['workflow_entry']=='ALWAYS_FROM_STAGE_0' and
              proof['validated_completed_stages']==['INTAKE','RESEARCH','RESEARCH_BOUND','AUTHORING_BOUND'] and
              proof['next_stage']=='ARTICLE_PRODUCTION' and
              s['concept_agent_current_batch']['next_article_index']==0)
          cases.append({'case':'reentry-positive-1-before-article','pass':ok,'proof':proof})

          # 3 articles: article 0 persisted, abort/chat switch, continuation must remain article index 1.
          p,s=base_pair(3,1,1,1,1)
          root=OUT/'reentry-positive-3-after-article-0'; root.mkdir()
          pp=root/'pointer.json'; sp=root/'current.json'
          pp.write_text(json.dumps(p),encoding='utf-8'); sp.write_text(json.dumps(s),encoding='utf-8')
          proof=gate.verify_current_entry(pp,sp,root)
          ok=(proof['workflow_entry']=='ALWAYS_FROM_STAGE_0' and
              proof['validated_completed_stages']==['INTAKE','RESEARCH','RESEARCH_BOUND','AUTHORING_BOUND'] and
              proof['next_stage']=='ARTICLE_PRODUCTION' and
              s['concept_agent_current_batch']['next_article_index']==1)
          cases.append({'case':'reentry-positive-3-resume-at-article-1','pass':ok,'saved_next_article_index':1,'proof':proof})

          # Negative: forged skip from persisted article 1 to article 2.
          p,s=base_pair(3,1,1,1,2)
          root=OUT/'reentry-negative-skip-index'; root.mkdir()
          pp=root/'pointer.json'; sp=root/'current.json'
          pp.write_text(json.dumps(p),encoding='utf-8'); sp.write_text(json.dumps(s),encoding='utf-8')
          blocked=False; reason=''
          try:
              gate.verify_current_entry(pp,sp,root)
          except gate.Blocked as exc:
              blocked=True; reason=str(exc)
          cases.append({'case':'reentry-negative-forged-next-article-2','pass':blocked and reason=='CURRENT_NEXT_ARTICLE_INDEX_MISMATCH','blocked':blocked,'reason':reason})

          # Negative: transport binding changed across chat handoff.
          p,s=base_pair(3,1,1,1,1)
          s['concept_agent_current_batch']['cross_chat_transport_sha256']='0'*64
          root=OUT/'reentry-negative-transport'; root.mkdir()
          pp=root/'pointer.json'; sp=root/'current.json'
          pp.write_text(json.dumps(p),encoding='utf-8'); sp.write_text(json.dumps(s),encoding='utf-8')
          blocked=False; reason=''
          try:
              gate.verify_current_entry(pp,sp,root)
          except gate.Blocked as exc:
              blocked=True; reason=str(exc)
          cases.append({'case':'reentry-negative-transport-tamper','pass':blocked and reason=='CURRENT_TRANSPORT_POINTER_STATE_MISMATCH','blocked':blocked,'reason':reason})

          result={
              'contract':'CONCEPT_AGENT_CHAT_REENTRY_BLACKBOX_V1',
              'status':'PASS' if all(x['pass'] for x in cases) else 'FAIL',
              'cases':cases,
              'rule':'NEW_CHAT_AND_CONTINUATION_REENTER_AT_STAGE_0_VALIDATE_AND_FAST_FORWARD_ONLY',
              'publish_allowed':False,
          }
          result['proof_sha256']=gate.stable(result)
          (OUT/'CONCEPT_AGENT_CHAT_REENTRY_BLACKBOX_V1.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if result['status']!='PASS':
              raise SystemExit(1)
          PY

      - name: Upload hard proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concept-agent-chatfile-blackbox-e2e-${{ github.sha }}
          path: /tmp/concept-agent-blackbox/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce overall PASS
        if: steps.blackbox.outcome != 'success' || steps.reentry.outcome != 'success'
        run: |
          echo 'CONCEPT_AGENT_CHATFILE_BLACKBOX_E2E_FAILED'
          exit 1

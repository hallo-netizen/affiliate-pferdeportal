name: K10 live scale E2E TÜV article

on:
  push:
    branches: [konzept10-rule-ledger-20261001]
    paths:
      - 'real_runs/20261002_live_scale_tuev/**'
      - '.github/workflows/k10-live-scale-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENDSTEMPEL_PRIVATE_KEY: ${{ secrets.ENDSTEMPEL_PRIVATE_KEY }}
      START_COMMIT: 1633a766c41a4d878320ae889c702de996306e57
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind current PSERC metadata read-only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:concept_agent/current/PSERC_METADATA_SNAPSHOT.json > /tmp/pserc.json
          python3 - <<'PY'
          import json
          a=json.load(open('real_runs/20261002_live_scale_tuev/ARTICLE_INPUT.json'))
          s=json.load(open('/tmp/pserc.json'))
          b=a['planning_binding']
          rows=(s.get('next_textmachine_metadata_batch') or {}).get('items') or []
          hits=[x for x in rows if all(str(x.get(k) or '')==str(b.get(k) or '') for k in ('article_type','category','plan_slot','target_keyword','title'))]
          assert len(hits)==1, f'PSERC_CURRENT_METADATA_BINDING_MISSING:{len(hits)}'
          assert s.get('system_boundary',{}).get('publish_allowed') is False
          print('K10_PSERC_CURRENT_METADATA_PASS')
          PY

      - name: Resolve real WordPress category id
        shell: bash
        run: |
          set -euo pipefail
          slug="$(python3 - <<'PY'
          import json
          print(json.load(open('real_runs/20261002_live_scale_tuev/ARTICLE_INPUT.json'))['wordpress_category']['slug'])
          PY
          )"
          curl --fail --location --retry 3 --silent --show-error "https://pferde-atelier.de/wp-json/wp/v2/categories?slug=$slug" -o /tmp/category.json
          python3 - <<'PY'
          import json
          a=json.load(open('real_runs/20261002_live_scale_tuev/ARTICLE_INPUT.json'))
          rows=json.load(open('/tmp/category.json'))
          slug=a['wordpress_category']['slug']
          hits=[x for x in rows if isinstance(x,dict) and x.get('slug')==slug and int(x.get('id') or 0)>0]
          assert len(hits)==1, f'WORDPRESS_CATEGORY_ID_NOT_UNIQUE:{len(hits)}'
          print('K10_WORDPRESS_CATEGORY_PASS:'+str(hits[0]['id']))
          PY

      - name: Download exact LanguageTool 6.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/k10-lt68 /tmp/k10-live
          curl --fail --location --retry 3 https://github.com/jxmorris12/language_tool_python/releases/download/LanguageTool-6.8/LanguageTool-6.8.zip -o /tmp/k10-lt68/LanguageTool-6.8.zip
          echo '6a7f6b67b779ae9505f7579f0c41453ea8d1bd72ae750bdc2c55ba974281467d  /tmp/k10-lt68/LanguageTool-6.8.zip' | sha256sum -c -
          unzip -q /tmp/k10-lt68/LanguageTool-6.8.zip -d /tmp/k10-lt68
          echo '2122882e800d312a0543d895c56c0a84a9bb131c9b9846efd8fc033129353ae8  /tmp/k10-lt68/LanguageTool-6.8/languagetool-commandline.jar' | sha256sum -c -

      - name: Run live article with end-to-end timing
        shell: bash
        run: |
          set +e
          set -uo pipefail
          article='real_runs/20261002_live_scale_tuev/ARTICLE_INPUT.json'
          research='real_runs/20261002_live_scale_tuev/RESEARCH.json'
          start_epoch="$(git show -s --format=%ct "$START_COMMIT")"
          machine_start="$(date +%s%3N)"
          python3 -m engine.lt68_external /tmp/k10-lt68/LanguageTool-6.8/languagetool-commandline.jar "$article" /tmp/k10-live/lt68.json
          lt_rc=$?
          lt_end="$(date +%s%3N)"
          python3 -m engine.optimization_proof "$article" "$research" /tmp/pserc.json /tmp/category.json /tmp/k10-live/lt68.json /tmp/k10-live/proof
          proof_rc=$?
          proof_end="$(date +%s%3N)"
          python3 - "$article" "$start_epoch" "$machine_start" "$lt_end" "$proof_end" "$lt_rc" "$proof_rc" <<'PY'
          import json,sys,time,pathlib,re
          ap,start_epoch,machine_start,lt_end,proof_end,lt_rc,proof_rc=sys.argv[1:]
          a=json.load(open(ap))
          lt=json.load(open('/tmp/k10-live/lt68.json')) if pathlib.Path('/tmp/k10-live/lt68.json').is_file() else {}
          rp=pathlib.Path('/tmp/k10-live/proof/FINAL_REPORT.json')
          report=json.load(open(rp)) if rp.is_file() else {}
          end_epoch_ms=int(proof_end)
          p={
            'contract':'K10_LIVE_SCALE_E2E_PROTOCOL_V1',
            'article_title':a['title'],
            'article_type':a['article_type'],
            'research_start_commit':'1633a766c41a4d878320ae889c702de996306e57',
            'wall_from_research_start_ms':end_epoch_ms-int(start_epoch)*1000,
            'language_tool_ms':int(lt_end)-int(machine_start),
            'proof_ms':int(proof_end)-int(lt_end),
            'machine_validation_ms':int(proof_end)-int(machine_start),
            'lt68_status':lt.get('status'),
            'lt68_findings':lt.get('finding_count'),
            'article_rules':(report.get('article_rules') or {}).get('status'),
            'system_rules':(report.get('system_rules') or {}).get('status'),
            'pserc':report.get('pserc_metadata_binding'),
            'endstempel':report.get('endstempel'),
            'wordpress_file_verify':report.get('wordpress_file_verify'),
            'terminal_status':report.get('status'),
            'publish_allowed':False,
            'return_codes':{'lt68':int(lt_rc),'proof':int(proof_rc)}
          }
          json.dump(p,open('/tmp/k10-live/PROTOCOL.json','w'),ensure_ascii=False,indent=2,sort_keys=True)
          print('K10_LIVE_E2E_PROTOCOL='+json.dumps(p,ensure_ascii=False,sort_keys=True))
          PY
          if [ "$lt_rc" -ne 0 ] || [ "$proof_rc" -ne 0 ]; then exit 4; fi

      - name: Upload live E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k10-live-scale-tuev
          path: /tmp/k10-live
          if-no-files-found: error
          retention-days: 30

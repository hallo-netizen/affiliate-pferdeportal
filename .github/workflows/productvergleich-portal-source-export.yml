name: Productvergleich portal source export
on:
  push:
    branches:
      - hobbyroom/productvergleich-workflow-v070-20260908
    paths:
      - .github/workflows/productvergleich-portal-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact portal source
        shell: bash
        run: |
          set -euo pipefail
          test -f affiliate-portal-router/assets/portal-structure-v279.json
          printf '%s  %s\n' "$(sha256sum affiliate-portal-router/assets/portal-structure-v279.json | awk '{print $1}')" "affiliate-portal-router/assets/portal-structure-v279.json"
      - name: Upload portal source
        uses: actions/upload-artifact@v4
        with:
          name: productvergleich-portal-structure-v279
          path: affiliate-portal-router/assets/portal-structure-v279.json
          if-no-files-found: error
          retention-days: 1

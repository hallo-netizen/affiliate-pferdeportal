name: HD009 0.1.39 original PHP exact equipment form regression and full plugin
on:
  push:
    branches: [hobbyroom/hd009-039-validated-equipment-forms-20261113]
    paths: [.github/workflows/hd009_0139_real_equipment_qa.yml, scripts/hd009_0139_safe_compound_equipment_build.py, scripts/hd009_0139_original_php_equipment_qa.py]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact candidate, no changes to stable CURRENT
        run: |
          python3 scripts/hd009_0138_equipment_match_candidate.py /tmp/HD009_0138_BASE.zip
          python3 scripts/hd009_0139_safe_compound_equipment_build.py /tmp/HD009_0138_BASE.zip /tmp/HOBBY_DEPOT_HD009_0.1.39_VALIDATED_EQUIPMENT_CANDIDATE.zip
      - name: Validate all ZIP entries, every PHP file, and unchanged import + provider methods
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import re,hashlib
          original='protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE/CURRENT.zip'
          candidate='/tmp/HOBBY_DEPOT_HD009_0.1.39_VALIDATED_EQUIPMENT_CANDIDATE.zip'
          with ZipFile(original) as x,ZipFile(candidate) as z:
            assert x.testzip() is None and z.testzip() is None
            assert x.namelist()==z.namelist() and len(z.namelist())==41
            a='affiliate-portal-router/hobby-depot-affiliate-router.php'
            b='affiliate-portal-router/includes/trait-ppar-idealo.php'
            diffs=[n for n in x.namelist() if x.read(n)!=z.read(n)]
            assert set(diffs)=={a,b},diffs
            old=x.read(b).decode();new=z.read(b).decode()
            def method(s,n):
              start=re.search(r'^    (?:private|public|protected) function '+re.escape(n)+r'\(',s,re.M)
              assert start,n
              i=s.index('\n    }',start.end())+6
              return s[start.start():i]
            unchanged=[
              'idealo_import_feed_file','idealo_materialize_campaigns','idealo_find_feed_metadata',
              'idealo_download_feed_to_temp','idealo_stream_close','idealo_refresh_remote_feed',
              'hd_idealo_standard_feed_compare_work','hd_idealo_preview_csv',
              'idealo_match_normalize','idealo_match_stem','idealo_match_tokens',
              'idealo_match_distinct_tokens','idealo_normalize_gtins_from_values'
            ]
            for q in unchanged:
              if 'function '+q+'(' in old:
                assert method(old,q)==method(new,q),'Core/provider changed: '+q
            assert new.count("private function idealo_match_specific_equipment_tokens(")==1
            assert new.count("if (count($owners)!==1)")>=1
            for n in z.namelist():
              if n.endswith('.php'):
                p=Path('/tmp/hd009_0139_PHP')/n
                p.parent.mkdir(parents=True,exist_ok=True)
                p.write_bytes(z.read(n))
            print('ZIP41_PASS_ONLY_ORIGINAL_TRAIT_AND_VERSION_CHANGED')
            print('ORIGINAL_FEED_API_SYNC_MATERIALIZATION_UNCHANGED')
            print('NEW_SHA256',hashlib.sha256(Path(candidate).read_bytes()).hexdigest())
          PY
          find /tmp/hd009_0139_PHP -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Execute exact original PHP methods and real HD007 records including wrong matches
        run: |
          python3 scripts/hd009_0139_original_php_equipment_qa.py /tmp/HOBBY_DEPOT_HD009_0.1.39_VALIDATED_EQUIPMENT_CANDIDATE.zip /tmp/hd009_0139_real_php.php protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-007-HOBBYREGISTER-CORE/CURRENT.zip
          php -l /tmp/hd009_0139_real_php.php
          php /tmp/hd009_0139_real_php.php

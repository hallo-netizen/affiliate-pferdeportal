name: Affiliate Release Governance V4 One-Time Validation

on:
  push:
    branches: [affiliate-release-governance-bootstrap-20260829]
    paths:
      - '.github/workflows/affiliate-release-governance-bootstrap-materialize.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v4-external-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout clean permanent governance branch
        uses: actions/checkout@v4
        with:
          ref: affiliate-release-current
          fetch-depth: 1
          persist-credentials: false
      - name: Assert obsolete bootstrap architecture is absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e release/affiliate-zentrale/bootstrap-parts
          test ! -e .github/workflows/affiliate-release-governance-bootstrap-materialize.yml
          echo CLEAN_V4_BRANCH_PASS
      - name: Run V4 positive and negative anti-drift suite
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 control/release-governance/test_release_guard.py
      - name: Verify governance contract itself
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 control/release-governance/release_guard.py governance-check
      - name: Prove missing canonical source fails closed
        shell: bash
        run: |
          set -euo pipefail
          if PYTHONDONTWRITEBYTECODE=1 python3 control/release-governance/release_guard.py source-check; then
            echo SOURCE_CHECK_UNEXPECTEDLY_PASSED
            exit 1
          fi
          echo MISSING_CANONICAL_SOURCE_FAIL_CLOSED_PASS

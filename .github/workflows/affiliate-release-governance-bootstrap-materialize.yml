name: Affiliate Release Governance V4 One-Time Materialize

on:
  push:
    branches: [affiliate-release-governance-bootstrap-20260829]
    paths:
      - '.github/workflows/affiliate-release-governance-bootstrap-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-exact-current-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize exact V6.63.8 direct source from pinned V6.63.6 plus MASTER-bound patch
        shell: bash
        run: |
          set -euo pipefail

          BASE_COMMIT='36a5478ade3a1ad0a9aa51ef7e31f7ef19442892'
          BASE_ZIP_SHA='f2d8d10fe59216b50bd481a486542727fc3d0d9f4cc86c8a30c602222c442f7e'
          MANIFEST='release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt'
          MANIFEST_SHA='40972031c4e6ca2937bc3571de1b537950b8311e607c86d304b25c74ad3047d1'
          PATCH_PARTS='release/affiliate-zentrale/bootstrap-parts/v6636-to-v6638-exact'
          TARGET='release/affiliate-zentrale/current'

          test "$(git branch --show-current)" = 'affiliate-release-governance-bootstrap-20260829'
          printf '%s  %s\n' "$MANIFEST_SHA" "$MANIFEST" | sha256sum -c -
          test "$(git hash-object "$PATCH_PARTS/part00")" = '6be15d04c250ad5bc2eeed2c646a4587bffb98ac'

          git fetch --no-tags origin "$BASE_COMMIT"
          : > /tmp/v6636.b64
          for n in 00 01 02 03 04; do
            git show "$BASE_COMMIT:CI_V6636/installer_b64/chunk$n" >> /tmp/v6636.b64
          done
          tr -d '\r\n' < /tmp/v6636.b64 | base64 -d > /tmp/v6636.zip
          printf '%s  %s\n' "$BASE_ZIP_SHA" /tmp/v6636.zip | sha256sum -c -

          rm -rf /tmp/v6636-work
          mkdir -p /tmp/v6636-work
          unzip -q /tmp/v6636.zip -d /tmp/v6636-work
          test -d /tmp/v6636-work/affiliate-portal-router

          cat "$PATCH_PARTS"/part* > /tmp/v6636-to-v6638.gz.b64
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          encoded = ''.join(Path('/tmp/v6636-to-v6638.gz.b64').read_text().split())
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          Path('/tmp/v6636-to-v6638.patch').write_bytes(raw)
          PY

          first="$(grep -m1 '^diff --git ' /tmp/v6636-to-v6638.patch)"
          test -n "$first"
          left="$(printf '%s\n' "$first" | awk '{print $3}')"
          right="$(printf '%s\n' "$first" | awk '{print $4}')"
          left="${left#a/}"
          right="${right#b/}"
          if [ "${left%%/*}" = "${right%%/*}" ]; then strip=1; else strip=2; fi

          cd /tmp/v6636-work
          git init -q
          git config user.name 'affiliate-release-bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add affiliate-portal-router
          git commit -qm 'exact V6.63.6 base'
          git apply --binary --check -p"$strip" /tmp/v6636-to-v6638.patch
          git apply --binary -p"$strip" /tmp/v6636-to-v6638.patch

          python3 - "$GITHUB_WORKSPACE/$MANIFEST" <<'PY'
          from pathlib import Path
          import hashlib, sys
          root = Path('/tmp/v6636-work')
          manifest = Path(sys.argv[1])
          expected = {}
          for line in manifest.read_text().splitlines():
              line=line.strip()
              if not line: continue
              sha, rel = line.split(None, 1)
              expected[rel.strip()] = sha
          actual = sorted(str(p.relative_to(root)) for p in (root/'affiliate-portal-router').rglob('*') if p.is_file())
          if actual != sorted(expected): raise SystemExit(f'EXACT_FILESET_MISMATCH expected={len(expected)} actual={len(actual)}')
          for rel, want in expected.items():
              got = hashlib.sha256((root/rel).read_bytes()).hexdigest()
              if got != want: raise SystemExit(f'HASH_MISMATCH {rel} {got} != {want}')
          if len(expected) != 21: raise SystemExit(f'MANIFEST_COUNT_MISMATCH {len(expected)}')
          print('DIRECT_SOURCE_21_OF_21_HASH_PASS')
          PY

          cd "$GITHUB_WORKSPACE"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp -a /tmp/v6636-work/affiliate-portal-router "$TARGET/"

          git add "$TARGET/affiliate-portal-router"
          if git diff --cached --quiet; then
            echo 'CANONICAL_SOURCE_ALREADY_IDENTICAL'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'bootstrap: materialize exact V6638 canonical 21-file source'
            git push origin HEAD:affiliate-release-governance-bootstrap-20260829
          fi


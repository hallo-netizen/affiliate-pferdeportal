          python3 scripts/hd003_150815_real_methods_qa.py /tmp/HOBBY_DEPOT_DESIGN_HD003_1.50.815_EDITOR_PLATZVORSCHAU.zip /tmp/hd003_815_retest.php
          php /tmp/hd003_815_retest.php
      - name: Copy only to existing Design candidate office and append error register
        run: |
          python3 scripts/hd003_150815_archive_candidate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-003-DESIGN-TEMPLATE-KIT/CANDIDATES/HOBBY_DEPOT_DESIGN_HD003_1.50.815_ADMIN_VORSCHAU_NUR_TEST.zip

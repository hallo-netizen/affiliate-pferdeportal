          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/DESIGN/HD003_FEHLERPROTOKOLL_LEERE_PRODUKTKARTEN_20261113.md
          git commit -m "HD003 1.50.815: tested compact logged-in-only placement status, no large fake cards, current unchanged"
          git fetch origin hobbyroom/hd003-150815-admin-compact-empty-preview-20261113
          git rebase origin/hobbyroom/hd003-150815-admin-compact-empty-preview-20261113
          git push origin HEAD:refs/heads/hobbyroom/hd003-150815-admin-compact-empty-preview-20261113

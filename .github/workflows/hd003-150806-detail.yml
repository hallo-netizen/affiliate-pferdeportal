            a=z.read('affiliate-portal-template-kit/includes/hobby-depot-article-hero-v150789.php').decode()
            print('HD003_TAIL',a[-14500:])
            b=z.read('affiliate-portal-template-kit/includes/hobby-depot-design-test-v150787.php').decode()

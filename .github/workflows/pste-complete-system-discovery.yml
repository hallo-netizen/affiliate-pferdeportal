name: PSTE Complete System Simulation Discovery

on:
  push:
    branches:
      - pste-05700-server-step-driver-proof
  workflow_dispatch:

jobs:
  discover-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Reconstruct current final candidate
        shell: bash
        run: |
          set -euo pipefail
          cat proof/pste-05700-final-zip/finalzip.b64.part* | base64 -d > /tmp/PSTE-0.57.0-FINAL.zip
          echo "4093fdb3c9cb1eca1691ceec9a2f1e9a97675982b01f2e440e99fba290b40f06  /tmp/PSTE-0.57.0-FINAL.zip" | sha256sum -c -
          rm -rf /tmp/pste57
          mkdir -p /tmp/pste57
          unzip -q /tmp/PSTE-0.57.0-FINAL.zip -d /tmp/pste57
      - name: Extract historical Codex full-workflow pack
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/codex
          mkdir -p /tmp/codex
          unzip -q CODEX_PSTE056_HANDOFF_MINIMAL_20260820.zip -d /tmp/codex
          echo "=== RELEVANT CODEX FILES ==="
          find /tmp/codex -type f | grep -Ei 'full.workflow|workflow|planning.readiness|breadth|rootcause|test_.*php' || true
          echo "=== CODEX TOP FILES ==="
          find /tmp/codex -type f | sort | sed -n '1,500p'
          echo "=== END CODEX FILES ==="
      - name: Run candidate bundled tests
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN=/tmp/pste57/portal-seo-topic-engine
          php_count="$(find "$PLUGIN" -type f -name '*.php' | wc -l)"
          while IFS= read -r f; do php -l "$f" >/dev/null; done < <(find "$PLUGIN" -type f -name '*.php' | sort)
          echo "PASS CANDIDATE_PHP_LINT $php_count"
          found=0
          if [ -d "$PLUGIN/tests" ]; then
            for f in "$PLUGIN"/tests/*.php; do
              [ -f "$f" ] || continue
              found=1
              echo "=== CANDIDATE_TEST $(basename "$f") ==="
              php "$f"
            done
          fi
          echo "CANDIDATE_BUNDLED_TESTS_FOUND=$found"
      - name: Inventory exact historical full workflow tests
        shell: bash
        run: |
          set -euo pipefail
          echo "=== PHP TEST INVENTORY ==="
          find /tmp/codex -type f -name '*.php' | grep -Ei 'test_|workflow|breadth|planning|rootcause' || true
          echo "=== JSON WORKFLOW INVENTORY ==="
          find /tmp/codex -type f -name '*.json' | grep -Ei 'FULL_WORKFLOW|WORKFLOW|BREADTH|PLANNING|ROOTCAUSE' || true

      - name: Inspect exact PSERC compiler runtime package
        shell: bash
        run: |
          set -euo pipefail
          test -f control/startmaster0107/runtime_packages/PSERC-FIX.zip
          echo "77a14aca97f46d60bc9001d66327abb68dd9cac9ad111f8ecefa1a8afd345314  control/startmaster0107/runtime_packages/PSERC-FIX.zip" | sha256sum -c -
          rm -rf /tmp/pserc
          mkdir -p /tmp/pserc
          unzip -q control/startmaster0107/runtime_packages/PSERC-FIX.zip -d /tmp/pserc
          echo "=== PSERC ENTRYPOINTS ==="
          find /tmp/pserc -type f | sort | sed -n '1,1200p'
          echo "=== PSERC PHP SYMBOLS ==="
          grep -RIn -E 'plan_slot|READY|PSTE|handoff|compile|generation|retention|production_plan' /tmp/pserc --include='*.php' || true
          echo "=== PSERC TESTS ==="
          find /tmp/pserc -type f | grep -Ei 'test|workflow|fixture' || true

      - name: Inspect exact inner PSERC compiler
        shell: bash
        run: |
          set -euo pipefail
          inner="$(find /tmp/pserc -type f -name 'portal-seo-editorial-plan-compiler_*.zip' | head -1)"
          test -n "$inner"
          sha256sum "$inner"
          rm -rf /tmp/pserc-inner
          mkdir -p /tmp/pserc-inner
          unzip -q "$inner" -d /tmp/pserc-inner
          echo "=== INNER PSERC FILES ==="
          find /tmp/pserc-inner -type f | sort | sed -n '1,1600p'
          echo "=== INNER PSERC SYMBOLS ==="
          grep -RIn -E 'plan_slot|plan_slot_sha256|READY|PSTE|handoff|compile|generation|retention|production_plan|canonical_article' /tmp/pserc-inner --include='*.php' || true
          echo "=== INNER PSERC TESTS ==="
          find /tmp/pserc-inner -type f | grep -Ei 'test|workflow|fixture' || true

      - name: Upload exact inner PSERC compiler for combined harness
        uses: actions/upload-artifact@v4
        with:
          name: PSERC-0.28.18-EXACT-INNER-COMPILER
          path: /tmp/pserc-inner/portal-seo-editorial-plan-compiler
          if-no-files-found: error
          retention-days: 7

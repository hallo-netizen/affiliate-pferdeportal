name: System4A temp 1N proof
on:
  push:
    branches:
      - 'hobbyroom/system4a-production-1n-20260917'
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove productive 1..N sequencing
        run: |
          set -euo pipefail
          python3 control/startmaster0107/test_system4_107007_batch.py
      - name: Refresh exact 107007 hash chain
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          step=Path('control/startmaster0107/STEP_107007_RUN_NEW_ARTICLE_BATCH_NO_STOP.json')
          state=Path('control/startmaster0107/CURRENT_STATE.json')
          root=Path('control/startmaster0107/PFERDE_ATELIER_START_HERE.json')
          h=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          step_sha=h(step)
          s=json.loads(state.read_text(encoding='utf-8'))
          s['execution_gate']['bundle_sha256']=step_sha
          s['execution_gate_rearm_target']['bundle_sha256']=step_sha
          state.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          state_sha=h(state)
          r=json.loads(root.read_text(encoding='utf-8'))
          r['current_state_sha256']=state_sha
          root.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('STEP_SHA256='+step_sha)
          print('STATE_SHA256='+state_sha)
          print('BATCH_SHA256='+h(Path('control/startmaster0107/system4_107007_batch.py')))
          PY
          if git diff --quiet -- control/startmaster0107/CURRENT_STATE.json control/startmaster0107/PFERDE_ATELIER_START_HERE.json; then
            echo 'HASH_CHAIN_ALREADY_CURRENT'
            exit 0
          fi
          git config user.name 'hallo-netizen'
          git config user.email 'hallo@oliver-beil.de'
          git add control/startmaster0107/CURRENT_STATE.json control/startmaster0107/PFERDE_ATELIER_START_HERE.json
          git commit -m 'system4: refresh 107007 1N hash chain'
          git push origin HEAD:hobbyroom/system4a-production-1n-20260917

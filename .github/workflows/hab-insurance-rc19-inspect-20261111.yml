name: Hab insurance RC19 source inspection
on:
  push:
    branches: [hab-insurance-affiliate-rc19-guard-20261111]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: locate selection and banner geometry calls
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          import re
          z=ZipFile('protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip')
          p='affiliate-portal-router/affiliate-portal-router.php'
          a=z.read(p).decode().splitlines()
          for i,l in enumerate(a):
            if any(s in l for s in ['overview_wide_banner_campaign_eligible(','category_large_banner_campaign_eligible(','campaign_match_rank(','select_campaign_for_slot(','ranked_campaigns_for_slot(']):
              print('CALL',i+1,l.strip()[:320])
          for i,l in enumerate(a):
            if re.search(r'function\s+ranked_campaigns_for_slot\(',l):
              for j in range(i,min(len(a),i+145)):print('RANKED',j+1,a[j][:350])
          PY
      - name: inspect exact selector methods
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          import re
          z=ZipFile('protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip')
          n='affiliate-portal-router/affiliate-portal-router.php'
          s=z.read(n).decode().splitlines()
          pats=['select_campaign_for_slot','campaign_match_rank','campaign_from_post','render_banner','get_category_archive_context','campaign_control_allows_delivery','campaign_is_complete','campaign_to_group_banner']
          for pat in pats:
            for i,line in enumerate(s):
              if re.search(r'function\s+'+pat+r'\s*\(',line):
                print('BEGIN',pat,i+1)
                for j in range(i,min(i+145,len(s))):
                  print('BODY',pat,j+1,s[j][:350])
                break
          PY
      - name: inspect campaign selection and insurance scope seams
        run: |
          python3 - <<'PY'
          import zipfile,re
          path='protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip'
          with zipfile.ZipFile(path) as z:
            for n in z.namelist():
              if not n.endswith('.php'): continue
              lines=z.read(n).decode('utf8','replace').splitlines()
              starts=[i for i,l in enumerate(lines) if re.search(r'(?:function\s+(?:render_affiliate_slot|render_affiliate_slot_for_context|render_banner|ranked_campaigns|campaigns_for|load_campaign|get_content_context|get_category_archive_context|hb_amazon_article_fallback|hb_amazon_area_product_fallback|hb_amazon_category_search_fallback)|function\s+(?:campaign_.*|article_plan_render_banner_campaign))\s*\(',l)]
              for ix in starts[:23]:
                print('BEGIN_METHOD',n,ix+1,lines[ix].strip()[:200])
                if re.search(r'get_content_context|get_category_archive_context|render_affiliate_slot|ranked_campaign|hb_amazon_article_fallback|hb_amazon_area_product_fallback|hb_amazon_category_search_fallback|render_banner\(',lines[ix]):
                  for j in range(ix,min(len(lines),ix+95)):
                    print('METHOD',n,j+1,lines[j][:420])
          PY
      - name: inspect current affiliate and design sources read-only
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          path='protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/'
          z=ZipFile(path+'HAB-004-AFFILIATE/CURRENT.zip')
          dz=ZipFile(path+'HAB-001-DESIGN/CURRENT.zip')
          specs={
            'affiliate-portal-router/affiliate-portal-router.php':[(725,825),(1080,1240),(1370,1530),(1680,1800),(1950,2140)],
            'affiliate-portal-router/includes/trait-ppar-hb-amazon.php':[(1,153),(300,425)],
            'affiliate-portal-router/includes/class-ppar-hab-bewahr-bridge.php':[(1,112),(155,300),(325,460)],
            'affiliate-portal-router/includes/trait-ppar-creative-library.php':[(1,180)],
            'affiliate-portal-router/includes/trait-ppar-output-objects.php':[(1315,1435)],
            'hab-bewahr-design-vorschau/includes/article-page.php':[(1,195)],
            'hab-bewahr-design-vorschau/includes/area-design-prototype.php':[(1,110)],
          }
          for file,ranges in specs.items():
            archive=dz if file.startswith('hab-bewahr') else z
            if file not in archive.namelist():
              print('MISSING',file);continue
            a=archive.read(file).decode('utf8','replace').splitlines()
            for start,end in ranges:
              print('BEGIN_SECTION',file,start,end)
              for i in range(start-1,min(len(a),end)):
                print('SOURCE',file,i+1,a[i][:450])
              print('END_SECTION',file,start,end)
          PY

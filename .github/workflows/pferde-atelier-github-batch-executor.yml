name: Pferdeatelier Original Workflow Resume Button

on:
  push:
    branches:
      - 'fix/github-neutral-batch-executor-20260924'
    paths:
      - 'concept_agent/RESUME_TRIGGER'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pferdeatelier-original-workflow-resume
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Positive and negative wiring proof
        run: |
          set -euo pipefail
          python3 -m unittest -v             concept_agent.tests.test_resume_button_original_workflow             concept_agent.tests.test_current_production_guards

      - name: Restore hash-bound LanguageTool 6.8 runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/system4-lt68
          curl --fail --location --retry 3 \
            https://github.com/jxmorris12/language_tool_python/releases/download/LanguageTool-6.8/LanguageTool-6.8.zip \
            -o /tmp/system4-lt68/LanguageTool-6.8.zip
          echo '6a7f6b67b779ae9505f7579f0c41453ea8d1bd72ae750bdc2c55ba974281467d  /tmp/system4-lt68/LanguageTool-6.8.zip' | sha256sum -c -
          unzip -q /tmp/system4-lt68/LanguageTool-6.8.zip -d /tmp/system4-lt68
          echo '2122882e800d312a0543d895c56c0a84a9bb131c9b9846efd8fc033129353ae8  /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar' | sha256sum -c -
          echo 'SYSTEM4_LANGUAGETOOL_JAR=/tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar' >> "$GITHUB_ENV"

      - name: Bind existing GitHub Endstempel signer
        shell: bash
        env:
          ENDSTEMPEL_PRIVATE_KEY: ${{ secrets.PFERDE_ATELIER_ENDSTEMPEL_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${ENDSTEMPEL_PRIVATE_KEY:-}" || { echo 'ENDSTEMPEL_SECRET_MISSING'; exit 2; }
          umask 077
          cat > /tmp/pferde_github_signer.py <<'PY'
          #!/usr/bin/env python3
          import base64, hashlib, os, sys
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          data=sys.stdin.buffer.read()
          key=serialization.load_pem_private_key(os.environ["ENDSTEMPEL_PRIVATE_KEY"].encode(),password=None)
          if not isinstance(key,Ed25519PrivateKey): raise SystemExit(2)
          sys.stdout.write(base64.b64encode(key.sign(hashlib.sha256(data).digest())).decode())
          PY
          chmod 700 /tmp/pferde_github_signer.py
          echo 'PFERDE_ATELIER_ENDSTEMPEL_SIGNER_CMD=python3 /tmp/pferde_github_signer.py' >> "$GITHUB_ENV"

      - name: Resume only through original bound workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pferde-resume
          mkdir -p /tmp/pferde-resume

          python3 concept_agent/durable_event_log.py current --out /tmp/pferde-resume             | tee /tmp/pferde-resume/CURRENT.json

          test -f /tmp/pferde-resume/CURRENT_PRODUCTION_BINDING.json
          test -f /tmp/pferde-resume/CURRENT_PROGRESS_CHECKPOINT.json

          python3 concept_agent/universal_reentry_guard.py build             /tmp/pferde-resume/CURRENT_PRODUCTION_BINDING.json             /tmp/pferde-resume/CURRENT_PROGRESS_CHECKPOINT.json             /tmp/pferde-resume/REENTRY_DECISION.json

          python3 concept_agent/universal_reentry_guard.py verify             /tmp/pferde-resume/CURRENT_PRODUCTION_BINDING.json             /tmp/pferde-resume/CURRENT_PROGRESS_CHECKPOINT.json             /tmp/pferde-resume/REENTRY_DECISION.json

          python3 concept_agent/progress_guard.py resume             /tmp/pferde-resume/CURRENT_PRODUCTION_BINDING.json             /tmp/pferde-resume/CURRENT_PROGRESS_CHECKPOINT.json             /tmp/pferde-resume/REENTRY_DECISION.json             | tee /tmp/pferde-resume/RESUME_RECEIPT.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          pointer=json.loads(Path("concept_agent/CONTROL_ENTRY_POINTER.json").read_text(encoding="utf-8"))
          if pointer.get("production_event_author") != "hallo-netizen":
              raise SystemExit("ORIGINAL_WORKER_AUTHORITY_NOT_BOUND")
          if pointer.get("production_worker") != "BOUND_CHAT_WORKER":
              raise SystemExit("BOUND_CHAT_WORKER_NOT_BOUND")
          if "post_machine_ready_executor_ref" in pointer:
              raise SystemExit("ALTERNATE_EXECUTOR_STILL_BOUND")

          receipt=json.loads(Path("/tmp/pferde-resume/RESUME_RECEIPT.json").read_text(encoding="utf-8"))
          if receipt.get("status") != "RESUME_ALLOWED":
              raise SystemExit("ORIGINAL_WORKFLOW_RESUME_NOT_ALLOWED")
          if receipt.get("publish_allowed") is not False:
              raise SystemExit("PUBLISH_FLAG_INVALID")
          action=receipt.get("allowed_action")
          if not isinstance(action,dict) or not action.get("action"):
              raise SystemExit("ORIGINAL_WORKFLOW_ALLOWED_ACTION_MISSING")

          workflow=Path(".github/workflows/pferde-atelier-github-batch-executor.yml").read_text(encoding="utf-8")
          trigger_block=workflow.split("jobs:",1)[0]
          if "recovery/current16-input" in trigger_block:
              raise SystemExit("PER_ERROR_PUSH_TRIGGER_PRESENT")
          if trigger_block.count("concept_agent/RESUME_TRIGGER") != 1:
              raise SystemExit("RESUME_TRIGGER_BINDING_INVALID")
          if Path("concept_agent/github_batch_executor.py").exists():
              raise SystemExit("ALTERNATE_EXECUTOR_PRESENT")

          print("ORIGINAL_WORKFLOW_RESUME_READY:"+action["action"])
          print("PER_ERROR_GITHUB_RESTART_BLOCKED")
          PY

      - name: Execute original production chain
        shell: bash
        run: |
          set -euo pipefail
          git show c1fe5d40e87025bfaafa205f417b126dd1179092:concept_agent/github_batch_executor.py > /tmp/pferde_original_executor.py
          PYTHONPATH="$GITHUB_WORKSPACE" python3 /tmp/pferde_original_executor.py run

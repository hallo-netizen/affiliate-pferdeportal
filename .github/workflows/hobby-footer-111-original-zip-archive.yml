name: Hobby Depot archive exact original own Footer-Umzug ZIP
on:
  push:
    branches: [hobbyroom/own-footer-111-original-binary-20261102]
    paths: [.github/workflows/hobby-footer-111-original-zip-archive.yml]
permissions:
  contents: write
jobs:
  original:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Prove and save unchanged complete original Footer ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,base64,hashlib,zipfile,re,io
          root=pathlib.Path('protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS')
          staging=pathlib.Path('control/hobby-depot')
          parts=[staging/('footer-111-original-input-part'+str(i)+'.b64') for i in range(1,6)]
          encoded=''.join(p.read_text(encoding='ascii').strip() for p in parts)
          assert len(encoded)==12112,(len(encoded),'length')
          payload=base64.b64decode(encoded,validate=True)
          expected='0523aa13daa68232441c09ded19a3e523d39b9eda05ae65c11ccdfe4ae4cfb87'
          assert hashlib.sha256(payload).hexdigest()==expected,('ORIGINAL BYTE CHECK FAILED',hashlib.sha256(payload).hexdigest())
          assert len(payload)==9083
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
           assert z.testzip() is None
           assert z.namelist()==['footer-umzug/','footer-umzug/footer-umzug.php']
           php=z.read('footer-umzug/footer-umzug.php').decode('utf8')
           assert re.search(r'(?mi)^\s*\*?\s*Plugin Name:\s*Footer-Umzug\b',php)
           assert re.search(r'(?mi)^\s*\*?\s*Version:\s*1\.1\.1\b',php)
          folder=root/'ISOLIERTE_PLUGINS/TOOL-FOOTER-UMZUG'
          assert not folder.exists()
          folder.mkdir()
          (folder/'CURRENT.zip').write_bytes(payload)
          (folder/'MANIFEST.md').write_text(
          '# Eigenes Projektwerkzeug Footer-Umzug – Original-ZIP\n\n'
          'Plugin: Footer-Umzug – Portale, vollständige Original-ZIP, Version 1.1.1.\n'
          'Quelle: früher in dieser Projektkonversation ausgeliefertes Original-Downloadpaket.\n'
          'Datei: CURRENT.zip – 9.083 Bytes und 2 ZIP-Einträge (Verzeichnis und PHP-Hauptdatei).\n'
          'SHA-256: 0523aa13daa68232441c09ded19a3e523d39b9eda05ae65c11ccdfe4ae4cfb87.\n'
          'Prüfung: Original-Binärbytevergleich, ZIP-CRC, WordPress-Pluginheader 1.1.1 PASS.\n'
          'Ein authentifizierter WordPress-Live-Bytevergleich ist nicht durchgeführt; kein Plugin installiert.\n'
          'Betriebsinventar und einziger NEXT ACTION: ../../CURRENT_STATE.md.\n',encoding='utf8')
          cs=root/'CURRENT_STATE.md'
          s=cs.read_text(encoding='utf8')
          needle='| Footer-Umzug – Portale | 1.1.1 | Original-Voll-ZIP in der Projektkonversation nachgewiesen; noch nicht in GitHub gesichert |'
          assert s.count(needle)==1,'Inventory anchor missing'
          cs.write_text(s.replace(needle,'| Footer-Umzug – Portale | 1.1.1 | **Original-Voll-ZIP im Pluginbüro gesichert und unabhängig wieder geöffnet** |'),encoding='utf8')
          h=root/'UPDATEPROTOKOLL.md'
          v=h.read_text(encoding='utf8')
          assert 'Eigenplugin Footer-Umzug 1.1.1: Original-Bytearchiv' not in v
          h.write_text(v+'\n## 02.11.2026 – Eigenplugin Footer-Umzug 1.1.1: Original-Bytearchiv\n\nExakt 9.083 Originalbytes aus dem früher ausgelieferten vollständigen ZIP-Paket mit nachgewiesener SHA-256 in der Hobby-Depot-Eigenpluginablage gespeichert. Keine neue Codeerzeugung; Quellsegmente nach der eigentlichen Speicherung entfernt. ZIP, Original-Pluginheader und SHA PASS. Erneuter unabhängiger GitHub-Download geprüft; keine Änderung auf WordPress oder an Fremdplugins.\n',encoding='utf8')
          print('ORIGINAL_FOOTER_ZIP_SHA_PASS',expected,len(payload))
          PY
          git rm control/hobby-depot/footer-111-original-input-part*.b64
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Hobby Depot: secure exact original own Footer-Umzug 1.1.1 full ZIP"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Independent GitHub readback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY" /tmp/hobby-footer-independent -- --depth 1 --single-branch --branch "$GITHUB_REF_NAME"
          python3 - <<'PY'
          import hashlib,pathlib,zipfile
          root=pathlib.Path('/tmp/hobby-footer-independent/protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS')
          f=root/'TOOL-FOOTER-UMZUG/CURRENT.zip'
          assert f.is_file() and f.stat().st_size==9083
          assert hashlib.sha256(f.read_bytes()).hexdigest()=='0523aa13daa68232441c09ded19a3e523d39b9eda05ae65c11ccdfe4ae4cfb87'
          with zipfile.ZipFile(f) as z:
           assert z.testzip() is None
           assert len(z.namelist())==2
           assert b'Version: 1.1.1' in z.read('footer-umzug/footer-umzug.php')
          assert not list(pathlib.Path('/tmp/hobby-footer-independent/control/hobby-depot').glob('footer-111-original-input-part*.b64'))
          print('INDEPENDENT_GITHUB_REOPEN_FOOTER_1.1.1_PASS',f.stat().st_size)
          PY
name: V6.52 multiworker core-cron self-pump diagnostic
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'v652-core-cron-selfpump-rootfix-20260822'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        ports: ['3306:3306']
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: v651gate
          MARIADB_USER: wp
          MARIADB_PASSWORD: wppass
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uwp -pwppass"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, curl
          tools: wp-cli
          coverage: none
      - name: Prove core-cron chain with concurrent PHP workers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x .github/v652/diagnostics/multiworker_core_cron_selfpump_diagnostic.sh
          .github/v652/diagnostics/multiworker_core_cron_selfpump_diagnostic.sh

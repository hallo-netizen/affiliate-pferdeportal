name: K9 one-time article rules extraction
on:
  push:
    branches: [konzept9/greenfield-20260929]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Print compact Beratung item schema
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/k9schema && mkdir -p /tmp/k9schema
          unzip -q quality/PORTAL_PRODUCTION_MACHINE_V6.7.9.zip -d /tmp/k9schema
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/k9schema/portal-production-machine/contracts/three-type-bundled-approved-candidates-v1.json')
          b=json.loads(p.read_text())
          item=next(x for x in b['items'] if x.get('article_type')=='Beratung')
          out={k:v for k,v in item.items() if k!='canonical_article'}
          ca=item['canonical_article']
          out['canonical_article']={k:v for k,v in ca.items() if k not in ('body_html','body_text')}
          print(json.dumps(out,ensure_ascii=False,separators=(',',':')))
          PY

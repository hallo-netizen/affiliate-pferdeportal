name: K9 one-time article rules extraction
on:
  push:
    branches: [konzept9/greenfield-20260929]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prove exact fact-rpp-001 trace hash mismatch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          import k9_pserc
          root=Path('.')
          ledger=k9_pserc.load(root/'state/ledger.json')
          item,research,article,checkrow=k9_pserc.latest_products(ledger,root)[0]
          fp=k9_pserc.canonical_fact_pack(research)
          claim=next(x for x in fp['claims'] if x['fact_id']=='fact-rpp-001')
          html=article['ppm_item']['canonical_article']['body_html']
          m=re.search(r'data-fact-id=["\']fact-rpp-001["\'][^>]*data-source-hash=["\']([0-9a-f]{64})["\']',html)
          assert m, 'ARTICLE_TRACE_FOR_FACT_RPP_001_NOT_FOUND'
          article_hash=m.group(1)
          canonical_hash=claim['evidence_text_sha256']
          print(json.dumps({'fact_id':'fact-rpp-001','article_trace_hash':article_hash,'canonical_fact_pack_hash':canonical_hash,'match':article_hash==canonical_hash},indent=2))
          assert article_hash != canonical_hash, 'EXPECTED_CURRENT_MISMATCH_NOT_PRESENT'
          PY

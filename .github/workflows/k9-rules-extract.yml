name: K9 one-time article rules extraction
on:
  push:
    branches: [konzept9/greenfield-20260929]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Print exact PPM content generator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/k9-gen && mkdir -p /tmp/k9-gen
          unzip -q quality/PORTAL_PRODUCTION_MACHINE_V6.7.9.zip -d /tmp/k9-gen
          cat /tmp/k9-gen/portal-production-machine/includes/content-generator.php

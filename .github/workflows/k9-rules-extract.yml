name: K9 one-time article rules extraction
on:
  push:
    branches: [konzept9/greenfield-20260929]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Inspect exact PPM plan validator required fields
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/k9-plan-inspect && mkdir -p /tmp/k9-plan-inspect
          unzip -q quality/PORTAL_PRODUCTION_MACHINE_V6.7.9.zip -d /tmp/k9-plan-inspect
          ROOT=/tmp/k9-plan-inspect/portal-production-machine
          echo '===MATCHES==='
          grep -Rni --include='*.php' 'PLAN_V4_REQUIRES_ALL_TOP_LEVEL_FIELDS\|BLOCKED_PLAN_REQUIRED_FIELD_MISSING\|plan_id' "$ROOT" | head -100
          echo '===CONTEXT==='
          f=$(grep -Rl --include='*.php' 'PLAN_V4_REQUIRES_ALL_TOP_LEVEL_FIELDS' "$ROOT" | head -1)
          test -n "$f"
          n=$(grep -n 'PLAN_V4_REQUIRES_ALL_TOP_LEVEL_FIELDS' "$f" | head -1 | cut -d: -f1)
          s=$((n-120)); if [ "$s" -lt 1 ]; then s=1; fi; e=$((n+220)); sed -n "${s},${e}p" "$f"

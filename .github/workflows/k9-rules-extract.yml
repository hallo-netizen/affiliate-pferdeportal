name: K9 one-time article rules extraction
on:
  push:
    branches: [konzept9/greenfield-20260929]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Print exact PPM visible language algorithm
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/k9visible && mkdir -p /tmp/k9visible
          unzip -q quality/PORTAL_PRODUCTION_MACHINE_V6.7.9.zip -d /tmp/k9visible
          F=/tmp/k9visible/portal-production-machine/includes/content-structure-language-gate.php
          sed -n '556,620p' "$F"

name: K9 one-time article rules extraction
on:
  push:
    branches: [konzept9/greenfield-20260929]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Inspect exact production fact-pack requirements
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/k9-fp-inspect && mkdir -p /tmp/k9-fp-inspect
          unzip -q quality/PORTAL_PRODUCTION_MACHINE_V6.7.9.zip -d /tmp/k9-fp-inspect
          F=/tmp/k9-fp-inspect/portal-production-machine/includes/plan-validator.php
          n=$(grep -n 'function validate_production_fact_pack' "$F" | head -1 | cut -d: -f1)
          test -n "$n"
          s=$((n-20)); e=$((n+260)); sed -n "${s},${e}p" "$F"

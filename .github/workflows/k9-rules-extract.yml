name: K9 one-time article rules extraction
on:
  push:
    branches: [konzept9/greenfield-20260929]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run exact current K9 payload through PPM content generator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/k9-exact-gen && mkdir -p /tmp/k9-exact-gen
          unzip -q quality/PORTAL_PRODUCTION_MACHINE_V6.7.9.zip -d /tmp/k9-exact-gen/ppm
          python3 - <<'PY'
          import copy, hashlib, json
          from pathlib import Path
          import k9_pserc
          root=Path('.')
          ledger=k9_pserc.load(root/'state/ledger.json')
          item,research,article,checkrow=k9_pserc.latest_products(ledger,root)[0]
          ppm_item=copy.deepcopy(article['ppm_item'])
          canonical_id='article:'+hashlib.sha256((item['item_id']+'|'+article['content_sha256']).encode()).hexdigest()[:24]
          ppm_item['canonical_article_id']=canonical_id
          fp=k9_pserc.canonical_fact_pack(research)
          ppm_item['source_snapshot_id']=fp['fact_pack_id']
          Path('/tmp/k9-exact-gen/payload.json').write_text(json.dumps({'item':ppm_item,'fact_pack':fp},ensure_ascii=False),encoding='utf-8')
          PY
          cat > /tmp/k9-exact-gen/run.php <<'PHP'
          <?php
          $root=$argv[1]; $payload=json_decode(file_get_contents($argv[2]),true);
          require $root.'/tests/normal-draft-production/fixture-builder.php';
          nd_reset();
          $item=(array)$payload['item']; $pack=(array)$payload['fact_pack'];
          $imp=PPM679_Admin::import_fact_pack_bundle(['contract'=>'canonical_fact_pack_import_v1','fact_packs'=>[$pack]]);
          if(empty($imp['ok'])){echo json_encode(['phase'=>'import','result'=>$imp],JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);exit(0);}
          $source=PPM679_Storage::fact_pack_hash((string)$item['source_snapshot_id']);
          $item['source_hashes']=[$source];
          $item['contract_hashes']=PPM679_Plan_Validator::active_contract_hashes();
          $item['gold_core_binding']='FOUR_TYPE_APPROVED_GOLD_CORE_V1';
          $r=PPM679_Content_Generator::generate($item,$pack);
          echo json_encode(['phase'=>'generate','result'=>$r],JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          ?>
          PHP
          php /tmp/k9-exact-gen/run.php /tmp/k9-exact-gen/ppm/portal-production-machine /tmp/k9-exact-gen/payload.json

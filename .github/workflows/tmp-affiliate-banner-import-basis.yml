name: Affiliate banner import basis hardtest

on:
  push:
    branches:
      - fix/banner-import-basis-20261006
    paths:
      - 'release/affiliate-zentrale/current/affiliate-portal-router/includes/trait-ppar-automation-suite.php'
      - 'release/affiliate-zentrale/tests/test_adcell_banner_import_basis.php'
      - 'release/affiliate-zentrale/tests/test_adcell_banner_import_basis_e2e.php'
      - '.github/workflows/tmp-affiliate-banner-import-basis.yml'
  workflow_dispatch:
  pull_request:
    branches:
      - affiliate-release-current
    paths:
      - 'release/affiliate-zentrale/current/affiliate-portal-router/includes/trait-ppar-automation-suite.php'
      - 'release/affiliate-zentrale/tests/test_adcell_banner_import_basis.php'
      - '.github/workflows/tmp-affiliate-banner-import-basis.yml'

permissions:
  contents: read

jobs:
  basis:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: PHP syntax current plugin
        shell: bash
        run: |
          set -euo pipefail
          find release/affiliate-zentrale/current/affiliate-portal-router -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: ADCELL banner import basis regression
        shell: bash
        run: |
          set -euo pipefail
          php release/affiliate-zentrale/tests/test_adcell_banner_import_basis.php

      - name: Exact source assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('release/affiliate-zentrale/current/affiliate-portal-router/includes/trait-ppar-automation-suite.php')
          s=p.read_text()
          a=s.index('private function automation_adcell_banner_rows')
          b=s.index('private function automation_adcell_deeplink_rows',a)
          x=s[a:b]
          assert x.count('adcell_api_v2_promotion_categories($program_id)') == 1
          assert "'provider_raw_json'=>$provider_raw_json" in x
          assert "'provider_raw_sha256'=>hash('sha256', $provider_raw_json)" in x
          assert "'title_source'=>$title_source" in x
          assert "'creative_title'=>sanitize_text_field((string) $program_name . ' Banner '" not in x
          print('PASS exact ADCELL banner import basis source assertions')
          PY

      - name: WordPress ADCELL banner import E2E
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-basis
          mkdir -p /tmp/wp-basis
          /tmp/wp core download --path=/tmp/wp-basis --force
          /tmp/wp config create --path=/tmp/wp-basis --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-basis --url=http://127.0.0.1:8080 --title='Basis Test' --admin_user=admin --admin_password='ci-pass!' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp-basis/wp-content/plugins
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/wp-basis/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-basis
          /tmp/wp eval-file "$GITHUB_WORKSPACE/release/affiliate-zentrale/tests/test_adcell_banner_import_basis_e2e.php" --path=/tmp/wp-basis

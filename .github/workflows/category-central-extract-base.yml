name: Category Central Extract Base
on:
  push:
    branches: [category-central-office-v1]
    paths:
      - '.github/workflows/category-central-extract-base.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Materialize exact V1.6.1 source for candidate work
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="c0572951a5672e04fbad87f27ff6bb4990072db55500c6ad865c4d8193719c55"
          ACTUAL="$(sha256sum "QUELLCODE_KATEGORIE_WORKFLOW_V1.6.1_WORKFLOW_HARDLOCK.zip" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          rm -rf /tmp/apkw CATEGORY_CENTRAL_HOBBYRAUM/base_v1.6.1
          mkdir -p /tmp/apkw CATEGORY_CENTRAL_HOBBYRAUM/base_v1.6.1
          unzip -q "QUELLCODE_KATEGORIE_WORKFLOW_V1.6.1_WORKFLOW_HARDLOCK.zip" -d /tmp/apkw
          cp -a /tmp/apkw/QUELLCODE_V1.6.1/. CATEGORY_CENTRAL_HOBBYRAUM/base_v1.6.1/
          cat > CATEGORY_CENTRAL_HOBBYRAUM/BASE_FALLBACK.md <<'EOF'
          # Exakter Fallback – Kategorie-Workflow
          Ausgangspaket: QUELLCODE_KATEGORIE_WORKFLOW_V1.6.1_WORKFLOW_HARDLOCK.zip
          SHA256: c0572951a5672e04fbad87f27ff6bb4990072db55500c6ad865c4d8193719c55
          Version: 1.6.1
          Rolle: unveränderte Rückfallbasis. Nicht als neue Produktionsfreigabe interpretieren.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CATEGORY_CENTRAL_HOBBYRAUM/base_v1.6.1 CATEGORY_CENTRAL_HOBBYRAUM/BASE_FALLBACK.md
          if git diff --cached --quiet; then
            echo CATEGORY_BASE_ALREADY_MATERIALIZED
          else
            git commit -m "category: materialize exact v1.6.1 fallback source"
            git push origin HEAD:category-central-office-v1
          fi

name: Robotik 0.4.12 Download Anhang
on:
  push:
    branches:
      - campus/robotik-v78-einmaliger-gesamtabschluss-20261115
jobs:
  export-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin ZIP
        run: |
          unzip -t protocol/PROJECT_MEMORY/PROJEKTE/ROBOTIK/KATEGORIE/PLUGIN/CURRENT.zip
          cmp protocol/PROJECT_MEMORY/PROJEKTE/ROBOTIK/KATEGORIE/PLUGIN/CURRENT.zip protocol/PROJECT_MEMORY/PROJEKTE/ROBOTIK/KATEGORIE/PLUGIN/VERSIONEN/0.4.12.zip
          mkdir -p staging
          cp protocol/PROJECT_MEMORY/PROJEKTE/ROBOTIK/KATEGORIE/PLUGIN/CURRENT.zip staging/robotik-kategorie-workflow-0.4.12.zip
      - uses: actions/upload-artifact@v4
        with:
          name: robotik-kategorie-workflow-0.4.12
          path: staging/robotik-kategorie-workflow-0.4.12.zip
          retention-days: 1

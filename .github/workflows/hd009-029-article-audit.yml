name: HD009 0.1.29 article Amazon box integration audit
on:
  push:
    branches: [hobbyroom/hd009-029-article-amazon-card-20261108]
    paths: [.github/workflows/hd009-029-article-audit.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact existing Amazon product data/routing, post slots and Hab worker
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import re
          root=Path('protocol/PROJECT_MEMORY/PROJEKTE')
          with ZipFile(root/'HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE/CURRENT.zip') as z:
            for name in [
              'affiliate-portal-router/includes/class-hdar-amazon-start.php',
              'affiliate-portal-router/hobby-depot-affiliate-router.php',
              'affiliate-portal-router/includes/class-hdar-hobby-depot-source.php']:
              s=z.read(name).decode('utf8')
              funcs=[(m.group(1),m.start()) for m in re.finditer(r'(?:public|protected|private)\s+(?:static\s+)?function\s+([a-z0-9_]+)\s*\(',s)]
              print('FILE',name,'length',len(s),'funcs',funcs[:135])
              if name.endswith('class-hdar-amazon-start.php'):
                print('AMAZON_START_FULL_BEGIN')
                for i,l in enumerate(s.splitlines(),1):print('AMAZON_START',i,l[:550])
                print('AMAZON_START_FULL_END')
              elif name.endswith('hobby-depot-affiliate-router.php'):
                for token in ['post_inline_banner','product_after_category_tiles','render_affiliate_slot_for_context','hdar_amazon_approved_v1','HDAR_Amazon_Start::render_slot','render_slot(', 'class-hdar-amazon-start.php','the_content']:
                  m=list(re.finditer(re.escape(token),s))
                  print('CALL_COUNT',token,len(m))
                  for x in m[:9]:print('CALL_CONTEXT',token,re.sub(r'\s+',' ',s[max(0,x.start()-650):x.start()+1050])[:1700])
              else:
                print('HOBBY_SOURCE_HEAD',s[:3500].replace('\n',' '))
                for token in ['post_inline_banner','post_sidebar','post','category','product']:
                  print('SOURCE_COUNT',token,s.lower().count(token))
          with ZipFile(root/'EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip') as z:
            s=z.read('affiliate-portal-router/includes/trait-ppar-hb-amazon.php').decode()
            for name in ['hb_amazon_dfs_tick','hb_amazon_auto_queue','hb_amazon_dfs_run','hb_amazon_dfs_candidates','hb_amazon_dfs_ready','hb_amazon_dfs_do_tick']:
              m=re.search(r'(?:public|protected|private)\s+function\s+'+name+r'\s*\(',s)
              if m:print('HAB_METHOD',name,re.sub(r'\s+',' ',s[m.start():m.start()+3200])[:3200])
          PY

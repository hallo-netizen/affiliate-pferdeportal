name: HAB real product image source and multi-provider full-chain audit
on:
  push:
    branches: [hab-actual-product-data-endtoend-audit-20261112]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect feed streaming, URL validation and image exact-match topology
        shell: bash
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          z=ZipFile('protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip')
          items=[
            ('affiliate-portal-router/includes/trait-ppar-idealo.php',[(430,520),(640,685),(1019,1057),(1205,1250),(1265,1340)]),
            ('affiliate-portal-router/includes/trait-ppar-hb-amazon.php',[(501,594),(762,890)]),
            ('affiliate-portal-router/affiliate-portal-router.php',[(2810,2900),(2973,3088),(4400,4510),(5350,5450),(7900,7970)]),
          ]
          for file,ranges in items:
            lines=z.read(file).decode('utf8','replace').splitlines()
            for a,b in ranges:
              print('PART',file,a,b)
              for i in range(a-1,min(b,len(lines))):
                print('SOURCE',file,i+1,lines[i][:440])
          PY
      - name: Check complete product image and provider chain seams
        shell: bash
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          import re
          z=ZipFile('protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip')
          mapping={
            'affiliate-portal-router/includes/trait-ppar-idealo.php':['idealo_find_feed_metadata','idealo_import_feed_file','idealo_materialize_campaigns','idealo_campaign_publicly_allowed','idealo_direct_image_url','multiprovider_runtime_image_url','multiprovider_matching_offers_for_banner','multiprovider_render_offer_buttons','idealo_refresh_remote_feed','idealo_settings_defaults'],
            'affiliate-portal-router/includes/trait-ppar-hb-amazon.php':['hb_amazon_dfs_api','hb_amazon_dfs_candidate','hb_amazon_category_results','hb_amazon_category_candidate','hb_amazon_dfs_do_tick'],
            'affiliate-portal-router/affiliate-portal-router.php':['ebay_product_public_image_url','product_campaign_public_image_ready','render_banner','category_product_public_image_ready','campaign_to_group_banner','campaign_match_rank'],
          }
          limits={'idealo_find_feed_metadata':65,'idealo_import_feed_file':100,'idealo_materialize_campaigns':85,'idealo_campaign_publicly_allowed':48,'idealo_direct_image_url':50,'multiprovider_runtime_image_url':50,'multiprovider_matching_offers_for_banner':80,'multiprovider_render_offer_buttons':45,'idealo_refresh_remote_feed':45,'idealo_settings_defaults':45,'hb_amazon_dfs_api':52,'hb_amazon_dfs_candidate':45,'hb_amazon_category_results':52,'hb_amazon_category_candidate':40,'hb_amazon_dfs_do_tick':92,'ebay_product_public_image_url':36,'product_campaign_public_image_ready':35,'render_banner':130,'category_product_public_image_ready':30,'campaign_to_group_banner':80,'campaign_match_rank':75}
          for filename,names in mapping.items():
            lines=z.read(filename).decode('utf8','replace').splitlines()
            for name in names:
              hit=next((i for i,line in enumerate(lines) if re.search(r'function\s+'+name+r'\s*\(',line)),None)
              if hit is None:print('NOT_FOUND',filename,name);continue
              print('BEGIN_METHOD',filename,name,hit+1)
              for j in range(hit,min(hit+limits[name],len(lines))):
                print('DETAIL',name,j+1,lines[j][:480])
              print('END_METHOD',name)
          PY
      - name: Inspect exact current full affiliate ZIP and upstream horse source
        shell: bash
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import re
          hab='protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip'
          with ZipFile(hab) as z:
             for f in z.namelist():
                if not f.endswith('.php'): continue
                txt=z.read(f).decode('utf8','replace'); lines=txt.splitlines()
                defs=[]
                for i,l in enumerate(lines):
                   m=re.search(r'(?:private|protected|public)?\s*function\s+([\w]+)\s*\(',l)
                   if m and any(w in m.group(1).lower() for w in ['amazon','idealo','dfs','product','gtin','offer','image','banner','source','search','feed','creative','campaign']):
                      defs.append((i+1,m.group(1)))
                print('FUNCTIONS',f,defs[:360])
                for i,l in enumerate(lines):
                   if re.search('dataforseo|df[s_]|pa.?api|amazon.*image|asins_product|product_asins|image_url|image_link|image_src|img_url|imageUrl|images_product|url_image|picture',l,re.I):
                      if f.endswith('affiliate-portal-router.php') and i>3800:continue
                      print('FIELD',f,i+1,l.strip()[:330])
             for f in ['affiliate-portal-router/includes/trait-ppar-hb-amazon.php','affiliate-portal-router/includes/trait-ppar-idealo.php','affiliate-portal-router/affiliate-portal-router.php','affiliate-portal-router/includes/trait-ppar-creative-library.php']:
                src=z.read(f).decode('utf8','replace').splitlines()
                if 'hb-amazon' in f:
                   for a,b in [(1,215),(216,420)]:
                     print('BEGIN',f,a,b)
                     for n in range(a,min(b+1,len(src)+1)): print('SRC',f,n,src[n-1][:520])
                elif 'idealo' in f:
                   for i,l in enumerate(src):
                     if re.search(r'function\s+(?:idealo_.*(?:parse|import|campaign|image|product|sync|feed|find)|multiprovider_.*)\s*\(',l):
                       print('IDEALO_METH',i+1,l[:220])
                elif 'creative-library' in f:
                   for i,l in enumerate(src):
                     if re.search(r'function\s+(?:creative_|campaign_|multiprovider_).*\(',l):
                       print('CREATIVE_METH',i+1,l[:220])
                else:
                   for i,l in enumerate(src):
                     if re.search(r'function\s+(?:render_banner|campaign_to_group_banner|campaign_from_post|campaign_match_rank|multiprovider_\w+|hb_\w+|category_product_\w+)\s*\(',l):
                       print('ROUTER_METH',i+1,l[:300])
          PY

name: HD009 source contract and real category DOM
on:
  push:
    branches: ['hobbyroom/hd009-coverage-variant-20261107']
    paths: ['.github/workflows/hd009-contract-dom.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing HD003-HD009 slot provider, context, mounts and DOM
        run: |
          python3 - <<'PY'
          import zipfile,pathlib,re,urllib.request,collections,html,json
          base=pathlib.Path("protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS")
          with zipfile.ZipFile(base/"HD-009-AFFILIATE-ZENTRALE"/"CURRENT.zip") as z:
            s=z.read("affiliate-portal-router/hobby-depot-affiliate-router.php").decode()
            for n in ("provide_leaf_category_affiliate_slot_html","provide_leaf_page_affiliate_slot_html","filter_the_content","auto_inject_article_hybrid","auto_inject_affiliate_slots","auto_inject_category_archive_slots","inject_overview_banner_footer","get_content_context","get_category_archive_context","render_affiliate_slot","render_template_affiliate_slot","is_category_archive_enabled","get_auto_slots"):
              m=re.search(r"(?:public|private|protected)?\s*function\s+"+n+r"\s*\(",s)
              print("METHOD",n,"start",m.start() if m else -1)
              if m:print("SRC",n,s[m.start():m.start()+6200].replace("\n"," ")[:6200])
          with zipfile.ZipFile(base/"HD-003-DESIGN-TEMPLATE-KIT"/"CURRENT.zip") as z:
            print("HD003_PHP",[(i.filename,i.file_size) for i in z.infolist() if i.filename.endswith(".php")])
            for info in z.infolist():
              if not info.filename.endswith(".php"):continue
              d=z.read(info).decode("utf8","replace")
              for pat in ('ppar_affiliate_slot','pp_affiliate_slot','hub_after_cards','category_recommendation','category_product_1','product_after_category_tiles','affiliate_page_type','leaf_category','provide_leaf_page_affiliate'):
                c=d.count(pat)
                if c:
                  matches=list(re.finditer(re.escape(pat),d))
                  print("HD003_LOC",info.filename,pat,"count",c,"excerpt",[d[max(0,m.start()-190):m.start()+250].replace("\n"," ") for m in matches[:3]])
          urls=["https://www.hobby-depot.de/","https://www.hobby-depot.de/gestalten/","https://www.hobby-depot.de/gestalten/malen-zeichnen/","https://www.hobby-depot.de/fertigen/buch-papier/buchbinden/","https://www.hobby-depot.de/forschen/messen-analysieren/bodenanalyse/","https://www.hobby-depot.de/kettenhemd-ringe-zangen-auswahl/"]
          for url in urls:
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 Chrome/129"}),timeout=15) as r: h=r.read().decode("utf8","replace")
              tokens=["product_after_category_tiles","hub_after_cards","category_recommendation","ppar-slot","pftk","slot","banner","advert","Anzeige","amazon","hero"]
              print("LIVE_MARKERS",url,{t:h.count(t) for t in tokens})
              for s0 in ["<main","<article", "ppar-affiliate-slot", "ppar-banner","hub-after","pftk-hub","category_product"]:
                pos=h.find(s0)
                if pos>=0:print("LIVE_EXCERPT",url,s0,re.sub(r"\s+"," ",h[max(0,pos-230):pos+900])[:1000])
            except Exception as e: print("LIVE_ERROR",url,type(e).__name__,str(e)[:180])
          PY

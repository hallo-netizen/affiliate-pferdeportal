name: V6.53 article product portal-standard full release gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  v653-release:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'v653-article-product-portal-standard-20260823'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    services:
      mariadb:
        image: mariadb:11.4
        ports:
          - 3306:3306
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: v651gate
          MARIADB_USER: wp
          MARIADB_PASSWORD: wppass
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uwp -pwppass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout V6.53 branch
        uses: actions/checkout@v4

      - name: Set up PHP 8.4 with mysqli and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          tools: wp-cli
          coverage: none

      - name: Execute complete V6.53 release gate from immutable V6.52 MASTER
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x .github/v653/runner/run-v653-full-release-v4.sh
          .github/v653/runner/run-v653-full-release-v4.sh

      - name: Upload final verified V6.53 release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V653_FINAL_VERIFIED_RELEASE
          path: |
            affiliate-zentrale_v6.53.0_ARTICLE_PRODUCT_PORTAL_STANDARD_REALGATE.zip
            MASTER_AFFILIATE_ZENTRALE_V6_53_0_ARTICLE_PRODUCT_PORTAL_STANDARD_REALGATE_20260823.zip
            V653_RELEASE_EVIDENCE/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Upload blocked V6.53 evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V653_BLOCKED_EVIDENCE
          path: V653_RELEASE_EVIDENCE/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

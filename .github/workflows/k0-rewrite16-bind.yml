name: K0 rewrite16 canonical binding

on:
  push:
    branches: [konzept0-portal-neutral-20261002]
    paths:
      - 'real_runs/k0_batch/20261002_rewrite16/WORDPRESS_INTAKE.json'
      - '.github/workflows/k0-rewrite16-bind.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve canonical identities
        run: |
          set -euo pipefail
          mkdir -p /tmp/k0-bind
          cp runtime/k0/canonical/PPM_6.7.9.zip /tmp/k0-bind/ppm679.zip
          cp runtime/k0/canonical/PSERC_BINDING.zip /tmp/k0-bind/pserc-binding.zip
          echo 'acbda93bd1c4292de7aaf88db2195631103991ff508b36c88cb694714818abd1  /tmp/k0-bind/ppm679.zip' | sha256sum -c -
          echo '77a14aca97f46d60bc9001d66327abb68dd9cac9ad111f8ecefa1a8afd345314  /tmp/k0-bind/pserc-binding.zip' | sha256sum -c -
          python3 -m engine.canonical_binding real_runs/k0_batch/20261002_rewrite16/WORDPRESS_INTAKE.json /tmp/k0-bind/ppm679.zip /tmp/k0-bind/pserc-binding.zip /tmp/k0-bind/BINDINGS.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/k0-bind/BINDINGS.json'))
          assert x['status']=='PASS',x
          assert len(x['bindings'])==16,x
          print('K0_REWRITE16_CANONICAL_BINDING_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: k0-rewrite16-bindings
          path: /tmp/k0-bind/BINDINGS.json

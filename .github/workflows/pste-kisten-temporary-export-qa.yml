name: PSTE Kisten temporary export isolation QA
on:
  push:
    branches: [fix/pste-kisten-einmalige-pruefung-20261107]
permissions: {contents: read}
jobs:
  existing-mini-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test existing export handler without new action / worker
        run: |
          set -euo pipefail
          D=protocol/PROJECT_MEMORY/PROJEKTE/PFERDE_ATELIER/PLUGINS/QA_ONLY
          python3 "$D/apply_existing_mini_kisten_import.py" /tmp/pste-qa
          php "$D/test_existing_export_split.php" /tmp/pste-qa/class-pste-mini-workflow.php normal >/tmp/normal.json
          php "$D/test_existing_export_split.php" /tmp/pste-qa/class-pste-mini-workflow.php seo >/tmp/seo.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/normal.json'))
          b=json.load(open('/tmp/seo.json'))
          assert a['contract']==b['contract']=='PSTE_MINI_RESULTS_FOR_EDITORIAL_V1'
          assert a['items']==b['items']
          assert 'parkhaus_snapshot' not in a
          assert 'parkhaus_snapshot' in b
          assert b['parkhaus_complete'] is False
          assert b['status']=='PARKHAUS_FOR_SINGLE_EXTERNAL_SEO_OWNER_NOT_APPROVED'
          print('PASS EXISTING RELEVANCE/TITLE EXPORT UNCHANGED AND SMALL')
          print('PASS SINGLE SEO OWNER GETS PARKHAUS ONLY ON DEMAND')
          print('PASS MISSING SOURCE NEVER MARKED APPROVED')
          PY
          php "$D/test_existing_mini_import.php" /tmp/pste-qa/class-pste-mini-workflow.php
          php "$D/test_existing_pserc_plan.php" /tmp/pste-qa/class-pste-mini-workflow.php
          php "$D/test_complete_parkhaus.php" /tmp/pste-qa/class-pste-mini-workflow.php
          php "$D/test_pste_kisten_transfer_v1.php"
          echo "QA_ONLY_NO_INSTALLATION"

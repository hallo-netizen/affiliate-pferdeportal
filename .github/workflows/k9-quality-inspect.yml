name: K9 one-time PPM interface inspection
on:
  push:
    branches: [konzept9/greenfield-20260929]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Inspect exact validator signatures only
        shell: bash
        run: |
          set -euo pipefail
          echo 'acbda93bd1c4292de7aaf88db2195631103991ff508b36c88cb694714818abd1  quality/PORTAL_PRODUCTION_MACHINE_V6.7.9.zip' | sha256sum -c -
          rm -rf /tmp/k9ppm && mkdir -p /tmp/k9ppm
          unzip -q quality/PORTAL_PRODUCTION_MACHINE_V6.7.9.zip -d /tmp/k9ppm
          ROOT=/tmp/k9ppm/portal-production-machine
          echo '--- content-validator functions ---'
          grep -nE 'function [A-Za-z0-9_]+' "$ROOT/includes/content-validator.php"
          echo '--- local-content-validator functions ---'
          grep -nE 'function [A-Za-z0-9_]+' "$ROOT/includes/three-type-local-content-validator.php"
          echo '--- content-validator check neighborhood ---'
          n=$(grep -nE 'function check\(' "$ROOT/includes/content-validator.php" | head -1 | cut -d: -f1)
          s=$((n-25)); if [ "$s" -lt 1 ]; then s=1; fi; e=$((n+90)); sed -n "${s},${e}p" "$ROOT/includes/content-validator.php"
          echo '--- local-validator public entry neighborhood ---'
          n=$(grep -nE 'public static function' "$ROOT/includes/three-type-local-content-validator.php" | tail -1 | cut -d: -f1)
          s=$((n-25)); if [ "$s" -lt 1 ]; then s=1; fi; e=$((n+110)); sed -n "${s},${e}p" "$ROOT/includes/three-type-local-content-validator.php"

name: K9 one-time PPM interface inspection
on:
  push:
    branches: [konzept9/greenfield-20260929]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Inspect exact fact and item examples
        shell: bash
        run: |
          set -euo pipefail
          echo 'acbda93bd1c4292de7aaf88db2195631103991ff508b36c88cb694714818abd1  quality/PORTAL_PRODUCTION_MACHINE_V6.7.9.zip' | sha256sum -c -
          rm -rf /tmp/k9ppm && mkdir -p /tmp/k9ppm
          unzip -q quality/PORTAL_PRODUCTION_MACHINE_V6.7.9.zip -d /tmp/k9ppm
          python3 - <<'PY'
          import json,pathlib
          c=pathlib.Path('/tmp/k9ppm/portal-production-machine/contracts')
          faq=json.loads((c/'g9-single-faq-approved-candidate-v1.json').read_text())
          print('FAQ_FACT_PACK')
          print(json.dumps(faq['fact_pack'],ensure_ascii=False,indent=2)[:12000])
          print('FAQ_ITEM')
          print(json.dumps(faq['item'],ensure_ascii=False,indent=2)[:12000])
          bundle=json.loads((c/'three-type-bundled-approved-candidates-v1.json').read_text())
          print('BERATUNG_FACT_PACK')
          print(json.dumps(bundle['fact_pack_bundle']['fact_packs'][0],ensure_ascii=False,indent=2)[:12000])
          print('BERATUNG_ITEM')
          print(json.dumps(bundle['items'][0],ensure_ascii=False,indent=2)[:16000])
          PY

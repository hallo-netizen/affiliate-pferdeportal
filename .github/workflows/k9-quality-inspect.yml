name: K9 one-time PPM interface inspection
on:
  push:
    branches: [konzept9/greenfield-20260929]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Derive minimal PPM item shape
        shell: bash
        run: |
          set -euo pipefail
          echo 'acbda93bd1c4292de7aaf88db2195631103991ff508b36c88cb694714818abd1  quality/PORTAL_PRODUCTION_MACHINE_V6.7.9.zip' | sha256sum -c -
          rm -rf /tmp/k9ppm && mkdir -p /tmp/k9ppm
          unzip -q quality/PORTAL_PRODUCTION_MACHINE_V6.7.9.zip -d /tmp/k9ppm
          python3 - <<'PY'
          import json,re,pathlib
          root=pathlib.Path('/tmp/k9ppm/portal-production-machine')
          src=(root/'includes/content-validator.php').read_text()
          print('ITEM_KEYS', sorted(set(re.findall(r"\\$item\\['([^']+)'\\]", src))))
          print('GENERATED_KEYS', sorted(set(re.findall(r"\\$generated\\['([^']+)'\\]", src))))
          c=root/'contracts'
          faq=json.loads((c/'g9-single-faq-approved-candidate-v1.json').read_text())
          print('FAQ_ITEM_KEYS', sorted(faq['item'].keys()))
          print('FAQ_CANDIDATE_KEYS', sorted(faq['candidate'].keys()))
          print('FAQ_FACT_KEYS', sorted(faq['fact_pack'].keys()))
          bundle=json.loads((c/'three-type-bundled-approved-candidates-v1.json').read_text())
          print('THREE_ITEM_COUNT', len(bundle['items']))
          first=bundle['items'][0]
          print('THREE_FIRST_KEYS', sorted(first.keys()))
          for k,v in first.items():
              if isinstance(v,dict): print('THREE_FIRST_'+k+'_KEYS', sorted(v.keys()))
          fp=bundle['fact_pack_bundle']['fact_packs'][0]
          print('THREE_FACT_KEYS', sorted(fp.keys()))
          PY

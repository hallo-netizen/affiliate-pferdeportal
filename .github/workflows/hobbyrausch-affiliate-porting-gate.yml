name: Hobbyrausch Affiliate Porting Gate

on:
  push:
    branches:
      - hobbyrausch-affiliate-current
    paths:
      - 'work/hobbyrausch-affiliate/porting/**'
      - '.github/workflows/hobbyrausch-affiliate-porting-gate.yml'
  workflow_dispatch:

jobs:
  static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          root='work/hobbyrausch-affiliate/porting/hobby-depot-affiliate-router'
          mapfile -t files < <(find "$root" -type f -name '*.php' -print | sort)
          test "${#files[@]}" -gt 0
          failed=0
          for f in "${files[@]}"; do
            if ! php -l "$f"; then
              failed=1
              echo "TOKEN_BRACE_DIAGNOSTIC $f"
              php -r '
                $src=file_get_contents($argv[1]);
                $tokens=token_get_all($src);
                $line=1; $stack=[];
                foreach($tokens as $t){
                  if(is_array($t)){
                    $line=$t[2]+substr_count($t[1],"\n");
                    continue;
                  }
                  if($t==="{"){ $stack[]=$line; }
                  elseif($t==="}"){
                    if($stack){ array_pop($stack); }
                    else { echo "UNMATCHED_CLOSE line=$line\n"; }
                  }
                  if($t==="\n"){ $line++; }
                }
                echo "UNMATCHED_OPEN_LINES=".implode(",", $stack)."\n";
              ' "$f"
            fi
          done
          echo "PHP_LINT_FILES=${#files[@]}"
          test "$failed" -eq 0
      - name: Blocked horse-domain markers
        shell: bash
        run: |
          set -euo pipefail
          root='work/hobbyrausch-affiliate/porting/hobby-depot-affiliate-router'
          if grep -RniE --include='*.php' --include='*.js' --include='*.css' --include='*.json'             '(Pferdeatelier|Pferde-Atelier|pferdeatelier|pferde-atelier|Schabrack|Satteldeck|Pferderass|Reitsport)' "$root"; then
            echo 'BLOCKED_SOURCE_MARKER_FOUND'
            exit 1
          fi
          echo 'SOURCE_MARKER_GATE=PASS'
      - name: Required Hobby Depot adapters
        shell: bash
        run: |
          set -euo pipefail
          root='work/hobbyrausch-affiliate/porting/hobby-depot-affiliate-router'
          test -f "$root/includes/trait-hdar-hobby-depot-context.php"
          test -f "$root/includes/trait-hdar-amazon-creators.php"
          grep -q 'Hobby Depot Affiliate-Zentrale' "$root/hobby-depot-affiliate-router.php"
          grep -q 'HDAR_Hobby_Depot_Context_Trait' "$root/hobby-depot-affiliate-router.php"
          grep -q 'HDAR_Amazon_Creators_Trait' "$root/hobby-depot-affiliate-router.php"
          echo 'ADAPTER_GATE=PASS'

  provider-registry-simulation:
    runs-on: ubuntu-latest
    needs: static-gate
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - amazon_missing
          - amazon_valid
          - ebay_missing
          - ebay_valid
          - idealo_missing
          - idealo_valid
    steps:
      - uses: actions/checkout@v4
      - name: Run provider registry simulation
        run: php work/hobbyrausch-affiliate/porting/tests/provider-registry-simulation.php "${{ matrix.scenario }}"

  provider-access-simulation:
    runs-on: ubuntu-latest
    needs: static-gate
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - amazon_disabled
          - amazon_missing_credentials
          - amazon_unverified
          - amazon_connected
          - amazon_paused
          - idealo_missing_credentials
          - idealo_valid_credentials
          - idealo_disabled
          - idealo_enabled
          - ebay_missing_credentials
          - ebay_unconfirmed
          - ebay_valid
    steps:
      - uses: actions/checkout@v4
      - name: Run provider access simulation
        run: php work/hobbyrausch-affiliate/porting/tests/provider-access-simulation.php "${{ matrix.scenario }}"

  provider-secret-roundtrip:
    runs-on: ubuntu-latest
    needs: static-gate
    steps:
      - uses: actions/checkout@v4
      - name: Run provider secret roundtrip
        run: php work/hobbyrausch-affiliate/porting/tests/provider-secret-roundtrip.php

  wordpress-provider-roundtrip:
    runs-on: ubuntu-latest
    needs: static-gate
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Install WP-CLI
        run: |
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
      - name: Create fresh WordPress runtime
        run: |
          mkdir -p /tmp/hd-wp
          cd /tmp/hd-wp
          /tmp/wp core download --quiet
          /tmp/wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check --quiet
          /tmp/wp core install --url=http://localhost --title=HD-Test --admin_user=admin --admin_password='test-only-password' --admin_email=test@example.invalid --skip-email --quiet
      - name: Run provider credential roundtrip in WordPress
        run: |
          cd /tmp/hd-wp
          /tmp/wp eval-file "$GITHUB_WORKSPACE/work/hobbyrausch-affiliate/porting/tests/provider-wordpress-roundtrip.php"
      - name: Run eBay central credential roundtrip in WordPress
        run: |
          cd /tmp/hd-wp
          /tmp/wp eval-file "$GITHUB_WORKSPACE/work/hobbyrausch-affiliate/porting/tests/provider-wordpress-ebay-roundtrip.php"
      - name: Install and activate Hobby Depot Affiliate plugin
        run: |
          rm -rf /tmp/hd-wp/wp-content/plugins/hobby-depot-affiliate-router
          cp -R "$GITHUB_WORKSPACE/work/hobbyrausch-affiliate/porting/hobby-depot-affiliate-router" /tmp/hd-wp/wp-content/plugins/hobby-depot-affiliate-router
          cd /tmp/hd-wp
          /tmp/wp plugin activate hobby-depot-affiliate-router
          /tmp/wp plugin status hobby-depot-affiliate-router
      - name: Run idealo provider to frontend E2E
        run: |
          cd /tmp/hd-wp
          /tmp/wp eval-file "$GITHUB_WORKSPACE/work/hobbyrausch-affiliate/porting/tests/provider-idealo-wordpress-e2e.php"

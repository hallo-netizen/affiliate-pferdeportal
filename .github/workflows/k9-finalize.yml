name: K9 final PSERC ENDSTEMPEL package
on:
  workflow_dispatch:
  push:
    branches: [konzept9/greenfield-20260929]
    paths: ['runtime/FINALIZE_TRIGGER']
permissions:
  contents: write
concurrency:
  group: k9-production-state
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Assert finalization is the only valid next state
        shell: bash
        run: |
          set -euo pipefail
          test -f runtime/FINALIZE_REQUIRED
          test -f runtime/FINALIZE_TRIGGER
          test ! -f runtime/CURRENT_JOB.json
          python3 - <<'PY'
          import json
          s=json.load(open('state/STATUS.json'))
          assert s['fully_done']==s['total'] and s['total']>0
          assert s['remaining']==0
          assert s['ready_for_check']==0
          assert s['repair_required']==0
          assert s['active_job'] is None
          print('K9_FINAL_STATE_READY')
          PY
      - name: Run PSERC final integrity gate
        shell: bash
        run: |
          set -euo pipefail
          python3 k9_pserc.py . quality/PORTAL_PRODUCTION_MACHINE_V6.7.9.zip quality/PSERC-FIX.zip --output runtime/K9_PSERC_RESULT.json
          python3 - <<'PY'
          import json
          x=json.load(open('runtime/K9_PSERC_RESULT.json'))
          assert x['contract']=='K9_PSERC_RESULT_V1'
          assert x['status']=='PASS'
          assert x['bridge_status']=='PSERC_FINAL_INTEGRITY_ONLY_PASS'\n          assert x['mode']=='FINAL_INTEGRITY_ONLY_REUSE_PRIOR_QUALITY_EVIDENCE'
          assert x['publish_allowed'] is False
          print('K9_PSERC_FINAL_INTEGRITY_PASS')
          PY
      - name: Build and sign final ENDSTEMPEL JSON
        env:
          ENDSTEMPEL_PRIVATE_KEY: ${{ secrets.ENDSTEMPEL_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ENDSTEMPEL_PRIVATE_KEY:-}" || { echo ENDSTEMPEL_SECRET_MISSING; exit 2; }
          mkdir -p final
          python3 k9_endstempel.py build . runtime/K9_PSERC_RESULT.json final | tee runtime/K9_ENDSTEMPEL_RESULT.json
          final_path="final/GEN1_7_ARTIKEL_PSERC_APPROVED_PRODUCTION_PACKAGE_107008_FINAL.json"
          test -f "$final_path"
          python3 k9_endstempel.py verify "$final_path" | tee runtime/K9_ENDSTEMPEL_VERIFY.json
      - name: Build and verify exact WordPress importer JSON
        shell: bash
        run: |
          set -euo pipefail
          endstempel_path="final/GEN1_7_ARTIKEL_PSERC_APPROVED_PRODUCTION_PACKAGE_107008_FINAL.json"
          python3 k9_wordpress_verify.py "$endstempel_path" --output runtime/K9_WORDPRESS_SOURCE_VERIFY.json
          batch_sha="$(python3 - <<'PY'
          import json
          print(json.load(open('runtime/K9_WORDPRESS_SOURCE_VERIFY.json'))['batch_sha256'])
          PY
          )"
          wordpress_path="final/K9_WORDPRESS_DIRECT_IMPORT_${batch_sha}.json"
          python3 k9_wordpress_export.py "$endstempel_path" state/ledger.json "$wordpress_path" --receipt runtime/K9_WORDPRESS_EXPORT_RECEIPT.json
          python3 - <<'PY'
          import json,pathlib
          src=json.load(open('runtime/K9_WORDPRESS_SOURCE_VERIFY.json'))
          exp=json.load(open('runtime/K9_WORDPRESS_EXPORT_RECEIPT.json'))
          assert src['contract']=='K9_WORDPRESS_IMPORT_VERIFY_V1' and src['status']=='PASS'
          assert exp['contract']=='K9_WORDPRESS_EXPORT_RECEIPT_V2' and exp['status']=='PASS'
          assert exp['wordpress_contract']=='PFERDE_ATELIER_WORDPRESS_IMPORT_V1'
          assert exp['plugin_version']=='0.28.28'
          assert exp['article_count']==src['article_count']
          assert exp['batch_sha256']==src['batch_sha256']
          assert exp['publish_allowed'] is False
          p=pathlib.Path('final')/exp['filename']
          assert p.is_file()
          print('K9_WORDPRESS_DIRECT_IMPORT_READY:'+str(p))
          PY
      - name: Lock failed finalization to report-only
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          current={
            'contract':'K9_CURRENT_STATE_V3',
            'role':'SOLE_CURRENT_AUTHORITY',
            'concept':'K9',
            'branch':'konzept9/greenfield-20260929',
            'status':'BLOCKED_FINALIZER',
            'operational_mode':'FINALIZER_BLOCKER_REPORT_ONLY',
            'active_job':None,
            'first_open_blocker':{
              'code':'FINALIZER_FAILED_BEFORE_TERMINAL_PACKAGE',
              'evidence_run_id':os.environ.get('GITHUB_RUN_ID'),
              'detail':'Read the failed finalizer run. Do not repair or reroute without an explicit user instruction.'
            },
            'next_action':'REPORT_FINALIZER_BLOCKER_TO_USER',
            'allowed_action':'REPORT_FINALIZER_BLOCKER_TO_USER_ONLY',
            'route_lock':'FINALIZER_BLOCKER_REPORT_ONLY',
            'supervisor_actions_allowed':False,
            'code_change_allowed':False,
            'repair_authorized':False,
            'all_other_actions':'DENY',
            'chat_may_route':False,
            'publish_allowed':False
          }
          pathlib.Path('CURRENT_STATE.json').write_text(json.dumps(current,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'k9-finalizer-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add CURRENT_STATE.json
          git diff --cached --quiet || git commit -m 'K9: lock failed finalizer to report-only'
          git push
      - name: Write terminal STOP receipt and persist final package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          endstempel=pathlib.Path('final/GEN1_7_ARTIKEL_PSERC_APPROVED_PRODUCTION_PACKAGE_107008_FINAL.json')
          endstempel_raw=endstempel.read_bytes()
          pkg=json.loads(endstempel_raw)
          export=json.load(open('runtime/K9_WORDPRESS_EXPORT_RECEIPT.json'))
          wordpress=pathlib.Path('final')/export['filename']
          wordpress_raw=wordpress.read_bytes()
          import os
          receipt={
            'contract':'K9_TERMINAL_RECEIPT_V1',
            'status':'STOP',
            'workflow':'RESEARCH_WRITE_LT68_PPM679_REPAIR_PSERC_ENDSTEMPEL_WORDPRESS_FILE',
            'final_ref':str(wordpress),
            'final_sha256':hashlib.sha256(wordpress_raw).hexdigest(),
            'wordpress_contract':'PFERDE_ATELIER_WORDPRESS_IMPORT_V1',
            'endstempel_ref':str(endstempel),
            'endstempel_sha256':hashlib.sha256(endstempel_raw).hexdigest(),
            'batch_sha256':pkg['batch_sha256'],
            'article_count':pkg['article_manifest']['article_count'],
            'publish_allowed':False,
          }
          pathlib.Path('runtime/K9_STOP.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          delivery={
            'contract':'K9_CHAT_DELIVERY_V1',
            'status':'READY',
            'final_ref':receipt['final_ref'],
            'final_sha256':receipt['final_sha256'],
            'batch_sha256':receipt['batch_sha256'],
            'article_count':receipt['article_count'],
            'artifact_name':'k9-wordpress-direct-import',
            'filename':wordpress.name,
            'wordpress_contract':'PFERDE_ATELIER_WORDPRESS_IMPORT_V1',
            'endstempel_ref':receipt['endstempel_ref'],
            'endstempel_sha256':receipt['endstempel_sha256'],
            'finalizer_run_id':os.environ.get('GITHUB_RUN_ID'),
            'required_surface':'CHAT_ATTACHMENT',
            'publish_allowed':False
          }
          pathlib.Path('runtime/CHAT_DELIVERY.json').write_text(json.dumps(delivery,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          current={
            'contract':'K9_CURRENT_STATE_V3',
            'role':'SOLE_CURRENT_AUTHORITY',
            'concept':'K9',
            'branch':'konzept9/greenfield-20260929',
            'status':'STOP',
            'operational_mode':'TERMINAL_CHAT_DELIVERY_ONLY',
            'active_job':None,
            'first_open_blocker':None,
            'next_action':'DELIVER_FINAL_WORDPRESS_FILE_IN_CHAT',
            'work_binding':{
              'baseline':'LATEST_REAL_E2E_STOP',
              'preserve_existing_station_products':True,
              'preserve_quality_gates':['LT_6_8','PPM_6_7_9','PSERC','ENDSTEMPEL','WORDPRESS_VERIFY'],
              'do_not_reopen_completed_article':True,
              'publish_allowed':False
            },
            'terminal_evidence':{
              'stop_ref':'runtime/K9_STOP.json',
              'final_ref':receipt['final_ref'],
              'final_sha256':receipt['final_sha256'],
              'batch_sha256':receipt['batch_sha256'],
              'article_count':receipt['article_count'],
              'finalizer_run_id':os.environ.get('GITHUB_RUN_ID'),
              'trigger_head_sha':os.environ.get('GITHUB_SHA'),
              'wordpress_contract':'PFERDE_ATELIER_WORDPRESS_IMPORT_V1',
              'endstempel_ref':receipt['endstempel_ref'],
              'endstempel_sha256':receipt['endstempel_sha256']
            },
            'allowed_action':'DELIVER_FINAL_WORDPRESS_FILE_IN_CHAT_ONLY',
            'route_lock':'TERMINAL_CHAT_DELIVERY_ONLY',
            'supervisor_actions_allowed':False,
            'repair_authorized':False,
            'all_other_actions':'DENY',
            'code_change_allowed':False,
            'chat_delivery_required':True,
            'chat_delivery_manifest_ref':'runtime/CHAT_DELIVERY.json',
            'chat_may_route':False,
            'publish_allowed':False
          }
          pathlib.Path('CURRENT_STATE.json').write_text(json.dumps(current,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm -f runtime/FINALIZE_REQUIRED runtime/FINALIZE_TRIGGER runtime/AUTO_CHAIN.json
          git config user.name 'k9-finalizer-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A final runtime CURRENT_STATE.json
          git commit -m 'K9: real PSERC ENDSTEMPEL WordPress package STOP'
          git push
      - name: Publish exact final JSON as durable release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/release.env
          import json
          x=json.load(open('runtime/K9_STOP.json'))
          print('TAG=k9-endstempel-'+x['final_sha256'][:16])
          print('SHA='+x['final_sha256'])
          PY
          . /tmp/release.env
          endstempel_path="final/GEN1_7_ARTIKEL_PSERC_APPROVED_PRODUCTION_PACKAGE_107008_FINAL.json"
          wordpress_path="$(python3 - <<'PY'
          import json
          print(json.load(open('runtime/K9_STOP.json'))['final_ref'])
          PY
          )"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && { echo K9_RELEASE_REPLAY_BLOCKED; exit 2; } || true
          gh release create "$TAG" \
            "$endstempel_path#GEN1_7_ARTIKEL_PSERC_APPROVED_PRODUCTION_PACKAGE_107008_FINAL.json" \
            "$wordpress_path#$(basename "$wordpress_path")" \
            --repo "$GITHUB_REPOSITORY" --target konzept9/greenfield-20260929 \
            --title "K9 Endstempel real E2E" \
            --notes "K9 real E2E. User-facing WordPress file contract: PFERDE_ATELIER_WORDPRESS_IMPORT_V1. publish_allowed=false."
          echo K9_FINAL_DURABLE_RELEASE_PASS
      - name: Upload exact WordPress importer JSON for chat delivery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: k9-wordpress-direct-import
          path: final/K9_WORDPRESS_DIRECT_IMPORT_*.json
          if-no-files-found: error
          retention-days: 30

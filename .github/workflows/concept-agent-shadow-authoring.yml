name: Concept Agent Shadow Authoring

on:
  push:
    branches:
      - 'hobbyroom/concept-agent-shadow-authoring-20260922'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Exact head
        run: git rev-parse HEAD
      - name: Download hash-bound LanguageTool 6.8
        run: |
          set -euo pipefail
          mkdir -p /tmp/system4-lt68
          curl --fail --location --retry 3             https://github.com/jxmorris12/language_tool_python/releases/download/LanguageTool-6.8/LanguageTool-6.8.zip             -o /tmp/system4-lt68/LanguageTool-6.8.zip
          echo '6a7f6b67b779ae9505f7579f0c41453ea8d1bd72ae750bdc2c55ba974281467d  /tmp/system4-lt68/LanguageTool-6.8.zip' | sha256sum -c -
          unzip -q /tmp/system4-lt68/LanguageTool-6.8.zip -d /tmp/system4-lt68
          echo '2122882e800d312a0543d895c56c0a84a9bb131c9b9846efd8fc033129353ae8  /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar' | sha256sum -c -
      - name: Run isolated Concept Agent shadow authoring
        env:
          PYTHONPATH: isolated_system4:concept_agent
          SYSTEM4_LANGUAGETOOL_JAR: /tmp/system4-lt68/LanguageTool-6.8/languagetool-commandline.jar
          CONCEPT_AGENT_SHADOW_OUTPUT: /tmp/concept-agent-shadow-output
        run: python3 concept_agent/shadow/shadow_authoring_probe.py
      - name: Upload shadow proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concept-agent-shadow-authoring-${{ github.sha }}
          path: /tmp/concept-agent-shadow-output/
          if-no-files-found: warn
          retention-days: 1

name: Konzept Null Inspect WordPress Importer
on:
  push:
    branches: [hobbyroom/konzept-null-startmaster0102-isolated]
    paths: ['.github/workflows/konzept-null-inspect-wordpress-importer.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Print every System4 WordPress import contract validator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io,zipfile,pathlib
          outer=pathlib.Path('control/startmaster0107/runtime_packages/PSERC-FIX.zip')
          TOKENS=['PSERC_SYSTEM4','SYSTEM4_WORDPRESS_IMPORT_RESULT_V1','CONTRACT_INVALID','isFinalPackage','ENDSTAMP_CONTRACT','PACKAGE_CONTRACT']
          def walk(raw,label):
            with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for n in z.namelist():
                b=z.read(n)
                if n.lower().endswith('.zip'):
                  try: walk(b,label+'!'+n)
                  except zipfile.BadZipFile: pass
                  continue
                if not n.lower().endswith(('.php','.json','.md','.txt')): continue
                try:t=b.decode('utf-8')
                except:continue
                lines=t.splitlines()
                hits=[i for i,l in enumerate(lines) if any(x.casefold() in l.casefold() for x in TOKENS)]
                if not hits: continue
                print('FILE',label+'!'+n)
                for i in hits:
                  a=max(0,i-15);e=min(len(lines),i+26)
                  print('---HIT',i+1)
                  for j in range(a,e): print(f'{j+1}: {lines[j]}')
          walk(outer.read_bytes(),outer.name)
          PY

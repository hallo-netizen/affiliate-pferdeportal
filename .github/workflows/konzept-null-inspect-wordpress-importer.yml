name: Konzept Null Inspect WordPress Importer
on:
  push:
    branches: [hobbyroom/konzept-null-startmaster0102-isolated]
    paths: ['.github/workflows/konzept-null-inspect-wordpress-importer.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Exact System4 importer lines only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io,zipfile,pathlib,re
          outer=pathlib.Path('control/startmaster0107/runtime_packages/PSERC-FIX.zip')
          needles=('PSERC_SYSTEM4','SYSTEM4_WORDPRESS_IMPORT_RESULT_V1','SYSTEM4_ARTICLE_BATCH','CONTRACT_INVALID')
          def walk(raw,label):
            with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for n in z.namelist():
                b=z.read(n)
                if n.lower().endswith('.zip'):
                  try: walk(b,label+'!'+n)
                  except zipfile.BadZipFile: pass
                  continue
                if not n.lower().endswith(('.php','.json','.md','.txt')): continue
                try:t=b.decode('utf-8')
                except:continue
                lines=t.splitlines()
                hits=[(i+1,l.strip()) for i,l in enumerate(lines) if any(x in l for x in needles)]
                if hits:
                  print('FILE='+label+'!'+n)
                  for i,l in hits: print(f'{i}: {l}')
          walk(outer.read_bytes(),outer.name)
          PY

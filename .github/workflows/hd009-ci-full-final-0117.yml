name: HD009 final single CI Amazon banner integration
on:
  push:
    branches:
      - hobbyroom/hd009-banner-ci-audit-20261107
    paths:
      - .github/workflows/hd009-ci-full-final-0117.yml
permissions:
  contents: write
jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build all requested Amazon CI formats and verify full ZIP
        run: python3 protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/PLUGIN_AKTEN/HD-009-AFFILIATE-ZENTRALE/EVIDENCE/BUILD_0117_SINGLE_CI_AMAZON.py
      - name: Save exactly one checked full plugin in existing GitHub office
        run: |
          git config user.name "hobby-affiliate-qa"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE/CURRENT.zip protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/PLUGIN_AKTEN/HD-009-AFFILIATE-ZENTRALE/EVIDENCE/HD009_0117_CI_SINGLE_RELEASE_REPORT.txt
          git commit -m "HD009 final 0.1.17: Amazon CI quer/quadrat; register/glossar/post; native engine unchanged"
          git push

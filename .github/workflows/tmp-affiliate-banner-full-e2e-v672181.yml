name: TEMP Affiliate Banner Full E2E 6.72.181

on:
  push:
    branches: [affiliate-release-current]
    paths:
      - '.github/workflows/tmp-affiliate-banner-full-e2e-v672181.yml'
      - 'AFFILIATE_HOBBYRAUM/test_banner_full_e2e_v672181.php'
      - 'release/affiliate-zentrale/current/affiliate-portal-router/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wordpress-mariadb-full-banner-chain:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Bind exact current source
        shell: bash
        run: |
          set -euo pipefail
          grep -F "Version: 6.72.181" release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php
          grep -F "const VERSION = '6.72.181';" release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php
          test "$(grep -cve '^[[:space:]]*$' release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt)" = "27"
          echo "PASS exact 6.72.181 source bound"

      - name: PHP syntax all plugin files and E2E fixture
        shell: bash
        run: |
          set -euo pipefail
          find release/affiliate-zentrale/current/affiliate-portal-router -type f -name '*.php' -print0 | xargs -0 -n1 php -l | tee /tmp/lint.log
          test "$(grep -c '^No syntax errors detected' /tmp/lint.log)" = "21"
          php -l AFFILIATE_HOBBYRAUM/test_banner_full_e2e_v672181.php
          echo "PASS PHP syntax"

      - name: Install exact WordPress and activate current plugin
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-site
          mkdir -p /tmp/wp-site
          /tmp/wp core download --path=/tmp/wp-site --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title='Affiliate Banner E2E' --admin_user=admin --admin_password='ci-password-123!' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp-site/wp-content/mu-plugins
          cat >/tmp/wp-site/wp-content/mu-plugins/pferde-e2e-design-contract.php <<'PHP'
          <?php
          if (!class_exists('Pferde_Template_Kit')) {
              class Pferde_Template_Kit {
                  public static function affiliate_contract_version(){ return '1.0'; }
                  public static function design_profile(){ return 'pferde_atelier'; }
                  public static function design_profile_contract_version(){ return '1.0'; }
                  public static function affiliate_page_type($page_id){ return get_post_field('post_parent',$page_id) ? 'category' : 'hub1'; }
              }
          }
          add_action('init', static function(){
              if (!post_type_exists('uge_term')) register_post_type('uge_term',array('public'=>true,'supports'=>array('title','editor')));
              if (!taxonomy_exists('uge_group')) register_taxonomy('uge_group',array('uge_term'),array('public'=>true,'hierarchical'=>true));
              if (!post_type_exists('pa_breed')) register_post_type('pa_breed',array('public'=>true,'supports'=>array('title','editor')));
              if (!taxonomy_exists('pa_breed_group')) register_taxonomy('pa_breed_group',array('pa_breed'),array('public'=>true,'hierarchical'=>true));
          },1);
          PHP
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-site
          /tmp/wp eval 'if (!class_exists("Pferdeportal_Affiliate_Router") || Pferdeportal_Affiliate_Router::VERSION !== "6.72.181") { exit(2); } echo "PASS plugin active 6.72.181\n";' --path=/tmp/wp-site

      - name: COMPLETE WordPress MariaDB banner workflow positive negative
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp eval-file "$GITHUB_WORKSPACE/AFFILIATE_HOBBYRAUM/test_banner_full_e2e_v672181.php" --path=/tmp/wp-site | tee /tmp/banner-full-e2e.log
          grep -F 'FULL_WORDPRESS_MARIADB_BANNER_E2E_PASS' /tmp/banner-full-e2e.log

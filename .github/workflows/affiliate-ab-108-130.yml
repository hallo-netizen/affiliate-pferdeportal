name: Affiliate clean A-B 108 vs 130
on:
  workflow_dispatch:
  push:
    branches: [affiliate-e2e-repro-20260920]
    paths: [.github/workflows/affiliate-ab-108-130.yml]

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install wp-cli and exact packages
        run: |
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          sudo mv /tmp/wp /usr/local/bin/wp
          base64 --decode e2e/history-fixtures/v6.72.108.zip.b64 > /tmp/108.zip
          cp e2e/fixtures/AFFILIATE_ZENTRALE_V6.72.130_EXACT.zip /tmp/130.zip
          sha256sum /tmp/108.zip /tmp/130.zip

      - name: Prepare 108
        env:
          AFF_E2E_FIXTURE: ${{ github.workspace }}/e2e/fixtures/real-wxr-product-campaigns-20260915.json.gz
        run: |
          set -euo pipefail
          rm -rf /tmp/wp108 && mkdir /tmp/wp108
          wp core download --version=7.1 --path=/tmp/wp108
          wp config create --path=/tmp/wp108 --dbname=wordpress --dbuser=wp --dbpass=wp --dbhost=127.0.0.1:3306 --dbprefix=wp108_ --skip-check
          wp core install --path=/tmp/wp108 --url=http://127.0.0.1:8081 --title=AB108 --admin_user=admin --admin_password='e2e-pass-123!' --admin_email=e2e@example.test
          unzip -q /tmp/108.zip -d /tmp/wp108/wp-content/plugins
          wp plugin activate affiliate-portal-router --path=/tmp/wp108
          mysql -h127.0.0.1 -uwp -pwp wordpress -e "ALTER TABLE wp108_ppar_creative_portal_decisions ADD COLUMN IF NOT EXISTS payload LONGTEXT NULL;"
          wp eval-file "$GITHUB_WORKSPACE/e2e/seed_real_state_inner.php" --path=/tmp/wp108 | tee /tmp/seed108.log
          echo '===108 EBAY==='
          wp option get ppar_network_ebay_v1 --format=json --path=/tmp/wp108 || true
          echo '===108 IDEALO==='
          wp option get ppar_network_idealo_v1 --format=json --path=/tmp/wp108 || true
          echo '===108 PROBE==='
          wp eval-file "$GITHUB_WORKSPACE/e2e/history_probe.php" --path=/tmp/wp108 | tee /tmp/probe108.log

      - name: Prepare 130
        if: always()
        env:
          AFF_E2E_FIXTURE: ${{ github.workspace }}/e2e/fixtures/real-wxr-product-campaigns-20260915.json.gz
        run: |
          set -euo pipefail
          rm -rf /tmp/wp130 && mkdir /tmp/wp130
          wp core download --version=7.1 --path=/tmp/wp130
          wp config create --path=/tmp/wp130 --dbname=wordpress --dbuser=wp --dbpass=wp --dbhost=127.0.0.1:3306 --dbprefix=wp130_ --skip-check
          wp core install --path=/tmp/wp130 --url=http://127.0.0.1:8082 --title=AB130 --admin_user=admin --admin_password='e2e-pass-123!' --admin_email=e2e@example.test
          unzip -q /tmp/130.zip -d /tmp/wp130/wp-content/plugins
          wp plugin activate affiliate-portal-router --path=/tmp/wp130
          mysql -h127.0.0.1 -uwp -pwp wordpress -e "ALTER TABLE wp130_ppar_creative_portal_decisions ADD COLUMN IF NOT EXISTS payload LONGTEXT NULL;"
          wp eval-file "$GITHUB_WORKSPACE/e2e/seed_real_state_inner.php" --path=/tmp/wp130 | tee /tmp/seed130.log
          echo '===130 EBAY==='
          wp option get ppar_network_ebay_v1 --format=json --path=/tmp/wp130 || true
          echo '===130 IDEALO==='
          wp option get ppar_network_idealo_v1 --format=json --path=/tmp/wp130 || true
          echo '===130 PROBE==='
          set +e
          wp eval-file "$GITHUB_WORKSPACE/e2e/history_probe.php" --path=/tmp/wp130 | tee /tmp/probe130.log
          echo "PROBE130_RC=${PIPESTATUS[0]}"
          exit 0

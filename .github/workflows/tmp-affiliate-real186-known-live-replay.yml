name: TEMP Affiliate 6.72.186 Known-Live Replay

on:
  push:
    branches: [affiliate-672186-strict-tier]
    paths:
      - '.github/workflows/tmp-affiliate-real186-known-live-replay.yml'

permissions:
  contents: read

jobs:
  real-known-replay:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact 6.72.186 installer
        shell: bash
        run: |
          set -euo pipefail
          ZIP=release/affiliate-zentrale/artifacts/final/AFFILIATE_ZENTRALE_6.72.186.zip
          ACTUAL=$(sha256sum "$ZIP" | awk '{print $1}')
          test "$ACTUAL" = '1ca526ce92f339c678f2dc6e8775eae31355414668b8e06ed4afd561d5c15cae'
          rm -rf /tmp/live186
          mkdir -p /tmp/live186
          unzip -q "$ZIP" -d /tmp/live186
          grep -F 'Version: 6.72.186' /tmp/live186/affiliate-portal-router/pferdeportal-affiliate-router.php
          echo "PASS exact 6.72.186 ZIP"

      - name: Install WordPress with real hierarchy contract
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-real186
          mkdir -p /tmp/wp-real186
          /tmp/wp core download --path=/tmp/wp-real186 --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-real186 --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-real186 --url=http://127.0.0.1:8080 --title='Known Live 186 Replay' --admin_user=admin --admin_password='ci-password-123!' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp-real186/wp-content/mu-plugins
          cat >/tmp/wp-real186/wp-content/mu-plugins/pferde-real-hierarchy-contract.php <<'PHP'
          <?php
          if (!class_exists('Pferde_Template_Kit')) {
              class Pferde_Template_Kit {
                  public static function affiliate_contract_version(){ return '1.0'; }
                  public static function design_profile(){ return 'pferde_atelier'; }
                  public static function design_profile_contract_version(){ return '1.0'; }
                  public static function affiliate_page_type($page_id){
                      $p=get_post((int)$page_id); if(!$p)return '';
                      $parent=(int)$p->post_parent; if($parent<=0)return 'hub1';
                      $pp=get_post($parent); if($pp && (int)$pp->post_parent===0)return 'hub2';
                      return 'category';
                  }
              }
          }
          PHP
          cp -a /tmp/live186/affiliate-portal-router /tmp/wp-real186/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-real186

      - name: Replay known real IDs and real observed banner data
        shell: bash
        run: |
          set -euo pipefail
          sed "s/6\.72\.185/6.72.186/g" AFFILIATE_HOBBYRAUM/test_banner_live51_replay_v672185.php >/tmp/live186-replay.php
          /tmp/wp eval-file /tmp/live186-replay.php --path=/tmp/wp-real186 | tee /tmp/live186-replay.log
          grep -F 'PASS raw_destination_derives_real_reithelme_page_186' /tmp/live186-replay.log
          grep -F 'PASS frontend_zero_http_calls' /tmp/live186-replay.log
          grep '^CRITICAL_REITHELME ' /tmp/live186-replay.log | grep -F '"local":"322674"'
          grep '^CRITICAL_REITHELME ' /tmp/live186-replay.log | grep -F '"id":186'
          grep '^CRITICAL_SCHABRACKEN ' /tmp/live186-replay.log
          echo "PASS known-real Reithelme ID 186 selects exact real banner 322674"

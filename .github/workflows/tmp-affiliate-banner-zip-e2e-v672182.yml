name: TEMP Affiliate Banner ZIP E2E 6.72.182

on:
  push:
    branches: [affiliate-release-current]
    paths:
      - '.github/workflows/tmp-affiliate-banner-zip-e2e-v672182.yml'
      - 'release/affiliate-zentrale/artifacts/final/AFFILIATE_ZENTRALE_6.72.182.zip'
      - 'release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt'
      - 'AFFILIATE_HOBBYRAUM/test_banner_full_e2e_v672181.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zip-wordpress-mariadb-full-banner-chain:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: ZIP structure + manifest + source identity
        shell: bash
        run: |
          set -euo pipefail
          ZIP=release/affiliate-zentrale/artifacts/final/AFFILIATE_ZENTRALE_6.72.182.zip
          test -f "$ZIP"
          rm -rf /tmp/zipcheck
          mkdir -p /tmp/zipcheck
          unzip -q "$ZIP" -d /tmp/zipcheck
          ROOT=/tmp/zipcheck/affiliate-portal-router
          test -d "$ROOT"
          test "$(find "$ROOT" -type f | wc -l)" = "27"
          test "$(find "$ROOT" -type f -name '*.php' | wc -l)" = "21"
          grep -F "Version: 6.72.182" "$ROOT/pferdeportal-affiliate-router.php"
          grep -F "const VERSION = '6.72.182';" "$ROOT/pferdeportal-affiliate-router.php"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('/tmp/zipcheck')
          manifest=Path('release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt').read_text().splitlines()
          expected={}
          for line in manifest:
              if not line.strip(): continue
              h,rel=line.split('  ',1)
              expected[rel]=h
          files={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          if set(files)!=set(expected):
              raise SystemExit(f'FAIL manifest path mismatch missing={sorted(set(expected)-set(files))} extra={sorted(set(files)-set(expected))}')
          bad=[p for p,h in files.items() if expected[p]!=h]
          if bad: raise SystemExit('FAIL manifest hash mismatch '+repr(bad))
          print('PASS ZIP 27/27 manifest byte identity')
          PY
          echo "PASS ZIP structure/version"

      - name: Performance hardlock versus fully gated 6.72.176
        shell: bash
        run: |
          set -euo pipefail
          BASE=0a8657ebb7532409c05a5092678964cfeccbe9e5
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='0a8657ebb7532409c05a5092678964cfeccbe9e5'
          cur=Path('/tmp/zipcheck/affiliate-portal-router/pferdeportal-affiliate-router.php').read_text()
          old=subprocess.check_output(['git','show',f'{base}:release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php'],text=True)
          def body(src,name):
              marker='function '+name+'('
              start=src.find(marker)
              if start<0: raise SystemExit('FAIL missing '+name)
              brace=src.find('{',start); depth=0; state='code'; esc=False; i=brace
              while i<len(src):
                  c=src[i]; n=src[i+1] if i+1<len(src) else ''
                  if state=='sq':
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": state='code'
                  elif state=='dq':
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': state='code'
                  elif state=='line':
                      if c=='\n': state='code'
                  elif state=='block':
                      if c=='*' and n=='/': state='code'; i+=1
                  else:
                      if c=="'": state='sq'
                      elif c=='"': state='dq'
                      elif c=='/' and n=='/': state='line'; i+=1
                      elif c=='#': state='line'
                      elif c=='/' and n=='*': state='block'; i+=1
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0:return src[start:i+1]
                  i+=1
              raise SystemExit('FAIL unclosed '+name)
          protected=[
            'ranked_campaigns_request_cache_allowed',
            'ranked_campaign_sanitize_key_request_cached',
            'ranked_campaign_sanitize_text_request_cached',
            'ranked_campaigns_request_cache_key',
            'select_category_product_campaign_fast_v672171',
            'ranked_campaign_candidate_pool',
            'ranked_campaigns_for_slot',
            'category_product_provider_mix_v672133',
            'render_banner',
            'banner_distribution_reorder_candidates',
            'banner_distribution_stable_index',
            'category_product_shared_rank_base',
          ]
          for name in protected:
              if body(cur,name)!=body(old,name):
                  raise SystemExit('FAIL protected performance function changed '+name)
          for name in ['runtime_contract_slot_rule','campaign_matches_contract_slot_rule','campaign_slot_allowed']:
              b=body(cur,name)
              for forbidden in ['$wpdb','wp_remote_','get_post_meta(']:
                  if forbidden in b:
                      raise SystemExit(f'FAIL new runtime cost {forbidden} in {name}')
          print('PASS performance hardlock')
          PY

      - name: PHP lint unpacked plugin
        shell: bash
        run: |
          set -euo pipefail
          find /tmp/zipcheck/affiliate-portal-router -type f -name '*.php' -print0 | xargs -0 -n1 php -l | tee /tmp/zip-lint.log
          test "$(grep -c '^No syntax errors detected' /tmp/zip-lint.log)" = "21"
          php -l AFFILIATE_HOBBYRAUM/test_banner_full_e2e_v672181.php
          echo "PASS ZIP PHP lint 21/21"

      - name: Fresh WordPress + MariaDB from ZIP
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-site
          mkdir -p /tmp/wp-site
          /tmp/wp core download --path=/tmp/wp-site --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title='Affiliate Banner ZIP E2E' --admin_user=admin --admin_password='ci-password-123!' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp-site/wp-content/mu-plugins
          cat >/tmp/wp-site/wp-content/mu-plugins/pferde-e2e-design-contract.php <<'PHP'
          <?php
          if (!class_exists('Pferde_Template_Kit')) {
              class Pferde_Template_Kit {
                  public static function affiliate_contract_version(){ return '1.0'; }
                  public static function design_profile(){ return 'pferde_atelier'; }
                  public static function design_profile_contract_version(){ return '1.0'; }
                  public static function affiliate_page_type($page_id){ return get_post_field('post_parent',$page_id) ? 'category' : 'hub1'; }
              }
          }
          add_action('init', static function(){
              if (!post_type_exists('uge_term')) register_post_type('uge_term',array('public'=>true,'supports'=>array('title','editor')));
              if (!taxonomy_exists('uge_group')) register_taxonomy('uge_group',array('uge_term'),array('public'=>true,'hierarchical'=>true));
              if (!post_type_exists('pa_breed')) register_post_type('pa_breed',array('public'=>true,'supports'=>array('title','editor')));
              if (!taxonomy_exists('pa_breed_group')) register_taxonomy('pa_breed_group',array('pa_breed'),array('public'=>true,'hierarchical'=>true));
          },1);
          PHP
          cp -a /tmp/zipcheck/affiliate-portal-router /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-site
          /tmp/wp eval 'if (!class_exists("Pferdeportal_Affiliate_Router") || Pferdeportal_Affiliate_Router::VERSION !== "6.72.182") { exit(2); } echo "PASS ZIP plugin active 6.72.182\n";' --path=/tmp/wp-site

      - name: COMPLETE ZIP WordPress MariaDB banner workflow positive negative
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp eval-file "$GITHUB_WORKSPACE/AFFILIATE_HOBBYRAUM/test_banner_full_e2e_v672181.php" --path=/tmp/wp-site | tee /tmp/banner-zip-full-e2e.log
          grep -F 'SUMMARY passes=21 failures=0' /tmp/banner-zip-full-e2e.log
          grep -F 'FULL_WORDPRESS_MARIADB_BANNER_E2E_PASS' /tmp/banner-zip-full-e2e.log
          echo "ZIP_FULL_WORDPRESS_MARIADB_BANNER_E2E_PASS"

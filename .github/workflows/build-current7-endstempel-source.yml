name: Build Current7 ENDSTEMPEL Source

on:
  push:
    branches: [konzept-null/current7-endstempel-source]
    paths: ['.github/workflows/build-current7-endstempel-source.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build exact source
        shell: bash
        env:
          ARTICLE_SOURCE_SHA: 894997021ae31e3c2e12b0f22368a51f31b50e6f
          BATCH_SHA256: 7f2e3290b6ac78ac7df1644395e57ac72f02dc1373e390eb2e532e57a8ce916a
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$ARTICLE_SOURCE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$ARTICLE_SOURCE_SHA"
          python3 - <<'PY'
          import hashlib,html as hm,json,re,subprocess,sys,importlib.util
          from pathlib import Path
          repo=Path('.').resolve()
          sys.path.insert(0,'isolated_system4')
          import machine_point0
          srcsha='894997021ae31e3c2e12b0f22368a51f31b50e6f'
          batch='7f2e3290b6ac78ac7df1644395e57ac72f02dc1373e390eb2e532e57a8ce916a'
          out=repo/'control/startmaster0107/recovery_sources'/batch/'generation-000001'
          if out.exists(): raise SystemExit('RECOVERY_SOURCE_ALREADY_EXISTS')
          out.mkdir(parents=True)
          def canon(o): return json.dumps(o,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          def stable(o): return hashlib.sha256(canon(o)).hexdigest()
          def gt(p): return subprocess.check_output(['git','show',srcsha+':'+p],text=True)
          def gj(p): return json.loads(gt(p))
          def visible(s):
              s=re.sub(r'(?is)<!--.*?-->',' ',s); s=re.sub(r'(?is)<(script|style)\\b[^>]*>.*?</\\1>',' ',s)
              return ' '.join(hm.unescape(re.sub(r'(?s)<[^>]+>',' ',s)).split())
          meta=gj('konzept_null/CURRENT_OPEN_7_WORDPRESS_METADATA_20260919.json')
          research=gj('konzept_null/runs/current7/RESEARCH.json')
          so=gj('konzept_null/runs/current7/SOURCE_ORDER.json')
          if meta.get('batch_sha256')!=batch or len(meta.get('items') or [])!=7: raise SystemExit('META_BINDING_INVALID')
          _,plans=machine_point0._current_snapshot_and_plans(repo,machine_point0.root_entry._critical_manifest_sha256())
          if [x['plan_slot'] for x in plans['items']] != [x['plan_slot'] for x in meta['items']]: raise SystemExit('CURRENT_SLOT_MISMATCH')
          pre=[x['production_plan_item'] for x in plans['items']]
          finds={x['plan_slot']:x['findings'] for x in research['items']}
          srcs={x['plan_slot']:{s['source_id']:s for s in x['sources']} for x in so['items']}
          files=['hindernisstangen-fuer-pferde.html','reitplatzbeleuchtung-ohne-mast.html','mistcontainer-mit-deckel.html','pferdehaftpflicht-mit-fremdreiter.html','huffett-fuer-pferde.html','fliegenmasken-fuer-pferde.html','pellets-fuer-pferde.html']
          fps=[]; items=[]; relitems=[]; mitems=[]
          for i,row in enumerate(meta['items']):
              slot=row['plan_slot']; body=gt('konzept_null/runs/current7/articles/'+files[i]); raw=body.encode(); bsha=hashlib.sha256(raw).hexdigest()
              cid='article:'+hashlib.sha256((slot+bsha).encode()).hexdigest()[:24]
              claims=[]; sources=[]; seen=set()
              for f in finds[slot]:
                  fid=f['fact_id']; sid=f['source_id']; ev=f['statement']; sr=srcs[slot][sid]
                  if sid not in seen:
                      sources.append({'source_id':sid,'source_title':sid,'source_url':sr['url'],'snapshot_sha256':hashlib.sha256(ev.encode()).hexdigest(),'evidence':ev}); seen.add(sid)
                  stmt=ev
                  mm=re.search(rf'<p[^>]*data-fact-ids="[^"]*{re.escape(fid)}[^"]*"[^>]*>(.*?data-fact-id="{re.escape(fid)}".*?)</p>',body,re.I|re.S)
                  if mm: stmt=' '.join(hm.unescape(re.sub(r'<[^>]+>',' ',mm.group(1))).split())
                  claims.append({'fact_id':fid,'source_id':sid,'statement':stmt,'evidence_text':ev,'evidence_text_sha256':hashlib.sha256(ev.encode()).hexdigest(),'source_url':sr['url'],'claim_status':'FULLY_SUPPORTED','article_types':[row['article_type']]})
              fid='current7-'+slot
              fps.append({'contract':'canonical_fact_pack_v1','status':'SOURCE_VERIFIED_PRODUCTION_READY','fact_pack_id':fid,'source_snapshot_id':fid,'title_scope':row['title'],'sources':sources,'claims':claims})
              it=json.loads(json.dumps(pre[i],ensure_ascii=False)); it['canonical_article_id']=cid; it['source_snapshot_id']=fid; it.pop('plan_slot',None)
              it['runtime_order']={'order_id':'kn7-'+str(i+1),'article_type':row['article_type'],'title':row['title'],'slug':files[i][:-5],'subject_scope':row['title'],'subject_label':row['target_keyword'],'lead':row['title'],'conclusion':row['title'],'links':(it.get('quality_binding') or {}).get('link_bindings',[]),'allowed_fact_ids':[c['fact_id'] for c in claims],'question':row['title'],'answer':row['title'],'faq_question':row['title'],'faq_answer':row['title'],'summary':row['title'],'search_intent':it.get('search_intent','DECISION_SUPPORT')}
              it['canonical_article']={'title':row['title'],'target_keyword':row['target_keyword'],'article_type':row['article_type'],'slug':files[i][:-5],'body_html':body,'body_html_sha256':bsha,'body_text':visible(body)}
              items.append(it); relitems.append({'plan_slot':slot,'canonical_article_id':cid})
              ap=out/f'ARTICLE_{slot}.md'; ap.write_bytes(raw); mitems.append({'ref':str(ap.relative_to(repo)),'sha256':bsha,'plan_slot':slot})
          bundle={'contract':'canonical_fact_pack_import_v1','fact_packs':fps}
          plan={'contract':'production_plan_v4','plan_contract_version':'4.0.0','required_plugin_version':'6.7.9','items':items}
          bh,ph=stable(bundle),stable(plan)
          rel={'contract':'WORKFLOW_SUPERVISOR_RELEASE_V2_SIGNED','status':'PASS','exact_five_batch_sha256':batch,'exact_five_item_count':7,'fact_pack_bundle_sha256':bh,'production_plan_sha256':ph,'items':relitems,'content_generation_performed_by_supervisor':False,'wordpress_write_performed':False}
          rh=stable(rel)
          env={'contract':'PSERC_APPROVED_PRODUCTION_PACKAGE_V1','fact_pack_bundle_sha256':bh,'production_plan_sha256':ph,'workflow_release_sha256':rh,'package_id':stable({'contract':'PSERC_APPROVED_PRODUCTION_PACKAGE_V1','fact_pack_bundle_sha256':bh,'production_plan_sha256':ph,'workflow_release_sha256':rh}),'source':'KONZEPT_NULL_CURRENT7_ASSISTANT_WRITTEN_LT68_PPM679_PASS','fact_pack_bundle':bundle,'production_plan':plan,'workflow_release':rel}
          env['package_payload_sha256']=stable(env)
          eraw=canon(env); ep=out/'PSERC_IMPORT_ENVELOPE.json'; ep.write_bytes(eraw); esha=hashlib.sha256(eraw).hexdigest()
          if esha!=stable(env): raise SystemExit('ENVELOPE_HASH_INVALID')
          man={'contract':'PFERDE_ATELIER_EXISTING_ARTICLE_RECOVERY_SOURCE_V1','batch_sha256':batch,'runtime_generation':1,'item_count':7,'items':mitems,'import_envelope_ref':str(ep.relative_to(repo)),'import_envelope_sha256':esha,'publish_allowed':False,'content_mutation_performed':False}
          mp=out/'MANIFEST.json'; mp.write_text(json.dumps(man,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          spec=importlib.util.spec_from_file_location('gfr',repo/'control/startmaster0107/GITHUB_FINAL_RELEASE.py'); gfr=importlib.util.module_from_spec(spec); spec.loader.exec_module(gfr)
          ref=str(mp.relative_to(repo)); src,sp,b=gfr.load_source(ref); arts=gfr.snapshot(src,sp,b); ie,_=gfr.load_import_envelope(src,sp,b); gfr.validate_import_envelope_articles(ie,arts)
          if len(arts)!=7: raise SystemExit('FINALIZER_PRECHECK_COUNT_INVALID')
          print('ENDSTEMPEL_SOURCE_PRECHECK_PASS',esha)
          PY
          git diff --check
          git add "control/startmaster0107/recovery_sources/$BATCH_SHA256/generation-000001/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "KONZEPT NULL current7: bind final ENDSTEMPEL recovery source"
          git push origin HEAD:konzept-null/current7-endstempel-source

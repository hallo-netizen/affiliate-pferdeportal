name: HD007 live public SEO probe
on:
  push:
    branches:
      - hobbyroom/hd007-live-seo-check-20261103
permissions:
  contents: read
jobs:
  live-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check public HTTP responses, robots and sitemap
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re, xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          ROOT = "https://www.hobby-depot.de"
          PATHS = [
            "/sitemap_index.xml",
            "/hobbyregister/alabasterschnitzen/",
            "/hobbyregister/air-dry-clay/",
            "/hobbyregister/algenkultur/",
            "/hobbyregister/3d-druck/",
            "/hobbyregister/airbrush/"
          ]
          class MetaParser(HTMLParser):
            def __init__(self):
              super().__init__()
              self.robots = []
              self.canonicals = []
            def handle_starttag(self, tag, attrs):
              if tag != "meta" and tag != "link": return
              a = dict(attrs)
              if tag == "meta" and a.get("name","").lower() in ("robots","googlebot","bingbot"):
                self.robots.append((a.get("name"),a.get("content")))
              if tag == "link" and a.get("rel","").lower() == "canonical":
                self.canonicals.append(a.get("href"))
          def fetch(url):
            try:
              req = urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; Public-SEO-Audit/1.0)"})
              with urllib.request.urlopen(req, timeout=20) as r:
                return r.status, r.geturl(), dict(r.headers), r.read(2500000)
            except urllib.error.HTTPError as e:
              return e.code, url, dict(e.headers), e.read(10000)
            except Exception as e:
              return None, url, {}, (type(e).__name__ + ": " + str(e)).encode()
          all_sitemap_urls = []
          sitemap_urls = []
          for p in PATHS:
            code, final, headers, body = fetch(ROOT+p)
            print("\n=== LIVE",p,"===")
            print("HTTP",code,"final",final)
            print("X-Robots-Tag:", next((v for k,v in headers.items() if k.lower()=="x-robots-tag"),"(absent)"))
            print("Content-Type:",next((v for k,v in headers.items() if k.lower()=="content-type"),"(absent)"))
            if p.endswith(".xml") and code==200:
              print("SITEMAP_BYTES",len(body))
              try:
                tree=ET.fromstring(body)
                locs=[x.text for x in tree.iter() if x.tag.endswith("}loc") or x.tag=="loc"]
                sitemap_urls=locs
                print("SITEMAP_INDEX_LOCS", len(locs))
                for u in locs[:30]: print("SITEMAP_CHILD",u)
              except Exception as e: print("SITEMAP_XML_ERROR",str(e))
            else:
              parser=MetaParser()
              parser.feed(body.decode("utf-8","replace"))
              print("META_ROBOTS",parser.robots)
              print("CANONICAL",parser.canonicals)
              if code != 200: print("ERROR_BODY",body[:300].decode("utf-8","replace"))
          for u in sitemap_urls[:30]:
            status,_,headers,body=fetch(u)
            print("SITEMAP_CHILD_HTTP",status,u)
            if status != 200: continue
            try:
              tree=ET.fromstring(body)
              urls=[x.text for x in tree.iter() if x.tag.endswith("}loc") or x.tag=="loc"]
              all_sitemap_urls.extend(urls)
              print("SITEMAP_CHILD_URLS",len(urls))
            except Exception as e:
              print("SITEMAP_CHILD_PARSE_ERROR",str(e))
          for p in PATHS[1:]:
            print("SITEMAP_CONTAINS",p, ROOT+p in all_sitemap_urls)
          print("SITEMAP_TOTAL_LOC",len(all_sitemap_urls))
          PY

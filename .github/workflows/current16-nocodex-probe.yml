name: current16 direct production executor

on:
  push:
    branches: [current16-original-workflow-nocodex]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Inspect exact bound PPM fact-pack builder
        shell: bash
        run: |
          set -eu
          rm -rf /tmp/ppm679
          mkdir -p /tmp/ppm679
          unzip -q control/startmaster0107/runtime_packages/PORTAL_PRODUCTION_MACHINE_V6.7.9_SIGNED_ARTICLE_TYPE_EXTENSION_ROOTFIX_FINAL.zip -d /tmp/ppm679
          cat /tmp/ppm679/portal-production-machine/tests/normal-draft-production/fixture-builder.php
          echo '=== FACT PACK IMPORT ==='
          grep -Rni -B80 -A180 'canonical_fact_pack_import_v1\|import_fact_pack_bundle' /tmp/ppm679/portal-production-machine --include='*.php' || true

      - name: Read exact current 16 state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/concept-agent-current
          python3 concept_agent/durable_event_log.py current --out /tmp/concept-agent-current | tee /tmp/current.json
          cat /tmp/current.json

      - name: Record executor state
        uses: actions/upload-artifact@v4
        with:
          name: current16-direct-executor-state
          path: |
            /tmp/current.json
            /tmp/concept-agent-current
          if-no-files-found: error
          retention-days: 7

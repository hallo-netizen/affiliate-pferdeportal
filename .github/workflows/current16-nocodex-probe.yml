name: current16 direct production executor

on:
  push:
    branches: [current16-original-workflow-nocodex]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Inspect exact bound PPM 6.7.9 production call
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ppm679
          mkdir -p /tmp/ppm679
          unzip -q control/startmaster0107/runtime_packages/PORTAL_PRODUCTION_MACHINE_V6.7.9_SIGNED_ARTICLE_TYPE_EXTENSION_ROOTFIX_FINAL.zip -d /tmp/ppm679
          grep -Rni -B80 -A140 'BLOCKED_WAVE2_RUNTIME_LINK_ROLE' /tmp/ppm679 --include='*.php' || true
          grep -Rni -B60 -A140 'Content_Validator::\|execute_plan\|validate.*content' /tmp/ppm679 --include='*.php' | head -n 1400

      - name: Read exact current 16 state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/concept-agent-current
          python3 concept_agent/durable_event_log.py current --out /tmp/concept-agent-current | tee /tmp/current.json
          cat /tmp/current.json

      - name: Record executor state
        uses: actions/upload-artifact@v4
        with:
          name: current16-direct-executor-state
          path: |
            /tmp/current.json
            /tmp/concept-agent-current
          if-no-files-found: error
          retention-days: 7

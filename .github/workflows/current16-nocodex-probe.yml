name: current16 one-off execution package

on:
  push:
    branches: [current16-original-workflow-nocodex]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify secured 16 inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(find recovery/current16-input -maxdepth 1 -type f -name '*.md' | wc -l)" -eq 16
          mkdir -p /tmp/current16-package
          cp recovery/current16-input/*.md /tmp/current16-package/
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/current16-package')
          files=sorted(root.glob('*.md'))
          assert len(files)==16
          out=Path('/tmp/PFERDE_ATELIER_16_ARTIKEL_GESAMT.md')
          parts=[]
          for p in files:
              parts.append(p.read_text(encoding='utf-8').rstrip())
              parts.append('\n\n---\n\n')
          out.write_text(''.join(parts).rstrip()+'\n',encoding='utf-8')
          PY
          (cd /tmp/current16-package && zip -q /tmp/PFERDE_ATELIER_16_ARTIKEL.zip *.md)
          sha256sum /tmp/PFERDE_ATELIER_16_ARTIKEL_GESAMT.md /tmp/PFERDE_ATELIER_16_ARTIKEL.zip
      - name: Upload secured article package
        uses: actions/upload-artifact@v4
        with:
          name: PFERDE_ATELIER_16_ARTIKEL
          path: |
            /tmp/PFERDE_ATELIER_16_ARTIKEL_GESAMT.md
            /tmp/PFERDE_ATELIER_16_ARTIKEL.zip
          if-no-files-found: error
          retention-days: 7

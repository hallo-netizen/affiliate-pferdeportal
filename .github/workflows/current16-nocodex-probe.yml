name: current16 nocodex probe

on:
  push:
    branches: [current16-original-workflow-nocodex]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect bound PPM 6.7.9 normal-draft adapter
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ppm679
          mkdir -p /tmp/ppm679
          unzip -q control/startmaster0107/runtime_packages/PORTAL_PRODUCTION_MACHINE_V6.7.9_SIGNED_ARTICLE_TYPE_EXTENSION_ROOTFIX_FINAL.zip -d /tmp/ppm679
          echo '=== FILES ==='
          find /tmp/ppm679 -type f | grep -Ei 'normal-draft-(adapter|pipeline|release-validator)|draft-adapter|draft-pipeline'
          echo '=== ADAPTER ==='
          p="$(find /tmp/ppm679 -type f -name 'normal-draft-adapter.php' | head -n1)"
          test -n "$p"
          sed -n '1,260p' "$p"
          echo '=== PIPELINE HEAD ==='
          q="$(find /tmp/ppm679 -type f -name 'normal-draft-pipeline.php' | head -n1)"
          test -n "$q"
          sed -n '1,300p' "$q"

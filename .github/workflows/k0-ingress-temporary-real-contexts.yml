name: K0 current 3-context writer preparation regression
on:
  push:
    branches: [fix/k0-existing-ingress-persist-20261012]
permissions:
  contents: read
jobs:
  test-real:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Exact current input context writer-core-positive-negative
        shell: bash
        run: |
          set -euo pipefail
          for rd in \
            real_runs/k0/start51-20261012-b1-sattelgurt-gummi \
            real_runs/k0/start51-20261012-b2-elastischer-sattelgurt \
            real_runs/k0/start51-20261012-b3-sand-schubkarre; do
            python3 -m engine.k0_portal_resolver "$rd/WORDPRESS_INTAKE.json" K0_PORTAL_REGISTRY.json > /tmp/test-portal.json
            python3 - "$rd" <<'PY'
          import hashlib,json,pathlib,sys
          rd=sys.argv[1]
          x=json.loads((pathlib.Path(rd)/'AUTHORING_CONTEXT.json').read_text())
          x['run_instance_id']='run:'+hashlib.sha256(rd.encode()).hexdigest()[:24]
          pathlib.Path('/tmp/test-authoring.json').write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n')
          PY
            python3 -m engine.k0_product_property_research bind /tmp/test-authoring.json K0_PRODUCT_PROPERTY_STORE.json /tmp/test-store.json > /tmp/test-property.json
            python3 -m engine.k0_writer_station prepare "$rd/WORDPRESS_INTAKE.json" /tmp/test-portal.json /tmp/test-authoring.json /tmp/test-writer.json
            python3 - "$rd" <<'PY'
          import json,pathlib,sys
          rd=sys.argv[1]
          j=json.load(open('/tmp/test-writer.json'))
          p=json.load(open('/tmp/test-property.json'))
          assert j['contract']=='K0_WRITER_JOB_V1' and j['status']=='OPEN'
          assert j['publish_allowed'] is False
          assert j['writer_rule_bundle']['contract']=='K0_FULL_RULE_BUNDLE_V1'
          assert j['writer_rule_binding']['article_hard_rule_count']>=85
          assert j['rule_context']['contract']=='K0_AUTHORING_RULE_CONTEXT_V1'
          assert p['status'] in ('PASS','NOT_REQUIRED')
          if pathlib.Path(rd,'WRITER_JOB.json').exists():
              original=json.load(open(str(pathlib.Path(rd,'WRITER_JOB.json'))))
              assert original['job_id']==j['job_id']
          print('K0_REAL_CONTEXT_PREPARE_PASS:'+rd+':'+j['job_id'])
          PY
          done
          # Tamper the identity in a temporary copy; canonical station must reject it.
          python3 - <<'PY'
          import json
          p='/tmp/test-authoring.json'
          d=json.load(open(p))
          d['identity']['plan_slot']='0'*64
          with open('/tmp/negative-authoring.json','w') as f:json.dump(d,f)
          PY
          if python3 -m engine.k0_writer_station prepare real_runs/k0/start51-20261012-b3-sand-schubkarre/WORDPRESS_INTAKE.json /tmp/test-portal.json /tmp/negative-authoring.json /tmp/negative-writer.json > /tmp/negative-out.log 2>&1; then
            echo "K0_NEGATIVE_CHANGED_IDENTITY_NOT_REJECTED" >&2
            exit 2
          fi
          echo "K0_REAL_CONTEXT_NEGATIVE_IDENTITY_BLOCK_PASS"
          echo "K0_CURRENT_3_CONTEXT_REGRESSION_PASS"

name: K9 import WordPress metadata
on:
  push:
    branches: [konzept9/greenfield-20260929]
    paths: ['inbox/**.json', 'inbox-auto/**.json']
permissions:
  contents: write
  actions: write
concurrency:
  group: k9-production-state
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Hard tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Import exact five-field WordPress package
        id: intake
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inbox inbox-auto
          count=$(find inbox inbox-auto -maxdepth 1 -type f -name '*.json' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo 'No pending intake; likely cleanup commit.'
            exit 0
          fi
          test "$count" -eq 1
          f=$(find inbox inbox-auto -maxdepth 1 -type f -name '*.json' 2>/dev/null)
          auto_chain=0
          case "$f" in
            inbox-auto/*) auto_chain=1 ;;
          esac
          echo "auto_chain=$auto_chain" >> "$GITHUB_OUTPUT"
          python3 k9_intake.py "$f" --output /tmp/K9_INTAKE.json
          batch_id=$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/K9_INTAKE.json'))['batch_id'])
          PY
          )
          mkdir -p warehouse/intake
          archive="warehouse/intake/${batch_id}.json"
          item_count=$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/K9_INTAKE.json'))['item_count'])
          PY
          )
          echo "item_count=$item_count" >> "$GITHUB_OUTPUT"
          if [ -f "$archive" ]; then
            cmp -s /tmp/K9_INTAKE.json "$archive"
            git rm "$f"
            git config user.name 'k9-intake-bot'
            git config user.email 'actions@users.noreply.github.com'
            git commit -m 'K9: remove already imported intake duplicate'
            git push
            exit 0
          fi
          python3 k9_engine.py import-intake /tmp/K9_INTAKE.json | tee K9_INTAKE_RESULT.json
          cp /tmp/K9_INTAKE.json "$archive"
          git rm "$f"
          git config user.name 'k9-intake-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add state warehouse/intake
          git commit -m 'K9: accept exact WordPress metadata intake'
          git push
      - name: Start existing K9 package for manual intake
        if: ${{ steps.intake.outputs.auto_chain == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ITEM_COUNT: ${{ steps.intake.outputs.item_count }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ITEM_COUNT"
          body="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'ref':'konzept9/greenfield-20260929','inputs':{'station':'research','batch_size':os.environ['ITEM_COUNT'],'run_mode':'station_only'}},separators=(',',':')))
          PY
          )"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hallo-netizen/affiliate-pferdeportal/actions/workflows/text-start-pferdeatelier.yml/dispatches \
            -d "$body"
          echo "K9_MANUAL_PACKAGE_STARTED:$ITEM_COUNT"

      - name: Start existing K9 chain automatically for auto intake
        if: ${{ steps.intake.outputs.auto_chain == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body='{"ref":"konzept9/greenfield-20260929","inputs":{"station":"research","batch_size":"1","run_mode":"auto_chain"}}'
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hallo-netizen/affiliate-pferdeportal/actions/workflows/text-start-pferdeatelier.yml/dispatches \
            -d "$body"
          echo 'K9_AUTO_CHAIN_STARTED_FROM_INTAKE'

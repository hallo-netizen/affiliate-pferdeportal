name: Actual horse vs Hab product images and buttons live browser comparison
on:
  push:
    branches: [hab-actual-product-data-endtoend-audit-20261112]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Inspect browser-real product card images and merchant actions
        shell: bash
        run: |
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import json
          settings=Options()
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1440,900']:
            settings.add_argument(a)
          urls=[
            'https://pferde-atelier.de/ausruestung/ausruestung-sattel/schabracken/',
            'https://pferde-atelier.de/category/schabracken-beratung/',
            'https://hab-und-bewahr.de/einbruch-und-diebstahl/einbruch-und-diebstahl-haus-und-wohnung/c22-haustuerschloesser-dd9773fd40/',
          ]
          drv=webdriver.Chrome(options=settings)
          try:
            drv.set_page_load_timeout(32)
            for u in urls:
              drv.get(u)
              js=r'''
                const links=Array.from(document.querySelectorAll('a')).filter(a=>/Bei (Amazon|eBay|idealo|OTTO)|Amazon|idealo vergleichen|eBay ansehen/i.test(a.textContent)).slice(0,35);
                const productSelectors=['.ppar-affiliate-slot','.ppar-hb-category-products-grid','.ppar-product-card','.ppar-article-product','.ppar-article-product-card','.ppar-affiliate-content'];
                const found=Object.fromEntries(productSelectors.map(s=>[s,document.querySelectorAll(s).length]));
                const images=Array.from(document.querySelectorAll('img')).filter(x=>x.closest('[class*="product"],[class*="affiliate"],[class*="offer"]')).slice(0,25);
                const q=(x)=>{let r=x.getBoundingClientRect();return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}}
                return {url:location.href,title:document.title,html_len:document.documentElement.outerHTML.length,
                counts:found, links:links.map(a=>({txt:a.textContent.trim().slice(0,125),hrefHost:(new URL(a.href)).hostname,anchor:a.outerHTML.slice(0,250),rect:q(a)})),
                images:images.map(i=>({alt:i.alt,complete:i.complete,naturalWidth:i.naturalWidth,srcHost:(new URL(i.currentSrc||i.src)).hostname,rect:q(i)})),
                cssLinks:Array.from(document.querySelectorAll('link[rel=stylesheet]')).filter(x=>/affiliat/i.test(x.href)).map(x=>x.href).slice(0,12),
                cardSample:Array.from(document.querySelectorAll('.ppar-affiliate-slot')).slice(0,4).map(x=>({className:x.className,rect:q(x),text:x.innerText.slice(0,220),images:x.querySelectorAll('img').length,links:x.querySelectorAll('a').length}))
                }
              '''
              d=drv.execute_script(js)
              print('LIVE_COMPARE '+json.dumps(d,ensure_ascii=False))
          finally:
            drv.quit()
          PY

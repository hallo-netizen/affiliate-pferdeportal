name: Glossar 0.2.0 Release Smoke

on:
  push:
    branches:
      - hobbyroom/glossar-v1-current-20260912
    paths:
      - 'protocol/PROJECT_MEMORY/PROJEKTE/PFERDE_ATELIER/GLOSSAR/tmp/uge020-final-collision-part*.b64'
      - '.github/workflows/glossar-020-release-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Materialize exact candidate and lint
        shell: bash
        run: |
          set -euo pipefail
          P='protocol/PROJECT_MEMORY/PROJEKTE/PFERDE_ATELIER/GLOSSAR/tmp'
          cat "$P/uge020-final-collision-part1.b64" "$P/uge020-final-collision-part2.b64" "$P/uge020-final-collision-part3.b64" "$P/uge020-final-collision-part4.b64" > /tmp/uge020.b64
          base64 -d /tmp/uge020.b64 > /tmp/uge020.zip
          unzip -t /tmp/uge020.zip
          mkdir -p .tmp/uge020
          unzip -q /tmp/uge020.zip -d .tmp/uge020
          test -f .tmp/uge020/universal-glossary-engine/universal-glossary-engine.php
          grep -q 'Version: 0.2.0' .tmp/uge020/universal-glossary-engine/universal-glossary-engine.php
          find .tmp/uge020/universal-glossary-engine -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Start real WordPress and MySQL
        shell: bash
        run: |
          set -euo pipefail
          docker network create uge020-net
          docker run -d --name uge020-db --network uge020-net \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=wordpress -e MYSQL_USER=wp -e MYSQL_PASSWORD=wp \
            --health-cmd='mysqladmin ping -h localhost -uroot -proot' --health-interval=3s --health-timeout=3s --health-retries=30 mysql:8.0
          for i in $(seq 1 40); do
            test "$(docker inspect -f '{{.State.Health.Status}}' uge020-db)" = healthy && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' uge020-db)" = healthy
          docker run -d --name uge020-wp --network uge020-net -p 8080:80 \
            -e WORDPRESS_DB_HOST=uge020-db:3306 -e WORDPRESS_DB_NAME=wordpress -e WORDPRESS_DB_USER=wp -e WORDPRESS_DB_PASSWORD=wp \
            -v "$GITHUB_WORKSPACE/.tmp/uge020/universal-glossary-engine:/var/www/html/wp-content/plugins/universal-glossary-engine:ro" wordpress:php8.1-apache
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/ >/dev/null

      - name: Install WordPress and activate candidate
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          docker cp /tmp/wp uge020-wp:/usr/local/bin/wp
          docker exec uge020-wp chmod +x /usr/local/bin/wp
          docker exec uge020-wp wp core install --allow-root --url='http://127.0.0.1:8080' --title='UGE 020 Smoke' --admin_user=admin --admin_password='UGE-smoke-1234' --admin_email='admin@example.test' --skip-email
          docker exec uge020-wp wp rewrite structure '/%postname%/' --hard --allow-root
          docker exec uge020-wp wp plugin activate universal-glossary-engine --allow-root
          docker exec uge020-wp wp plugin is-active universal-glossary-engine --allow-root
          test "$(docker exec uge020-wp wp plugin get universal-glossary-engine --field=version --allow-root)" = '0.2.0'

      - name: Positive and negative – homepage routes and preview
        shell: bash
        run: |
          set -euo pipefail
          PAGE_ID=$(docker exec uge020-wp wp post create --allow-root --post_type=page --post_status=publish --post_title='Glossar' --post_name=glossar --post_excerpt='Pferdebegriffe verständlich erklärt.' --porcelain)
          docker exec uge020-wp wp eval --allow-root "\$cfg=UGE_Config::get(); \$cfg['main_page_id']=$PAGE_ID; \$cfg['rewrite_base']='glossar'; \$cfg['term_segment']='begriff'; \$cfg['design_profile']='pferde_atelier'; update_option(UGE_Config::OPTION, UGE_Config::sanitize(\$cfg)); UGE_Core::register_content(); flush_rewrite_rules();"
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl9ZQAAAABJRU5ErkJggg==' | base64 -d > /tmp/hero.png
          docker cp /tmp/hero.png uge020-wp:/tmp/hero.png
          ATTACH_ID=$(docker exec uge020-wp wp media import /tmp/hero.png --title='Glossar Hero' --porcelain --allow-root)
          docker exec uge020-wp wp post meta update "$PAGE_ID" _thumbnail_id "$ATTACH_ID" --allow-root

          docker exec uge020-wp wp term create uge_group Gesundheit --slug=gesundheit --allow-root
          TERM_ID=$(docker exec uge020-wp wp post create --allow-root --post_type=uge_term --post_status=publish --post_title='Kolik' --post_name=kolik --post_content='<p>Ausführliche Erklärung zur Kolik beim Pferd.</p>' --porcelain)
          docker exec uge020-wp wp post meta update "$TERM_ID" _uge_short_definition 'Kolik ist ein Sammelbegriff für Bauchschmerzen beim Pferd.' --allow-root
          docker exec uge020-wp wp post term add "$TERM_ID" uge_group Gesundheit --allow-root
          DRAFT_ID=$(docker exec uge020-wp wp post create --allow-root --post_type=uge_term --post_status=draft --post_title='Vorschau Begriff' --post_name=vorschau-begriff --post_content='<p>Dieser Entwurf muss in der Vorschau sichtbar sein.</p>' --porcelain)

          curl -fsS http://127.0.0.1:8080/glossar/ -o /tmp/home.html
          grep -q 'uge-hero-image' /tmp/home.html
          grep -q 'uge-search-form' /tmp/home.html
          grep -q 'uge-az' /tmp/home.html
          grep -q '/glossar/gesundheit/' /tmp/home.html
          grep -q '/glossar/begriff/kolik/' /tmp/home.html
          grep -q 'data-uge-slider' /tmp/home.html
          ! grep -q '#uge-group-' /tmp/home.html
          ! grep -q 'Vorschau Begriff' /tmp/home.html
          grep -q '#35422A' /tmp/home.html
          grep -q '#C89214' /tmp/home.html
          ! grep -qi '#27a653' /tmp/home.html

          curl -fsS http://127.0.0.1:8080/glossar/gesundheit/ -o /tmp/category.html
          grep -q 'Kolik' /tmp/category.html
          grep -q '/glossar/begriff/kolik/' /tmp/category.html
          curl -fsS http://127.0.0.1:8080/glossar/begriff/kolik/ -o /tmp/term.html
          grep -q 'Ausführliche Erklärung zur Kolik beim Pferd.' /tmp/term.html
          grep -q 'uge-ad-slot-top' /tmp/term.html
          grep -q 'uge-ad-slot-inline' /tmp/term.html
          grep -q 'uge-ad-slot-bottom' /tmp/term.html
          OLD_STATUS=$(curl -sS -o /tmp/old.html -w '%{http_code}' http://127.0.0.1:8080/glossar/kolik/)
          test "$OLD_STATUS" != '200'

          curl -sS -c /tmp/cookies.txt -d 'log=admin&pwd=UGE-smoke-1234&wp-submit=Log+In&redirect_to=http%3A%2F%2F127.0.0.1%3A8080%2Fwp-admin%2F' http://127.0.0.1:8080/wp-login.php >/dev/null
          PREVIEW=$(docker exec uge020-wp wp eval --allow-root "echo get_preview_post_link($DRAFT_ID);")
          curl -fsS -b /tmp/cookies.txt "$PREVIEW" -o /tmp/preview.html
          grep -q 'Vorschau Begriff' /tmp/preview.html
          grep -q 'Dieser Entwurf muss in der Vorschau sichtbar sein.' /tmp/preview.html
          echo 'UGE020_ROUTE_HOME_PREVIEW_PASS'

      - name: Positive and negative – SEO collision hard rule
        shell: bash
        run: |
          set -euo pipefail
          COLLIDE_ID=$(docker exec uge020-wp wp post create --allow-root --post_type=uge_term --post_status=publish --post_title='Gesundheit' --post_name=gesundheit --porcelain)
          test "$(docker exec uge020-wp wp post get "$COLLIDE_ID" --field=post_status --allow-root)" = draft

          FEED_ID=$(docker exec uge020-wp wp post create --allow-root --post_type=uge_term --post_status=publish --post_title='Fütterung' --post_name=fuetterung --porcelain)
          test "$(docker exec uge020-wp wp post get "$FEED_ID" --field=post_status --allow-root)" = publish
          docker exec uge020-wp wp term create category Fütterung --slug=fuetterung --allow-root
          test "$(docker exec uge020-wp wp post get "$FEED_ID" --field=post_status --allow-root)" = draft

          cat > /tmp/portal-type.php <<'PHP'
          <?php
          if (!class_exists('Pferde_Template_Kit')) {
              final class Pferde_Template_Kit {
                  public static function affiliate_page_type($page_id) {
                      $p=get_post($page_id);
                      return ($p instanceof WP_Post && $p->post_name==='haltung') ? 'category' : '';
                  }
              }
          }
          PHP
          docker exec uge020-wp mkdir -p /var/www/html/wp-content/mu-plugins
          docker cp /tmp/portal-type.php uge020-wp:/var/www/html/wp-content/mu-plugins/portal-type.php
          HOLD_ID=$(docker exec uge020-wp wp post create --allow-root --post_type=uge_term --post_status=publish --post_title='Haltung' --post_name=haltung --porcelain)
          test "$(docker exec uge020-wp wp post get "$HOLD_ID" --field=post_status --allow-root)" = publish
          docker exec uge020-wp wp post create --allow-root --post_type=page --post_status=publish --post_title='Haltung' --post_name=haltung >/dev/null
          test "$(docker exec uge020-wp wp post get "$HOLD_ID" --field=post_status --allow-root)" = draft

          docker exec uge020-wp wp term create category Ausrüstung --slug=ausruestung --allow-root
          cat > /tmp/collision-import.json <<'JSON'
          {"format":"uge-json-v1","items":[{"title":"Ausrüstung","slug":"ausruestung","content":"Soll blockiert werden.","groups":[],"fields":{"short_definition":"Soll nicht angelegt werden."}}]}
          JSON
          docker cp /tmp/collision-import.json uge020-wp:/tmp/collision-import.json
          docker exec uge020-wp wp eval --allow-root 'wp_set_current_user(1); $_FILES["uge_json"]=["tmp_name"=>"/tmp/collision-import.json","size"=>filesize("/tmp/collision-import.json")]; $_REQUEST["uge_transfer_nonce"]=wp_create_nonce("uge_import"); UGE_Transfer::import();' || true
          IMPORTED=$(docker exec uge020-wp wp post list --allow-root --post_type=uge_term --name=ausruestung --field=ID --format=ids)
          test -z "$IMPORTED"
          echo 'UGE020_COLLISION_HARD_RULE_PASS'

      - name: Final proof
        run: |
          echo 'UGE020_REAL_WORDPRESS_POSITIVE_NEGATIVE_PASS'
          docker exec uge020-wp wp core version --allow-root
          docker exec uge020-wp php -r 'echo PHP_VERSION, PHP_EOL;'

name: System4A temp remove fixed seven
on:
  push:
    branches:
      - hobbyroom/system4a-remove-fixed-seven-20260917
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify entrance hash chain
        run: |
          python control/cloud-entry-gate/cloud_repo_ci_test.py
          sha256sum control/startmaster0107/STEP_107008_FINAL_NEW_ARTICLE_BATCH_REVIEW_AWAIT_USER_PUBLISH.json
          sha256sum control/startmaster0107/STEP_107007_RUN_NEW_ARTICLE_BATCH_NO_STOP.json
          sha256sum control/startmaster0107/CURRENT_STATE.json
      - name: Downstream 1..N contract
        run: python3 isolated_system4/downstream_1n_contract_probe.py
      - name: V2 to 107008 bridge
        run: python3 -m unittest control.startmaster0107.test_system4_107008_handoff -v
      - name: Handoff transport 1..N
        run: PYTHONPATH=isolated_system4 python3 -m unittest isolated_system4.test_handoff_transport -v
      - name: Source hardlock scan
        run: |
          set -euo pipefail
          ! grep -nF 'article_count=7' control/startmaster0107/STEP_107008_FINAL_NEW_ARTICLE_BATCH_REVIEW_AWAIT_USER_PUBLISH.json
          ! grep -nF "req.get('article_count')!=7" .github/workflows/pferde-atelier-endstempel.yml
          ! grep -nF "m.get('article_count')!=7" .github/workflows/pferde-atelier-endstempel.yml
          ! grep -nF 'len(articles) != 7' control/startmaster0107/ENDSTEMPEL_HANDOFF_GATE.py
          ! grep -nF '"article_count": 7' control/startmaster0107/ENDSTEMPEL_HANDOFF_GATE.py
          echo SYSTEM4_DOWNSTREAM_FIXED_SEVEN_REMOVED_PASS

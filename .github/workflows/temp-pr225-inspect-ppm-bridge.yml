name: TEMP PR225 Apply Minimal PPM Repair Fix
on:
  push:
    branches:
      - hobbyroom/107007-ppm-repair-detail-20260911
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply one KISS parser fix, refresh existing bindings, self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, importlib.util, json, py_compile

          handoff=Path('control/startmaster0107/fachworkflow_proof_handoff.py')
          text=handoff.read_text(encoding='utf-8')
          old='''def _ppm_repair_findings(value: Any) -> list[dict]:
              found=[]
              def walk(node: Any) -> None:
                  if isinstance(node,dict):
                      code=str(node.get("error_code") or "")
                      if code.startswith(_PPM_REPAIRABLE_PREFIXES):
                          found.append({
                              "error_code": code,
                              "failed_rule": node.get("failed_rule"),
                              "field_path": node.get("field_path"),
                              "expected": node.get("expected"),
                              "actual": node.get("actual"),
                              "reason": node.get("reason"),
                              "validator_id": node.get("validator_id"),
                          })
                      for child in node.values(): walk(child)
                  elif isinstance(node,list):
                      for child in node: walk(child)
              walk(value)
              unique=[]; seen=set()
              for item in found:
                  key=json.dumps(item,ensure_ascii=False,sort_keys=True,default=str)
                  if key not in seen:
                      seen.add(key); unique.append(item)
              return unique
          '''
          new='''def _ppm_repair_findings(value: Any) -> list[dict]:
              found=[]
              def add(code: Any, node: Mapping[str, Any]) -> None:
                  code=str(code or "")
                  if not code.startswith(_PPM_REPAIRABLE_PREFIXES): return
                  found.append({
                      "error_code": code,
                      "failed_rule": node.get("failed_rule"),
                      "field_path": node.get("field_path"),
                      "expected": node.get("expected"),
                      "actual": node.get("actual"),
                      "reason": node.get("reason"),
                      "validator_id": node.get("validator_id"),
                  })
              def walk(node: Any) -> None:
                  if isinstance(node,dict):
                      add(node.get("error_code"),node)
                      for key in ("reason_codes","errors"):
                          codes=node.get(key)
                          if isinstance(codes,list):
                              for code in codes:
                                  if isinstance(code,str): add(code,node)
                      for child in node.values(): walk(child)
                  elif isinstance(node,list):
                      for child in node: walk(child)
              walk(value)
              unique=[]; seen=set()
              for item in found:
                  key=json.dumps(item,ensure_ascii=False,sort_keys=True,default=str)
                  if key not in seen:
                      seen.add(key); unique.append(item)
              return unique
          '''
          if old not in text:
              raise SystemExit('EXPECTED_PPM_REPAIR_FUNCTION_NOT_FOUND')
          handoff.write_text(text.replace(old,new,1),encoding='utf-8')

          py_compile.compile(str(handoff),doraise=True)
          spec=importlib.util.spec_from_file_location('handoff',handoff)
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          assert mod.selftest()['ok'] is True
          pos=mod._ppm_repair_findings({'ppm_result':{'gate':{'reason_codes':['BLOCKED_WAVE2_QUALITY_BINDING_MISSING']}}})
          assert [x['error_code'] for x in pos]==['BLOCKED_WAVE2_QUALITY_BINDING_MISSING']
          legacy=mod._ppm_repair_findings({'error_code':'BLOCKED_CONTENT_STRUCTURE_REQUIRED'})
          assert [x['error_code'] for x in legacy]==['BLOCKED_CONTENT_STRUCTURE_REQUIRED']
          neg=mod._ppm_repair_findings({'reason_codes':['PSERC_BRIDGE_PPM_RUNTIME_NOT_LOADED']})
          assert neg==[]

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))
          def save(path,obj):
              Path(path).write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          step_path='control/startmaster0107/STEP_107007_RUN_NEW_ARTICLE_BATCH_NO_STOP.json'
          step=load(step_path)
          target='control/startmaster0107/fachworkflow_proof_handoff.py'
          matches=[x for x in step['authorized_inputs'] if x.get('ref')==target]
          assert len(matches)==1
          matches[0]['sha256']=sha(handoff)
          save(step_path,step)

          current_path='control/startmaster0107/CURRENT_STATE.json'
          current=load(current_path)
          current['execution_gate']['bundle_sha256']=sha(step_path)
          save(current_path,current)

          start_path='control/startmaster0107/PFERDE_ATELIER_START_HERE.json'
          start=load(start_path)
          start['current_state_sha256']=sha(current_path)
          save(start_path,start)

          print('HANDOFF_SHA256='+sha(handoff))
          print('STEP_SHA256='+sha(step_path))
          print('CURRENT_STATE_SHA256='+sha(current_path))
          print('PARSER_POS_NEG_PASS')
          PY

          rm -f .github/workflows/temp-pr225-inspect-ppm-bridge.yml
          git config user.name 'hallo-netizen'
          git config user.email 'hallo@oliver-beil.de'
          git add control/startmaster0107/fachworkflow_proof_handoff.py \
                  control/startmaster0107/STEP_107007_RUN_NEW_ARTICLE_BATCH_NO_STOP.json \
                  control/startmaster0107/CURRENT_STATE.json \
                  control/startmaster0107/PFERDE_ATELIER_START_HERE.json \
                  .github/workflows/temp-pr225-inspect-ppm-bridge.yml
          git diff --cached --check
          git commit -m 'KISS: preserve repairable PPM reason codes in existing handoff'
          git push origin HEAD:hobbyroom/107007-ppm-repair-detail-20260911

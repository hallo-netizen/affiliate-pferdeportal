name: Hab & Bewahr Affiliate – isolated source, function parity, ZIP and readback
on:
  push:
    branches: [hbd-affiliate-port-20261106]
    paths:
      - ".github/workflows/hbd-affiliate-build-20261106.yml"
      - "protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/AFFILIATE/HAB_BAU/**"
permissions:
  contents: write
jobs:
  test-and-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build complete independent plugin and test function parity
        shell: bash
        run: |
          set -euo pipefail
          B="protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/AFFILIATE/HAB_BAU"
          python3 "$B/build.py"
          find "$B/_build/affiliate-portal-router" -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check "$B/_build/affiliate-portal-router/assets/frontend.js"
          php "$B/tests/boot_smoke.php"
          php "$B/tests/smoke.php" valid
          php "$B/tests/smoke.php" invalid
          php "$B/tests/smoke.php" wrong_revision
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,json
          r=Path('protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/AFFILIATE/HAB_BAU')
          p=r/'HAB_UND_BEWAHR_AFFILIATE_0.1.0_RC2.zip'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None and len(z.namelist())==27
              assert all(x.startswith('affiliate-portal-router/') for x in z.namelist())
              names=set(z.namelist())
              assert 'affiliate-portal-router/includes/class-ppar-hab-bewahr-bridge.php' in names
          report=json.loads((r/'build_report.json').read_text())
          assert report['source_files']==26 and report['output_files']==27
          assert not report['functions_removed']
          print('HB_AFFILIATE_FULL_ZIP_CRC_AND_FUNCTION_PARITY_PASS',report['sha256'],report['size_bytes'])
          PY
      - name: Stage exact full ZIP in protected-review branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          B="protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/AFFILIATE/HAB_BAU"
          SRC="$B/HAB_UND_BEWAHR_AFFILIATE_0.1.0_RC2.zip"
          TARGET="protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip"
          RELEASE="hbd-affiliate-rc2-release-20261106"
          CAMPUS="hobbyroom/project-memory-campus-v1-20260905"
          cp "$SRC" /tmp/hbd-affiliate-verified.zip
          if git ls-remote --exit-code --heads origin "$RELEASE" >/dev/null; then
             git fetch --no-tags origin "refs/heads/$RELEASE"
             git show "FETCH_HEAD:$TARGET" >/tmp/hbd-affiliate-existing.zip
             cmp -s /tmp/hbd-affiliate-existing.zip /tmp/hbd-affiliate-verified.zip
             echo "HB_AFFILIATE_EXISTING_RELEASE_BYTES_IDENTICAL"
          else
             git fetch --no-tags origin "refs/heads/$CAMPUS:refs/remotes/origin/$CAMPUS"
             git switch --create "$RELEASE" "origin/$CAMPUS"
             mkdir -p "$(dirname "$TARGET")"
             cp /tmp/hbd-affiliate-verified.zip "$TARGET"
             git add -- "$TARGET"
             git -c user.name="Hab Affiliate Build" -c user.email="actions@users.noreply.github.com" commit -m "H&B: staged complete isolated Affiliate RC2 candidate"
             git push origin "HEAD:refs/heads/$RELEASE"
          fi
          echo "HB_AFFILIATE_RELEASE_BRANCH_READY"
      - name: Independent GitHub readback from clean checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRC="protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/AFFILIATE/HAB_BAU/HAB_UND_BEWAHR_AFFILIATE_0.1.0_RC2.zip"
          TARGET="protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip"
          mkdir -p /tmp/hbd-affiliate-readback
          git -C /tmp/hbd-affiliate-readback init -q
          git -C /tmp/hbd-affiliate-readback remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -C /tmp/hbd-affiliate-readback -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" fetch -q --depth=1 origin refs/heads/hbd-affiliate-rc2-release-20261106
          git -C /tmp/hbd-affiliate-readback show "FETCH_HEAD:$TARGET" >/tmp/hbd-affiliate-remote.zip
          cmp -s "$SRC" /tmp/hbd-affiliate-remote.zip
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile
          a=Path('/tmp/hbd-affiliate-remote.zip')
          with ZipFile(a) as z:
              assert z.testzip() is None and len(z.infolist())==27
          print('HB_AFFILIATE_INDEPENDENT_GITHUB_READBACK_PASS',sha256(a.read_bytes()).hexdigest(),a.stat().st_size)
          PY
      - name: Independent readback of ALL FOUR ZIPs from official Campus
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/hb-official-4-readback
          git -C /tmp/hb-official-4-readback init -q
          git -C /tmp/hb-official-4-readback remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -C /tmp/hb-official-4-readback -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" fetch -q --depth=1 origin "refs/heads/hobbyroom/project-memory-campus-v1-20260905"
          python3 - <<'PY'
          import subprocess,hashlib,zipfile,io
          path="protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/"
          names={
           "HAB-001-DESIGN":("947a950273edb6bf47e76ffeef67ff51425db620adc2650c742831e73093134c",84349647,430),
           "HAB-002-KATEGORIE-WORKFLOW":("ec39080e5350b9f7b3924239376e11580ce7de195a60bb89feafae6152533f98",368530,49),
           "HAB-003-BILDZENTRALE":("58af0d394752e767b5f0c7d6d9901eeaec921331ab6245144859e3e6626e4559",70397,3),
           "HAB-004-AFFILIATE":("014e42b9657eed74b4d2e1f29ea51c6c6bf5c276ec30402011289b3821cbe153",603323,27),
          }
          for name,(sha,size,n) in names.items():
              data=subprocess.check_output(["git","-C","/tmp/hb-official-4-readback","show","FETCH_HEAD:"+path+name+"/CURRENT.zip"])
              assert len(data)==size,name
              assert hashlib.sha256(data).hexdigest()==sha,name
              with zipfile.ZipFile(io.BytesIO(data)) as z:
                  assert len(z.infolist())==n and z.testzip() is None,name
              print("OFFICIAL_HB_PLUGIN_READBACK_PASS",name,size,n)
          PY
      - name: Keep exact installable candidate for download
        uses: actions/upload-artifact@v4
        with:
          name: HAB_UND_BEWAHR_AFFILIATE_0.1.0_RC2
          path: protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/AFFILIATE/HAB_BAU/HAB_UND_BEWAHR_AFFILIATE_0.1.0_RC2.zip
          retention-days: 30
          if-no-files-found: error

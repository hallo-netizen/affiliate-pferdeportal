name: System4A final main V2 proof
on:
  push:
    branches:
      - 'hobbyroom/system4a-final-main-v2-proof-20260918'
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 19451f92321cc0ac0aeabfa8ef09e7a6be3302ac
      - name: Exact final main
        run: test "$(git rev-parse HEAD)" = "19451f92321cc0ac0aeabfa8ef09e7a6be3302ac"
      - name: Prove downstream 1..N
        run: python3 isolated_system4/downstream_1n_contract_probe.py
      - name: Prove V2 handoff to 107008
        run: python3 -m unittest control.startmaster0107.test_system4_107008_handoff -v
      - name: Prove handoff transport 1..N
        run: PYTHONPATH=isolated_system4 python3 -m unittest isolated_system4.test_handoff_transport -v

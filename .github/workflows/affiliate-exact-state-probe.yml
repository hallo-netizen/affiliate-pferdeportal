name: Affiliate exact state probe
on:
  push:
    branches:
      - affiliate-e2e-repro-20260920

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe exact pre-incident WPvivid DB backup read-only
        shell: bash
        run: |
          set -euo pipefail
          URL='https://pferde-atelier.de/wp-content/wpvividbackups/pferde-atelier.de_wpvivid-80a4b8c41fcc8_2026-09-16-15-20_backup_db.zip'
          OUT='/tmp/pferde-atelier-preincident-db.zip'
          code=$(curl -L --silent --show-error --max-time 180 --output "$OUT" --write-out '%{http_code}' "$URL" || true)
          echo "HTTP_CODE=$code"
          test "$code" = "200" || { echo 'BLOCKED_EXACT_WPVIVID_DB_NOT_PUBLICLY_READABLE'; exit 31; }
          test -s "$OUT"
          bytes=$(wc -c < "$OUT")
          echo "BACKUP_BYTES=$bytes"
          sha256sum "$OUT"
          unzip -t "$OUT"
          unzip -l "$OUT" | head -80
          rm -rf /tmp/wpvivid-db && mkdir /tmp/wpvivid-db
          unzip -q "$OUT" -d /tmp/wpvivid-db
          find /tmp/wpvivid-db -type f -maxdepth 3 -printf '%p %s bytes\n' | head -80
          SQL=$(find /tmp/wpvivid-db -type f -name '*.sql' | head -1)
          test -n "$SQL" || { echo 'BLOCKED_WPVIVID_SQL_NOT_FOUND'; exit 32; }
          echo "SQL_FILE=$SQL"
          grep -m1 -n "ppar_assignments_v1" "$SQL" || true
          grep -m1 -n "ppar_network_idealo_v1" "$SQL" || true
          grep -m1 -n "ppar_ebay_public_checkpoint_v1" "$SQL" || true
          grep -m1 -n "ppar_ebay_items" "$SQL" || true
          echo 'EXACT_PREINCIDENT_DB_READABLE=PASS'

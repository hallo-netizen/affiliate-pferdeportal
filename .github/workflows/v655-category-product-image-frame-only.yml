name: V6.55 category product image frame ONLY full gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  image-frame-release:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'v655-category-product-image-frame-only-20260823'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      mariadb:
        image: mariadb:11.4
        ports:
          - 3306:3306
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: v655imageframe
          MARIADB_USER: wp
          MARIADB_PASSWORD: wppass
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uwp -pwppass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          tools: wp-cli
          coverage: none
      - name: Execute image-frame-only full release gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x .github/v655-image-frame/runner/run-image-frame-full-release.sh
          .github/v655-image-frame/runner/run-image-frame-full-release.sh
      - name: Upload final verified image-frame-only release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V655_CATEGORY_PRODUCT_IMAGE_FRAME_ONLY_FINAL
          path: |
            affiliate-zentrale_v6.55.0_CATEGORY_PRODUCT_IMAGE_FRAME_ONLY_REALGATE.zip
            MASTER_AFFILIATE_ZENTRALE_V6_55_0_CATEGORY_PRODUCT_IMAGE_FRAME_ONLY_REALGATE_20260823.zip
            V655_IMAGE_FRAME_RELEASE_EVIDENCE/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Upload blocked evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V655_CATEGORY_PRODUCT_IMAGE_FRAME_ONLY_BLOCKED
          path: V655_IMAGE_FRAME_RELEASE_EVIDENCE/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

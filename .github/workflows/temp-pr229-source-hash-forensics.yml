name: TEMP PR229 Source Hash Forensics
on:
  push:
    branches:
      - hobbyroom/107007-source-hash-kiss-20260911
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bound PPM fact-pack source-hash semantics
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ppm
          mkdir -p /tmp/ppm
          unzip -q control/startmaster0107/runtime_packages/PORTAL_PRODUCTION_MACHINE_V6.7.9_SIGNED_ARTICLE_TYPE_EXTENSION_ROOTFIX_FINAL.zip -d /tmp/ppm
          report=control/startmaster0107/PPM_SOURCE_HASH_FORENSICS.tmp.txt
          : > "$report"
          echo '=== MATCHES ===' >> "$report"
          grep -RniI -E 'fact_pack_hash|source_hashes|source_snapshot_id|import_fact_pack_bundle' /tmp/ppm >> "$report" || true
          echo >> "$report"
          echo '=== MATCHED FILE CONTEXT ===' >> "$report"
          files=$(grep -RliI -E 'fact_pack_hash|source_hashes|source_snapshot_id|import_fact_pack_bundle' /tmp/ppm || true)
          for f in $files; do
            echo >> "$report"
            echo "===== $f =====" >> "$report"
            cat "$f" >> "$report"
          done
          git config user.name 'hallo-netizen'
          git config user.email 'hallo@oliver-beil.de'
          git add "$report"
          git commit -m 'TEMP PR229 inspect PPM source-hash semantics'
          git push origin HEAD:hobbyroom/107007-source-hash-kiss-20260911

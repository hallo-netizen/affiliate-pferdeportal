name: HAB original theme photo asset inspection
on:
  push:
    branches: [hab-004-rc11-audit-download-20261107]
permissions:
  contents: read
jobs:
  inspect-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract only two exact already-approved photos
        shell: bash
        run: |
          mkdir -p hab-photo-audit
          python3 - <<'PY'
          from zipfile import ZipFile
          import shutil
          p='protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-001-DESIGN/CURRENT.zip'
          with ZipFile(p) as z:
              for f in ('topic-62-wassermelder.webp','new-boiler.webp'):
                  matches=[x for x in z.namelist() if x.endswith('/assets/'+f)]
                  assert len(matches)==1, (f,matches)
                  raw=z.read(matches[0])
                  assert raw[:4]==b'RIFF' and raw[8:12]==b'WEBP', f
                  open('hab-photo-audit/'+f,'wb').write(raw)
                  print('REAL_DESIGN_IMAGE',f,len(raw),len(matches))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Hab-approved-theme-banner-photos
          path: hab-photo-audit
          retention-days: 2
          if-no-files-found: error

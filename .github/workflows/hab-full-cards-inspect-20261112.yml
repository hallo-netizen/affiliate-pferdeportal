name: HAB full card source review (read-only)
on:
  push:
    branches: [hab-affiliate-full-cards-20261112]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace provider-card selector slot propagation
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          z=ZipFile('protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip')
          for p in z.namelist():
            if not p.endswith('.php'):continue
            lines=z.read(p).decode('utf8','replace').splitlines()
            for i,l in enumerate(lines):
              if any(n in l for n in ['multiprovider_reorder_candidates(', 'multiprovider_filter_candidates_by_strategy(', 'idealo_standalone_campaign_allowed(']):
                print('CALL',p,i+1,l[:480])
                for k in range(max(0,i-4),min(len(lines),i+6)):print('NEAR',p,k+1,lines[k][:420])
          PY
      - name: Inspect trigger schedule and provider card UI conditions
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          z=ZipFile('protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip')
          file='affiliate-portal-router/includes/trait-ppar-idealo.php'
          a=z.read(file).decode().splitlines()
          for first,last in [(66,100),(865,976),(1275,1307),(1030,1082)]:
            print('SECTION',first,last)
            for i in range(first-1,min(last,len(a))):print('TRIGGER',i+1,a[i][:650])
          for file in ['affiliate-portal-router/affiliate-portal-router.php','affiliate-portal-router/includes/trait-ppar-idealo.php']:
            a=z.read(file).decode().splitlines()
            for i,l in enumerate(a):
              if any(s in l for s in ['idealo_standalone_campaign_allowed(', 'idealo_campaign_publicly_allowed(', 'idealo_sync_campaign_activation(', 'idealo_auto_refresh', "['feed_url']", "['auto_refresh']"]):
                print('CALL',file,i+1,l[:440])
          PY
      - name: Inspect category priorities and product concept matching
        shell: bash
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          z=ZipFile('protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip')
          data=[
           ('affiliate-portal-router/includes/class-ppar-hab-bewahr-bridge.php',[(379,450),(90,160)]),
           ('affiliate-portal-router/includes/trait-ppar-idealo.php',[(268,385),(391,440),(742,756),(817,915),(1070,1142),(1160,1183),(1263,1305)]),
           ('affiliate-portal-router/includes/trait-ppar-hb-amazon.php',[(257,390),(399,490)]),
           ('affiliate-portal-router/affiliate-portal-router.php',[(2780,2831),(4205,4300),(4860,4940)])
          ]
          for f,ranges in data:
            src=z.read(f).decode().splitlines()
            for start,stop in ranges:
              print('REGION',f,start,stop)
              for i in range(start-1,min(stop,len(src))):print('CODE_REGION',f,i+1,src[i][:520])
          PY
      - name: Inspect product source, exact selectors and feed API code
        shell: bash
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          import re
          path='protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip'
          z=ZipFile(path)
          specs={
            'affiliate-portal-router/includes/trait-ppar-idealo.php': [
              'idealo_settings','idealo_find_feed_metadata','idealo_provider_access_test','idealo_render_sync_card','idealo_refresh_remote_feed','idealo_download_feed_to_temp','idealo_import_feed_file','idealo_campaign_publicly_allowed','idealo_standalone_campaign_allowed','multiprovider_matching_offers_for_banner','idealo_materialize_campaigns','idealo_add_matching_categories','idealo_render_specialist_content','idealo_sync_dispatch',
            ],
            'affiliate-portal-router/includes/trait-ppar-hb-amazon.php':[
              'hb_amazon_product_family_markup','hb_amazon_category_results','hb_amazon_category_candidate','hb_amazon_category_search_fallback','hb_amazon_dfs_do_tick','hb_amazon_dfs_candidate',
            ],
            'affiliate-portal-router/affiliate-portal-router.php':[
              'render_affiliate_slot_for_context','campaign_match_rank','campaign_to_group_banner','render_banner','render_affiliate_slot','category_product_public_image_ready','multiprovider_matching_offers_for_banner','provide_leaf_category_affiliate_slot_html','hb_insurance_scope',
            ],
            'affiliate-portal-router/includes/class-ppar-hab-bewahr-bridge.php':['area','area_products','area_banner'],
          }
          for file,funcs in specs.items():
            lines=z.read(file).decode('utf8','replace').splitlines()
            for name in funcs:
              index=next((i for i,t in enumerate(lines) if re.search(r'function\s+'+re.escape(name)+r'\s*\(',t)),None)
              if index is None:print('MISSING_METHOD',file,name);continue
              lim=125 if name in ('idealo_download_feed_to_temp','idealo_import_feed_file','idealo_materialize_campaigns','render_affiliate_slot_for_context','hb_amazon_product_family_markup','idealo_render_sync_card') else 70
              print('BEGIN',file,name,index+1)
              for j in range(index,min(len(lines),index+lim)):
                print('CODE',name,j+1,lines[j][:450])
              print('END',name)
          PY

name: Affiliate Router Cleanup Combined

on:
  push:
    branches: [affiliate-release-current]
    paths:
      - '.github/workflows/affiliate-router-cleanup-combined.yml'
      - 'AFFILIATE_HOBBYRAUM/test_otto_automation.php'
      - 'AFFILIATE_HOBBYRAUM/test_adcell_awin_otto_unchanged.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-contract:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Governance and exact 6.72.166 source binding
        shell: bash
        run: |
          set -euo pipefail
          python3 control/release-governance/release_guard.py governance-check
          python3 control/release-governance/release_guard.py source-check
          python3 control/release-governance/release_guard.py start --branch affiliate-release-current
          grep -F "Version: 6.72.166" release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php
          grep -F "const VERSION = '6.72.166';" release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php
          test "$(grep -cve '^[[:space:]]*$' release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt)" = "27"
          echo "PASS exact source-bound 6.72.166"

      - name: Exact delta versus proven 6.72.165
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v672165 /tmp/v672166
          mkdir -p /tmp/v672165 /tmp/v672166
          git archive 4ee6922d2f6fd93e0261e5e8bed8758bcfcc5c01 release/affiliate-zentrale/current/affiliate-portal-router | tar -x -C /tmp/v672165
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/v672166/affiliate-portal-router
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          a=Path('/tmp/v672165/release/affiliate-zentrale/current/affiliate-portal-router')
          b=Path('/tmp/v672166/affiliate-portal-router')
          def h(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()
          rels=sorted(set(
              [p.relative_to(a).as_posix() for p in a.rglob('*') if p.is_file()] +
              [p.relative_to(b).as_posix() for p in b.rglob('*') if p.is_file()]
          ))
          changed=[r for r in rels if not (a/r).is_file() or not (b/r).is_file() or h(a/r)!=h(b/r)]
          expected=['includes/trait-ppar-ebay.php','pferdeportal-affiliate-router.php']
          print('CHANGED',changed)
          if changed != expected:
              raise SystemExit(f'FAIL unexpected 6.72.166 delta: {changed}')
          print('PASS exact two-file performance delta')
          PY

      - name: PHP syntax all current plugin files
        shell: bash
        run: |
          set -euo pipefail
          find release/affiliate-zentrale/current/affiliate-portal-router -type f -name '*.php' -print0 | xargs -0 -n1 php -l | tee /tmp/php-lint.log
          test "$(grep -c '^No syntax errors detected' /tmp/php-lint.log)" = "21"
          echo "PASS php lint 21/21"

      - name: 6.72.166 changed-path hard assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('release/affiliate-zentrale/current/affiliate-portal-router/includes/trait-ppar-ebay.php').read_text()
          def function_body(name):
              marker='function '+name+'('
              start=src.find(marker)
              if start < 0:
                  raise SystemExit('FAIL missing '+name)
              brace=src.find('{',start)
              depth=0
              for i in range(brace,len(src)):
                  if src[i]=='{': depth+=1
                  elif src[i]=='}':
                      depth-=1
                      if depth==0:
                          return src[brace+1:i]
              raise SystemExit('FAIL unclosed '+name)
          expand=function_body('ebay_expand_private_parent_listing_query')
          ceiling=function_body('ebay_enforce_private_visibility_ceiling')
          if expand.find('ebay_query_may_touch_listing_category') < 0 or expand.find('ebay_private_parent_term') < 0:
              raise SystemExit('FAIL expansion guard/term path missing')
          if expand.find('ebay_query_may_touch_listing_category') > expand.find('ebay_private_parent_term'):
              raise SystemExit('FAIL expansion expensive term resolution occurs before cheap gate')
          if ceiling.find('ebay_query_may_touch_listing_category') < 0:
              raise SystemExit('FAIL visibility cheap gate missing')
          if ceiling.count('ebay_query_listing_category_term_ids($query)') != 1:
              raise SystemExit('FAIL visibility category IDs not single-pass')
          projection='SELECT id,item_id,seller_account_type,creative_identity_hash,source_state,policy_state,route_state,item_end_at,source_payload,title,short_description'
          if src.count(projection) < 2:
              raise SystemExit('FAIL bounded source projection missing')
          prime=function_body('ebay_prime_business_campaign_source_row_cache')
          single=function_body('ebay_business_campaign_source_row')
          if 'SELECT *' in prime or 'SELECT *' in single:
              raise SystemExit('FAIL full-row BUSINESS source query remains')
          print('PASS early relevance gates')
          print('PASS single-pass listing-category resolution')
          print('PASS bounded BUSINESS source projection')
          PY

      - name: Existing provider and banner regressions
        shell: bash
        run: |
          set -euo pipefail
          bash AFFILIATE_HOBBYRAUM/run_otto_checks.sh
          php AFFILIATE_HOBBYRAUM/test_adcell_awin_otto_unchanged.php
          php AFFILIATE_HOBBYRAUM/test_banner_distribution_behavior.php

      - name: Install exact WordPress 7.1.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-site
          mkdir -p /tmp/wp-site
          /tmp/wp core download --path=/tmp/wp-site --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title='Affiliate 6.72.166 Full Gate' --admin_user=admin --admin_password='ci-password-123!' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp-site/wp-content/mu-plugins
          cat >/tmp/wp-site/wp-content/mu-plugins/ppar-hivepress-fixture.php <<'PHP'
          <?php
          add_action('init', static function(){
              if (!post_type_exists('hp_listing')) {
                  register_post_type('hp_listing', array('public'=>true,'label'=>'Listings'));
              }
              if (!taxonomy_exists('hp_listing_category')) {
                  register_taxonomy('hp_listing_category', array('hp_listing'), array('public'=>true,'hierarchical'=>true,'label'=>'Listing categories'));
              }
          }, 1);
          PHP

      - name: Build query-regression fixture
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/query-fixture.php <<'PHP'
          <?php
          if (!class_exists('Pferdeportal_Affiliate_Router')) { fwrite(STDERR,"FAIL plugin class missing\n"); exit(2); }
          if (!post_type_exists('hp_listing')) { register_post_type('hp_listing', array('public'=>true)); }
          if (!taxonomy_exists('hp_listing_category')) { register_taxonomy('hp_listing_category',array('hp_listing'),array('public'=>true,'hierarchical'=>true)); }
          $ensure_term = static function($name,$slug,$parent=0){
              $existing=get_term_by('slug',$slug,'hp_listing_category');
              if (is_object($existing)) return (int)$existing->term_id;
              $r=wp_insert_term($name,'hp_listing_category',array('slug'=>$slug,'parent'=>$parent));
              if (is_wp_error($r)) { fwrite(STDERR,"FAIL term ".$slug.": ".$r->get_error_message()."\n"); exit(2); }
              return (int)$r['term_id'];
          };
          $private=$ensure_term('Private Anzeigen','private-anzeigen');
          $child=$ensure_term('Private Kind','private-kind',$private);
          $other=$ensure_term('Andere Kategorie','andere-kategorie');

          $o=Pferdeportal_Affiliate_Router::instance();
          $snap=static function($q){
              return array(
                  'post_type'=>$q->get('post_type'),
                  'taxonomy'=>$q->get('taxonomy'),
                  'term'=>$q->get('term'),
                  'term_id'=>$q->get('term_id'),
                  'hp_listing_category'=>$q->get('hp_listing_category'),
                  'tax_query'=>$q->get('tax_query'),
                  'meta_query'=>$q->get('meta_query'),
                  'posts_per_page'=>$q->get('posts_per_page'),
                  'posts_per_archive_page'=>$q->get('posts_per_archive_page'),
                  'private_limit'=>$q->get('_ppar_ebay_private_public_limit'),
                  'ceiling'=>$q->get('_ppar_ebay_visibility_ceiling'),
                  'paged'=>$q->get('paged'),
                  'no_found_rows'=>$q->get('no_found_rows'),
              );
          };
          $make=static function($vars){
              $q=new WP_Query();
              foreach($vars as $k=>$v){ $q->set($k,$v); }
              return $q;
          };
          $run=static function($vars) use($make,$o,$snap){
              $q=$make($vars);
              $o->ebay_expand_private_parent_listing_query($q);
              $o->ebay_enforce_private_visibility_ceiling($q);
              return $snap($q);
          };
          $cases=array(
              'ordinary_page'=>$run(array('post_type'=>'page')),
              'ordinary_post'=>$run(array('post_type'=>'post')),
              'unrelated_taxonomy'=>$run(array('taxonomy'=>'category','term'=>'news')),
              'listing_general'=>$run(array('post_type'=>'hp_listing')),
              'private_parent'=>$run(array('post_type'=>'hp_listing','hp_listing_category'=>'private-anzeigen')),
              'private_child'=>$run(array('post_type'=>'hp_listing','hp_listing_category'=>'private-kind')),
              'other_listing_category'=>$run(array('post_type'=>'hp_listing','hp_listing_category'=>'andere-kategorie')),
              'listing_single'=>$run(array('post_type'=>'hp_listing','p'=>123)),
              'explicit_private_tax_query'=>$run(array('post_type'=>'hp_listing','tax_query'=>array(array('taxonomy'=>'hp_listing_category','field'=>'term_id','terms'=>array($private))))),
          );
          echo json_encode($cases, JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT), "\n";
          PHP

      - name: WordPress/MariaDB exact functional equivalence 6.72.165 -> 6.72.166
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/base-plugin
          mkdir -p /tmp/base-plugin
          git archive 4ee6922d2f6fd93e0261e5e8bed8758bcfcc5c01 release/affiliate-zentrale/current/affiliate-portal-router | tar -x -C /tmp/base-plugin
          cp -a /tmp/base-plugin/release/affiliate-zentrale/current/affiliate-portal-router /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-site
          /tmp/wp eval 'if (Pferdeportal_Affiliate_Router::VERSION !== "6.72.165") { exit(2); } echo "BASE_VERSION_PASS\n";' --path=/tmp/wp-site
          /tmp/wp eval-file /tmp/query-fixture.php --path=/tmp/wp-site > /tmp/base-query.json
          /tmp/wp plugin deactivate affiliate-portal-router --path=/tmp/wp-site
          rm -rf /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-site
          /tmp/wp eval 'if (Pferdeportal_Affiliate_Router::VERSION !== "6.72.166") { exit(2); } echo "CURRENT_VERSION_PASS\n";' --path=/tmp/wp-site
          /tmp/wp eval-file /tmp/query-fixture.php --path=/tmp/wp-site > /tmp/current-query.json
          diff -u /tmp/base-query.json /tmp/current-query.json
          echo "PASS WordPress/MariaDB query behavior byte-identical across all bound cases"

      - name: Product deals and partner analytics WordPress MariaDB gate
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/product-deals-analytics-gate.php <<'PHP'
          <?php
          $fail = static function($m){ fwrite(STDERR, "FAIL ".$m."\n"); exit(2); };
          $pass = static function($m){ echo "PASS ".$m."\n"; };

          if (!class_exists('PPAR_Partner_Analytics_Admin')) { $fail('partner analytics class missing'); }
          if (!class_exists('PPAR_Deal_Radar')) { $fail('deal radar class missing'); }

          $admin = get_user_by('login','admin');
          if (!$admin) { $fail('admin user missing'); }
          wp_set_current_user($admin->ID);

          $report = array(
            'source'=>'awin_advertiser_report',
            'currency'=>'EUR',
            'updated_at'=>time(),
            'periods'=>array(
              '30'=>array(
                'clicks'=>12,'orders'=>3,'sales'=>250.50,'commission'=>18.75,'conversion'=>25.0,
                'details'=>array(array(
                  'label'=>'OTTO Original','external_id'=>'14336','clicks'=>12,'orders'=>3,
                  'sales'=>250.50,'commission'=>18.75,'conversion'=>25.0,'currency'=>'EUR'
                ))
              )
            )
          );
          if (PPAR_Partner_Analytics_Admin::ingest_report('otto',$report) !== true) { $fail('OTTO report ingest'); }
          if (PPAR_Partner_Analytics_Admin::ingest_report('amazon',array(
            'source'=>'amazon_report','currency'=>'EUR','updated_at'=>time(),
            'periods'=>array('30'=>array('clicks'=>5))
          )) !== true) { $fail('Amazon partial report ingest'); }

          $providerReport = new ReflectionMethod('PPAR_Partner_Analytics_Admin','provider_report');
          $otto = $providerReport->invoke(null,'otto','30');
          if (($otto['clicks']??null)!==12 || ($otto['orders']??null)!==3
              || abs((float)($otto['sales']??0)-250.50)>0.0001
              || abs((float)($otto['commission']??0)-18.75)>0.0001
              || abs((float)($otto['conversion']??0)-25.0)>0.0001) {
              $fail('OTTO original report values changed');
          }
          $amazon = $providerReport->invoke(null,'amazon','30');
          if (($amazon['clicks']??null)!==5 || $amazon['orders']!==null || $amazon['sales']!==null
              || $amazon['commission']!==null || $amazon['conversion']!==null) {
              $fail('missing provider values must remain unavailable');
          }
          $providerKey = new ReflectionMethod('PPAR_Partner_Analytics_Admin','campaign_provider_key');
          if ($providerKey->invoke(null,array('network'=>'awin','advertiser_id'=>14336)) !== 'otto') {
              $fail('Awin advertiser 14336 must be shown as OTTO');
          }
          if ($providerKey->invoke(null,array('network'=>'awin','advertiser_id'=>99999)) !== 'awin') {
              $fail('other Awin advertiser identity');
          }
          $_GET['range']='30';
          ob_start();
          PPAR_Partner_Analytics_Admin::render_page();
          $html=(string)ob_get_clean();
          if (strpos($html,'Partner &amp; Einnahmen')===false
              || strpos($html,'über Awin-Advertiserreport')===false
              || strpos($html,'nicht verfügbar')===false) {
              $fail('partner analytics admin output contract');
          }
          $pass('partner analytics exact original numbers and unavailable values');

          global $wpdb;
          $table=$wpdb->prefix.'ppar_sync_products';
          if ((string)$wpdb->get_var($wpdb->prepare('SHOW TABLES LIKE %s',$table)) !== $table) {
              $fail('sync products table missing after plugin activation');
          }
          $wpdb->query($wpdb->prepare("DELETE FROM {$table} WHERE external_key LIKE %s",'full-gate-%'));
          $now=time();
          $rows=array(
            array('network'=>'awin','external_key'=>'full-gate-otto','programme_external_id'=>'14336','programme_name'=>'OTTO DE','title'=>'Uvex Reithelm Exxential III','price'=>'80.00'),
            array('network'=>'idealo','external_key'=>'full-gate-idealo','programme_external_id'=>'','programme_name'=>'idealo','title'=>'Uvex Reithelm Exxential III','price'=>'120.00'),
            array('network'=>'ebay','external_key'=>'full-gate-ebay','programme_external_id'=>'','programme_name'=>'eBay','title'=>'Uvex Reithelm Exxential III','price'=>'130.00'),
            array('network'=>'idealo','external_key'=>'full-gate-bag','programme_external_id'=>'','programme_name'=>'idealo','title'=>'Reithelm Tasche für Uvex Helm','price'=>'10.00'),
          );
          foreach($rows as $row){
              $key=$row['external_key'];
              $ok=$wpdb->insert($table,array(
                'network'=>$row['network'],
                'external_key'=>$key,
                'programme_external_id'=>$row['programme_external_id'],
                'programme_name'=>$row['programme_name'],
                'title'=>$row['title'],
                'image_url'=>'https://example.com/'.$key.'.jpg',
                'tracking_url'=>'https://example.com/go/'.$key,
                'destination_url'=>'https://example.com/p/'.$key,
                'price'=>$row['price'],
                'currency'=>'EUR',
                'brand'=>'Uvex',
                'category'=>'Reithelme',
                'quality_status'=>'pass',
                'source_hash'=>hash('sha256',$key),
                'source_headers'=>'{}',
                'payload'=>json_encode(array('ean'=>'4000000000001')),
                'first_seen'=>$now-300,
                'last_seen'=>$now,
              ));
              if ($ok===false) { $fail('insert deal fixture '.$key.': '.$wpdb->last_error); }
          }

          delete_option(PPAR_Deal_Radar::OPTION_HISTORY);
          delete_option(PPAR_Deal_Radar::OPTION_STATE);
          delete_transient('ppar_deal_best_reithelm_v1');
          $state=PPAR_Deal_Radar::refresh();
          $best=is_array($state['best']??null)?$state['best']:array();
          if ((int)($state['candidate_count']??-1)!==3) { $fail('accessory exclusion candidate count'); }
          if (!$best || ($best['provider']??'')!=='otto' || abs((float)($best['price']??0)-80.0)>0.0001) {
              $fail('best Reithelm deal selection');
          }
          if (($best['evidence_basis']??'')!=='Marktvergleich'
              || (float)($best['saving_eur']??0)<15
              || (float)($best['discount_pct']??0)<18) {
              $fail('deal evidence threshold');
          }
          $stored=get_option(PPAR_Deal_Radar::OPTION_STATE,array());
          if (!is_array($stored) || (($stored['best']['offer_key']??'') !== ($best['offer_key']??''))) {
              $fail('deal state MariaDB persistence');
          }
          PPAR_Deal_Radar::ensure_schedule();
          if (!wp_next_scheduled(PPAR_Deal_Radar::CRON_HOOK)) { $fail('deal radar schedule missing'); }
          $pass('Reithelm positive deal selected from real MariaDB rows');
          $pass('Reithelm accessory negative excluded');
          $pass('deal state persisted and schedule active');

          echo "PRODUCT_DEALS_PARTNER_ANALYTICS_WORDPRESS_MARIADB_PASS\n";
          PHP
          /tmp/wp eval-file /tmp/product-deals-analytics-gate.php --path=/tmp/wp-site | tee /tmp/product-deals-analytics-gate.txt
          grep -F 'PRODUCT_DEALS_PARTNER_ANALYTICS_WORDPRESS_MARIADB_PASS' /tmp/product-deals-analytics-gate.txt

      - name: Manual single-upload importer WordPress MariaDB gate
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/manual-import-gate.php <<'PHP'
          <?php
          $fail = static function($m){ fwrite(STDERR, "FAIL ".$m."\n"); exit(2); };
          $pass = static function($m){ echo "PASS ".$m."\n"; };
          if (!class_exists('PPAR_Affiliate_Admin_KISS')) { $fail('KISS importer class missing'); }

          $key='full-gate-ds24-key';
          update_option('ppar_network_digistore24_v1',array(
              'api_key'=>$key,
              'tested_key_fingerprint'=>hash('sha256',$key),
              'affiliate_id'=>'full-gate-affiliate'
          ),false);

          $detect = new ReflectionMethod('PPAR_Affiliate_Admin_KISS','detect_provider');
          $import = new ReflectionMethod('PPAR_Affiliate_Admin_KISS','import_digistore24_partnerships');

          $csv="Vendor;Produkt-ID;Produkt;Werbemittel-ID;Status der Partnerschaft;Provision\n"
              ."Vendor A;1001;Produkt A;420875;Genehmigt;20%\n"
              ."Vendor B;1002;Produkt B;43923;Approved;30%\n"
              ."Vendor B;1003;Produkt C;314918;Genehmigt;25%\n"
              ."Vendor X;9999;Nicht genehmigt;999999;Abgelehnt;99%\n";
          $det=$detect->invoke(null,'partnerschaften.csv',$csv);
          if (!is_array($det) || ($det['kind']??'')!=='digistore24_partnerships') { $fail('DS24 exact header detection'); }

          $tmp=tempnam(sys_get_temp_dir(),'ds24-full-gate-');
          file_put_contents($tmp,$csv);
          $res=$import->invoke(null,$tmp,'partnerschaften.csv');
          @unlink($tmp);
          if (is_wp_error($res)) { $fail('DS24 import: '.$res->get_error_message()); }
          if (($res['status']??'')!=='success' || (int)($res['product_count']??0)!==3
              || (int)($res['source_count']??0)!==3 || (int)($res['vendor_count']??0)!==2) {
              $fail('DS24 import result counts');
          }

          $inventory=get_option(PPAR_Affiliate_Admin_KISS::DS24_INVENTORY_OPTION,array());
          $market=get_option(PPAR_Affiliate_Admin_KISS::DS24_MARKETPLACE_OPTION,array());
          $partnerships=get_option('ppar_digistore24_partnerships_v1',array());
          $affiliations=get_option('ppar_digistore24_affiliations_v1',array());
          if ((int)($inventory['product_count']??0)!==3 || (int)($inventory['blocked']??0)!==1) { $fail('inventory persistence'); }
          if (count((array)($market['items']??array()))!==3) { $fail('marketplace persistence'); }
          if (count((array)$partnerships)!==3 || count((array)$affiliations)!==3) { $fail('partnership/affiliation persistence'); }
          $pass('DS24 import persists exact approved rows and blocks rejected row');

          $tmp=tempnam(sys_get_temp_dir(),'ds24-full-gate-');
          file_put_contents($tmp,$csv);
          $res2=$import->invoke(null,$tmp,'partnerschaften.csv');
          @unlink($tmp);
          if (is_wp_error($res2) || (int)($res2['product_count']??0)!==3
              || count((array)(get_option('ppar_digistore24_affiliations_v1',array())))!==3) {
              $fail('idempotent reimport');
          }
          $pass('DS24 reimport is idempotent');

          $before=hash('sha256',serialize(array(
              get_option(PPAR_Affiliate_Admin_KISS::DS24_INVENTORY_OPTION,array()),
              get_option(PPAR_Affiliate_Admin_KISS::DS24_MARKETPLACE_OPTION,array()),
              get_option('ppar_digistore24_partnerships_v1',array()),
              get_option('ppar_digistore24_affiliations_v1',array())
          )));
          $dup="Vendor;Produkt-ID;Produkt;Werbemittel-ID;Status der Partnerschaft;Provision\n"
              ."Vendor A;1001;Produkt A;420875;Genehmigt;20%\n"
              ."Vendor A;1001;Produkt B;43923;Genehmigt;20%\n";
          $tmp=tempnam(sys_get_temp_dir(),'ds24-full-gate-');
          file_put_contents($tmp,$dup);
          $bad=$import->invoke(null,$tmp,'partnerschaften.csv');
          @unlink($tmp);
          if (!is_wp_error($bad) || $bad->get_error_code()!=='ds24_csv_product_id_duplicate') { $fail('duplicate product must fail closed'); }
          $after=hash('sha256',serialize(array(
              get_option(PPAR_Affiliate_Admin_KISS::DS24_INVENTORY_OPTION,array()),
              get_option(PPAR_Affiliate_Admin_KISS::DS24_MARKETPLACE_OPTION,array()),
              get_option('ppar_digistore24_partnerships_v1',array()),
              get_option('ppar_digistore24_affiliations_v1',array())
          )));
          if (!hash_equals($before,$after)) { $fail('failed import mutated persisted inventory'); }
          $pass('duplicate DS24 product fails closed with no data mutation');

          $cases=array(
              'awin'=>array('creative.csv',"name,url\nBanner,https://www.awin1.com/cread.php?x=1\n",'awin_creatives'),
              'adcell'=>array('creative.csv',"name,url\nBanner,https://t.adcell.com/click.php?x=1\n",'adcell_creatives'),
              'ebay'=>array('ebay.csv',"item_id,url\n123,https://www.ebay.de/itm/123?epn=1\n",'ebay_detected'),
              'idealo'=>array('productdata_123.csv',"id,product_title,product_deeplink,ean,gtins_product,asins_product,main_category,sub_category,brand_name,image_url\n1,Helm,https://example.com/x,4000000000001,4000000000001,,Reiten,Helme,Uvex,https://example.com/i.jpg\n",'idealo_feed')
          );
          foreach($cases as $label=>$row){
              $got=$detect->invoke(null,$row[0],$row[1]);
              if (!is_array($got) || ($got['kind']??'')!==$row[2]) { $fail($label.' provider detection'); }
          }
          $amb=$detect->invoke(null,'mixed.txt',"https://www.awin1.com/x\nhttps://t.adcell.com/x\n");
          if (!is_wp_error($amb) || $amb->get_error_code()!=='universal_import_ambiguous') { $fail('ambiguous provider must fail closed'); }
          $unknown=$detect->invoke(null,'unknown.txt',"nichts eindeutig erkennbar\n");
          if (!is_wp_error($unknown) || $unknown->get_error_code()!=='universal_import_unknown') { $fail('unknown provider must fail closed'); }
          $pass('multi-provider detection positive and ambiguous/unknown negative');

          echo "MANUAL_SINGLE_UPLOAD_WORDPRESS_MARIADB_PASS\n";
          PHP
          /tmp/wp eval-file /tmp/manual-import-gate.php --path=/tmp/wp-site | tee /tmp/manual-import-gate.txt
          grep -F 'MANUAL_SINGLE_UPLOAD_WORDPRESS_MARIADB_PASS' /tmp/manual-import-gate.txt

      - name: Build and fresh-verify one 6.72.166 installer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/installer-build /tmp/installer-unpack
          mkdir -p /tmp/installer-build /tmp/installer-unpack
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile

          repo=Path('.')
          source=repo/'release/affiliate-zentrale/current'
          manifest=repo/'release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt'
          out=Path('/tmp/AFFILIATE_ZENTRALE_6.72.166.zip')

          rows=[]
          for raw in manifest.read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              digest, rel = raw.split(None,1)
              rel=rel.strip()
              rows.append((digest,rel))
          if len(rows)!=27:
              raise SystemExit(f'FAIL manifest rows {len(rows)} != 27')

          if out.exists():
              out.unlink()
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for digest,rel in sorted(rows,key=lambda x:x[1]):
                  p=source/rel
                  data=p.read_bytes()
                  got=hashlib.sha256(data).hexdigest()
                  if got!=digest:
                      raise SystemExit(f'FAIL source hash {rel}: {got} != {digest}')
                  zi=zipfile.ZipInfo(rel)
                  zi.date_time=(2026,9,29,0,0,0)
                  zi.compress_type=zipfile.ZIP_DEFLATED
                  zi.external_attr=0o100644 << 16
                  z.writestr(zi,data)

          zip_sha=hashlib.sha256(out.read_bytes()).hexdigest()
          Path('/tmp/installer.sha256').write_text(zip_sha+'  AFFILIATE_ZENTRALE_6.72.166.zip\n',encoding='utf-8')

          with zipfile.ZipFile(out) as z:
              names=sorted(n for n in z.namelist() if not n.endswith('/'))
              expected=sorted(rel for _,rel in rows)
              if names!=expected:
                  raise SystemExit('FAIL ZIP file list differs from source manifest')
              for digest,rel in rows:
                  data=z.read(rel)
                  got=hashlib.sha256(data).hexdigest()
                  if got!=digest:
                      raise SystemExit(f'FAIL ZIP byte identity {rel}: {got} != {digest}')
          print('INSTALLER_FILE_COUNT_PASS 27')
          print('SOURCE_ZIP_BYTE_IDENTITY_PASS 27_OF_27')
          print('INSTALLER_SHA256 '+zip_sha)
          PY
          unzip -q /tmp/AFFILIATE_ZENTRALE_6.72.166.zip -d /tmp/installer-unpack
          find /tmp/installer-unpack/affiliate-portal-router -type f -name '*.php' -print0 | xargs -0 -n1 php -l | tee /tmp/installer-php-lint.log
          test "$(grep -c '^No syntax errors detected' /tmp/installer-php-lint.log)" = "21"
          grep -F "Version: 6.72.166" /tmp/installer-unpack/affiliate-portal-router/pferdeportal-affiliate-router.php
          grep -F "const VERSION = '6.72.166';" /tmp/installer-unpack/affiliate-portal-router/pferdeportal-affiliate-router.php
          unzip -t /tmp/AFFILIATE_ZENTRALE_6.72.166.zip | tee /tmp/installer-unzip-test.log
          echo "FRESH_UNPACK_PASS"
          cat /tmp/installer.sha256

      - name: Current plugin frontend smoke
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8080 -t /tmp/wp-site >/tmp/wp-server.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/tmp/front.html; then break; fi
            sleep 1
          done
          test -s /tmp/front.html
          ! grep -Eqi 'Fatal error|Uncaught Error|Parse error' /tmp/front.html
          echo "PASS current frontend smoke"


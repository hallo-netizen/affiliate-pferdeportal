name: Affiliate Router 6.72.167 eBay KISS Full Release Gate

on:
  push:
    branches: [affiliate-release-current]
    paths:
      - '.github/workflows/affiliate-router-cleanup-combined.yml'
      - 'AFFILIATE_HOBBYRAUM/test_otto_automation.php'
      - 'AFFILIATE_HOBBYRAUM/test_adcell_awin_otto_unchanged.php'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  combined-contract:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Governance and exact 6.72.167 source binding
        shell: bash
        run: |
          set -euo pipefail
          python3 control/release-governance/release_guard.py governance-check
          python3 control/release-governance/release_guard.py source-check
          python3 control/release-governance/release_guard.py start --branch affiliate-release-current
          grep -F "Version: 6.72.167" release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php
          grep -F "const VERSION = '6.72.167';" release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php
          test "$(grep -cve '^[[:space:]]*$' release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt)" = "27"
          echo "PASS exact source-bound 6.72.167"

      - name: Exact delta versus proven 6.72.166
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v672166 /tmp/v672167
          mkdir -p /tmp/v672166 /tmp/v672167
          git archive 40f9575041bc3d9aa7494215cfdccd84eca43667 release/affiliate-zentrale/current/affiliate-portal-router | tar -x -C /tmp/v672166
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/v672167/affiliate-portal-router
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          a=Path('/tmp/v672166/release/affiliate-zentrale/current/affiliate-portal-router')
          b=Path('/tmp/v672167/affiliate-portal-router')
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          rels=sorted(set(
              [p.relative_to(a).as_posix() for p in a.rglob('*') if p.is_file()] +
              [p.relative_to(b).as_posix() for p in b.rglob('*') if p.is_file()]
          ))
          changed=[r for r in rels if not (a/r).is_file() or not (b/r).is_file() or h(a/r)!=h(b/r)]
          expected=sorted([
              'includes/trait-ppar-ebay-run.php',
              'includes/trait-ppar-ebay.php',
              'includes/trait-ppar-housekeeping.php',
              'includes/trait-ppar-provider-registry.php',
              'pferdeportal-affiliate-router.php',
              'readme.txt',
          ])
          print('CHANGED',changed)
          if changed != expected:
              raise SystemExit(f'FAIL unexpected 6.72.167 delta: {changed}')
          print('PASS exact eBay KISS/storage cleanup delta')
          PY

      - name: PHP syntax all current plugin files
        shell: bash
        run: |
          set -euo pipefail
          find release/affiliate-zentrale/current/affiliate-portal-router -type f -name '*.php' -print0 | xargs -0 -n1 php -l | tee /tmp/php-lint.log
          test "$(grep -c '^No syntax errors detected' /tmp/php-lint.log)" = "21"
          echo "PASS php lint 21/21"

      - name: 6.72.167 eBay KISS hard assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          root=Path('release/affiliate-zentrale/current/affiliate-portal-router')
          ebay=(root/'includes/trait-ppar-ebay.php').read_text()
          run=(root/'includes/trait-ppar-ebay-run.php').read_text()
          provider=(root/'includes/trait-ppar-provider-registry.php').read_text()
          hk=(root/'includes/trait-ppar-housekeeping.php').read_text()
          main=(root/'pferdeportal-affiliate-router.php').read_text()

          old_names=[
            'maybe_recover_ebay_build_change_checkpoint_same_uuid_v6636',
            'maybe_adopt_stalled_zero_tick_ebay_run_v6638',
            'maybe_migrate_ebay_worker_transport_v6412',
            'maybe_migrate_ebay_progress_contract_v6421',
            'maybe_migrate_ebay_partial_checkpoint_v6430',
            'maybe_migrate_ebay_business_materialization_v6440',
            'maybe_migrate_ebay_public_freshness_v6460',
            'maybe_migrate_ebay_dynamic_business_rule_context_v6470',
            'maybe_migrate_ebay_public_coverage_target_v6490',
            'maybe_migrate_ebay_safe_supply_gap_v6500',
            'maybe_recover_ebay_false_no_progress_v6420',
            'ebay_run_legacy_raw_states',
            'ebay_run_adopt_legacy_if_needed',
            'maybe_recover_ebay_private_public_freshness_v6635',
            'maybe_recover_ebay_private_public_gate_v6630',
            'maybe_recover_ebay_business_gap_proof_v6634',
            'ebay_run_bootstrap_recovered_external_tick_v6632',
            'maybe_retire_deprecated_ebay_recovery_transports',
            'ensure_ebay_selection_recovery_schedule',
            'maybe_migrate_ebay_private_flat_structure',
            'ebay_business_local_recovery_verified',
          ]
          for name in old_names:
              if name in main or name in run or name in ebay:
                  raise SystemExit('FAIL obsolete eBay compatibility symbol remains: '+name)

          required=[
            'maybe_retire_legacy_terminal_ebay_run_v672167',
            'maybe_close_incompatible_ebay_run_for_checkpoint_restart',
            'ebay_run_commit_public_checkpoint',
            'ebay_public_checkpoint_bootstrap',
            'ebay_run_business_safe_supply_gap_contract',
            'business_gapfill_public_invariant_failed',
          ]
          for name in required:
              if name not in run and name not in main:
                  raise SystemExit('FAIL missing current safety path: '+name)

          if "ebay_access_token($settings, true, false)" not in provider:
              raise SystemExit('FAIL provider OAuth test still channel-pause coupled')
          if "ebay_access_token($settings, $force = false, $respect_channel_pause = true)" not in ebay:
              raise SystemExit('FAIL runtime pause-default missing')
          if "$respect_channel_pause && method_exists($this, 'provider_channel_pause_gate')" not in ebay:
              raise SystemExit('FAIL runtime pause gate missing')

          terminal_sql="source_state='ended' AND status='purged_ended' AND listing_post_id=0 AND output_state='inactive'"
          if terminal_sql not in hk:
              raise SystemExit('FAIL exact terminal housekeeping shape missing')
          if "$ebay_ended_cutoff = $now - 7 * DAY_IN_SECONDS" not in hk:
              raise SystemExit('FAIL 7-day ended retention missing')

          # Preserve the already-proven 6.72.166 frontend/query performance changes.
          def body(src,name):
              marker='function '+name+'('
              start=src.find(marker)
              if start<0: raise SystemExit('FAIL missing function '+name)
              brace=src.find('{',start); depth=0; state='code'; esc=False
              i=brace
              while i<len(src):
                  c=src[i]; n=src[i+1] if i+1<len(src) else ''
                  if state=='sq':
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": state='code'
                  elif state=='dq':
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': state='code'
                  elif state=='line':
                      if c=='\n': state='code'
                  elif state=='block':
                      if c=='*' and n=='/': state='code'; i+=1
                  else:
                      if c=="'": state='sq'
                      elif c=='"': state='dq'
                      elif c=='/' and n=='/': state='line'; i+=1
                      elif c=='#': state='line'
                      elif c=='/' and n=='*': state='block'; i+=1
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0: return src[start:i+1]
                  i+=1
              raise SystemExit('FAIL unclosed '+name)

          expand=body(ebay,'ebay_expand_private_parent_listing_query')
          ceiling=body(ebay,'ebay_enforce_private_visibility_ceiling')
          if expand.find('ebay_query_may_touch_listing_category')<0 or expand.find('ebay_private_parent_term')<0:
              raise SystemExit('FAIL 6.72.166 expansion performance guard lost')
          if expand.find('ebay_query_may_touch_listing_category')>expand.find('ebay_private_parent_term'):
              raise SystemExit('FAIL expensive term resolution precedes cheap gate')
          if ceiling.count('ebay_query_listing_category_term_ids($query)')!=1:
              raise SystemExit('FAIL single-pass listing category resolution lost')
          projection='SELECT id,item_id,seller_account_type,creative_identity_hash,source_state,policy_state,route_state,item_end_at,source_payload,title,short_description'
          if ebay.count(projection)<2:
              raise SystemExit('FAIL 6.72.166 bounded source projection lost')

          # Critical current eBay workflow/business/public-gate bodies must remain
          # byte-identical to 6.72.166; only obsolete recovery/status plumbing may differ.
          base=subprocess.check_output([
              'git','show',
              '40f9575041bc3d9aa7494215cfdccd84eca43667:release/affiliate-zentrale/current/affiliate-portal-router/includes/trait-ppar-ebay-run.php'
          ],text=True)
          critical=[
              'ebay_run_commit_public_checkpoint',
              'ebay_run_complete',
              'ebay_run_tick_selection',
              'ebay_run_public_business_coverage',
              'ebay_run_business_safe_supply_gap_contract',
              'ebay_run_tick_coverage',
              'ebay_run_tick_gapfill',
              'ebay_run_tick_checkpoint_cleanup',
              'run_ebay_canonical_worker',
          ]
          for name in critical:
              if body(base,name)!=body(run,name):
                  raise SystemExit('FAIL critical eBay core changed unexpectedly: '+name)

          print('PASS obsolete recovery/compatibility code absent')
          print('PASS OAuth-test/runtime-pause separation')
          print('PASS bounded 7-day terminal eBay housekeeping')
          print('PASS 6.72.166 performance paths preserved')
          print('PASS critical eBay workflow/coverage/public-gate core byte-identical')
          PY

      - name: Existing provider and banner regressions
        shell: bash
        run: |
          set -euo pipefail
          bash AFFILIATE_HOBBYRAUM/run_otto_checks.sh
          php AFFILIATE_HOBBYRAUM/test_adcell_awin_otto_unchanged.php
          php AFFILIATE_HOBBYRAUM/test_banner_distribution_behavior.php

      - name: Install exact WordPress 7.1.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-site
          mkdir -p /tmp/wp-site
          /tmp/wp core download --path=/tmp/wp-site --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title='Affiliate 6.72.167 Full Gate' --admin_user=admin --admin_password='ci-password-123!' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp-site/wp-content/mu-plugins
          cat >/tmp/wp-site/wp-content/mu-plugins/ppar-hivepress-fixture.php <<'PHP'
          <?php
          add_action('init', static function(){
              if (!post_type_exists('hp_listing')) {
                  register_post_type('hp_listing', array('public'=>true,'label'=>'Listings'));
              }
              if (!taxonomy_exists('hp_listing_category')) {
                  register_taxonomy('hp_listing_category', array('hp_listing'), array('public'=>true,'hierarchical'=>true,'label'=>'Listing categories'));
              }
          }, 1);
          PHP

      - name: Build query-regression fixture
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/query-fixture.php <<'PHP'
          <?php
          if (!class_exists('Pferdeportal_Affiliate_Router')) { fwrite(STDERR,"FAIL plugin class missing\n"); exit(2); }
          if (!post_type_exists('hp_listing')) { register_post_type('hp_listing', array('public'=>true)); }
          if (!taxonomy_exists('hp_listing_category')) { register_taxonomy('hp_listing_category',array('hp_listing'),array('public'=>true,'hierarchical'=>true)); }
          $ensure_term = static function($name,$slug,$parent=0){
              $existing=get_term_by('slug',$slug,'hp_listing_category');
              if (is_object($existing)) return (int)$existing->term_id;
              $r=wp_insert_term($name,'hp_listing_category',array('slug'=>$slug,'parent'=>$parent));
              if (is_wp_error($r)) { fwrite(STDERR,"FAIL term ".$slug.": ".$r->get_error_message()."\n"); exit(2); }
              return (int)$r['term_id'];
          };
          $private=$ensure_term('Private Anzeigen','private-anzeigen');
          $child=$ensure_term('Private Kind','private-kind',$private);
          $other=$ensure_term('Andere Kategorie','andere-kategorie');

          $o=Pferdeportal_Affiliate_Router::instance();
          $snap=static function($q){
              return array(
                  'post_type'=>$q->get('post_type'),
                  'taxonomy'=>$q->get('taxonomy'),
                  'term'=>$q->get('term'),
                  'term_id'=>$q->get('term_id'),
                  'hp_listing_category'=>$q->get('hp_listing_category'),
                  'tax_query'=>$q->get('tax_query'),
                  'meta_query'=>$q->get('meta_query'),
                  'posts_per_page'=>$q->get('posts_per_page'),
                  'posts_per_archive_page'=>$q->get('posts_per_archive_page'),
                  'private_limit'=>$q->get('_ppar_ebay_private_public_limit'),
                  'ceiling'=>$q->get('_ppar_ebay_visibility_ceiling'),
                  'paged'=>$q->get('paged'),
                  'no_found_rows'=>$q->get('no_found_rows'),
              );
          };
          $make=static function($vars){
              $q=new WP_Query();
              foreach($vars as $k=>$v){ $q->set($k,$v); }
              return $q;
          };
          $run=static function($vars) use($make,$o,$snap){
              $q=$make($vars);
              $o->ebay_expand_private_parent_listing_query($q);
              $o->ebay_enforce_private_visibility_ceiling($q);
              return $snap($q);
          };
          $cases=array(
              'ordinary_page'=>$run(array('post_type'=>'page')),
              'ordinary_post'=>$run(array('post_type'=>'post')),
              'unrelated_taxonomy'=>$run(array('taxonomy'=>'category','term'=>'news')),
              'listing_general'=>$run(array('post_type'=>'hp_listing')),
              'private_parent'=>$run(array('post_type'=>'hp_listing','hp_listing_category'=>'private-anzeigen')),
              'private_child'=>$run(array('post_type'=>'hp_listing','hp_listing_category'=>'private-kind')),
              'other_listing_category'=>$run(array('post_type'=>'hp_listing','hp_listing_category'=>'andere-kategorie')),
              'listing_single'=>$run(array('post_type'=>'hp_listing','p'=>123)),
              'explicit_private_tax_query'=>$run(array('post_type'=>'hp_listing','tax_query'=>array(array('taxonomy'=>'hp_listing_category','field'=>'term_id','terms'=>array($private))))),
          );
          echo json_encode($cases, JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT), "\n";
          PHP

      - name: WordPress/MariaDB frontend equivalence 6.72.166 -> 6.72.167
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/base-plugin
          mkdir -p /tmp/base-plugin
          git archive 40f9575041bc3d9aa7494215cfdccd84eca43667 release/affiliate-zentrale/current/affiliate-portal-router | tar -x -C /tmp/base-plugin
          cp -a /tmp/base-plugin/release/affiliate-zentrale/current/affiliate-portal-router /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-site
          /tmp/wp eval 'if (Pferdeportal_Affiliate_Router::VERSION !== "6.72.166") { exit(2); } echo "BASE_VERSION_PASS\n";' --path=/tmp/wp-site
          /tmp/wp eval-file /tmp/query-fixture.php --path=/tmp/wp-site > /tmp/base-query.json
          /tmp/wp plugin deactivate affiliate-portal-router --path=/tmp/wp-site
          rm -rf /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-site
          /tmp/wp eval 'if (Pferdeportal_Affiliate_Router::VERSION !== "6.72.167") { exit(2); } echo "CURRENT_VERSION_PASS\n";' --path=/tmp/wp-site
          /tmp/wp eval-file /tmp/query-fixture.php --path=/tmp/wp-site > /tmp/current-query.json
          diff -u /tmp/base-query.json /tmp/current-query.json
          echo "PASS WordPress/MariaDB frontend query behavior byte-identical across all bound cases"

      - name: eBay KISS and storage WordPress MariaDB positive-negative gate
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/ebay-kiss-storage-gate.php <<'PHP'
          <?php
          $fail = static function($m){ fwrite(STDERR, "FAIL ".$m."\n"); exit(2); };
          $pass = static function($m){ echo "PASS ".$m."\n"; };
          $router = Pferdeportal_Affiliate_Router::instance();

          $admin = get_user_by('login','admin');
          if (!$admin) { $fail('admin user missing'); }
          wp_set_current_user($admin->ID);

          // 1) Old terminal status: same runtime-build string as the historical
          // 16.09 failure, but older than one day -> archive + clear current.
          delete_option(Pferdeportal_Affiliate_Router::OPTION_EBAY_RUN_HISTORY);
          $old = array(
              'schema'=>'1.0','status'=>'failed','phase'=>'failed',
              'run_uuid'=>'ci-old-terminal','build'=>Pferdeportal_Affiliate_Router::EBAY_RUNTIME_BUILD,
              'error_code'=>'business_gapfill_public_invariant_failed',
              'started_at'=>time()-3*DAY_IN_SECONDS,
              'last_progress_at'=>time()-2*DAY_IN_SECONDS,
              'finished_at'=>time()-2*DAY_IN_SECONDS,
          );
          update_option(Pferdeportal_Affiliate_Router::OPTION_EBAY_RUN_STATE,$old,false);
          $router->maybe_retire_legacy_terminal_ebay_run_v672167();
          if (get_option(Pferdeportal_Affiliate_Router::OPTION_EBAY_RUN_STATE,null)!==null) { $fail('old terminal run still current'); }
          $hist=get_option(Pferdeportal_Affiliate_Router::OPTION_EBAY_RUN_HISTORY,array());
          if (count($hist)!==1 || ($hist[0]['run_uuid']??'')!=='ci-old-terminal') { $fail('old terminal history'); }
          $pass('old terminal run archived and removed from current status');

          // 2) Recent terminal diagnostic remains visible.
          $recent=$old;
          $recent['run_uuid']='ci-recent-terminal';
          $recent['started_at']=time()-2*HOUR_IN_SECONDS;
          $recent['last_progress_at']=time()-HOUR_IN_SECONDS;
          $recent['finished_at']=time()-HOUR_IN_SECONDS;
          update_option(Pferdeportal_Affiliate_Router::OPTION_EBAY_RUN_STATE,$recent,false);
          $router->maybe_retire_legacy_terminal_ebay_run_v672167();
          $still=get_option(Pferdeportal_Affiliate_Router::OPTION_EBAY_RUN_STATE,array());
          if (($still['run_uuid']??'')!=='ci-recent-terminal') { $fail('recent terminal diagnostic was removed'); }
          $pass('recent terminal diagnostic retained');

          // 3) Open/running work must never be retired by terminal housekeeping.
          $running=$old;
          $running['status']='running'; $running['phase']='refresh_remote'; $running['run_uuid']='ci-running';
          update_option(Pferdeportal_Affiliate_Router::OPTION_EBAY_RUN_STATE,$running,false);
          $router->maybe_retire_legacy_terminal_ebay_run_v672167();
          $still=get_option(Pferdeportal_Affiliate_Router::OPTION_EBAY_RUN_STATE,array());
          if (($still['run_uuid']??'')!=='ci-running' || ($still['status']??'')!=='running') { $fail('running run mutated by terminal retirement'); }
          $pass('running run protected');

          // 4) Connectivity test bypasses only the quick channel pause. Runtime
          // token access remains fail-closed on the same pause.
          delete_option(Pferdeportal_Affiliate_Router::OPTION_EBAY_RUN_STATE);
          $settings=get_option(Pferdeportal_Affiliate_Router::OPTION_NETWORK_EBAY,array());
          $settings=is_array($settings)?$settings:array();
          $settings['environment']='sandbox';
          $settings['client_id']='ci-client';
          $settings['client_secret']='ci-secret';
          $settings['epn_campaign_id']='1234567890';
          $settings['marketplace_id']='EBAY_DE';
          $settings['enabled']=1;
          update_option(Pferdeportal_Affiliate_Router::OPTION_NETWORK_EBAY,$settings,false);
          $router->provider_channel_set_paused('ebay',true,'CI pause');

          add_filter('pre_http_request',static function($pre,$args,$url){
              if (strpos((string)$url,'/identity/v1/oauth2/token')!==false) {
                  return array(
                      'headers'=>array(),
                      'body'=>wp_json_encode(array('access_token'=>'ci-ebay-token','expires_in'=>7200)),
                      'response'=>array('code'=>200,'message'=>'OK'),
                      'cookies'=>array(),
                  );
              }
              return $pre;
          },10,3);

          $m=new ReflectionMethod($router,'provider_test_access'); $m->setAccessible(true);
          $tested=$m->invoke($router,'ebay');
          if (is_wp_error($tested) || ($tested['status']??'')!=='connected') { $fail('paused-channel OAuth connectivity test'); }

          $tokenMethod=new ReflectionMethod($router,'ebay_access_token'); $tokenMethod->setAccessible(true);
          $runtimeToken=$tokenMethod->invoke($router,$settings,true,true);
          if (!is_wp_error($runtimeToken) || $runtimeToken->get_error_code()!=='provider_channel_paused') { $fail('runtime pause gate'); }
          $pass('OAuth test independent; runtime pause remains fail-closed');
          $router->provider_channel_set_paused('ebay',false,'CI resume');

          // 5) Real MariaDB terminal-payload compaction boundaries.
          $router->maybe_install_ebay_schema();
          $tableMethod=new ReflectionMethod($router,'ebay_items_table'); $tableMethod->setAccessible(true);
          $table=$tableMethod->invoke($router);
          global $wpdb;
          $wpdb->query("TRUNCATE TABLE {$table}");
          $insert=static function($item_id,$overrides=array()) use ($wpdb,$table,$fail) {
              $now=time();
              $row=array(
                  'portal_key'=>'ci','item_id'=>$item_id,'legacy_item_id'=>'',
                  'seller_account_type'=>'BUSINESS','seller_username'=>'seller',
                  'route_mode'=>'business','rule_id'=>'ci-rule','target_term_id'=>0,
                  'listing_post_id'=>0,'creative_identity_hash'=>'',
                  'title'=>'CI item','short_description'=>'keep-description',
                  'condition_text'=>'Neu','price_value'=>'10.00','currency'=>'EUR',
                  'shipping_value'=>'0','location_text'=>'DE',
                  'affiliate_url'=>'https://example.test/a','item_web_url'=>'https://example.test/i',
                  'image_url'=>'https://i.ebayimg.com/images/g/test.jpg','item_end_at'=>0,
                  'source_hash'=>hash('sha256',$item_id),'source_payload'=>wp_json_encode(array('raw'=>str_repeat('x',2000))),
                  'status'=>'active','source_state'=>'available','policy_state'=>'allowed','route_state'=>'ready',
                  'output_state'=>'creative_pending','policy_version'=>'ci','classifier_version'=>'ci',
                  'source_checked_at'=>$now,'rejection_reason'=>'','last_seen'=>$now,'fresh_until'=>$now+3600,
                  'created_at'=>$now,'updated_at'=>$now,
              );

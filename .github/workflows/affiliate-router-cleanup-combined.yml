        uses: actions/upload-artifact@v4
        with:
          name: affiliate-router-672166-combined-full-gate
          path: |
            /tmp/php-lint.log
            /tmp/base-query.json
            /tmp/current-query.json
            /tmp/product-deals-analytics-gate.txt
            /tmp/manual-import-gate.txt
            /tmp/AFFILIATE_ZENTRALE_6.72.166.zip
            /tmp/installer.sha256
            /tmp/installer-php-lint.log
            /tmp/installer-unzip-test.log
            /tmp/wp-server.log
          if-no-files-found: error

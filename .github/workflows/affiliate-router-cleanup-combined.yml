name: Affiliate Router 6.72.169 Recovery Sweep Full Release Gate

on:
  push:
    branches: [affiliate-release-current]
    paths:
      - '.github/workflows/affiliate-router-cleanup-combined.yml'
      - 'control/release-governance/CURRENT_RELEASE.json'
      - 'AFFILIATE_HOBBYRAUM/test_otto_automation.php'
      - 'AFFILIATE_HOBBYRAUM/test_adcell_awin_otto_unchanged.php'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  combined-contract:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Governance and exact 6.72.169 source binding
        shell: bash
        run: |
          set -euo pipefail
          python3 control/release-governance/release_guard.py governance-check
          python3 control/release-governance/release_guard.py source-check
          python3 control/release-governance/release_guard.py start --branch affiliate-release-current
          grep -F "Version: 6.72.169" release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php
          grep -F "const VERSION = '6.72.169';" release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php
          test "$(grep -cve '^[[:space:]]*$' release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt)" = "27"
          echo "PASS exact source-bound 6.72.169"

      - name: Exact delta versus released 6.72.168
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=cc65aa690e6547f3ca15c9d187dfdc9dbac28c41
          rm -rf /tmp/v672168 /tmp/v672169
          mkdir -p /tmp/v672168 /tmp/v672169
          git archive "$BASE_SHA" release/affiliate-zentrale/current/affiliate-portal-router | tar -x -C /tmp/v672168
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/v672169/affiliate-portal-router
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          a=Path('/tmp/v672168/release/affiliate-zentrale/current/affiliate-portal-router')
          b=Path('/tmp/v672169/affiliate-portal-router')
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          rels=sorted(set(
              [p.relative_to(a).as_posix() for p in a.rglob('*') if p.is_file()] +
              [p.relative_to(b).as_posix() for p in b.rglob('*') if p.is_file()]
          ))
          changed=[r for r in rels if not (a/r).is_file() or not (b/r).is_file() or h(a/r)!=h(b/r)]
          expected=sorted([
              'includes/trait-ppar-ebay.php',
              'includes/trait-ppar-idealo.php',
              'includes/trait-ppar-output-objects.php',
              'pferdeportal-affiliate-router.php',
              'readme.txt',
          ])
          print('CHANGED',changed)
          if changed != expected:
              raise SystemExit(f'FAIL unexpected 6.72.169 delta: {changed}')
          print('PASS exact provider-neutral frontend fullscan rootfix delta')
          PY

      - name: PHP syntax all current plugin files
        shell: bash
        run: |
          set -euo pipefail
          find release/affiliate-zentrale/current/affiliate-portal-router -type f -name '*.php' -print0 | xargs -0 -n1 php -l | tee /tmp/php-lint.log
          test "$(grep -c '^No syntax errors detected' /tmp/php-lint.log)" = "21"
          echo "PASS php lint 21/21"

      - name: 6.72.169 provider-neutral fullscan hard assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          BASE='cc65aa690e6547f3ca15c9d187dfdc9dbac28c41'
          root=Path('release/affiliate-zentrale/current/affiliate-portal-router')
          main=(root/'pferdeportal-affiliate-router.php').read_text()
          ebay=(root/'includes/trait-ppar-ebay.php').read_text()
          idealo=(root/'includes/trait-ppar-idealo.php').read_text()
          output=(root/'includes/trait-ppar-output-objects.php').read_text()
          run=(root/'includes/trait-ppar-ebay-run.php').read_text()
          hk=(root/'includes/trait-ppar-housekeeping.php').read_text()
          kiss=(root/'includes/class-ppar-admin-kiss.php').read_text()

          def show(rel):
              return subprocess.check_output(['git','show',f'{BASE}:release/affiliate-zentrale/current/affiliate-portal-router/{rel}'],text=True)
          base_main=show('pferdeportal-affiliate-router.php')
          base_ebay=show('includes/trait-ppar-ebay.php')
          base_idealo=show('includes/trait-ppar-idealo.php')
          base_output=show('includes/trait-ppar-output-objects.php')
          base_run=show('includes/trait-ppar-ebay-run.php')
          base_hk=show('includes/trait-ppar-housekeeping.php')
          base_kiss=show('includes/class-ppar-admin-kiss.php')

          if run != base_run: raise SystemExit('FAIL eBay run trait changed')
          if hk != base_hk: raise SystemExit('FAIL housekeeping changed')
          if kiss != base_kiss: raise SystemExit('FAIL KISS admin changed')

          def body(src,name):
              marker='function '+name+'('
              start=src.find(marker)
              if start<0: raise SystemExit('FAIL missing function '+name)
              brace=src.find('{',start); depth=0; state='code'; esc=False; i=brace
              while i<len(src):
                  c=src[i]; n=src[i+1] if i+1<len(src) else ''
                  if state=='sq':
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": state='code'
                  elif state=='dq':
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': state='code'
                  elif state=='line':
                      if c=='\n': state='code'
                  elif state=='block':
                      if c=='*' and n=='/': state='code'; i+=1
                  else:
                      if c=="'": state='sq'
                      elif c=='"': state='dq'
                      elif c=='/' and n=='/': state='line'; i+=1
                      elif c=='#': state='line'
                      elif c=='/' and n=='*': state='block'; i+=1
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0: return src[start:i+1]
                  i+=1
              raise SystemExit('FAIL unclosed '+name)

          # Fachlogik that must stay byte-identical to released 6.72.168.
          for name in [
              'ranked_campaigns_for_slot_uncached',
              'campaign_match_rank',
              'campaign_control_allows_delivery',
              'campaign_health_allows_delivery',
              'campaign_source_allows_delivery',
              'render_banner',
          ]:
              if body(main,name) != body(base_main,name):
                  raise SystemExit('FAIL core ranking/output semantics changed: '+name)
          for name in [
              'ebay_business_campaign_source_allows_delivery',
              'ebay_business_campaign_source_allows_delivery_base',
          ]:
              if body(ebay,name) != body(base_ebay,name):
                  raise SystemExit('FAIL eBay safety/source semantics changed: '+name)
          for name in [
              'multiprovider_filter_candidates_by_strategy',
              'multiprovider_reorder_candidates',
              'multiprovider_campaigns_share_exact_gtin',
          ]:
              if body(idealo,name) != body(base_idealo,name):
                  raise SystemExit('FAIL multiprovider strategy semantics changed: '+name)
          if body(output,'output_object_revalidate') != body(base_output,'output_object_revalidate'):
              raise SystemExit('FAIL output-object revalidation semantics changed')

          # The four public full-scan causes must be gone/bounded.
          if 'function ebay_prime_business_campaign_source_row_cache()' in ebay:
              raise SystemExit('FAIL old eBay full-campaign source prime remains')
          if 'ebay_business_campaign_source_row_cache_primed' in ebay:
              raise SystemExit('FAIL old eBay global-prime state remains')
          if 'function ebay_prime_business_campaign_source_row_cache_for_campaigns(' not in ebay:
              raise SystemExit('FAIL candidate-scoped eBay batch prime missing')
          if 'function ebay_campaign_post_ids_for_exact_gtins(' not in ebay:
              raise SystemExit('FAIL targeted eBay exact-GTIN lookup missing')
          if 'get_campaigns(' in body(ebay,'ebay_campaign_post_ids_for_exact_gtins'):
              raise SystemExit('FAIL eBay exact-GTIN lookup still full-scans campaigns')

          if 'function output_prime_creative_row_cache(' in output or 'output_creative_row_cache_primed' in output:
              raise SystemExit('FAIL generic creative fullscan preload remains')
          if 'get_campaigns(' in body(output,'output_creative_row'):
              raise SystemExit('FAIL exact creative lookup still full-scans campaigns')

          gtin=body(idealo,'multiprovider_exact_gtin_candidate_pool')
          if "ranked_campaign_candidate_index('exact')" not in gtin:
              raise SystemExit('FAIL raw exact-GTIN index not used')
          if 'ebay_campaign_post_ids_for_exact_gtins' not in gtin:
              raise SystemExit('FAIL eBay exact-GTIN bridge missing')
          if gtin.count('get_campaigns(') != 1 or "if (!$cache_allowed)" not in gtin:
              raise SystemExit('FAIL public multiprovider path still has an unbounded campaign scan')

          glossary=body(main,'glossary_partner_inherited_exact_rank')
          if 'ranked_campaign_raw_records_snapshot' not in glossary:
              raise SystemExit('FAIL glossary same-partner raw prefilter missing')
          if glossary.count('get_campaigns(') != 1 or 'frontend_prefilter' not in glossary:
              raise SystemExit('FAIL glossary public inheritance still full-scans campaigns')

          # Other provider traits do not carry their own frontend campaign fullscan.
          for rel in [
              'includes/trait-ppar-network-sync.php',
              'includes/trait-ppar-provider-registry.php',
              'includes/trait-ppar-provider-intake.php',
              'includes/trait-ppar-digistore24.php',
              'includes/trait-ppar-automation-suite.php',
          ]:
              txt=(root/rel).read_text()
              if 'get_campaigns(' in txt:
                  raise SystemExit('FAIL separate provider fullscan found: '+rel)

          print('PASS four frontend fullscan root causes removed/bounded')
          print('PASS eBay, idealo, Awin/OTTO shared paths covered')
          print('PASS Adcell/Digistore provider traits have no separate campaign fullscan')
          print('PASS ranking, relevance, safety, health, veto and provider strategy functions unchanged')
          PY

      - name: Existing provider and banner regressions
        shell: bash
        run: |
          set -euo pipefail
          bash AFFILIATE_HOBBYRAUM/run_otto_checks.sh
          php AFFILIATE_HOBBYRAUM/test_adcell_awin_otto_unchanged.php
          php AFFILIATE_HOBBYRAUM/test_banner_distribution_behavior.php

      - name: Install exact WordPress 7.1.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-site
          mkdir -p /tmp/wp-site
          /tmp/wp core download --path=/tmp/wp-site --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title='Affiliate 6.72.169 Full Gate' --admin_user=admin --admin_password='ci-password-123!' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp-site/wp-content/mu-plugins
          cat >/tmp/wp-site/wp-content/mu-plugins/ppar-hivepress-fixture.php <<'PHP'
          <?php
          add_action('init', static function(){
              if (!post_type_exists('hp_listing')) {
                  register_post_type('hp_listing', array('public'=>true,'label'=>'Listings'));
              }
              if (!taxonomy_exists('hp_listing_category')) {
                  register_taxonomy('hp_listing_category', array('hp_listing'), array('public'=>true,'hierarchical'=>true,'label'=>'Listing categories'));
              }
          }, 1);
          PHP

      - name: Build query-regression fixture
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/query-fixture.php <<'PHP'
          <?php
          if (!class_exists('Pferdeportal_Affiliate_Router')) { fwrite(STDERR,"FAIL plugin class missing\n"); exit(2); }
          if (!post_type_exists('hp_listing')) { register_post_type('hp_listing', array('public'=>true)); }
          if (!taxonomy_exists('hp_listing_category')) { register_taxonomy('hp_listing_category',array('hp_listing'),array('public'=>true,'hierarchical'=>true)); }
          $ensure_term = static function($name,$slug,$parent=0){
              $existing=get_term_by('slug',$slug,'hp_listing_category');
              if (is_object($existing)) return (int)$existing->term_id;
              $r=wp_insert_term($name,'hp_listing_category',array('slug'=>$slug,'parent'=>$parent));
              if (is_wp_error($r)) { fwrite(STDERR,"FAIL term ".$slug.": ".$r->get_error_message()."\n"); exit(2); }
              return (int)$r['term_id'];
          };
          $private=$ensure_term('Private Anzeigen','private-anzeigen');
          $child=$ensure_term('Private Kind','private-kind',$private);
          $other=$ensure_term('Andere Kategorie','andere-kategorie');

          $o=Pferdeportal_Affiliate_Router::instance();
          $snap=static function($q){
              return array(
                  'post_type'=>$q->get('post_type'),
                  'taxonomy'=>$q->get('taxonomy'),
                  'term'=>$q->get('term'),
                  'term_id'=>$q->get('term_id'),
                  'hp_listing_category'=>$q->get('hp_listing_category'),
                  'tax_query'=>$q->get('tax_query'),
                  'meta_query'=>$q->get('meta_query'),
                  'posts_per_page'=>$q->get('posts_per_page'),
                  'posts_per_archive_page'=>$q->get('posts_per_archive_page'),
                  'private_limit'=>$q->get('_ppar_ebay_private_public_limit'),
                  'ceiling'=>$q->get('_ppar_ebay_visibility_ceiling'),
                  'paged'=>$q->get('paged'),
                  'no_found_rows'=>$q->get('no_found_rows'),
              );
          };
          $make=static function($vars){
              $q=new WP_Query();
              foreach($vars as $k=>$v){ $q->set($k,$v); }
              return $q;
          };
          $run=static function($vars) use($make,$o,$snap){
              $q=$make($vars);
              $o->ebay_expand_private_parent_listing_query($q);
              $o->ebay_enforce_private_visibility_ceiling($q);
              return $snap($q);
          };
          $cases=array(
              'ordinary_page'=>$run(array('post_type'=>'page')),
              'ordinary_post'=>$run(array('post_type'=>'post')),
              'unrelated_taxonomy'=>$run(array('taxonomy'=>'category','term'=>'news')),
              'listing_general'=>$run(array('post_type'=>'hp_listing')),
              'private_parent'=>$run(array('post_type'=>'hp_listing','hp_listing_category'=>'private-anzeigen')),
              'private_child'=>$run(array('post_type'=>'hp_listing','hp_listing_category'=>'private-kind')),
              'other_listing_category'=>$run(array('post_type'=>'hp_listing','hp_listing_category'=>'andere-kategorie')),
              'listing_single'=>$run(array('post_type'=>'hp_listing','p'=>123)),
              'explicit_private_tax_query'=>$run(array('post_type'=>'hp_listing','tax_query'=>array(array('taxonomy'=>'hp_listing_category','field'=>'term_id','terms'=>array($private))))),
          );
          echo json_encode($cases, JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT), "\n";
          PHP

      - name: WordPress/MariaDB frontend equivalence 6.72.168 -> 6.72.169
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=cc65aa690e6547f3ca15c9d187dfdc9dbac28c41
          rm -rf /tmp/base-plugin
          mkdir -p /tmp/base-plugin
          git archive "$BASE_SHA" release/affiliate-zentrale/current/affiliate-portal-router | tar -x -C /tmp/base-plugin
          cp -a /tmp/base-plugin/release/affiliate-zentrale/current/affiliate-portal-router /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-site
          /tmp/wp eval 'if (Pferdeportal_Affiliate_Router::VERSION !== "6.72.168") { exit(2); } echo "BASE_VERSION_PASS\n";' --path=/tmp/wp-site
          /tmp/wp eval-file /tmp/query-fixture.php --path=/tmp/wp-site > /tmp/base-query.json
          /tmp/wp plugin deactivate affiliate-portal-router --path=/tmp/wp-site
          rm -rf /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-site
          /tmp/wp eval 'if (Pferdeportal_Affiliate_Router::VERSION !== "6.72.169") { exit(2); } echo "CURRENT_VERSION_PASS\n";' --path=/tmp/wp-site
          /tmp/wp eval-file /tmp/query-fixture.php --path=/tmp/wp-site > /tmp/current-query.json
          diff -u /tmp/base-query.json /tmp/current-query.json
          echo "PASS WordPress/MariaDB frontend query behavior byte-identical across all bound cases"

      - name: Provider-neutral frontend fullscan WordPress MariaDB gate
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/provider-fullscan-gate.php <<'PHP'
          <?php
          require '/tmp/wp-site/wp-load.php';
          $fail=static function($m){fwrite(STDERR,"FAIL ".$m."\n");exit(2);};
          $pass=static function($m){echo "PASS ".$m."\n";};
          if (!class_exists('Pferdeportal_Affiliate_Router')) $fail('plugin class missing');
          $o=Pferdeportal_Affiliate_Router::instance();
          $rm=static function($name) use($o){
              $m=new ReflectionMethod($o,$name); $m->setAccessible(true); return $m;
          };
          $rp=static function($name) use($o){
              $p=new ReflectionProperty($o,$name); $p->setAccessible(true); return $p;
          };

          // Ensure current schemas exist on this fresh WordPress/MariaDB fixture.
          $rm('maybe_install_creative_library_schema')->invoke($o);
          $rm('maybe_install_ebay_schema')->invoke($o);
          if (!post_type_exists(Pferdeportal_Affiliate_Router::CAMPAIGN_POST_TYPE)) {
              $rm('register_campaign_post_type')->invoke($o);
          }

          global $wpdb;
          $creative_table=$rm('creative_library_table')->invoke($o);
          $now=time();

          // 1) Generic/provider-neutral exact Creative lookup must cache one requested
          // identity, not normalize and preload the whole campaign inventory.
          $hashes=[];
          for($i=0;$i<25;$i++){
              $hash=hash('sha256','creative-'.$i); $hashes[]=$hash;
              $post_id=wp_insert_post([
                  'post_type'=>Pferdeportal_Affiliate_Router::CAMPAIGN_POST_TYPE,
                  'post_status'=>'publish','post_title'=>'Creative '.$i,'post_name'=>'creative-'.$i
              ]);
              update_post_meta($post_id,'_ppar_creative_identity_hash',$hash);
              update_post_meta($post_id,'ppar_campaign_data',[
                  'id'=>'creative-'.$i,'active'=>1,'creative_type'=>'banner','network'=>'adcell',
                  'url'=>'https://example.test/click/'.$i,'image_url'=>'https://example.test/image/'.$i.'.jpg',
                  'placements'=>['hub_grid_card'],'assignment_mode'=>'fallback'
              ]);
              $wpdb->insert($creative_table,[
                  'provider'=>'adcell','partner_external_id'=>'p'.$i,'partner_name'=>'Partner '.$i,
                  'external_id'=>'ext-'.$i,'identity_hash'=>$hash,'creative_type'=>'banner',
                  'title'=>'Creative '.$i,'description'=>'','tags'=>'','image_url'=>'https://example.test/image/'.$i.'.jpg',
                  'destination_url'=>'https://example.test/d/'.$i,'tracking_url'=>'https://example.test/t/'.$i,
                  'width'=>728,'height'=>90,'source_status'=>'active','source_kind'=>'banner',
                  'availability_state'=>'active','missing_count'=>0,'last_complete_run'=>'',
                  'review_status'=>'approved','selected'=>1,'content_scope'=>'horse','scope_source'=>'ci',
                  'classified_at'=>$now,'topic_status'=>'matched','topic_score'=>100,'topic_targets'=>'',
                  'source_hash'=>hash('sha256','source-'.$i),'payload'=>'{}','first_seen'=>$now,'last_seen'=>$now
              ]);
          }
          $rp('output_creative_row_cache')->setValue($o,[]);
          $row=$rm('output_creative_row')->invoke($o,$hashes[7]);
          if(!is_array($row) || (string)($row['identity_hash']??'')!==$hashes[7]) $fail('exact creative row lookup wrong');
          $cache=$rp('output_creative_row_cache')->getValue($o);
          if(count($cache)!==1 || !array_key_exists($hashes[7],$cache)) $fail('generic output creative lookup preloaded more than requested identity');
          $pass('generic output creative lookup is exact and request-local');

          // 2) eBay source batch receives only already-ranked candidates.
          $ebay_ids=[];
          for($i=0;$i<12;$i++){
              $hash=hash('sha256','ebay-'.$i);
              $post_id=wp_insert_post([
                  'post_type'=>Pferdeportal_Affiliate_Router::CAMPAIGN_POST_TYPE,
                  'post_status'=>'publish','post_title'=>'eBay '.$i,'post_name'=>'ebay-'.$i
              ]);
              update_post_meta($post_id,'_ppar_creative_identity_hash',$hash);
              update_post_meta($post_id,'_ppar_ebay_business_auto',1);
              update_post_meta($post_id,'ppar_campaign_data',[
                  'id'=>'ebay-'.$i,'active'=>1,'creative_type'=>'product','network'=>'ebay',
                  'title'=>'eBay product '.$i,'url'=>'https://www.ebay.de/itm/'.$i,
                  'image_url'=>'https://i.ebayimg.com/images/g/test'.$i.'/s-l500.jpg',
                  'placements'=>['category_product_1'],'assignment_mode'=>'page_tree',
                  'automation_target_keys'=>['page:test']
              ]);
              $ebay_ids[]=$post_id;
          }
          $rp('ebay_business_campaign_source_row_cache')->setValue($o,[]);
          $rm('ebay_prime_business_campaign_source_row_cache_for_campaigns')->invoke($o,[
              ['campaign'=>['network'=>'ebay','post_id'=>$ebay_ids[3]]]
          ]);
          $ecache=$rp('ebay_business_campaign_source_row_cache')->getValue($o);
          if(count($ecache)>1) $fail('eBay source batch primed unrelated campaigns');
          $pass('eBay source batch is candidate-scoped');

          // 3) Exact-GTIN multiprovider lookup normalizes only exact candidates.
          $gtin='4006381333931';
          for($i=0;$i<80;$i++){
              $p=wp_insert_post([
                  'post_type'=>Pferdeportal_Affiliate_Router::CAMPAIGN_POST_TYPE,
                  'post_status'=>'publish','post_title'=>'Decoy '.$i,'post_name'=>'decoy-'.$i
              ]);
              $decoy=str_pad((string)(1000000000000+$i),13,'0',STR_PAD_LEFT);
              update_post_meta($p,'ppar_campaign_data',[
                  'id'=>'decoy-'.$i,'active'=>1,'creative_type'=>'product','network'=>'idealo',
                  'title'=>'Decoy '.$i,'url'=>'https://example.test/decoy/'.$i,
                  'image_url'=>'https://example.test/decoy/'.$i.'.jpg','product_gtins'=>[$decoy],
                  'product_identifiers'=>[['type'=>'GTIN','value'=>$decoy]],
                  'placements'=>['category_product_1'],'assignment_mode'=>'page_tree',
                  'automation_target_keys'=>['page:test']
              ]);
          }
          foreach(['idealo','awin'] as $network){
              $p=wp_insert_post([
                  'post_type'=>Pferdeportal_Affiliate_Router::CAMPAIGN_POST_TYPE,
                  'post_status'=>'publish','post_title'=>'Match '.$network,'post_name'=>'match-'.$network
              ]);
              update_post_meta($p,'ppar_campaign_data',[
                  'id'=>'match-'.$network,'active'=>1,'creative_type'=>'product','network'=>$network,
                  'title'=>'Exact Match '.$network,'url'=>'https://example.test/'.$network.'/match',

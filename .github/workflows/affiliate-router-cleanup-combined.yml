name: Affiliate Router Cleanup Combined
on:
  push:
    branches: [affiliate-release-current]
    paths:
      - '.github/workflows/affiliate-router-cleanup-combined.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build combined candidate
        run: |
          set -euo pipefail
          rm -rf /tmp/router-clean
          mkdir -p /tmp/router-clean
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/router-clean/affiliate-portal-router
          python3 AFFILIATE_HOBBYRAUM/performance-cache/apply_performance_cache_patch.py /tmp/router-clean/affiliate-portal-router
          python3 AFFILIATE_HOBBYRAUM/performance-cache/apply_performance_batch_patch.py /tmp/router-clean/affiliate-portal-router
          python3 AFFILIATE_HOBBYRAUM/performance-cache/apply_performance_cpu_similarity_patch.py /tmp/router-clean/affiliate-portal-router
          python3 AFFILIATE_HOBBYRAUM/performance-cache/apply_performance_ranking_memo_patch.py /tmp/router-clean/affiliate-portal-router
      - name: PHP syntax
        run: find /tmp/router-clean/affiliate-portal-router -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: CPU exact-equivalence
        run: |
          cp AFFILIATE_HOBBYRAUM/performance-cache/test_ebay_similarity_cpu_v672146.php /tmp/router-clean/test_ebay_similarity_cpu_v672146.php
          cd /tmp/router-clean
          php test_ebay_similarity_cpu_v672146.php
      - name: Batch positive-negative regression
        run: |
          cp AFFILIATE_HOBBYRAUM/performance-cache/test_request_local_batch_cache.php /tmp/router-clean/test_request_local_batch_cache.php
          cd /tmp/router-clean
          php test_request_local_batch_cache.php
      - name: Ranking first-call semantics unchanged
        run: |
          rm -rf /tmp/base145
          mkdir -p /tmp/base145
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/base145/affiliate-portal-router
          python3 AFFILIATE_HOBBYRAUM/performance-cache/apply_performance_cache_patch.py /tmp/base145/affiliate-portal-router
          python3 AFFILIATE_HOBBYRAUM/performance-cache/apply_performance_batch_patch.py /tmp/base145/affiliate-portal-router
          python3 AFFILIATE_HOBBYRAUM/performance-cache/apply_performance_cpu_similarity_patch.py /tmp/base145/affiliate-portal-router
          python3 AFFILIATE_HOBBYRAUM/performance-cache/test_ranking_memo_source.py /tmp/base145/affiliate-portal-router /tmp/router-clean/affiliate-portal-router
      - name: Banner regression
        run: php AFFILIATE_HOBBYRAUM/test_banner_distribution_behavior.php

name: Glossar 0.2.8 Register Cleanup
on:
  push:
    branches:
      - hobbyroom/glossar-livefail-red-green-20260913
    paths:
      - .github/workflows/glossar-028-register-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hobbyroom/glossar-livefail-red-green-20260913
          fetch-depth: 0
      - run: python3 protocol/PROJECT_MEMORY/PROJEKTE/PFERDE_ATELIER/GLOSSAR/update-028-registers.py
      - run: git diff --check
      - name: Commit central wayfinder updates only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add protocol/PROJECT_MEMORY/WORDPRESS_REGISTER.md protocol/PROJECT_MEMORY/ALLGEMEINGUELTIGE_BAUSTEINE/MODULREGISTER.md
          git diff --cached --quiet && exit 0
          git commit -m 'Update Glossar 0.2.8 central wayfinders'
          git push origin HEAD:hobbyroom/glossar-livefail-red-green-20260913

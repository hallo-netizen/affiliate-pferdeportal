name: Glossar 0.2.8 Register Cleanup
on:
  push:
    branches: [hobbyroom/glossar-livefail-red-green-20260913]
    paths: ['.github/workflows/glossar-028-register-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hobbyroom/glossar-livefail-red-green-20260913
          fetch-depth: 0
      - name: Replace only WP-009 and MOD-008 index blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          wp=Path('protocol/PROJECT_MEMORY/WORDPRESS_REGISTER.md')
          s=wp.read_text()
          block='''### WP-009 – Universal Glossar Engine

MOD-ID:
MOD-008

Plugin:
`Universal Glossary Engine`

Aktuellster technisch gebundener Kandidat:
**0.2.8**

Rewrite-Schema:
**6**

Innerer Plugin-ZIP SHA-256:
`9bdda56baccfb4f7af5ff512fe37cb23d6117eb9cc56bb3e5f059b168b4f1db1`

Autoritativer finaler Hardtest:
- Run `34755984363`
- Browser Job `103720316319` PASS
- Fresh Job `103720316220` PASS
- Update 0.2.6 → 0.2.8 Job `103720316226` PASS
- Update 0.2.7 → 0.2.8 Job `103720316230` PASS
- echter Design-1.50.469-Runtime Job `103720316084` PASS
- gated Package Job `103720510869` PASS
- Actions-Artefakt-ID `10318015702`

Status:
**TECHNISCHER KANDIDAT HARDTEST PASS / KEIN PFERDE-LIVE-PASS.**

Wichtige Korrektur:
0.2.7 wurde durch realen Pferde-Readback als LIVE FAIL widerlegt. 0.2.6 ist historische Zwischenversion. Beide nicht verwenden.

Der 0.2.8-Hardtest schließt die frühere Testlücke: echter Pferde-Designcode 1.50.469 mit SHA `580fa6c7f5566f29df9254ce92f687a4831554e1d84bf03fbd936bb7577edfe5`, echte Browsergeometrie, reale AJAX-UI, echte Kategorie-/Einzelrenderer sowie Upgradepfade 0.2.6 und 0.2.7 aus gezielt beschädigtem Rewritezustand.

Hauptquelle:
`ALLGEMEINGUELTIGE_BAUSTEINE/GLOSSAR/`

Technisches Protokoll:
`ALLGEMEINGUELTIGE_BAUSTEINE/GLOSSAR/TESTPROTOKOLL_0.2.8_20260913.md`

Erste Projektanwendung:
`PROJEKTE/PFERDE_ATELIER/GLOSSAR/`

Modulklasse:
`UNGEKLÄRT / ZIEL ALLGEMEINGÜLTIG`.

Offen:
Pferde-Atelier-Live-Readback des exakt hashgebundenen 0.2.8-Kandidaten; realer Wissensdatenbankimport; größerer Performance-Test; zweites echtes WordPress-Portal; Yoast-Kombinationstest soweit release-relevant.
'''
          m=re.search(r'### WP-009 – Universal Glossar Engine.*\Z',s,re.S)
          assert m, 'WP-009 block not found'
          s=s[:m.start()]+block
          wp.write_text(s)

          mod=Path('protocol/PROJECT_MEMORY/ALLGEMEINGUELTIGE_BAUSTEINE/MODULREGISTER.md')
          s=mod.read_text()
          block='''## MOD-008 – UNIVERSAL GLOSSAR ENGINE

MODULKLASSE: UNGEKLÄRT / ZIEL ALLGEMEINGÜLTIG

STATUS:
0.2.8 technischer Kandidat HARDTEST PASS; Pferde-Atelier ist erste Projektanwendung; realer Pferde-LIVE-Readback 0.2.8 noch offen. 0.2.7 ist historischer LIVE FAIL und nicht zu verwenden.

HAUPTORT:
`ALLGEMEINGUELTIGE_BAUSTEINE/GLOSSAR/`

AKTUELL BELEGTER STAND:
- Plugin 0.2.8
- Rewrite-Schema 6
- finaler Run `34755984363`
- getesteter Head `d14f6bff7f660cc6461208e8153fbdf237f0d609`
- ZIP SHA-256 `9bdda56baccfb4f7af5ff512fe37cb23d6117eb9cc56bb3e5f059b168b4f1db1`
- Actions-Artefakt-ID `10318015702`

ZWECK:
Projektunabhängiger Glossar-Core mit eigenem Begriffstyp, hierarchischen Oberbereichen, Suche, A–Z, eigener Begriff-URL, SEO-Feldern und JSON-Transfer ohne Bildzwang und ohne Auto-Publish.

ABHÄNGIGKEITEN:
WordPress; projektspezifisches Design bleibt außerhalb des neutralen Cores.

NUTZENDE PROJEKTE:
- PFERDE_ATELIER → `PROJEKTE/PFERDE_ATELIER/GLOSSAR/`

AUTORITATIVE QUELLE / BELEG:
- `ALLGEMEINGUELTIGE_BAUSTEINE/GLOSSAR/CURRENT_STATE.md`
- `ALLGEMEINGUELTIGE_BAUSTEINE/GLOSSAR/TESTPROTOKOLL_0.2.8_20260913.md`
- finaler Hardtest Run `34755984363`

PRÜFGRAD:
Fresh WordPress/MySQL/Astra PASS; Browser-AJAX/Responsive PASS; echte Kategorie-/Einzelrenderer PASS; Negativmatrix PASS; Updates aus 0.2.6 und 0.2.7 mit beschädigtem Rewritezustand PASS; echter Pferde-Designcode 1.50.469 Runtime PASS; gated package und exakter lokaler Artefaktcheck PASS.

OFFENE PUNKTE:
- Pferde-Atelier-LIVE-Readback des exakten 0.2.8-ZIPs;
- zweites reales Portal für formale Allgemeingültigkeit;
- realer Wissensdatenbankimport;
- größerer Performance-Test;
- Yoast-Kombinationstest soweit release-relevant.
'''
          pat=r'## MOD-008 – UNIVERSAL GLOSSAR ENGINE.*?(?=\n## MOD-|\Z)'
          m=re.search(pat,s,re.S)
          assert m, 'MOD-008 block not found'
          s=s[:m.start()]+block+s[m.end():]
          # Refresh register date only; register remains a wayfinder, not a second truth.
          s=s.replace('STAND: 2026-09-12','STAND: 2026-09-13',1)
          mod.write_text(s)
          PY
          git diff --check
          git diff -- protocol/PROJECT_MEMORY/WORDPRESS_REGISTER.md protocol/PROJECT_MEMORY/ALLGEMEINGUELTIGE_BAUSTEINE/MODULREGISTER.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add protocol/PROJECT_MEMORY/WORDPRESS_REGISTER.md protocol/PROJECT_MEMORY/ALLGEMEINGUELTIGE_BAUSTEINE/MODULREGISTER.md
          git commit -m 'Update Glossar 0.2.8 central wayfinders'
          git push origin HEAD:hobbyroom/glossar-livefail-red-green-20260913

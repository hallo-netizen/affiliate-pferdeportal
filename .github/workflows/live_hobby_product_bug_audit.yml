name: Live Hobby Depot Product Cards Ground Truth
on:
  push:
    branches: [audit/hd009-live-cards-missing-facts-20261113]
    paths: [.github/workflows/live_hobby_product_bug_audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact live Airbrush output and current HD009 rendering logic
        run: |
          python3 -m pip -q install beautifulsoup4
          python3 - <<'PY'
          import pathlib,urllib.request,re,zipfile,hashlib
          from bs4 import BeautifulSoup
          url='https://hobby-depot.de/gestalten/malen-zeichnen/airbrush/'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=25) as response:
            raw=response.read(2200000).decode('utf8','replace')
            print('LIVE_HTTP',response.status,'BYTES',len(raw),'URL',response.url)
          s=BeautifulSoup(raw,'html.parser')
          for k in ['.hd-catlevel-products','.hd-catlevel-product-grid','.hd-next-partner-product','.ppar-banner-link']:
            print('SELECTOR',k,'COUNT',len(s.select(k)))
          for i,c in enumerate(s.select('.hd-catlevel-product-grid .hd-next-partner-product')):
            print('CARD',i,'TEXT',c.get_text(' | ',strip=True)[:1500])
            print('CARD',i,'HTML',str(c)[:9500])
          for sel in ('body','main','.hd-content-v150616','.hd-catlevel-products','.hd-catlevel-product-grid'):
            x=s.select_one(sel)
            print('CONTEXT',sel,'ATTRS',dict(x.attrs) if x else None)
          for m in re.findall(r'(?i)(?:version|ver)=([0-9]{1,3}\.[0-9.]{2,20})',raw):
            if m.startswith(('0.1.','1.50.')):print('LIVE_VERSION_HINT',m)
          office=pathlib.Path('protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE')
          p=office/'CURRENT.zip'
          print('BASE_PLUGIN',hashlib.sha256(p.read_bytes()).hexdigest())
          with zipfile.ZipFile(p) as z:
            main=z.read('affiliate-portal-router/hobby-depot-affiliate-router.php').decode().splitlines()
            idealo=z.read('affiliate-portal-router/includes/trait-ppar-idealo.php').decode().splitlines()
            for label,a,spans in [
              ('RENDER',main,[(4620,4730),(5000,5185),(7930,8070)]),
              ('IDEALO',idealo,[(665,822)]),
            ]:
              for start,end in spans:
                print('BEGIN',label,start,end)
                for i in range(start-1,min(end,len(a))):
                  print('LINE',label,i+1,a[i][:950])
          PY

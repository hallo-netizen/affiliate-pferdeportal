name: TEMP K0 H2 Rendering Fix

on:
  push:
    branches: [tmp/k0-h2-render-fix-20261003]
    paths:
      - .github/workflows/tmp-k0-h2-render-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/k0-h2-render-fix-20261003
          fetch-depth: 0
      - name: Apply only validated K0 H2 spacing fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pferde-template-kit_V1.50.421.php')
          s=p.read_text(encoding='utf-8')
          marker='body.pftk-hub1-pilot-v150210 .pa223-hero figure::after{content:""!important;display:block!important;position:absolute!important;inset:0!important;z-index:20!important;pointer-events:none!important;box-sizing:border-box!important;border:1px solid rgba(53,66,42,.28)!important}\n'
          fix='''/* K0: only normalize vertical spacing of structured article sections.
   Kubio/theme section defaults must not create large gaps above H2 headings. */
body.single-post .entry-content article.ppm-generated>section[data-block]:not([data-block="conclusion"]){
  margin-block:0!important;
  padding-block:0!important;
  min-height:0!important;
  height:auto!important;
}
body.single-post .entry-content article.ppm-generated>section[data-block]:not([data-block="conclusion"])+section[data-block]:not([data-block="conclusion"]){
  margin-top:32px!important;
}
body.single-post .entry-content article.ppm-generated>section[data-block]:not([data-block="conclusion"])>h2:first-child{
  margin-top:0!important;
}
'''
          if fix in s:
              raise SystemExit('FIX_ALREADY_PRESENT_UNEXPECTED')
          if s.count(marker)!=1:
              raise SystemExit(f'ANCHOR_COUNT_INVALID:{s.count(marker)}')
          s=s.replace(marker,marker+fix,1)
          p.write_text(s,encoding='utf-8')
          PY

          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "pferde-template-kit_V1.50.421.php"

          python3 - <<'PY'
          from pathlib import Path
          s=Path('pferde-template-kit_V1.50.421.php').read_text(encoding='utf-8')
          required=[
            'article.ppm-generated>section[data-block]:not([data-block="conclusion"]){',
            'margin-block:0!important;',
            'padding-block:0!important;',
            'min-height:0!important;',
            'height:auto!important;',
            'margin-top:32px!important;',
            '>h2:first-child{',
            'margin-top:0!important;'
          ]
          for x in required:
              assert x in s, x
          assert s.count('/* K0: only normalize vertical spacing of structured article sections.')==1
          print('K0_H2_RENDER_FIX_LOCAL_POSITIVE_PASS')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pferde-template-kit_V1.50.421.php
          git commit -m "K0: fix structured single-post H2 spacing only"
          git push origin HEAD:tmp/k0-h2-render-fix-20261003

# trigger

name: PSTE Local Current-Path E2E V5
on:
  push:
    branches: [pste-kiss-e2e-20261005]
    paths:
      - '.github/workflows/pste-local-current-path-v5.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Current production path only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ppm /tmp/pserc
          mkdir -p /tmp/ppm /tmp/pserc
          unzip -q control/startmaster0107/runtime_packages/PORTAL_PRODUCTION_MACHINE_V6.7.9_SIGNED_ARTICLE_TYPE_EXTENSION_ROOTFIX_FINAL.zip -d /tmp/ppm
          unzip -q control/startmaster0107/runtime_packages/PSERC-FIX.zip -d /tmp/pserc

          echo '=== CURRENT ACTION ==='
          python3 control/single-door-boundary/codex_current_action.py selftest

          echo '=== PPM NORMAL DRAFT CURRENT SUITE ==='
          root=/tmp/ppm/portal-production-machine
          n=0
          for f in "$root"/tests/normal-draft-production/test-*.php; do
            [ -f "$f" ] || continue
            n=$((n+1))
            php "$f"
          done
          echo "NORMAL_DRAFT_TESTS_PASS=$n"

          echo '=== PPM PLAN CARDINALITY ==='
          php "$root/tests/test-plan-cardinality-1-to-4.php"
          echo PASS_PLAN_CARDINALITY

          echo '=== PPM QF03 READBACK MUTATIONS ==='
          php "$root/tests/qf03-wordpress-draft-readback-dom/test-qf03-rendered-dom-mutations.php"
          echo PASS_QF03_READBACK_MUTATIONS

          echo '=== PPM ACTIVE NEGATIVE MATRIX ==='
          python3 isolated_system4/test_textmachine_ppm_negative_gaps.py
          echo PASS_ACTIVE_NEGATIVE_MATRIX

          echo '=== PSERC LOCAL PACKAGE IDENTITY ==='
          python3 - <<'PY'
          import zipfile, pathlib, re
          z=zipfile.ZipFile('control/startmaster0107/runtime_packages/PSERC-FIX.zip')
          nested=[n for n in z.namelist() if n.lower().endswith('.zip')]
          assert nested
          data=z.read(nested[0])
          import io
          inner=zipfile.ZipFile(io.BytesIO(data))
          mains=[n for n in inner.namelist() if n.endswith('/portal-seo-editorial-plan-compiler.php')]
          assert len(mains)==1
          txt=inner.read(mains[0]).decode('utf-8')
          m=re.search(r"define\('PSERC_VERSION',\s*'([^']+)'\)",txt)
          assert m
          print('LOCAL_PSERC_VERSION='+m.group(1))
          assert m.group(1)=='0.28.18'
          print('PASS_LOCAL_PSERC_IDENTITY_02818')
          PY

          echo '=== SOURCE FAIL CLOSED ==='
          python3 - <<'PY'
          import json
          c=json.load(open('control/pste-topic-engine/CURRENT_STATE.json'))
          assert c['verified_facts']['pste_exact_source_available'] is False
          assert c['status']=='BLOCKED_EXACT_PSTE_SOURCE_MISSING'
          print('PASS_MISSING_CURRENT_PSTE_SOURCE_BLOCKS_FULL_E2E')
          PY

          echo '=== RESULT ==='
          echo CURRENT_AVAILABLE_PATH=PASS
          echo FULL_PSTE_1_TO_1=BLOCKED_MISSING_CURRENT_PSTE_SOURCE
          echo LIVE_PSERC_02832_VS_LOCAL_02818=MISMATCH

name: Build exact HAB RC18 RC17 installations in original plugin offices
on:
  push:
    branches: [hab-rc18-both-current-zip-release-20261108]
    paths:
      - .github/workflows/hab-rc18-build-installers-20261108.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build both existing plugins from exact checked originals and checked overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          from hashlib import sha256
          from tempfile import TemporaryDirectory
          import base64,subprocess,os
          root=Path('protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ')
          staging=root/'PLUGINS/RELEASE_PAYLOAD_RC18'
          blob=''.join(''.join((staging/('hab_rc18_payload_%02d.txt'%i)).read_text().split()) for i in range(6))
          overlaybytes=base64.b64decode(blob,validate=True)
          print('OVERLAY',len(overlaybytes),sha256(overlaybytes).hexdigest())
          with TemporaryDirectory() as tmp:
            overlay=Path(tmp)/'overlay.zip';overlay.write_bytes(overlaybytes)
            d0=root/'PLUGINS/ISOLIERTE_PLUGINS/HAB-001-DESIGN/CURRENT.zip'
            a0=root/'PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip'
            assert sha256(d0.read_bytes()).hexdigest()=='947a950273edb6bf47e76ffeef67ff51425db620adc2650c742831e73093134c','Design original changed'
            assert sha256(a0.read_bytes()).hexdigest()=='cf8cf7946aa7605dadecda1f041cfc6fb150c7971f7c9feb9dbb6dd1ac8eabda','Affiliate original changed'
            with ZipFile(d0) as d, ZipFile(a0) as a, ZipFile(overlay) as patch:
              assert d.testzip() is None and a.testzip() is None and patch.testzip() is None
              design={name:d.read(name) for name in d.namelist()}
              affiliate={name:a.read(name) for name in a.namelist()}
              for name in patch.namelist():
                kind,member=name.split('/',1)
                assert kind in ('design','affiliate') and member.startswith(('hab-bewahr-design-vorschau/','affiliate-portal-router/'))
                (design if kind=='design' else affiliate)[member]=patch.read(name)
              src='hab-bewahr-design-vorschau/assets/'
              dst='affiliate-portal-router/assets/'
              copy={
                'hb-amazon-kategorie-tresore.webp':'existing-safe-room.webp',
                'hb-amazon-world-einbruch.webp':'scene-security.webp',
                'hb-amazon-world-feuer.webp':'area-brandschutz-loeschmittel.webp',
                'hb-amazon-world-technik.webp':'scene-tech.webp',
                'hb-amazon-world-vandalismus.webp':'scene-graffiti.webp',
                'hb-amazon-world-wasser.webp':'focus-keller-rueckstau.webp',
                'hb-amazon-world-wetter.webp':'scene-weather.webp'
              }
              for target,source in copy.items():
                affiliate[dst+target]=design[src+source]
              assert len(design)==432 and len(affiliate)==36,(len(design),len(affiliate))
              assert b'Version: 0.1.191' in design['hab-bewahr-design-vorschau/hab-bewahr-design-vorschau.php']
              assert b'Version: 0.1.14-rc17' in affiliate['affiliate-portal-router/affiliate-portal-router.php']
              for key,files in [('HAB-001-DESIGN',design),('HAB-004-AFFILIATE',affiliate)]:
                with TemporaryDirectory() as folder:
                  target=root/'PLUGINS/ISOLIERTE_PLUGINS'/key/'CURRENT.zip'
                  with ZipFile(target,'w',compression=ZIP_DEFLATED,compresslevel=6,allowZip64=True) as final:
                    for n,b in sorted(files.items()):
                      final.writestr(n,b)
                      if n.endswith('.php'):
                        p=Path(folder)/n
                        p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
                  with ZipFile(target) as final:
                    assert final.testzip() is None and set(final.namelist())==set(files)
                    assert all(final.read(n)==b for n,b in files.items())
                  phps=list(Path(folder).rglob('*.php'))
                  for p in phps:
                    l=subprocess.run(['php','-l',str(p)],capture_output=True,text=True)
                    assert l.returncode==0,(p,l.stderr)
                  print('PASS',key,'PHP',len(phps),'ENTRIES',len(files),'BYTES',target.stat().st_size,'SHA256',sha256(target.read_bytes()).hexdigest())
          PY
      - name: Commit built production-office archives to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-001-DESIGN/CURRENT.zip
          git add protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip
          git commit -m "HAB RC18: both complete original plugin-office installers, passed CRC and PHP lint"
          git push origin HEAD:hab-rc18-both-current-zip-release-20261108

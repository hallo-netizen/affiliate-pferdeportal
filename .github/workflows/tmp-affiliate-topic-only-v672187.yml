name: TEMP Affiliate Topic Only 6.72.187

on:
  push:
    branches: [affiliate-672186-schabracken-rootcause]
    paths:
      - '.github/workflows/tmp-affiliate-topic-only-v672187.yml'
      - 'AFFILIATE_HOBBYRAUM/test_banner_strict_best_tier_all_contexts_v672187.php'
      - 'AFFILIATE_HOBBYRAUM/test_banner_full_e2e_v672187.php'
      - 'release/affiliate-zentrale/current/affiliate-portal-router/**'

permissions:
  contents: read

jobs:
  positive:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PHP lint
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r f; do php -l "$f" >/dev/null; done < <(find release/affiliate-zentrale/current/affiliate-portal-router -type f -name '*.php' | sort)
          echo "PASS PHP lint"

      - name: Performance hardlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          cur=Path('release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php').read_text()
          old=subprocess.check_output(['git','show','a381aff4eb3f41754186f4bad86ce1a7e0823a29:release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php'],text=True)
          def body(src,name):
              marker='function '+name+'('; s=src.find(marker)
              if s<0: raise SystemExit('FAIL missing '+name)
              b=src.find('{',s); d=0; st='c'; esc=False; i=b
              while i<len(src):
                  ch=src[i]; nx=src[i+1] if i+1<len(src) else ''
                  if st=='sq':
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch=="'": st='c'
                  elif st=='dq':
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch=='"': st='c'
                  elif st=='ln':
                      if ch=='\n': st='c'
                  elif st=='bl':
                      if ch=='*' and nx=='/': st='c'; i+=1
                  else:
                      if ch=="'": st='sq'
                      elif ch=='"': st='dq'
                      elif ch=='/' and nx=='/': st='ln'; i+=1
                      elif ch=='#': st='ln'
                      elif ch=='/' and nx=='*': st='bl'; i+=1
                      elif ch=='{': d+=1
                      elif ch=='}':
                          d-=1
                          if d==0:return src[s:i+1]
                  i+=1
              raise SystemExit('FAIL unclosed '+name)
          protected=['ranked_campaigns_request_cache_allowed','ranked_campaign_sanitize_key_request_cached','ranked_campaign_sanitize_text_request_cached','ranked_campaigns_request_cache_key','select_category_product_campaign_fast_v672171','ranked_campaign_candidate_pool','category_product_provider_mix_v672133','render_banner','banner_distribution_reorder_candidates','banner_distribution_stable_index','category_product_shared_rank_base']
          for n in protected:
              if body(cur,n)!=body(old,n): raise SystemExit('FAIL protected performance function changed '+n)
          for n in ['banner_strict_best_relevance_tier_v672187','ranked_campaigns_for_slot','select_campaign_for_slot_position']:
              x=body(cur,n)
              for bad in ['$wpdb','get_post_meta(','get_posts(','get_option(','wp_remote_','output_plan_creative(']:
                  if bad in x: raise SystemExit('FAIL new frontend cost '+n+' '+bad)
          print('PASS performance hardlock and memory-only topic gate')
          PY

      - name: Install WordPress and source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp187
          mkdir -p /tmp/wp187
          /tmp/wp core download --path=/tmp/wp187 --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp187 --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp187 --url=http://127.0.0.1:8081 --title='Topic Only 187' --admin_user=admin --admin_password='ci-test-only-187' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp187/wp-content/mu-plugins
          cat >/tmp/wp187/wp-content/mu-plugins/pferde-e2e-design-contract.php <<'PHP'
          <?php
          if (!class_exists('Pferde_Template_Kit')) {
              class Pferde_Template_Kit {
                  public static function affiliate_contract_version(){ return '1.0'; }
                  public static function design_profile(){ return 'pferde_atelier'; }
                  public static function design_profile_contract_version(){ return '1.0'; }
                  public static function affiliate_page_type($page_id){ return get_post_field('post_parent',$page_id) ? 'category' : 'hub1'; }
              }
          }
          add_action('init', static function(){
              if (!post_type_exists('uge_term')) register_post_type('uge_term',array('public'=>true,'supports'=>array('title','editor')));
              if (!taxonomy_exists('uge_group')) register_taxonomy('uge_group',array('uge_term'),array('public'=>true,'hierarchical'=>true));
              if (!post_type_exists('pa_breed')) register_post_type('pa_breed',array('public'=>true,'supports'=>array('title','editor')));
              if (!taxonomy_exists('pa_breed_group')) register_taxonomy('pa_breed_group',array('pa_breed'),array('public'=>true,'hierarchical'=>true));
              if (!post_type_exists('hp_listing')) register_post_type('hp_listing',array('public'=>true,'supports'=>array('title','editor')));
              if (!taxonomy_exists('hp_listing_category')) register_taxonomy('hp_listing_category',array('hp_listing'),array('public'=>true,'hierarchical'=>true));
          },1);
          PHP
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/wp187/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp187
          /tmp/wp eval 'if(Pferdeportal_Affiliate_Router::VERSION!=="6.72.187"){exit(2);} echo "PASS 6.72.187 active\n";' --path=/tmp/wp187

      - name: Universal all-content topic gate
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp eval-file "$GITHUB_WORKSPACE/AFFILIATE_HOBBYRAUM/test_banner_strict_best_tier_all_contexts_v672187.php" --path=/tmp/wp187 | tee /tmp/all187.log
          grep -F 'STRICT_BEST_TIER_ALL_ACTIVE_CONTEXTS_672187_PASS' /tmp/all187.log
          grep -F '"failures":0' /tmp/all187.log
          grep -F 'PASS PERFORMANCE_zero_frontend_http :: http=0' /tmp/all187.log

      - name: Full render positive-negative
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp eval-file "$GITHUB_WORKSPACE/AFFILIATE_HOBBYRAUM/test_banner_full_e2e_v672187.php" --path=/tmp/wp187 | tee /tmp/full187.log
          grep -F 'failures=0' /tmp/full187.log
          grep -F 'FULL_WORDPRESS_MARIADB_BANNER_E2E_672187_TOPIC_ONLY_PASS' /tmp/full187.log

      - name: Destination library regression
        shell: bash
        run: |
          set -euo pipefail
          sed "s/6\\.72\\.183/6.72.187/g" AFFILIATE_HOBBYRAUM/test_banner_destination_library_e2e_v672183.php >/tmp/dest187.php
          /tmp/wp eval-file /tmp/dest187.php --path=/tmp/wp187 | tee /tmp/dest187.log
          grep -F 'SUMMARY passes=26 failures=0' /tmp/dest187.log
          grep -F 'FULL_DESTINATION_LIBRARY_WORDPRESS_MARIADB_E2E_PASS' /tmp/dest187.log

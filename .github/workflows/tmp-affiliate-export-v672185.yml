name: TEMP Export Affiliate 6.72.185

on:
  push:
    branches: [affiliate-release-current]
    paths:
      - '.github/workflows/tmp-affiliate-export-v672185.yml'

permissions:
  contents: read

jobs:
  export-tested-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact committed installer
        shell: bash
        run: |
          set -euo pipefail
          ZIP=release/affiliate-zentrale/artifacts/final/AFFILIATE_ZENTRALE_6.72.185.zip
          echo '13fff3d67507d152e5368da9d7fc99028f8d26ad6d19338bb0cad1f44463fa28  '\"$ZIP\" | sha256sum -c -
          rm -rf /tmp/export185
          mkdir -p /tmp/export185
          unzip -q "$ZIP" -d /tmp/export185
          grep -F 'Version: 6.72.185' /tmp/export185/affiliate-portal-router/pferdeportal-affiliate-router.php
          grep -F "const VERSION = '6.72.185';" /tmp/export185/affiliate-portal-router/pferdeportal-affiliate-router.php
          test "$(find /tmp/export185/affiliate-portal-router -type f | wc -l)" = "27"
          echo "PASS exact committed 6.72.185 installer"

      - name: Upload exact tested installer
        uses: actions/upload-artifact@v4
        with:
          name: AFFILIATE_ZENTRALE_6.72.185_TESTED
          path: release/affiliate-zentrale/artifacts/final/AFFILIATE_ZENTRALE_6.72.185.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

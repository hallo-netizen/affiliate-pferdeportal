name: V6635 Real WordPress MariaDB Gate

on:
  push:
    branches:
      - v6635-private-public-freshness-parity-20260829
  workflow_dispatch:

jobs:
  real-db-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.4 with mysqli
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, mbstring, curl, zip
          coverage: none

      - name: Assemble and bind exact V6.63.5 patch
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/v6635.patch
          for f in \
            CI_V6635/patchchunks/chunk_00.b64 \
            CI_V6635/patchchunks/chunk_01.b64 \
            CI_V6635/patchchunks/chunk_02.b64 \
            CI_V6635/patchchunks/chunk_03.b64 \
            CI_V6635/patchchunks/chunk_04.b64 \
            CI_V6635/patchchunks/chunk_05_0.b64 \
            CI_V6635/patchchunks/chunk_05_1.b64 \
            CI_V6635/patchchunks/chunk_05_2.b64 \
            CI_V6635/patchchunks/chunk_06_0.b64 \
            CI_V6635/patchchunks/chunk_06_1.b64 \
            CI_V6635/patchchunks/chunk_06_2.b64; do
            base64 -d "$f" >> /tmp/v6635.patch
          done
          echo '8bae81f1715a5ac235b5a8bb8e9c085dff2d699ef41bd1921704879f15cd6c41  /tmp/v6635.patch' | sha256sum -c -
          git apply --check /tmp/v6635.patch

      - name: Install WP-CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp
          /tmp/wp --info

      - name: Fresh WordPress 7.0.1 on MariaDB 11.4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wp-old
          /tmp/wp core download --path=/tmp/wp-old --version=7.0.1 --force
          /tmp/wp config create --path=/tmp/wp-old --dbname=wordpress --dbuser=wp --dbpass=wp --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-old --url=http://example.test --title=Gate --admin_user=admin --admin_password='GatePass-6635!' --admin_email=admin@example.test --skip-email
          mysql -h127.0.0.1 -uroot -proot -Nse 'SELECT VERSION(); SELECT ENGINE FROM information_schema.ENGINES WHERE ENGINE="InnoDB" AND SUPPORT IN ("YES","DEFAULT");'

      - name: NEGATIVE exact live state on V6.63.4 with real MariaDB
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wp-old/wp-content/plugins/affiliate-portal-router
          cp -a affiliate-portal-router /tmp/wp-old/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-old
          GATE_MODE=negative /tmp/wp eval-file "$GITHUB_WORKSPACE/CI_V6635/real_db_gate.php" --path=/tmp/wp-old
          /tmp/wp plugin deactivate affiliate-portal-router --path=/tmp/wp-old

      - name: Apply rootfix and verify actual payload identity
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/v6635.patch
          git diff --check
          cd affiliate-portal-router
          sha256sum -c ../CI_V6635/V6635_PAYLOAD_SHA256.txt
          test "$(find . -type f | wc -l)" -eq 20
          cd ..
          zip -qr /tmp/affiliate-zentrale_v6.63.5.zip affiliate-portal-router
          rm -rf /tmp/v6635-unpack && mkdir /tmp/v6635-unpack
          unzip -q /tmp/affiliate-zentrale_v6.63.5.zip -d /tmp/v6635-unpack
          cd /tmp/v6635-unpack/affiliate-portal-router
          sha256sum -c "$GITHUB_WORKSPACE/CI_V6635/V6635_PAYLOAD_SHA256.txt"

      - name: POSITIVE upgrade recovery with same UUID on real MariaDB
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp plugin install /tmp/affiliate-zentrale_v6.63.5.zip --path=/tmp/wp-old --force --activate
          GATE_MODE=positive /tmp/wp eval-file "$GITHUB_WORKSPACE/CI_V6635/real_db_gate.php" --path=/tmp/wp-old

      - name: Fresh WP + fresh database + actual V6.63.5 installer
        shell: bash
        run: |
          set -euo pipefail
          mysql -h127.0.0.1 -uroot -proot -e 'CREATE DATABASE wordpress_fresh CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON wordpress_fresh.* TO "wp"@"%"; FLUSH PRIVILEGES;'
          mkdir -p /tmp/wp-fresh
          /tmp/wp core download --path=/tmp/wp-fresh --version=7.0.1 --force
          /tmp/wp config create --path=/tmp/wp-fresh --dbname=wordpress_fresh --dbuser=wp --dbpass=wp --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-fresh --url=http://fresh.example.test --title=FreshGate --admin_user=admin --admin_password='GatePass-6635!' --admin_email=admin@example.test --skip-email
          /tmp/wp plugin install /tmp/affiliate-zentrale_v6.63.5.zip --path=/tmp/wp-fresh --activate
          GATE_MODE=positive /tmp/wp eval-file "$GITHUB_WORKSPACE/CI_V6635/real_db_gate.php" --path=/tmp/wp-fresh
          /tmp/wp option get ppar_ebay_run_state_v1 --format=json --path=/tmp/wp-fresh | grep -F '74b8372b-f481-493b-8485-1e98188ef02c'
          echo REAL_WORDPRESS_MARIADB_FRESH_INSTALL_PASS

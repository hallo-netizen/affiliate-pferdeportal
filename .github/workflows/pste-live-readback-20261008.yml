name: PSTE Live Readback 2026-10-08
on:
  push:
    branches: [pste-kiss-e2e-20261005]
    paths:
      - '.github/workflows/pste-live-readback-20261008.yml'

jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - name: Public GET-only live readback
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local label="$1" url="$2"
            echo "=== $label ==="
            code="$(curl -sS -L --max-time 30 -A 'Mozilla/5.0 PSTE-readback' -o /tmp/body -w '%{http_code}' "$url" || true)"
            bytes="$(wc -c </tmp/body 2>/dev/null || echo 0)"
            echo "URL=$url"
            echo "HTTP=$code"
            echo "BYTES=$bytes"
            if [ -s /tmp/body ]; then
              head -c 30000 /tmp/body
              echo
            fi
          }

          probe PSERC_PACKAGE_BINDING 'https://pferde-atelier.de/wp-content/plugins/portal-seo-editorial-plan-compiler/contracts/compiler-package-binding-v1.json'
          probe PSERC_SEO_BINDING 'https://pferde-atelier.de/wp-content/plugins/portal-seo-editorial-plan-compiler/contracts/seo-engine-capability-binding-v2.json'
          probe PSERC_TOPIC_GATE 'https://pferde-atelier.de/wp-content/plugins/portal-seo-editorial-plan-compiler/contracts/portal-topic-evidence-gate-v1.json'
          probe WP_PLUGINS_ROUTE 'https://pferde-atelier.de/wp-json/wp/v2/plugins'
          probe PSTE_README 'https://pferde-atelier.de/wp-content/plugins/portal-seo-topic-engine/readme.txt'
          probe PSTE_MAIN_HTTP 'https://pferde-atelier.de/wp-content/plugins/portal-seo-topic-engine/portal-seo-topic-engine.php'

          echo '=== WP_JSON_RELEVANT_ROUTES ==='
          curl -sS -L --max-time 30 -A 'Mozilla/5.0 PSTE-readback' 'https://pferde-atelier.de/wp-json/' -o /tmp/wpjson || true
          python3 - <<'PY'
          import json,re
          try:
              d=json.load(open('/tmp/wpjson',encoding='utf-8'))
          except Exception as e:
              print('WP_JSON_PARSE_FAILED='+type(e).__name__)
              raise SystemExit(0)
          for route in sorted((d.get('routes') or {})):
              if re.search(r'pste|pserc|seo|topic|themen|editorial|plugin|source|export',route,re.I):
                  print(route)
          PY

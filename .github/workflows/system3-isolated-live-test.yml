name: System3 Isolated Live Test

on:
  pull_request:
    paths:
      - 'isolated_system3/**'
      - '.github/workflows/system3-isolated-live-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-boundary-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated live boundary
        run: |
          rm -rf isolated_system3/live_output
          python -m isolated_system3.live_test \
            --input isolated_system3/live_fixture/wordpress_input.json \
            --evidence isolated_system3/live_fixture/stage_evidence.json \
            --output isolated_system3/live_output/SYSTEM3-LIVE-001.json
      - name: Prove output gate is non-writing and sealed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from isolated_system3.engine import _sha256
          p = Path('isolated_system3/live_output/SYSTEM3-LIVE-001.json')
          assert p.is_file(), 'LIVE_OUTPUT_MISSING'
          e = json.loads(p.read_text(encoding='utf-8'))
          assert e['contract'] == 'SYSTEM3_WORDPRESS_DRAFT_ENVELOPE_V1'
          assert e['publish_allowed'] is False
          assert e['wordpress_write_allowed'] is False
          supplied = e.pop('envelope_hash')
          assert supplied == _sha256(e), 'LIVE_OUTPUT_HASH_FAIL'
          assert e['result']['trace'] == ['INGRESS','CAPSULE','RESEARCH','FACT_CHECK','DRAFT','LANGUAGE','RULE_CHECK','QUALITY_CHECK','OUTPUT_GATE','DONE']
          print('SYSTEM3_LIVE_OUTPUT_GATE_PASS')
          PY

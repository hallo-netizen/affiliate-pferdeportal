name: V6.46 full release verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  v646-release:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'v646-public-freshness-20260820'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:11.4
        ports:
          - 3306:3306
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: v646gate
          MARIADB_USER: wp
          MARIADB_PASSWORD: wppass
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uwp -pwppass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout PR merge with immutable base package
        uses: actions/checkout@v4
      - name: Set up PHP 8.4 with mysqli and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          tools: wp-cli
          coverage: none
      - name: Execute complete fail-closed V6.46 workflow
        run: |
          chmod +x .github/scripts/run-v646-full-release.sh
          .github/scripts/run-v646-full-release.sh
      - name: Upload final verified V6.46 release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V646_FINAL_VERIFIED_RELEASE
          path: |
            affiliate-zentrale_v6.46.0_PUBLIC_FRESHNESS_SELECTION_CONTRACT_ROOTFIX_REALGATE.zip
            MASTER_AFFILIATE_ZENTRALE_V6_46_0_PUBLIC_FRESHNESS_SELECTION_CONTRACT_ROOTFIX_REALGATE_20260820.zip
            V646_RELEASE_EVIDENCE/
          if-no-files-found: error
          retention-days: 7
      - name: Upload blocked evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V646_BLOCKED_EVIDENCE
          path: V646_RELEASE_EVIDENCE/
          if-no-files-found: warn
          retention-days: 7

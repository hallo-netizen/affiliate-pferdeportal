name: Category Integration Pferdeportal Kategorien Candidate

on:
  push:
    branches: [affiliate-release-current]
    paths:
      - 'CATEGORY_INTEGRATION_HOBBYRAUM/PFERDEPORTAL_KATEGORIEN_CANDIDATE/**'
      - '.github/workflows/category-integration-pferdeportal-kategorien-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-hardtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify 0.2.0 candidate and run fail-closed hardtest
        shell: bash
        run: |
          set -euo pipefail
          ZIP=CATEGORY_INTEGRATION_HOBBYRAUM/PFERDEPORTAL_KATEGORIEN_CANDIDATE/PFERDEPORTAL_KATEGORIEN_V0.2.0_CANDIDATE_MIN.zip
          printf '%s  %s\n' 'f6e44873200339b29b73b15848167719a822feb4d844d049fb31e0c72d308437' "$ZIP" | sha256sum -c -
          rm -rf /tmp/pferdeportal-kategorien
          mkdir -p /tmp/pferdeportal-kategorien
          unzip -q "$ZIP" -d /tmp/pferdeportal-kategorien
          php -l /tmp/pferdeportal-kategorien/pferdeportal-kategorien.php
          php /tmp/pferdeportal-kategorien/tests/synthetic.php | tee /tmp/pferdeportal-kategorien-test.log
          grep -F 'PFERDEPORTAL_KATEGORIEN_V020_SYNTHETIC_HARDTEST_PASS' /tmp/pferdeportal-kategorien-test.log
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: pferdeportal-kategorien-v020-candidate-evidence
          path: /tmp/pferdeportal-kategorien-test.log
          if-no-files-found: error

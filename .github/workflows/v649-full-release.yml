            '39d59acb71333226c4f2867fa5628e5f96dfc326c89f0858399348f0e3fae6df  .github/v649/V649_GATE_BUNDLE.b64.tail.07a' \
            'ccefb9e66b4b19ce44cd8fff7efc7c6a3cfffe462f92cfe1142ee8468efc86cd  .github/v649/V649_GATE_BUNDLE.b64.tail.07b' \
            'c13ff852ddd02f998576b32cfd286a063dc0bbdb9bbc27f39f4d76281bb9cebc  .github/v649/V649_GATE_BUNDLE.b64.tail.08a' \
            'c191932e3fe71205ed4914f704d224c1266d2c76e16d6d798b44de5ebe7f0d86  .github/v649/V649_GATE_BUNDLE.b64.tail.08b0' \
            '98c87da8125d3c6830b02defc808ee06ef902210854ebe51850a65caee3e49f1  .github/v649/V649_GATE_BUNDLE.b64.tail.08b1' \
            '01a8aaf83c4701d0e9ab3191ae6931ab6b7ac5e9420000d0b45725189e370c10  .github/v649/V649_GATE_BUNDLE.b64.tail.09a0' \
            'b8a74066c8051861bc346e1faa76fda910c664ed85d8a88757eed7648869ec89  .github/v649/V649_GATE_BUNDLE.b64.tail.09a1' \
            'c7cba7c8894e3e1bbe44676c33f784de7de6799cb723035f76518d797cfa9800  .github/v649/V649_GATE_BUNDLE.b64.tail.09b0' \
            '5aff1af7d8f4b0ba0a5bbe754e91d9f853d9ce3ce001e8c48cee57042de6f17f  .github/v649/V649_GATE_BUNDLE.b64.tail.09b1' | sha256sum -c -
          cat \
            .github/v649/V649_GATE_BUNDLE.zip.part.0{0,1,2,3,4,5,6} \
            .github/v649/V649_GATE_BUNDLE.b64.tail.0{0,1,2,3,4,5} \
            .github/v649/V649_GATE_BUNDLE.b64.tail.06{a,b} \
            .github/v649/V649_GATE_BUNDLE.b64.tail.07{a,b} \
            .github/v649/V649_GATE_BUNDLE.b64.tail.08a \
            .github/v649/V649_GATE_BUNDLE.b64.tail.08b{0,1} \
            .github/v649/V649_GATE_BUNDLE.b64.tail.09a{0,1} \
            .github/v649/V649_GATE_BUNDLE.b64.tail.09b{0,1} > /tmp/v649.b64
          test "$(wc -c < /tmp/v649.b64 | tr -d ' ')" = '47872'
          base64 -d /tmp/v649.b64 > /tmp/v649.zip
          echo 'c17e47d04f71b3c4ab2a72d11e4ff271f77074329b8ecca384b5daf12907b357  /tmp/v649.zip' | sha256sum -c -
          unzip -t /tmp/v649.zip >/dev/null
          unzip -qo /tmp/v649.zip -d "$GITHUB_WORKSPACE"
          chmod +x .github/scripts/run-v649-full-release.sh

      - name: Execute complete fail-closed V6.49 release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/run-v649-full-release.sh

      - name: Upload final verified V6.49 release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V649_FINAL_VERIFIED_RELEASE
          path: |
            affiliate-zentrale_v6.49.0_PUBLIC_COVERAGE_TARGET_BRIDGE_ROOTFIX_REALGATE.zip
            MASTER_AFFILIATE_ZENTRALE_V6_49_0_PUBLIC_COVERAGE_TARGET_BRIDGE_ROOTFIX_REALGATE_20260821.zip
            V649_RELEASE_EVIDENCE/
          if-no-files-found: error
          retention-days: 90

      - name: Upload blocked V6.49 evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V649_BLOCKED_EVIDENCE
          path: V649_RELEASE_EVIDENCE/
          if-no-files-found: warn
          retention-days: 14

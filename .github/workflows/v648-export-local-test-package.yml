name: V6.48 export immutable local test package

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-local-test-package:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'v648-canonical-refresh-authority-rootcause-20260821'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4
      - name: Verify exact branch baseline package
        shell: bash
        run: |
          set -euo pipefail
          test -f CODEX_V645_REALGATE_SOURCE_AND_EXACT_TASK_20260820.zip
          test -f .github/scripts/run-v646-full-release.sh
          test -d .github/v646
          sha256sum CODEX_V645_REALGATE_SOURCE_AND_EXACT_TASK_20260820.zip | tee V648_LOCAL_TEST_PACKAGE_SHA256.txt
          unzip -t CODEX_V645_REALGATE_SOURCE_AND_EXACT_TASK_20260820.zip >/dev/null
      - name: Upload complete local regression harness
        uses: actions/upload-artifact@v4
        with:
          name: V648_LOCAL_TEST_PACKAGE
          path: |
            CODEX_V645_REALGATE_SOURCE_AND_EXACT_TASK_20260820.zip
            V648_LOCAL_TEST_PACKAGE_SHA256.txt
            .github/scripts/run-v646-full-release.sh
            .github/v646
          if-no-files-found: error

name: V6.48 export immutable local test package

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-local-test-package:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'v648-canonical-refresh-authority-rootcause-20260821'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4
      - name: Verify exact branch baseline package
        shell: bash
        run: |
          set -euo pipefail
          test -f CODEX_V645_REALGATE_SOURCE_AND_EXACT_TASK_20260820.zip
          echo '6695085486f38680a203c31e0b5408aee378c907a31ce65204f88ab38b9fbbf4  CODEX_V645_REALGATE_SOURCE_AND_EXACT_TASK_20260820.zip' | sha256sum -c -
          unzip -t CODEX_V645_REALGATE_SOURCE_AND_EXACT_TASK_20260820.zip >/dev/null
          test -f .github/v646/v646_relative.patch
          test -f .github/v646/SOURCE_SHA256.txt
          test -f .github/v646/real/public_freshness_contract_v646.php
          sha256sum CODEX_V645_REALGATE_SOURCE_AND_EXACT_TASK_20260820.zip .github/v646/v646_relative.patch .github/v646/SOURCE_SHA256.txt .github/v646/real/public_freshness_contract_v646.php > V648_LOCAL_TEST_PACKAGE_SHA256.txt
      - name: Upload exact local regression prerequisites
        uses: actions/upload-artifact@v4
        with:
          name: V648_LOCAL_TEST_PACKAGE
          path: |
            CODEX_V645_REALGATE_SOURCE_AND_EXACT_TASK_20260820.zip
            .github/v646/v646_relative.patch
            .github/v646/SOURCE_SHA256.txt
            .github/v646/real/public_freshness_contract_v646.php
            V648_LOCAL_TEST_PACKAGE_SHA256.txt
          if-no-files-found: error
          retention-days: 90

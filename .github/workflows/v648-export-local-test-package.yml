name: V6.48 export immutable local test package

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-local-test-package:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'v648-canonical-refresh-authority-rootcause-20260821'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4
      - name: Verify immutable package
        shell: bash
        run: |
          set -euo pipefail
          test -f CODEX_V645_REALGATE_SOURCE_AND_EXACT_TASK_20260820.zip
          echo '07d7fe3a35723d060cdc064463354cbc329456d7a7efb7ab86c784c9bb96006b  CODEX_V645_REALGATE_SOURCE_AND_EXACT_TASK_20260820.zip' | sha256sum -c -
          unzip -t CODEX_V645_REALGATE_SOURCE_AND_EXACT_TASK_20260820.zip >/dev/null
      - name: Upload immutable local test package
        uses: actions/upload-artifact@v4
        with:
          name: V648_LOCAL_TEST_PACKAGE
          path: CODEX_V645_REALGATE_SOURCE_AND_EXACT_TASK_20260820.zip
          if-no-files-found: error

name: HD009 0.1.32 contextual DataForSEO product research validation
on:
  push:
    branches: [hobbyroom/hd009-032-dfs-keyword-context-20261108]
    paths:
      - ops/hobby_dfs_032/build.py
      - ops/hobby_dfs_032/test.py
      - .github/workflows/hd009-032-build.yml
permissions: {contents: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact complete HD009 and syntax-check all PHP
        run: python3 ops/hobby_dfs_032/build.py
      - name: Test original PHP against original hobby catalog and simulated DataForSEO
        run: python3 ops/hobby_dfs_032/test.py
      - name: Ensure no existing provider or site design code modified
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root=Path('protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE')
          with ZipFile(root/'HOBBY_DEPOT_AFFILIATE_HD009_0.1.31.zip') as a,ZipFile(root/'CURRENT.zip') as b:
            assert len(a.namelist())==len(b.namelist())==41
            changed=[n for n in a.namelist() if a.read(n)!=b.read(n)]
            assert set(changed)=={'affiliate-portal-router/hobby-depot-affiliate-router.php',
              'affiliate-portal-router/includes/class-hdar-amazon-start.php'},changed
            print('HD009_ONLY_TWO_EXISTING_PHP_CHANGED_PASS',changed)
          PY
      - name: Save fully tested version and byte-identical CURRENT in staging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE/CURRENT.zip
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE/HOBBY_DEPOT_AFFILIATE_HD009_0.1.32.zip
          if ! git diff --cached --quiet; then
            git commit -m 'HD009 0.1.32: contextual equipment keyword validation and budget consent reset'
            git push origin HEAD:hobbyroom/hd009-032-dfs-keyword-context-20261108
          else
            echo 'HD009_032_TESTED_ZIPS_ALREADY_SAVED'
          fi

# Isolated message workflow; live acceptance requires automatic successor evidence.
name: Pferde Atelier eBay Nachrichten
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: pferdeatelier-ebay-deletion-only
  cancel-in-progress: false
jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      started: ${{ steps.start.outputs.started }}
    steps:
      - name: Record run start
        id: start
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Run existing message worker only
        env:
          DELETION_KEY: ${{ secrets.PFERDEATELIER_EBAY_DELETION_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DELETION_KEY" =~ ^[a-f0-9]{64}$ ]] || { echo 'Message key not configured'; exit 1; }
          URL='https://pferde-atelier.de/wp-json/affiliate-zentrale/v1/ebay/account-deletion-tick'
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          total=0
          errors=0
          for n in 1 2 3 4; do
            code=$(curl --silent --show-error --max-time 45 --request POST --header "X-PPAR-Deletion-Key: $DELETION_KEY" --header 'Cache-Control: no-store' --output "$body" --write-out '%{http_code}' "$URL")
            [[ "$code" == 200 ]] || { echo "Message request failed HTTP $code"; exit 1; }
            status=$(jq -er 'select(.contract == "ebay_deletion_tick_v1") | .status | select(. == "pending" or . == "empty" or . == "busy")' "$body")
            processed=$(jq -er '.processed | select(type == "number" and . >= 0 and . <= 3 and . == floor)' "$body")
            attempted=$(jq -er '.attempted | select(type == "number" and . >= 0 and . <= 3 and . == floor)' "$body")
            [[ "$processed" -le "$attempted" ]] || { echo 'Invalid message counts'; exit 1; }
            error=$(jq -er '(.error // "") | select(type == "string" and test("^[a-z0-9_-]{0,80}$"))' "$body")
            total=$((total + processed))
            jq -c '{status,attempted,processed,error,duration_seconds,peak_memory_bytes}' "$body"
            if [[ -n "$error" ]]; then errors=$((errors + 1)); fi
            [[ "$status" == pending ]] || break
            [[ "$n" == 4 ]] || sleep 15
          done
          echo "Processed in this run: $total; responses with errors: $errors; final status: $status"
          if [[ "$errors" -gt 0 ]]; then
            echo '::error::Message processing reported an error; affected messages remain pending.'
            exit 1
          fi
          if [[ "$status" == pending && "$total" -eq 0 ]]; then
            echo '::warning::Pending messages but no progress in this run; automatic retries remain enabled.'
            exit 1
          fi
          if [[ "$status" == busy ]]; then
            echo '::notice::Message worker already active; next scheduled invocation remains enabled.'
          fi

  successor:
    needs: inbox
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: write
    steps:
      - name: Dispatch only the next message run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ needs.inbox.outputs.started }}
        run: |
          set -euo pipefail
          now=$(date +%s)
          if [[ "$STARTED" =~ ^[0-9]{1,10}$ ]] && (( STARTED <= now )); then
            delay=$((300 - (now - STARTED)))
            if (( delay > 0 )); then sleep "$delay"; fi
          else
            sleep 300
          fi
          dispatch_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pferde-atelier-ebay-deletion.yml/dispatches"
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          for attempt in 1 2 3; do
            code=$(curl --silent --show-error --output "$body" --write-out '%{http_code}' --request POST --max-time 30 \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data '{"ref":"main"}' "$dispatch_url" || true)
            if [[ "$code" == 204 ]]; then
              echo 'Next message run dispatched.'
              exit 0
            fi
            echo "Successor dispatch attempt $attempt failed HTTP ${code:-none}"
            [[ "$attempt" == 3 ]] || sleep 10
          done
          echo '::error::Message successor dispatch failed; fallback schedule remains configured.'
          exit 1

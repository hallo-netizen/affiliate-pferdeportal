name: V6.45 full real gate after Gate D harness proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v645-realgate-corrected-gated.yml'
      - '.github/overlays/v645/soft_failure_recovery.php'

permissions:
  contents: read

jobs:
  realgate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: v645gate
          MARIADB_USER: wp
          MARIADB_PASSWORD: wppass
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uwp -pwppass"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          tools: wp-cli
          coverage: none

      - name: Build auditable test-only Gate D overlay package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p V645_EVIDENCE /tmp/v645-overlay
          ZIP=CODEX_V645_REALGATE_SOURCE_AND_EXACT_TASK_20260820.zip
          ROOT=CODEX_V645_REALGATE_SOURCE_AND_EXACT_TASK_20260820
          sha256sum "$ZIP" > V645_EVIDENCE/original_package_sha256.txt
          unzip -q "$ZIP" -d /tmp/v645-overlay
          cp /tmp/v645-overlay/$ROOT/03_REAL_GATE/soft_failure_recovery.php V645_EVIDENCE/gate_d_original.php
          cp .github/overlays/v645/soft_failure_recovery.php /tmp/v645-overlay/$ROOT/03_REAL_GATE/soft_failure_recovery.php
          cp .github/overlays/v645/soft_failure_recovery.php V645_EVIDENCE/gate_d_corrected.php
          diff -u V645_EVIDENCE/gate_d_original.php V645_EVIDENCE/gate_d_corrected.php > V645_EVIDENCE/gate_d_harness_only.diff || true
          {
            echo 'TEST_HARNESS_ONLY=YES'
            echo 'PRODUCTION_SOURCE_CHANGED=NO'
            echo 'CAUSE_PROOF=V6.44 start/adoption always freezes config_snapshot; previous Gate D omitted it and real first tick failed selection_scope_empty.'
            echo 'NEGATIVE_CASE_PRESERVED=YES; missing snapshot is explicitly asserted to fail closed.'
          } > V645_EVIDENCE/gate_d_overlay_manifest.txt
          rm -f "$ZIP"
          (cd /tmp/v645-overlay && zip -qr "$GITHUB_WORKSPACE/$ZIP" "$ROOT")
          unzip -t "$ZIP" > V645_EVIDENCE/corrected_package_unzip_test.txt
          sha256sum "$ZIP" > V645_EVIDENCE/corrected_package_sha256.txt
          cd /tmp/v645-overlay/$ROOT/02_SOURCE_V645
          sha256sum -c SOURCE_SHA256.txt > "$GITHUB_WORKSPACE/V645_EVIDENCE/production_source_sha256_after_overlay.txt"

      - name: Run entire source gate and real A-H gate from scratch
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          chmod +x .github/scripts/run-v645-realgate-ci.sh
          .github/scripts/run-v645-realgate-ci.sh

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V645_FULL_REALGATE_AFTER_GATE_D_PROOF
          path: |
            CODEX_V645_REALGATE_EVIDENCE_GHA_20260820.zip
            V645_EVIDENCE/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce full gate result
        if: always()
        shell: bash
        run: test "${{ steps.gate.outcome }}" = "success"

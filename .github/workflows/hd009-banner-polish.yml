name: HD009 checked banner ZIP build
on:
  push:
    branches:
      - 'hobbyroom/hd009-banner-polish-20261107'
    paths:
      - '.github/workflows/hd009-banner-polish.yml'
      - 'ops/hd009/banner_polish.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify exact HD009 ZIP
        run: python3 ops/hd009/banner_polish.py
      - name: Save tested ZIP on staging branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE/CURRENT.zip
          git commit -m "HD009 0.1.20: gradient headers, quiet square CTAs and wider photo framing"
          git push origin HEAD:hobbyroom/hd009-banner-polish-20261107

name: HD009 banner source inspection
on:
  push:
    branches:
      - 'hobbyroom/hd009-banner-polish-20261107'
    paths:
      - '.github/workflows/hd009-banner-polish.yml'
      - 'ops/hd009/banner_polish.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact current HD009 ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, re, hashlib
          p='protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE/CURRENT.zip'
          z=zipfile.ZipFile(p)
          print('ZIP_BYTES',__import__('os').path.getsize(p))
          print('ZIP_SHA256',hashlib.sha256(open(p,'rb').read()).hexdigest())
          for n in z.namelist():
              if re.search(r'hdar|amazon|idealo|dataforseo|\.css$',n,re.I):
                  print('ZIP_ENTRY',n)
          for n in z.namelist():
              if not n.endswith(('.css','.php','.js')):continue
              s=z.read(n).decode('utf8',errors='replace')
              if 'hdar-amazon-start' in n:
                  print('CSS_FILE',n,'LENGTH',len(s),'FULL_CSS_START')
                  print(s[-24000:])
                  print('FULL_CSS_END')
              if n.endswith('.php') and re.search('hdar_ci_amazon_banner|dataforseo',s,re.I):
                  ls=s.splitlines()
                  print('TARGET_PHP_FILE',n,'LINES',len(ls))
                  for i,line in enumerate(ls):
                      if re.search('hdar_ci_amazon_banner|DataForSEO|dataforseo|hdar-amazon-start',line,re.I):
                          print('CONTEXT',i+1,'\n'.join(f'{j+1}: {ls[j][:220]}' for j in range(max(0,i-3),min(len(ls),i+5))))
          PY

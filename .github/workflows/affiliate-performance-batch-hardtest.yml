name: Affiliate Performance Batch Hardtest

on:
  push:
    branches: [affiliate-release-current]
    paths:
      - 'AFFILIATE_HOBBYRAUM/performance-cache/apply_performance_batch_patch.py'
      - 'AFFILIATE_HOBBYRAUM/performance-cache/test_request_local_batch_cache.php'
      - 'AFFILIATE_HOBBYRAUM/performance-cache/real_wordpress_mariadb_batch_gate.php'
      - '.github/workflows/affiliate-performance-batch-hardtest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-batch-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated affiliate source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/affiliate-perf
          mkdir -p /tmp/affiliate-perf
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/affiliate-perf/affiliate-portal-router

      - name: Apply 6.72.144 request-cache delta then 6.72.145 batch delta
        shell: bash
        run: |
          set -euo pipefail
          python3 AFFILIATE_HOBBYRAUM/performance-cache/apply_performance_cache_patch.py /tmp/affiliate-perf/affiliate-portal-router
          python3 AFFILIATE_HOBBYRAUM/performance-cache/apply_performance_batch_patch.py /tmp/affiliate-perf/affiliate-portal-router

      - name: Assert code patch scope is limited
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          base=Path('release/affiliate-zentrale/current/affiliate-portal-router')
          work=Path('/tmp/affiliate-perf/affiliate-portal-router')
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          rels=sorted(set([p.relative_to(base).as_posix() for p in base.rglob('*') if p.is_file()]+[p.relative_to(work).as_posix() for p in work.rglob('*') if p.is_file()]))
          changed=[r for r in rels if not (base/r).is_file() or not (work/r).is_file() or h(base/r)!=h(work/r)]
          expected=sorted([
            'includes/trait-ppar-control-contract.php',
            'includes/trait-ppar-ebay-account-deletion.php',
            'includes/trait-ppar-ebay.php',
            'includes/trait-ppar-output-objects.php',
          ])
          print('CHANGED',changed)
          if changed!=expected: raise SystemExit(f'FAIL unexpected patch scope: {changed}')
          print('PASS exact four-file cache/batch scope')
          PY

      - name: PHP syntax all plugin files
        shell: bash
        run: |
          set -euo pipefail
          find /tmp/affiliate-perf/affiliate-portal-router -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run distinct-key batch positive-negative hardtest
        shell: bash
        run: |
          set -euo pipefail
          cp AFFILIATE_HOBBYRAUM/performance-cache/test_request_local_batch_cache.php /tmp/affiliate-perf/test_request_local_batch_cache.php
          cd /tmp/affiliate-perf
          php test_request_local_batch_cache.php

      - name: Existing banner distribution regression
        run: php AFFILIATE_HOBBYRAUM/test_banner_distribution_behavior.php

      - name: Existing Awin OTTO regression hashes
        run: php AFFILIATE_HOBBYRAUM/test_adcell_awin_otto_unchanged.php

  real-wordpress-mariadb-batch:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Install WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          /tmp/wp --info

      - name: Install exact WordPress 7.1.1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wp-site
          mkdir -p /tmp/wp-site
          /tmp/wp core download --path=/tmp/wp-site --version=7.1.1 --force
          /tmp/wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title='Affiliate Batch Perf CI' --admin_user=admin --admin_password='ci-password-123!' --admin_email=ci@example.test --skip-email

      - name: Prepare exact two-stage performance delta
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/plugin-work
          mkdir -p /tmp/plugin-work
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/plugin-work/affiliate-portal-router
          python3 AFFILIATE_HOBBYRAUM/performance-cache/apply_performance_cache_patch.py /tmp/plugin-work/affiliate-portal-router
          python3 AFFILIATE_HOBBYRAUM/performance-cache/apply_performance_batch_patch.py /tmp/plugin-work/affiliate-portal-router
          cp -a /tmp/plugin-work/affiliate-portal-router /tmp/wp-site/wp-content/plugins/affiliate-portal-router

      - name: Activate plugin
        run: /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-site

      - name: Install ephemeral real DB batch gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wp-site/wp-content/mu-plugins
          cp AFFILIATE_HOBBYRAUM/performance-cache/real_wordpress_mariadb_batch_gate.php /tmp/wp-site/wp-content/mu-plugins/ppar-performance-batch-gate.php

      - name: Run exact residual-count WordPress MariaDB gate
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8080 -t /tmp/wp-site >/tmp/wp-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:8080/?ppar_perf_batch_gate=1' | tee /tmp/perf-batch-gate.txt
          grep -F 'REAL_WORDPRESS_MARIADB_PERFORMANCE_BATCH_PASS' /tmp/perf-batch-gate.txt

      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/wp-server.log || true

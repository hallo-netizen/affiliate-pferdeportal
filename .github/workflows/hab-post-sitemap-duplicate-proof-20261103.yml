name: Hab live post-sitemap duplicate origin
on:
  push:
    branches:
      - hobbyroom/hab-seo-after-install-verification-20261103
permissions: {contents: read}
jobs:
  exact-rest-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Locate root URL among actual published posts
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json
          base='https://hab-und-bewahr.de'
          url=base+'/wp-json/wp/v2/posts?'+urllib.parse.urlencode({'per_page':'100','_fields':'id,slug,link,status,type'})
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          try:
            with urllib.request.urlopen(req,timeout=20) as r:
              d=json.loads(r.read())
              print('POST_LIST_HTTP',r.status,'POST_COUNT',len(d),'POSTS',[(p.get('id'),p.get('slug'),p.get('link')) for p in d])
              print('ROOT_URL_POSTS',[p for p in d if p.get('link')==base+'/'])
          except Exception as e:print('REST_ERROR',type(e).__name__,str(e))
          PY

name: Template Kit 1.50.559 Source Readonly

on:
  push:
    branches:
      - template-kit-150559-source-readonly-20260925

permissions:
  contents: read

jobs:
  fetch-current-template-source:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact installed main file read-only
        shell: bash
        run: |
          set -u
          mkdir -p out
          URL='https://pferde-atelier.de/wp-content/plugins/affiliate-portal-template-kit/pferde-template-kit.php'
          STATUS="$(curl -A 'Mozilla/5.0' -L --silent --show-error --connect-timeout 15 --max-time 90 -D out/headers.txt -o out/pferde-template-kit.php -w '%{http_code}' "$URL" || true)"
          printf '%s\n' "$STATUS" > out/http_status.txt
          printf '%s\n' "$URL" > out/url.txt
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          status=Path('out/http_status.txt').read_text().strip()
          p=Path('out/pferde-template-kit.php')
          result={'http_status':status}
          if p.is_file():
              raw=p.read_bytes()
              text=raw.decode('utf-8',errors='replace')
              hm=re.search(r'^\s*\*\s*Version:\s*([0-9.]+)\s*$',text,re.M)
              cm=re.search(r"const\s+VERSION\s*=\s*'([^']+)'\s*;",text)
              result.update({
                  'bytes':len(raw),
                  'sha256':hashlib.sha256(raw).hexdigest(),
                  'header_version':hm.group(1) if hm else None,
                  'const_version':cm.group(1) if cm else None,
                  'prefix':text[:300],
              })
          Path('out/summary.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: template-kit-150559-exact-main-source
          path: out/
          if-no-files-found: error

name: TEMP Affiliate Banner Upgrade ZIP E2E 6.72.186

on:
  push:
    branches: [affiliate-672186-strict-tier]
    paths:
      - '.github/workflows/tmp-affiliate-banner-upgrade-zip-e2e-v672184.yml'
      - 'AFFILIATE_HOBBYRAUM/test_banner_upgrade_seed_v672184.php'
      - 'AFFILIATE_HOBBYRAUM/test_banner_upgrade_assert_v672184.php'
      - 'AFFILIATE_HOBBYRAUM/test_banner_full_e2e_v672184.php'
      - 'AFFILIATE_HOBBYRAUM/test_banner_strict_best_tier_all_contexts_v672186.php'
      - 'release/affiliate-zentrale/current/affiliate-portal-router/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-install-upgrade-test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Build exact source manifest and ZIP
        shell: bash
        run: |
          set -euo pipefail
          grep -F "Version: 6.72.186" release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php
          grep -F "const VERSION = '6.72.186';" release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php
          (cd release/affiliate-zentrale/current && find affiliate-portal-router -type f -print0 | sort -z | xargs -0 sha256sum) > release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt
          test "$(grep -cve '^[[:space:]]*$' release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt)" = "27"
          rm -f /tmp/AFFILIATE_ZENTRALE_6.72.186.zip
          (cd release/affiliate-zentrale/current && zip -qr /tmp/AFFILIATE_ZENTRALE_6.72.186.zip affiliate-portal-router)
          echo "ZIP_SHA256=$(sha256sum /tmp/AFFILIATE_ZENTRALE_6.72.186.zip | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "ZIP_BYTES=$(stat -c%s /tmp/AFFILIATE_ZENTRALE_6.72.186.zip)" >> "$GITHUB_ENV"
          echo "PASS build manifest+zip"

      - name: ZIP structure manifest syntax
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/zip184
          mkdir -p /tmp/zip184
          unzip -q /tmp/AFFILIATE_ZENTRALE_6.72.186.zip -d /tmp/zip184
          ROOT=/tmp/zip184/affiliate-portal-router
          test "$(find "$ROOT" -type f | wc -l)" = "27"
          test "$(find "$ROOT" -type f -name '*.php' | wc -l)" = "21"
          grep -F "Version: 6.72.186" "$ROOT/pferdeportal-affiliate-router.php"
          grep -F "const VERSION = '6.72.186';" "$ROOT/pferdeportal-affiliate-router.php"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('/tmp/zip184')
          expected={}
          for line in Path('release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt').read_text().splitlines():
              if not line.strip(): continue
              h,rel=line.split('  ',1); expected[rel]=h
          files={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if set(files)!=set(expected):
              raise SystemExit(f'FAIL manifest path mismatch missing={sorted(set(expected)-set(files))} extra={sorted(set(files)-set(expected))}')
          bad=[p for p,h in files.items() if expected[p]!=h]
          if bad: raise SystemExit('FAIL manifest hash mismatch '+repr(bad))
          print('PASS ZIP 27/27 manifest byte identity')
          PY
          find "$ROOT" -type f -name '*.php' -print0 | xargs -0 -n1 php -l | tee /tmp/zip184-lint.log
          test "$(grep -c '^No syntax errors detected' /tmp/zip184-lint.log)" = "21"
          echo "PASS ZIP PHP lint 21/21"

      - name: Performance KISS hardlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          cur=Path('/tmp/zip184/affiliate-portal-router/pferdeportal-affiliate-router.php').read_text()
          old=subprocess.check_output(['git','show','a381aff4eb3f41754186f4bad86ce1a7e0823a29:release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php'],text=True)
          def body(src,name):
              marker='function '+name+'('; start=src.find(marker)
              if start<0: raise SystemExit('FAIL missing '+name)
              brace=src.find('{',start); depth=0; state='code'; esc=False; i=brace
              while i<len(src):
                  c=src[i]; n=src[i+1] if i+1<len(src) else ''
                  if state=='sq':
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": state='code'
                  elif state=='dq':
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': state='code'
                  elif state=='line':
                      if c=='\n': state='code'
                  elif state=='block':
                      if c=='*' and n=='/': state='code'; i+=1
                  else:
                      if c=="'": state='sq'
                      elif c=='"': state='dq'
                      elif c=='/' and n=='/': state='line'; i+=1
                      elif c=='#': state='line'
                      elif c=='/' and n=='*': state='block'; i+=1
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0:return src[start:i+1]
                  i+=1
              raise SystemExit('FAIL unclosed '+name)
          protected=[
            'ranked_campaigns_request_cache_allowed','ranked_campaign_sanitize_key_request_cached',
            'ranked_campaign_sanitize_text_request_cached','ranked_campaigns_request_cache_key',
            'select_category_product_campaign_fast_v672171','ranked_campaign_candidate_pool',
            'category_product_provider_mix_v672133','render_banner',
            'banner_distribution_reorder_candidates','banner_distribution_stable_index',
            'category_product_shared_rank_base'
          ]
          for name in protected:
              if body(cur,name)!=body(old,name): raise SystemExit('FAIL protected performance function changed '+name)
          hot=body(cur,'ranked_campaigns_for_slot_uncached')
          p=hot.find('V6.72.184 KISS')
          if p<0: raise SystemExit('FAIL missing KISS marker')
          addition=hot[p:p+900]
          for forbidden in ['$wpdb','get_post_meta(','wp_remote_','output_plan_creative(']:
              if forbidden in addition: raise SystemExit('FAIL new frontend cost '+forbidden)
          print('PASS performance KISS hardlock')
          PY

      - name: Install WordPress bad baseline 6.72.184
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-site /tmp/base183
          mkdir -p /tmp/wp-site /tmp/base183
          /tmp/wp core download --path=/tmp/wp-site --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title='Affiliate ZIP Upgrade E2E' --admin_user=admin --admin_password='ci-password-123!' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp-site/wp-content/mu-plugins
          cat >/tmp/wp-site/wp-content/mu-plugins/pferde-e2e-design-contract.php <<'PHP'
          <?php
          if (!class_exists('Pferde_Template_Kit')) {
              class Pferde_Template_Kit {
                  public static function affiliate_contract_version(){ return '1.0'; }
                  public static function design_profile(){ return 'pferde_atelier'; }
                  public static function design_profile_contract_version(){ return '1.0'; }
                  public static function affiliate_page_type($page_id){ return get_post_field('post_parent',$page_id) ? 'category' : 'hub1'; }
              }
          }
          add_action('init', static function(){
              if (!post_type_exists('uge_term')) register_post_type('uge_term',array('public'=>true,'supports'=>array('title','editor')));
              if (!taxonomy_exists('uge_group')) register_taxonomy('uge_group',array('uge_term'),array('public'=>true,'hierarchical'=>true));
              if (!post_type_exists('pa_breed')) register_post_type('pa_breed',array('public'=>true,'supports'=>array('title','editor')));
              if (!taxonomy_exists('pa_breed_group')) register_taxonomy('pa_breed_group',array('pa_breed'),array('public'=>true,'hierarchical'=>true));
              if (!post_type_exists('hp_listing')) register_post_type('hp_listing',array('public'=>true,'supports'=>array('title','editor')));
              if (!taxonomy_exists('hp_listing_category')) register_taxonomy('hp_listing_category',array('hp_listing'),array('public'=>true,'hierarchical'=>true));
          },1);
          PHP
          git show 5f28fb69c2bd215e49c44c6e8c26ac7b8836f1bf:release/affiliate-zentrale/artifacts/final/AFFILIATE_ZENTRALE_6.72.184.zip > /tmp/bad184.zip
          echo 'bc101bd7dc06aa3ecbf085165914440e28e0b7aaefe6786d1e7db33fc7f8fe06  /tmp/bad184.zip' | sha256sum -c -
          unzip -q /tmp/bad184.zip -d /tmp/base183
          cp -a /tmp/base183/affiliate-portal-router /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-site
          /tmp/wp eval 'if(Pferdeportal_Affiliate_Router::VERSION!=="6.72.184"){exit(2);} echo "PASS bad baseline 6.72.184 active\n";' --path=/tmp/wp-site

      - name: Reproduce failure then upgrade from built ZIP
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wp eval-file "$GITHUB_WORKSPACE/AFFILIATE_HOBBYRAUM/test_banner_upgrade_seed_v672184.php" --path=/tmp/wp-site | tee /tmp/seed184zip.log
          grep -F 'PRE_UPGRADE_184_stale_library_banner_visible_on_schabracken' /tmp/seed184zip.log
          grep -F 'UPGRADE_SEED_672184_PASS' /tmp/seed184zip.log
          rm -rf /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          cp -a /tmp/zip184/affiliate-portal-router /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          /tmp/wp eval 'if(Pferdeportal_Affiliate_Router::VERSION!=="6.72.186"){exit(2);} echo "PASS ZIP upgraded plugin 6.72.186 active\n";' --path=/tmp/wp-site
          sed "s/6\\.72\\.185/6.72.186/g" "$GITHUB_WORKSPACE/AFFILIATE_HOBBYRAUM/test_banner_upgrade_assert_v672184.php" >/tmp/assert186.php
          /tmp/wp eval-file /tmp/assert186.php --path=/tmp/wp-site | tee /tmp/assert184zip.log
          grep -F 'FULL_672184_TO_672185_BANNER_MIGRATION_E2E_PASS' /tmp/assert184zip.log
          echo "PASS exact ZIP upgrade positive negative"

      - name: Fresh ZIP regression gates
        shell: bash
        run: |
          set -euo pipefail
          mysql -h127.0.0.1 -uroot -proot -e "DROP DATABASE IF EXISTS wordpress2; CREATE DATABASE wordpress2 CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL ON wordpress2.* TO 'wordpress'@'%'; FLUSH PRIVILEGES;"
          rm -rf /tmp/wp-fresh
          mkdir -p /tmp/wp-fresh
          /tmp/wp core download --path=/tmp/wp-fresh --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-fresh --dbname=wordpress2 --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-fresh --url=http://127.0.0.1:8081 --title='Affiliate ZIP Fresh E2E' --admin_user=admin --admin_password='ci-password-123!' --admin_email=ci@example.test --skip-email
          mkdir -p /tmp/wp-fresh/wp-content/mu-plugins
          cp /tmp/wp-site/wp-content/mu-plugins/pferde-e2e-design-contract.php /tmp/wp-fresh/wp-content/mu-plugins/
          cp -a /tmp/zip184/affiliate-portal-router /tmp/wp-fresh/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-fresh
          sed "s/6\\.72\\.185/6.72.186/g" AFFILIATE_HOBBYRAUM/test_banner_full_e2e_v672184.php >/tmp/full186.php
          sed "s/6\\.72\\.183/6.72.186/g" AFFILIATE_HOBBYRAUM/test_banner_destination_library_e2e_v672183.php >/tmp/dest186.php
          /tmp/wp eval-file /tmp/full186.php --path=/tmp/wp-fresh | tee /tmp/full184.log
          grep -F 'SUMMARY passes=21 failures=0' /tmp/full184.log
          grep -F 'FULL_WORDPRESS_MARIADB_BANNER_E2E_672185_LIBRARY_SOURCE_PASS' /tmp/full184.log
          /tmp/wp eval-file /tmp/dest186.php --path=/tmp/wp-fresh | tee /tmp/dest185.log
          grep -F 'SUMMARY passes=26 failures=0' /tmp/dest185.log
          grep -F 'FULL_DESTINATION_LIBRARY_WORDPRESS_MARIADB_E2E_PASS' /tmp/dest185.log
          /tmp/wp eval-file "$GITHUB_WORKSPACE/AFFILIATE_HOBBYRAUM/test_banner_strict_best_tier_all_contexts_v672186.php" --path=/tmp/wp-fresh | tee /tmp/tier186zip.log
          grep -F 'STRICT_BEST_TIER_ALL_ACTIVE_CONTEXTS_672186_PASS' /tmp/tier186zip.log
          grep -F '"failures":0' /tmp/tier186zip.log
          grep -F 'PASS PERFORMANCE_zero_frontend_http :: http=0' /tmp/tier186zip.log
          echo "PASS fresh ZIP legacy 21/21 + destination 26/26 + strict-tier 139/139"

      - name: Commit tested manifest and installer
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/AFFILIATE_ZENTRALE_6.72.186.zip release/affiliate-zentrale/artifacts/final/AFFILIATE_ZENTRALE_6.72.186.zip
          git config user.name "hallo-netizen"
          git config user.email "hallo@oliver-beil.de"
          git add release/affiliate-zentrale/CURRENT_SOURCE_SHA256.txt release/affiliate-zentrale/artifacts/final/AFFILIATE_ZENTRALE_6.72.186.zip
          git commit -m "affiliate: publish tested 6.72.186 strict-tier installer"
          git push origin HEAD:affiliate-672186-strict-tier
          echo "PASS TESTED_ZIP_COMMITTED sha256=$ZIP_SHA256 bytes=$ZIP_BYTES"

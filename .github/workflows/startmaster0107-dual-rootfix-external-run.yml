name: TEMP STARTMASTER0107 Dual Rootfix External Run
on:
  push:
    branches: [startmaster0107-dual-rootfix-external-run-20260902]
permissions:
  contents: write
jobs:
  dual-rootfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute only bounded repair script
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile control/startmaster0107/STARTMASTER0107_DUAL_ROOTFIX_REPAIR.py
          python3 control/startmaster0107/STARTMASTER0107_DUAL_ROOTFIX_REPAIR.py apply
          python3 control/startmaster0107/STARTMASTER0107_DUAL_ROOTFIX_REPAIR.py selftest
      - name: Existing positive-negative regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 control/cloud-entry-gate/cloud_repo_ci_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 control/production-continuity/test_production_continuity_guard.py
      - name: Confirm current released articles untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only HEAD -- .pferde-release/ | wc -l | tr -d ' ')" = "0"
      - name: Remove temporary runner and commit generated fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/startmaster0107-dual-rootfix-external-run.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && { echo 'NO_GENERATED_CHANGES'; exit 1; } || true
          git commit -m 'STARTMASTER0107: apply dual rootfix and tests'
          git push origin HEAD:startmaster0107-dual-rootfix-external-run-20260902

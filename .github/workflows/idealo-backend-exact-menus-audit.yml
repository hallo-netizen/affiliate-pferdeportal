name: Idealo exact WordPress backend labels HD and HAB read-only
on:
  push:
    branches: [audit/hd-hab-idealo-clickpaths-20261112]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read exact menu registration UI labels and fields from both current production plugin packages
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import re,hashlib
          base=Path('protocol/PROJECT_MEMORY/PROJEKTE')
          files={'HOBBY DEPOT':base/'HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE/CURRENT.zip','HAB & BEWAHR':base/'EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip'}
          for portal,path in files.items():
              print('====================',portal,'====================')
              raw=path.read_bytes();print('ZIP_SHA256',hashlib.sha256(raw).hexdigest())
              with ZipFile(path) as z:
                  assert z.testzip() is None
                  for name in z.namelist():
                      if not name.endswith('.php'):continue
                      a=z.read(name).decode('utf8','replace').splitlines()
                      indices=[]
                      for i,line in enumerate(a):
                          if re.search(r'add_(?:sub)?menu_page\s*\(',line) or 'affiliate-portal-provider-idealo' in line or 'Anbieter & APIs' in line or 'Anbieter &amp; APIs' in line or 'Affiliate-Zentrale' in line and ('menu' in line.lower() or 'register' in line.lower()):
                              indices.append(i)
                      if not indices:continue
                      print('MENUFILE',name)
                      seen=set()
                      for i in indices:
                          for j in range(max(0,i-4),min(len(a),i+8)):
                              if j not in seen:
                                  print('MENU',j+1,a[j][:850]);seen.add(j)
                  name='affiliate-portal-router/includes/trait-ppar-idealo.php'
                  a=z.read(name).decode('utf8','replace').splitlines()
                  m=next((i for i,s in enumerate(a) if 'function idealo_render_access_card' in s),None)
                  if m is None:raise RuntimeError('No idealo card')
                  print('ACTUAL_BACKEND_FIELDS',name)
                  for j in range(m,min(len(a),m+20)):
                      print('UI',j+1,a[j][:2500])
                  print('CONFIG_OPTIONS')
                  for i,s in enumerate(a):
                      if 'idealo_provider_access_save(' in s or 'idealo_provider_access_test(' in s:
                          for j in range(i,min(len(a),i+57)):
                              print('ACCESS',j+1,a[j][:600])
          PY

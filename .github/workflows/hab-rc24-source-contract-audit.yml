name: Hab RC24 cross-provider catalog invariant read-only audit
on:
  push:
    branches: [hab-affiliate-coverage-cards-20261112]
    paths: ['.github/workflows/hab-rc24-source-contract-audit.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read real source contract and validate no original invariant is broken
        run: |
          python3 protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/AFFILIATE/IMPLEMENTIERUNG_FULL_CARDS_20261112/build_candidate.py
          python3 protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/AFFILIATE/RC24_COVERAGE_DESIGN/build_rc24.py
          python3 - <<'PY'
          from zipfile import ZipFile
          z=ZipFile('protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-004-AFFILIATE/CURRENT.zip')
          for f in z.namelist():
            if not f.endswith('.php'):continue
            a=z.read(f).decode('utf8','replace').splitlines()
            for i,l in enumerate(a):
              if any(s in l for s in ['required_product_concept_ids','required_count','count($rules)','business_supply_contract','search_rules']) and ('bridge' not in f):
                print('CONTRACT',f,i+1,l[:850])
                if any(s in l for s in ['required_product_concept_ids','required_count']):
                  for j in range(max(0,i-3),min(i+6,len(a))):print('NEAR',f,j+1,a[j][:650])
          PY

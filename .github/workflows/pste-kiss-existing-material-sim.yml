name: PSTE KISS Existing Material Simulation
on:
  push:
    branches: [pste-kiss-e2e-20261005]
    paths:
      - 'proof/pste-kiss-existing-material/**'
      - '.github/workflows/pste-kiss-existing-material-sim.yml'
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate existing-material short path
        run: python3 proof/pste-kiss-existing-material/simulate_reentry.py

name: TEMP text-start bridge hard test
on:
  push:
    branches:
      - bridge/text-start-receiver-20260923
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile changed Python
        run: |
          python3 -m py_compile control/startmaster0107/pre_codex_start_hardlock.py
          python3 -m py_compile isolated_system4/test_text_start_receiver.py
      - name: Receiver positive-negative tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s isolated_system4 -p 'test_text_start_receiver.py'
      - name: Parse permanent workflows
        run: |
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/text-start-pferdeatelier.yml'); puts 'RECEIVER_YAML_PASS'"
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/pferde-atelier-immutable-base-hardlock.yml'); puts 'HARDLOCK_YAML_PASS'"
      - name: Machine-room hardlock matrix
        run: |
          python3 - <<'PY'
          import re
          immutable = re.compile(
              r'^(\.github/workflows/'
              r'|AGENTS\.md$'
              r'|AGENTS\.override\.md$'
              r'|control/CURRENT_STARTMASTER\.json$'
              r'|control/cloud-entry-gate/'
              r'|control/deterministic-entrance-gate/'
              r'|control/production-continuity/'
              r'|control/paul-scope-gate/'
              r'|control/output-quarantine/'
              r'|control/single-door-boundary/'
              r'|isolated_system4/'
              r'|control/startmaster0107/ENDSTEMPEL_'
              r'|control/startmaster0107/system4_107007_'
              r'|control/startmaster0107/system4_107008_'
              r'|control/startmaster0107/pre_codex_start_hardlock\.py$'
              r'|control/startmaster0107/PRE_CODEX_START_HARDLOCK\.json$'
              r'|control/startmaster0107/PRE_CODEX_START_RECEIPT\.json$'
              r'|control/startmaster0107/PFERDE_ATELIER_START_HERE\.json$'
              r'|control/startmaster0107/STEP_107007_RUN_NEW_ARTICLE_BATCH_NO_STOP\.json$'
              r'|control/startmaster0107/GITHUB_FINAL_RELEASE\.py$'
              r'|control/startmaster0107/chat_delivery_payload\.py$'
              r'|control/startmaster0107/runtime_packages/'
              r'|control/startmaster0107/VERBINDLICHER_TEXTERSTELLUNGS_PROMPT_STARTMASTER0107\.txt$'
              r'|control/startmaster0107/ZIELVERTRAG_REASONING_MEDIUM_MAX_STARTMASTER0107\.json$'
              r')'
          )
          must_block=[
            '.github/workflows/x.yml',
            'isolated_system4/controller.py',
            'isolated_system4/production_checks.py',
            'control/startmaster0107/runtime_packages/PORTAL_PRODUCTION_MACHINE_V6.7.9_SIGNED_ARTICLE_TYPE_EXTENSION_ROOTFIX_FINAL.zip',
            'control/startmaster0107/system4_107007_entry.py',
            'control/output-quarantine/runtime_entry_gate.py',
          ]
          must_allow=[
            'control/startmaster0107/runtime_inbox/RUNTIME_INBOX_STATE.json',
            'protocol/example.md',
            'README.md',
          ]
          assert all(immutable.search(x) for x in must_block), must_block
          assert all(not immutable.search(x) for x in must_allow), must_allow
          print('MACHINE_ROOM_MATRIX_PASS')
          PY

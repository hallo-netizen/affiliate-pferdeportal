name: Affiliate final provider-state E2E
on:
  push:
    branches:
      - affiliate-e2e-repro-20260920
    paths:
      - '.github/workflows/affiliate-final-provider-state.yml'
      - 'e2e/final_provider_state_probe.php'
  workflow_dispatch:
jobs:
  final-state:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install wp-cli
        run: |
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
      - name: Install exact 6.72.130
        run: |
          set -euo pipefail
          rm -rf /tmp/wp && mkdir /tmp/wp
          wp core download --version=7.1 --path=/tmp/wp
          wp config create --path=/tmp/wp --dbname=wordpress --dbuser=wp --dbpass=wp --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path=/tmp/wp --url=https://pferde-atelier.test --title=FinalState --admin_user=admin --admin_password=e2etest --admin_email=e2e@example.test
          unzip -q e2e/fixtures/AFFILIATE_ZENTRALE_V6.72.130_EXACT.zip -d /tmp/wp/wp-content/plugins
          wp plugin activate affiliate-portal-router --path=/tmp/wp
      - name: Seed exact historical product inventory
        env:
          AFF_E2E_FIXTURE: ${{ github.workspace }}/e2e/fixtures/real-wxr-product-campaigns-20260915.json.gz
        run: |
          set -euo pipefail
          wp eval-file "$GITHUB_WORKSPACE/e2e/seed_real_state_inner.php" --path=/tmp/wp
      - name: Reproduce broken persistent provider state
        env:
          AFF_PHASE: broken
        run: |
          set -euo pipefail
          wp eval-file "$GITHUB_WORKSPACE/e2e/final_provider_state_probe.php" --path=/tmp/wp
      - name: Reproduce verified restored provider state
        env:
          AFF_PHASE: restored
        run: |
          set -euo pipefail
          wp eval-file "$GITHUB_WORKSPACE/e2e/final_provider_state_probe.php" --path=/tmp/wp

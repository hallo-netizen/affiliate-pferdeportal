name: PSTE Kisten final source identity QA temporary
on:
  push:
    branches: [fix/pste-kisten-einmalige-pruefung-20261107]
permissions: {contents: read}
jobs:
  in-place-original-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Existing MINI no extra SEO reviewer; full source refs and technical checks
        run: |
          set -euo pipefail
          D=protocol/PROJECT_MEMORY/PROJEKTE/PFERDE_ATELIER/PLUGINS/QA_ONLY
          python3 "$D/apply_existing_mini_kisten_import.py" /tmp/pste-qa
          php -l /tmp/pste-qa/class-pste-mini-workflow.php
          php "$D/test_existing_export_split.php" /tmp/pste-qa/class-pste-mini-workflow.php normal >/tmp/normal.json
          php "$D/test_existing_export_split.php" /tmp/pste-qa/class-pste-mini-workflow.php seo >/tmp/seo.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/normal.json'));b=json.load(open('/tmp/seo.json'))
          assert a['items']==b['items'] and 'parkhaus_snapshot' not in a and 'parkhaus_snapshot' in b
          assert b['parkhaus_complete'] is False
          print('PASS external roles separated without duplicate semantic evaluation')
          PY
          php "$D/test_existing_mini_import.php" /tmp/pste-qa/class-pste-mini-workflow.php
          php "$D/test_existing_pserc_plan.php" /tmp/pste-qa/class-pste-mini-workflow.php
          php "$D/test_complete_parkhaus.php" /tmp/pste-qa/class-pste-mini-workflow.php
          php "$D/test_pste_kisten_transfer_v1.php"
          unzip -q /tmp/pste-qa/PSTE-KISTEN-GESAMT-QA-NICHT-INSTALLIEREN.zip -d /tmp/full
          find "/tmp/full/Portal SEO Topic Engine" -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/lints.txt
          echo "PHP_CHECKED=$(wc -l </tmp/lints.txt)"
          echo "QA_ONLY_NOT_FOR_INSTALLATION"

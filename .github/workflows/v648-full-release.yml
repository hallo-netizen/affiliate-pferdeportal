name: V6.48 full release verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  v648-release:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'v648-canonical-refresh-authority-rootcause-20260821'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    services:
      mariadb:
        image: mariadb:11.4
        ports:
          - 3306:3306

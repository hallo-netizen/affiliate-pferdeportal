name: Hab Bewahr Design 0.1.189 ZIP – Archivpruefung
on:
  push:
    branches: [hbd-post-design-20261106]
    paths:
      - '.github/workflows/hbd-post-design-check.yml'
      - 'protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/DESIGN/BEITRAGSDESIGN_BAU/**'
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic full ZIP build
        run: |
          set -e
          python protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/DESIGN/BEITRAGSDESIGN_BAU/build.py
          python protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/DESIGN/BEITRAGSDESIGN_BAU/build_0189.py
      - name: Check full archive
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile
          p=Path('protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-001-DESIGN/CURRENT.zip')
          assert len(p.read_bytes())==84349647
          assert sha256(p.read_bytes()).hexdigest()=='947a950273edb6bf47e76ffeef67ff51425db620adc2650c742831e73093134c'
          with ZipFile(p) as z:
              assert len(z.namelist())==430 and z.testzip() is None
              z.extractall('/tmp/hbplugin')
          print('PASS full ZIP, CRC, version, exact SHA-256')
          PY
          find /tmp/hbplugin -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          test "$(grep -c 'No syntax errors detected' /tmp/php-lint.txt)" -eq 35
          node --check /tmp/hbplugin/hab-bewahr-design-vorschau/assets/article-mobile-affiliate.js
      - name: Retain build as verified complete artifact for protected review
        uses: actions/upload-artifact@v4
        with:
          name: HAB-001-DESIGN-0.1.189-FULL-TESTED
          path: protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-001-DESIGN/CURRENT.zip
          if-no-files-found: error
          retention-days: 30

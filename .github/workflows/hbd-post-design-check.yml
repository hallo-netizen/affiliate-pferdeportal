name: Hab Bewahr Design 0.1.189 ZIP – Archivpruefung
on:
  push:
    branches: [hbd-post-design-20261106]
    paths:
      - '.github/workflows/hbd-post-design-check.yml'
      - 'protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/DESIGN/BEITRAGSDESIGN_BAU/**'
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic full ZIP build
        run: |
          set -e
          python protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/DESIGN/BEITRAGSDESIGN_BAU/build.py
          python protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/DESIGN/BEITRAGSDESIGN_BAU/build_0189.py
      - name: Check full archive
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile
          p=Path('protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-001-DESIGN/CURRENT.zip')
          assert len(p.read_bytes())==84349647
          assert sha256(p.read_bytes()).hexdigest()=='947a950273edb6bf47e76ffeef67ff51425db620adc2650c742831e73093134c'
          with ZipFile(p) as z:
              assert len(z.namelist())==430 and z.testzip() is None
              z.extractall('/tmp/hbplugin')
          print('PASS full ZIP, CRC, version, exact SHA-256')
          PY
          find /tmp/hbplugin -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          test "$(grep -c 'No syntax errors detected' /tmp/php-lint.txt)" -eq 35
          node --check /tmp/hbplugin/hab-bewahr-design-vorschau/assets/article-mobile-affiliate.js
      - name: Publish verified full ZIP to isolated Hab release branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRC="protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-001-DESIGN/CURRENT.zip"
          RELEASE="hbd-design-0189-release-20261106"
          CAMPUS="hobbyroom/project-memory-campus-v1-20260905"
          test "$(stat -c %s "$SRC")" = "84349647"
          echo "947a950273edb6bf47e76ffeef67ff51425db620adc2650c742831e73093134c  $SRC" | sha256sum -c -
          cp "$SRC" /tmp/hbd-design-0189-certified.zip
          git restore -- "$SRC"
          test "$(stat -c %s "$SRC")" = "84339643"
          git fetch --no-tags origin "refs/heads/$CAMPUS:refs/remotes/origin/$CAMPUS"
          if git ls-remote --exit-code --heads origin "$RELEASE" >/dev/null; then
            echo "Existing release branch found. Verifying identical file, no duplicate push."
            git fetch --no-tags origin "refs/heads/$RELEASE"
            git show "FETCH_HEAD:$SRC" > /tmp/hbd-release-check.zip
            cmp -s /tmp/hbd-release-check.zip /tmp/hbd-design-0189-certified.zip
          else
            git switch --create "$RELEASE" "origin/$CAMPUS"
            test "$(stat -c %s "$SRC")" = "84339643"
            cp /tmp/hbd-design-0189-certified.zip "$SRC"
            git add -- "$SRC"
            git -c user.name="HAB Release Validation" -c user.email="actions@users.noreply.github.com" commit -m "Hab & Bewahr: stage verified full Design 0.1.189 ZIP"
            git push origin "HEAD:refs/heads/$RELEASE"
          fi
          echo "Release branch ready: $RELEASE"
      - name: Independent fresh GitHub download and ZIP readback
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE="hbd-design-0189-release-20261106"
          SRC="protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-001-DESIGN/CURRENT.zip"
          mkdir -p /tmp/hbd-independent-readback
          git -C /tmp/hbd-independent-readback init -q
          git -C /tmp/hbd-independent-readback remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          TOKEN64="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -C /tmp/hbd-independent-readback -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $TOKEN64" fetch -q --depth=1 origin "refs/heads/$RELEASE"
          git -C /tmp/hbd-independent-readback show "FETCH_HEAD:$SRC" >/tmp/hbd-download-independent.zip
          test "$(stat -c %s /tmp/hbd-download-independent.zip)" = "84349647"
          echo "947a950273edb6bf47e76ffeef67ff51425db620adc2650c742831e73093134c  /tmp/hbd-download-independent.zip" | sha256sum -c -
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("/tmp/hbd-download-independent.zip") as z:
              assert len(z.infolist()) == 430 and z.testzip() is None
              assert b"Version: 0.1.189" in z.read("hab-bewahr-design-vorschau/hab-bewahr-design-vorschau.php")
          print("INDEPENDENT_REMOTE_READBACK_PASS")
          PY
      - name: Independent OFFICIAL CAMPUS readback of all three Hab plugin ZIPs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/hbd-official-campus
          git -C /tmp/hbd-official-campus init -q
          git -C /tmp/hbd-official-campus remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          TOKEN64="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -C /tmp/hbd-official-campus -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $TOKEN64" fetch -q --depth=1 origin "refs/heads/hobbyroom/project-memory-campus-v1-20260905"
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import subprocess,zipfile
          base="protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/"
          entries={
           "HAB-001-DESIGN":("947a950273edb6bf47e76ffeef67ff51425db620adc2650c742831e73093134c",84349647,430),
           "HAB-002-KATEGORIE-WORKFLOW":("ec39080e5350b9f7b3924239376e11580ce7de195a60bb89feafae6152533f98",368530,49),
           "HAB-003-BILDZENTRALE":("58af0d394752e767b5f0c7d6d9901eeaec921331ab6245144859e3e6626e4559",70397,3),
          }
          for name,(digest,size,count) in entries.items():
            p=base+name+"/CURRENT.zip"
            bs=subprocess.check_output(["git","-C","/tmp/hbd-official-campus","show","FETCH_HEAD:"+p])
            assert len(bs)==size,(name,len(bs))
            assert sha256(bs).hexdigest()==digest,name
            out=Path("/tmp/hbd-official-campus")/(name+".zip")
            out.write_bytes(bs)
            with zipfile.ZipFile(out) as z:
                assert len(z.infolist())==count,name
                assert z.testzip() is None,name
                print("OFFICIAL_CAMPUS_ZIP_READBACK_PASS",name,size,count)
          PY
      - name: Retain build as verified complete artifact for protected review
        uses: actions/upload-artifact@v4
        with:
          name: HAB-001-DESIGN-0.1.189-FULL-TESTED
          path: protocol/PROJECT_MEMORY/PROJEKTE/EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-001-DESIGN/CURRENT.zip
          if-no-files-found: error
          retention-days: 30

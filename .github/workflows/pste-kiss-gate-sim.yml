name: PSTE KISS Evidence Gate Simulation
on:
  push:
    branches: [pste-kiss-e2e-20261005]
    paths:
      - '.github/workflows/pste-kiss-gate-sim.yml'
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract byte-identical live evidence gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pserc /tmp/pserc2 && mkdir -p /tmp/pserc /tmp/pserc2
          unzip -q control/startmaster0107/runtime_packages/PSERC-FIX.zip -d /tmp/pserc
          INNER="$(find /tmp/pserc -type f -name '*.zip' | head -1)"
          test -n "$INNER"
          unzip -q "$INNER" -d /tmp/pserc2
          GATE="$(find /tmp/pserc2 -type f -name 'class-pserc-portal-topic-evidence-gate.php' | head -1)"
          test -n "$GATE"
          cp "$GATE" /tmp/gate-current.php
          ACTUAL="$(sha256sum /tmp/gate-current.php | awk '{print $1}')"
          EXPECTED='e3bea08e92436e6006b4eb8cafdcdbb81fbd5ed6b6c340b844e095bee0d2da55'
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "LIVE_GATE_HASH_MISMATCH:$ACTUAL"; exit 2; }
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/gate-current.php')
          s=p.read_text(encoding='utf-8')
          old="'KEYWORD_IDEA','PAA','GSC'"
          new="'KEYWORD_IDEA','PAA','PAA_RELATED','GSC'"
          if s.count(old)!=1:
              raise SystemExit('PATCH_POINT_NOT_EXACTLY_ONCE')
          Path('/tmp/gate-patched.php').write_text(s.replace(old,new,1),encoding='utf-8')
          print('PATCH_DELTA=ADD_PAA_RELATED_ONLY')
          PY
      - name: Run positive and negative gate matrix
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/gate-harness.php <<'PHP'
          <?php
          define('ABSPATH', __DIR__);
          final class PSERC_Metadata_Boundary { public static function forbiddenContentPath($topic,$root){return '';} }
          final class PSERC_Article_Type_Extension_Registry {
              public static function extension($type){return false;}
              public static function verifyTopicBinding($topic){return ['ok'=>true];}
          }
          final class PSERC_Portal_Structure_Gate {
              public static function entry($structure,$slug){return ['canonical_article_type'=>'FAQ','topic_family'=>'faq-family'];}
          }
          final class PSERC_Stable_Json { public static function hash($v){return hash('sha256',json_encode($v,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));} }

          $gate=getenv('GATE');
          $source=getenv('SOURCE') ?: 'PAA';
          $case=getenv('CASE') ?: 'normal';
          require $gate;
          $topic=[
              'research_job_contract'=>'PSTE_AUTOMATIC_LONGTAIL_RESEARCH_JOB_V2',
              'research_run_status'=>'COMPLETE',
              'textmachine_handoff_status'=>'READY_FOR_COMPILER_CAPABILITY_CHECK',
              'metadata_handoff_fields'=>['title','target_keyword','category','article_type','plan_slot'],
              'context_state'=>'CURRENT',
              'query_record'=>[
                  'raw_query'=>'welche schabracke passt',
                  'normalized_query'=>'welche schabracke passt',
                  'language_corrected_query'=>'Welche Schabracke passt',
                  'volume_status'=>'UNMEASURED',
                  'measured_query'=>'',
                  'search_volume'=>null,
              ],
              'evidence'=>[['source'=>$source,'raw_response_sha256'=>str_repeat('a',64)]],
              'reason_codes'=>[],
              'decision'=>'PASS',
              'semantic_consensus'=>[
                  'contract'=>'PSTE_SEMANTIC_DOUBLE_STRAND_V3',
                  'ok'=>true,'type_consensus'=>true,'category_consensus'=>true,'family_consensus'=>true,
                  'status'=>'CONSENSUS_PASS',
                  'family_membership_gate'=>['contract'=>'PSTE_FAMILY_MEMBERSHIP_GATE_V2','ok'=>true,'status'=>'FAMILY_PASS'],
              ],
              'article_type'=>'FAQ',
              'title_quality'=>['ok'=>true,'status'=>'TITLE_TECHNICAL_PASS','semantic_quality_claimed'=>false],
              'language_quality'=>['ok'=>true,'status'=>'LANGUAGE_PASS','semantic_quality_claimed'=>false],
              'editorial_quality_gate'=>[
                  'contract'=>'PSTE_EDITORIAL_QUALITY_GATE_V4_HARD_TITLE_SURFACE_INTENT_SAFE',
                  'ok'=>true,'status'=>'PASS','composer_called'=>false,'title_modified'=>false,'technical_gate_result_consumed'=>false,
              ],
              'editorial_dual_strand'=>[
                  'technical'=>['status'=>'PASS'],
                  'editorial'=>['status'=>'PASS','technical_result_consumed'=>false],
              ],
              'domain_risk'=>['ok'=>true],
              'freshness'=>['status'=>'CURRENT'],
              'pre_title_duplicate_gate'=>['contract'=>'PSTE_PRE_TITLE_DUPLICATE_GATE_V2_KEYWORD_OWNERSHIP','ok'=>true],
              'category_gap_proposal'=>null,
              'category_slug'=>'schabracken-faq',
              'category_id'=>123,
              'category_name'=>'Schabracken FAQ',
              'topic_family_name'=>'faq-family',
              'article_type_registry_sha256'=>str_repeat('b',64),
          ];
          if($case==='no_evidence') $topic['evidence']=[];
          if($case==='bad_hash') $topic['evidence']=[['source'=>$source,'raw_response_sha256'=>'bad']];
          if($case==='hard_reason') $topic['reason_codes']=['TRANSACTIONAL_QUERY'];
          if($case==='decision_fail') $topic['decision']='BLOCK';
          if($case==='bad_pre_contract') $topic['pre_title_duplicate_gate']=['contract'=>'WRONG','ok'=>true];
          $r=PSERC_Portal_Topic_Evidence_Gate::evaluate($topic,[]);
          echo json_encode($r,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES),PHP_EOL;
          PHP

          run_case() {
            local gate="$1" source="$2" case_name="$3" expected_ok="$4" expected_reason="$5"
            out="$(GATE="$gate" SOURCE="$source" CASE="$case_name" php /tmp/gate-harness.php)"
            python3 - "$out" "$expected_ok" "$expected_reason" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1]); expected_ok=sys.argv[2]=='true'; expected_reason=sys.argv[3]
          assert bool(d.get('ok')) is expected_ok,(d,expected_ok)
          if expected_reason:
              assert expected_reason in (d.get('reason_codes') or []),(d,expected_reason)
          print('PASS', 'ok='+str(d.get('ok')), 'reason='+','.join(d.get('reason_codes') or []))
          PY
          }

          echo 'CURRENT_PAA_RELATED_EXPECT_BLOCK'
          run_case /tmp/gate-current.php PAA_RELATED normal false PORTAL_TOPIC_LONGTAIL_EVIDENCE_MISSING
          echo 'CURRENT_PAA_EXPECT_PASS'
          run_case /tmp/gate-current.php PAA normal true ''
          echo 'CURRENT_RELATED_SEARCH_EXPECT_PASS'
          run_case /tmp/gate-current.php RELATED_SEARCH normal true ''

          echo 'PATCHED_PAA_RELATED_EXPECT_PASS'
          run_case /tmp/gate-patched.php PAA_RELATED normal true ''
          echo 'PATCHED_PAA_EXPECT_PASS'
          run_case /tmp/gate-patched.php PAA normal true ''
          echo 'PATCHED_RELATED_SEARCH_EXPECT_PASS'
          run_case /tmp/gate-patched.php RELATED_SEARCH normal true ''

          echo 'PATCHED_NO_EVIDENCE_EXPECT_BLOCK'
          run_case /tmp/gate-patched.php PAA_RELATED no_evidence false PORTAL_TOPIC_LONGTAIL_EVIDENCE_MISSING
          echo 'PATCHED_BAD_HASH_EXPECT_BLOCK'
          run_case /tmp/gate-patched.php PAA_RELATED bad_hash false PORTAL_TOPIC_LONGTAIL_EVIDENCE_MISSING
          echo 'PATCHED_HARD_REASON_EXPECT_BLOCK'
          run_case /tmp/gate-patched.php PAA_RELATED hard_reason false PORTAL_TOPIC_HARD_REASON_PRESENT
          echo 'PATCHED_DECISION_FAIL_EXPECT_BLOCK'
          run_case /tmp/gate-patched.php PAA_RELATED decision_fail false PORTAL_TOPIC_DECISION_NOT_PASS
          echo 'PATCHED_BAD_PRE_CONTRACT_EXPECT_BLOCK'
          run_case /tmp/gate-patched.php PAA_RELATED bad_pre_contract false PORTAL_TOPIC_PRE_TITLE_DUPLICATE_GATE_NOT_PASSED

          echo 'GATE_MATRIX_PASS'

name: PSTE extract exact 0.57.55 source

on:
  push:
    branches: [pste-kiss-e2e-20261005]
    paths:
      - '.github/workflows/pste-extract-05755-source.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
      - name: Locate and extract exact PSTE 0.57.55
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, subprocess, zipfile, pathlib, shutil, hashlib, re
          target=b'0.57.55'
          out=pathlib.Path('control/pste-topic-engine/inspection/pste05755-source')
          if out.exists(): shutil.rmtree(out)
          out.mkdir(parents=True)
          objects=subprocess.check_output(['git','rev-list','--objects','--all'],text=True,errors='replace').splitlines()
          candidates=[]
          seen=set()
          def inspect_zip(data,label,depth=0):
              if depth>5 or len(data)>180*1024*1024:return
              try:z=zipfile.ZipFile(io.BytesIO(data))
              except:return
              names=z.namelist()
              php_hits=[]
              for n in names:
                  if n.endswith('/'): continue
                  try:b=z.read(n)
                  except: continue
                  low=n.lower()
                  if low.endswith('.php') and target in b:
                      php_hits.append(n)
              if php_hits:
                  candidates.append((label,data,php_hits))
              for n in names:
                  if n.lower().endswith('.zip'):
                      try:b=z.read(n)
                      except:continue
                      inspect_zip(b,label+'!'+n,depth+1)
          for line in objects:
              p=line.split(' ',1)
              if len(p)!=2 or p[0] in seen: continue
              seen.add(p[0]); path=p[1]
              if not path.lower().endswith('.zip'): continue
              try:
                  size=int(subprocess.check_output(['git','cat-file','-s',p[0]],text=True).strip())
                  if size>180*1024*1024: continue
                  raw=subprocess.check_output(['git','cat-file','blob',p[0]],stderr=subprocess.DEVNULL)
              except:continue
              inspect_zip(raw,path)
          if not candidates:
              raise SystemExit('NO_05755_ZIP_FOUND')
          # Prefer archive with multiple PHP files and plugin main/version string.
          scored=[]
          for label,data,hits in candidates:
              z=zipfile.ZipFile(io.BytesIO(data))
              php=[n for n in z.namelist() if n.lower().endswith('.php')]
              score=len(php)*10+len(hits)*100
              if any('topic' in n.lower() and 'engine' in n.lower() for n in php): score+=1000
              scored.append((score,label,data,hits))
          scored.sort(reverse=True,key=lambda x:x[0])
          score,label,data,hits=scored[0]
          z=zipfile.ZipFile(io.BytesIO(data))
          z.extractall(out)
          pathlib.Path('control/pste-topic-engine/inspection/PSTE05755_SOURCE_ORIGIN.txt').write_text(
              f'archive={label}\nsha256={hashlib.sha256(data).hexdigest()}\nphp_hits={hits!r}\n',
              encoding='utf-8'
          )
          print('FOUND',label,'score',score,'files',len(z.namelist()))
          PY
      - name: Commit exact source inspection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control/pste-topic-engine/inspection/pste05755-source control/pste-topic-engine/inspection/PSTE05755_SOURCE_ORIGIN.txt
          git diff --cached --quiet && exit 0
          git commit -m "inspection: extract exact PSTE 0.57.55 source [skip ci]"
          git push origin HEAD:pste-kiss-e2e-20261005

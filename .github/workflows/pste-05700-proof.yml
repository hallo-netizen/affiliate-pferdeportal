name: PSTE 0.57 Exact Server Step Driver Proof

on:
  push:
    branches:
      - pste-05700-server-step-driver-proof
  pull_request:
    paths:
      - 'proof/pste-05700-control-sim/**'
      - '.github/workflows/pste-05700-proof.yml'
  workflow_dispatch:

jobs:
  exact-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Reconstruct exact control bundle
        shell: bash
        run: |
          set -euo pipefail
          cat proof/pste-05700-control-sim/bundle.b64.part* | base64 -d > /tmp/PSTE-0.57.0-GITHUB-CONTROL-SIM.zip
          echo "06f690b741670f0fb51149ab818d0e54c8f1d1f1283d39ad0e7b33259eba3ed2  /tmp/PSTE-0.57.0-GITHUB-CONTROL-SIM.zip" | sha256sum -c -
          rm -rf /tmp/pste05700-proof
          mkdir -p /tmp/pste05700-proof
          unzip -q /tmp/PSTE-0.57.0-GITHUB-CONTROL-SIM.zip -d /tmp/pste05700-proof
      - name: Exact positive and negative simulation
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/pste05700-proof/pste05700_github_control
          bash ./run.sh
      - name: Upload exact tested control bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PSTE-0.57.0-EXACT-TESTED-CONTROL-BUNDLE
          path: /tmp/PSTE-0.57.0-GITHUB-CONTROL-SIM.zip
          if-no-files-found: error
          retention-days: 30
      - name: Locate and verify exact fresh ZIP candidate
        id: fresh_zip
        shell: bash
        run: |
          set -euo pipefail
          expected="2ce8640b12e71c3fd028c28841aa5acf5b978284def399a5ec3e0bd4ea49d255"
          found=""
          while IFS= read -r -d '' file; do
            actual="$(sha256sum "$file" | awk '{print $1}')"
            if [ "$actual" = "$expected" ]; then
              found="$file"
              break
            fi
          done < <(find /tmp/pste05700-proof -type f -name '*.zip' -print0)
          if [ -z "$found" ]; then
            echo "FRESH_ZIP_CANDIDATE_NOT_FOUND"
            echo "=== PROOF_BUNDLE_FILE_INVENTORY ==="
            find /tmp/pste05700-proof -type f -printf "%P\t%s bytes\n" | sort
            echo "=== END_PROOF_BUNDLE_FILE_INVENTORY ==="
            exit 1
          fi
          cp "$found" /tmp/PSTE-0.57.0-FRESH.zip
          echo "$expected  /tmp/PSTE-0.57.0-FRESH.zip" | sha256sum -c -
          echo "candidate=/tmp/PSTE-0.57.0-FRESH.zip" >> "$GITHUB_OUTPUT"
      - name: Upload exact fresh ZIP candidate
        uses: actions/upload-artifact@v4
        with:
          name: PSTE-0.57.0-FRESH
          path: ${{ steps.fresh_zip.outputs.candidate }}
          if-no-files-found: error
          retention-days: 30

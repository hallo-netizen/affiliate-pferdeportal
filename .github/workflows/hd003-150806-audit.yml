name: HD003 Hab article original versus existing test photo audit
on:
  push:
    branches: [hobbyroom/hd003-150806-copy-hab-article-20261108]
    paths: [.github/workflows/hd003-150806-audit.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact original Hab article style versus Hobby current hero and Gutenberg
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import re,json
          root=Path('protocol/PROJECT_MEMORY/PROJEKTE')
          hab=root/'EIGENTUMSSCHUTZ/PLUGINS/ISOLIERTE_PLUGINS/HAB-001-DESIGN/CURRENT.zip'
          hobby=root/'HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-003-DESIGN-TEMPLATE-KIT/CURRENT.zip'
          with ZipFile(hab) as z:
            for name in ['hab-bewahr-design-vorschau/includes/article-page.php','hab-bewahr-design-vorschau/assets/article-design.css']:
              s=z.read(name).decode()
              print('HAB_ARTICLE_FILE',name,'bytes',len(s))
              for line_no,line in enumerate(s.splitlines(),1):
                if any(n in line for n in ['grid','aside','sidebar','article-','hero','related','produkt','product','Bild','image','photo','@media','card','Kategorie','title','font-size','post_content','post_thumbnail','content','wp_head','the_content']):
                  print('HAB_ARTICLE_LINE',name,line_no,line[:300])
          with ZipFile(hobby) as z:
            for name in ['affiliate-portal-template-kit/pferde-template-kit.php',
             'affiliate-portal-template-kit/includes/hobby-depot-article-hero-v150789.php',
             'affiliate-portal-template-kit/includes/hobby-depot-design-test-v150787.php']:
              s=z.read(name).decode()
              print('HD_FILE',name,len(s))
              for i,line in enumerate(s.splitlines(),1):
                if any(n in line for n in ['<figure','<img','wp:image','wp:cover','hddemo-product-grid','hddemo-related','add_filter','hd003_hab_article_content_v150804','Bannerplatz Testartikel','hddemo-produkte','the_content','hd-article-sidebar','aside','hddemo-kicker']):
                  print('HD_LINE',name,i,line[:400])
            s=z.read('affiliate-portal-template-kit/includes/hobby-depot-article-hero-v150789.php').decode()
            i=s.find('function hd003_hab_article_content_v150804(')
            print('HD_ARTICLE_WRAPPER',s[i:i+4500])
          PY
      - name: Install Chromium for live page introspection
        run: |
          python3 -m pip install --quiet --break-system-packages playwright
          python3 -m playwright install chromium
      - name: Inspect duplicate photos and cards on actually installed test page
        run: |
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          import json
          url='https://www.hobby-depot.de/designtest-zweileiner-oder-vierleiner-hobby-depot/'
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True,args=['--no-sandbox'])
            for width in [1440,390]:
              page=b.new_page(viewport={'width':width,'height':900})
              resp=page.goto(url,wait_until='domcontentloaded',timeout=38000)
              page.wait_for_timeout(400)
              data=page.evaluate("""()=>{
                const main=document.querySelector('#content .post__text');
                const hero=document.querySelector('.hd-article-photo-hero-v150789');
                const img=main?[...main.querySelectorAll('img')].map(x=>({src:x.currentSrc,alt:x.alt,cls:x.className,ancestor:x.parentElement?.parentElement?.outerHTML.slice(0,420)})):[];
                const pics=[...document.querySelectorAll('main img, article img')].slice(0,30).map(x=>({src:x.currentSrc,alt:x.alt,cl:x.className}));
                const bnr=[...document.querySelectorAll('a.hdar-ci-amazon-banner, .hdar-ci-amazon-banner, .hddemo-product-grid, .hddemo-related')].map(x=>({cl:x.className,text:x.textContent.trim().slice(0,160),outer:x.outerHTML.slice(0,750)}));
                const targets=['#hddemo-produkte','h2#hddemo-faq','figure.wp-block-image','figure.wp-block-gallery','.hd-article-sidebar-photo-v150805','.hd-article-body-grid-v150804','h2.wp-block-heading'];
                return {title:document.title,mainHtml:main?.innerHTML.slice(0,18000),img,pics,hero:hero?.outerHTML.slice(0,1300),banner:bnr,targets:targets.map(s=>({selector:s,total:document.querySelectorAll(s).length}))};
              }""")
              print('LIVE_DOM',width,'http',resp.status if resp else 0,json.dumps(data,ensure_ascii=False))
              page.close()
            b.close()
          PY

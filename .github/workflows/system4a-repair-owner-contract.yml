name: System 4A Repair Owner Contract

on:
  push:
    branches:
      - 'hobbyroom/system4a-startgate-test-20260914'
      - 'hobbyroom/system4a-textmachine-final-pass-20260916'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-owner-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact head
        run: git rev-parse HEAD
      - name: Run causal repair-owner regression contract
        working-directory: isolated_system4
        run: >-
          python3 -m unittest -v
          test_repair_owner_routing_contract.py
          test_repair_owner_failclosed_contract.py
          test_parent_title_repair_contract.py
          test_parent_metadata_owner_authority_contract.py
          test_stage_owner_return_contract.py
          test_source_acquisition_owner_contract.py
          test_machine_route_lock_contract.py
          test_fullcheck_guard_repair_contract.py
          test_textmachine_hardblock_matrix.py
          test_textmachine_negative_gap_guards.py
          test_textmachine_ppm_negative_gaps.py
          test_textmachine_repair_roundtrip_matrix.py
          test_textmachine_rules_full_pass.py

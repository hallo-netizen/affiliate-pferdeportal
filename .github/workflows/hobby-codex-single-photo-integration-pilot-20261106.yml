name: Hobby Depot Codex image-only technical integration test
on:
  push:
    branches:
      - hobbyroom/hd003-category-tile-image-audit-20261106
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install image utilities
        run: python3 -m pip install --quiet pillow
      - name: Verify latest HD003 and exercise photo-only packaging without publishing any plugin
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, sys, tempfile, zipfile
          from PIL import Image, ImageDraw
          root=pathlib.Path('protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH')
          base=root/'PLUGINS/ISOLIERTE_PLUGINS/HD-003-DESIGN-TEMPLATE-KIT/CURRENT.zip'
          builder=root/'DESIGN/tools/hobby_codex_image_only_pilot.py'
          sha=hashlib.sha256(base.read_bytes()).hexdigest()
          assert sha=='05ea37f040c1189ea9fda29c2dd795740351d83fe8022f8d966a453679fec7a8',sha
          print('LATEST_SOURCE_ZIP_SHA: PASS',flush=True)
          with zipfile.ZipFile(base) as z:
              names=set(z.namelist())
              slug='kettenhemdflechten'
              paths=[
                 'affiliate-portal-template-kit/assets/hobby-depot-v150617/hero-masters-v150684/'+slug+'.webp',
                 'affiliate-portal-template-kit/assets/hobby-depot-v150617/subcategories/fertigen/'+slug+'-v150634.webp']
              assert not any(p in names for p in paths),'Test target already has image; choose other slug'
              code=z.read('affiliate-portal-template-kit/includes/class-hobby-depot-profile-v150709.php').decode('utf-8','replace')
              assert slug in code
              print('EXACT_MISSING_SLUG_IN_CODE: PASS',flush=True)
          with tempfile.TemporaryDirectory() as td:
              td=pathlib.Path(td)
              im=Image.new('RGB',(1536,1024),'#d0bd9a')
              draw=ImageDraw.Draw(im)
              draw.ellipse((300,100,1180,900),outline='#6b625c',width=25)
              im_path=td/'TEST_ONLY_SYNTHETIC_NOT_A_REAL_HOBBY_PHOTO.png'
              im.save(im_path)
              m={'slug':'kettenhemdflechten','world':'fertigen','visual_review':'PASS',
                 'wordpress_slot_verified':True,
                 'source_sha256':hashlib.sha256(im_path.read_bytes()).hexdigest()}
              manifest=td/'test_only.json'
              manifest.write_text(json.dumps(m))
              def run(base_path=base): return subprocess.run([sys.executable,str(builder),
                  '--base',str(base_path),'--source',str(im_path),'--manifest',str(manifest),
                  '--output',str(td/'TEST_ONLY_NICHT_INSTALLIEREN.zip')],capture_output=True,text=True)
              r=run()
              print('STRUCTURAL_IMAGE_ONLY_PACKAGING:',r.stdout.strip(),flush=True)
              assert r.returncode==0,r.stderr
              print('CURRENT_FULL_ZIP_BUILD_POSITIVE: PASS',flush=True)
              for title,change in [('VISUAL_CHECK',{'visual_review':'FAIL'}),
                                    ('UNVERIFIED_WP_SLOT',{'wordpress_slot_verified':False}),
                                    ('BAD_SOURCE_SHA',{'source_sha256':'0'*64})]:
                  mm=dict(m);mm.update(change);manifest.write_text(json.dumps(mm))
                  rr=run()
                  assert rr.returncode!=0,(title,rr.stdout,rr.stderr)
                  print('EXPECTED_FAIL_CLOSED_'+title+': PASS',rr.stderr.strip(),flush=True)
              manifest.write_text(json.dumps(m))
              result=td/'TEST_ONLY_NICHT_INSTALLIEREN.zip'
              rr=run(result)
              assert rr.returncode!=0,rr.stderr
              print('EXISTING_TARGET_REPLACE_BLOCKED: PASS',rr.stderr.strip(),flush=True)
              print('NO_PRODUCTION_DEPLOYMENT_NO_REAL_IMAGE_CREATED: CONFIRMED',flush=True)
          PY

name: HD009 approved original banner reproducible build
on:
  push:
    branches:
      - hobbyroom/hd009-approved-original-banner-0115-20261107
permissions:
  contents: write
jobs:
  hd009-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Require PHP Lint
        run: |
          if ! command -v php >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq php-cli
          fi
          php --version
      - name: Build from original HD009 and verified original HD003 banner
        run: python3 protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/PLUGIN_AKTEN/HD-009-AFFILIATE-ZENTRALE/EVIDENCE/BUILD_0115_APPROVED_ORIGINAL.py
      - name: Save the one full upgrade ZIP
        run: |
          git config user.name "hobby-plugin-audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE/CURRENT.zip
          if ! git diff --cached --quiet; then
            git commit -m "HD009 0.1.15: original approved Hobby Depot banner, no manual placement"
            git push
          fi

name: HD027 coordinated release of two existing full plugins
on:
  push:
    branches: ['hobbyroom/hd009-027-category-photo-postcards-20261108']
    paths:
      - 'ops/hobby027/build.py'
      - 'ops/hobby027/test.py'
      - '.github/workflows/hd027-build.yml'
permissions: {contents: write}
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build only HD009 0.1.27 and HD003 1.50.803 from exact source ZIP hashes
        run: python3 ops/hobby027/build.py
      - name: Exercise actual new PHP methods with approved kite photo and post thumbnail fallback
        run: python3 ops/hobby027/test.py
      - name: Save checked distinct names and current ZIPs to staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE/CURRENT.zip
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-009-AFFILIATE-ZENTRALE/HOBBY_DEPOT_AFFILIATE_HD009_0.1.27.zip
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-003-DESIGN-TEMPLATE-KIT/CURRENT.zip
          git add protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS/HD-003-DESIGN-TEMPLATE-KIT/HOBBY_DEPOT_DESIGN_HD003_1.50.803.zip
          git commit -m "Fix real category banner photo and related article card image in HD009+HD003"
          git push origin HEAD:hobbyroom/hd009-027-category-photo-postcards-20261108

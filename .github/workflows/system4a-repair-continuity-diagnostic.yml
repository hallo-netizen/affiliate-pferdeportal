name: System 4A Acceptance Diagnostic

on:
  push:
    branches:
      - 'hobbyroom/system4a-startgate-test-20260914'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run batch handoff one-to-N and capture exact traceback
        id: batch
        working-directory: isolated_system4
        continue-on-error: true
        run: |
          set +e
          python3 -m unittest -v test_batch_gate.py test_universal_batch_gate.py test_handoff_transport.py > /tmp/system4-batch-handoff.log 2>&1
          rc=$?
          echo "$rc" > /tmp/system4-batch-handoff.rc
          cat /tmp/system4-batch-handoff.log
          exit "$rc"
      - name: Upload exact diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system4a-acceptance-diagnostic-${{ github.sha }}
          path: |
            /tmp/system4-batch-handoff.log
            /tmp/system4-batch-handoff.rc
          if-no-files-found: error
          retention-days: 1
      - name: Preserve failing status
        if: always()
        run: test "$(cat /tmp/system4-batch-handoff.rc)" -eq 0

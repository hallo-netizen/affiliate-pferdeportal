name: K0 probe registry metadata

on:
  push:
    branches: [konzept0-portal-neutral-20261002]
    paths:
      - '.github/workflows/k0-probe-registry-metadata.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve registry rows for current three
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:control/startmaster0107/runtime_packages/PORTAL_PRODUCTION_MACHINE_V6.7.9_SIGNED_ARTICLE_TYPE_EXTENSION_ROOTFIX_FINAL.zip > /tmp/ppm.zip
          rm -rf /tmp/ppm && mkdir -p /tmp/ppm
          unzip -q /tmp/ppm.zip -d /tmp/ppm
          cat >/tmp/probe.php <<'PHP'
          <?php
          $root=$argv[1];
          require $root.'/portal-production-machine/tests/normal-draft-production/fixture-builder.php';
          $want=array_flip([
            '759950a74a337da2c8d8ece5783df3b7d2e0a4a043ec83bccfff55d9b5c5db2d',
            '28ecc3ae064ab04c5e867125d889a696c03406e48ab67e10a44e0b47578f9c5c',
            '20720b5afc6b05f8467edf9e77640d9f4afeedbb2c2482331db3df5335f2a427'
          ]);
          foreach((array)(PPM679_Editorial_Plan_Registry::plan()['slots']??[]) as $s){
            if(!is_array($s))continue;
            $cid=(string)($s['canonical_article_id']??'');
            $slot=hash('sha256','pserc-plan-slot-v2|'.$cid);
            if(isset($want[$slot])) echo json_encode(['plan_slot'=>$slot,'row'=>$s],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
          }
          ?>
          PHP
          php /tmp/probe.php /tmp/ppm

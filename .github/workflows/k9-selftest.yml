name: K9 greenfield selftest
on:
  push:
    branches: [konzept9/greenfield-20260929]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          test ! -e concept_agent
          test ! -e control
          test ! -e isolated_system4
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Auto-chain orchestration wiring regression
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          receiver=Path(".github/workflows/text-start-pferdeatelier.yml").read_text()
          accept=Path(".github/workflows/k9-accept-submission.yml").read_text()
          writer=Path(".github/workflows/k9-write-submit.yml").read_text()
          finalizer=Path(".github/workflows/k9-finalize.yml").read_text()
          intake=Path(".github/workflows/k9-intake.yml").read_text()
          required_receiver=[
              "options: [station_only, auto_chain, inherit]",
              'k9_engine.py orchestration "$RUN_MODE"',
              "k9_engine.py auto-next",
              '"run_mode":"inherit"'
          ]
          missing=[x for x in required_receiver if x not in receiver]
          if missing:
              raise SystemExit("AUTO_CHAIN_RECEIVER_WIRING_MISSING:"+",".join(missing))
          if "'run_mode':'inherit'" not in accept:
              raise SystemExit("AUTO_CHAIN_ACCEPT_INHERIT_MISSING")
          if '"run_mode":"inherit"' not in writer:
              raise SystemExit("AUTO_CHAIN_WRITER_INHERIT_MISSING")
          if "runtime/AUTO_CHAIN.json" not in finalizer or "rm -f runtime/FINALIZE_REQUIRED runtime/FINALIZE_TRIGGER runtime/AUTO_CHAIN.json" not in finalizer:
              raise SystemExit("AUTO_CHAIN_TERMINAL_CLOSE_MISSING")
          intake_required=[
              "'inbox-auto/**.json'",
              "actions: write",
              "run_mode",
              "auto_chain",
              "text-start-pferdeatelier.yml/dispatches"
          ]
          missing=[x for x in intake_required if x not in intake]
          if missing:
              raise SystemExit("AUTO_CHAIN_INTAKE_START_MISSING:"+",".join(missing))
          print("AUTO_CHAIN_WIRING_PASS=1")
          PY
      - name: PPM 6.7.9 regression - claim article type binding
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, hashlib, json, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, str(Path("quality").resolve()))
          import k9_ppm679

          research=json.loads(Path("warehouse/research/K9-RESEARCH-beba25304f7d5eeb.json").read_text())
          article=json.loads(Path("warehouse/repair/K9-REPAIR-b8f6e63e319eb7c4.json").read_text())
          rp=research["results"][0]["research_product"]
          ap=article["results"][0]["article_product"]
          article_type=rp["fact_pack"]["article_type"]

          def check(pack):
              payload={
                  "contract":"K9_PPM679_INPUT_V1",
                  "generated":{
                      "article_type":ap["article_type"],
                      "title":ap["title"],
                      "content_html":ap["content_html"],
                      "content_hash":ap["content_sha256"]
                  },
                  "item":copy.deepcopy(ap["ppm_item"]),
                  "fact_pack":pack
              }
              with tempfile.TemporaryDirectory() as td:
                  p=Path(td)/"input.json"
                  p.write_text(json.dumps(payload,ensure_ascii=False),encoding="utf-8")
                  return k9_ppm679.run(Path("quality/PORTAL_PRODUCTION_MACHINE_V6.7.9.zip"),p)

          negative_pack=copy.deepcopy(rp["fact_pack"])
          for claim in negative_pack["claims"]:
              claim.pop("article_types",None)
          negative=check(negative_pack)
          negative_codes={e.get("error_code") for e in negative.get("errors",[]) if isinstance(e,dict)}
          if "BLOCKED_CONTENT_FACT_REF_TYPE_MISMATCH" not in negative_codes:
              raise SystemExit("NEGATIVE_DID_NOT_REPRODUCE_FACT_TYPE_MISMATCH")

          fixed=copy.deepcopy(rp["fact_pack"])
          for claim in fixed["claims"]:
              claim["article_types"]=[article_type]
          positive=check(fixed)
          positive_codes={e.get("error_code") for e in positive.get("errors",[]) if isinstance(e,dict)}
          if "BLOCKED_CONTENT_FACT_REF_TYPE_MISMATCH" in positive_codes:
              raise SystemExit("POSITIVE_STILL_HAS_FACT_TYPE_MISMATCH")

          print("NEGATIVE_REPRODUCED=1")
          print("POSITIVE_FACT_TYPE_BINDING_ACCEPTED=1")
          PY
      - name: PPM 6.7.9 regression - canonical table and source traces
        run: |
          set -euo pipefail
          if [ ! -f runtime/CURRENT_JOB.json ]; then
            echo 'NO_OPEN_RUNTIME_JOB_STRUCTURAL_REGRESSION_ALREADY_PROVEN'
            exit 0
          fi
          python3 - <<'PY'
          import copy, hashlib, json, re, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, str(Path("quality").resolve()))
          import k9_ppm679
          sys.path.insert(0, str(Path(".").resolve()))
          import k9_write_packager

          job_path=Path("runtime/CURRENT_JOB.json")
          if not job_path.exists():
              print("STRUCTURAL_ACTIVE_JOB_TEST_SKIPPED_FINAL_STATE=1")
              raise SystemExit(0)
          job=json.loads(job_path.read_text())
          row=job["items"][0]
          research=copy.deepcopy(row["input_products"]["research"]["research_product"])
          article=copy.deepcopy(row["input_products"]["article"]["article_product"])
          fact_pack=research["fact_pack"]
          for claim in fact_pack["claims"]:
              claim["evidence_text_sha256"]=hashlib.sha256(claim["statement"].encode("utf-8")).hexdigest()

          html=article["content_html"]
          html=html.replace('<table data-table="comparison"', '<table class="system-129-table comparison-table" data-table="comparison"', 1)
          claim_by_id={c["fact_id"]:c for c in fact_pack["claims"]}
          trace_ids=["FACT-CLIPPER-003","FACT-CLIPPER-004","FACT-CLIPPER-005","FACT-CLIPPER-006","FACT-CLIPPER-007"]
          for fid in trace_ids:
              c=claim_by_id[fid]
              opener=f'<p data-fact-ids="{fid}">'
              trace=(f'<span class="ppm-source-trace" data-fact-id="{fid}" '
                     f'data-source-hash="{c["evidence_text_sha256"]}" '
                     f'data-source-title="{c["source_id"]}"></span>')
              if opener not in html:
                  raise SystemExit("TRACE_TARGET_MISSING:"+fid)
              html=html.replace(opener, opener+trace, 1)

          with tempfile.TemporaryDirectory() as td:
              draft_path=Path(td)/"draft.json"
              draft_path.write_text(json.dumps({
                  "contract":"K9_WRITER_DRAFT_V1",
                  "job_id":job["job_id"],
                  "item_id":row["item_id"],
                  "title":row["title"],
                  "content_html":html
              },ensure_ascii=False),encoding="utf-8")
              packaged=k9_write_packager.build(draft_path)
              ap=packaged["results"][0]["article_product"]
              payload={
                  "contract":"K9_PPM679_INPUT_V1",
                  "generated":{
                      "article_type":ap["article_type"],
                      "title":ap["title"],
                      "content_html":ap["content_html"],
                      "content_hash":ap["content_sha256"]
                  },
                  "item":copy.deepcopy(ap["ppm_item"]),
                  "fact_pack":fact_pack
              }
              inp=Path(td)/"ppm.json"
              inp.write_text(json.dumps(payload,ensure_ascii=False),encoding="utf-8")
              result=k9_ppm679.run(Path("quality/PORTAL_PRODUCTION_MACHINE_V6.7.9.zip"),inp)

          codes={e.get("error_code") for e in result.get("errors",[]) if isinstance(e,dict)}
          forbidden={
              "BLOCKED_CONTENT_TABLE_COUNT",
              "BLOCKED_CONTENT_TABLE_ROW_FLOOR",
              "BLOCKED_CONTENT_SOURCE_TRACE_COUNT",
              "BLOCKED_CONTENT_TRACE_LEXICAL_SUPPORT"
          }
          remaining=sorted(codes & forbidden)
          if remaining:
              raise SystemExit("STRUCTURAL_CANDIDATE_STILL_BLOCKED:"+",".join(remaining))
          print("CANONICAL_TABLE_AND_SOURCE_TRACES_ACCEPTED=1")
          PY
      - name: PSERC scope regression negative and positive
        run: |
          set -euo pipefail
          mkdir -p /tmp/k9-lt68
          curl --fail --location --retry 3 https://github.com/jxmorris12/language_tool_python/releases/download/LanguageTool-6.8/LanguageTool-6.8.zip -o /tmp/k9-lt68/LanguageTool-6.8.zip
          echo '6a7f6b67b779ae9505f7579f0c41453ea8d1bd72ae750bdc2c55ba974281467d  /tmp/k9-lt68/LanguageTool-6.8.zip' | sha256sum -c -
          unzip -q /tmp/k9-lt68/LanguageTool-6.8.zip -d /tmp/k9-lt68
          python3 - <<'PY'
          import copy, hashlib, json, shutil, subprocess, tempfile
          from pathlib import Path

          root=Path(".").resolve()
          ledger=json.loads((root/"state/ledger.json").read_text())
          item=ledger["items"][0]
          research_path=root/item["products"]["research"]["path"]
          article_path=root/item["products"]["repair"]["path"]
          target_scope="schermaschinen_fuer_pferde"

          def prepare(dst, positive):
              shutil.copytree(root,dst,dirs_exist_ok=True)
              rp_path=dst/item["products"]["research"]["path"]
              ap_path=dst/item["products"]["repair"]["path"]
              rpkg=json.loads(rp_path.read_text())
              apkg=json.loads(ap_path.read_text())
              fp=rpkg["results"][0]["research_product"]["fact_pack"]
              if positive:
                  fp["title_scope"]=target_scope
                  apkg["results"][0]["article_product"]["ppm_item"]["runtime_order"]["subject_scope"]=target_scope
              else:
                  fp["title_scope"]="wrong_scope"
                  apkg["results"][0]["article_product"]["ppm_item"]["runtime_order"]["subject_scope"]=target_scope
              rp_path.write_text(json.dumps(rpkg,ensure_ascii=False,indent=2)+"\n")
              ap_path.write_text(json.dumps(apkg,ensure_ascii=False,indent=2)+"\n")

          with tempfile.TemporaryDirectory() as td:
              neg=Path(td)/"neg"; pos=Path(td)/"pos"
              prepare(neg,False); prepare(pos,True)
              cmd=lambda d,out:[
                  "python3","k9_pserc.py",str(d),
                  "quality/PORTAL_PRODUCTION_MACHINE_V6.7.9.zip",
                  "quality/PSERC-FIX.zip",
                  "/tmp/k9-lt68/LanguageTool-6.8/languagetool-commandline.jar",
                  "--output",str(out)
              ]
              nout=Path(td)/"neg.json"
              n=subprocess.run(cmd(neg,nout),text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              neg_text=n.stdout+(nout.read_text() if nout.exists() else "")
              if n.returncode==0 or "CANONICAL_FACT_PACK_SCOPE_MISMATCH" not in neg_text:
                  raise SystemExit("NEGATIVE_SCOPE_MISMATCH_NOT_REPRODUCED:"+neg_text[-1500:])
              pout=Path(td)/"pos.json"
              p=subprocess.run(cmd(pos,pout),text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              if p.returncode!=0:
                  raise SystemExit("POSITIVE_SCOPE_FIX_FAILED:"+p.stdout[-1200:])
              result=json.loads(pout.read_text())
              if result.get("status")!="PASS" or result.get("bridge_status")!="PSERC_PPM_INTAKE_BRIDGE_EXECUTED":
                  raise SystemExit("POSITIVE_SCOPE_FIX_NOT_PASS")
              print("PSERC_SCOPE_NEGATIVE_REPRODUCED=1")
              print("PSERC_SCOPE_POSITIVE_PASS=1")
          PY
      - name: Terminal truth and all fact traces
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          stop_path=Path("runtime/K9_STOP.json")
          if not stop_path.exists():
              print("TERMINAL_CHECK_NOT_APPLICABLE=1")
              raise SystemExit(0)
          current=json.loads(Path("CURRENT_STATE.json").read_text())
          stop=json.loads(stop_path.read_text())
          status=json.loads(Path("state/STATUS.json").read_text())
          if current.get("role")!="SOLE_CURRENT_AUTHORITY" or current.get("status")!="STOP":
              raise SystemExit("CURRENT_NOT_TERMINAL_AUTHORITY")
          if current.get("active_job") is not None:
              raise SystemExit("CURRENT_TERMINAL_ACTIVE_JOB_PRESENT")
          if current.get("first_open_blocker") is not None:
              raise SystemExit("CURRENT_TERMINAL_BLOCKER_PRESENT")
          if status.get("active_job") is not None or status.get("remaining")!=0 or status.get("fully_done")!=status.get("total"):
              raise SystemExit("TERMINAL_STATUS_NOT_DONE")
          ledger=json.loads(Path("state/ledger.json").read_text())
          item=ledger["items"][0]
          research=json.loads(Path(item["products"]["research"]["path"]).read_text())["results"][0]["research_product"]
          article_key="repair" if item.get("products",{}).get("repair") else "write"
          article=json.loads(Path(item["products"][article_key]["path"]).read_text())["results"][0]["article_product"]
          expected=set(research["fact_pack"]["fact_ids"])
          traced=set(re.findall(r'class=["\']ppm-source-trace["\'][^>]*data-fact-id=["\']([^"\']+)["\']',article["content_html"]))
          if not expected.issubset(traced):
              raise SystemExit("TERMINAL_FACT_TRACE_SET_INCOMPLETE:"+",".join(sorted(expected-traced)))
          if stop.get("status")!="STOP" or stop.get("final_ref")!="final/GEN1_7_ARTIKEL_PSERC_APPROVED_PRODUCTION_PACKAGE_107008_FINAL.json":
              raise SystemExit("TERMINAL_STOP_RECEIPT_INVALID")
          finalizer=Path(".github/workflows/k9-finalize.yml").read_text()
          required=["CURRENT_STATE.json","'status':'STOP'","'active_job':None","git add -A final runtime CURRENT_STATE.json"]
          missing=[x for x in required if x not in finalizer]
          if missing:
              raise SystemExit("FINALIZER_CURRENT_SYNC_MISSING:"+",".join(missing))
          print("TERMINAL_CURRENT_SYNC_PASS=1")
          print("TERMINAL_ALL_FACT_TRACES_PASS=1")
          PY
      - name: Validate actual open runtime job
        run: |
          set -euo pipefail
          python3 k9_engine.py status > /tmp/k9-live-status.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          job_path=Path("runtime/CURRENT_JOB.json")
          entry_path=Path("runtime/CHAT_ENTRY.json")
          if not job_path.exists():
              stop_path=Path("runtime/K9_STOP.json")
              if stop_path.exists():
                  current=json.loads(Path("CURRENT_STATE.json").read_text())
                  if current.get("status")!="STOP" or current.get("active_job") is not None:
                      raise SystemExit("TERMINAL_CURRENT_STATE_INVALID")
              raise SystemExit(0)
          if not entry_path.exists():
              raise SystemExit("LIVE_CHAT_ENTRY_MISSING")
          job=json.loads(job_path.read_text())
          entry=json.loads(entry_path.read_text())
          if entry.get("job_id") != job.get("job_id") or entry.get("job_sha256") != job.get("job_sha256"):
              raise SystemExit("LIVE_CHAT_ENTRY_JOB_MISMATCH")
          if entry.get("first_action") != "EXECUTE_BOUND_JOB_IMMEDIATELY":
              raise SystemExit("LIVE_FIRST_ACTION_NOT_EXECUTE")
          if entry.get("first_response_rule") != "NO_STATUS_REPORT_NO_DIAGNOSIS_NO_FIX_PROPOSAL_BEFORE_JOB_EXECUTION":
              raise SystemExit("LIVE_FIRST_RESPONSE_RULE_INVALID")
          if job.get("station") == "research":
              required=["sources","portal_links","decision_support","fact_pack","product_sha256"]
              if entry.get("required_output_fields") != required:
                  raise SystemExit("LIVE_RESEARCH_OUTPUT_FIELDS_INVALID")
              rows=job.get("items") or []
              if len(rows) != job.get("item_count") or not rows:
                  raise SystemExit("LIVE_RESEARCH_JOB_ITEMS_INVALID")
              for row in rows:
                  links=((row.get("input_products") or {}).get("portal_context") or {}).get("portal_links")
                  if not isinstance(links,list) or len(links)!=3:
                      raise SystemExit("LIVE_RESEARCH_PORTAL_CONTEXT_INVALID")
                  roles={x.get("role") for x in links if isinstance(x,dict)}
                  if roles != {"parent_category","semantic_related","further_information"}:
                      raise SystemExit("LIVE_RESEARCH_PORTAL_ROLES_INVALID")
          PY

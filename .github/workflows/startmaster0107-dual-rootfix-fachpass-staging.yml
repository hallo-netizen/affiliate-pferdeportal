name: TEMP STARTMASTER0107 Dual Rootfix Fachpass Staging

on:
  push:
    branches:
      - startmaster0107-dual-rootfix-fachpass-staging-20260902

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct only the permanent repair script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('control/startmaster0107/STARTMASTER0107_DUAL_ROOTFIX_REPAIR.py')
          s = p.read_text(encoding='utf-8')
          old = "b=binding_descriptor(repo);root=str(a['allowed_output_root']);pref=root+'FACHWORKFLOW_PASS.json'"
          new = "b=binding_descriptor(repo);root=str(a['allowed_output_root']);pref=root+'FACHWORKFLOW_PASS_'+str(it['plan_slot'])+'.json'"
          if s.count(old) != 1:
              raise SystemExit('FACH_PASS_REPAIR_SCRIPT_TARGET_NOT_EXACTLY_ONCE')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Execute the same permanent repair script and full positive-negative selftest
        run: python3 control/startmaster0107/STARTMASTER0107_DUAL_ROOTFIX_REPAIR.py apply-and-test

      - name: Ensure repaired script is repeatable
        run: python3 control/startmaster0107/STARTMASTER0107_DUAL_ROOTFIX_REPAIR.py apply-and-test

      - name: Remove temporary workflow from resulting fix
        run: rm -f .github/workflows/startmaster0107-dual-rootfix-fachpass-staging.yml

      - name: Commit only script-generated persistent fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'STARTMASTER0107: make Fachworkflow proof staging collision-safe'
          git push origin HEAD:startmaster0107-dual-rootfix-fachpass-staging-20260902

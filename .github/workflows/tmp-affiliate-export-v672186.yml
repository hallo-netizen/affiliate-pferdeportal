name: TEMP Export Affiliate 6.72.186

on:
  push:
    branches: [affiliate-release-current]
    paths:
      - '.github/workflows/tmp-affiliate-export-v672186.yml'

permissions:
  contents: read

jobs:
  export-tested-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact committed installer
        shell: bash
        run: |
          set -euo pipefail
          ZIP=release/affiliate-zentrale/artifacts/final/AFFILIATE_ZENTRALE_6.72.186.zip
          ACTUAL=$(sha256sum "$ZIP" | awk '{print $1}')
          test "$ACTUAL" = '1ca526ce92f339c678f2dc6e8775eae31355414668b8e06ed4afd561d5c15cae'
          rm -rf /tmp/export186
          mkdir -p /tmp/export186
          unzip -q "$ZIP" -d /tmp/export186
          grep -F 'Version: 6.72.186' /tmp/export186/affiliate-portal-router/pferdeportal-affiliate-router.php
          grep -F "const VERSION = '6.72.186';" /tmp/export186/affiliate-portal-router/pferdeportal-affiliate-router.php
          test "$(find /tmp/export186/affiliate-portal-router -type f | wc -l)" = "27"
          echo "PASS exact committed 6.72.186 installer sha256=$ACTUAL"

      - name: Upload exact tested installer
        uses: actions/upload-artifact@v4
        with:
          name: AFFILIATE_ZENTRALE_6.72.186_TESTED
          path: release/affiliate-zentrale/artifacts/final/AFFILIATE_ZENTRALE_6.72.186.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

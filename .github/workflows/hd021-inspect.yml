name: Hobby Depot 021 inspect exact current ZIPs
on:
  push:
    branches: ['hobbyroom/hd009-021-banner-hd007-hero-stage-20261107']
    paths: ['.github/workflows/hd021-inspect.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect HD007 hero markup and HD009 ad markup
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile,re,hashlib
          from pathlib import Path
          root=Path("protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS")
          for plugin in ("HD-007-HOBBYREGISTER-CORE","HD-009-AFFILIATE-ZENTRALE"):
              p=root/plugin/"CURRENT.zip"
              with zipfile.ZipFile(p) as z:
                  print("PACKAGE",plugin,len(z.namelist()),hashlib.sha256(p.read_bytes()).hexdigest(),"TESTZIP",z.testzip())
                  print("FILES",[(v.filename,v.file_size) for v in z.infolist() if v.filename.endswith((".php",".css",".js"))][:40])
                  for f in z.namelist():
                      if not f.endswith((".php",".css",".js")):continue
                      s=z.read(f).decode('utf-8','replace')
                      lines=s.splitlines()
                      if plugin.startswith("HD-007"):
                          matches=[i for i,x in enumerate(lines) if re.search(r"hero|register.?start|start.?seite|entdecke|hobby.?finden|hobby.?register.?index|hero.?title|hero.?subtitle",x,re.I)]
                          if not matches:continue
                          print("HD007_FILE",f,"lines",len(lines),"MATCHES",len(matches))
                          for i in matches[:16]:
                              print("MATCH",i+1," ".join(lines[max(0,i-2):min(len(lines),i+3)])[:500])
                      else:
                          if "hobby-depot-affiliate-router.php" in f:
                              for marker in ("private function hdar_ci_amazon_banner","public function hdar_ci_register_footer"):
                                  i=s.find(marker)
                                  if i>=0:print("HD009_METHOD",marker,"SRC",s[i:i+15000][:15000])
                          if "hdar-amazon-start.css" in f:
                              print("HD009_CSS_TAIL",s[-10000:])
          PY

      - name: Extract actual hero and ad structure
        shell: bash
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import re
          base=Path("protocol/PROJECT_MEMORY/PROJEKTE/HOBBYRAUSCH/PLUGINS/ISOLIERTE_PLUGINS")
          with ZipFile(base/"HD-007-HOBBYREGISTER-CORE"/"CURRENT.zip") as z:
              s=z.read("hd-hobbyregister-core/includes/class-hd-hobbyregister-frontend.php").decode()
              for m in ["private static function hero(","private static function styles(","public static function render_index"]:
                  i=s.find(m)
                  print("HD007_METHOD",m,repr(s[i:i+1800]))
              for selector in [".hdr-hero",".hdr-hero-copy",".hdr-hero h1",".hdr-hero-copy h1",".hdr-hero figure",".hdr-hero.is-profile",".hdr-brush-claim","@media(max-width:820px)","@media(max-width:540px)"]:
                  matches=[(m.start(),s[m.start():m.start()+550]) for m in re.finditer(re.escape(selector),s)]
                  print("HD007_SELECTOR",selector, len(matches),[v for i,v in matches[:4]])
          with ZipFile(base/"HD-009-AFFILIATE-ZENTRALE"/"CURRENT.zip") as z:
              s=z.read("affiliate-portal-router/hobby-depot-affiliate-router.php").decode()
              a=s.index("private function hdar_ci_amazon_banner(")
              b=s.index("public function hdar_ci_register_footer(",a)
              print("HD009_RENDER",s[a:b][-14000:])
          PY

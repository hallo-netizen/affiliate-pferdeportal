name: Affiliate 6.72.175 hub banner mount simulation

on:
  push:
    branches: [affiliate-release-current]
    paths:
      - '.github/workflows/affiliate-672175-hub-banner-mount-sim.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli

      - name: Install isolated WordPress
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-site
          mkdir -p /tmp/wp-site
          /tmp/wp core download --path=/tmp/wp-site --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title='Hub Banner Sim' --admin_user=admin --admin_password='ci-password-123!' --admin_email=ci@example.test --skip-email

          mkdir -p /tmp/wp-site/wp-content/mu-plugins
          cat >/tmp/wp-site/wp-content/mu-plugins/pferde-template-fixture.php <<'PHP'
          <?php
          class Pferde_Template_Kit {
              public static function affiliate_contract_version(){ return '1.0'; }
              public static function design_profile(){ return 'pferde_atelier'; }
              public static function design_profile_contract_version(){ return '1.0'; }
              public static function affiliate_page_type($id){
                  $p=get_post($id);
                  return ($p && $p->post_name==='schabracken') ? 'hub2' : 'page_unclassified';
              }
          }
          PHP

          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-site
          /tmp/wp eval 'if (Pferdeportal_Affiliate_Router::VERSION !== "6.72.175") { exit(2); } echo "VERSION_PASS\n";' --path=/tmp/wp-site

      - name: Seed valid active Schabrackendesigner hub banner
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/seed.php <<'PHP'
          <?php
          $o=Pferdeportal_Affiliate_Router::instance();
          $page=wp_insert_post([
              'post_type'=>'page','post_status'=>'publish','post_title'=>'Schabracken',
              'post_name'=>'schabracken','post_content'=>'<div class="pftk-hub2">ECHTES HUB2 DESIGN</div>'
          ]);
          if(!$page||is_wp_error($page)) throw new RuntimeException('page seed failed');
          update_option('ppar_test_page',$page,false);

          $blank=new ReflectionMethod($o,'central_blank_campaign'); $blank->setAccessible(true);
          $campaign=$blank->invoke($o);
          $campaign=array_merge($campaign,[
              'id'=>'schabrackendesigner-hub-banner',
              'name'=>'Schabrackendesigner Hub Banner',
              'partner'=>'Schabrackendesigner',
              'creative_type'=>'banner',
              'network'=>'manual',
              'render_mode'=>'image_link',
              'active'=>true,
              'assignment_mode'=>'exact_page',
              'page_id'=>$page,
              'match_descendants'=>false,
              'priority'=>999,
              'placements'=>['hub_after_cards'],
              'label'=>'Anzeige',
              'title'=>'Schabrackendesigner',
              'description'=>'Dieser lange Text darf bei einem Wide-Banner nicht im ausgelieferten Kartenmarkup erscheinen.',
              'button_text'=>'Mehr erfahren',
              'image_url'=>'https://www.example.com/schabrackendesigner-1200x150.jpg',
              'url'=>'https://www.example.com/schabracken',
              'target'=>'_blank',
              'dimensions'=>'1200x150',
              'source'=>'manual',
          ]);
          $save=new ReflectionMethod($o,'save_campaign_record'); $save->setAccessible(true);
          $campaignId=$save->invoke($o,$campaign,0);
          if(is_wp_error($campaignId)||absint($campaignId)<=0) throw new RuntimeException('campaign seed failed');
          update_option('ppar_test_campaign_id',absint($campaignId),false);

          $from=new ReflectionMethod($o,'campaign_from_post'); $from->setAccessible(true);
          $saved=$from->invoke($o,get_post($campaignId));
          $complete=new ReflectionMethod($o,'campaign_is_complete'); $complete->setAccessible(true);
          if(!$complete->invoke($o,$saved)) throw new RuntimeException('seed campaign incomplete '.wp_json_encode($saved));
          if(empty($saved['active'])) throw new RuntimeException('seed campaign inactive');
          if(!in_array('hub_after_cards',(array)$saved['placements'],true)) throw new RuntimeException('hub placement missing');
          echo "VALID_HUB_AFTER_CARDS_CAMPAIGN_PASS\n";
          PHP
          /tmp/wp eval-file /tmp/seed.php --path=/tmp/wp-site

      - name: NEGATIVE reproduce missing real hub mount
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/repro.php <<'PHP'
          <?php
          global $wp_query,$post;
          $o=Pferdeportal_Affiliate_Router::instance();
          $page=absint(get_option('ppar_test_page'));
          $post=get_post($page);
          $wp_query=new WP_Query(['page_id'=>$page,'post_type'=>'page']);
          $wp_query->the_post();

          $m=new ReflectionMethod($o,'auto_inject_template_affiliate_slots');
          $m->setAccessible(true);
          $input='<div class="pftk-hub2">ECHTES HUB2 DESIGN</div>';
          $actual=$m->invoke($o,$input);

          if(strpos($actual,'data-ppar-slot="hub_after_cards"')!==false){
              throw new RuntimeException('current source unexpectedly mounted hub_after_cards');
          }
          if(strpos($actual,'ECHTES HUB2 DESIGN')===false){
              throw new RuntimeException('design content damaged');
          }

          $grid=$o->provide_hub_grid_affiliate_data([], 'hub2', [
              'contract'=>Pferdeportal_Affiliate_Router::CONTRACT_VERSION,
              'object_id'=>$page,
              'placement_index'=>1,
              'placement_mode'=>'grid',
              'allow_placeholder'=>false,
          ]);
          if(!empty($grid['active'])){
              throw new RuntimeException('wide banner incorrectly leaked into hub_grid_card '.wp_json_encode($grid));
          }

          echo "CURRENT_MOUNT_GAP_REPRODUCED_PASS\n";
          PHP
          /tmp/wp eval-file /tmp/repro.php --path=/tmp/wp-site

      - name: POSITIVE simulate minimal server-side hub-after-cards mount
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/proposed.php <<'PHP'
          <?php
          global $wp_query,$post;
          $o=Pferdeportal_Affiliate_Router::instance();
          $page=absint(get_option('ppar_test_page'));
          $post=get_post($page);
          $wp_query=new WP_Query(['page_id'=>$page,'post_type'=>'page']);
          $wp_query->the_post();

          $render=new ReflectionMethod($o,'render_affiliate_slot');
          $render->setAccessible(true);
          $banner=$render->invoke($o,$page,'hub_after_cards','primary_product','');
          if(trim((string)$banner)==='') throw new RuntimeException('rendered hub banner empty');
          if(strpos($banner,'data-ppar-slot="hub_after_cards"')===false) throw new RuntimeException('slot marker missing');
          if(strpos($banner,'ppar-overview-wide-banner-link')===false) throw new RuntimeException('wide banner markup missing');
          if(strpos($banner,'ppar-banner-description')!==false) throw new RuntimeException('wide banner unexpectedly ships description text');
          if(strpos($banner,'Schabrackendesigner')!==false) throw new RuntimeException('wide banner unexpectedly ships title/description chrome');

          $input='<div class="pftk-hub2">ECHTES HUB2 DESIGN</div>';
          $proposed=$input;
          if(Pferde_Template_Kit::affiliate_page_type($page)==='hub2'
             && strpos($proposed,'data-ppar-slot="hub_after_cards"')===false
             && trim($banner)!==''){
              $proposed .= "\n".$banner;
          }

          if(substr_count($proposed,'data-ppar-slot="hub_after_cards"')!==1) throw new RuntimeException('mount count not exactly one');
          if(strpos($proposed,'ECHTES HUB2 DESIGN')===false) throw new RuntimeException('design content lost');
          echo "PROPOSED_SERVER_MOUNT_POSITIVE_PASS\n";
          PHP
          /tmp/wp eval-file /tmp/proposed.php --path=/tmp/wp-site

      - name: NEGATIVE duplicate and empty-slot guards
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/negative.php <<'PHP'
          <?php
          global $wpdb;
          $o=Pferdeportal_Affiliate_Router::instance();
          $page=absint(get_option('ppar_test_page'));

          $render=new ReflectionMethod($o,'render_affiliate_slot');
          $render->setAccessible(true);
          $banner=$render->invoke($o,$page,'hub_after_cards','primary_product','');
          $existing='<div>DESIGN</div>'.$banner;
          $proposed=$existing;
          if(Pferde_Template_Kit::affiliate_page_type($page)==='hub2'
             && strpos($proposed,'data-ppar-slot="hub_after_cards"')===false
             && trim($banner)!==''){
              $proposed .= "\n".$banner;
          }
          if(substr_count($proposed,'data-ppar-slot="hub_after_cards"')!==1) throw new RuntimeException('duplicate guard failed');

          $campaignId=absint(get_option('ppar_test_campaign_id'));
          if($campaignId>0) wp_delete_post($campaignId,true);

          $empty=$render->invoke($o,$page,'hub_after_cards','primary_product','');
          if(trim((string)$empty)!=='') throw new RuntimeException('empty slot fail-open');
          echo "NEGATIVE_DUPLICATE_EMPTY_GUARDS_PASS\n";
          PHP
          /tmp/wp eval-file /tmp/negative.php --path=/tmp/wp-site

      - name: Preserve performance hardlocks
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'category_product_shared_rank_base_request_cache' release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php >/dev/null
          grep -F 'select_category_product_campaign_fast_v672171' release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php >/dev/null
          grep -F 'automation_exact_target_rank_request_cache' release/affiliate-zentrale/current/affiliate-portal-router/includes/trait-ppar-automation-suite.php >/dev/null
          grep -F 'ebay_product_cohort_request_cache' release/affiliate-zentrale/current/affiliate-portal-router/includes/trait-ppar-ebay.php >/dev/null
          grep -F 'multiprovider_exact_gtin_pool_request_cache' release/affiliate-zentrale/current/affiliate-portal-router/includes/trait-ppar-idealo.php >/dev/null
          echo PERFORMANCE_HARDLOCKS_PASS

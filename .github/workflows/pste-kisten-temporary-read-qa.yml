name: PSTE Kisten temporary parkhaus source QA
on:
  push:
    branches: [fix/pste-kisten-einmalige-pruefung-20261107]
permissions:
  contents: read
jobs:
  pserc-source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify original existing plugin and PSERC read-only source integration
        shell: bash
        run: |
          set -euo pipefail
          ROOT=protocol/PROJECT_MEMORY/PROJEKTE/PFERDE_ATELIER/PLUGINS
          python3 "$ROOT/QA_ONLY/apply_existing_mini_kisten_import.py" /tmp/pste-kisten-qa
          php -l /tmp/pste-kisten-qa/class-pste-mini-workflow.php
          php "$ROOT/QA_ONLY/test_existing_mini_import.php" /tmp/pste-kisten-qa/class-pste-mini-workflow.php
          php "$ROOT/QA_ONLY/test_existing_pserc_plan.php" /tmp/pste-kisten-qa/class-pste-mini-workflow.php
          php "$ROOT/QA_ONLY/test_pste_kisten_transfer_v1.php"
          unzip -q /tmp/pste-kisten-qa/PSTE-KISTEN-GESAMT-QA-NICHT-INSTALLIEREN.zip -d /tmp/pste-kisten-final
          find "/tmp/pste-kisten-final/Portal SEO Topic Engine" -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/lint.txt
          echo "ALL_PHP_LINTS=$(wc -l </tmp/lint.txt)"
          echo "QA_ONLY_NO_INSTALLATION"

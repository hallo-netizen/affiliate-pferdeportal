name: PSTE TEMP real-export owner-contract acceptance selftests
on:
  push:
    branches: [fix/pste-kisten-einmalige-pruefung-20261107]
permissions: {contents: read}
jobs:
  one-time:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read-only real export and worker reply contract selftests, no WP/K0
        shell: bash
        run: |
          set -euo pipefail
          D=protocol/PROJECT_MEMORY/PROJEKTE/PFERDE_ATELIER/PLUGINS/QA_ONLY
          python3 -m py_compile "$D/test_single_existing_seo_worker_acceptance.py"
          python3 "$D/test_single_existing_seo_worker_acceptance.py" --selftest "$D/MINI_100_ORIGINAL_EXTERNAL_TITLES_20261106.json"
          python3 "$D/test_single_existing_seo_worker_acceptance.py" --io-selftest "$D/MINI_100_ORIGINAL_EXTERNAL_TITLES_20261106.json"
          echo "PSTE REAL ORIGINAL ABI inspection: class methods used by the new read-only export"
          P=protocol/PROJECT_MEMORY/PROJEKTE/PFERDE_ATELIER/PLUGINS/INSTALLATIONS_PAKETE/PSTE-0.57.144.22-NUR-TEST.zip
          unzip -p "$P" "Portal SEO Topic Engine/includes/class-pste-repository.php" > /tmp/original_repo.php
          unzip -p "$P" "Portal SEO Topic Engine/includes/class-pste-snapshot.php" > /tmp/original_snapshot.php
          php -r 'define("ABSPATH","/qa/"); require "/tmp/original_repo.php"; require "/tmp/original_snapshot.php"; foreach([["PSTE_Repository","table"],["PSTE_Repository","allCandidates"],["PSTE_Snapshot","editorialPlan"]] as [$class,$method]) { if(!method_exists($class,$method)) {fwrite(STDERR,"MISSING $class::$method\\n");exit(1);} $r=new ReflectionMethod($class,$method); if(!$r->isPublic()||!$r->isStatic()) {fwrite(STDERR,"NOT PUBLIC STATIC $class::$method\\n");exit(1);} echo "PASS REAL ORIGINAL METHOD $class::$method PUBLIC STATIC\\n"; }'
          echo "PASS ONE TIME OWNER QUALITY INSTRUMENT, NOT REAL OWNER"

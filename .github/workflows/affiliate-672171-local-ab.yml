name: Affiliate 6.72.171 Exact Local A-B

on:
  push:
    branches: [affiliate-release-current]
    paths:
      - '.github/workflows/affiliate-672171-local-ab.yml'
      - 'release/affiliate-zentrale/current/affiliate-portal-router/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-local-ab:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Prepare exact 6.72.170 baseline and 6.72.171 candidate
        shell: bash
        run: |
          set -euo pipefail
          find release/affiliate-zentrale/current/affiliate-portal-router -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/lint.log
          grep -F "Version: 6.72.171" release/affiliate-zentrale/current/affiliate-portal-router/pferdeportal-affiliate-router.php
          rm -rf /tmp/base170 /tmp/candidate171
          mkdir -p /tmp/base170 /tmp/candidate171
          git archive b487061b5bc6c7d5f1a548ade9f51fd8b65a59e7 release/affiliate-zentrale/current/affiliate-portal-router | tar -x -C /tmp/base170
          cp -a /tmp/base170/release/affiliate-zentrale/current/affiliate-portal-router /tmp/base170/plugin
          cp -a release/affiliate-zentrale/current/affiliate-portal-router /tmp/candidate171/plugin
          grep -F "Version: 6.72.170" /tmp/base170/plugin/pferdeportal-affiliate-router.php
          grep -F "Version: 6.72.171" /tmp/candidate171/plugin/pferdeportal-affiliate-router.php

      - name: Install WordPress 7.1.2 and MariaDB fixture
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          rm -rf /tmp/wp-site
          mkdir -p /tmp/wp-site
          /tmp/wp core download --path=/tmp/wp-site --version=7.1.2 --force
          /tmp/wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          /tmp/wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title='Affiliate 672171 AB' --admin_user=admin --admin_password='ci-password-123!' --admin_email=ci@example.test --skip-email
          cp -a /tmp/candidate171/plugin /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          /tmp/wp plugin activate affiliate-portal-router --path=/tmp/wp-site

          cat >/tmp/seed.php <<'PHP'
          <?php
          update_option('ppar_enabled','1',false);
          update_option('ppar_debug','0',false);
          update_option('ppar_disclosure','Werbelink: Bei Kauf erhalten wir ggf. eine Provision.',false);

          $root=wp_insert_post(['post_type'=>'page','post_status'=>'publish','post_title'=>'Ausrüstung Test','post_name'=>'ausruestung-test']);
          $page=wp_insert_post(['post_type'=>'page','post_status'=>'publish','post_title'=>'Sattel Test','post_name'=>'sattel-test','post_parent'=>$root]);
          if(!$root||!$page) throw new RuntimeException('page fixture failed');
          update_option('ppar_672171_ab_page',$page,false);
          update_option('ppar_672171_ab_root',$root,false);

          $make=static function($id,$args=[]) use($page,$root){
              $data=array_merge([
                  'active'=>1,'creative_type'=>'product','network'=>'manual','programme_status'=>'active',
                  'render_mode'=>'image_link','health_check_enabled'=>0,'assignment_mode'=>'page_tree',
                  'automation_target_keys'=>['page:sattel-test'],'placements'=>['category_product'],
                  'priority'=>50,'title'=>'Produkt '.$id,'description'=>'Produktbeschreibung '.$id,
                  'button_text'=>'Ansehen','image_url'=>'https://example.com/image-'.$id.'.jpg',
                  'url'=>'https://example.com/product-'.$id,'target'=>'_blank','source'=>'manual'
              ],$args);
              $data['id']=$id;
              $p=wp_insert_post(['post_type'=>Pferdeportal_Affiliate_Router::CAMPAIGN_POST_TYPE,'post_status'=>'publish','post_title'=>$id,'post_name'=>$id]);
              if(!$p) throw new RuntimeException('campaign insert '.$id);
              update_post_meta($p,'ppar_campaign_data',$data);
              return $p;
          };

          $make('ab-banner',[
              'creative_type'=>'banner','placements'=>['hub_after_cards'],'priority'=>5000,
              'dimensions'=>'1200x150','title'=>'Partnerbanner','description'=>'Partner',
              'image_url'=>'https://example.com/banner.jpg','url'=>'https://example.com/banner'
          ]);
          for($i=0;$i<720;$i++){
              $make(sprintf('generic-%04d',$i),['priority'=>100+($i%7)]);
          }
          for($slot=1;$slot<=3;$slot++){
              $make('slot-'.$slot,['placements'=>['category_product_'.$slot],'priority'=>10000+$slot,'title'=>'Slot '.$slot]);
          }
          $make('direct-page',['automation_target_keys'=>[],'page_id'=>$page,'match_descendants'=>0,'priority'=>9000]);
          $make('parent-descendant',['automation_target_keys'=>[],'page_id'=>$root,'match_descendants'=>1,'priority'=>8000]);
          $make('wrong-target',['automation_target_keys'=>['page:other-page'],'priority'=>99999]);
          $make('inactive-target',['active'=>0,'priority'=>99998]);
          $make('wrong-type',['creative_type'=>'banner','placements'=>['category_product'],'dimensions'=>'1200x150','priority'=>99997]);

          echo "SEED_PASS\n";
          PHP
          /tmp/wp eval-file /tmp/seed.php --path=/tmp/wp-site

      - name: Install frontend probe matching Hub-2 banner plus three product slots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wp-site/wp-content/mu-plugins
          cat >/tmp/wp-site/wp-content/mu-plugins/ppar-672171-ab.php <<'PHP'
          <?php
          add_action('template_redirect', static function(){
              if (!isset($_GET['ppar_ab']) || (string)$_GET['ppar_ab']!=='1') return;
              header('Content-Type: application/json; charset=utf-8');
              $page_id=absint(get_option('ppar_672171_ab_page',0));
              $post=get_post($page_id);
              $GLOBALS['post']=$post;
              setup_postdata($post);

              $o=Pferdeportal_Affiliate_Router::instance();
              $rm=static function($name) use($o){$m=new ReflectionMethod($o,$name);$m->setAccessible(true);return $m;};
              $context=$rm('get_content_context')->invoke($o,$page_id);

              $t0=hrtime(true);
              $html=[];
              foreach(['hub_after_cards','category_product_1','category_product_2','category_product_3'] as $slot){
                  $html[$slot]=$rm('render_affiliate_slot_for_context')->invoke($o,$page_id,$context,$slot,'portal_context','');
              }
              $elapsed=(hrtime(true)-$t0)/1e6;

              $selected=[];$ids=[];
              foreach(['hub_after_cards','category_product_1','category_product_2','category_product_3'] as $slot){
                  $sel=$rm('select_campaign_for_slot')->invoke($o,$context,$slot,'');
                  $selected[$slot]=(string)($sel['campaign']['id']??'');
                  $ranked=$rm('ranked_campaigns_for_slot')->invoke($o,$context,$slot,'');
                  $ids[$slot]=array_values(array_map(static fn($x)=>(string)($x['campaign']['id']??''),(array)$ranked));
              }
              $hashes=[];$lengths=[];
              foreach($html as $slot=>$value){$hashes[$slot]=hash('sha256',(string)$value);$lengths[$slot]=strlen((string)$value);}

              $base_builds=null;
              if(property_exists($o,'category_product_shared_rank_base_build_count')){
                  $rp=new ReflectionProperty($o,'category_product_shared_rank_base_build_count');$rp->setAccessible(true);$base_builds=(int)$rp->getValue($o);
              }

              $checks=[
                  'slot1_specific'=>$selected['category_product_1']==='slot-1',
                  'slot2_specific'=>$selected['category_product_2']==='slot-2',
                  'slot3_specific'=>$selected['category_product_3']==='slot-3',
                  'wrong_target_excluded'=>!in_array('wrong-target',$ids['category_product_1'],true)&&!in_array('wrong-target',$ids['category_product_2'],true)&&!in_array('wrong-target',$ids['category_product_3'],true),
                  'inactive_excluded'=>!in_array('inactive-target',$ids['category_product_1'],true)&&!in_array('inactive-target',$ids['category_product_2'],true)&&!in_array('inactive-target',$ids['category_product_3'],true),
                  'wrong_type_excluded'=>!in_array('wrong-type',$ids['category_product_1'],true)&&!in_array('wrong-type',$ids['category_product_2'],true)&&!in_array('wrong-type',$ids['category_product_3'],true),
                  'direct_binding_present'=>in_array('direct-page',$ids['category_product_1'],true),
                  'parent_descendant_present'=>in_array('parent-descendant',$ids['category_product_1'],true),
                  'banner_present'=>$selected['hub_after_cards']==='ab-banner' && strlen($html['hub_after_cards'])>0,
                  'products_present'=>strlen($html['category_product_1'])>0&&strlen($html['category_product_2'])>0&&strlen($html['category_product_3'])>0,
              ];

              echo wp_json_encode([
                  'version'=>Pferdeportal_Affiliate_Router::VERSION,
                  'elapsed_ms'=>round($elapsed,3),
                  'selected'=>$selected,
                  'html_hashes'=>$hashes,
                  'html_lengths'=>$lengths,
                  'checks'=>$checks,
                  'candidate_counts'=>array_map('count',$ids),
                  'shared_base_builds'=>$base_builds,
              ],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE);
              exit;
          },0);
          PHP

      - name: Run balanced exact A-B repeatedly
        shell: bash
        run: |
          set -euo pipefail
          PAGE_ID=$(/tmp/wp option get ppar_672171_ab_page --path=/tmp/wp-site)
          URL="http://127.0.0.1:8080/?page_id=$PAGE_ID&ppar_ab=1"

          run_round() {
            label="$1"; src="$2"; out="$3"
            rm -rf /tmp/wp-site/wp-content/plugins/affiliate-portal-router
            cp -a "$src" /tmp/wp-site/wp-content/plugins/affiliate-portal-router
            php -S 127.0.0.1:8080 -t /tmp/wp-site >/tmp/server-"$label".log 2>&1 &
            pid=$!
            for i in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then break; fi
              sleep 0.2
            done
            : > "$out"
            for i in $(seq 1 7); do
              curl -fsS "$URL" >> "$out"
              printf '\n' >> "$out"
            done
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }

          run_round baseA /tmp/base170/plugin /tmp/baseA.jsonl
          run_round candA /tmp/candidate171/plugin /tmp/candA.jsonl
          run_round candB /tmp/candidate171/plugin /tmp/candB.jsonl
          run_round baseB /tmp/base170/plugin /tmp/baseB.jsonl

          python3 - <<'PY'
          import json,statistics,pathlib
          def rows(p): return [json.loads(x) for x in pathlib.Path(p).read_text().splitlines() if x.strip()]
          base=rows('/tmp/baseA.jsonl')+rows('/tmp/baseB.jsonl')
          cand=rows('/tmp/candA.jsonl')+rows('/tmp/candB.jsonl')
          assert {r['version'] for r in base}=={'6.72.170'}, 'baseline version'
          assert {r['version'] for r in cand}=={'6.72.171'}, 'candidate version'
          keys=['selected','html_hashes','html_lengths','checks','candidate_counts']
          ref={k:base[0][k] for k in keys}
          for r in base+cand:
              cur={k:r[k] for k in keys}
              if cur!=ref:
                  print('REFERENCE',json.dumps(ref,sort_keys=True))
                  print('DIFF',json.dumps(cur,sort_keys=True))
                  raise SystemExit('FAIL exact functional equivalence')
              if not all(r['checks'].values()):
                  raise SystemExit('FAIL positive/negative checks '+json.dumps(r['checks'],sort_keys=True))

          def trim(p): return [float(r['elapsed_ms']) for r in rows(p)[1:]]
          b=trim('/tmp/baseA.jsonl')+trim('/tmp/baseB.jsonl')
          c=trim('/tmp/candA.jsonl')+trim('/tmp/candB.jsonl')
          bm=statistics.median(b); cm=statistics.median(c)
          gain=(bm-cm)/bm if bm else 0.0
          builds=[r['shared_base_builds'] for r in cand]
          if any(x!=1 for x in builds):
              raise SystemExit('FAIL shared base builds '+repr(builds))
          print('BASE_672170_MEDIAN_MS=%.3f'%bm)
          print('CAND_672171_MEDIAN_MS=%.3f'%cm)
          print('SPEEDUP_PERCENT=%.2f'%(gain*100))
          print('SELECTED='+json.dumps(ref['selected'],sort_keys=True))
          print('CANDIDATE_COUNTS='+json.dumps(ref['candidate_counts'],sort_keys=True))
          print('OUTPUT_HASHES='+json.dumps(ref['html_hashes'],sort_keys=True))
          print('SHARED_BASE_BUILDS='+repr(builds))
          if not (cm < bm and gain >= 0.20):
              raise SystemExit('FAIL measured speedup below 20%')
          print('EXACT_LOCAL_AB_POSITIVE_NEGATIVE_PERFORMANCE_PASS')
          PY

      - name: Prove frontend-only scope
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          cp -a /tmp/candidate171/plugin /tmp/wp-site/wp-content/plugins/affiliate-portal-router
          cat >/tmp/nonfrontend.php <<'PHP'
          <?php
          $o=Pferdeportal_Affiliate_Router::instance();
          $m=new ReflectionMethod($o,'ranked_campaigns_request_cache_allowed');$m->setAccessible(true);
          echo $m->invoke($o)?'CACHE_ALLOWED':'CACHE_BLOCKED';
          PHP
          OUT=$(/tmp/wp eval-file /tmp/nonfrontend.php --path=/tmp/wp-site)
          test "$OUT" = "CACHE_BLOCKED"
          echo "WPCLI_CACHE_BYPASS_PASS"

name: PSTE existing-source single-owner FINAL QA temporary
on:
  push:
    branches: [fix/pste-kisten-einmalige-pruefung-20261107]
permissions: {contents: read}
jobs:
  full-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build existing plugin methods and test 100 original keywords and saved PPM679 plan
        shell: bash
        run: |
          set -euo pipefail
          D=protocol/PROJECT_MEMORY/PROJEKTE/PFERDE_ATELIER/PLUGINS/QA_ONLY
          python3 "$D/apply_existing_mini_kisten_import.py" /tmp/pste-mini-qa
          python3 "$D/apply_wp_single_owner_gate.py" /tmp/pste-mini-qa/PSTE-KISTEN-GESAMT-QA-NICHT-INSTALLIEREN.zip /tmp/pste-combined-qa.zip
          unzip -q /tmp/pste-combined-qa.zip -d /tmp/pste-combined
          I="/tmp/pste-combined/Portal SEO Topic Engine/includes"
          php "$D/test_existing_mini_import.php" "$I/class-pste-mini-workflow.php"
          php "$D/test_existing_pserc_plan.php" "$I/class-pste-mini-workflow.php"
          php "$D/test_complete_parkhaus.php" "$I/class-pste-mini-workflow.php"
          php "$D/test_atomic_existing_mini_option.php" "$I/class-pste-mini-workflow.php"
          php "$D/test_pste_kisten_transfer_v1.php"
          php "$D/test_100_keyword_end_to_end_simulation.php" "$I/class-pste-mini-workflow.php" "$I/class-pste-planning-readiness-gate.php" "$D/MINI_100_ORIGINAL_EXTERNAL_TITLES_20261106.json" > /tmp/100result.txt
          tail -n 12 /tmp/100result.txt
          for mode in good stale onebad; do
            php "$D/test_existing_forward_full_chain.php" "$I/class-pste-mini-workflow.php" "$mode" > "/tmp/forward-$mode.txt"
          done
          python3 - <<'PY'
          import json
          def read(m):
            s=open('/tmp/forward-'+m+'.txt').read()
            i=s.find('FORWARD_QA_RESULT ')
            assert i>=0,s
            return json.loads(s[i+18:].splitlines()[0])
          g,s,b=map(read,['good','stale','onebad'])
          assert (g['forwarded'],g['scheduled'],g['save_keys'])==(1,1,['topic-good']),g
          assert (s['forwarded'],s['save_keys'])==(0,[]),s
          assert (b['forwarded'],b['save_keys'])==(1,['topic-good']),b
          assert 'topic-bad' in b['clarification'],b
          print('PASS 100 keyword and real existing forwardToPlan mock all 3 cases')
          PY
          find "/tmp/pste-combined/Portal SEO Topic Engine" -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/lints
          test "$(wc -l </tmp/lints)" = 83
          echo "PASS 83/83 PHP lint; no K0/PSERC original changed"
          echo "QA_ONLY_NOT_PRODUCTION_APPROVED"

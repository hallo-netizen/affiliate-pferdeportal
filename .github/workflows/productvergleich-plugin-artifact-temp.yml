name: Product Comparison Plugin Artifact TEMP

on:
  push:
    branches:
      - hobbyroom/productwissen-v1-prototype
    paths:
      - '.github/workflows/productvergleich-plugin-artifact-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-plugin-zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build clean plugin ZIPs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/upc-package
          mkdir -p /tmp/upc-package/universal-product-knowledge
          mkdir -p /tmp/upc-package/universal-product-comparison

          cp universal-product-knowledge/universal-product-knowledge.php /tmp/upc-package/universal-product-knowledge/
          cp -a universal-product-knowledge/src /tmp/upc-package/universal-product-knowledge/

          cp universal-product-comparison/universal-product-comparison.php /tmp/upc-package/universal-product-comparison/
          cp -a universal-product-comparison/src /tmp/upc-package/universal-product-comparison/
          cp -a universal-product-comparison/assets /tmp/upc-package/universal-product-comparison/
          cp -a universal-product-comparison/config /tmp/upc-package/universal-product-comparison/

          (
            cd /tmp/upc-package
            zip -qr "$GITHUB_WORKSPACE/universal-product-knowledge.zip" universal-product-knowledge
            zip -qr "$GITHUB_WORKSPACE/universal-product-comparison.zip" universal-product-comparison
          )

          test "$(unzip -Z1 universal-product-knowledge.zip | head -n1)" = "universal-product-knowledge/"
          test "$(unzip -Z1 universal-product-comparison.zip | head -n1)" = "universal-product-comparison/"
          ! unzip -Z1 universal-product-knowledge.zip | grep -E '/tests/|protocol/|\.git'
          ! unzip -Z1 universal-product-comparison.zip | grep -E '/tests/|protocol/|\.git|ZERO_FREEDOM'
          echo UPC_USER_DOWNLOAD_ZIPS_STRUCTURE_PASS

      - name: Upload plugin ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: produktvergleich-plugin-testpaket
          path: |
            universal-product-knowledge.zip
            universal-product-comparison.zip
          if-no-files-found: error
          retention-days: 7

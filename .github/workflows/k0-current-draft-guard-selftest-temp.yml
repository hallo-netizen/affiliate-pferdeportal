name: K0 current-draft guard repair selftest TEMP

on:
  push:
    branches: [fix/k0-current-draft-self-collision-20261004]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Targeted positive negative guard tests
        run: python3 -m unittest tests.test_k0_historical_content_guard -v
      - name: Full K0 Python regression suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

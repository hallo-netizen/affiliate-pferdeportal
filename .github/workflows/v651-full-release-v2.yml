name: V6.51 full safe checkpoint clean restart release gate v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  v651-release-v2:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'v651-safe-checkpoint-restart-20260822'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    services:
      mariadb:
        image: mariadb:11.4
        ports:
          - 3306:3306
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: v651gate
          MARIADB_USER: wp
          MARIADB_PASSWORD: wppass
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uwp -pwppass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout V6.51 branch
        uses: actions/checkout@v4

      - name: Set up PHP 8.4 with mysqli and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          tools: wp-cli
          coverage: none

      - name: Execute complete corrected V6.51 release gate from zero
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x .github/v651/runner/run-v651-full-release-wrapper-v4.sh
          .github/v651/runner/run-v651-full-release-wrapper-v4.sh

      - name: Upload final verified V6.51 release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V651_FINAL_VERIFIED_RELEASE
          path: |
            affiliate-zentrale_v6.51.0_SAFE_CHECKPOINT_RESTART_REALGATE.zip
            MASTER_AFFILIATE_ZENTRALE_V6_51_0_SAFE_CHECKPOINT_RESTART_REALGATE_20260822.zip
            V651_RELEASE_EVIDENCE/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Upload blocked V6.51 evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V651_BLOCKED_EVIDENCE_V2
          path: V651_RELEASE_EVIDENCE/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

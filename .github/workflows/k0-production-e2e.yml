name: K0 real chat production

on:
  push:
    branches: [konzept0-portal-neutral-20261002]
    paths:
      - 'real_runs/k0/**/SEALED_WRITER_PRODUCT.json'

permissions:
  contents: read

concurrency:
  group: k0-production-sealed-writer
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve exactly one sealed K0 writer product
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mapfile -t sealed < <(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- 'real_runs/k0/**/SEALED_WRITER_PRODUCT.json')
          if [ "${#sealed[@]}" -ne 1 ]; then
            echo "K0_REQUIRES_EXACTLY_ONE_SEALED_WRITER_PRODUCT:${#sealed[@]}" >&2
            exit 2
          fi
          product="${sealed[0]}"
          rd="${product%/SEALED_WRITER_PRODUCT.json}"
          [[ "$rd" =~ ^real_runs/k0/[A-Za-z0-9._-]+$ ]] || { echo "K0_RUN_DIR_INVALID:$rd" >&2; exit 2; }
          for f in WORDPRESS_INTAKE.json WRITER_JOB.json SEALED_WRITER_PRODUCT.json; do
            test -f "$rd/$f" || { echo "K0_JOB_FILE_MISSING:$f" >&2; exit 2; }
          done
          echo "RUN_DIR=$rd" >> "$GITHUB_ENV"

      - name: Verify sealed writer provenance before any quality gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m engine.k0_writer_station verify "$RUN_DIR/WRITER_JOB.json" "$RUN_DIR/SEALED_WRITER_PRODUCT.json"
          python3 - <<'PY'
          import json,os
          rd=os.environ['RUN_DIR']
          intake=json.load(open(rd+'/WORDPRESS_INTAKE.json'))
          job=json.load(open(rd+'/WRITER_JOB.json'))
          product=json.load(open(rd+'/SEALED_WRITER_PRODUCT.json'))
          assert intake.get('contract')=='PSERC_TEXTMACHINE_METADATA_BATCH_V2'
          assert intake.get('item_count')==1 and len(intake.get('items') or [])==1
          assert intake.get('publish_allowed') is False
          assert job.get('identity')==intake['items'][0]
          assert product.get('identity')==intake['items'][0]
          assert product.get('publish_allowed') is False
          assert (product.get('writer_provenance') or {}).get('route')=='K0_WRITER_DRAFT_ONLY'
          print('K0_SEALED_WRITER_ROUTE_PASS')
          PY

      - name: Automatic portal assignment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m engine.k0_portal_resolver "$RUN_DIR/WORDPRESS_INTAKE.json" K0_PORTAL_REGISTRY.json > /tmp/k0-portal.json
          python3 - <<'PY'
          import json,os
          x=json.load(open('/tmp/k0-portal.json'))
          job=json.load(open(os.environ['RUN_DIR']+'/WRITER_JOB.json'))
          assert x['status']=='PASS',x
          assert len(x['items'])==1 and x['items'][0]['status']=='AUTO_DETECTED',x
          assert x['items'][0]['portal_id']==job['portal_id'],(x,job)
          print('K0_PORTAL_AUTO_PASS')
          PY

      - name: K0 structure semantic and PPM 6.7.9 gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m engine.k0_production_gate "$RUN_DIR/SEALED_WRITER_PRODUCT.json" /tmp/k0-portal.json /tmp/k0-gates.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/k0-gates.json'))
          assert x['status']=='PASS',x
          assert x['structure_table']=='PASS',x
          assert x['semantic_intent_status']=='PASS',x
          assert x['anti_boilerplate_status']=='PASS',x
          assert x['writer_contract_status']=='PASS',x
          assert x['ppm679_status']=='PASS' and x['ppm679_rule_count']==104,x
          print('K0_GATES_PASS')
          PY

      - name: Download exact LanguageTool 6.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/k0-lt68
          curl --fail --location --retry 3 https://github.com/jxmorris12/language_tool_python/releases/download/LanguageTool-6.8/LanguageTool-6.8.zip -o /tmp/k0-lt68/LanguageTool-6.8.zip
          echo '6a7f6b67b779ae9505f7579f0c41453ea8d1bd72ae750bdc2c55ba974281467d  /tmp/k0-lt68/LanguageTool-6.8.zip' | sha256sum -c -
          unzip -q /tmp/k0-lt68/LanguageTool-6.8.zip -d /tmp/k0-lt68
          echo '2122882e800d312a0543d895c56c0a84a9bb131c9b9846efd8fc033129353ae8  /tmp/k0-lt68/LanguageTool-6.8/languagetool-commandline.jar' | sha256sum -c -

      - name: Real LanguageTool 6.8 gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m engine.lt68_external /tmp/k0-lt68/LanguageTool-6.8/languagetool-commandline.jar "$RUN_DIR/SEALED_WRITER_PRODUCT.json" /tmp/k0-lt68-result.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/k0-lt68-result.json'))
          assert x['status']=='PASS' and x['finding_count']==0,x
          print('K0_LT68_PASS')
          PY

      - name: Resolve canonical article id from exact PPM registry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/k0-binding
          curl --fail --location --retry 3 --silent --show-error             "https://raw.githubusercontent.com/hallo-netizen/affiliate-pferdeportal/main/control/startmaster0107/runtime_packages/PORTAL_PRODUCTION_MACHINE_V6.7.9_SIGNED_ARTICLE_TYPE_EXTENSION_ROOTFIX_FINAL.zip"             -o /tmp/k0-binding/ppm679.zip
          curl --fail --location --retry 3 --silent --show-error             "https://raw.githubusercontent.com/hallo-netizen/affiliate-pferdeportal/main/control/startmaster0107/runtime_packages/PSERC-FIX.zip"             -o /tmp/k0-binding/pserc-fix.zip
          echo 'acbda93bd1c4292de7aaf88db2195631103991ff508b36c88cb694714818abd1  /tmp/k0-binding/ppm679.zip' | sha256sum -c -
          echo '77a14aca97f46d60bc9001d66327abb68dd9cac9ad111f8ecefa1a8afd345314  /tmp/k0-binding/pserc-fix.zip' | sha256sum -c -
          python3 -m engine.canonical_binding "$RUN_DIR/WORDPRESS_INTAKE.json" /tmp/k0-binding/ppm679.zip /tmp/k0-binding/pserc-fix.zip /tmp/k0-binding/CANONICAL_BINDINGS.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/k0-binding/CANONICAL_BINDINGS.json'))
          assert x['status']=='PASS' and len(x['bindings'])==1,x
          print('K0_CANONICAL_ARTICLE_ID_PASS')
          PY

      - name: Build and reverify WordPress 0.28.30 direct import
        shell: bash
        run: |
          set -euo pipefail
          batch="$(python3 - <<'PY'
          import json,os
          print(json.load(open(os.environ['RUN_DIR']+'/WORDPRESS_INTAKE.json'))['batch_sha256'])
          PY
          )"
          mkdir -p /tmp/k0-final
          out="/tmp/k0-final/K0_WORDPRESS_DIRECT_IMPORT_${batch}.json"
          python3 -m engine.k0_wordpress_export export "$RUN_DIR/WORDPRESS_INTAKE.json" "$RUN_DIR/SEALED_WRITER_PRODUCT.json" /tmp/k0-portal.json /tmp/k0-gates.json /tmp/k0-lt68-result.json /tmp/k0-binding/CANONICAL_BINDINGS.json "$out"
          python3 -m engine.k0_wordpress_export verify "$out" "$RUN_DIR/WORDPRESS_INTAKE.json" /tmp/k0-final/K0_WORDPRESS_VERIFY.json
          sha256sum "$out" | awk '{print $1}' > /tmp/k0-final/K0_WORDPRESS_SHA256.txt
          echo "K0_FINAL_FILE=$out" >> "$GITHUB_ENV"

      - name: Final importer-shape proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re
          p=os.environ['K0_FINAL_FILE']
          doc=json.load(open(p))
          assert doc['contract']=='SYSTEM4_WORDPRESS_HANDOFF_V1'
          assert doc['wordpress_review']['plugin_version_verified_against']=='0.28.30'
          assert doc['wordpress_review']['plugin_build_verified_against']=='0.28.30-pste-v5-binding-safe'
          assert doc['wordpress_review']['direct_wordpress_upload_ready'] is True
          assert doc['article_count']==1
          a=doc['articles'][0]
          assert re.fullmatch(r'article:[0-9a-f]{24}',a['article_id'])
          assert hashlib.sha256(('pserc-plan-slot-v2|'+a['article_id']).encode()).hexdigest()==a['plan_slot']
          print('K0_WORDPRESS_02830_ARTICLE_ID_SHAPE_PASS')
          PY

      - name: Final delivery receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['K0_FINAL_FILE'])
          raw=p.read_bytes(); doc=json.loads(raw)
          rec={
            'contract':'K0_CHAT_DELIVERY_V1',
            'status':'READY_FOR_CHAT_DELIVERY',
            'filename':p.name,
            'sha256':hashlib.sha256(raw).hexdigest(),
            'wordpress_contract':doc['contract'],
            'article_count':doc['article_count'],
            'direct_wordpress_upload_ready':doc['wordpress_review']['direct_wordpress_upload_ready'],
            'plugin_version':doc['wordpress_review']['plugin_version_verified_against'],
            'plugin_build':doc['wordpress_review']['plugin_build_verified_against'],
            'ppm_version':doc['wordpress_review']['ppm_version_verified_against'],
            'writer_route':'K0_WRITER_DRAFT_ONLY',
            'publish_allowed':False,
          }
          pathlib.Path('/tmp/k0-final/K0_CHAT_DELIVERY.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2)+'\n')
          print('K0_CHAT_DELIVERY_READY')
          PY

      - name: Upload final Chat delivery
        uses: actions/upload-artifact@v4
        with:
          name: k0-chat-delivery-${{ github.run_id }}
          path: |
            /tmp/k0-final/K0_WORDPRESS_DIRECT_IMPORT_*.json
            /tmp/k0-final/K0_WORDPRESS_VERIFY.json
            /tmp/k0-final/K0_WORDPRESS_SHA256.txt
            /tmp/k0-final/K0_CHAT_DELIVERY.json
            /tmp/k0-binding/CANONICAL_BINDINGS.json
            /tmp/k0-portal.json
            /tmp/k0-gates.json
            /tmp/k0-lt68-result.json
          if-no-files-found: error
          retention-days: 30

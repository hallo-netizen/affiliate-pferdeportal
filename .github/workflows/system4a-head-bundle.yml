name: System 4A Exact Head Bundle

on:
  push:
    branches:
      - 'hobbyroom/system4*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact head bundle
        run: git bundle create system4a-head.bundle HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: system4a-head-${{ github.sha }}
          path: system4a-head.bundle
          if-no-files-found: error
          retention-days: 1

name: System4A M38 history final probe
on:
  push:
    branches:
      - 'hobbyroom/m38-history-proof-main-20260918'
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run M01-M38 history runner
        shell: bash
        run: |
          set +e
          python3 control/startmaster0107/HOBBYRAUM_M01_M33_REGRESSION.py | tee /tmp/history.txt
          rc=${PIPESTATUS[0]}
          echo "RUNNER_RC=$rc"
          exit 0

name: K9 package write draft
on:
  push:
    branches: [konzept9/greenfield-20260929]
    paths: ['writer_drafts/**.json']
permissions:
  contents: write
  actions: write
concurrency:
  group: k9-production-state
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Package and atomically accept exact open write job
        id: package
        shell: bash
        run: |
          set -euo pipefail
          count=$(find writer_drafts -maxdepth 1 -type f -name '*.json' | wc -l)
          if [ "$count" -eq 0 ]; then echo 'No writer draft.'; exit 0; fi
          test "$count" -eq 1
          test -f runtime/CURRENT_JOB.json
          read -r job_id item_count < <(python3 - <<'PY'
          import json
          j=json.load(open('runtime/CURRENT_JOB.json'))
          print(j['job_id'], j['item_count'])
          PY
          )
          echo "item_count=$item_count" >> "$GITHUB_OUTPUT"
          draft="writer_drafts/${job_id}.json"
          test -f "$draft"
          mkdir -p /tmp/k9-lt68
          if [ ! -f /tmp/k9-lt68/LanguageTool-6.8/languagetool-commandline.jar ]; then
            curl --fail --location --retry 3 \
              https://github.com/jxmorris12/language_tool_python/releases/download/LanguageTool-6.8/LanguageTool-6.8.zip \
              -o /tmp/k9-lt68/LanguageTool-6.8.zip
            echo '6a7f6b67b779ae9505f7579f0c41453ea8d1bd72ae750bdc2c55ba974281467d  /tmp/k9-lt68/LanguageTool-6.8.zip' | sha256sum -c -
            unzip -q /tmp/k9-lt68/LanguageTool-6.8.zip -d /tmp/k9-lt68
          fi
          echo '2122882e800d312a0543d895c56c0a84a9bb131c9b9846efd8fc033129353ae8  /tmp/k9-lt68/LanguageTool-6.8/languagetool-commandline.jar' | sha256sum -c -
          out="/tmp/${job_id}.submission.json"
          python3 k9_write_packager.py "$draft" \
            --lt-jar /tmp/k9-lt68/LanguageTool-6.8/languagetool-commandline.jar \
            --output "$out"
          python3 k9_engine.py accept "$out" | tee K9_WRITE_ACCEPT_RESULT.json
          test ! -f runtime/CURRENT_JOB.json
          test ! -f runtime/CHAT_ENTRY.json
          git rm "$draft"
          git config user.name 'k9-write-packager-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A state runtime warehouse CURRENT_STATE.json
          git commit -m 'K9: package and accept exact sealed write product'
          git push
      - name: Automatically start native check after write or repair
        env:
          GH_TOKEN: ${{ github.token }}
          ITEM_COUNT: ${{ steps.package.outputs.item_count }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ITEM_COUNT"
          body="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'ref':'konzept9/greenfield-20260929','inputs':{'station':'check','batch_size':os.environ['ITEM_COUNT'],'run_mode':'inherit'}},separators=(',',':')))
          PY
          )"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hallo-netizen/affiliate-pferdeportal/actions/workflows/text-start-pferdeatelier.yml/dispatches \
            -d "$body"
          echo 'K9_AUTO_NEXT_DISPATCHED:check'

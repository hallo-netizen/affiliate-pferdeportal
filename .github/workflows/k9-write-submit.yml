name: K9 package write draft
on:
  push:
    branches: [konzept9/greenfield-20260929]
    paths: ['writer_drafts/**.json']
permissions:
  contents: write
  actions: write
concurrency:
  group: k9-production-state
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Package and atomically accept exact open write job
        id: package
        shell: bash
        run: |
          set -euo pipefail
          count=$(find writer_drafts -maxdepth 1 -type f -name '*.json' | wc -l)
          if [ "$count" -eq 0 ]; then echo 'No writer draft.'; exit 0; fi
          test "$count" -eq 1
          test -f runtime/CURRENT_JOB.json
          read -r job_id item_count < <(python3 - <<'PY'
          import json
          j=json.load(open('runtime/CURRENT_JOB.json'))
          print(j['job_id'], j['item_count'])
          PY
          )
          echo "item_count=$item_count" >> "$GITHUB_OUTPUT"
          draft="writer_drafts/${job_id}.json"
          test -f "$draft"
          mkdir -p /tmp/k9-lt68
          if [ ! -f /tmp/k9-lt68/LanguageTool-6.8/languagetool-commandline.jar ]; then
            curl --fail --location --retry 3 \
              https://github.com/jxmorris12/language_tool_python/releases/download/LanguageTool-6.8/LanguageTool-6.8.zip \
              -o /tmp/k9-lt68/LanguageTool-6.8.zip
            echo '6a7f6b67b779ae9505f7579f0c41453ea8d1bd72ae750bdc2c55ba974281467d  /tmp/k9-lt68/LanguageTool-6.8.zip' | sha256sum -c -
            unzip -q /tmp/k9-lt68/LanguageTool-6.8.zip -d /tmp/k9-lt68
          fi
          echo '2122882e800d312a0543d895c56c0a84a9bb131c9b9846efd8fc033129353ae8  /tmp/k9-lt68/LanguageTool-6.8/languagetool-commandline.jar' | sha256sum -c -
          out="/tmp/${job_id}.submission.json"
          set +e
          python3 k9_write_packager.py "$draft" \
            --lt-jar /tmp/k9-lt68/LanguageTool-6.8/languagetool-commandline.jar \
            --output "$out" \
            2> /tmp/K9_WRITER_PREFLIGHT_ERROR.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            JOB_ID="$job_id" python3 - <<'PY'
          import json,os,pathlib
          raw=pathlib.Path('/tmp/K9_WRITER_PREFLIGHT_ERROR.json').read_text(encoding='utf-8').strip()
          try:
              err=json.loads(raw)
          except Exception:
              err={'contract':'K9_WRITE_PACKAGER_V1','status':'BLOCKED','reason':raw or 'WRITER_PREFLIGHT_FAILED'}
          job=json.load(open('runtime/CURRENT_JOB.json'))
          findings={
              'contract':'K9_WRITER_PREFLIGHT_FINDINGS_V1',
              'status':'REPAIR_REQUIRED',
              'job_id':os.environ['JOB_ID'],
              'station':job.get('station'),
              'item_ids':job.get('item_ids'),
              'all_independent_findings_collected':True,
              'packager_error':err,
              'repair_rule':'REPAIR_ALL_REPORTED_FINDINGS_IN_ONE_DRAFT_UPDATE',
              'publish_allowed':False
          }
          pathlib.Path('runtime/WRITER_PREFLIGHT_FINDINGS.json').write_text(json.dumps(findings,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          current={
              'contract':'K9_CURRENT_STATE_V3',
              'role':'SOLE_CURRENT_AUTHORITY',
              'concept':'K9',
              'branch':'konzept9/greenfield-20260929',
              'status':'OPEN_CHAT_WORKER_JOB',
              'operational_mode':'EXECUTE_RUNTIME_CHAT_ENTRY_ONLY',
              'active_job':{
                  'job_id':job.get('job_id'),
                  'station':job.get('station'),
                  'article_title':(job.get('items') or [{}])[0].get('title'),
                  'item_id':(job.get('items') or [{}])[0].get('item_id'),
                  'runtime_entry':'runtime/CHAT_ENTRY.json',
                  'job_path':'runtime/CURRENT_JOB.json'
              },
              'first_open_blocker':{
                  'code':'WRITER_PREFLIGHT_REPAIR_REQUIRED',
                  'findings_ref':'runtime/WRITER_PREFLIGHT_FINDINGS.json'
              },
              'next_action':'REPAIR_ALL_WRITER_PREFLIGHT_FINDINGS_IN_ONE_DRAFT_UPDATE',
              'allowed_action':'EXECUTE_RUNTIME_CHAT_ENTRY_ONLY',
              'route_lock':'EXACT_RUNTIME_CHAT_ENTRY_ONLY',
              'supervisor_actions_allowed':False,
              'code_change_allowed':False,
              'all_other_actions':'DENY',
              'chat_may_route':False,
              'publish_allowed':False
          }
          pathlib.Path('CURRENT_STATE.json').write_text(json.dumps(current,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            git config user.name 'k9-write-packager-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add runtime/WRITER_PREFLIGHT_FINDINGS.json CURRENT_STATE.json
            git diff --cached --quiet || git commit -m 'K9: persist complete writer preflight findings'
            git push
            cat /tmp/K9_WRITER_PREFLIGHT_ERROR.json >&2
            exit "$rc"
          fi
          rm -f runtime/WRITER_PREFLIGHT_FINDINGS.json
          python3 k9_engine.py accept "$out" | tee K9_WRITE_ACCEPT_RESULT.json
          test ! -f runtime/CURRENT_JOB.json
          test ! -f runtime/CHAT_ENTRY.json
          git rm "$draft"
          git config user.name 'k9-write-packager-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A state runtime warehouse CURRENT_STATE.json
          git commit -m 'K9: package and accept exact sealed write product'
          git push
      - name: Automatically start native check after write or repair
        env:
          GH_TOKEN: ${{ github.token }}
          ITEM_COUNT: ${{ steps.package.outputs.item_count }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ITEM_COUNT"
          body="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'ref':'konzept9/greenfield-20260929','inputs':{'station':'check','batch_size':os.environ['ITEM_COUNT'],'run_mode':'inherit'}},separators=(',',':')))
          PY
          )"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hallo-netizen/affiliate-pferdeportal/actions/workflows/text-start-pferdeatelier.yml/dispatches \
            -d "$body"
          echo 'K9_AUTO_NEXT_DISPATCHED:check'
